<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Wortando a déménagé</title>
<script>
// Wortando a demenage : l'ancienne adresse GitHub Pages renvoie vers la meme
// page a la nouvelle, en gardant le chemin, la requete et le fragment :
//   /Deutsch-gemini/espanol/?x            -> /espanol/?x
//   /Deutsch-gemini/confidentialite.html  -> /confidentialite.html
//   /Deutsch-gemini/?mode=resetPassword&oobCode=...  -> /?mode=...
// Ce fichier et 404.html sont IDENTIQUES : GitHub Pages sert 404.html pour
// toute adresse absente du depot, en gardant l'adresse demandee.
(function(){
    var CIBLE = "https://deutsch-gemini.pages.dev/";
    try{
        // On retire le premier dossier, celui du depot, quelle que soit sa casse.
        var reste = location.pathname.replace(/^\/deutsch-gemini(\/|$)/i, "/").replace(/^\/+/, "");
        var url = new URL(reste + location.search + location.hash, CIBLE).href;
        // Jamais de boucle : on ne redirige que depuis un autre hote.
        if(new URL(url).hostname === location.hostname) return;
        location.replace(url);
    }catch(e){
        location.replace(CIBLE);
    }
})();
</script>
<!-- Sans JavaScript : l'accueil de la nouvelle adresse (une balise ne sait pas
     recopier le chemin). Dans <noscript>, sinon elle partirait avant le script. -->
<noscript><meta http-equiv="refresh" content="0; url=https://deutsch-gemini.pages.dev/"></noscript>
<link rel="canonical" href="https://deutsch-gemini.pages.dev/">
<style>
body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#F7F3EC; color:#1C2430; font:17px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align:center; padding:24px; box-sizing:border-box; }
a{ color:#1C2430; font-weight:600; }
</style>
</head>
<body>
<p>Wortando a déménagé.<br>
<a id="lien" href="https://deutsch-gemini.pages.dev/">Continuer vers la nouvelle adresse</a></p>
<script>
// Le lien visible suit la meme adresse que la redirection (le premier script
// tourne avant que le lien existe).
(function(){
    try{
        var reste = location.pathname.replace(/^\/deutsch-gemini(\/|$)/i, "/").replace(/^\/+/, "");
        document.getElementById("lien").href =
            new URL(reste + location.search + location.hash, "https://deutsch-gemini.pages.dev/").href;
    }catch(e){}
})();
</script>
</body>
</html>
