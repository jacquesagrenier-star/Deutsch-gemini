<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le logement</title>
<!--
  « LE LOGEMENT » (theme illustre, 4 nov. 2026, vague 3) : les PIECES, les MEUBLES et la RECHERCHE D'UN APPARTEMENT,
  en allemand et en espagnol. Trois logements connus (la colocation de Mark, l'appartement d'Anna, celui de Jan et
  Katrin), leurs pieces en photo (reprises des scenes, de « La journee » et de « Ou est le chat ? ») et leurs plans,
  dessines ici ; puis l'appartement que visite Lena, la soeur d'Anna, et les annonces (DTZ, Lesen : KM, NK, Kaution,
  « welche Anzeige passt ? »). Toute la donnee vient de visuel/logement/logement.py -> logement/logement.json : aucune
  phrase n'est ecrite ici. Ouverte par l'app dans le cadre des scenes (sceneCadre), elle parle comme une scene :
  « exercice » et « bonne » a chaque reponse, « reponse » {mot, genre, cat, sens, juste} pour le mot teste, « fini » et
  « fermer ». Parametres : apprendre=es|de, lang=<interface>, nuit=1, seance=1 (six questions, pas de decouverte),
  variante=latam (la voix), r=<AUDIO_REVISION>. Le tirage suit les mots (themes/tirage.js).
  L'ANGLAIS (apprendre=en, essai admin, 4 nov. 2026) : les memes photos et les memes plans, des phrases ECRITES POUR
  L'ANGLAIS, fabriquees dans la page (construireAnglais) depuis la meme donnee : there is / there are, les prepositions
  de lieu, How many bedrooms does it have?, Does / Is / Has en tete de question, la visite au present continu, une
  annonce de Boston ($ a month, utilities, security deposit, 2BR/1BA, sq ft). variante=gb : Londres (£ pcm, bills,
  deposit, flat, m²), have got, lift, wardrobe, cooker, bath, ground floor.
-->
<style>
:root{--fond1:#82AFDB;--fond3:#C0D6EA;--encre:#1C2430;--gris:#4C566B;--ambre:#E8A23A;--ambre-f:#A86A0E;--vert:#2F9E6A;--rouge:#C8473A;
  --verre:rgba(255,255,255,.88);--bord:rgba(255,255,255,.95);--carte:#F7F8FA;--papier:#FFFDF6;--trait:#5B6475;--piece:#FFFFFF;--marque:#FBE3B6;
  --police:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html.nuit{--fond1:#0E1C26;--fond3:#18303F;--encre:#EEF2F5;--gris:#A9B8C4;--ambre-f:#E8A23A;--vert:#5CC98F;--rouge:#F07F72;
  --verre:rgba(20,36,50,.88);--bord:rgba(255,255,255,.14);--carte:#22384A;--papier:#1D2F3D;--trait:#A9B8C4;--piece:#2A4152;--marque:#6B5320}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
/* LA PAGE A LA HAUTEUR DE L'ECRAN, COMME UNE SCENE (regle commune des themes, 3 nov. 2026) */
html{height:100%;overflow:hidden}
body{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;box-sizing:border-box}
body{background:linear-gradient(180deg,var(--fond1),var(--fond3));background-attachment:fixed;color:var(--encre);font-family:var(--police);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 90px) max(10px,env(safe-area-inset-left,0px))}
.haut{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto 10px}
.retour{width:42px;height:42px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);color:var(--encre);font:800 22px var(--police);cursor:pointer;flex:0 0 auto}
html[dir="rtl"] .retour{transform:scaleX(-1)}
.titre{flex:1;font-weight:900;font-size:18px}
.compte{font-weight:800;font-size:14px;color:var(--gris)}
.barre{max-width:560px;margin:0 auto 12px;height:6px;border-radius:3px;background:rgba(28,36,48,.12);overflow:hidden}
.barre i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2BB5AA,#14807A);transition:width .3s}
main{max-width:560px;margin:0 auto;background:var(--verre);border:1px solid var(--bord);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}
.consigne{font-size:14px;font-weight:700;color:var(--gris);margin:0}
.enonce{direction:ltr;text-align:left;background:var(--carte);border-radius:14px;padding:12px 14px;font-weight:800;line-height:1.5;font-size:17px}
.enonce.centre{text-align:center;font-size:19px}
.trou{display:inline-block;min-width:56px;border-bottom:2px solid var(--ambre);text-align:center;color:var(--ambre-f)}
.cadre{position:relative;width:100%;margin:0 auto;border-radius:16px;overflow:hidden;background:var(--carte);aspect-ratio:4/3}
.cadre img{display:block;width:100%;height:100%;object-fit:cover}
.rangee{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;direction:ltr}
.rangee button{border:3px solid transparent;border-radius:14px;background:var(--carte);padding:0;cursor:pointer;overflow:hidden;display:block;position:relative;aspect-ratio:4/3}
.rangee button img{display:block;width:100%;height:100%;object-fit:cover}
.rangee button.juste{border-color:var(--vert)} .rangee button.faux{border-color:var(--rouge)}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix.centre{justify-content:center}
.choix button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:9px 15px;font:800 15px var(--police);cursor:pointer}
.choix.long{flex-direction:column} .choix.long button{border-radius:14px;text-align:left;font-weight:700;line-height:1.4}
.choix button.juste{background:var(--vert);border-color:var(--vert);color:#fff}
.choix button.faux{background:var(--rouge);border-color:var(--rouge);color:#fff}
button:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
button:disabled{cursor:default}
.ecoute{width:48px;height:48px;border-radius:50%;border:2px solid var(--ambre);background:var(--verre);color:var(--encre);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ecoute svg{width:24px;height:24px}
.ecoute.grand{width:64px;height:64px;margin:0 auto} .ecoute.grand svg{width:32px;height:32px}
.retourMsg{min-height:1.4em;font-weight:800;font-size:15px;margin:0;line-height:1.45}
.retourMsg.ok{color:var(--vert)} .retourMsg.ko{color:var(--rouge)}
.retourMsg .phrase{display:block;color:var(--encre);font-weight:700}
.trad{display:block;font-size:13px;font-weight:600;font-style:italic;color:var(--gris);line-height:1.35;margin-top:2px}
.trad.faux{color:var(--rouge)}
.retourMsg .mot{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--gris);font-weight:700}
.retourMsg .mot .ecoute{width:38px;height:38px} .retourMsg .mot .ecoute svg{width:19px;height:19px}
/* l'annonce : un petit encart de journal */
.annonce{direction:ltr;text-align:left;background:var(--papier);border:1px solid rgba(91,100,117,.35);border-radius:6px;padding:10px 12px;font:600 15px/1.45 Georgia,"Times New Roman",serif;color:var(--encre);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.annonce b{font-family:var(--police);font-weight:900}
.choix.annonces{flex-direction:column} .choix.annonces button{border-radius:8px;text-align:left;font:600 14px/1.4 Georgia,"Times New Roman",serif;background:var(--papier);border-color:rgba(91,100,117,.4)}
.choix.annonces button.juste{background:var(--vert);color:#fff} .choix.annonces button.faux{background:var(--rouge);color:#fff}
.qui{display:flex;gap:12px;align-items:center}
.qui img{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--carte)}
.qui .enonce{flex:1;font-size:15px}
/* le plan, dessine : il garde sa gauche et sa droite en arabe et en persan */
.plan{direction:ltr;background:var(--carte);border-radius:14px;padding:8px}
.plan svg{display:block;width:100%;height:auto}
.plan .p{fill:var(--piece);stroke:var(--trait);stroke-width:.5}
.plan .p.marque{fill:var(--marque);stroke:var(--ambre-f);stroke-width:.9}
.plan .p.balkon{stroke-dasharray:1.4 1}
.plan .p.actif{fill:var(--marque)}
.plan text{fill:var(--encre);font:800 3.1px var(--police);text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.plan .m{fill:none;stroke:var(--trait);stroke-width:.35;opacity:.75;pointer-events:none}
.plan .mf{fill:var(--trait);opacity:.35;pointer-events:none}
.plan .t{font-size:3.4px;fill:var(--gris)}
/* la decouverte */
.onglets{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--carte);border-radius:999px;padding:4px}
.onglets button{border:0;border-radius:999px;background:none;color:var(--gris);font:800 14px var(--police);padding:9px 6px;cursor:pointer}
.onglets button.actif{background:var(--verre);color:var(--encre);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.dit{display:flex;align-items:center;gap:10px;background:var(--carte);border-radius:14px;padding:10px 12px}
.dit .texte{flex:1;font-weight:800;font-size:17px;line-height:1.4}
.puces{display:flex;flex-wrap:wrap;gap:7px;direction:ltr}
.puces button{border:2px solid var(--bord);background:var(--carte);color:var(--encre);border-radius:12px;padding:7px 11px;font:700 14px var(--police);cursor:pointer}
.puces button.choisi{border-color:var(--ambre);background:var(--verre)}
/* une puce qui fait entendre sa phrase porte le haut-parleur de l'app (v919), petit, apres le mot (Jacques, 5 nov. :
   un haut-parleur partout ou l'on peut faire entendre quelque chose en le touchant) */
.puces button.parle{display:inline-flex;align-items:center;gap:6px}
.puces button.parle .ic-hp{width:14px;height:14px;flex:0 0 auto;color:var(--ambre-f)}
.regle{margin:0;font-size:14px;font-weight:700;line-height:1.5;color:var(--gris);background:var(--carte);border-radius:12px;padding:10px 12px}
.regle b{color:var(--encre)}
.regle .exemples{display:block;margin-top:6px;color:var(--encre);font-weight:700;text-align:left}
.suite{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:54px;border:0;border-radius:27px;
  color:#fff;font:800 17px var(--police);background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer;z-index:5000}
.suite[hidden]{display:none}
.bas{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:5000}
.bas[hidden]{display:none}
.bas button{flex:1;height:54px;border-radius:27px;font:800 16px var(--police);cursor:pointer;padding:0 10px}
.bas .principal{border:0;color:#fff;background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28)}
.bas .second{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.fin{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:10px 0}
.fin .score{font-size:22px;font-weight:900}
[lang]{unicode-bidi:isolate}
</style>
</head>
<body>
<div class="haut"><button class="retour" id="retour" type="button">‹</button><div class="titre" id="titre"></div><div class="compte" id="compte" dir="ltr"></div></div>
<div class="barre"><i id="barre"></i></div>
<main id="zone"></main>
<button class="suite" id="suite" type="button" hidden></button>
<div class="bas" id="bas" hidden></div>
<script src="themes/tirage.js?v=2"></script>
<script src="themes/voix.js?v=7"></script>
<script src="themes/zoom.js?v=4"></script>
<script src="themes/verre.js?v=6"></script>
<script>
const Q = new URLSearchParams(location.search);
const APPRENDRE = ["de", "en"].includes(Q.get("apprendre")) ? Q.get("apprendre") : "es";
const DE_APP = APPRENDRE === "de";
const EN_APP = APPRENDRE === "en", GB = EN_APP && Q.get("variante") === "gb";
const LANGUE = (l => ["fr", "en", "tr", "uk", "fa", "ar", "pt", "pl", "ru", "de"].includes(l) ? l : "fr")(((Q.get("lang") || "fr").toLowerCase().split(/[-_]/)[0]));
if (Q.get("nuit") === "1") document.documentElement.classList.add("nuit");
document.documentElement.lang = LANGUE;
document.documentElement.dir = (LANGUE === "fa" || LANGUE === "ar") ? "rtl" : "ltr";
// agrandir (themes/zoom.js) : la photo de la question s'ouvre au toucher, la loupe sur les photos a choisir
Zoom.init({direct: ".cadre img, .qui img", loupe: ".rangee button", langue: LANGUE});
const NB = Q.get("seance") === "1" ? Math.max(2, Math.min(12, parseInt(Q.get("nb"), 10) || 6)) : 20;   // nb : le reglage « Questions par scene et par theme » de la seance du jour (5 · 8 · 12, 7 nov. 2026)

const TEXTES = {
  titre:     {fr:"Le logement", en:"Home and housing", tr:"Ev ve konut", uk:"Житло", fa:"خانه و مسکن", ar:"السكن", pt:"A moradia", pl:"Mieszkanie", ru:"Жильё", de:"Wohnen"},
  intro:     {fr:"Trois logements : la colocation de Mark, l'appartement d'Anna, celui de Jan et Katrin. Choisis-en un, puis touche une pièce du plan.",
              en:"Three homes: Mark's shared apartment, Anna's apartment, and Jan and Katrin's. Choose one, then tap a room on the plan.",
              tr:"Üç ev: Mark'ın paylaşımlı dairesi, Anna'nın dairesi, Jan ile Katrin'in dairesi. Birini seç, sonra plandaki bir odaya dokun.",
              uk:"Три помешкання: квартира, яку Марк ділить із сусідами, квартира Анни і квартира Яна та Катрін. Обери одне й торкнися кімнати на плані.",
              fa:"سه خانه: آپارتمان اشتراکی مارک، آپارتمان آنا و آپارتمان یان و کاترین. یکی را انتخاب کن و روی یک اتاق در نقشه بزن.",
              ar:"ثلاثة مساكن: الشقة المشتركة لمارك، وشقة آنا، وشقة يان وكاترين. اختر واحدًا ثم المس غرفة في المخطط.",
              pt:"Três moradias: o apartamento compartilhado do Mark, o apartamento da Anna e o do Jan e da Katrin. Escolha um e toque em um cômodo da planta.",
              pl:"Trzy mieszkania: mieszkanie Marka ze współlokatorami, mieszkanie Anny oraz Jana i Katrin. Wybierz jedno i dotknij pokoju na planie.",
              ru:"Три жилья: квартира, которую Марк снимает с соседями, квартира Анны и квартира Яна и Катрин. Выбери одно и нажми на комнату на плане.",
              de:"Drei Wohnungen: Marks WG, Annas Wohnung und die Wohnung von Jan und Katrin. Wähle eine und tippe auf ein Zimmer im Grundriss."},
  ongletPieces:{fr:"Les pièces", en:"The rooms", tr:"Odalar", uk:"Кімнати", fa:"اتاق‌ها", ar:"الغرف", pt:"Os cômodos", pl:"Pokoje", ru:"Комнаты", de:"Die Zimmer"},
  ongletCherche:{fr:"Chercher un appartement", en:"Looking for an apartment", tr:"Daire aramak", uk:"Шукати квартиру", fa:"دنبال آپارتمان", ar:"البحث عن شقة", pt:"Procurar apartamento", pl:"Szukanie mieszkania", ru:"Искать квартиру", de:"Eine Wohnung suchen"},
  objets:    {fr:"Sur la photo, touche un mot :", en:"In the photo, tap a word:", tr:"Fotoğrafta bir kelimeye dokun:", uk:"На фото торкнися слова:", fa:"در عکس، روی یک کلمه بزن:", ar:"في الصورة، المس كلمة:", pt:"Na foto, toque em uma palavra:", pl:"Na zdjęciu dotknij słowa:", ru:"На фото нажми на слово:", de:"Auf dem Foto: Tippe auf ein Wort:"},
  pasPhoto:  {fr:"Pas encore de photo de cette pièce.", en:"No photo of this room yet.", tr:"Bu odanın henüz fotoğrafı yok.", uk:"Фото цієї кімнати ще немає.", fa:"هنوز عکسی از این اتاق نیست.", ar:"لا توجد صورة لهذه الغرفة بعد.", pt:"Ainda não há foto deste cômodo.", pl:"Nie ma jeszcze zdjęcia tego pokoju.", ru:"Фото этой комнаты пока нет.", de:"Von diesem Zimmer gibt es noch kein Foto."},
  zaehlenDe: {fr:"<b>Compter les « Zimmer »</b> : le salon et les chambres comptent, la cuisine, la salle de bains et le couloir non. L'appartement d'Anna est une <b>2-Zimmer-Wohnung</b>.",
              en:"<b>Counting “Zimmer”</b>: the living room and bedrooms count; the kitchen, bathroom and hallway don't. Anna's apartment is a <b>2-Zimmer-Wohnung</b>.",
              tr:"<b>“Zimmer” saymak</b>: oturma odası ve yatak odaları sayılır; mutfak, banyo ve koridor sayılmaz. Anna'nın dairesi bir <b>2-Zimmer-Wohnung</b>.",
              uk:"<b>Як рахують «Zimmer»</b>: вітальня і спальні рахуються, кухня, ванна й коридор — ні. Квартира Анни — <b>2-Zimmer-Wohnung</b>.",
              fa:"<b>شمردن «Zimmer»</b>: اتاق نشیمن و اتاق‌خواب‌ها حساب می‌شوند؛ آشپزخانه، حمام و راهرو نه. آپارتمان آنا یک <b>2-Zimmer-Wohnung</b> است.",
              ar:"<b>عدّ «Zimmer»</b>: تُحسب غرفة الجلوس وغرف النوم، ولا يُحسب المطبخ والحمّام والممر. شقة آنا هي <b>2-Zimmer-Wohnung</b>.",
              pt:"<b>Contar os “Zimmer”</b>: a sala e os quartos contam; a cozinha, o banheiro e o corredor, não. O apartamento da Anna é um <b>2-Zimmer-Wohnung</b>.",
              pl:"<b>Liczenie „Zimmer”</b>: salon i sypialnie się liczą, kuchnia, łazienka i korytarz nie. Mieszkanie Anny to <b>2-Zimmer-Wohnung</b>.",
              ru:"<b>Как считают «Zimmer»</b>: гостиная и спальни считаются, кухня, ванная и коридор — нет. Квартира Анны — <b>2-Zimmer-Wohnung</b>.",
              de:"<b>Zimmer zählen</b>: Wohnzimmer und Schlafzimmer zählen, Küche, Bad und Flur nicht. Annas Wohnung ist eine <b>2-Zimmer-Wohnung</b>."},
  zaehlenEs: {fr:"<b>Compter les « habitaciones »</b> : en Espagne, ce sont les chambres. Le salon ne compte pas : l'appartement d'Anna est un <b>piso de una habitación</b>.",
              en:"<b>Counting “habitaciones”</b>: in Spain these are the bedrooms. The living room doesn't count: Anna's apartment is a <b>piso de una habitación</b>.",
              tr:"<b>“habitaciones” saymak</b>: İspanya'da bunlar yatak odalarıdır. Oturma odası sayılmaz: Anna'nın dairesi bir <b>piso de una habitación</b>.",
              uk:"<b>Як рахують «habitaciones»</b>: в Іспанії це спальні. Вітальня не рахується: квартира Анни — <b>piso de una habitación</b>.",
              fa:"<b>شمردن «habitaciones»</b>: در اسپانیا یعنی اتاق‌خواب‌ها. اتاق نشیمن حساب نمی‌شود: آپارتمان آنا یک <b>piso de una habitación</b> است.",
              ar:"<b>عدّ «habitaciones»</b>: في إسبانيا هي غرف النوم. لا تُحسب غرفة الجلوس: شقة آنا هي <b>piso de una habitación</b>.",
              pt:"<b>Contar as “habitaciones”</b>: na Espanha, são os quartos. A sala não conta: o apartamento da Anna é um <b>piso de una habitación</b>.",
              pl:"<b>Liczenie „habitaciones”</b>: w Hiszpanii to sypialnie. Salon się nie liczy: mieszkanie Anny to <b>piso de una habitación</b>.",
              ru:"<b>Как считают «habitaciones»</b>: в Испании это спальни. Гостиная не считается: квартира Анны — <b>piso de una habitación</b>.",
              de:"<b>„habitaciones“ zählen</b>: In Spanien sind das die Schlafzimmer. Das Wohnzimmer zählt nicht: Annas Wohnung ist ein <b>piso de una habitación</b>."},
  verbesDe:  {fr:"<b>stehen, liegen, hängen</b> : debout (le canapé, le lit), à plat (le tapis, le coussin), accroché (le tableau, la lampe au plafond).",
              en:"<b>stehen, liegen, hängen</b>: standing (the sofa, the bed), lying flat (the rug, the cushion), hanging (the picture, the ceiling lamp).",
              tr:"<b>stehen, liegen, hängen</b>: dik duran (kanepe, yatak), yatay duran (halı, yastık), asılı (tablo, tavan lambası).",
              uk:"<b>stehen, liegen, hängen</b>: стоїть (диван, ліжко), лежить (килим, подушка), висить (картина, лампа під стелею).",
              fa:"<b>stehen, liegen, hängen</b>: ایستاده (مبل، تخت)، خوابیده (فرش، کوسن)، آویزان (تابلو، چراغ سقفی).",
              ar:"<b>stehen, liegen, hängen</b>: قائم (الأريكة، السرير)، ممدود (السجادة، الوسادة)، معلّق (اللوحة، مصباح السقف).",

              pl:"<b>stehen, liegen, hängen</b>: stoi (kanapa, łóżko), leży (dywan, poduszka), wisi (obraz, lampa pod sufitem).",

  verbesEs:  {fr:"<b>hay ou está</b> : « hay » présente une chose (hay una nevera), « está » dit où est une chose connue (la nevera está en la cocina).",
              en:"<b>hay or está</b>: “hay” introduces something (hay una nevera), “está” says where a known thing is (la nevera está en la cocina).",

              fa:"<b>hay یا está</b>: «hay» چیزی را معرفی می‌کند (hay una nevera)، «está» می‌گوید چیز شناخته‌شده کجاست (la nevera está en la cocina).",
              ar:"<b>hay أم está</b>: «hay» تقدّم شيئًا (hay una nevera)، و«está» تقول أين يوجد شيء معروف (la nevera está en la cocina).",
              pt:"<b>hay ou está</b>: “hay” apresenta uma coisa (hay una nevera), “está” diz onde está uma coisa conhecida (la nevera está en la cocina).",
              pl:"<b>hay czy está</b>: „hay” przedstawia rzecz (hay una nevera), „está” mówi, gdzie jest znana rzecz (la nevera está en la cocina).",
              ru:"<b>hay или está</b>: «hay» называет вещь впервые (hay una nevera), «está» говорит, где известная вещь (la nevera está en la cocina).",
              de:"<b>hay oder está</b>: „hay“ stellt etwas vor (hay una nevera), „está“ sagt, wo etwas Bekanntes ist (la nevera está en la cocina)."},
  chercheDe: {fr:"Une annonce allemande abrège tout. Touche une abréviation :", en:"A German ad abbreviates everything. Tap an abbreviation:", tr:"Almanca bir ilan her şeyi kısaltır. Bir kısaltmaya dokun:", uk:"Німецьке оголошення все скорочує. Торкнися скорочення:", fa:"آگهی آلمانی همه‌چیز را کوتاه می‌کند. روی یک کوته‌نوشت بزن:", ar:"الإعلان الألماني يختصر كل شيء. المس اختصارًا:", pt:"Um anúncio alemão abrevia tudo. Toque em uma abreviação:", pl:"Niemieckie ogłoszenie wszystko skraca. Dotknij skrótu:", ru:"Немецкое объявление всё сокращает. Нажми на сокращение:", de:"Eine Anzeige kürzt alles ab. Tippe auf eine Abkürzung:"},

  zaehlenEn: {fr:"<b>Compter les pièces</b> : une annonce américaine compte les chambres. <b>2BR/1BA</b> = deux chambres (bedrooms), une salle de bains (bathroom) ; le salon ne compte pas. L'appartement d'Anna est un <b>one-bedroom apartment</b>. Pour demander : <b>How many bedrooms does it have?</b>"},
  zaehlenGb: {fr:"<b>Compter les pièces</b> : une annonce britannique compte les chambres. Un <b>2-bed flat</b> a deux chambres (bedrooms) ; le salon ne compte pas. L'appartement d'Anna est un <b>one-bedroom flat</b>. En britannique, on dit volontiers <b>have got</b> : <b>How many bedrooms has it got?</b> — <b>It's got one bedroom.</b>"},
  thereEn:   {fr:"<b>there is / there are</b> : <b>There's</b> a sofa in the living room (une chose), <b>there are</b> two bedrooms (plusieurs). Et les prépositions : <b>in</b> the kitchen, mais <b>on</b> the balcony ; <b>on</b> the wall, <b>on</b> the floor, <b>above</b> the table (accrochée au-dessus : pas <i>on</i>), <b>under</b> the window, <b>next to</b> the bed, <b>between</b> the kitchen and the bedroom."},
  bonUs:     {fr:"Bon à savoir : tu apprends l'anglais américain. On y dit <b>apartment</b>, <b>elevator</b>, <b>closet</b>, <b>stove</b>, <b>bathtub</b>, <b>faucet</b> (le robinet), <b>roommate</b>, <b>for rent</b> (à louer). Et les étages : le <b>first floor</b> est le rez-de-chaussée, le <b>second floor</b> notre premier étage. En Grande-Bretagne : flat, lift, wardrobe, cooker, bath, tap, flatmate, to let ; ground floor (rez-de-chaussée), first floor (1er étage)."},
  bonGb:     {fr:"Bon à savoir : tu apprends l'anglais britannique. On y dit <b>flat</b>, <b>lift</b>, <b>wardrobe</b>, <b>cooker</b>, <b>bath</b>, <b>tap</b> (le robinet), <b>flatmate</b>, <b>to let</b> (à louer). Les étages se comptent comme en français : <b>ground floor</b> (rez-de-chaussée), <b>first floor</b> (1er étage). Aux États-Unis : apartment, elevator, closet, stove, bathtub, faucet, roommate, for rent ; et le first floor y est le rez-de-chaussée."},

      ajouter("aux", {annonce: a.id, trou: "___ the " + APT + " furnished?", rep: "Is", opts: AUX,
                      phrase: "Is the " + APT + " furnished? " + (a.furn ? "Yes, it is." : "No, it isn't."),
                      trad: {fr: "L'appartement est-il meublé ? " + (a.furn ? "Oui." : "Non.")}, mots: [kMeuble, kApt], mot: kMeuble});
    }
    // la preposition de l'etage : on the third floor
    ajouter("prep", {annonce: a.id, trou: Lui + " is ___ " + etageEn(a.et) + ".", rep: "on", opts: melangeOpts(["on", "in", "at"]), phrase: Lui + " is on " + etageEn(a.et) + ".",
                     trad: {fr: luiFr + " est " + etageFr(a.et) + "."}, mots: [etg], mot: etg});
    Q.forEach(([q, rep, leurres, phrase, fr, ks]) => ajouter("annonce", {annonce: a.id, q, rep, leurres, phrase, trad: {fr}, mots: ks, mot: ks[0]}));
  });
  // « Which ad is right for her? » : une seule annonce sur trois remplit TOUT
  CHERCHENT_EN.forEach(s => {
    const passe = a => s.room ? !!a.room && a.rent <= s.max
                     : !a.room && a.rent <= s.max && (GB ? a.bed : a.br) >= (s.br || 1) && (!s.laundry || a.laundry) && (!s.balc || a.balc) && (!s.elev || (GB ? a.lift : a.elev));
    const bons = A.filter(passe).map(a => a.id), faux = A.filter(a => !passe(a)).map(a => a.id);
    if (!bons.length || faux.length < 2) throw new Error("passt : " + s.nom);
    let besoin, fr, ks;
    if (s.room){
      besoin = s.nom + " is looking for a room in " + (GB ? "a flatshare" : "a shared apartment") + ". " + s.il + " can pay up to " + argent(s.max) + " a month.";
      fr = s.nom + " cherche une chambre en colocation. " + s.fr + " peut payer jusqu'à " + argentFr(s.max) + " par mois.";
      ks = [kPiece, kRent];
    } else {
      const c = [s.br ? "at least " + NB_EN[s.br] + " bedrooms" : null, s.laundry ? "laundry in the building" : null, s.balc ? "a balcony" : null].filter(Boolean);
      const cFr = [s.br ? "au moins " + NB_FR[s.br] + " chambres" : null, s.laundry ? "une buanderie dans l'immeuble" : null, s.balc ? "un balcon" : null].filter(Boolean);
      besoin = s.nom + " is looking for " + unEn(APT) + (s.elev ? " in a building with " + unEn(ASC) : " with " + c.join(" and ")) + ". " + s.il + " can pay up to " + argent(s.max) + " a month.";
      fr = s.nom + " cherche un appartement " + (s.elev ? "dans un immeuble avec ascenseur" : "avec " + cFr.join(" et ")) + ". " + s.fr + " peut payer jusqu'à " + argentFr(s.max) + " par mois.";
      ks = s.elev ? [kAsc, kRent] : [kChambre].concat(s.laundry ? [kBat] : [], s.balc ? [kBalc] : [], [kRent]);
    }
    bons.forEach(b => {
      const a = A.find(x => x.id === b);
      const phrase = a.room ? "The room in " + a.ort + " is right for " + s.nom + "." : "The " + a.ort + " " + APT + " is right for " + s.nom + ".";
      const pFr = (a.room ? "La chambre " : "L'appartement ") + deFr(a.ort) + " convient à " + s.nom + ". (" + fr + ")";
      ajouter("passt", {visage: s.visage, q: besoin, rep: b, faux, phrase, trad: {fr: pFr}, mots: ks, mot: ks[0]});
    });
  });
  // ---- les definitions, dans les deux sens ----
  DEFS_EN.forEach(([m, aff, def, q, fr]) => {
    const k = motEn(m), autres = DEFS_EN.filter(x => x[0] !== m);
    choix[aff] = {fr: EN_GLOSES[m] || ""};
    ajouter("wort", {q: def, rep: aff, leurres: autres.map(x => x[1]), phrase: def, trad: {fr}, mots: [k], mot: k});
    ajouter("sens", {q, rep: def, leurres: autres.map(x => x[2]), phrase: def, trad: {fr}, mots: [k], mot: k, long: true});
  });
  // ---- les abreviations des annonces ----
  ABK_EN.forEach(([a, sens, m, fr]) => {
    const k = motEn(m, ["included", "available", "furnished"].includes(m) ? "adjectif" : null), autres = ABK_EN.filter(x => x[0] !== a);
    const phrase = a + " means " + sens + ".", t = {fr: a + " veut dire « " + sens + " » : " + fr + "."};
    choix[sens] = {fr};
    ajouter("abk", {abk: a, q: a === "bed" ? "What does “bed” mean in “2-bed flat”?" : "What does “" + a + "” mean?", rep: sens, leurres: autres.map(x => x[1]), phrase, trad: t, mots: [k], mot: k});
    ajouter("abkRev", {q: "How do you write “" + sens + "” in an ad?", rep: a, leurres: autres.map(x => x[0]), phrase, trad: t, mots: [k], mot: k});
  });
  D.items.en = I; D.mots.en = mots; D.gloses.en = gloses; D.choix.en = choix; D.annonces.en = ann;
}

    const autres = melanger(SORTES.filter(x => x !== derniereSorte));
    for (const so of autres){
      for (let n = 0; n < 25; n++){
        raz(so);
        if (!EX[so](w)) break;
        if (!vus.has(cleQuestion())) return so;
      }
    }
    if (strict) return null;
    if (derniereSorte) for (let n = 0; n < 25; n++){
      raz(derniereSorte);
      if (!EX[derniereSorte](w)) break;
      if (!vus.has(cleQuestion())) return derniereSorte;
    }
    for (const so of autres.concat(derniereSorte ? [derniereSorte] : [])){
      raz(so);
      if (EX[so](w)) return so;
    }
    return null;
  };
  let fait = essai(file[rang], true);
  for (let j = rang + 1; !fait && j < file.length; j++){
    fait = essai(file[j], true);
    if (fait) [file[rang], file[j]] = [file[j], file[rang]];
  }
  if (!fait) fait = essai(file[rang], false);
  dire = garde;
  if (fait === "entendre"){ const e = $("ecoute"); if (e) e.click(); }
  vus.add(cleQuestion()); derniereSorte = fait;
  window.scrollTo(0, 0); document.body.scrollTop = 0;
}
function fin(){
  $("barre").style.width = "100%"; $("compte").textContent = file.length + " / " + file.length; $("suite").hidden = true;
  $("zone").innerHTML = '<div class="fin"><div class="score">' + T("score", {b: bons, n: file.length}) + '</div></div>';
  basDePartie();
  $("terminer").addEventListener("click", () => parler("fini", {bons, faits: file.length}));
}
function toutRevu(prochaine){
  $("barre").style.width = "100%"; $("compte").textContent = ""; $("suite").hidden = true;
  const quand = Tirage.revu(prochaine, LANGUE);
  $("zone").innerHTML = '<div class="fin"><div class="score">' + (TIRAGE_TEXTES.revu[LANGUE] || TIRAGE_TEXTES.revu.fr) + '</div>'
    + (quand ? '<p class="consigne">' + (TIRAGE_TEXTES.prochaine[LANGUE] || TIRAGE_TEXTES.prochaine.fr).replace("{d}", quand) + '</p>' : "")
    + '</div>';
  basDePartie();
  $("terminer").addEventListener("click", () => parler("fini", {bons: 0, faits: 0}));
}
const boutonEncore = () => Q.get("seance") === "1" ? "" : '<button type="button" class="second" id="encore">' + (TIRAGE_TEXTES.encore[LANGUE] || TIRAGE_TEXTES.encore.fr) + '</button>';
function basDePartie(){
  const b = $("bas"); b.innerHTML = boutonEncore() + '<button type="button" class="principal" id="terminer">' + T("terminer") + '</button>'; b.hidden = false;
  const e = $("encore"); if (e) e.addEventListener("click", () => { b.hidden = true; encoreDesQuestions(); });
}
async function encoreDesQuestions(){
  const mots = motsDuTheme();
  file = Tirage.supplement(mots, await Tirage.demander(mots), NB); rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(null);
  montrer();
}
async function demarrer(){
  const mots = motsDuTheme();
  const plan = Tirage.plan(mots, await Tirage.demander(mots), NB, NEUFS_MAX);
  file = plan.file; rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(plan.prochaine);
  montrer();
}
// les textes que la page peut dire (visuel/voix_themes.py) : les phrases de la decouverte et des questions
function textesAVoix(){
  const out = [];
  Object.values(D.items[APPRENDRE]).forEach(L => L.forEach(it => { if (it.phrase) out.push(it.phrase); if (it.juste) out.push(it.juste); }));
  return uniques(out);
}
$("suite").addEventListener("click", () => { if (!file.length) return; rang++; if (rang >= file.length) fin(); else montrer(); });
$("retour").addEventListener("click", () => parler("fermer"));
$("retour").setAttribute("aria-label", T("retourAria"));
$("titre").textContent = T("titre");
document.title = T("titre");
fetch("logement/logement.json?v=1").then(r => r.json()).then(d => {
  D = d;
  if (EN_APP) construireAnglais(D);
  if (Q.get("seance") === "1") demarrer(); else decouvrir();
});
</script>
