<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'école et la garderie</title>
<!--
  L'ECOLE ET LA GARDERIE DES ENFANTS (theme illustre, vague 4, 5 nov. 2026). Ben (7 ans, Grundschule) et Mia (4 ans,
  Kita), les enfants de Jan et Katrin ; Mark, ami de la famille, et Anna, leur tante, vont parfois chercher Mia. Les
  parents face a l'ecole : amener et aller chercher, inscrire, le mot d'absence a l'enseignante, la reunion de parents,
  l'horaire, la liste des fournitures, les vacances scolaires. Sujet frequent du DTZ.
  Les images n'ont AUCUN texte : l'horaire, le mot d'absence, l'invitation, le calendrier, la liste et le tableau de la
  Kita sont dessines ici, en HTML. Donnees : visuel/ecole/ecole.py -> ecole/ecole.json.
  L'axe : Wohin? + accusatif / Wo? + datif (in die Kita, in der Schule), les verbes separables (Mark holt Mia ab), weil
  (Ben fehlt, weil er krank ist), les pluriels ; en espagnol ir a / estar en, al, la « a » personnelle, porque.
  Ouverte par l'app dans le cadre des scenes (sceneCadre), elle parle comme une scene : « exercice » et « bonne » a
  chaque reponse, « reponse » {mot, genre, cat, juste} pour le mot teste, « fini » et « fermer » a la fin.
  Parametres : apprendre=es|de, lang=<interface>, nuit=1, seance=1 (six questions, pas de decouverte), variante=latam.
  Le tirage suit les mots (themes/tirage.js). Les phrases sont FABRIQUEES depuis ecole.json, jamais ecrites une a une ;
  un leurre n'est jamais une reponse possible (« faux_v », « proches », les lieux de l'autre enfant).
-->
<style>
:root{--fond1:#82AFDB;--fond3:#C0D6EA;--encre:#1C2430;--gris:#4C566B;--ambre:#E8A23A;--ambre-f:#A86A0E;--vert:#2F9E6A;--rouge:#C8473A;
  --verre:rgba(255,255,255,.88);--bord:rgba(255,255,255,.95);--carte:#F7F8FA;--papier:#FFFDF7;--trait:#C9CFD8;--police:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html.nuit{--fond1:#0E1C26;--fond3:#18303F;--encre:#EEF2F5;--gris:#A9B8C4;--ambre-f:#E8A23A;--vert:#5CC98F;--rouge:#F07F72;
  --verre:rgba(20,36,50,.88);--bord:rgba(255,255,255,.14);--carte:#22384A;--papier:#1D2F3D;--trait:#40576A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
/* la page a la hauteur de l'ecran, comme une scene (visuel/THEMES-ILLUSTRES.md) : le contenu defile DANS le body */
html{height:100%;overflow:hidden}
body{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;box-sizing:border-box}
body{background:linear-gradient(180deg,var(--fond1),var(--fond3));background-attachment:fixed;color:var(--encre);font-family:var(--police);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 156px) max(10px,env(safe-area-inset-left,0px))}
.haut{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto 10px}
.retour{width:42px;height:42px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);color:var(--encre);font:800 22px var(--police);cursor:pointer;flex:0 0 auto}
html[dir="rtl"] .retour{transform:scaleX(-1)}
.titre{flex:1;font-weight:900;font-size:18px}
.compte{font-weight:800;font-size:14px;color:var(--gris)}
.barre{max-width:560px;margin:0 auto 12px;height:6px;border-radius:3px;background:rgba(28,36,48,.12);overflow:hidden}
.barre i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2BB5AA,#14807A);transition:width .3s}
main{max-width:560px;margin:0 auto;background:var(--verre);border:1px solid var(--bord);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}
.consigne{font-size:14px;font-weight:700;color:var(--gris);margin:0}
.enonce{direction:ltr;text-align:left;background:var(--carte);border-radius:14px;padding:12px 14px;font-weight:800;line-height:1.5;font-size:17px}
.enonce.centre{text-align:center;font-size:19px}
.trou{display:inline-block;min-width:64px;border-bottom:2px solid var(--ambre);text-align:center;color:var(--ambre-f)}
/* les images sont en 4:3 ; une image pas encore faite garde sa place (fond uni), la page marche sans elle */
.photo{display:block;width:100%;max-width:420px;margin:0 auto;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:16px;background:var(--carte)}
.rangee{display:grid;grid-template-columns:1fr 1fr;gap:8px;direction:ltr}
.rangee.trois{grid-template-columns:1fr 1fr 1fr}
.rangee button{border:3px solid transparent;border-radius:14px;background:var(--carte);padding:0;cursor:pointer;overflow:hidden;display:block}
.rangee img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.rangee button.juste{border-color:var(--vert)} .rangee button.faux{border-color:var(--rouge)}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix.centre{justify-content:center}
.choix.liste{flex-direction:column}
.choix button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:9px 15px;font:800 15px var(--police);cursor:pointer;text-align:center}
.choix.liste button{border-radius:14px;text-align:left}
.choix button.juste{background:var(--vert);border-color:var(--vert);color:#fff}
.choix button.faux{background:var(--rouge);border-color:var(--rouge);color:#fff}
button:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
button:disabled{cursor:default}
.ecoute{width:48px;height:48px;border-radius:50%;border:2px solid var(--ambre);background:var(--verre);color:var(--encre);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ecoute svg{width:24px;height:24px}
.ecoute.grand{width:64px;height:64px;margin:0 auto} .ecoute.grand svg{width:32px;height:32px}
.retourMsg{min-height:1.4em;font-weight:800;font-size:15px;margin:0;line-height:1.45}
.retourMsg.ok{color:var(--vert)} .retourMsg.ko{color:var(--rouge)}
.retourMsg .phrase{display:block;color:var(--encre);font-weight:700}
.trad{display:block;font-size:13px;font-weight:600;font-style:italic;color:var(--gris);line-height:1.35;margin-top:2px}
.trad.faux{color:var(--rouge);font-style:normal}
.retourMsg .mot{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--gris);font-weight:700}
.retourMsg .mot .ecoute{width:38px;height:38px} .retourMsg .mot .ecoute svg{width:19px;height:19px}
/* LES PAPIERS, dessines ici (aucun texte dans les images) : le formulaire, l'avis, les heures, la confirmation */
.papier{direction:ltr;text-align:left;background:var(--papier);border:1px solid var(--trait);border-radius:6px;padding:12px 12px 10px;box-shadow:0 6px 16px rgba(28,36,48,.12);
  font-size:14px;line-height:1.4;color:var(--encre);position:relative}
.papier .entete{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--gris);border-bottom:2px solid var(--encre);padding-bottom:5px;margin-bottom:8px}
.papier h3{margin:0 0 8px;font-size:17px;font-weight:900}
.papier .cases{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.papier .case{border:1px solid var(--trait);border-radius:4px;padding:3px 6px 4px;min-height:42px;background:rgba(255,255,255,.35)}
html.nuit .papier .case{background:rgba(255,255,255,.03)}
.papier .case.large{grid-column:1 / -1}
.papier .case .lab{display:block;font-size:10.5px;font-weight:800;color:var(--gris);text-transform:uppercase;letter-spacing:.02em}
.papier .case .val{display:block;font-size:15px;font-weight:700;font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;color:#1D4E9E}
html.nuit .papier .case .val{color:#9CC3FF}
.papier .case .val.signe{font-family:"Segoe Script","Brush Script MT","Snell Roundhand",cursive;font-size:19px}
.papier .case.cachee .lab{color:var(--ambre-f)}
.papier .case.vise{border:2px solid var(--ambre);background:rgba(232,162,58,.12)}
.papier ul{margin:4px 0 6px;padding-left:20px}
.papier li{margin:2px 0;font-weight:700}
.papier table{border-collapse:collapse;width:100%;font-size:14px}
.papier td{padding:3px 4px;border-bottom:1px dotted var(--trait)} .papier td:first-child{font-weight:800;width:42%}
.papier .note{font-size:12.5px;color:var(--gris);margin:6px 0 0;font-weight:700}
.papier .gros{font-size:16px;font-weight:900;margin:6px 0}
/* la decouverte */
.section{font-weight:900;font-size:15px;margin:4px 0 -4px}
.fiche{background:var(--carte);border-radius:14px;padding:10px;display:grid;grid-template-columns:minmax(120px,48%) 1fr;gap:12px;align-items:center}
.fiche img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;background:var(--verre)}
.fiche .mot{font-weight:900;font-size:21px;color:var(--ambre-f);line-height:1.15}
.fiche .sens{font-weight:700;font-size:14px;color:var(--gris);margin-top:2px}
.fiche .dit{font-weight:800;font-size:16px;line-height:1.4;margin-top:6px}
.fiche .ligne{display:flex;align-items:center;gap:10px;margin-top:8px}
.planche{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;direction:ltr}
.planche button{border:3px solid transparent;border-radius:10px;padding:0;background:var(--carte);cursor:pointer;overflow:hidden;display:block}
.planche img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.planche button.choisi{border-color:var(--ambre)}
.papier .case.touche{cursor:pointer}
.regle{margin:0;font-size:14px;font-weight:700;line-height:1.45;color:var(--gris);background:var(--carte);border-radius:12px;padding:10px 12px}
/* TOUS LES BOUTONS D'ACTION TOUT EN BAS DE L'ECRAN, comme dans les scenes (Jacques, 3 nov. 2026) */
.suite{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:54px;border:0;border-radius:27px;z-index:5000;
  color:#fff;font:800 17px var(--police);background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer}
.suite[hidden]{display:none}
.bas{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5000;display:flex;flex-direction:column;gap:8px}
.bas button{height:54px;border:0;border-radius:27px;font:800 17px var(--police);cursor:pointer;
  color:#fff;background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28)}
.bas button.second{background:var(--verre);color:var(--encre);border:2px solid var(--ambre);box-shadow:0 6px 16px rgba(28,36,48,.14)}
.fin{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:10px 0}
.fin .score{font-size:22px;font-weight:900}
.papier table.horaire{font-size:13px;text-align:center}
.papier table.horaire td{padding:3px 2px;border:1px solid var(--trait);width:auto}
.papier table.horaire td:first-child{font-weight:800;width:auto;font-size:12px;color:var(--gris)}
.papier table.horaire tr:first-child td{font-weight:900}
.papier table.horaire tr.pause td{font-style:italic;color:var(--gris);font-weight:700}
.papier td.vise,.papier tr.vise td{background:rgba(232,162,58,.22);outline:2px solid var(--ambre)}
[lang]{unicode-bidi:isolate}
</style>
</head>
<body>
<div class="haut"><button class="retour" id="retour" type="button">‹</button><div class="titre" id="titre"></div><div class="compte" id="compte" dir="ltr"></div></div>
<div class="barre"><i id="barre"></i></div>
<main id="zone"></main>
<button class="suite" id="suite" type="button" hidden></button>
<script src="themes/tirage.js?v=1"></script>
<script src="themes/zoom.js?v=4"></script>
<script src="themes/verre.js?v=6"></script>
<script src="themes/voix.js?v=6"></script>
<script>
const Q = new URLSearchParams(location.search);
const APPRENDRE = Q.get("apprendre") === "de" ? "de" : "es";
const LANGUE = (l => ["fr", "en", "tr", "uk", "fa", "ar", "pt", "pl", "ru", "de"].includes(l) ? l : "fr")(((Q.get("lang") || "fr").toLowerCase().split(/[-_]/)[0]));
if (Q.get("nuit") === "1") document.documentElement.classList.add("nuit");
document.documentElement.lang = LANGUE;
document.documentElement.dir = (LANGUE === "fa" || LANGUE === "ar") ? "rtl" : "ltr";
const NB = Q.get("seance") === "1" ? Math.max(2, Math.min(12, parseInt(Q.get("nb"), 10) || 6)) : 20;   // nb : le reglage « Questions par scene et par theme » de la seance du jour (5 · 8 · 12, 7 nov. 2026)
Zoom.init({direct: "img.photo, .fiche img", loupe: ".rangee button", langue: LANGUE});

const TEXTES = {
  titre:     {fr:"L'école et la garderie", en:"School and day care", tr:"Okul ve kreş", uk:"Школа й дитсадок", fa:"مدرسه و مهدکودک", ar:"المدرسة والحضانة", pt:"A escola e a creche", pl:"Szkoła i przedszkole", ru:"Школа и детский сад", de:"Schule und Kita"},
  intro:     {fr:"Ben a 7 ans, il va à l'école primaire ; sa petite sœur Mia a 4 ans, elle va à la garderie. Touche une image : tu vois et tu entends ce qui se passe. En bas, les papiers de l'école.", en:"Ben is 7 and goes to primary school; his little sister Mia is 4 and goes to day care. Tap a picture to see and hear what happens. Below are the school papers.", tr:"Ben 7 yaşında, ilkokula gidiyor; küçük kız kardeşi Mia 4 yaşında, kreşe gidiyor. Bir resme dokun: ne olduğunu gör ve dinle. Aşağıda okulun kâğıtları var.", uk:"Бенові 7 років, він ходить до початкової школи; його молодшій сестрі Мії 4 роки, вона ходить у дитсадок. Торкнися зображення: побачиш і почуєш, що відбувається. Нижче — шкільні папери.", fa:"بن ۷ سال دارد و به دبستان می‌رود؛ خواهر کوچکش میا ۴ سال دارد و به مهدکودک می‌رود. روی یک تصویر بزن تا ببینی و بشنوی چه اتفاقی می‌افتد. پایین، کاغذهای مدرسه است.", ar:"بن عمره ٧ سنوات ويذهب إلى المدرسة الابتدائية؛ وأخته الصغيرة ميا عمرها ٤ سنوات وتذهب إلى الحضانة. المس صورة لترى وتسمع ما يحدث. في الأسفل أوراق المدرسة.", pt:"O Ben tem 7 anos e vai à escola primária; a irmãzinha dele, a Mia, tem 4 anos e vai à creche. Toque em uma imagem para ver e ouvir o que acontece. Embaixo estão os papéis da escola.", pl:"Ben ma 7 lat i chodzi do szkoły podstawowej; jego młodsza siostra Mia ma 4 lata i chodzi do przedszkola. Dotknij obrazka, aby zobaczyć i usłyszeć, co się dzieje. Niżej są papiery ze szkoły.", ru:"Бену 7 лет, он ходит в начальную школу; его младшей сестре Мии 4 года, она ходит в детский сад. Нажми на картинку, чтобы увидеть и услышать, что происходит. Ниже — школьные бумаги.", de:"Ben ist 7 und geht in die Grundschule; seine kleine Schwester Mia ist 4 und geht in die Kita. Tippe auf ein Bild: Du siehst und hörst, was passiert. Unten stehen die Papiere der Schule."},
  secAct:    {fr:"Une journée d'école", en:"A school day", tr:"Bir okul günü", uk:"Шкільний день", fa:"یک روز مدرسه", ar:"يوم دراسي", pt:"Um dia de escola", pl:"Dzień w szkole", ru:"Школьный день", de:"Ein Schultag"},
  secObj:    {fr:"Les fournitures", en:"School supplies", tr:"Okul malzemeleri", uk:"Шкільне приладдя", fa:"لوازم مدرسه", ar:"الأدوات المدرسية", pt:"O material escolar", pl:"Przybory szkolne", ru:"Школьные принадлежности", de:"Das Schulmaterial"},
  secPap:    {fr:"Les papiers de l'école", en:"School papers", tr:"Okul kâğıtları", uk:"Шкільні папери", fa:"کاغذهای مدرسه", ar:"أوراق المدرسة", pt:"Os papéis da escola", pl:"Papiery ze szkoły", ru:"Школьные бумаги", de:"Die Papiere der Schule"},
  regleDe:   {fr:"Wohin? avec l'accusatif : Ben geht in die Schule, Mia geht in den Kindergarten. Wo? avec le datif : Ben ist in der Schule, Mia ist im Kindergarten (in dem). Beaucoup de verbes sont séparables : Mark holt Mia von der Kita ab, Katrin meldet Mia an, Katrin ruft in der Schule an — le petit mot va à la fin. Et après weil, le verbe aussi : Ben fehlt, weil er krank ist.", en:"Wohin? takes the accusative: Ben geht in die Schule, Mia geht in den Kindergarten. Wo? takes the dative: Ben ist in der Schule, Mia ist im Kindergarten (in dem). Many verbs are separable: Mark holt Mia von der Kita ab, Katrin meldet Mia an, Katrin ruft in der Schule an — the small word goes to the end. After weil, the verb goes there too: Ben fehlt, weil er krank ist.", tr:"Wohin? sorusunda akuzatif: Ben geht in die Schule, Mia geht in den Kindergarten. Wo? sorusunda datif: Ben ist in der Schule, Mia ist im Kindergarten (in dem). Birçok fiil ayrılabilir: Mark holt Mia von der Kita ab, Katrin meldet Mia an, Katrin ruft in der Schule an — küçük kelime sona gider. weil'den sonra fiil de sona gider: Ben fehlt, weil er krank ist.", uk:"Wohin? — знахідний відмінок: Ben geht in die Schule, Mia geht in den Kindergarten. Wo? — давальний: Ben ist in der Schule, Mia ist im Kindergarten (in dem). Багато дієслів відокремлювані: Mark holt Mia von der Kita ab, Katrin meldet Mia an, Katrin ruft in der Schule an — маленьке слово йде в кінець. Після weil дієслово теж іде в кінець: Ben fehlt, weil er krank ist.", fa:"Wohin? با حالت مفعولی (آکوزاتیو): Ben geht in die Schule، Mia geht in den Kindergarten. Wo? با حالت داتیو: Ben ist in der Schule، Mia ist im Kindergarten (in dem). بسیاری از فعل‌ها جداشدنی‌اند: Mark holt Mia von der Kita ab، Katrin meldet Mia an، Katrin ruft in der Schule an — واژهٔ کوچک به آخر می‌رود. بعد از weil هم فعل به آخر می‌رود: Ben fehlt, weil er krank ist.", ar:"‏Wohin? مع حالة النصب (الأكوزاتيف): Ben geht in die Schule، Mia geht in den Kindergarten. ‏Wo? مع حالة الجر (الداتيف): Ben ist in der Schule، Mia ist im Kindergarten ‏(in dem). أفعال كثيرة قابلة للفصل: Mark holt Mia von der Kita ab، Katrin meldet Mia an، Katrin ruft in der Schule an — الكلمة الصغيرة تذهب إلى آخر الجملة. وبعد weil يذهب الفعل إلى الآخر أيضًا: Ben fehlt, weil er krank ist.", pt:"Wohin? com o acusativo: Ben geht in die Schule, Mia geht in den Kindergarten. Wo? com o dativo: Ben ist in der Schule, Mia ist im Kindergarten (in dem). Muitos verbos são separáveis: Mark holt Mia von der Kita ab, Katrin meldet Mia an, Katrin ruft in der Schule an — a palavrinha vai para o fim. Depois de weil, o verbo também: Ben fehlt, weil er krank ist.", pl:"Wohin? z biernikiem: Ben geht in die Schule, Mia geht in den Kindergarten. Wo? z celownikiem: Ben ist in der Schule, Mia ist im Kindergarten (in dem). Wiele czasowników jest rozdzielnych: Mark holt Mia von der Kita ab, Katrin meldet Mia an, Katrin ruft in der Schule an — małe słowo idzie na koniec. Po weil czasownik też idzie na koniec: Ben fehlt, weil er krank ist.", ru:"Wohin? — винительный падеж: Ben geht in die Schule, Mia geht in den Kindergarten. Wo? — дательный: Ben ist in der Schule, Mia ist im Kindergarten (in dem). Многие глаголы отделяемые: Mark holt Mia von der Kita ab, Katrin meldet Mia an, Katrin ruft in der Schule an — маленькое слово уходит в конец. После weil глагол тоже в конце: Ben fehlt, weil er krank ist."},
  regleEs:   {fr:"Où va-t-on ? ir a : Ben va al colegio (a + el = al), Mia va a la guardería. Où est-on ? estar en : Ben está en el colegio. Devant une personne, le complément prend « a » : Mark recoge a Mia, Katrin lleva a Ben al colegio. Pourquoi ? porque : Ben falta porque está enfermo.", en:"Where to? ir a: Ben va al colegio (a + el = al), Mia va a la guardería. Where? estar en: Ben está en el colegio. Before a person, the object takes « a »: Mark recoge a Mia, Katrin lleva a Ben al colegio. Why? porque: Ben falta porque está enfermo.", pt:"Para onde? ir a: Ben va al colegio (a + el = al), Mia va a la guardería. Onde? estar en: Ben está en el colegio. Diante de uma pessoa, o complemento leva « a »: Mark recoge a Mia, Katrin lleva a Ben al colegio. Por quê? porque: Ben falta porque está enfermo.", ar:"إلى أين؟ ir a: Ben va al colegio ‏(a + el = al)، Mia va a la guardería. أين؟ estar en: Ben está en el colegio. أمام الشخص يأخذ المفعول « a »: Mark recoge a Mia، Katrin lleva a Ben al colegio. لماذا؟ porque: Ben falta porque está enfermo.", de:"Wohin? ir a: Ben va al colegio (a + el = al), Mia va a la guardería. Wo? estar en: Ben está en el colegio. Vor einer Person steht « a »: Mark recoge a Mia, Katrin lleva a Ben al colegio. Warum? porque: Ben falta porque está enfermo."},

};
function T(cle, v){ let s = (TEXTES[cle] || {})[LANGUE] || (TEXTES[cle] || {}).fr || cle; for (const k in (v || {})) s = s.split("{" + k + "}").join(v[k]); return s; }

// ---------- la donnee (ecole.json, faite par visuel/ecole/ecole.py) ----------
let D = null, LX, ACT, OBJ, CJ, NO;
const PHRASE_TRADUITE = LANGUE !== APPRENDRE && (["fr", "en", "pt"].includes(LANGUE) || (LANGUE === "de" && APPRENDRE === "es"));
const TL = PHRASE_TRADUITE ? LANGUE : null;                  // la langue des phrases traduites, sinon rien
const traduction = t => t ? '<span class="trad" dir="auto">' + t + '</span>' : "";

// ---------- utilitaires ----------
const $ = id => document.getElementById(id);
const melanger = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
const hasard = a => a[Math.floor(Math.random() * a.length)];
const uniques = a => a.filter((x, i, l) => l.indexOf(x) === i);

const cible = t => '<span lang="' + APPRENDRE + '" dir="ltr">' + t + '</span>';
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const isoler = s => document.documentElement.dir !== "rtl" ? s : s.replace(/[A-Za-zÀ-ÿñÑßäöüÄÖÜ¿¡]+(?:[ ()?!,:.'’+=-]+[A-Za-zÀ-ÿñÑßäöüÄÖÜ¿¡]+)*[?!.]?/g, m => '<span dir="ltr">' + m + '</span>');
// une image deja publiee par un autre theme (Jan amene Ben a l'ecole : « La journee »)
const AILLEURS = {schulweg: "journee/familia-5.webp"};
const imgSrc = i => AILLEURS[i] || "ecole/" + i + ".webp";
const photo = i => '<img class="photo" alt="" src="' + imgSrc(i) + '">';
const espaces = s => s.replace(/\s+/g, " ").replace(/ ([.,!?])/g, "$1").trim();
function parler(type, extra){ try{ parent.postMessage(Object.assign({source:"wortando-scene", type}, extra || {}), "*"); }catch(e){} }
function dire(texte){ Voix.dire(texte); }
const HP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const ES_ = APPRENDRE === "es";

// ---------- les mots du theme (la forme du corpus) et leur traduction ----------
const MOTS = () => D.mots[APPRENDRE];
const memeMot = (a, b) => a && b && a.mot === b.mot && (a.genre || null) === (b.genre || null) && (a.cat || null) === (b.cat || null);
const glose = w => { const m = MOTS().find(x => memeMot(x, w)); return m ? (m.g[LANGUE] || m.g.fr || "") : ""; };
const nom = (mot, genre) => ({mot, genre});
const verbe = v => ({mot: v, cat: "verbe"});
const adj = a => ({mot: a, cat: "adjectif"});
const motDe = ([m, g]) => g === "adjectif" ? adj(m) : nom(m, g);
const auTheme = w => MOTS().some(x => memeMot(x, w));
let MOTS_THEME = null;
function motsDuTheme(){ return MOTS_THEME || (MOTS_THEME = MOTS().map(m => { const w = {mot: m.mot}; if (m.genre) w.genre = m.genre; if (m.cat) w.cat = m.cat; return w; })); }

// ---------- les phrases de la langue apprise ----------
const conj = v => CJ[v];
const decoupe = f => { const i = f.indexOf(" "); return i < 0 ? [f, ""] : [f.slice(0, i), f.slice(i + 1)]; };   // « holt ab » -> [holt, ab]
const forme = a => a.pl ? conj(a.v).pl : conj(a.v).er;
// « Mark holt Mia von der Kita ab. » / « Mark recoge a Mia en la guardería. »
function phrase(a){
  if (ES_) return espaces(a.s + " " + forme(a) + " " + (a.pa ? "a " + a.pa + " " : "") + a.c + ".");
  const [v, p] = decoupe(forme(a));
  return espaces(a.s + " " + v + " " + a.c + " " + p + ".");
}
const tradAct = a => TL ? a.t[TL] || null : null;
// l'infinitif et son complement : « Mia von der Kita abholen » / « recoger a Mia en la guardería »
const groupeVerbal = (a, v) => ES_ ? espaces(v + " " + (a.pa ? "a " + a.pa + " " : "") + a.c) : espaces(a.c + " " + v);
const actMots = a => [a.etat ? null : verbe(a.v)].concat(a.noms.map(motDe), a.adj ? [adj(a.adj)] : []).filter(Boolean);
const actsDe = w => ACT.filter(a => !w || actMots(a).some(m => memeMot(m, w)));

// les objets : « das Heft », « Ben braucht vier Hefte »
const objAff = k => OBJ[k].genre + " " + OBJ[k].mot;
const objMot = k => nom(OBJ[k].mot, OBJ[k].genre);
const objsDe = w => Object.keys(OBJ).filter(k => !w || memeMot(objMot(k), w));
const objPhrase = k => ES_ ? (OBJ[k].genre === "las" ? "Son " : "Es ") + objAff(k) + "." : "Das ist " + objAff(k) + ".";
function objTrad(k){

}
// « einen Bleistift », « vier Hefte » ; es « un lápiz », « cuatro lápices »
function quantite(k, n, faux){
  const o = OBJ[k], N = D.nombres[APPRENDRE];
  if (ES_){
    if (n === 1) return (o.genre === "la" ? "una" : "un") + " " + o.mot;
    return N[n] + " " + (faux ? o.mot : o.pl);
  }
  if (n === 1) return ({der: "einen", die: "eine", das: "ein"})[o.genre] + " " + o.mot;
  return N[n] + " " + (faux ? o.mot : o.pl);
}
function quantiteTrad(k, n){

    if (!w || memeMot(w, abholenMot()) || memeMot(w, kitaMot())) sources.push("abholung");
    // l'emploi du temps (6 nov. 2026, lot des themes) : sans lui, Mathe, Sport, Kunst et Musik n'avaient que la sorte
    // « horaire », et trois d'entre elles dans une seance de 6 en mettaient deux de suite
    const matV = w ? MAT_MOTS().find(c => memeMot(matMot(c), w)) : null;
    if (matV || !w) sources.push("horaire");
    if (!sources.length) return false;
    const src = hasard(sources), vrai = Math.random() < 0.5;
    let avant = "", dite, juste;
    if (src === "image"){
      const a = hasard(actsDe(w)); viser(w || actMots(a)[0]);
      const faux = hasard(ACT.filter(x => !memeImage(x, a) && x.s === a.s).concat(ACT.filter(x => !memeImage(x, a))).slice(0, 3));
      avant = photo(a.img); juste = phrase(a); dite = vrai ? juste : phrase(faux);
      tradQ = tradAct(a); dirQ = a.etat ? a.adj : a.v;
    } else if (src === "mot"){
      const rs = raisonsDe(w), m = tirerMot(w && rs.length ? hasard(rs) : null);
      viser(w || motDe(hasard(RA(m.r).mots)));
      const autreR = hasard(Object.keys(D.raisons[APPRENDRE]).filter(k => k !== m.r));
      avant = papierMot(m); juste = phraseMot(m); dite = vrai ? juste : phraseMot({...m, r: autreR});
      tradQ = tradMot(m); dirQ = motQ.genre ? motQ.genre + " " + motQ.mot : motQ.mot;
    } else if (src === "ferien"){
      const vac = w && memeMot(w, schuleMot()) ? false : w ? true : Math.random() < 0.5, d = tirerJourScolaire(vac);
      if (!d) return false;
      viser(w || (vac ? papMot("ferien") : schuleMot()));
      avant = papierFerien(); juste = phraseFerien(d, vac); dite = vrai ? juste : phraseFerien(d, !vac);
      tradQ = tradFerien(d, vac); dirQ = ES_ ? (vac ? "las vacaciones" : "el colegio") : (vac ? "die Ferien" : "die Schule");
    } else if (src === "horaire"){
      // une case de l'emploi du temps, montree : la bonne matiere, ou une autre
      const H = D.horaire, cases = [];
      [1, 2, 3, 4, 5].forEach(j => H[j].forEach((c, r) => { if (matV ? c === matV : MAT(c).mot) cases.push([j, r]); }));
      const [j, r] = hasard(cases), c = H[j][r];
      viser(w || matMot(c));
      const autre = hasard(Object.keys(D.matieres[APPRENDRE]).filter(x => x !== c));
      const ph = x => ES_ ? "El " + NOM_JOUR(j) + ", Ben tiene " + MAT(x).aff + " a la " + D.ordinaux.es[r + 1] + " hora." : "Am " + NOM_JOUR(j) + " hat Ben in der " + D.ordinaux.de[r + 1] + " Stunde " + MAT(x).aff + ".";
      avant = papierHoraire([j, r]); juste = ph(c); dite = vrai ? juste : ph(autre);
      tradQ = TL ? {fr: "Le " + NOM_JOUR(j, "fr") + ", en " + D.ordinaux.fr[r + 1] + " heure, Ben a " + D.matieresTrad[c].fr + ".", en: "On " + NOM_JOUR(j, "en") + ", Ben has " + D.matieresTrad[c].en + " in the " + D.ordinaux.en[r + 1] + " lesson.",
                    pt: cap(auJourSemaine(j, "pt")) + ", na " + D.ordinaux.pt[r + 1] + " aula, o Ben tem " + D.matieresTrad[c].pt + ".", de: "Am " + NOM_JOUR(j, "de") + " hat Ben in der " + D.ordinaux.de[r + 1] + " Stunde " + D.matieresTrad[c].de + "."}[TL] : null;
      dirQ = motQ.genre ? motQ.genre + " " + motQ.mot : motQ.mot;
    } else {
      viser(w || abholenMot());
      const s = tirerAbholung(), x = hasard(s), autreQui = hasard(Object.keys(D.abholer).filter(q => q !== x.qui));
      avant = papierAbholung(s); juste = phraseAbholung(x); dite = vrai ? juste : phraseAbholung({...x, qui: autreQui});
      tradQ = tradAbholung(x); dirQ = ES_ ? "recoger" : "abholen";
    }
    const rep = dite === juste ? VF()[0] : VF()[1];
    ecran("c_vraifaux", avant, dite, {centre: true});
    boutons($("choix"), VF(), rep, ok => juger(ok, rep, juste));
    return true;
  }
};
const SORTES = Object.keys(EX).filter(x => !(ES_ && x === "ordre") && !(!ES_ && x === "aPersonal"));

// ---------- la decouverte ----------
function textesAVoix(){
  if (!D) return [];
  const t = ACT.map(phrase).concat(Object.keys(OBJ).map(objAff), Object.keys(OBJ).map(objPhrase), Object.keys(LX).map(k => LX[k].nom));
  return [...new Set(t)];
}
function decouvrir(){
  $("compte").textContent = ""; $("barre").style.width = "0%";
  const z = $("zone");
  const imgsAct = uniques(ACT.map(a => a.img)), objs = Object.keys(OBJ);
  const planche = (id, items) => '<div class="planche" id="' + id + '">' + items.map(([k, img, label]) => '<button type="button" data-k="' + k + '" aria-label="' + esc(label) + '"><img alt="" src="' + imgSrc(img) + '"></button>').join("") + '</div>';
  z.innerHTML = '<p class="consigne">' + T("intro") + '</p><div class="fiche" id="fiche"></div>'
    + '<div class="section">' + T("secAct") + '</div>' + planche("pAct", imgsAct.map(i => ["i:" + i, i, phrase(ACT.find(a => a.img === i))]))
    + '<div class="section">' + T("secObj") + '</div>' + planche("pObj", objs.map(k => ["o:" + k, OBJ[k].img, objAff(k)]))
    + '<div class="section">' + T("secPap") + '</div>' + papierHoraire() + papierAbholung(tirerAbholung())
    + '<p class="regle">' + isoler(T(ES_ ? "regleEs" : "regleDe")) + '</p>';
  const fiche = (img, mot, sens, dits, trads) => {
    $("fiche").innerHTML = '<img alt="" src="' + imgSrc(img) + '"><div><div class="mot">' + cible(esc(mot)) + '</div><div class="sens">' + esc(sens || "") + '</div>'
      + dits.map((d, i) => '<div class="dit">' + cible(esc(d)) + '</div>' + traduction(trads[i])).join("") + '<div class="ligne"><button type="button" class="ecoute" id="ecoute" aria-label="' + T("ecouter") + '">' + HP + '</button></div></div>';
    $("ecoute").addEventListener("click", () => dire(dits.join(" ")));
    dire(dits.join(" "));
  };
  const choisir = cle => {
    document.querySelectorAll(".planche button").forEach(b => b.classList.toggle("choisi", b.dataset.k === cle));
    const [t, id] = cle.split(":");
    if (t === "i"){
      const as = ACT.filter(a => a.img === id), a = as.find(x => !x.etat) || as[0];
      fiche(id, a.etat ? a.adj : a.v, glose(a.etat ? adj(a.adj) : verbe(a.v)), as.map(phrase), as.map(tradAct));
    } else fiche(OBJ[id].img, objAff(id), glose(objMot(id)), [objPhrase(id)], [objTrad(id)]);
  };
  document.querySelectorAll(".planche button").forEach(b => b.addEventListener("click", () => choisir(b.dataset.k)));
  const garde = dire; dire = () => {}; choisir("i:" + imgsAct[0]); dire = garde;
  const s = $("suite"); s.textContent = T("commencer"); s.hidden = false;
  s.onclick = () => { s.onclick = null; Voix.arreter(); demarrer(); };
}

// ---------- LA PARTIE : recopiee de demarches.html (identique d'un theme a l'autre) ----------
const NEUFS_MAX = Q.get("seance") === "1" ? 3 : 10;
let vus = new Set(), sorteCourante = null, derniereSorte = null;
function cleQuestion(){
  const z = $("zone"), en = z.querySelector(".enonce"), pa = z.querySelector(".papier");
  return sorteCourante + "|" + (en ? en.textContent : "") + "|" + (pa ? pa.textContent : "") + "|" + Array.from(z.querySelectorAll("img")).map(i => i.getAttribute("src")).sort().join(",");
}
function remise(){ motQ = null; tradQ = null; choixFaux = null; dirQ = null; }
function montrer(){
  repondu = false; $("suite").hidden = true;
  $("compte").textContent = (rang + 1) + " / " + file.length;
  $("barre").style.width = (rang / file.length * 100) + "%";
  const garde = dire; dire = () => {};
  // La fin de partie (6 nov. 2026, recopiee de demarches.html, ec18b0a, le correctif de gato de la v1113 :
  // themes_illustres.py a vu des « sortes de suite » dans le lot des themes). Sur les trois derniers mots, une sorte est
  // ecartee si, prise maintenant, elle ne laisse a la suite aucune facon de finir sans deux sortes de suite.
  const fraiches = w => SORTES.filter(so => { for (let n = 0; n < 25; n++){ remise(); sorteCourante = so; if (!EX[so](w)) return false; if (!vus.has(cleQuestion())) return true; } return false; });
  const bloquantes = j => {             // file[j] pose la question du rang : file[rang] prend sa place plus loin
    const suite = file.slice(rang + 1).map((x, k) => rang + 1 + k === j ? file[rang] : x);
    if (!suite.length || suite.length > 3) return new Set();
    const q = suite.map(fraiches);
    const faisable = (i, prec) => i >= q.length || q[i].some(so => so !== prec && faisable(i + 1, so));
    return new Set(SORTES.filter(so => !faisable(0, so)));
  };
  const essai = (w, strict, exclues) => {
    const autres = melanger(SORTES.filter(x => x !== derniereSorte && !(strict && exclues && exclues.has(x))));
    for (const so of autres){
      for (let n = 0; n < 25; n++){
        remise(); sorteCourante = so;
        if (!EX[so](w)) break;
        if (!vus.has(cleQuestion())) return so;
      }
    }
    if (strict) return null;
    if (derniereSorte) for (let n = 0; n < 25; n++){
      remise(); sorteCourante = derniereSorte;
      if (!EX[derniereSorte](w)) break;
      if (!vus.has(cleQuestion())) return derniereSorte;
    }
    for (const so of autres.concat(derniereSorte ? [derniereSorte] : [])){
      remise(); sorteCourante = so;
      if (EX[so](w)) return so;
    }
    return null;
  };
  let fait = null;
  for (const fin of [true, false])      // d'abord en gardant une fin possible, puis sans
    for (let j = rang; !fait && j < file.length; j++){
      fait = essai(file[j], true, fin ? bloquantes(j) : null);
      if (fait && j !== rang) [file[rang], file[j]] = [file[j], file[rang]];
    }
  if (!fait) fait = essai(file[rang], false);
  dire = garde;
  if (fait === "entendre"){ const e = $("ecoute"); if (e) e.click(); }
  vus.add(cleQuestion()); derniereSorte = fait;
  window.scrollTo(0, 0); document.body.scrollTop = 0;
}
function fin(){
  $("barre").style.width = "100%"; $("compte").textContent = file.length + " / " + file.length; $("suite").hidden = true;
  $("zone").innerHTML = '<div class="fin"><div class="score">' + T("score", {b: bons, n: file.length}) + '</div></div>' + boutonsBas();
  brancherEncore();
  $("terminer").addEventListener("click", () => parler("fini", {bons, faits: file.length}));
}
function toutRevu(prochaine){
  $("barre").style.width = "100%"; $("compte").textContent = ""; $("suite").hidden = true;
  const quand = Tirage.revu(prochaine, LANGUE);
  $("zone").innerHTML = '<div class="fin"><div class="score">' + (TIRAGE_TEXTES.revu[LANGUE] || TIRAGE_TEXTES.revu.fr) + '</div>'
    + (quand ? '<p class="consigne">' + (TIRAGE_TEXTES.prochaine[LANGUE] || TIRAGE_TEXTES.prochaine.fr).replace("{d}", quand) + '</p>' : "")
    + '</div>' + boutonsBas();
  brancherEncore();
  $("terminer").addEventListener("click", () => parler("fini", {bons: 0, faits: 0}));
}
const boutonEncore = () => Q.get("seance") === "1" ? "" : '<button type="button" class="second" id="encore">' + (TIRAGE_TEXTES.encore[LANGUE] || TIRAGE_TEXTES.encore.fr) + '</button>';
const boutonsBas = () => '<div class="bas">' + boutonEncore() + '<button type="button" id="terminer">' + T("terminer") + '</button></div>';
function brancherEncore(){ const b = $("encore"); if (b) b.addEventListener("click", encoreDesQuestions); }
async function encoreDesQuestions(){
  const mots = motsDuTheme();
  file = Tirage.supplement(mots, await Tirage.demander(mots), NB); rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(null);
  montrer();
}
async function demarrer(){
  const mots = motsDuTheme();
  const plan = Tirage.plan(mots, await Tirage.demander(mots), NB, NEUFS_MAX);
  file = plan.file; rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(plan.prochaine);
  montrer();
}
$("suite").addEventListener("click", () => { if (!file.length) return; rang++; if (rang >= file.length) fin(); else montrer(); });
$("retour").addEventListener("click", () => parler("fermer"));
$("retour").setAttribute("aria-label", T("retourAria"));
$("titre").textContent = T("titre");
document.title = T("titre");
fetch("ecole/ecole.json?v=1").then(r => r.json()).then(d => {
  D = d; LX = D.lieux[APPRENDRE]; ACT = D.actions[APPRENDRE]; OBJ = D.objets[APPRENDRE]; CJ = D.conj[APPRENDRE]; NO = D.noms[APPRENDRE];
  if (Q.get("seance") === "1") demarrer(); else decouvrir();
});
