<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faire les courses</title>
<!--
  FAIRE LES COURSES (theme illustre, vague 3, 4 nov. 2026). L'angle : L'ACHAT DANS LES MAGASINS -- ou acheter quoi,
  aller au magasin (zur / zum, in der / im, auf dem Markt, am Kiosk ; al / a la, en el / en la), le dialogue au
  comptoir (le client et la vendeuse), les prix lus et entendus (neunundvierzig / vierundneunzig ; sesenta / setenta),
  l'accord du verbe (kostet / kosten, cuesta / cuestan), comparer (teurer, mas caro / mas cara), la monnaie rendue,
  le prospectus des offres (eine Packung, ein Glas, eine Tube, eine Tuete / un paquete, un bote, un tubo, una bolsa)
  et l'article de la commande (Ich haette gern einen Kuchen / Quisiera una tarta).
  PAS de doublon avec « Manger et gouter » (ses contenants, sa liste en grammes, sa commande AU CAFE) ; et pas de
  scene refaite : les magasins qui ont leur scene (baeckerei, supermarkt, apotheke, markt) en reprennent l'image.
  Donnees : visuel/courses/courses.py -> courses/courses.json ; les phrases sont FABRIQUEES ici depuis ces donnees.
  Les prix, les etiquettes et le prospectus sont dessines ici (fal ecrit mal).
  Ouverte par l'app dans le cadre des scenes (sceneCadre), elle parle comme une scene : « exercice » et « bonne »
  a chaque reponse, « reponse » {mot, genre, cat, juste} pour le mot teste, « fini » et « fermer ».
  Le tirage suit les mots (themes/tirage.js) ; la voix : themes/voix.js ; agrandir : themes/zoom.js.
  Parametres : apprendre=es|de, lang=<interface>, nuit=1, seance=1 (six questions, sans decouverte),
  variante=latam (papas fritas ; la voix de Monica), r=<AUDIO_REVISION> ; textesAVoix() pour visuel/voix_themes.py.
-->
<style>
:root{--fond1:#82AFDB;--fond3:#C0D6EA;--encre:#1C2430;--gris:#4C566B;--ambre:#E8A23A;--ambre-f:#A86A0E;--vert:#2F9E6A;--rouge:#C8473A;
  --verre:rgba(255,255,255,.88);--bord:rgba(255,255,255,.95);--carte:#F7F8FA;--papier:#FFFDF4;--ligne:#C9D6E8;
  --etiq:#FFE680;--etiq-bord:#E2B935;--prosp:#FFF6D8;--prosp-titre:#C8473A;
  --police:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html.nuit{--fond1:#0E1C26;--fond3:#18303F;--encre:#EEF2F5;--gris:#A9B8C4;--ambre-f:#E8A23A;--vert:#5CC98F;--rouge:#F07F72;
  --verre:rgba(20,36,50,.88);--bord:rgba(255,255,255,.14);--carte:#22384A;--papier:#2A3A48;--ligne:#3E5468;
  --etiq:#4A4020;--etiq-bord:#B8922A;--prosp:#2E3328;--prosp-titre:#F07F72}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
/* LA PAGE A LA HAUTEUR DE L'ECRAN, COMME UNE SCENE (regle commune, modele familia.html) */
html{height:100%;overflow:hidden}
body{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;box-sizing:border-box}
body{background:linear-gradient(180deg,var(--fond1),var(--fond3));background-attachment:fixed;color:var(--encre);font-family:var(--police);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 96px) max(10px,env(safe-area-inset-left,0px))}
.haut{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto 10px}
.retour{width:42px;height:42px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);color:var(--encre);font:800 22px var(--police);cursor:pointer;flex:0 0 auto}
html[dir="rtl"] .retour{transform:scaleX(-1)}
.titre{flex:1;font-weight:900;font-size:18px}
.compte{font-weight:800;font-size:14px;color:var(--gris)}
.barre{max-width:560px;margin:0 auto 12px;height:6px;border-radius:3px;background:rgba(28,36,48,.12);overflow:hidden}
.barre i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2BB5AA,#14807A);transition:width .3s}
main{max-width:560px;margin:0 auto;background:var(--verre);border:1px solid var(--bord);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}
.consigne{font-size:14px;font-weight:700;color:var(--gris);margin:0}
.enonce{direction:ltr;text-align:left;background:var(--carte);border-radius:14px;padding:12px 14px;font-weight:800;line-height:1.5;font-size:17px}
.enonce.centre{text-align:center;font-size:19px}
.enonce .sous{display:block;margin-top:6px}
.trou{display:inline-block;min-width:64px;border-bottom:2px solid var(--ambre);text-align:center;color:var(--ambre-f)}
/* une image : un magasin (une scene, en hauteur, recadree), une nature morte ou un moment en 4:3 */
.photo{display:block;width:100%;max-width:360px;margin:0 auto;height:auto;border-radius:16px;background:var(--carte)}
.photo.haute{aspect-ratio:4/5;object-fit:cover;object-position:50% 45%}
.photo.large{max-width:none;aspect-ratio:4/3;object-fit:cover}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix.centre{justify-content:center}
.choix button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:9px 15px;font:800 15px var(--police);cursor:pointer}
.choix button.juste{background:var(--vert);border-color:var(--vert);color:#fff}
.choix button.faux{background:var(--rouge);border-color:var(--rouge);color:#fff}
/* les prix a choisir : des etiquettes jaunes */
.choix.etiquettes button{border-radius:8px 8px 8px 22px;background:var(--etiq);border:2px solid var(--etiq-bord);font:900 20px var(--police);padding:10px 16px;font-variant-numeric:tabular-nums}
button:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
button:disabled{cursor:default}
.ecoute{width:44px;height:44px;border-radius:50%;border:2px solid var(--ambre);background:var(--verre);color:var(--encre);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.ecoute svg{width:22px;height:22px}
.retourMsg{min-height:1.4em;font-weight:800;font-size:15px;margin:0;line-height:1.45}
.retourMsg.ok{color:var(--vert)} .retourMsg.ko{color:var(--rouge)}
.retourMsg .phrase{display:block;color:var(--encre);font-weight:700}
/* trois ou quatre images a toucher (les emballages) */
.rangee{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rangee button{border:3px solid transparent;border-radius:14px;background:var(--carte);padding:0;cursor:pointer;overflow:hidden;display:block}
.rangee img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.rangee button.juste{border-color:var(--vert)} .rangee button.faux{border-color:var(--rouge)}
/* le prospectus des offres */
.prospekt{direction:ltr;background:var(--prosp);border-radius:14px;padding:10px 12px;border:1px solid var(--ligne)}
.prospekt .t{font-weight:900;font-size:17px;color:var(--prosp-titre);text-transform:uppercase;letter-spacing:.04em;text-align:center;margin-bottom:6px}
.prospekt .l{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed var(--ligne)}
.prospekt .l:last-child{border-bottom:0}
.prospekt .l img{width:64px;height:48px;object-fit:cover;border-radius:8px;flex:0 0 auto}
.prospekt .l .n{flex:1;font-weight:800;font-size:15px}
.prospekt .l .n small{display:block;font-weight:700;color:var(--gris);font-size:13px}
.prospekt .l .p{font:900 18px var(--police);background:var(--etiq);border:2px solid var(--etiq-bord);border-radius:6px 6px 6px 16px;padding:2px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
/* la decouverte : trois onglets, une planche, la fiche de ce qu'on touche */
.onglets{display:flex;gap:6px;background:var(--carte);border-radius:999px;padding:4px}
.onglets button{flex:1;border:0;border-radius:999px;background:none;color:var(--gris);font:800 14px var(--police);padding:8px 4px;cursor:pointer}
.onglets button[aria-selected="true"]{background:var(--ambre);color:#1C2430}
.planche{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.planche button{border:3px solid transparent;border-radius:12px;padding:0;background:var(--carte);cursor:pointer;overflow:hidden;display:block}
.planche img{display:block;width:100%;height:auto;aspect-ratio:3/4;object-fit:cover}
.planche button.choisi{border-color:var(--ambre)}
.planche.etiq{grid-template-columns:repeat(4,1fr)}
.planche.etiq button{background:var(--etiq);border:2px solid var(--etiq-bord);border-radius:8px 8px 8px 18px;font:900 16px var(--police);color:var(--encre);padding:12px 2px;font-variant-numeric:tabular-nums}
.planche.etiq button.choisi{outline:3px solid var(--ambre-f)}
.repliques{display:flex;flex-direction:column;gap:6px}
.repliques button{text-align:left;border:2px solid transparent;border-radius:12px;background:var(--carte);color:var(--encre);font:800 15px var(--police);padding:9px 12px;cursor:pointer;direction:ltr}
.repliques button.choisi{border-color:var(--ambre)}
.fiche{background:var(--carte);border-radius:14px;padding:10px;display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:12px;align-items:center}
.fiche.seule{grid-template-columns:1fr}
.fiche img{width:100%;height:auto;border-radius:10px;display:block;aspect-ratio:3/4;object-fit:cover}
.fiche .mot{font-weight:900;font-size:22px;color:var(--ambre-f);line-height:1.15}
.fiche .dit{font-weight:800;font-size:17px;line-height:1.4;margin-top:6px}
.fiche .ecoute{margin-top:10px}
.regle{margin:0;font-size:14px;font-weight:700;line-height:1.45;color:var(--gris);background:var(--carte);border-radius:12px;padding:10px 12px}
.suite{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:54px;border:0;border-radius:27px;
  color:#fff;font:800 17px var(--police);background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer;z-index:5000}
.suite[hidden]{display:none}
/* LES BOUTONS D'ACTION TOUJOURS TOUT EN BAS (regle de Jacques, 3 nov. 2026, comme dans les scenes) */
.bas{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:5000}
.bas[hidden]{display:none}
.bas button{flex:1;min-height:54px;border:0;border-radius:27px;padding:4px 12px;color:#fff;font:800 16px/1.15 var(--police);
  background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer}
.bas button.second{background:var(--verre);color:var(--encre);border:2px solid rgba(52,140,90,.9)}
.fin{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:10px 0}
.fin .score{font-size:22px;font-weight:900}
[lang]{unicode-bidi:isolate}
/* la traduction dans la langue d'interface : une ligne, plus petite, en gris (3 nov. 2026) */
.trad{display:block;font-size:13px;font-weight:600;color:var(--gris);line-height:1.35;margin-top:2px}
.trad.faux{color:var(--rouge);font-style:italic}
</style>
</head>
<body>
<div class="haut"><button class="retour" id="retour" type="button">‹</button><div class="titre" id="titre"></div><div class="compte" id="compte" dir="ltr"></div></div>
<div class="barre"><i id="barre"></i></div>
<main id="zone"></main>
<button class="suite" id="suite" type="button" hidden></button>
<div class="bas" id="bas" hidden></div>
<script src="themes/tirage.js?v=1"></script>
<script src="themes/voix.js?v=2"></script>
<script src="themes/zoom.js?v=4"></script>
<script src="themes/verre.js?v=3"></script>
<script>
const Q = new URLSearchParams(location.search);
const APPRENDRE = Q.get("apprendre") === "de" ? "de" : "es";
const LATAM = APPRENDRE === "es" && Q.get("variante") === "latam";
const LANGUE = (l => ["fr", "en", "tr", "uk", "fa", "ar", "pt", "pl", "ru", "de"].includes(l) ? l : "fr")(((Q.get("lang") || "fr").toLowerCase().split(/[-_]/)[0]));
if (Q.get("nuit") === "1") document.documentElement.classList.add("nuit");
document.documentElement.lang = LANGUE;
document.documentElement.dir = (LANGUE === "fa" || LANGUE === "ar") ? "rtl" : "ltr";
// vingt questions seul (Jacques, 3 nov.), six dans la seance du jour, sans la decouverte
const NB = Q.get("seance") === "1" ? 6 : 20;
// agrandir (themes/zoom.js) : un toucher sur une photo ou une fiche ; la loupe sur ce qu'on touche pour repondre
Zoom.init({direct: ".photo, .fiche img, .prospekt img", loupe: ".rangee button, .planche button", langue: LANGUE});

const TEXTES = {
  titre:     {fr:"Faire les courses", en:"Going shopping", tr:"Alışveriş yapmak", uk:"Покупки", fa:"خرید کردن", ar:"التسوق", pt:"Fazer compras", pl:"Zakupy", ru:"Покупки", de:"Einkaufen"},
  ongletM:   {fr:"Les magasins", en:"Shops", tr:"Dükkânlar", uk:"Магазини", fa:"مغازه‌ها", ar:"المتاجر", pt:"As lojas", pl:"Sklepy", ru:"Магазины", de:"Geschäfte"},
  ongletD:   {fr:"Au comptoir", en:"At the counter", tr:"Tezgâhta", uk:"Біля прилавка", fa:"پشت پیشخوان", ar:"عند المنضدة", pt:"No balcão", pl:"Przy ladzie", ru:"У прилавка", de:"An der Theke"},
  ongletP:   {fr:"Les prix", en:"Prices", tr:"Fiyatlar", uk:"Ціни", fa:"قیمت‌ها", ar:"الأسعار", pt:"Os preços", pl:"Ceny", ru:"Цены", de:"Preise"},
  introM:    {fr:"Touche un magasin : tu le vois, et tu entends ce qu'on y achète.", en:"Tap a shop to see it and hear what you buy there.", tr:"Bir dükkâna dokun: onu gör ve orada ne alındığını dinle.", uk:"Торкнися магазину: побачиш його й почуєш, що там купують.", fa:"روی یک مغازه بزن تا آن را ببینی و بشنوی آنجا چه می‌خرند.", ar:"المس متجرًا لتراه وتسمع ما يُشترى فيه.", pt:"Toque em uma loja para vê-la e ouvir o que se compra lá.", pl:"Dotknij sklepu, aby go zobaczyć i usłyszeć, co się tam kupuje.", ru:"Нажми на магазин, чтобы увидеть его и услышать, что там покупают.", de:"Tippe auf ein Geschäft: Du siehst es und hörst, was man dort kauft."},
  introD:    {fr:"Touche une réplique : tu entends la question et la réponse.", en:"Tap a line to hear the question and the answer.", tr:"Bir replik seç: soruyu ve cevabı dinle.", uk:"Торкнися репліки: почуєш запитання й відповідь.", fa:"روی یک جمله بزن تا سؤال و جواب را بشنوی.", ar:"المس عبارة لتسمع السؤال والجواب.", pt:"Toque em uma fala para ouvir a pergunta e a resposta.", pl:"Dotknij kwestii, aby usłyszeć pytanie i odpowiedź.", ru:"Нажми на реплику, чтобы услышать вопрос и ответ.", de:"Tippe auf einen Satz: Du hörst die Frage und die Antwort."},
  introP:    {fr:"Touche une étiquette : tu entends le prix.", en:"Tap a label to hear the price.", tr:"Bir etikete dokun: fiyatı dinle.", uk:"Торкнися цінника: почуєш ціну.", fa:"روی یک برچسب بزن تا قیمت را بشنوی.", ar:"المس بطاقة لتسمع السعر.", pt:"Toque em uma etiqueta para ouvir o preço.", pl:"Dotknij etykiety, aby usłyszeć cenę.", ru:"Нажми на ценник, чтобы услышать цену.", de:"Tippe auf ein Preisschild: Du hörst den Preis."},
  regleMde:  {fr:"Où on est (Wo?) : in der Bäckerei, im Supermarkt, auf dem Markt, am Kiosk. Où on va (Wohin?) : zur Bäckerei, zum Supermarkt.", en:"Where you are (Wo?): in der Bäckerei, im Supermarkt, auf dem Markt, am Kiosk. Where you go (Wohin?): zur Bäckerei, zum Supermarkt.", tr:"Neredesin (Wo?): in der Bäckerei, im Supermarkt, auf dem Markt, am Kiosk. Nereye gidiyorsun (Wohin?): zur Bäckerei, zum Supermarkt.", uk:"Де ти (Wo?): in der Bäckerei, im Supermarkt, auf dem Markt, am Kiosk. Куди йдеш (Wohin?): zur Bäckerei, zum Supermarkt.", fa:"کجا هستی (Wo?): in der Bäckerei، im Supermarkt، auf dem Markt، am Kiosk. کجا می‌روی (Wohin?): zur Bäckerei، zum Supermarkt.", ar:"أين أنت (Wo?): in der Bäckerei، im Supermarkt، auf dem Markt، am Kiosk. إلى أين تذهب (Wohin?): zur Bäckerei، zum Supermarkt.", pt:"Onde você está (Wo?): in der Bäckerei, im Supermarkt, auf dem Markt, am Kiosk. Para onde vai (Wohin?): zur Bäckerei, zum Supermarkt.", pl:"Gdzie jesteś (Wo?): in der Bäckerei, im Supermarkt, auf dem Markt, am Kiosk. Dokąd idziesz (Wohin?): zur Bäckerei, zum Supermarkt.", ru:"Где ты (Wo?): in der Bäckerei, im Supermarkt, auf dem Markt, am Kiosk. Куда идёшь (Wohin?): zur Bäckerei, zum Supermarkt.", de:"Wo? In der Bäckerei, im Supermarkt, auf dem Markt, am Kiosk. Wohin? Zur Bäckerei, zum Supermarkt."},

// ---------- les prix : « 2,49 € » a l'ecran, en lettres dans la voix (regle du 28 oct. : les nombres se disent) ----------
const prix = c => Math.floor(c / 100) + "," + String(c % 100).padStart(2, "0") + " €";
const prixEn = c => "€" + Math.floor(c / 100) + "." + String(c % 100).padStart(2, "0");
const ES_N = ["cero", "un", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve", "diez", "once", "doce", "trece", "catorce", "quince",
              "dieciséis", "diecisiete", "dieciocho", "diecinueve", "veinte", "veintiún", "veintidós", "veintitrés", "veinticuatro", "veinticinco",
              "veintiséis", "veintisiete", "veintiocho", "veintinueve"];
const ES_D = {3: "treinta", 4: "cuarenta", 5: "cincuenta", 6: "sesenta", 7: "setenta", 8: "ochenta", 9: "noventa"};
const DE_N = ["null", "ein", "zwei", "drei", "vier", "fünf", "sechs", "sieben", "acht", "neun", "zehn", "elf", "zwölf", "dreizehn", "vierzehn",
              "fünfzehn", "sechzehn", "siebzehn", "achtzehn", "neunzehn"];
const DE_D = {2: "zwanzig", 3: "dreißig", 4: "vierzig", 5: "fünfzig", 6: "sechzig", 7: "siebzig", 8: "achtzig", 9: "neunzig"};
function nombre(n, l){
  if (l === "es"){ if (n < 30) return ES_N[n]; const d = Math.floor(n / 10), u = n % 10; return ES_D[d] + (u ? " y " + (u === 1 ? "un" : ES_N[u]) : ""); }
  if (n < 20) return DE_N[n]; const d = Math.floor(n / 10), u = n % 10; return (u ? (u === 1 ? "ein" : DE_N[u]) + "und" : "") + DE_D[d];
}
// es : « cuatro euros con noventa », « un euro con veinte », « noventa céntimos » ; de : « vier Euro neunzig », « neunzig Cent »
function lettres(c){
  const e = Math.floor(c / 100), ct = c % 100;
  const esCt = n => nombre(n, "es").replace(/ un$/, " uno").replace(/^un$/, "uno").replace(/veintiún$/, "veintiuno");
  if (APPRENDRE === "es"){
    if (!e) return (ct === 1 ? "un céntimo" : nombre(ct, "es") + " céntimos");
    return nombre(e, "es") + (e === 1 ? " euro" : " euros") + (ct ? " con " + esCt(ct) : "");
  }
  if (!e) return nombre(ct, "de") + " Cent";
  return nombre(e, "de") + " Euro" + (ct ? " " + nombre(ct, "de").replace(/^ein$/, "eins") : "");
}

  const fiche = (image, mot, dit, trad, voix, prixVoix) => {
    $("fiche").className = "fiche" + (image ? "" : " seule");
    $("fiche").innerHTML = (image ? '<img alt="" src="' + image + '">' : "") + '<div><div class="mot">' + cible(mot) + '</div>' + (dit ? '<div class="dit">' + dit + '</div>' : "")
      + (trad ? traduction(isoler(trad)) : "") + '<button type="button" class="ecoute" id="ecoute" aria-label="' + T("ecouter") + '">' + HP + '</button></div>';
    const parle = () => { if (!muet) (prixVoix ? direPrix : dire)(voix); };
    $("ecoute").addEventListener("click", parle); parle();
  };
  const choisir = (pl, b) => pl.querySelectorAll("button").forEach(x => x.classList.toggle("choisi", x === b));
  const ONGLETS = {
    M(pl){ pl.className = "planche";
      MAGS().filter(m => m.pret).forEach(m => {
        const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", m[APPRENDRE].genre + " " + m[APPRENDRE].mot);
        b.innerHTML = '<img alt="" src="' + m.img + '">';
        b.addEventListener("click", () => { choisir(pl, b); const ph = phrases["mag-" + m.id].texte; fiche(m.img, m[APPRENDRE].genre + " " + m[APPRENDRE].mot, cible(ph), trDecouverte(m), ph); });
        pl.appendChild(b);
      });
      return pl.querySelector("button"); },
    D(pl){ pl.className = "repliques";
      D.paires.forEach(p => {
        const b = document.createElement("button"); b.type = "button"; b.lang = APPRENDRE; b.textContent = texteLigne(p.q);
        b.addEventListener("click", () => { choisir(pl, b);
          const dit = cible(maj(roleNom(ligne(p.q).r, "f")) + " : " + L.citer(texteLigne(p.q))) + "<br>" + cible(maj(roleNom(ligne(p.r).r, "m")) + " : " + L.citer(texteLigne(p.r)));
          const tq = tradLigne(p.q), trr = tradLigne(p.r);
          const prixVoix = !!(ligne(p.q).dit || ligne(p.r).dit);
          fiche(null, texteLigne(p.q), dit, tq && trr ? tq + " — " + trr : null, voixLigne(p.q) + " " + voixLigne(p.r), prixVoix); });
        pl.appendChild(b);
      });
      return pl.querySelector("button"); },
    P(pl){ pl.className = "planche etiq";
      PRIX_DECOUVERTE.forEach(c => {
        const b = document.createElement("button"); b.type = "button"; b.dir = "ltr"; b.textContent = prix(c);
        b.addEventListener("click", () => { choisir(pl, b); fiche(null, prix(c), cible(lettres(c)), null, lettres(c), true); });
        pl.appendChild(b);
      });
      return pl.querySelector("button"); }
  };
  const REGLES = {M: APPRENDRE === "de" ? "regleMde" : "regleMes", D: APPRENDRE === "de" ? "regleDde" : "regleDes", P: APPRENDRE === "de" ? "reglePde" : "reglePes"};
  const onglet = cle => {
    ["M", "D", "P"].forEach(k => $("o" + k).setAttribute("aria-selected", k === cle));
    $("intro").textContent = T("intro" + cle);
    $("regle").innerHTML = isoler(T(REGLES[cle]));
    const pl = $("planche"); pl.innerHTML = "";
    const premier = ONGLETS[cle](pl);
    // la fiche s'ouvre sur le premier, sans parler : le son ne vient que d'un geste
    muet = true;
    try { if (premier) premier.click(); } finally { muet = false; }
  };
  ["M", "D", "P"].forEach(k => $("o" + k).addEventListener("click", () => onglet(k)));
  onglet("M");
  const s = $("suite"); s.textContent = T("commencer"); s.hidden = false;
  s.onclick = () => { s.onclick = null; Voix.arreter(); demarrer(); };
}

// LA PARTIE (3 nov. 2026, « le tirage suit les mots ») : recopie de manger.html (identique d'un theme a l'autre).
const NEUFS_MAX = Q.get("seance") === "1" ? 3 : 10;
let vus = new Set(), sorteCourante = null, derniereSorte = null;
function cleQuestion(){
  const z = $("zone"), en = z.querySelector(".enonce");
  return sorteCourante + "|" + (en ? en.textContent : "") + "|" + Array.from(z.querySelectorAll("img")).map(i => i.getAttribute("src")).sort().join(",");
}
function montrer(){
  repondu = false; $("suite").hidden = true; $("bas").hidden = true; choixFaux = null;
  $("compte").textContent = (rang + 1) + " / " + file.length;
  $("barre").style.width = (rang / file.length * 100) + "%";
  const essai = (w, strict) => {
    const autres = melanger(SORTES.filter(x => x !== derniereSorte));
    for (const so of autres){
      for (let n = 0; n < 60; n++){
        motQ = null; sensQ = null; TRAD_CHOIX = null; sorteCourante = so;
        if (!EX[so](w)) break;
        if (!vus.has(cleQuestion())) return so;
      }
    }
    if (strict) return null;
    if (derniereSorte) for (let n = 0; n < 25; n++){
      motQ = null; sensQ = null; TRAD_CHOIX = null; sorteCourante = derniereSorte;
      if (!EX[derniereSorte](w)) break;
      if (!vus.has(cleQuestion())) return derniereSorte;
    }
    for (const so of autres.concat(derniereSorte ? [derniereSorte] : [])){
      motQ = null; sensQ = null; TRAD_CHOIX = null; sorteCourante = so;
      if (EX[so](w)) return so;
    }
    return null;
  };
  let fait = essai(file[rang], true);
  for (let j = rang + 1; !fait && j < file.length; j++){
    fait = essai(file[j], true);
    if (fait) [file[rang], file[j]] = [file[j], file[rang]];
  }
  if (!fait) fait = essai(file[rang], false);
  vus.add(cleQuestion()); derniereSorte = fait;
  window.scrollTo(0, 0); document.body.scrollTop = 0;
}
function fin(){
  $("barre").style.width = "100%"; $("compte").textContent = file.length + " / " + file.length; $("suite").hidden = true;
  $("zone").innerHTML = '<div class="fin"><div class="score">' + T("score", {b: bons, n: file.length}) + '</div></div>';
  boutonsBas(() => parler("fini", {bons, faits: file.length}));
}
function toutRevu(prochaine){
  $("barre").style.width = "100%"; $("compte").textContent = ""; $("suite").hidden = true;
  const quand = Tirage.revu(prochaine, LANGUE);
  $("zone").innerHTML = '<div class="fin"><div class="score">' + (TIRAGE_TEXTES.revu[LANGUE] || TIRAGE_TEXTES.revu.fr) + '</div>'
    + (quand ? '<p class="consigne">' + (TIRAGE_TEXTES.prochaine[LANGUE] || TIRAGE_TEXTES.prochaine.fr).replace("{d}", quand) + '</p>' : "")
    + '</div>';
  boutonsBas(() => parler("fini", {bons: 0, faits: 0}));
}
function boutonsBas(terminer){
  const b = $("bas");
  b.innerHTML = (Q.get("seance") === "1" ? "" : '<button type="button" class="second" id="encore">' + (TIRAGE_TEXTES.encore[LANGUE] || TIRAGE_TEXTES.encore.fr) + '</button>')
              + '<button type="button" id="terminer">' + T("terminer") + '</button>';
  b.hidden = false;
  const e = $("encore"); if (e) e.addEventListener("click", encoreDesQuestions);
  $("terminer").addEventListener("click", terminer);
}
async function encoreDesQuestions(){
  const mots = motsDuTheme();
  file = Tirage.supplement(mots, await Tirage.demander(mots), NB); rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(null);
  montrer();
}
async function demarrer(){
  const mots = motsDuTheme();
  const plan = Tirage.plan(mots, await Tirage.demander(mots), NB, NEUFS_MAX);
  file = plan.file; rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(plan.prochaine);
  montrer();
}
$("suite").addEventListener("click", () => { if (!file.length) return; rang++; if (rang >= file.length) fin(); else montrer(); });
$("retour").addEventListener("click", () => parler("fermer"));
$("retour").setAttribute("aria-label", T("retourAria"));
$("titre").textContent = T("titre");
document.title = T("titre");
fetch("courses/courses.json?v=1").then(r => r.json()).then(d => {
  D = d;
  if (Q.get("seance") === "1") demarrer(); else decouvrir();
});
</script>
