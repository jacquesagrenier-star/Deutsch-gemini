<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La ropa</title>
<!--
  LES VETEMENTS (theme illustre, 3 nov. 2026) : S'HABILLER SELON LA METEO ET L'OCCASION. Quatrieme theme illustre,
  lance par Jacques dans la vague 1 (« vetements : s'habiller selon la meteo et l'occasion »). Pas de magasin -- la
  scene kleidergeschaeft le montre deja (regle 2 : pas de theme qui refait une scene) : des PERSONNES HABILLEES, les
  douze de « Decrire une personne », dans la tenue qu'elles y portent deja, puis deux tenues de situation chacune (il
  pleut, il fait froid, il fait chaud, un mariage, le sport). Ce qu'on porte (lleva / tragt + accusatif), ce qu'on met
  et enleve (ponerse / quitarse, anziehen / ausziehen), quoi mettre selon le temps, et l'accord des couleurs.
  Donnees : visuel/ropa/ropa.py -> ropa/ropa.json (chaque tenue, piece par piece, couleur par couleur ; la meme liste
  fait le prompt de l'image). Les phrases sont FABRIQUEES depuis ces listes : une image ne dit que ce qu'elle montre.
  Ouverte par l'app dans le cadre des scenes (sceneCadre), elle parle comme une scene : « exercice » et « bonne » a
  chaque reponse, « reponse » {mot, genre, cat, juste} pour le mot teste, « fini » et « fermer » a la fin.
  Parametres : apprendre=es|de, lang=<interface>, nuit=1, seance=1 (six questions, pas de decouverte),
  variante=latam (unos jeans, unos tenis, la voix de Monica), r=<AUDIO_REVISION> (la voix de la decouverte).
  Le tirage suit les mots (themes/tirage.js, commun aux themes) : les dus, les rates, puis les nouveaux.
-->
<style>
:root{--fond1:#82AFDB;--fond3:#C0D6EA;--encre:#1C2430;--gris:#4C566B;--ambre:#E8A23A;--ambre-f:#A86A0E;--vert:#2F9E6A;--rouge:#C8473A;
  --verre:rgba(255,255,255,.88);--bord:rgba(255,255,255,.95);--carte:#F7F8FA;--picto:#2F6FA8;--police:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html.nuit{--fond1:#0E1C26;--fond3:#18303F;--encre:#EEF2F5;--gris:#A9B8C4;--ambre-f:#E8A23A;--vert:#5CC98F;--rouge:#F07F72;
  --verre:rgba(20,36,50,.88);--bord:rgba(255,255,255,.14);--carte:#22384A;--picto:#8EC3F0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,var(--fond1),var(--fond3));background-attachment:fixed;color:var(--encre);font-family:var(--police);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 100px) max(10px,env(safe-area-inset-left,0px))}
.haut{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto 10px}
.retour{width:42px;height:42px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);color:var(--encre);font:800 22px var(--police);cursor:pointer;flex:0 0 auto}
html[dir="rtl"] .retour{transform:scaleX(-1)}
.titre{flex:1;font-weight:900;font-size:18px}
.compte{font-weight:800;font-size:14px;color:var(--gris)}
.barre{max-width:560px;margin:0 auto 12px;height:6px;border-radius:3px;background:rgba(28,36,48,.12);overflow:hidden}
.barre i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2BB5AA,#14807A);transition:width .3s}
main{max-width:560px;margin:0 auto;background:var(--verre);border:1px solid var(--bord);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}
.consigne{font-size:14px;font-weight:700;color:var(--gris);margin:0}
.enonce{direction:ltr;text-align:left;background:var(--carte);border-radius:14px;padding:12px 14px;font-weight:800;line-height:1.5;font-size:17px}
.enonce.centre{text-align:center;font-size:19px}
.trou{display:inline-block;min-width:64px;border-bottom:2px solid var(--ambre);text-align:center;color:var(--ambre-f)}
/* une personne en pied (detouree) sur le fond de carte, jamais plus haute que l'ecran ne le permet */
.pied{display:flex;justify-content:center;align-items:flex-end;gap:10px;background:var(--carte);border-radius:16px;padding:10px 8px 6px}
.pied img{display:block;height:min(300px,38vh);width:auto;max-width:70%}
.picto{width:54px;height:54px;flex:0 0 auto;color:var(--picto);align-self:flex-start}
.picto svg{width:100%;height:100%;display:block}
/* quatre personnes a toucher, a l'echelle de leur taille (comme Decrire une personne) */
.rangee{display:flex;align-items:flex-end;justify-content:center;gap:4px;background:var(--carte);border-radius:14px;padding:10px 6px 6px}
.rangee button{flex:1 1 0;min-width:0;border:3px solid transparent;border-radius:14px;background:none;padding:2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;color:var(--gris);font:800 12px var(--police)}
.rangee img{display:block;width:auto;max-width:100%;object-fit:contain}
.rangee .nom{margin-top:2px}
.rangee button.juste{border-color:var(--vert)} .rangee button.faux{border-color:var(--rouge)}
.rangee button.choisi{border-color:var(--ambre)}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix.centre{justify-content:center}
.choix button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:9px 15px;font:800 15px var(--police);cursor:pointer}
.choix button.juste{background:var(--vert);border-color:var(--vert);color:#fff}
.choix button.faux{background:var(--rouge);border-color:var(--rouge);color:#fff}
button:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
button:disabled{cursor:default}
.retourMsg{min-height:1.4em;font-weight:800;font-size:15px;margin:0;line-height:1.45}
.retourMsg.ok{color:var(--vert)} .retourMsg.ko{color:var(--rouge)}
.retourMsg .phrase{display:block;color:var(--encre);font-weight:700}
/* la decouverte : six situations, les personnes de la situation, la fiche de celle qu'on touche */
.situations{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.situations button{border:2px solid transparent;border-radius:14px;background:var(--carte);color:var(--encre);font:800 13px var(--police);padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.situations button svg{width:28px;height:28px;color:var(--picto)}
.situations button[aria-selected="true"]{border-color:var(--ambre);background:var(--verre)}
#gens{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
#gens button{border:3px solid transparent;border-radius:12px;background:var(--carte);padding:0 0 2px;cursor:pointer;overflow:hidden;color:var(--gris);font:800 11px var(--police)}
#gens img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover}
#gens span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gens button.choisi{border-color:var(--ambre)}
.fiche{background:var(--carte);border-radius:14px;padding:10px;display:grid;grid-template-columns:minmax(90px,34%) 1fr;gap:12px;align-items:center}
.fiche img{width:100%;height:auto;max-height:46vh;object-fit:contain;display:block}
.fiche .dit{font-weight:800;font-size:17px;line-height:1.4}
.fiche .ecoute{margin-top:8px;width:44px;height:44px;border-radius:50%;border:2px solid var(--ambre);background:var(--verre);color:var(--encre);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fiche .ecoute svg{width:22px;height:22px}
.pastilles{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pastilles button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:5px 10px;font:800 13px var(--police);cursor:pointer}
.couleurs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.couleurs button{width:38px;height:38px;border-radius:50%;border:2px solid var(--bord);cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.18) inset}
.couleurs button.choisi{outline:3px solid var(--ambre);outline-offset:2px}
.formes{text-align:center;font-weight:800;font-size:16px;min-height:1.4em}
.regle{margin:0;font-size:14px;font-weight:700;line-height:1.45;color:var(--gris);background:var(--carte);border-radius:12px;padding:10px 12px}
.suite{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:54px;border:0;border-radius:27px;
  color:#fff;font:800 17px var(--police);background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer;z-index:5000}
/* la fin : « Encore des questions » et « Terminer » cote a cote, fixes tout en bas (comme familia.html) */
.bas{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:5000}
.bas button{flex:1 1 0;min-width:0;height:54px;border:0;border-radius:27px;padding:0 12px;color:#fff;font:800 16px/1.15 var(--police);
  background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer}
.trad.faux{color:var(--rouge);font-style:italic}
.suite[hidden]{display:none}
.fin{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:10px 0}
.fin .score{font-size:22px;font-weight:900}
.fin button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:10px 18px;font:800 16px var(--police);cursor:pointer}
[lang]{unicode-bidi:isolate}
/* la traduction dans la langue d'interface : une ligne, plus petite, en gris (3 nov. 2026) */
.trad{display:block;font-size:13px;font-weight:600;color:var(--gris);line-height:1.35;margin-top:2px}
</style>
</head>
<body>
<div class="haut"><button class="retour" id="retour" type="button">‹</button><div class="titre" id="titre"></div><div class="compte" id="compte" dir="ltr"></div></div>
<div class="barre"><i id="barre"></i></div>
<main id="zone"></main>
<button class="suite" id="suite" type="button" hidden></button>
<script src="themes/tirage.js?v=1"></script>
<script src="themes/voix.js?v=1"></script>
<script src="themes/zoom.js?v=3"></script>
<script>
const Q = new URLSearchParams(location.search);
const APPRENDRE = Q.get("apprendre") === "de" ? "de" : "es";
const LATAM = APPRENDRE === "es" && Q.get("variante") === "latam";
const LANGUE = (l => ["fr", "en", "tr", "uk", "fa", "ar", "pt", "pl", "ru", "de"].includes(l) ? l : "fr")(((Q.get("lang") || "fr").toLowerCase().split(/[-_]/)[0]));
if (Q.get("nuit") === "1") document.documentElement.classList.add("nuit");
document.documentElement.lang = LANGUE;
document.documentElement.dir = (LANGUE === "fa" || LANGUE === "ar") ? "rtl" : "ltr";
// agrandir (themes/zoom.js) : un toucher sur la photo d'une question ou d'une fiche, la loupe sur les personnes a choisir
Zoom.init({direct: ".pied img, .fiche img", loupe: ".rangee button, #gens button", langue: LANGUE});
// vingt questions seul (Jacques, 3 nov.), six dans la seance du jour, sans la decouverte
const NB = Q.get("seance") === "1" ? 6 : 20;

const TEXTES = {
  titre:     {fr:"Les vêtements", en:"Clothes", tr:"Giysiler", uk:"Одяг", fa:"لباس‌ها", ar:"الملابس", pt:"As roupas", pl:"Ubrania", ru:"Одежда", de:"Kleidung"},
  intro:     {fr:"Touche une personne : tu vois ce qu'elle porte, et tu l'entends.", en:"Tap a person to see and hear what they are wearing.", tr:"Bir kişiye dokun: ne giydiğini gör ve dinle.", uk:"Торкнися людини: побачиш і почуєш, у що вона вдягнена.", fa:"روی یک نفر بزن تا ببینی و بشنوی چه پوشیده است.", ar:"المس شخصًا لترى وتسمع ماذا يرتدي.", pt:"Toque em uma pessoa para ver e ouvir o que ela está usando.", pl:"Dotknij osoby, aby zobaczyć i usłyszeć, co ma na sobie.", ru:"Нажми на человека, чтобы увидеть и услышать, во что он одет.", de:"Tippe auf eine Person: Du siehst und hörst, was sie trägt."},
  couleurs:  {fr:"Touche une couleur : elle change avec le vêtement.", en:"Tap a colour: it changes with the piece of clothing.", tr:"Bir renge dokun: giysiye göre değişir.", uk:"Торкнися кольору: він змінюється разом з одягом.", fa:"روی یک رنگ بزن: با لباس تغییر می‌کند.", ar:"المس لونًا: يتغيّر بحسب قطعة الملابس.", pt:"Toque em uma cor: ela muda com a peça de roupa.", pl:"Dotknij koloru: zmienia się razem z ubraniem.", ru:"Нажми на цвет: он меняется вместе с одеждой.", de:"Tippe auf eine Farbe: Sie ändert sich mit dem Kleidungsstück."},
  diario:    {fr:"Tous les jours", en:"Every day", tr:"Her gün", uk:"Щодня", fa:"هر روز", ar:"كل يوم", pt:"Todo dia", pl:"Na co dzień", ru:"Каждый день", de:"Alltag"},
  lluvia:    {fr:"Il pleut", en:"Rain", tr:"Yağmur", uk:"Дощ", fa:"باران", ar:"المطر", pt:"Chuva", pl:"Deszcz", ru:"Дождь", de:"Regen"},
  frio:      {fr:"Il fait froid", en:"Cold", tr:"Soğuk", uk:"Холод", fa:"سرما", ar:"البرد", pt:"Frio", pl:"Zimno", ru:"Холод", de:"Kälte"},
  calor:     {fr:"Il fait chaud", en:"Heat", tr:"Sıcak", uk:"Спека", fa:"گرما", ar:"الحر", pt:"Calor", pl:"Upał", ru:"Жара", de:"Hitze"},
  boda:      {fr:"Un mariage", en:"A wedding", tr:"Düğün", uk:"Весілля", fa:"عروسی", ar:"حفل زفاف", pt:"Casamento", pl:"Wesele", ru:"Свадьба", de:"Hochzeit"},
  deporte:   {fr:"Le sport", en:"Sport", tr:"Spor", uk:"Спорт", fa:"ورزش", ar:"الرياضة", pt:"Esporte", pl:"Sport", ru:"Спорт", de:"Sport"},
  regleEs:   {fr:"La couleur vient après le vêtement et s'accorde avec lui : un abrigo rojo, una falda roja, unos zapatos rojos, unas botas rojas (azul, verde, gris, marrón ne changent qu'au pluriel). Mettre, enlever : se pone, se quita el abrigo.",
              en:"The colour comes after the piece of clothing and agrees with it: un abrigo rojo, una falda roja, unos zapatos rojos, unas botas rojas (azul, verde, gris, marrón only change in the plural). To put on, to take off: se pone, se quita el abrigo.",
              tr:"Renk giysiden sonra gelir ve ona uyar: un abrigo rojo, una falda roja, unos zapatos rojos, unas botas rojas (azul, verde, gris, marrón yalnızca çoğulda değişir). Giymek, çıkarmak: se pone, se quita el abrigo.",
              uk:"Колір стоїть після назви одягу й узгоджується з нею: un abrigo rojo, una falda roja, unos zapatos rojos, unas botas rojas (azul, verde, gris, marrón змінюються лише в множині). Одягти, зняти: se pone, se quita el abrigo.",
              fa:"رنگ بعد از نام لباس می‌آید و با آن هماهنگ می‌شود: un abrigo rojo، una falda roja، unos zapatos rojos، unas botas rojas (azul، verde، gris، marrón فقط در جمع تغییر می‌کنند). پوشیدن و درآوردن: se pone، se quita el abrigo.",
              ar:"يأتي اللون بعد قطعة الملابس ويتوافق معها: un abrigo rojo، una falda roja، unos zapatos rojos، unas botas rojas (لا تتغير azul وverde وgris وmarrón إلا في الجمع). اللبس والخلع: se pone، se quita el abrigo.",
              pt:"A cor vem depois da peça de roupa e concorda com ela: un abrigo rojo, una falda roja, unos zapatos rojos, unas botas rojas (azul, verde, gris, marrón só mudam no plural). Vestir, tirar: se pone, se quita el abrigo.",
              pl:"Kolor stoi po nazwie ubrania i zgadza się z nią: un abrigo rojo, una falda roja, unos zapatos rojos, unas botas rojas (azul, verde, gris, marrón zmieniają się tylko w liczbie mnogiej). Zakładać, zdejmować: se pone, se quita el abrigo.",
              ru:"Цвет стоит после названия одежды и согласуется с ним: un abrigo rojo, una falda roja, unos zapatos rojos, unas botas rojas (azul, verde, gris, marrón меняются только во множественном числе). Надеть, снять: se pone, se quita el abrigo.",
              de:"Die Farbe steht nach dem Kleidungsstück und richtet sich nach ihm: un abrigo rojo, una falda roja, unos zapatos rojos, unas botas rojas (azul, verde, gris, marrón ändern sich nur im Plural). Anziehen, ausziehen: se pone, se quita el abrigo."},
  regleDe:   {fr:"Après trägt, l'accusatif : einen roten Mantel, eine rote Jacke, ein rotes Kleid, rote Schuhe. Après ist, la couleur ne change pas : Der Mantel ist rot. Anziehen et ausziehen se coupent en deux : Er zieht den Mantel an.",
              en:"After trägt, the accusative: einen roten Mantel, eine rote Jacke, ein rotes Kleid, rote Schuhe. After ist, the colour does not change: Der Mantel ist rot. Anziehen and ausziehen split in two: Er zieht den Mantel an.",
              tr:"trägt'ten sonra -i hâli (Akkusativ): einen roten Mantel, eine rote Jacke, ein rotes Kleid, rote Schuhe. ist'ten sonra renk değişmez: Der Mantel ist rot. Anziehen ve ausziehen ikiye ayrılır: Er zieht den Mantel an.",
              uk:"Після trägt — знахідний відмінок: einen roten Mantel, eine rote Jacke, ein rotes Kleid, rote Schuhe. Після ist колір не змінюється: Der Mantel ist rot. Anziehen і ausziehen розпадаються на дві частини: Er zieht den Mantel an.",
              fa:"بعد از trägt حالت مفعولی (Akkusativ) می‌آید: einen roten Mantel، eine rote Jacke، ein rotes Kleid، rote Schuhe. بعد از ist رنگ تغییر نمی‌کند: Der Mantel ist rot. ‏anziehen و ausziehen دو تکه می‌شوند: Er zieht den Mantel an.",
              ar:"بعد trägt تأتي حالة النصب (Akkusativ): einen roten Mantel، eine rote Jacke، ein rotes Kleid، rote Schuhe. وبعد ist لا يتغير اللون: Der Mantel ist rot. ويُفصل anziehen وausziehen إلى جزأين: Er zieht den Mantel an.",
              pt:"Depois de trägt, o acusativo: einen roten Mantel, eine rote Jacke, ein rotes Kleid, rote Schuhe. Depois de ist, a cor não muda: Der Mantel ist rot. Anziehen e ausziehen se separam em dois: Er zieht den Mantel an.",
              pl:"Po trägt — biernik: einen roten Mantel, eine rote Jacke, ein rotes Kleid, rote Schuhe. Po ist kolor się nie zmienia: Der Mantel ist rot. Anziehen i ausziehen rozdzielają się na dwie części: Er zieht den Mantel an.",
              ru:"После trägt — винительный падеж: einen roten Mantel, eine rote Jacke, ein rotes Kleid, rote Schuhe. После ist цвет не меняется: Der Mantel ist rot. Anziehen и ausziehen распадаются на две части: Er zieht den Mantel an.",
              de:"Nach trägt steht der Akkusativ: einen roten Mantel, eine rote Jacke, ein rotes Kleid, rote Schuhe. Nach ist ändert sich die Farbe nicht: Der Mantel ist rot. Anziehen und ausziehen sind trennbar: Er zieht den Mantel an."},
  ecouter:   {fr:"Écouter", en:"Listen", tr:"Dinle", uk:"Слухати", fa:"گوش بده", ar:"استمع", pt:"Ouvir", pl:"Posłuchaj", ru:"Слушать", de:"Anhören"},
  commencer: {fr:"Commencer les exercices", en:"Start the exercises", tr:"Alıştırmalara başla", uk:"Почати вправи", fa:"شروع تمرین‌ها", ar:"ابدأ التمارين", pt:"Começar os exercícios", pl:"Zacznij ćwiczenia", ru:"Начать упражнения", de:"Übungen starten"},
  queLleva:  {fr:"Regarde la photo : que porte cette personne ?", en:"Look at the photo: what is this person wearing?", tr:"Fotoğrafa bak: bu kişi ne giyiyor?", uk:"Подивися на фото: у що вдягнена ця людина?", fa:"به عکس نگاه کن: این شخص چه پوشیده است؟", ar:"انظر إلى الصورة: ماذا يرتدي هذا الشخص؟", pt:"Olhe a foto: o que esta pessoa está usando?", pl:"Spójrz na zdjęcie: co ma na sobie ta osoba?", ru:"Посмотри на фото: во что одет этот человек?", de:"Sieh dir das Foto an: Was trägt diese Person?"},

// retenue par mot, sur le telephone (une commodite : sans stockage, on tire au hasard).
const CLE_VUS = "wortando_ropa_" + APPRENDRE;
let DERNIERS = {};
try { DERNIERS = JSON.parse(localStorage.getItem(CLE_VUS) || "{}") || {}; } catch(e){}
let vuQ = null;
function retenir(){ if (!vuQ) return; DERNIERS[vuQ[0]] = vuQ[1]; try { localStorage.setItem(CLE_VUS, JSON.stringify(DERNIERS)); } catch(e){} }
const cleMot = w => w ? w.k + ":" + (w.x || w.c || w.s || w.v) : null;
function choisir(liste, w, qui){
  const k = cleMot(w), autres = k ? liste.filter(x => qui(x) !== DERNIERS[k]) : liste, r = hasard(autres.length ? autres : liste);
  if (k) vuQ = [k, qui(r)];
  return r;
}
// toutes les [cle, tenue, piece] ou la piece se nomme ; un filtre facultatif
const PIECES_VUES = () => TENUES.flatMap(([cle, t]) => vus(t).map(x => [cle, t, x]));
// un leurre : un vetement qu'elle ne porte pas, d'aucune famille qu'elle porte, d'une couleur au hasard
function leurres(t, n, texte){
  const out = new Set(), libres = Object.keys(D.pieces).filter(y => !croise(t, y) && pourElle(y, t.p));
  for (let k = 0; k < 60 && out.size < n; k++){
    const y = hasard(libres); if (!y) break;
    const c = ["gafasSol", "sombrero"].includes(y) && Math.random() < 0.5 ? null : hasard(Object.keys(D.couleurs));
    out.add(texte(y, c));
  }
  return [...out];
}

// ---------- les exercices ----------
// Chaque sorte sait viser un mot w (false si elle ne le peut pas) ; sans w, une question au hasard (les controles).
const EX = {
  // « ¿Que lleva Carmen? » / « Was tragt Carmen? » : une photo, quatre vetements, un seul porte
  queLleva(w){
    if (w && w.k !== "piece") return false;
    const cand = PIECES_VUES().filter(([, , x]) => !w || x[0] === w.x);
    if (!cand.length) return false;
    const [, t, x] = choisir(cand, w, c => c[1].p), rep = L.item(x[0], x[1]);
    motQ = w || motPiece(x[0]); sensQ = {p: t.p, items: [x], sit: null};
    const opts = [rep, ...leurres(t, 3, (y, c) => { const o = L.item(y, c); SENS.set(o, sensPiece(y, c)); return o; })];
    if (opts.length < 3) return false;
    ecran("queLleva", photo(t), L.queLleva(t.p), true);
    boutons($("choix"), melanger(opts), rep, ok => juger(ok, rep, L.phrase(t.p, [x], null)));
    return true;
  },
  // « ¿Quien lleva un abrigo rojo? » : quatre personnes ; aucune autre ne porte rien de la meme famille, sauf la
  // meme piece d'une couleur franchement autre (« una falda roja » face a une jupe bleue)
  quien(w){
    if (w && w.k !== "piece") return false;
    const cand = PIECES_VUES().filter(([, , x]) => !w || x[0] === w.x);
    for (let essai = 0; essai < 8 && cand.length; essai++){
      const [cle, t, x] = choisir(cand, w, c => c[1].p);
      const va = t2 => t2.p !== t.p && !(x[0] === "gafasSol" && D.lunettes.includes(t2.p)) && t2.pieces.every(y => {
        if (!famsDe(y[0]).some(f => famsDe(x[0]).includes(f))) return true;
        return y[0] === x[0] && x[1] && y[1] && !(y[2] && y[2].q === false) && loinC(x[1], y[1]);
      });
      const pris = [[cle, t]];
      for (const [c2, t2] of melanger(TENUES)){ if (pris.length >= 4) break; if (va(t2) && !pris.some(([, u]) => u.p === t2.p)) pris.push([c2, t2]); }
      if (pris.length < 4) continue;
      motQ = w || motPiece(x[0]); sensQ = {p: t.p, items: [x], sit: null};
      ecranRangee("quien", L.quien(x[0], x[1]), "", pris, cle, ok => juger(ok, nom(t.p), L.phrase(t.p, [x], null)));
      return true;
    }
    return false;
  },
  // « ¿De que color es el abrigo de Carmen? » / « Welche Farbe hat der Mantel von Carmen? »
  couleur(w){
    if (w && w.k !== "couleur" && w.k !== "piece") return false;
    const cand = PIECES_VUES().filter(([, , x]) => x[1] && (!w || (w.k === "piece" ? x[0] === w.x : x[1] === w.c)));
    if (!cand.length) return false;
    const [, t, x] = choisir(cand, w, c => c[1].p), c = x[1];
    const forme = k => { const o = APPRENDRE === "de" ? D.couleurs[k].de : ES.couleur(x[0], k); SENS.set(o, sensCouleur(k)); return o; };
    const rep = forme(c), autres = melanger(Object.keys(D.couleurs).filter(k => loinC(k, c))).slice(0, 3).map(forme);
    motQ = w || motCouleur(c); sensQ = {p: t.p, items: [x], sit: null};
    ecran("couleur", photo(t), L.couleurQ(x[0], t.p), true);
    boutons($("choix"), melanger([rep, ...autres]), rep, ok => juger(ok, rep, L.couleurR(x[0], t.p, c)));
    return true;
  },
  // « Carmen lleva una falda ___. » roja / rojo / rojas / rojos -- les couleurs qui changent (pas rosa)
  accord(w){
    if (w && w.k !== "couleur" && w.k !== "piece") return false;
    const cand = PIECES_VUES().filter(([, , x]) => x[1] && x[1] !== "rosa" && (!w || (w.k === "piece" ? x[0] === w.x : x[1] === w.c)));
    if (!cand.length) return false;
    const [, t, x] = choisir(cand, w, c => c[1].p), formes = [...new Set(D.couleurs[x[1]].es)], rep = ES.couleur(x[0], x[1]);
    const debut = nom(t.p) + " lleva " + ES.item(x[0], null) + " ___.";
    motQ = w || motCouleur(x[1]); sensQ = {p: t.p, items: [x], sit: null};
    ecran("accord", photo(t), avecTrou(debut));
    boutons($("choix"), melanger(formes), rep, ok => { $("trou").textContent = rep; juger(ok, rep, debut.replace("___", rep)); });
    return true;
  },
  // « Carmen tragt einen ___ Mantel. » roten / rote / rotes / roter ; et « Der Mantel von Carmen ist ___. » rot
  endung(w){
    if (w && w.k !== "couleur" && w.k !== "piece") return false;
    const cand = PIECES_VUES().filter(([, , x]) => x[1] && x[1] !== "rosa" && (!w || (w.k === "piece" ? x[0] === w.x : x[1] === w.c)));
    if (!cand.length) return false;
    const [, t, x] = choisir(cand, w, c => c[1].p), r = D.couleurs[x[1]].de, g = DE.g(x[0]);
    let phrase, rep, opts;
    if (Math.random() < 0.7){
      const art = {m: "einen ", f: "eine ", n: "ein ", p: ""}[g];
      phrase = nom(t.p) + " trägt " + art + "___ " + PI(x[0]).de[2] + "."; rep = DE.adj(x[1], g); opts = [r + "en", r + "e", r + "es", r + "er"];
    } else {
      const s = DE.defNom(x[0]);
      phrase = s[0].toUpperCase() + s.slice(1) + " von " + nom(t.p) + (pluriel(x[0]) ? " sind" : " ist") + " ___."; rep = r; opts = [r, r + "e", r + "en", r + "er"];
    }
    motQ = w || motCouleur(x[1]); sensQ = {p: t.p, items: [x], sit: null};
    ecran("endung", photo(t), avecTrou(phrase));
    boutons($("choix"), melanger(opts), rep, ok => { $("trou").textContent = rep; juger(ok, rep, phrase.replace("___", rep)); });
    return true;
  },
  // « ¿Por que lleva Anna esta ropa? » : Llueve / Hace calor / Va a una boda... -- jamais deux reponses defendables
  tiempo(w){
    if (w && w.k !== "sit") return false;
    const cand = TENUES.filter(([, t]) => t.sit !== "diario" && (!w || t.sit === w.s));
    if (!cand.length) return false;
    const [, t] = choisir(cand, w, c => c[1].p), rep = APPRENDRE === "de" ? DE.sitRep(t.p)[t.sit] : ES.sitRep[t.sit];
    const texte = s => { const o = APPRENDRE === "de" ? DE.sitRep(t.p)[s] : ES.sitRep[s]; SENS.set(o, sensSit(s, t.p)); return o; };
    const autres = melanger(D.contraires[t.sit]).slice(0, 3).map(texte);
    motQ = w || motSit(t.sit); sensQ = {p: t.p, items: vus(t), sit: t.sit};
    ecran("tiempo", photo(t), L.pourquoi(t.p), true);
    boutons($("choix"), melanger([rep, ...autres]), rep, ok => juger(ok, rep, L.phrase(t.p, vus(t), t.sit)));
    return true;
  },
  // « Llueve. ¿Quien va bien vestido? » : une personne de la situation, trois d'une situation contraire
  bienVestido(w){
    if (w && w.k !== "sit") return false;
    const cand = TENUES.filter(([, t]) => t.sit !== "diario" && (!w || t.sit === w.s));
    for (let essai = 0; essai < 6 && cand.length; essai++){
      const [cle, t] = choisir(cand, w, c => c[1].p), pris = [[cle, t]];
      for (const [c2, t2] of melanger(TENUES)){ if (pris.length >= 4) break; if (D.contraires[t.sit].includes(t2.sit) && !pris.some(([, u]) => u.p === t2.p)) pris.push([c2, t2]); }
      if (pris.length < 4) continue;
      motQ = w || motSit(t.sit); sensQ = {p: t.p, items: vus(t), sit: t.sit};
      ecranRangee("bienVestido", L.bienVestido[t.sit], '<div class="pied" style="padding:6px">' + picto(t.sit) + '</div>', pris, cle, ok => juger(ok, nom(t.p), L.phrase(t.p, vus(t), t.sit)));
      return true;
    }
    return false;
  },
  // « Hace frio. Mark sale a la calle y ___ la bufanda. » se pone / se quita -- la photo le montre avec
  ponerQuitar(w){
    if (w && w.k !== "verbe") return false;
    const v = w ? w.v : (Math.random() < 0.5 ? "pone" : "quita");
    const cand = PIECES_VUES().filter(([, t, x]) => (D.mettre[t.sit] || {})[v] && D.mettre[t.sit][v].includes(x[0]) && mettable(x[0]));
    if (!cand.length) return false;
    const [, t, x] = choisir(cand, w, c => c[1].p);
    motQ = w || motVerbe(v); sensQ = {p: t.p, sit: t.sit, x: x[0], v};
    let phrase, rep, opts;
    if (APPRENDRE === "de"){ phrase = DE.phraseMettre(t.p, t.sit, x[0], v, true); rep = v === "pone" ? "an" : "aus"; opts = ["an", "aus"]; }
    else { phrase = ES.mettre[t.sit][v].replace("{P}", nom(t.p)).replace("{X}", ES.item(x[0], null, true)); rep = ES.verbes[v]; opts = [ES.verbes.pone, ES.verbes.quita]; }
    ecran(APPRENDRE === "de" ? "ponerQuitar" : "ponerQuitar", photo(t), avecTrou(phrase));
    boutons($("choix"), opts, rep, ok => { $("trou").textContent = rep; juger(ok, rep, phrase.replace("___", rep)); });
    return true;
  },
  // « Hace frio. ¿Que se pone Mark? » el abrigo / las sandalias / el banador... -- Mark dans sa tenue de tous les jours
  queSePone(w){
    if (w && w.k !== "piece") return false;
    const met = (x, p) => mettable(x) && !(x === "gafasSol" && D.lunettes.includes(p));
    const sits = Object.keys(D.typique).filter(s => !w || D.typique[s].includes(w.x));
    const cand = TENUES.filter(([, t]) => t.sit === "diario").flatMap(([cle, t]) => sits.flatMap(s => D.typique[s].filter(x => (!w || x === w.x) && met(x, t.p) && pourElle(x, t.p)).map(x => [cle, t, s, x])));
    if (!cand.length) return false;
    const [, t, s, x] = choisir(cand, w, c => c[1].p);
    const texte = y => { const o = APPRENDRE === "de" ? DE.defAcc(y) : ES.item(y, null, true); SENS.set(o, sensPiece(y, null)); return o; }, rep = texte(x);
    // les leurres sont franchement deplaces : une cravate pour courir se refuse, qu'on soit homme ou femme
    const autres = melanger(D.deplace[s].filter(y => met(y, t.p))).slice(0, 3).map(texte);
    if (autres.length < 2) return false;
    motQ = w || motPiece(x); sensQ = {p: t.p, sit: s, x, pone: true};
    ecran("queSePone", photo(t, s), L.queSePone(t.p, s), true);
    boutons($("choix"), melanger([rep, ...autres]), rep, bon => juger(bon, rep, L.sePone(t.p, s, x)));
    return true;
  },
  // « Hace frio. Nosotros ___ el abrigo. » me pongo / te pones / se pone / nos ponemos -- et « Es ist kalt. Wir ___ den
  // Mantel an. » ziehe / ziehst / zieht / ziehen : le verbe pronominal, le verbe separable, a toutes les personnes
  conjuguer(w){
    if (w && w.k !== "verbe") return false;
    const v = w ? w.v : (Math.random() < 0.5 ? "pone" : "quita");
    const cand = Object.keys(CONJ_INTRO).flatMap(s => (D.mettre[s][v] || []).filter(mettable).map(x => [s, x]));
    if (!cand.length) return false;
    // les pronoms, pas des prenoms : « Mark y Rosa » puis « Pablo y Elena » ne feraient pas une question de plus
    const [s, x] = hasard(cand), k = Math.floor(Math.random() * 5), g = Math.random() < 0.5;
    let phrase, rep, opts;
    if (APPRENDRE === "de"){
      const S = ["Ich", "Du", g ? "Sie" : "Er", "Wir", "Ihr"][k], [V, Tp] = DE.vp(x, v), formes = DE_CONJ[V];
      rep = formes[k]; opts = [...new Set(formes)];
      phrase = v === "pone" ? (CONJ_INTRO[s].de ? CONJ_INTRO[s].de + " " : "") + S + " ___ " + DE.defAcc(x) + " " + Tp + "."
                            : DE_RENTRE[s] + " ___ " + S.toLowerCase() + " " + DE.defAcc(x) + " " + Tp + ".";
    } else {
      const S = ["Yo", "Tú", g ? "Ella" : "Él", "Nosotros", g ? "Ellas" : "Ellos"][k], formes = ES_CONJ[v];
      rep = formes[k]; opts = melanger(formes.filter(f => f !== rep)).slice(0, 3).concat(rep);
      phrase = v === "pone" ? (CONJ_INTRO[s].es ? CONJ_INTRO[s].es + " " : "") + S + " ___ " + ES.item(x, null, true) + "."
                            : ES_RENTRE[s] + " " + S.toLowerCase() + " ___ " + ES.item(x, null, true) + ".";
    }
    motQ = w || motVerbe(v); sensQ = {conj: true, k, g, sit: s, x, v};
    ecran("conjuguer", '<div class="pied" style="padding:6px">' + picto(s) + '</div>', avecTrou(phrase));
    boutons($("choix"), melanger(opts), rep, ok => { $("trou").textContent = rep; juger(ok, rep, phrase.replace("___", rep)); });
    return true;
  },
  // « Carmen lleva un abrigo rojo. » vrai ou faux ; le faux change la couleur (franchement) ou nomme un vetement
  // d'une famille qu'elle ne porte pas
  vraifaux(w){
    if (w && w.k !== "piece" && w.k !== "couleur") return false;
    // [tenue, ce qu'on dit, le mot vise] ou null ; le vrai et le faux au hasard, l'autre si le premier ne se peut pas
    const leVrai = () => {
      const cand = PIECES_VUES().filter(([, , x]) => !w || (w.k === "piece" ? x[0] === w.x : x[1] === w.c));
      if (!cand.length) return null;
      const r = choisir(cand, w, c => c[1].p); return [r[1], [r[2][0], r[2][1]], w || motPiece(r[2][0])];
    };
    const leFaux = () => {
      if (w && w.k === "couleur"){
        // une piece de couleur franchement autre, dite de la couleur visee
        const cand = PIECES_VUES().filter(([, , x]) => x[1] && loinC(x[1], w.c));
        if (!cand.length) return null;
        const r = choisir(cand, w, c => c[1].p); return [r[1], [r[2][0], w.c], w];
      }
      const x = w ? w.x : hasard(Object.keys(D.pieces));
      const autreCouleur = PIECES_VUES().filter(([, , y]) => y[0] === x && y[1]);
      const ailleurs = TENUES.filter(([, u]) => !croise(u, x) && pourElle(x, u.p));
      if (autreCouleur.length && (Math.random() < 0.5 || !ailleurs.length)){
        const r = choisir(autreCouleur, w, c => c[1].p), cs = Object.keys(D.couleurs).filter(k => loinC(k, r[2][1]));
        return [r[1], [x, hasard(cs)], w || motPiece(x)];
      }
      if (!ailleurs.length) return null;
      // sans couleur : « Carmen lleva un sombrero » (elle n'en porte pas) -- le meme faux en dix couleurs ne ferait
      // pas dix questions
      return [choisir(ailleurs, w, c => c[1].p)[1], [x, null], w || motPiece(x)];
    };
    let vrai = Math.random() < 0.5, r = vrai ? leVrai() : leFaux();
    if (!r){ vrai = !vrai; r = vrai ? leVrai() : leFaux(); }
    if (!r) return false;
    const [t, dit, mot] = r;
    motQ = mot; sensQ = {p: t.p, items: vus(t), sit: null};
    ecran("vraifaux", photo(t), L.phrase(t.p, [dit], null), true);
    const rep = vrai ? L.vrai : L.faux;
    boutons($("choix"), [L.vrai, L.faux], rep, ok => juger(ok, rep, L.phrase(t.p, vus(t), null)));
    return true;
  }
};
// les sortes de la langue apprise : l'accord en espagnol, la terminaison en allemand
const SORTES = Object.keys(EX).filter(x => APPRENDRE === "es" ? x !== "endung" : x !== "accord");

// la bande des couleurs : rojo · roja · rojos · rojas ; rot · einen roten Mantel · eine rote Jacke · ein rotes Kleid
const formesCouleur = c => { const r = D.couleurs[c].de;
  return APPRENDRE === "de" ? (r === "rosa" ? [r] : [r, "einen " + r + "en Mantel", "eine " + r + "e Jacke", "ein " + r + "es Kleid"]) : [...new Set(D.couleurs[c].es)]; };
// ---------- la decouverte : les situations, les personnes, ce qu'elles portent ----------
function decouvrir(){
  $("compte").textContent = ""; $("barre").style.width = "0%";
  const z = $("zone"), phrases = D.phrases[APPRENDRE === "de" ? "de" : LATAM ? "latam" : "es"];
  const sits = D.situations.filter(s => TENUES.some(([, t]) => t.sit === s));
  z.innerHTML = '<div class="situations" role="tablist" id="sits"></div><p class="consigne">' + T("intro") + '</p><div id="gens"></div><div class="fiche" id="fiche"></div>'
              + '<p class="consigne">' + T("couleurs") + '</p><div class="couleurs" id="couleurs"></div><div class="formes" id="formes"></div>'
              + '<p class="regle">' + isoler(T(APPRENDRE === "de" ? "regleDe" : "regleEs")) + '</p>';
  const montrer = cle => {
    const t = D.tenues[cle], ph = phrases[cle];
    $("gens").querySelectorAll("button").forEach(b => b.classList.toggle("choisi", b.dataset.id === cle));
    const tl = traduire({p: t.p, items: vus(t), sit: t.sit === "diario" ? null : t.sit}) || (TR ? null : glose(motPiece(vus(t)[0][0])));
    $("fiche").innerHTML = '<img alt="' + nom(t.p) + '" src="' + imgT(t) + '"><div><div class="dit">' + cible(ph.texte) + '</div>' + (tl ? traduction(tl) : "")
      + '<button type="button" class="ecoute" id="ecoute" aria-label="' + T("ecouter") + '">' + HP + '</button><div class="pastilles" id="pastilles"></div></div>';
    $("ecoute").addEventListener("click", () => dire(ph.texte));
    vus(t).forEach(x => {
      const b = document.createElement("button"); b.type = "button"; b.lang = APPRENDRE; b.dir = "ltr";
      b.textContent = APPRENDRE === "de" ? DE.defNom(x[0]) : ES.item(x[0], null, true);
      b.addEventListener("click", () => dire(L.item(x[0], x[1])));
      $("pastilles").appendChild(b);
    });
    dire(ph.texte);
  };
  const onglet = s => {
    $("sits").querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b.dataset.s === s));
    // les visages de la situation (jusqu'a douze) : on en touche un, la fiche le montre en pied
    const liste = TENUES.filter(([, t]) => t.sit === s), gens = $("gens"); gens.innerHTML = "";
    liste.forEach(([cle, t]) => {
      const b = document.createElement("button"); b.type = "button"; b.dataset.id = cle; b.setAttribute("aria-label", nom(t.p));
      b.innerHTML = '<img alt="" src="descripcion/' + t.p + '-visage.webp"><span>' + nom(t.p) + '</span>';
      b.addEventListener("click", () => montrer(cle));
      gens.appendChild(b);
    });
    const garde = dire; dire = () => {}; montrer(liste[0][0]); dire = garde;   // le son ne vient que d'un geste
  };
  sits.forEach(s => {
    const b = document.createElement("button"); b.type = "button"; b.setAttribute("role", "tab"); b.dataset.s = s;
    b.innerHTML = PICTOS[s] + '<span>' + T(s) + '</span>';
    b.addEventListener("click", () => onglet(s));
    $("sits").appendChild(b);
  });
  // la bande des couleurs : rojo · roja · rojos · rojas ; rot -> roter, rote, rotes, rote (apres ein / eine / ein, au nominatif)
  Object.keys(D.couleurs).forEach(c => {
    const b = document.createElement("button"); b.type = "button"; b.style.background = COULEUR_CSS[c];
    const formes = formesCouleur(c);
    b.setAttribute("aria-label", formes[0]);
    b.addEventListener("click", () => {
      $("couleurs").querySelectorAll("button").forEach(x => x.classList.toggle("choisi", x === b));
      const m = motCouleur(c), g = TR ? null : glose(m);
      $("formes").innerHTML = cible(formes.join(" · ")) + (TR && TR !== "de" && TRADS[TR].couleurs ? traduction([].concat(TRADS[TR].couleurs[c])[0]) : TR === "de" ? traduction(D.couleurs[c].de) : g ? traduction(g) : "");
      dire(formes.join(", "));
    });
    $("couleurs").appendChild(b);
  });
  onglet(sits[0]);
  const s = $("suite"); s.textContent = T("commencer"); s.hidden = false;
  s.onclick = () => { s.onclick = null; Voix.arreter(); demarrer(); };
}

// LES MOTS DU THEME (le tirage suit les mots, 3 nov. 2026), a la forme du corpus, cles de la progression commune :
// les vetements, les couleurs, la meteo et l'occasion, mettre et enlever. Seulement ceux qu'une question sait viser
// avec les images faites, et par DEUX sortes au moins (sinon deux questions de la meme sorte se suivraient) : on
// l'essaie, une fois, au chargement. Avant les tenues de situation, la cravate n'a que le vrai ou faux : elle attend.
let MOTS = null;
function motsDuTheme(){
  if (MOTS) return MOTS;
  const tous = Object.keys(D.pieces).map(motPiece).concat(Object.keys(D.couleurs).map(motCouleur),
               Object.keys(D.motSituation[APPRENDRE]).map(motSit), ["pone", "quita"].map(motVerbe));
  MOTS = tous.filter(w => SORTES.filter(so => { for (let n = 0; n < 6; n++){ vuQ = null; if (EX[so](w)) return true; } return false; }).length >= 2);
  vuQ = null; motQ = null; sensQ = null; $("zone").innerHTML = "";
  return MOTS;
}

// LA PARTIE (3 nov. 2026, « le tirage suit les mots ») : la file des MOTS vient de l'app (Tirage.plan : les dus,
// les rates recents, puis au plus NEUFS_MAX nouveaux) ; chaque mot recoit une question d'une sorte qui le vise,
// jamais la meme sorte deux fois de suite, jamais deux fois la meme question. Rate, il revient plus loin.
// Recopie de familia.html (visuel/THEMES-ILLUSTRES.md : ces fonctions sont identiques d'un theme a l'autre).
const NEUFS_MAX = Q.get("seance") === "1" ? 3 : 10;
let vus_ = new Set(), sorteCourante = null, derniereSorte = null;
function cleQuestion(){
  const z = $("zone"), en = z.querySelector(".enonce");
  return sorteCourante + "|" + (en ? en.textContent : "") + "|" + Array.from(z.querySelectorAll("img")).map(i => i.getAttribute("src")).sort().join(",");
}
function montrer(){
  repondu = false; $("suite").hidden = true; choixFaux = null; SENS = new Map();
  $("compte").textContent = (rang + 1) + " / " + file.length;
  $("barre").style.width = (rang / file.length * 100) + "%";
  const essai = (w, strict) => {
    const autres = melanger(SORTES.filter(x => x !== derniereSorte));
    for (const so of autres){
      for (let n = 0; n < 25; n++){
        motQ = null; vuQ = null; sensQ = null; sorteCourante = so;
        if (!EX[so](w)) break;
        if (!vus_.has(cleQuestion())) return so;
      }
    }
    if (strict) return null;
    if (derniereSorte) for (let n = 0; n < 25; n++){           // la meme sorte, avec une question fraiche
      motQ = null; vuQ = null; sensQ = null; sorteCourante = derniereSorte;
      if (!EX[derniereSorte](w)) break;
      if (!vus_.has(cleQuestion())) return derniereSorte;
    }
    for (const so of autres.concat(derniereSorte ? [derniereSorte] : [])){   // tout est deja vu : n'importe laquelle
      motQ = null; vuQ = null; sensQ = null; sorteCourante = so;
      if (EX[so](w)) return so;
    }
    return null;
  };
  let fait = essai(file[rang], true);
  for (let j = rang + 1; !fait && j < file.length; j++){
    fait = essai(file[j], true);
    if (fait) [file[rang], file[j]] = [file[j], file[rang]];
  }
  if (!fait) fait = essai(file[rang], false);
  vus_.add(cleQuestion()); derniereSorte = fait; retenir();
  window.scrollTo(0, 0);
}
// LES BOUTONS D'ACTION TOUJOURS TOUT EN BAS (regle de Jacques, 3 nov. 2026, comme dans les scenes : « commencer les
// exercices ou continuer soit toujours en bas completement de l'ecran ») : la fin les met dans <div class="bas">.
function fin(){
  $("barre").style.width = "100%"; $("compte").textContent = file.length + " / " + file.length; $("suite").hidden = true;
  $("zone").innerHTML = '<div class="fin"><div class="score">' + T("score", {b: bons, n: file.length}) + '</div></div>'
    + '<div class="bas">' + boutonEncore() + '<button type="button" id="terminer">' + T("terminer") + '</button></div>';
  brancherEncore();
  $("terminer").addEventListener("click", () => parler("fini", {bons, faits: file.length}));
}
// plus rien de du ni de nouveau : la partie le dit, et ne repose pas des mots deja sus
function toutRevu(prochaine){
  $("barre").style.width = "100%"; $("compte").textContent = ""; $("suite").hidden = true;
  const quand = Tirage.revu(prochaine, LANGUE);
  $("zone").innerHTML = '<div class="fin"><div class="score">' + (TIRAGE_TEXTES.revu[LANGUE] || TIRAGE_TEXTES.revu.fr) + '</div>'
    + (quand ? '<p class="consigne">' + (TIRAGE_TEXTES.prochaine[LANGUE] || TIRAGE_TEXTES.prochaine.fr).replace("{d}", quand) + '</p>' : "")
    + '</div><div class="bas">' + boutonEncore() + '<button type="button" id="terminer">' + T("terminer") + '</button></div>';
  brancherEncore();
  $("terminer").addEventListener("click", () => parler("fini", {bons: 0, faits: 0}));
}
// jamais dans la seance (elle a sa longueur)
const boutonEncore = () => Q.get("seance") === "1" ? "" : '<button type="button" id="encore">' + (TIRAGE_TEXTES.encore[LANGUE] || TIRAGE_TEXTES.encore.fr) + '</button>';
function brancherEncore(){ const b = $("encore"); if (b) b.addEventListener("click", encoreDesQuestions); }
// « Encore des questions » : en fin de partie et quand tout est revu
async function encoreDesQuestions(){
  const mots = motsDuTheme();
  file = Tirage.supplement(mots, await Tirage.demander(mots), NB); rang = 0; bons = 0; vus_ = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(null);
  montrer();
}
async function demarrer(){
  const mots = motsDuTheme();
  const plan = Tirage.plan(mots, await Tirage.demander(mots), NB, NEUFS_MAX);
  file = plan.file; rang = 0; bons = 0; vus_ = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(plan.prochaine);
  montrer();
}
$("suite").addEventListener("click", () => { if (!file.length) return; rang++; if (rang >= file.length) fin(); else montrer(); });
$("retour").addEventListener("click", () => parler("fermer"));
$("retour").setAttribute("aria-label", T("retourAria"));
$("titre").textContent = T("titre");
document.title = T("titre");
fetch("ropa/ropa.json?v=1").then(r => r.json()).then(d => {
  D = d; TENUES = Object.entries(d.tenues);
  if (Q.get("seance") === "1") demarrer(); else decouvrir();
});
</script>
