<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les fêtes et les invitations</title>
<!--
  LES FETES ET LES INVITATIONS (theme illustre, vague 4, 5 nov. 2026). Reconnaitre une fete et sa date, souhaiter
  (Frohe Weihnachten ; ¡Feliz Navidad!), lire une invitation, accepter ou refuser poliment selon son agenda, proposer un
  jour, se mettre d'accord, dire qui apporte quoi : la troisieme partie de l'oral du DTZ, « gemeinsam etwas planen »
  (le FORMAT seulement). La scene « Marks Geburtstag » garde les objets de la fete (regle 2 : pas de scene refaite).
  En allemand, Mark et la famille d'Anna a Berlin ; en espagnol, Mark a Madrid et les personnes de « Decrire ». Les
  images n'ont AUCUN texte : l'invitation, l'agenda, la liste « qui apporte quoi » et la conversation sont dessines ici.
  L'axe : zum / zur et meinem / meiner (de), al / a la (es) ; les verbes separables (bringt ... mit, laedt ... ein) et
  le verbe en deuxieme place (Leider kann ich nicht ; Am Samstag habe ich Zeit) ; poder, traer, invitar (es).
  Ouverte par l'app dans le cadre des scenes (sceneCadre), elle parle comme une scene : « exercice » et « bonne » a
  chaque reponse, « reponse » {mot, genre, cat, juste} pour le mot teste, « fini » et « fermer » a la fin.
  Parametres : apprendre=es|de, lang=<interface>, nuit=1, seance=1 (six questions, pas de decouverte), variante=latam
  (le Dia de Muertos). Le tirage suit les mots (themes/tirage.js). Les phrases sont FABRIQUEES depuis fetes.json
  (visuel/fetes/fetes.py), jamais ecrites une a une ; un leurre n'est jamais une reponse possible.
-->
<style>
:root{--fond1:#82AFDB;--fond3:#C0D6EA;--encre:#1C2430;--gris:#4C566B;--ambre:#E8A23A;--ambre-f:#A86A0E;--vert:#2F9E6A;--rouge:#C8473A;
  --verre:rgba(255,255,255,.88);--bord:rgba(255,255,255,.95);--carte:#F7F8FA;--papier:#FFFDF7;--trait:#C9CFD8;--bulle:#E6F0FA;--bulle2:#FFF4DF;--police:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html.nuit{--fond1:#0E1C26;--fond3:#18303F;--encre:#EEF2F5;--gris:#A9B8C4;--ambre-f:#E8A23A;--vert:#5CC98F;--rouge:#F07F72;
  --verre:rgba(20,36,50,.88);--bord:rgba(255,255,255,.14);--carte:#22384A;--papier:#1D2F3D;--trait:#40576A;--bulle:#21405A;--bulle2:#3D3420}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
/* la page a la hauteur de l'ecran, comme une scene (visuel/THEMES-ILLUSTRES.md) : le contenu defile DANS le body */
html{height:100%;overflow:hidden}
body{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;box-sizing:border-box}
body{background:linear-gradient(180deg,var(--fond1),var(--fond3));background-attachment:fixed;color:var(--encre);font-family:var(--police);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 156px) max(10px,env(safe-area-inset-left,0px))}
.haut{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto 10px}
.retour{width:42px;height:42px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);color:var(--encre);font:800 22px var(--police);cursor:pointer;flex:0 0 auto}
html[dir="rtl"] .retour{transform:scaleX(-1)}
.titre{flex:1;font-weight:900;font-size:18px}
.compte{font-weight:800;font-size:14px;color:var(--gris)}
.barre{max-width:560px;margin:0 auto 12px;height:6px;border-radius:3px;background:rgba(28,36,48,.12);overflow:hidden}
.barre i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2BB5AA,#14807A);transition:width .3s}
main{max-width:560px;margin:0 auto;background:var(--verre);border:1px solid var(--bord);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}
.consigne{font-size:14px;font-weight:700;color:var(--gris);margin:0}
.enonce{direction:ltr;text-align:left;background:var(--carte);border-radius:14px;padding:12px 14px;font-weight:800;line-height:1.5;font-size:17px}
.enonce.centre{text-align:center;font-size:19px}
.trou{display:inline-block;min-width:64px;border-bottom:2px solid var(--ambre);text-align:center;color:var(--ambre-f)}
.photo{display:block;width:100%;max-width:420px;margin:0 auto;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:16px;background:var(--carte)}
.rangee{display:grid;grid-template-columns:1fr 1fr;gap:8px;direction:ltr}
.rangee.trois{grid-template-columns:1fr 1fr 1fr}
.rangee button{border:3px solid transparent;border-radius:14px;background:var(--carte);padding:0;cursor:pointer;overflow:hidden;display:block}
.rangee img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.rangee button.juste{border-color:var(--vert)} .rangee button.faux{border-color:var(--rouge)}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix.centre{justify-content:center}
.choix.liste{flex-direction:column}
.choix button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:9px 15px;font:800 15px var(--police);cursor:pointer;text-align:center}
.choix.liste button{border-radius:14px;text-align:left;line-height:1.35}
.choix button.juste{background:var(--vert);border-color:var(--vert);color:#fff}
.choix button.faux{background:var(--rouge);border-color:var(--rouge);color:#fff}
button:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
button:disabled{cursor:default}
.ecoute{width:48px;height:48px;border-radius:50%;border:2px solid var(--ambre);background:var(--verre);color:var(--encre);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ecoute svg{width:24px;height:24px}
.ecoute.grand{width:64px;height:64px;margin:0 auto} .ecoute.grand svg{width:32px;height:32px}
.retourMsg{min-height:1.4em;font-weight:800;font-size:15px;margin:0;line-height:1.45}
.retourMsg.ok{color:var(--vert)} .retourMsg.ko{color:var(--rouge)}
.retourMsg .phrase{display:block;color:var(--encre);font-weight:700}
.trad{display:block;font-size:13px;font-weight:600;font-style:italic;color:var(--gris);line-height:1.35;margin-top:2px}
.trad.faux{color:var(--rouge);font-style:normal}
.retourMsg .mot{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--gris);font-weight:700}
.retourMsg .mot .ecoute{width:38px;height:38px} .retourMsg .mot .ecoute svg{width:19px;height:19px}
/* LES PAPIERS, dessines ici (aucun texte dans les images) : l'invitation, l'agenda, la liste, la conversation */
.papier{direction:ltr;text-align:left;background:var(--papier);border:1px solid var(--trait);border-radius:8px;padding:12px 14px 10px;box-shadow:0 6px 16px rgba(28,36,48,.12);
  font-size:14.5px;line-height:1.45;color:var(--encre);position:relative}
.papier .entete{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gris);border-bottom:2px solid var(--encre);padding-bottom:5px;margin-bottom:8px}
.papier h3{margin:0 0 6px;font-size:19px;font-weight:900;color:var(--ambre-f)}
.papier p{margin:4px 0}
.papier .lig{display:flex;gap:6px} .papier .lig b{min-width:58px}
.papier .signe{font-family:"Segoe Script","Brush Script MT","Snell Roundhand",cursive;font-size:19px;color:#1D4E9E;margin-top:6px}
html.nuit .papier .signe{color:#9CC3FF}
.papier.carte{border:2px solid var(--ambre);background:linear-gradient(180deg,var(--papier),var(--papier)) padding-box}
.papier.carte::before{content:"";position:absolute;top:10px;right:12px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#F6C66B,#E8A23A);box-shadow:-30px 6px 0 -4px #7FB7E6,-14px 18px 0 -6px #E57B6E}
.papier table{border-collapse:collapse;width:100%;font-size:14.5px}
.papier td{padding:4px 6px;border-bottom:1px dotted var(--trait)} .papier td:first-child{font-weight:800;width:40%}
.papier td.libre{color:var(--gris);font-style:italic}
.papier .note{font-size:12.5px;color:var(--gris);margin:6px 0 0;font-weight:700}
.fil{direction:ltr;display:flex;flex-direction:column;gap:8px}
.bul{max-width:86%;padding:8px 12px;border-radius:16px;font-weight:700;line-height:1.4;font-size:15px}
.bul .qui{display:block;font-size:11.5px;font-weight:800;color:var(--gris);text-transform:uppercase;letter-spacing:.04em}
.bul.g{align-self:flex-start;background:var(--bulle);border-bottom-left-radius:4px}
.bul.d{align-self:flex-end;background:var(--bulle2);border-bottom-right-radius:4px}
/* la decouverte */
.section{font-weight:900;font-size:15px;margin:4px 0 -4px}
.fiche{background:var(--carte);border-radius:14px;padding:10px;display:grid;grid-template-columns:minmax(120px,48%) 1fr;gap:12px;align-items:center}
.fiche.sans{grid-template-columns:1fr}
.fiche img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;background:var(--verre)}
.fiche .mot{font-weight:900;font-size:21px;color:var(--ambre-f);line-height:1.15}
.fiche .sens{font-weight:700;font-size:14px;color:var(--gris);margin-top:2px}
.fiche .dit{font-weight:800;font-size:16px;line-height:1.4;margin-top:6px}
.fiche .ligne{display:flex;align-items:center;gap:10px;margin-top:8px}
.planche{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;direction:ltr}
.planche button{border:3px solid transparent;border-radius:10px;padding:0;background:var(--carte);cursor:pointer;overflow:hidden;display:block}
.planche img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.planche button.choisi{border-color:var(--ambre)}
.puces{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.puces button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:6px 12px;font:800 14px var(--police);cursor:pointer}
.puces button.choisi{background:var(--ambre);color:#1C2430}
.regle{margin:0;font-size:14px;font-weight:700;line-height:1.45;color:var(--gris);background:var(--carte);border-radius:12px;padding:10px 12px}
/* TOUS LES BOUTONS D'ACTION TOUT EN BAS DE L'ECRAN, comme dans les scenes (Jacques, 3 nov. 2026) */
.suite{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:54px;border:0;border-radius:27px;z-index:5000;
  color:#fff;font:800 17px var(--police);background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer}
.suite[hidden]{display:none}
.bas{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5000;display:flex;flex-direction:column;gap:8px}
.bas button{height:54px;border:0;border-radius:27px;font:800 17px var(--police);cursor:pointer;
  color:#fff;background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28)}
.bas button.second{background:var(--verre);color:var(--encre);border:2px solid var(--ambre);box-shadow:0 6px 16px rgba(28,36,48,.14)}
.fin{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:10px 0}
.fin .score{font-size:22px;font-weight:900}
[lang]{unicode-bidi:isolate}
</style>
</head>
<body>
<div class="haut"><button class="retour" id="retour" type="button">‹</button><div class="titre" id="titre"></div><div class="compte" id="compte" dir="ltr"></div></div>
<div class="barre"><i id="barre"></i></div>
<main id="zone"></main>
<button class="suite" id="suite" type="button" hidden></button>
<script src="themes/tirage.js?v=3"></script>
<script src="themes/zoom.js?v=4"></script>
<script src="themes/verre.js?v=8"></script>
<script src="themes/voix.js?v=7"></script>
<script src="themes/fin.js?v=2"></script>
<script>
const Q = new URLSearchParams(location.search);
const APPRENDRE = Q.get("apprendre") === "de" ? "de" : "es";
const LANGUE = (l => ["fr", "en", "tr", "uk", "fa", "ar", "pt", "pl", "ru", "de"].includes(l) ? l : "fr")(((Q.get("lang") || "fr").toLowerCase().split(/[-_]/)[0]));
const LATAM = Q.get("variante") === "latam";
if (Q.get("nuit") === "1") document.documentElement.classList.add("nuit");
document.documentElement.lang = LANGUE;
document.documentElement.dir = (LANGUE === "fa" || LANGUE === "ar") ? "rtl" : "ltr";
const NB = Q.get("seance") === "1" ? Math.max(2, Math.min(12, parseInt(Q.get("nb"), 10) || 6)) : 20;   // nb : le reglage « Questions par scene et par theme » de la seance du jour (5 · 8 · 12, 7 nov. 2026)
Zoom.init({direct: "img.photo, .fiche img", loupe: ".rangee button", langue: LANGUE});

const TEXTES = {
  titre:     {fr:"Les fêtes et les invitations", en:"Celebrations and invitations", tr:"Bayramlar ve davetler", uk:"Свята й запрошення", fa:"جشن‌ها و دعوت‌ها", ar:"الأعياد والدعوات", pt:"Festas e convites", pl:"Święta i zaproszenia", ru:"Праздники и приглашения", de:"Feste und Einladungen"},
  intro:     {fr:"Touche une fête : tu vois quand on la fête et ce qu'on se souhaite, et tu l'entends. En bas, une invitation et la règle.", en:"Tap a celebration to see when it is and what people wish each other, and to hear it. Below: an invitation and the rule.", tr:"Bir bayrama dokun: ne zaman kutlandığını ve ne dilendiğini gör ve dinle. Aşağıda bir davet ve kural var.", uk:"Торкнися свята: побачиш, коли його святкують і що бажають, і почуєш це. Нижче — запрошення і правило.", fa:"روی یک جشن بزن تا ببینی کی است و چه تبریکی می‌گویند، و بشنوی. پایین، یک دعوت‌نامه و قاعده است.", ar:"المس عيدًا لترى متى يُحتفل به وماذا يتمنّى الناس، ولتسمعه. في الأسفل دعوة والقاعدة.", pt:"Toque em uma festa: você vê quando ela é e o que se deseja, e ouve. Embaixo, um convite e a regra.", pl:"Dotknij święta: zobaczysz, kiedy jest i czego się życzy, i usłyszysz to. Niżej zaproszenie i zasada.", ru:"Нажми на праздник: увидишь, когда его отмечают и что желают, и услышишь это. Ниже — приглашение и правило.", de:"Tippe auf ein Fest: Du siehst, wann es ist und was man sich wünscht, und hörst es. Unten stehen eine Einladung und die Regel."},
  secFetes:  {fr:"Les fêtes", en:"The celebrations", tr:"Bayramlar", uk:"Свята", fa:"جشن‌ها", ar:"الأعياد", pt:"As festas", pl:"Święta", ru:"Праздники", de:"Die Feste"},
  secMoments:{fr:"Inviter, venir, apporter", en:"Inviting, coming, bringing", tr:"Davet etmek, gelmek, getirmek", uk:"Запрошувати, приходити, приносити", fa:"دعوت کردن، آمدن، آوردن", ar:"الدعوة والحضور والإحضار", pt:"Convidar, ir, levar", pl:"Zapraszać, przychodzić, przynosić", ru:"Приглашать, приходить, приносить", de:"Einladen, kommen, mitbringen"},
  secInvit:  {fr:"Une invitation", en:"An invitation", tr:"Bir davet", uk:"Запрошення", fa:"یک دعوت‌نامه", ar:"دعوة", pt:"Um convite", pl:"Zaproszenie", ru:"Приглашение", de:"Eine Einladung"},
  regleDe:   {fr:"Inviter : Ich lade dich zu meiner Party ein — einladen et mitbringen se séparent, le petit mot va à la fin (Lena bringt einen Salat mit). Zu + datif : zu meinem Geburtstag (der), zu meiner Party (die) ; zum = zu dem, zur = zu der (Herzlichen Glückwunsch zum Geburtstag, zur Hochzeit). Le verbe reste en deuxième place : Leider kann ich nicht. Am Samstag habe ich Zeit. Pour proposer : Wie wäre es mit Samstag?", en:"Inviting: Ich lade dich zu meiner Party ein — einladen and mitbringen split, the small word goes to the end (Lena bringt einen Salat mit). Zu + dative: zu meinem Geburtstag (der), zu meiner Party (die); zum = zu dem, zur = zu der (Herzlichen Glückwunsch zum Geburtstag, zur Hochzeit). The verb stays in second place: Leider kann ich nicht. Am Samstag habe ich Zeit. To suggest: Wie wäre es mit Samstag?", tr:"Davet: Ich lade dich zu meiner Party ein — einladen ve mitbringen ayrılır, küçük kelime sona gider (Lena bringt einen Salat mit). Zu + datif: zu meinem Geburtstag (der), zu meiner Party (die); zum = zu dem, zur = zu der (Herzlichen Glückwunsch zum Geburtstag, zur Hochzeit). Fiil ikinci sırada kalır: Leider kann ich nicht. Am Samstag habe ich Zeit. Öneri için: Wie wäre es mit Samstag?", uk:"Запрошення: Ich lade dich zu meiner Party ein — einladen і mitbringen розділяються, маленьке слово йде в кінець (Lena bringt einen Salat mit). Zu + давальний: zu meinem Geburtstag (der), zu meiner Party (die); zum = zu dem, zur = zu der (Herzlichen Glückwunsch zum Geburtstag, zur Hochzeit). Дієслово стоїть на другому місці: Leider kann ich nicht. Am Samstag habe ich Zeit. Щоб запропонувати: Wie wäre es mit Samstag?", fa:"دعوت: Ich lade dich zu meiner Party ein — einladen و mitbringen جدا می‌شوند و واژهٔ کوچک به آخر می‌رود (Lena bringt einen Salat mit). zu + داتیو: zu meinem Geburtstag ‏(der)، zu meiner Party ‏(die)؛ zum = zu dem و zur = zu der ‏(Herzlichen Glückwunsch zum Geburtstag, zur Hochzeit). فعل در جای دوم می‌ماند: Leider kann ich nicht. Am Samstag habe ich Zeit. برای پیشنهاد: Wie wäre es mit Samstag?", ar:"الدعوة: Ich lade dich zu meiner Party ein — الفعلان einladen وmitbringen ينفصلان والكلمة الصغيرة تذهب إلى الآخر (Lena bringt einen Salat mit). zu + الداتيف: zu meinem Geburtstag ‏(der)، zu meiner Party ‏(die)؛ zum = zu dem وzur = zu der ‏(Herzlichen Glückwunsch zum Geburtstag, zur Hochzeit). يبقى الفعل في المكان الثاني: Leider kann ich nicht. Am Samstag habe ich Zeit. للاقتراح: Wie wäre es mit Samstag?", pt:"Convidar: Ich lade dich zu meiner Party ein — einladen e mitbringen se separam, a palavrinha vai para o fim (Lena bringt einen Salat mit). Zu + dativo: zu meinem Geburtstag (der), zu meiner Party (die); zum = zu dem, zur = zu der (Herzlichen Glückwunsch zum Geburtstag, zur Hochzeit). O verbo fica em segundo lugar: Leider kann ich nicht. Am Samstag habe ich Zeit. Para propor: Wie wäre es mit Samstag?", pl:"Zapraszanie: Ich lade dich zu meiner Party ein — einladen i mitbringen się rozdzielają, małe słowo idzie na koniec (Lena bringt einen Salat mit). Zu + celownik: zu meinem Geburtstag (der), zu meiner Party (die); zum = zu dem, zur = zu der (Herzlichen Glückwunsch zum Geburtstag, zur Hochzeit). Czasownik zostaje na drugim miejscu: Leider kann ich nicht. Am Samstag habe ich Zeit. Żeby coś zaproponować: Wie wäre es mit Samstag?", ru:"Приглашение: Ich lade dich zu meiner Party ein — einladen и mitbringen разделяются, маленькое слово уходит в конец (Lena bringt einen Salat mit). Zu + дательный: zu meinem Geburtstag (der), zu meiner Party (die); zum = zu dem, zur = zu der (Herzlichen Glückwunsch zum Geburtstag, zur Hochzeit). Глагол остаётся на втором месте: Leider kann ich nicht. Am Samstag habe ich Zeit. Чтобы предложить: Wie wäre es mit Samstag?"},
  regleEs:   {fr:"Inviter : Te invito a mi fiesta. a + el = al : Te invito al cumpleaños de Mark, mais a la boda, a la cena. Répondre : ¡Con mucho gusto! ou Lo siento, no puedo. poder change de voyelle (puedo, puedes, puede) et traer fait traigo à la première personne. Pour proposer un jour : ¿Quedamos el sábado? — les jours prennent l'article : el sábado.", en:"Inviting: Te invito a mi fiesta. a + el = al: Te invito al cumpleaños de Mark, but a la boda, a la cena. Answering: ¡Con mucho gusto! or Lo siento, no puedo. poder changes its vowel (puedo, puedes, puede) and traer becomes traigo in the first person. To suggest a day: ¿Quedamos el sábado? — days take the article: el sábado.", pt:"Convidar: Te invito a mi fiesta. a + el = al: Te invito al cumpleaños de Mark, mas a la boda, a la cena. Responder: ¡Con mucho gusto! ou Lo siento, no puedo. poder muda a vogal (puedo, puedes, puede) e traer vira traigo na primeira pessoa. Para propor um dia: ¿Quedamos el sábado? — os dias levam artigo: el sábado.", ar:"الدعوة: Te invito a mi fiesta. ‏a + el = al: ‏Te invito al cumpleaños de Mark، لكن a la boda وa la cena. الرد: ¡Con mucho gusto! أو Lo siento, no puedo. يتغيّر حرف العلة في poder ‏(puedo, puedes, puede) ويصبح traer ‏traigo مع المتكلم. لاقتراح يوم: ¿Quedamos el sábado? — تأخذ الأيام أداة التعريف: el sábado.", de:"Einladen: Te invito a mi fiesta. a + el = al: Te invito al cumpleaños de Mark, aber a la boda, a la cena. Antworten: ¡Con mucho gusto! oder Lo siento, no puedo. Bei poder ändert sich der Vokal (puedo, puedes, puede), und traer heißt in der ersten Person traigo. Einen Tag vorschlagen: ¿Quedamos el sábado? — Wochentage haben einen Artikel: el sábado."},

};
function T(cle, v){ let s = (TEXTES[cle] || {})[LANGUE] || (TEXTES[cle] || {}).fr || cle; for (const k in (v || {})) s = s.split("{" + k + "}").join(v[k]); return s; }

// ---------- la donnee (fetes.json) ----------
let D = null, FE, AP, INV, MO, PERS, CJ;
const PHRASE_TRADUITE = LANGUE !== APPRENDRE && (["fr", "en", "pt"].includes(LANGUE) || (LANGUE === "de" && APPRENDRE === "es"));
const TL = PHRASE_TRADUITE ? LANGUE : null;                  // la langue des phrases traduites, sinon rien
const traduction = t => t ? '<span class="trad" dir="auto">' + t + '</span>' : "";

// ---------- utilitaires ----------
const $ = id => document.getElementById(id);
const melanger = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
const hasard = a => a[Math.floor(Math.random() * a.length)];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const uniques = a => a.filter((x, i, l) => l.indexOf(x) === i);
const cible = t => '<span lang="' + APPRENDRE + '" dir="ltr">' + t + '</span>';
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const isoler = s => document.documentElement.dir !== "rtl" ? s : s.replace(/[A-Za-zÀ-ÿñÑßäöüÄÖÜ¿¡]+(?:[ ()?!,:.'’=+-]+[A-Za-zÀ-ÿñÑßäöüÄÖÜ¿¡]+)*[?!.]?/g, m => '<span dir="ltr">' + m + '</span>');
const imgSrc = i => "fetes/" + i + ".webp";
const photo = i => '<img class="photo" alt="" src="' + imgSrc(i) + '">';
const espaces = s => s.replace(/\s+/g, " ").replace(/ ([.,!?])/g, "$1").trim();
function parler(type, extra){ try{ parent.postMessage(Object.assign({source:"wortando-scene", type}, extra || {}), "*"); }catch(e){} }
function dire(texte){ Voix.dire(texte); }
const HP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const ES_ = APPRENDRE === "es";

// ---------- les mots du theme (la forme du corpus) et leur traduction ----------
const memeMot = (a, b) => a && b && a.mot === b.mot && (a.genre || null) === (b.genre || null) && (a.cat || null) === (b.cat || null);
const glose = w => { const m = D.mots[APPRENDRE].find(x => memeMot(x, w)); return m ? (m.g[LANGUE] || m.g.fr || "") : ""; };
const nom = (mot, genre) => ({mot, genre});
const verbe = v => ({mot: v, cat: "verbe"});
const adverbe = v => ({mot: v, cat: "adverbe"});

// ---------- les dates, les jours, les personnes ----------
const JOURS = l => D.jours[l || APPRENDRE];
const jourN = (n, l) => JOURS(l)[n];                                     // 0 = lundi
const dateDe = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
const jourDe = iso => (dateDe(iso).getDay() + 6) % 7;
function dateLongue(iso, l){                                              // « Samstag, 13. März » / « el sábado 13 de marzo »
  l = l || APPRENDRE; const t = dateDe(iso), j = jourN(jourDe(iso), l), d = t.getDate(), m = D.mois[l][t.getMonth()];
  return l === "de" ? j + ", " + d + ". " + m : l === "es" ? "el " + j + " " + d + " de " + m : l === "fr" ? j + " " + d + " " + m : l === "en" ? j + ", " + m + " " + d : j + ", " + d + " de " + m;
}
const amJour = (n, l) => { l = l || APPRENDRE; const j = jourN(n, l);   // « am Samstag » / « el sábado » / « samedi » / « on Saturday » / « no sábado »
  return l === "de" ? "am " + j : l === "es" ? "el " + j : l === "fr" ? j : l === "en" ? "on " + j : (n >= 5 ? "no " : "na ") + j; };
const heureTexte = (h, l) => { l = l || APPRENDRE; return l === "de" ? "um " + h + " Uhr" : l === "es" ? "a las " + h + ":00" : l === "fr" ? "à " + h + " h" : l === "en" ? "at " + h + ":00" : "às " + h + "h"; };
const PARTIES = s => s.split(/ und | y | e /);
// « Mark e Inés » : y devient e devant un son i
const yEs = (a, b) => a + (/^h?[iIíÍ]/.test(b) && !/^hie/i.test(b) ? " e " : " y ") + b;
const sexe = n => (PERS[n] || D.sexe[n] || "m");
const pluriel = n => PARTIES(n).length > 1;
const ET = {fr: " et ", en: " and ", pt: " e ", de: " und "};
function nomT(n, l){                                                     // le nom dans une phrase traduite (pt : avec l'article)
  const ps = PARTIES(n);
  if (l === "pt") return ps.map(p => (sexe(p) === "f" ? "a " : "o ") + p).join(" e ");
  return ps.join(ET[l] || " " );
}
const NomT = (n, l) => cap(nomT(n, l));

// ---------- les fetes ----------
const FETES = () => Object.keys(FE).filter(k => !FE[k].latam || LATAM);
const feteMot = k => nom(FE[k].mot, FE[k].genre);
const imgPret = i => D.images[i] && (!D.imgLangues[i] || D.imgLangues[i].includes(APPRENDRE));
const imgsDe = k => FE[k].img.filter(imgPret);
const fetesDe = w => FETES().filter(k => !w || memeMot(feteMot(k), w));
const voisines = k => [k].concat(FE[k].aussi || []);
// les fetes qu'une image montre (on ne propose jamais l'une pour l'autre)
const fetesDeImg = i => FETES().filter(k => FE[k].img.includes(i));
const feteBouton = k => FE[k].nom;
const fetePhrase = k => ES_ ? (FE[k].c ? "Es " + (FE[k].genre === "la" ? "una " : "un ") + FE[k].mot : "Es " + FE[k].nom) + "." : (FE[k].c ? "Das ist " + (FE[k].genre === "die" ? "eine " : "ein ") + FE[k].mot : "Das ist " + FE[k].nom) + ".";
function feteTrad(k){

// un agenda de la semaine : {jour: motif|null} ; « occupe » : le jour de la fete, occupe (motif) ou libre (null)
function tirerAgenda(jourFete, occupe, minLibres, minPris){
  const M = Object.keys(MO);
  for (let essai = 0; essai < 80; essai++){
    const a = [];
    for (let j = 0; j < 7; j++){
      if (j === jourFete && occupe !== undefined) { a.push(occupe); continue; }
      a.push(Math.random() < 0.45 ? hasard(M.filter(m => !MO[m].semaine || j < 5)) : null);
    }
    if (occupe && MO[occupe].semaine && jourFete >= 5) return null;
    const libres = a.filter(x => !x).length, pris = 7 - libres;
    if (libres >= (minLibres || 0) && pris >= (minPris || 0)) return a;
  }
  return null;
}

function juger(ok, bonneTexte, phrase){
  if (repondu) return; repondu = true;
  if (ok) bons++;
  parler("exercice", {juste: ok}); if (ok){ parler("bonne"); Voix.bravo(); }
  if (motQ) parler("reponse", {mot: motQ.mot, genre: motQ.genre || null, cat: motQ.cat || null, juste: ok});
  if (!ok && file[rang]) Tirage.remettre(file, rang, file[rang], NB);
  const m = $("msg"); m.className = "retourMsg " + (ok ? "ok" : "ko");
  const g = motQ ? glose(motQ) : "";
  m.innerHTML = (ok ? cible(ES_ ? "¡Muy bien!" : "Sehr gut!") : T("bonne", {r: cible(esc(bonneTexte))}))
    // la phrase juste, ECRITE, apres toute reponse (Jacques, 5 nov., comme la meteo et les metiers) ; apres une erreur,
    // « La bonne reponse » l'a deja quand elle est la meme
    + ((ok || (phrase && phrase !== bonneTexte)) ? '<span class="phrase">' + cible(esc(phrase || bonneTexte)) + '</span>' : "")
    + traduction(tradQ)
    + (!ok && choixFaux && choixFaux.trad ? '<span class="trad faux" dir="auto">' + T("choix", {c: cible(esc(choixFaux.texte)) + " — " + esc(choixFaux.trad)}) + '</span>' : "")

  const r = $("redire"); if (r) r.addEventListener("click", () => dire(dirQ || motQ.mot));
  dire(phrase || bonneTexte);
  const s = $("suite"); s.textContent = rang + 1 >= file.length ? T("terminer") : T("suivant"); s.hidden = false;
}
function boutons(conteneur, options, bonne, apres, trads){
  let bon;

    const b = document.createElement("button"); b.type = "button"; b.lang = APPRENDRE; b.dir = "ltr"; b.textContent = o; if (o === bonne) bon = b;
    b.addEventListener("click", () => {
      conteneur.querySelectorAll("button").forEach(x => { x.disabled = true; if (x === bon) x.classList.add("juste"); });
      if (b !== bon) b.classList.add("faux");
      choixFaux = o === bonne ? null : {texte: o, trad: trads ? trads(o) : null};
      apres(o === bonne);
    });
    conteneur.appendChild(b);
  });
}

// Chaque sorte sait viser un mot w (false si elle ne le peut pas) ; sans w, une question au hasard (les controles).
const EX = {
  // une image de fete : « Welches Fest ist das? » -> Silvester (jamais Neujahr en leurre : la meme nuit)
  fete(w){
    const ks = fetesDe(w).filter(k => imgsDe(k).length && leurresFete(k).length >= 2);

    const k = hasard(ks), img = hasard(imgsDe(k)); viser(w || feteMot(k));

  entendre(w){

    const autres = melanger(uniques(leurresFete(k, img).flatMap(imgsDe)).filter(i => i !== img && !fetesDeImg(i).some(x => voisines(k).includes(x)))).slice(0, 2);

    images($("rang"), melanger([img, ...autres]), img, ok => juger(ok, fetePhrase(k), fetePhrase(k)),
           i => { const x = fetesDeImg(i)[0]; return x ? {texte: feteBouton(x), trad: tradFete(feteBouton(x))} : null; });
    dire(dit);
    return true;
  },
  // « Wann ist Silvester? » -> am 31. Dezember (une date qui touche la sienne n'est jamais proposee)
  quand(w){
    const ks = fetesDe(w).filter(k => FE[k].quand);
    if (!ks.length) return false;
    const k = hasard(ks);
    const autres = uniques(FETES().filter(x => FE[x].quand && !touche(FE[x].jours, FE[k].jours)).map(x => FE[x].quand));
    if (autres.length < 2) return false;
    viser(w || feteMot(k));
    const rep = FE[k].quand, opts = melanger([rep, ...melanger(autres).slice(0, 3)]);

    ecran("c_quand", avant, ES_ ? "¿Cuándo es " + FE[k].nom + "?" : "Wann ist " + FE[k].nom + "?", {centre: true});
    boutons($("choix"), opts, rep, ok => juger(ok, rep, quandPhrase(k)),
            o => { const x = FETES().find(y => FE[y].quand === o); return x && TL && FE[x].t[TL] ? FE[x].t[TL][1] : null; });
    return true;
  },
  // « Heute ist Ostern. Was sagst du? » -> Frohe Ostern!
  souhait(w){
    const vV = estMot(w, verbe(ES_ ? "felicitar" : "gratulieren"));   // feliciter : l'anniversaire, le mariage
    const ks = fetesDe(vV ? null : w).filter(k => FE[k].wunsch && FE[k].situation && (!vV || FE[k].c));
    if (!ks.length) return false;
    const k = hasard(ks);
    const autres = uniques(FETES().filter(x => FE[x].wunsch && !voisines(k).includes(x) && !(FE[x].aussi || []).includes(k) && FE[x].wunsch !== FE[k].wunsch).map(x => FE[x].wunsch));
    if (autres.length < 2) return false;
    viser(w || feteMot(k));
    const sit = situation(k), rep = FE[k].wunsch, opts = melanger([rep, ...melanger(autres).slice(0, 3)]);
    tradQ = [sit.t, souhaitTrad(k)].filter(Boolean).join(" — ") || null; dirQ = vV ? w.mot : FE[k].nom;
    const avant = imgsDe(k).length && !FE[k].c && Math.random() < 0.5 ? photo(hasard(imgsDe(k))) : "";
    ecran("c_souhait", avant, sit.s + " " + quiDit(k, sit.p), {centre: true});
    $("choix").classList.add("liste");
    boutons($("choix"), opts, rep, ok => juger(ok, rep, sit.s + " — " + rep),
            o => { const x = FETES().find(y => FE[y].wunsch === o); return x && TL && FE[x].t[TL] ? FE[x].t[TL][2] : null; });

  // de : « Herzlichen Glückwunsch ___ Geburtstag! » -> zum ; « Ich lade dich zu ___ Party ein. » -> meiner
  // es : « Te invito ___ cumpleaños de Mark. » -> al (a + el = al)
  forme(w){
    if (ES_){
      const cand = D.alEs.filter(x => !w || memeMot(nom(x.mot, x.genre), w));

  // l'invitation : le jour, l'heure, ce qu'on apporte, la date de reponse, qui invite, quelle fete
  einladung(w){
    const j = jourDeMot(w);
    const sortes = [];

  // l'invitation et l'agenda de l'invite : « Ich komme gern. » / « ... leider ... Am Samstag muss ich arbeiten. »
  reponse(w){
    const oui = ES_ ? "ir" : "gern", non = ES_ ? "poder" : "leider";
    let occupe;
    if (!w || estMot(w, EINL()) || (ES_ && estMot(w, verbe("venir")))) occupe = Math.random() < 0.5;
    else if (estMot(w, ES_ ? verbe(oui) : adverbe(oui))) occupe = false;
    else if (estMot(w, ES_ ? verbe(non) : adverbe(non)) || (!ES_ && estMot(w, verbe("absagen")))) occupe = true;
    else return false;
    const inv = hasard(INV), invite = hasard(inv.pour), jf = jourDe(inv.date);
    const motifs = Object.keys(MO).filter(m => !MO[m].semaine || jf < 5);
    const mf = occupe ? hasard(motifs) : null, a = tirerAgenda(jf, mf);
    if (!a) return false;
    viser(w || (occupe ? (ES_ ? verbe(non) : adverbe(non)) : EINL()));
    if (!w && !occupe) viser(ES_ ? verbe(oui) : adverbe(oui));
    const f = sexe(invite) === "f";
    const dit = (m) => m === null
      ? (ES_ ? "¡Muchas gracias por la invitación! Voy con mucho gusto." : "Danke für die Einladung! Ich komme gern.")
      : (ES_ ? "Muchas gracias, pero lo siento, no puedo ir. " + motifPhrase(jf, m) : "Danke für die Einladung, aber ich kann leider nicht. " + motifPhrase(jf, m));

  if (s === "was") invs = invs.filter(x => x.fete && x.feiert && FETES().includes(x.fete) && (!w || w.cat === "verbe" || memeMot(feteMot(x.fete), w)) && leurresFete(x.fete).length >= 2);

  if (s === "wer") invs = invs.filter(x => uniques(INV.map(y => y.hote)).length > 2);
  if (!invs.length) return false;
  const inv = hasard(invs), invite = hasard(inv.pour), jf = jourDe(inv.date), jr = jourDe(inv.repondre);
  const apport = inv.apports.length ? (s === "mit" && w ? inv.apports.find(k => memeMot(apMot(k), w)) : hasard(inv.apports)) : null;
  const tt = TL ? inv.t[TL] : null;
  let q, rep, opts, juste, trads = null, cible_ = w;

    const f = x => amJour(x); q = ES_ ? "¿Qué día es " + inv.nom + "?" : "An welchem Tag ist " + inv.nom + "?";
    rep = f(jf); opts = melanger([jf, ...melanger([0, 1, 2, 3, 4, 5, 6].filter(x => x !== jf)).slice(0, 3)]).map(f);
    juste = ES_ ? cap(inv.nom) + " es " + amJour(jf) + "." : cap(inv.nom) + " ist " + amJour(jf) + ".";
    tradQ = tt ? {fr: cap(tt[0]) + " a lieu " + amJour(jf, "fr") + ".", en: cap(tt[0]) + " is " + amJour(jf, "en") + ".", pt: cap(tt[0]) + " é " + amJour(jf, "pt") + ".", de: cap(tt[0]) + " ist " + amJour(jf, "de") + "."}[TL] : null;
    trads = o => tradJourChoix(o, f); dirQ = jourN(jf); if (s === "tagJ") cible_ = jourMot(jf);
  } else if (s === "heure"){
    const f = h => ES_ ? "a las " + h + ":00" : "um " + h + " Uhr"; q = ES_ ? "¿A qué hora empieza " + inv.nom + "?" : "Um wie viel Uhr beginnt " + inv.nom + "?";
    rep = f(inv.heure); opts = melanger([rep, ...melanger([inv.heure - 2, inv.heure - 1, inv.heure + 1, inv.heure + 2].filter(h => h >= 8 && h <= 23)).slice(0, 3).map(f)]);
    juste = ES_ ? cap(inv.nom) + " empieza " + f(inv.heure) + "." : cap(inv.nom) + " beginnt " + f(inv.heure) + ".";
    tradQ = tt ? {fr: cap(tt[0]) + " commence " + heureTexte(inv.heure, "fr") + ".", en: cap(tt[0]) + " starts " + heureTexte(inv.heure, "en") + ".", pt: cap(tt[0]) + " começa " + heureTexte(inv.heure, "pt") + ".", de: cap(tt[0]) + " beginnt " + heureTexte(inv.heure, "de") + "."}[TL] : null;
    dirQ = rep;

    juste = apportePhrase(invite, apport, "indef"); tradQ = apporteTrad(invite, apport, "indef");
    trads = o => { const x = Object.keys(AP).find(k => AP[k].indef === o); return x ? (TL ? apT(x, 1) : glose(apMot(x))) : null; };
    dirQ = s === "mitV" ? (ES_ ? "traer" : "mitbringen") : AP[apport].indef; if (!w) cible_ = s === "mitV" ? verbe(ES_ ? "traer" : "mitbringen") : apMot(apport);
  } else if (s === "bis" || s === "bisJ"){
    const f = x => ES_ ? "antes del " + jourN(x) : "bis " + jourN(x);
    q = ES_ ? "¿Antes de qué día tiene que contestar " + invite + "?" : "Bis wann soll " + invite + " antworten?";
    rep = f(jr); opts = melanger([jr, ...melanger([0, 1, 2, 3, 4, 5, 6].filter(x => x !== jr)).slice(0, 3)]).map(f);
    juste = ES_ ? invite + " tiene que contestar " + f(jr) + "." : invite + " soll " + f(jr) + " antworten.";
    tradQ = TL ? {fr: invite + " doit répondre d'ici " + jourN(jr, "fr") + ".", en: invite + " has to reply by " + jourN(jr, "en") + ".", pt: NomT(invite, "pt") + " tem que responder até " + jourN(jr, "pt") + ".", de: invite + " soll bis " + jourN(jr, "de") + " antworten."}[TL] : null;
    trads = o => tradJourChoix(o, f); dirQ = jourN(jr); if (s === "bisJ") cible_ = jourMot(jr);
  } else if (s === "wer"){
    q = ES_ ? "¿Quién invita a " + invite + "?" : "Wer lädt " + invite + " ein?";
    rep = inv.hote; opts = melanger([rep, ...melanger(uniques(INV.map(y => y.hote)).filter(h => h !== rep && !PARTIES(h).includes(invite))).slice(0, 3)]);
    const pl = inv.s === "pl";
    juste = ES_ ? inv.hote + (pl ? " invitan a " : " invita a ") + invite + "." : inv.hote + (pl ? " laden " : " lädt ") + invite + " ein.";
    tradQ = TL ? {fr: NomT(inv.hote, "fr") + (pl ? " invitent " : " invite ") + nomT(invite, "fr") + ".", en: nomT(inv.hote, "en") + (pl ? " are inviting " : " is inviting ") + invite + ".",
                  pt: NomT(inv.hote, "pt") + (pl ? " convidam " : " convida ") + nomT(invite, "pt") + ".", de: nomT(inv.hote, "de") + (pl ? " laden " : " lädt ") + invite + " ein."}[TL] : null;
    dirQ = ES_ ? "invitar" : "einladen"; if (!w) cible_ = verbe(ES_ ? "invitar" : "einladen");
  } else {
    q = ES_ ? "¿Qué se celebra?" : "Was feiert man?";

    juste = inv.feiert; tradQ = tt ? tt[1] : null; trads = tradFete; dirQ = w && w.cat ? w.mot : FE[inv.fete].nom; if (!w) cible_ = feteMot(inv.fete);
  }

  if (memeMot(cible_, EINL())) dirQ = EINL().genre + " " + EINL().mot;          // le mot rappele sous la reponse : celui qu'on teste
  ecran("c_einladung", papierInvitation(inv, invite, apport), q, {centre: true});
  boutons($("choix"), opts, rep, ok => juger(ok, rep, juste), trads);

}
const SORTES = Object.keys(EX).filter(x => !(ES_ && x === "ordre") && !(!ES_ && x === "conjug"));

// ---------- la decouverte ----------

// ---------- LA PARTIE : recopiee de demarches.html (identique d'un theme a l'autre) ----------
const NEUFS_MAX = Q.get("seance") === "1" ? 3 : 10;
let vus = new Set(), sorteCourante = null, derniereSorte = null;
function cleQuestion(){
  const z = $("zone"), en = z.querySelector(".enonce"), pa = Array.from(z.querySelectorAll(".papier, .fil")).map(x => x.textContent).join("|");
  return sorteCourante + "|" + (en ? en.textContent : "") + "|" + (z.dataset.cle || "") + "|" + pa + "|" + Array.from(z.querySelectorAll("img")).map(i => i.getAttribute("src")).sort().join(",");
}
function remise(){ motQ = null; tradQ = null; choixFaux = null; dirQ = null; $("zone").dataset.cle = ""; }
// les mots du theme qu'une sorte au moins sait viser (les images pas encore faites, la variante) : les autres attendent
let MOTS_THEME = null;
function motsDuTheme(){
  if (MOTS_THEME) return MOTS_THEME;
  const garde = dire; dire = () => {};
  MOTS_THEME = D.mots[APPRENDRE].map(m => { const w = {mot: m.mot}; if (m.genre) w.genre = m.genre; if (m.cat) w.cat = m.cat; return w; })
    .filter(w => SORTES.some(so => { for (let n = 0; n < 8; n++){ remise(); if (EX[so](w)) return true; } return false; }));
  dire = garde; remise(); $("zone").innerHTML = "";
  return MOTS_THEME;
}
// jamais deux documents du meme genre de suite (themes/tirage.js, 8 nov. 2026)
papierInvitation = Tirage.doc("invitation", papierInvitation); papierAgenda = Tirage.doc("agenda", papierAgenda);
function montrer(){
  Voix.arreter();   // la phrase de la reponse d'avant ne passe jamais sur la question suivante (Jacques, 5 nov.)
  repondu = false; $("suite").hidden = true;
  $("compte").textContent = (rang + 1) + " / " + file.length;
  $("barre").style.width = (rang / file.length * 100) + "%";
  const garde = dire; dire = () => {};
  // La fin de partie (6 nov. 2026, recopiee de demarches.html, ec18b0a, le correctif de gato de la v1113 :
  // themes_illustres.py a vu des « sortes de suite » dans le lot des themes). Sur les trois derniers mots, une sorte est
  // ecartee si, prise maintenant, elle ne laisse a la suite aucune facon de finir sans deux sortes de suite.
  const fraiches = w => SORTES.filter(so => { for (let n = 0; n < 25; n++){ remise(); sorteCourante = so; if (!EX[so](w)) return false; if (!vus.has(cleQuestion())) return true; } return false; });
  const bloquantes = j => {             // file[j] pose la question du rang : file[rang] prend sa place plus loin
    const suite = file.slice(rang + 1).map((x, k) => rang + 1 + k === j ? file[rang] : x);
    if (!suite.length || suite.length > 3) return new Set();
    const q = suite.map(fraiches);
    const faisable = (i, prec) => i >= q.length || q[i].some(so => so !== prec && faisable(i + 1, so));
    return new Set(SORTES.filter(so => !faisable(0, so)));
  };
  const essai = (w, strict, exclues) => {
    const autres = melanger(SORTES.filter(x => x !== derniereSorte && !(strict && exclues && exclues.has(x))));
    for (const so of autres){
      for (let n = 0; n < 25; n++){
        remise(); sorteCourante = so;
        if (!EX[so](w)) break;
        if (!vus.has(cleQuestion()) && !(strict && Tirage.docRepete($("zone")))) return so;
      }
    }
    if (strict) return null;
    if (derniereSorte) for (let n = 0; n < 25; n++){
      remise(); sorteCourante = derniereSorte;
      if (!EX[derniereSorte](w)) break;
      if (!vus.has(cleQuestion())) return derniereSorte;
    }
    for (const so of autres.concat(derniereSorte ? [derniereSorte] : [])){
      remise(); sorteCourante = so;
      if (EX[so](w)) return so;
    }
    return null;
  };

    }
  Tirage.docLibre = false; if (!fait) fait = essai(file[rang], false);
  dire = garde;
  if (fait === "entendre"){ const e = $("ecoute"); if (e) e.click(); }

}
function fin(){

const boutonEncore = () => Q.get("seance") === "1" ? "" : '<button type="button" class="second" id="encore">' + (TIRAGE_TEXTES.encore[LANGUE] || TIRAGE_TEXTES.encore.fr) + '</button>';
const boutonsBas = () => '<div class="bas">' + boutonEncore() + '<button type="button" id="terminer">' + T("terminer") + '</button></div>';
function brancherEncore(){ const b = $("encore"); if (b) b.addEventListener("click", encoreDesQuestions); }

  if (Q.get("seance") === "1") demarrer(); else decouvrir();
