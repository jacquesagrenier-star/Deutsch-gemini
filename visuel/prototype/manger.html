<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comer y probar</title>
<!--
  MANGER ET GOUTER (theme illustre, 3 nov. 2026, vague 1 lancee par Jacques : « manger et gouter »). L'angle : les
  GOUTS, les QUANTITES et la COMMANDE -- jamais les objets de la cuisine, du supermarche ou du marche, qui ont leur
  scene (regle 2 : pas de theme qui refait une scene). On voit des personnes qui goutent, aiment ou n'aiment pas, et
  commandent au cafe. Lien avec « Les contraires » (rico / asqueroso, lecker / eklig) et « Emotions » (les visages).
  Images et mots : visuel/manger/manger.py -> manger/manger.json ; les phrases sont FABRIQUEES depuis ces donnees :
  une image ne dit que ce qu'elle montre. La carte et la liste de courses sont dessinees ici (fal ecrit mal).
  Ouverte par l'app dans le cadre des scenes (sceneCadre), elle parle comme une scene : « exercice » et « bonne »
  a chaque reponse (objectif du jour, carreaux), « reponse » {mot, genre, cat, sens, juste} pour le mot teste,
  « fini » et « fermer » a la fin. Le tirage suit les mots (themes/tirage.js) ; la voix : themes/voix.js.
  Parametres : apprendre=es|de, lang=<interface>, nuit=1, seance=1 (six questions, sans decouverte),
  variante=latam (jugo, mesero, sandwich ; la voix de Monica), r=<AUDIO_REVISION>.
-->
<style>
:root{--fond1:#82AFDB;--fond3:#C0D6EA;--encre:#1C2430;--gris:#4C566B;--ambre:#E8A23A;--ambre-f:#A86A0E;--vert:#2F9E6A;--rouge:#C8473A;
  --verre:rgba(255,255,255,.88);--bord:rgba(255,255,255,.95);--carte:#F7F8FA;--ardoise:#24382F;--craie:#F4F1E6;--papier:#FFFDF4;--ligne:#C9D6E8;
  --police:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html.nuit{--fond1:#0E1C26;--fond3:#18303F;--encre:#EEF2F5;--gris:#A9B8C4;--ambre-f:#E8A23A;--vert:#5CC98F;--rouge:#F07F72;
  --verre:rgba(20,36,50,.88);--bord:rgba(255,255,255,.14);--carte:#22384A;--ardoise:#13211B;--craie:#EDE8D8;--papier:#2A3A48;--ligne:#3E5468}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,var(--fond1),var(--fond3));background-attachment:fixed;color:var(--encre);font-family:var(--police);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 90px) max(10px,env(safe-area-inset-left,0px))}
.haut{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto 10px}
.retour{width:42px;height:42px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);color:var(--encre);font:800 22px var(--police);cursor:pointer;flex:0 0 auto}
html[dir="rtl"] .retour{transform:scaleX(-1)}
.titre{flex:1;font-weight:900;font-size:18px}
.compte{font-weight:800;font-size:14px;color:var(--gris)}
.barre{max-width:560px;margin:0 auto 12px;height:6px;border-radius:3px;background:rgba(28,36,48,.12);overflow:hidden}
.barre i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2BB5AA,#14807A);transition:width .3s}
main{max-width:560px;margin:0 auto;background:var(--verre);border:1px solid var(--bord);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}
.consigne{font-size:14px;font-weight:700;color:var(--gris);margin:0}
.enonce{direction:ltr;text-align:left;background:var(--carte);border-radius:14px;padding:12px 14px;font-weight:800;line-height:1.5;font-size:17px}
.enonce.centre{text-align:center;font-size:19px}
.trou{display:inline-block;min-width:64px;border-bottom:2px solid var(--ambre);text-align:center;color:var(--ambre-f)}
/* une image : le portrait carre ou la nature morte et le cafe en 4:3 */
.photo{display:block;width:100%;max-width:340px;margin:0 auto;height:auto;border-radius:16px;background:var(--carte)}
.photo.large{max-width:none;aspect-ratio:4/3;object-fit:cover}
/* quatre visages a toucher */
.visages{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.visages button{border:3px solid transparent;border-radius:16px;background:var(--carte);padding:0;cursor:pointer;overflow:hidden;display:block;color:var(--gris)}
.visages img{display:block;width:100%;height:auto;aspect-ratio:1}
.visages .nom{display:block;font-size:13px;font-weight:800;padding:3px 0 5px}
.visages button.juste{border-color:var(--vert)} .visages button.faux{border-color:var(--rouge)}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix.centre{justify-content:center}
.choix button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:9px 15px;font:800 15px var(--police);cursor:pointer}
.choix button.juste{background:var(--vert);border-color:var(--vert);color:#fff}
.choix button.faux{background:var(--rouge);border-color:var(--rouge);color:#fff}
button:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
button:disabled{cursor:default}
.retourMsg{min-height:1.4em;font-weight:800;font-size:15px;margin:0;line-height:1.45}
.retourMsg.ok{color:var(--vert)} .retourMsg.ko{color:var(--rouge)}
.retourMsg .phrase{display:block;color:var(--encre);font-weight:700}
.redire{vertical-align:middle;margin-inline-start:6px;width:32px;height:32px;border-radius:50%;border:2px solid var(--ambre);background:var(--verre);color:var(--encre);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.redire svg{width:17px;height:17px}
/* la carte du cafe : une ardoise a la craie */
.carteCafe{direction:ltr;background:var(--ardoise);color:var(--craie);border-radius:14px;padding:12px 16px;font-weight:700;font-size:15px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.06)}
.carteCafe .t{font-weight:900;font-size:18px;text-align:center;letter-spacing:.04em;margin-bottom:6px}
.carteCafe .l{display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-bottom:1px dashed rgba(244,241,230,.22)}
.carteCafe .l:last-child{border-bottom:0}
.carteCafe .p{font-variant-numeric:tabular-nums;white-space:nowrap}
/* la liste de courses : une feuille lignee */
.liste{direction:ltr;background:var(--papier);color:var(--encre);border-radius:12px;padding:10px 16px 14px;border:1px solid var(--ligne);
  background-image:repeating-linear-gradient(180deg,transparent 0 31px,var(--ligne) 31px 32px);background-position:0 40px}
.liste .t{font-weight:800;font-size:14px;color:var(--gris);margin-bottom:8px}
.liste .l,.liste .l.enonce{font:700 24px "Segoe Print","Bradley Hand","Comic Sans MS",var(--police);line-height:32px;background:none;padding:0;border-radius:0}
/* la decouverte : trois onglets, une planche de vignettes, la fiche de celle qu'on touche */
.onglets{display:flex;gap:6px;background:var(--carte);border-radius:999px;padding:4px}
.onglets button{flex:1;border:0;border-radius:999px;background:none;color:var(--gris);font:800 14px var(--police);padding:8px 4px;cursor:pointer}
.onglets button[aria-selected="true"]{background:var(--ambre);color:#1C2430}
.planche{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.planche.larges{grid-template-columns:repeat(3,1fr)}
.planche button{border:3px solid transparent;border-radius:12px;padding:0;background:var(--carte);cursor:pointer;overflow:hidden;display:block}
.planche img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover}
.planche.larges img{aspect-ratio:4/3}
.planche button.choisi{border-color:var(--ambre)}
.fiche{background:var(--carte);border-radius:14px;padding:10px;display:grid;grid-template-columns:minmax(110px,44%) 1fr;gap:12px;align-items:center}
.fiche img{width:100%;height:auto;border-radius:10px;display:block}
.fiche .mot{font-weight:900;font-size:22px;color:var(--ambre-f);line-height:1.15}
.fiche .dit{font-weight:800;font-size:17px;line-height:1.4;margin-top:6px}
.fiche .ecoute{margin-top:10px;width:44px;height:44px;border-radius:50%;border:2px solid var(--ambre);background:var(--verre);color:var(--encre);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fiche .ecoute svg{width:22px;height:22px}
.regle{margin:0;font-size:14px;font-weight:700;line-height:1.45;color:var(--gris);background:var(--carte);border-radius:12px;padding:10px 12px}
.suite{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:54px;border:0;border-radius:27px;
  color:#fff;font:800 17px var(--police);background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer}
.suite[hidden]{display:none}
.fin{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:10px 0}
.fin .score{font-size:22px;font-weight:900}
.fin button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:10px 18px;font:800 16px var(--police);cursor:pointer}
[lang]{unicode-bidi:isolate}
/* la traduction dans la langue d'interface : une ligne, plus petite, en gris (3 nov. 2026) */
.trad{display:block;font-size:13px;font-weight:600;color:var(--gris);line-height:1.35;margin-top:2px}
</style>
</head>
<body>
<div class="haut"><button class="retour" id="retour" type="button">‹</button><div class="titre" id="titre"></div><div class="compte" id="compte" dir="ltr"></div></div>
<div class="barre"><i id="barre"></i></div>
<main id="zone"></main>
<button class="suite" id="suite" type="button" hidden></button>
<script src="themes/tirage.js?v=1"></script>
<script src="themes/voix.js?v=1"></script>
<script>
const Q = new URLSearchParams(location.search);
const APPRENDRE = Q.get("apprendre") === "de" ? "de" : "es";
const LATAM = APPRENDRE === "es" && Q.get("variante") === "latam";
const LANGUE = (l => ["fr", "en", "tr", "uk", "fa", "ar", "pt", "pl", "ru", "de"].includes(l) ? l : "fr")(((Q.get("lang") || "fr").toLowerCase().split(/[-_]/)[0]));
if (Q.get("nuit") === "1") document.documentElement.classList.add("nuit");
document.documentElement.lang = LANGUE;
document.documentElement.dir = (LANGUE === "fa" || LANGUE === "ar") ? "rtl" : "ltr";
// vingt questions seul (Jacques, 3 nov.), six dans la seance du jour, sans la decouverte
const NB = Q.get("seance") === "1" ? 6 : 20;

const TEXTES = {
  titre:     {fr:"Manger et goûter", en:"Food and taste", tr:"Yemek ve tat", uk:"Їжа і смак", fa:"خوردن و چشیدن", ar:"الأكل والتذوق", pt:"Comer e provar", pl:"Jedzenie i smak", ru:"Еда и вкус", de:"Essen und Geschmack"},
  ongletG:   {fr:"Les goûts", en:"Tastes", tr:"Zevkler", uk:"Смаки", fa:"سلیقه‌ها", ar:"الأذواق", pt:"Os gostos", pl:"Gusty", ru:"Вкусы", de:"Geschmack"},
  ongletQ:   {fr:"Les quantités", en:"Quantities", tr:"Miktarlar", uk:"Кількість", fa:"مقدارها", ar:"الكميات", pt:"As quantidades", pl:"Ilości", ru:"Количество", de:"Mengen"},
  ongletC:   {fr:"Au café", en:"At the café", tr:"Kafede", uk:"У кав'ярні", fa:"در کافه", ar:"في المقهى", pt:"No café", pl:"W kawiarni", ru:"В кафе", de:"Im Café"},
  introG:    {fr:"Touche un visage : tu vois si la personne aime, et tu l'entends.", en:"Tap a face to see and hear whether the person likes it.", tr:"Bir yüze dokun: kişinin beğenip beğenmediğini gör ve dinle.", uk:"Торкнися обличчя: побачиш і почуєш, чи подобається людині.", fa:"روی یک چهره بزن تا ببینی و بشنوی آن شخص دوستش دارد یا نه.", ar:"المس وجهًا لترى وتسمع هل يعجب الشخصَ ما يأكله.", pt:"Toque em um rosto para ver e ouvir se a pessoa gosta.", pl:"Dotknij twarzy, aby zobaczyć i usłyszeć, czy tej osobie smakuje.", ru:"Нажми на лицо, чтобы увидеть и услышать, нравится ли человеку.", de:"Tippe auf ein Gesicht: Du siehst und hörst, ob es der Person schmeckt."},
  introQ:    {fr:"Touche une image : tu vois la quantité, et tu l'entends.", en:"Tap a picture to see and hear the quantity.", tr:"Bir resme dokun: miktarı gör ve dinle.", uk:"Торкнися зображення: побачиш і почуєш кількість.", fa:"روی یک تصویر بزن تا مقدار را ببینی و بشنوی.", ar:"المس صورة لترى الكمية وتسمعها.", pt:"Toque em uma imagem para ver e ouvir a quantidade.", pl:"Dotknij obrazka, aby zobaczyć i usłyszeć ilość.", ru:"Нажми на картинку, чтобы увидеть и услышать количество.", de:"Tippe auf ein Bild: Du siehst und hörst die Menge."},
  introC:    {fr:"Touche un moment : tu entends ce qu'on dit au café.", en:"Tap a moment to hear what people say at the café.", tr:"Bir ana dokun: kafede ne söylendiğini dinle.", uk:"Торкнися моменту: почуєш, що кажуть у кав'ярні.", fa:"روی یک لحظه بزن تا بشنوی در کافه چه می‌گویند.", ar:"المس لحظة لتسمع ما يُقال في المقهى.", pt:"Toque em um momento para ouvir o que se diz no café.", pl:"Dotknij chwili, aby usłyszeć, co się mówi w kawiarni.", ru:"Нажми на момент, чтобы услышать, что говорят в кафе.", de:"Tippe auf einen Moment: Du hörst, was man im Café sagt."},
  regleGes:  {fr:"Me gusta el café : une seule chose, gusta. Me gustan las fresas : plusieurs, gustan. Me encanta : j'adore. No me gusta nada : je n'aime pas du tout.", en:"Me gusta el café: one thing, gusta. Me gustan las fresas: several, gustan. Me encanta: I love it. No me gusta nada: I don't like it at all.", tr:"Me gusta el café: tek bir şey, gusta. Me gustan las fresas: birden fazla, gustan. Me encanta: bayılırım. No me gusta nada: hiç sevmem.", uk:"Me gusta el café: одна річ — gusta. Me gustan las fresas: кілька — gustan. Me encanta: обожнюю. No me gusta nada: зовсім не подобається.", fa:"Me gusta el café: یک چیز، gusta. Me gustan las fresas: چند چیز، gustan. Me encanta: عاشقش هستم. No me gusta nada: اصلاً دوست ندارم.", ar:"Me gusta el café: شيء واحد، gusta. Me gustan las fresas: عدة أشياء، gustan. Me encanta: أعشقه. No me gusta nada: لا يعجبني أبدًا.", pt:"Me gusta el café: uma coisa só, gusta. Me gustan las fresas: várias, gustan. Me encanta: eu adoro. No me gusta nada: não gosto nada.", pl:"Me gusta el café: jedna rzecz — gusta. Me gustan las fresas: kilka — gustan. Me encanta: uwielbiam. No me gusta nada: wcale mi nie smakuje.", ru:"Me gusta el café: одна вещь — gusta. Me gustan las fresas: несколько — gustan. Me encanta: обожаю. No me gusta nada: совсем не нравится.", de:"Me gusta el café: eine Sache, gusta. Me gustan las fresas: mehrere, gustan. Me encanta: Ich liebe es. No me gusta nada: Das mag ich überhaupt nicht."},
  regleGde:  {fr:"Ich mag Kaffee : mögen, ce qu'on aime en général. Der Kaffee schmeckt mir : ce qu'on goûte maintenant. Ich trinke gern Kaffee : gern avec le verbe. Et la négation : Ich mag keinen Kaffee.", en:"Ich mag Kaffee: mögen, what you like in general. Der Kaffee schmeckt mir: what you are tasting now. Ich trinke gern Kaffee: gern with the verb. And the negative: Ich mag keinen Kaffee.", tr:"Ich mag Kaffee: mögen, genel olarak sevdiğin şey. Der Kaffee schmeckt mir: şu an tattığın şey. Ich trinke gern Kaffee: fiille birlikte gern. Olumsuzu: Ich mag keinen Kaffee.", uk:"Ich mag Kaffee: mögen — що подобається загалом. Der Kaffee schmeckt mir: що смакуєш зараз. Ich trinke gern Kaffee: gern з дієсловом. Заперечення: Ich mag keinen Kaffee.", fa:"Ich mag Kaffee: mögen، آنچه به‌طور کلی دوست داری. Der Kaffee schmeckt mir: آنچه الان می‌چشی. Ich trinke gern Kaffee: gern همراه فعل. و منفی: Ich mag keinen Kaffee.", ar:"Ich mag Kaffee: mögen، ما تحبه عمومًا. Der Kaffee schmeckt mir: ما تتذوقه الآن. Ich trinke gern Kaffee: gern مع الفعل. والنفي: Ich mag keinen Kaffee.", pt:"Ich mag Kaffee: mögen, o que você gosta em geral. Der Kaffee schmeckt mir: o que você está provando agora. Ich trinke gern Kaffee: gern com o verbo. E a negação: Ich mag keinen Kaffee.", pl:"Ich mag Kaffee: mögen — co lubisz ogólnie. Der Kaffee schmeckt mir: co smakujesz teraz. Ich trinke gern Kaffee: gern z czasownikiem. Przeczenie: Ich mag keinen Kaffee.", ru:"Ich mag Kaffee: mögen — что нравится вообще. Der Kaffee schmeckt mir: что пробуешь сейчас. Ich trinke gern Kaffee: gern с глаголом. Отрицание: Ich mag keinen Kaffee.", de:"Ich mag Kaffee: im Allgemeinen. Der Kaffee schmeckt mir: jetzt. Ich trinke gern Kaffee: gern mit dem Verb. Verneint: Ich mag keinen Kaffee."},
  regleQes:  {fr:"En espagnol, la quantité prend « de » : un kilo de tomates, una botella de agua, un poco de azúcar.", en:"In Spanish, a quantity takes « de »: un kilo de tomates, una botella de agua, un poco de azúcar.", tr:"İspanyolcada miktar « de » ile söylenir: un kilo de tomates, una botella de agua, un poco de azúcar.", uk:"В іспанській кількість кажуть із « de »: un kilo de tomates, una botella de agua, un poco de azúcar.", fa:"در اسپانیایی، مقدار با « de » می‌آید: un kilo de tomates، una botella de agua، un poco de azúcar.", ar:"في الإسبانية تأتي الكمية مع « de »: un kilo de tomates، una botella de agua، un poco de azúcar.", pt:"Em espanhol, a quantidade leva « de »: un kilo de tomates, una botella de agua, un poco de azúcar.", pl:"Po hiszpańsku ilość łączy się z « de »: un kilo de tomates, una botella de agua, un poco de azúcar.", ru:"По-испански количество идёт с « de »: un kilo de tomates, una botella de agua, un poco de azúcar.", de:"Auf Spanisch steht nach der Menge « de »: un kilo de tomates, una botella de agua, un poco de azúcar."},
  regleQde:  {fr:"En allemand, pas de « de » : ein Kilo Tomaten, eine Flasche Wasser, ein bisschen Zucker. L'article suit le contenant : eine Flasche, ein Glas.", en:"In German, no « of »: ein Kilo Tomaten, eine Flasche Wasser, ein bisschen Zucker. The article goes with the container: eine Flasche, ein Glas.", tr:"Almancada « de » yoktur: ein Kilo Tomaten, eine Flasche Wasser, ein bisschen Zucker. Artikel kaba göre değişir: eine Flasche, ein Glas.", uk:"У німецькій немає « de »: ein Kilo Tomaten, eine Flasche Wasser, ein bisschen Zucker. Артикль залежить від тари: eine Flasche, ein Glas.", fa:"در آلمانی « de » نمی‌آید: ein Kilo Tomaten، eine Flasche Wasser، ein bisschen Zucker. حرف تعریف از ظرف پیروی می‌کند: eine Flasche، ein Glas.", ar:"في الألمانية لا توجد « de »: ein Kilo Tomaten، eine Flasche Wasser، ein bisschen Zucker. وأداة التعريف تتبع الوعاء: eine Flasche، ein Glas.", pt:"Em alemão, não há « de »: ein Kilo Tomaten, eine Flasche Wasser, ein bisschen Zucker. O artigo acompanha o recipiente: eine Flasche, ein Glas.", pl:"Po niemiecku nie ma « de »: ein Kilo Tomaten, eine Flasche Wasser, ein bisschen Zucker. Rodzajnik zależy od opakowania: eine Flasche, ein Glas.", ru:"В немецком нет « de »: ein Kilo Tomaten, eine Flasche Wasser, ein bisschen Zucker. Артикль зависит от тары: eine Flasche, ein Glas.", de:"Ohne Präposition: ein Kilo Tomaten, eine Flasche Wasser, ein bisschen Zucker."},
  regleCes:  {fr:"Pour commander, « Quisiera… » (je voudrais) est plus poli que « Quiero… ». Pour finir : « La cuenta, por favor ».", en:"To order, « Quisiera… » (I would like) is more polite than « Quiero… ». To finish: « La cuenta, por favor ».", tr:"Sipariş verirken « Quisiera… » (isterdim), « Quiero… »'dan daha kibardır. Sonunda: « La cuenta, por favor ».", uk:"Щоб замовити, « Quisiera… » (я хотів би) ввічливіше, ніж « Quiero… ». Наприкінці: « La cuenta, por favor ».", fa:"برای سفارش، « Quisiera… » (می‌خواستم) مؤدبانه‌تر از « Quiero… » است. در پایان: « La cuenta, por favor ».", ar:"عند الطلب، « Quisiera… » (أودّ) أكثر تهذيبًا من « Quiero… ». وفي النهاية: « La cuenta, por favor ».", pt:"Para pedir, « Quisiera… » (eu queria) é mais educado que « Quiero… ». Para terminar: « La cuenta, por favor ».", pl:"Zamawiając, « Quisiera… » (chciałbym) jest grzeczniejsze niż « Quiero… ». Na koniec: « La cuenta, por favor ».", ru:"При заказе « Quisiera… » (я бы хотел) вежливее, чем « Quiero… ». В конце: « La cuenta, por favor ».", de:"Zum Bestellen ist « Quisiera… » (ich hätte gern) höflicher als « Quiero… ». Zum Schluss: « La cuenta, por favor »."},

function T(cle, v){ let s = (TEXTES[cle] || {})[LANGUE] || (TEXTES[cle] || {}).fr || cle; for (const k in (v || {})) s = s.split("{" + k + "}").join(v[k]); return s; }

// ---------- la donnee (manger.json) ----------
let D = null;
const nom = p => (D.noms || {})[p] || p;
const maj = s => s.charAt(0).toUpperCase() + s.slice(1);
// l'Amerique latine : jugo, mesero, sandwich, papas -- a l'ecran et dans la voix ; la carte du corpus reste zumo
const latam = s => !LATAM || !s ? s : s.replace(/[A-Za-zÁÉÍÓÚáéíóúñÑ]+/g, w => D.latam[w] || w);
const GOUTS = () => D.gouts, QTES = () => D.quantites, CAFE = () => D.cafe, CARTE = () => D.carte[APPRENDRE];
const al = k => D.aliments[k][APPRENDRE];
const saveurDe = k => D.aliments[k].saveur;
// la forme d'une saveur (es) qui s'accorde avec l'aliment : el limon acido, las fresas dulces
const formeEs = (s, k) => { const a = D.aliments[k].es; return D.saveurs[s].es[(a.pl ? 2 : 0) + (a.genre === "la" ? 1 : 0)]; };
const ASCO = ["asqueroso", "asquerosa", "asquerosos", "asquerosas"];
const formeAsco = k => { const a = D.aliments[k].es; return ASCO[(a.pl ? 2 : 0) + (a.genre === "la" ? 1 : 0)]; };
const POSITIF = r => r === "encanta" || r === "gusta";
const PAIRES = ["limon", "picante", "cafe"];             // deux personnes, un oui et un non

// ---------- la langue apprise : les phrases, fabriquees comme celles de manger.py ----------
const ES = {
  bravo: "¡Muy bien!", vrai: "Verdadero", faux: "Falso",
  // « le gusta », « no le gustan nada » : ce qui va dans le trou
  verbe(r, pl){ const n = pl ? "n" : ""; return {encanta: "le encanta" + n, gusta: "le gusta" + n, no: "no le gusta" + n, nada: "no le gusta" + n + " nada"}[r]; },
  aime(g){ const a = al(g.a); return "A " + nom(g.p) + " " + this.verbe(g.r, a.pl) + " " + a.vu + "."; },
  // « La comida es picante. » : le sujet court, jamais « la comida picante es picante »
  saveur(k, s){ const a = al(k), f = formeEs(s || saveurDe(k), k);
    const v = D.aliments[k].estar ? (a.pl ? "están" : "está") : (a.pl ? "son" : "es"); return maj(a.court || a.vu) + " " + v + " " + f + "."; },
  copule(k){ const a = al(k); return D.aliments[k].estar ? (a.pl ? "están" : "está") : (a.pl ? "son" : "es"); },
  dit(k, r){ const a = al(k);
    if (POSITIF(r)) return "¡Qué rico!";
    if (r === "nada") return "¡" + (a.pl ? "Están" : "Está") + " " + formeAsco(k) + "!";
    if (saveurDe(k)) return this.trop(k, saveurDe(k));
    return "No me gusta" + (a.pl ? "n" : "") + " " + a.vu + "."; },
  trop(k, s){ return "¡" + (al(k).pl ? "Están" : "Está") + " demasiado " + formeEs(s, k) + "!"; },
  asco(k){ return "¡" + (al(k).pl ? "Están" : "Está") + " " + formeAsco(k) + "!"; },
  bueno: "¡Está buenísimo!",
  quienSaveur: s => "¿Quién prueba algo " + D.saveurs[s].es[0] + "?",
  quienPaire(k, neg){ const a = al(k); return "¿A quién " + (neg ? "no " : "") + "le gusta" + (a.pl ? "n" : "") + " " + a.vu + "?"; },
  dice: p => "¿Qué dice " + nom(p) + "?",
  cantidad: d => "Es ___ " + D.contenus[d].es.dit + ".",
  queEs: "¿Qué es?", lista: "¿Cómo se dice?",
  np: (c, d) => D.contenants[c].es.art + " " + D.contenus[d].es.dit,
  rol: p => nom(p) + " es ___.",
  carte: "Carta", listeTitre: "Lista de la compra",
  // la commande : « Carmen toma un café y un trozo de tarta. ¿Cuánto es? »
  commande(qui, items, cuenta){ const s = qui.map(nom).join(" y "), v = qui.length > 1 ? "toman" : "toma";
    return cuenta ? s + " " + (qui.length > 1 ? "piden" : "pide") + " la cuenta: " + liste(items, "es") + ". ¿Cuánto es?" : s + " " + v + " " + liste(items, "es") + ". ¿Cuánto es?"; },
  cuesta: it => "¿Cuánto cuesta " + it.un + "?",
  total: p => "Son " + prix(p) + ".", seul: (it, p) => maj(it.un) + " cuesta " + prix(p) + ".",
  totalDit: p => "Son " + prixEnLettres(p) + ".", seulDit: (it, p) => maj(it.un) + " cuesta " + prixEnLettres(p) + ".",
  et: " y "
};
const DE = {
  bravo: "Sehr gut!", vrai: "Richtig", faux: "Falsch",
  // « Die Erdbeeren schmecken Anna. » -- ce qui va dans le trou
  schmeckt(r, pl){ return (pl ? "schmecken" : "schmeckt") + ({no: " nicht", nada: " überhaupt nicht"}[r] || ""); },
  // « Die Suppe schmeckt Javier nicht. » : ce qu'on goute maintenant
  schmecktPhrase(g){ const a = al(g.a); return maj(a.nom) + " " + (a.pl ? "schmecken" : "schmeckt") + " " + nom(g.p) + ({no: " nicht", nada: " überhaupt nicht"}[g.r] || "") + "."; },
  mag(g){ const a = al(g.a); if (!a.gen) return null;
    if (g.r === "encanta") return nom(g.p) + " liebt " + a.gen + ".";
    if (g.r === "gusta") return nom(g.p) + " mag " + a.gen + ".";
    return nom(g.p) + " mag " + (g.r === "nada" ? "überhaupt " : "") + a.kein + " " + a.gen + "."; },
  aime(g){ return this.mag(g) || this.schmecktPhrase(g); },
  saveur(k, s){ const a = al(k), sujet = k === "picante" ? "das Essen" : a.nom; return maj(sujet) + " " + (a.pl ? "sind" : "ist") + " " + D.saveurs[s || saveurDe(k)].de + "."; },
  dit(k, r){ const a = al(k);
    if (POSITIF(r)) return "Lecker!";
    if (r === "nada") return "Igitt, das ist eklig!";
    if (saveurDe(k)) return this.trop(k, saveurDe(k));
    return "Ich mag " + a.kein + " " + a.gen + "."; },
  trop: (k, s) => "Das ist zu " + D.saveurs[s].de + "!",
  asco: () => "Igitt, das ist eklig!",
  bueno: "Sehr gut!",
  quienSaveur: s => "Wer probiert etwas " + D.saveurs[s].etwas + "?",
  quienPaire(k, neg){ const a = al(k); return "Wem " + (a.pl ? "schmecken" : "schmeckt") + " " + (k === "picante" ? "das scharfe Essen" : a.nom) + (neg ? " nicht" : "") + "?"; },
  dice: p => "Was sagt " + nom(p) + "?",
  cantidad: d => "Das ist ___ " + D.contenus[d].de.dit + ".",
  queEs: "Was ist das?", lista: "Wie sagt man das?",
  np: (c, d) => D.contenants[c].de.art + " " + D.contenus[d].de.dit,
  rol: p => nom(p) + " ist ___.",
  carte: "Speisekarte", listeTitre: "Einkaufsliste",
  commande(qui, items, cuenta){ const s = qui.map(nom).join(" und ");
    return cuenta ? s + " " + (qui.length > 1 ? "möchten" : "möchte") + " die Rechnung: " + liste(items, "de") + ". Was macht das?" : s + " " + (qui.length > 1 ? "nehmen" : "nimmt") + " " + liste(items, "de") + ". Was macht das?"; },
  cuesta: it => "Was kostet " + it.nom + "?",
  total: p => "Das macht " + prix(p) + ".", seul: (it, p) => maj(it.nom) + " kostet " + prix(p) + ".",
  totalDit: p => "Das macht " + prixEnLettres(p) + ".", seulDit: (it, p) => maj(it.nom) + " kostet " + prixEnLettres(p) + ".",
  et: " und "
};
const L = APPRENDRE === "de" ? DE : ES;
// « un café y un trozo de tarta », « einen Kaffee und ein Stück Kuchen » : items = [[article de la carte, nombre]]
function liste(items, l){
  const t = items.map(([it, n]) => n > 1 ? it.deux : it.un);
  return t.length < 2 ? t[0] : t.slice(0, -1).join(", ") + (l === "de" ? " und " : " y ") + t[t.length - 1];
}

const ES_N = ["cero", "un", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve", "diez", "once", "doce", "trece", "catorce", "quince",

function nombre(n, l){
  if (l === "es"){ if (n < 30) return ES_N[n]; const d = Math.floor(n / 10), u = n % 10; return ES_D[d] + (u ? " y " + (u === 1 ? "un" : ES_N[u]) : ""); }
  if (n < 20) return DE_N[n]; const d = Math.floor(n / 10), u = n % 10; return (u ? (u === 1 ? "ein" : DE_N[u]) + "und" : "") + DE_D[d];

// es : « cuatro euros con noventa », « un euro con veinte » ; de : « vier Euro neunzig », « ein Euro zwanzig »
function prixEnLettres(c){
  const e = Math.floor(c / 100), ct = c % 100;

  return nombre(e, "de") + " Euro" + (ct ? " " + nombre(ct, "de").replace(/^ein$/, "eins") : "");

    if (LANGUE === "de") return n + " probiert etwas " + D.saveurs[s].etwas + ".";

let motQ = null, aDire = null;
function juger(ok, bonneTexte, phrase, lu){
  if (repondu) return; repondu = true;

  if (motQ) parler("reponse", {mot: motQ.mot, genre: motQ.genre || null, cat: motQ.cat || null, sens: motQ.sens || null, juste: ok});

  const m = $("msg"); m.className = "retourMsg " + (ok ? "ok" : "ko");

  m.innerHTML = (ok ? cible(L.bravo) : T("bonne", {r: cible(bonneTexte)})) + (phrase && phrase !== bonneTexte ? '<span class="phrase">' + cible(phrase) + '</span>' : "")

function boutons(conteneur, options, bonne, apres){

// LES MOTS DU THEME (le tirage suit les mots), a la forme du corpus : chaque mot porte ce que les sortes savent en
// faire (a : un aliment goute, s : une saveur, r : une reaction, v : un verbe, c : un contenant, d : un contenu,
// u : une unite de la liste, cafe : un moment, role : qui est qui, m : un article de la carte). Un mot peut en
// porter plusieurs (la tarta est goutee, pesee et sur la carte).
let MOTS = null;
function motsDuTheme(){
  if (MOTS) return MOTS;
  const par = new Map();
  const ajouter = (mot, g, props) => {
    if (!mot) return;
    const cle = mot + "|" + g;
    if (!par.has(cle)) par.set(cle, Object.assign({mot}, g === "adjectif" || g === "verbe" ? {cat: g} : {genre: g}));
    const w = par.get(cle);
    for (const k in props) if (w[k] === undefined) w[k] = props[k];
  };
  Object.keys(D.aliments).forEach(k => ajouter(al(k).mot, al(k).genre, {a: k}));
  Object.keys(D.saveurs).forEach(s => ajouter(APPRENDRE === "de" ? D.saveurs[s].de : D.saveurs[s].es[0], "adjectif", {s}));
  if (APPRENDRE === "es"){
    ajouter("rico", "adjectif", {r: "pos", sens: D.sens.es.rico}); ajouter("asqueroso", "adjectif", {r: "nada"});
    ajouter("gustar", "verbe", {v: "gustar"}); ajouter("encantar", "verbe", {v: "encantar"}); ajouter("probar", "verbe", {v: "probar"});
  } else {
    ajouter("lecker", "adjectif", {r: "pos"}); ajouter("eklig", "adjectif", {r: "nada"});
    ajouter("mögen", "verbe", {v: "mogen"}); ajouter("schmecken", "verbe", {v: "schmecken"}); ajouter("lieben", "verbe", {v: "lieben"}); ajouter("probieren", "verbe", {v: "probar"});
  }
  Object.keys(D.contenants).forEach(c => ajouter(D.contenants[c][APPRENDRE].mot, D.contenants[c][APPRENDRE].genre, {c}));
  Object.keys(D.contenus).forEach(d => ajouter(D.contenus[d][APPRENDRE].mot, D.contenus[d][APPRENDRE].genre, {d}));
  CAFE().forEach(m => ajouter(m[APPRENDRE].mot.mot, m[APPRENDRE].mot.genre || m[APPRENDRE].mot.cat, {cafe: m.id}));
  Object.keys(D.roles).forEach(p => { const r = D.roles[p][APPRENDRE]; if (r) ajouter(r.mot, r.genre, {role: p}); });
  CARTE().forEach(it => ajouter(it.mot, it.genre, {m: it.cle}));
  const UNITES_G = APPRENDRE === "es" ? {kilo: "el", gramo: "el", litro: "el"} : {Kilo: "das", Gramm: "das", Liter: "der", Pfund: "das", Packung: "die"};
  Object.keys(UNITES_G).forEach(u => ajouter(u, UNITES_G[u], {u}));
  MOTS = [...par.values()];
  return MOTS;
}

// ce que dit la personne qui goute : les degustations qu'un mot vise, le mot que la phrase teste, et les leurres --
// jamais un leurre qui pourrait aussi etre vrai : qui aime ne dit pas « trop epice » de ce qu'il aime ; qui grimace
// pourrait dire « c'est degoutant » ; qui n'aime pas ne dit ni « delicieux » ni « tres bon »
const viseDit = w => g => !w || (w.r ? (w.r === "pos" ? POSITIF(g.r) : g.r === "nada") : w.s ? (g.r === "no" && saveurDe(g.a) === w.s) : g.a === w.a);
const motSaveur = s => APPRENDRE === "de" ? D.saveurs[s].de : D.saveurs[s].es[0];

  if (POSITIF(g.r)) return APPRENDRE === "es" ? {mot: "rico", cat: "adjectif", sens: D.sens.es.rico} : {mot: "lecker", cat: "adjectif"};
  if (g.r === "nada") return {mot: APPRENDRE === "es" ? "asqueroso" : "eklig", cat: "adjectif"};
  return saveurDe(g.a) ? {mot: motSaveur(saveurDe(g.a)), cat: "adjectif"} : {mot: al(g.a).mot, genre: al(g.a).genre};
}
function leurresDit(g){
  const autres = Object.keys(D.saveurs).filter(s => s !== saveurDe(g.a)).map(s => L.trop(g.a, s));
  if (POSITIF(g.r)) return [L.asco(g.a), ...autres];
  if (g.r === "nada" || !saveurDe(g.a)) return [L.dit(g.a, "gusta"), L.bueno];
  return [L.dit(g.a, "gusta"), L.bueno, ...autres];

    const m = hasard(CAFE().filter(x => x.gens.includes(p)));
    motQ = w || {mot: r.mot, genre: r.genre}; sensQ = {role: {p, mot: r.mot}}; vuQ = null;
    const tous = D.rolesChoix[APPRENDRE][D.sexe[p]], bon = r.genre + " " + r.mot, juste = latam(L.rol(p).replace("___", bon));
    return {image: large("cafe-" + m.id), phrase: vrai ? juste : latam(L.rol(p).replace("___", hasard(tous.filter(x => x !== bon)))), juste, vrai};
  }
};
// les sortes de la langue apprise : « mögen / kein » n'existe qu'en allemand
const SORTES = Object.keys(EX).filter(x => APPRENDRE === "de" || x !== "mogen");

// ---------- la decouverte : trois planches a toucher, chaque element se voit, s'entend et se traduit ----------
function decouvrir(){
  $("compte").textContent = ""; $("barre").style.width = "0%";
  const z = $("zone"), phrases = D.decouverte[APPRENDRE === "de" ? "de" : LATAM ? "latam" : "es"];
  z.innerHTML = '<div class="onglets" role="tablist"><button type="button" role="tab" id="oG">' + T("ongletG") + '</button><button type="button" role="tab" id="oQ">' + T("ongletQ")
              + '</button><button type="button" role="tab" id="oC">' + T("ongletC") + '</button></div>'
              + '<p class="consigne" id="intro"></p><div class="planche" id="planche"></div><div class="fiche" id="fiche"></div><p class="regle" id="regle"></p>';
  const ONGLETS = {
    G: {liste: GOUTS(), larges: false, intro: "introG", regle: APPRENDRE === "de" ? "regleGde" : "regleGes",
        mot: g => L.dit(g.a, g.r), sous: g => null, trad: g => traduire({aime: g}) || (TR ? null : glose({mot: al(g.a).mot, genre: al(g.a).genre}))},
    Q: {liste: QTES(), larges: true, intro: "introQ", regle: APPRENDRE === "de" ? "regleQde" : "regleQes",
        mot: q => q.c === "poco" ? L.np(q.c, q.d) : (APPRENDRE === "de" ? D.contenants[q.c].de.genre + " " + D.contenants[q.c].de.mot : D.contenants[q.c].es.genre + " " + D.contenants[q.c].es.mot),
        sous: q => null, trad: q => traduire({qte: q}) || (TR ? null : glose(q.c !== "poco" ? D.contenants[q.c][APPRENDRE] : D.contenus[q.d][APPRENDRE]))},
    C: {liste: CAFE().map(m => Object.assign({}, m, {id: "cafe-" + m.id, cle: m.id})), larges: true, intro: "introC", regle: APPRENDRE === "de" ? "regleCde" : "regleCes",
        mot: m => latam(m[APPRENDRE].fait), sous: m => null, trad: m => traduire({cafe: {id: m.cle}}) || (TR ? null : glose(m[APPRENDRE].mot))}
  };
  const montrer = (o, it) => {
    const ph = phrases[it.id];
    $("planche").querySelectorAll("button").forEach(b => b.classList.toggle("choisi", b.dataset.id === it.id));
    $("fiche").innerHTML = '<img alt="" src="' + img(it.id) + '"><div><div class="mot">' + cible(o.mot(it)) + '</div><div class="dit">' + cible(ph.texte) + '</div>'
                         + ((t => t ? traduction(t) : "")(o.trad(it)))
                         + '<button type="button" class="ecoute" id="ecoute" aria-label="' + T("ecouter") + '">' + HP + '</button></div>';
    $("ecoute").addEventListener("click", () => dire(ph.texte));
    dire(ph.texte);
  };
  const onglet = cle => {
    const o = ONGLETS[cle];
    ["G", "Q", "C"].forEach(k => $("o" + k).setAttribute("aria-selected", k === cle));
    $("intro").textContent = T(o.intro);
    $("regle").innerHTML = isoler(T(o.regle));
    const pl = $("planche"); pl.className = "planche" + (o.larges ? " larges" : ""); pl.innerHTML = "";
    o.liste.forEach(it => {
      const b = document.createElement("button"); b.type = "button"; b.dataset.id = it.id;
      b.setAttribute("aria-label", it.p ? nom(it.p) : phrases[it.id].texte);
      b.innerHTML = '<img alt="" src="' + img(it.id) + '">';
      b.addEventListener("click", () => montrer(o, it));
      pl.appendChild(b);
    });
    // la fiche s'ouvre sur la premiere, sans parler : le son ne vient que d'un geste
    const garde = dire; dire = () => {}; montrer(o, o.liste[0]); dire = garde;
  };
  ["G", "Q", "C"].forEach(k => $("o" + k).addEventListener("click", () => onglet(k)));
  onglet("G");
  const s = $("suite"); s.textContent = T("commencer"); s.hidden = false;
  s.onclick = () => { s.onclick = null; Voix.arreter(); demarrer(); };
}

// LA PARTIE (3 nov. 2026, « le tirage suit les mots ») : la file des MOTS vient de l'app (Tirage.plan : les dus,
// les rates recents, puis au plus NEUFS_MAX nouveaux) ; chaque mot recoit une question d'une sorte qui le vise,
// jamais la meme sorte deux fois de suite, jamais deux fois la meme question. Rate, il revient plus loin.
// Recopie de familia.html (visuel/THEMES-ILLUSTRES.md : ces fonctions sont identiques d'un theme a l'autre).
const NEUFS_MAX = Q.get("seance") === "1" ? 3 : 10;
let vus = new Set(), sorteCourante = null, derniereSorte = null;
function cleQuestion(){
  const z = $("zone"), en = z.querySelector(".enonce");
  return sorteCourante + "|" + (en ? en.textContent : "") + "|" + Array.from(z.querySelectorAll("img")).map(i => i.getAttribute("src")).sort().join(",");
}
function montrer(){
  repondu = false; $("suite").hidden = true;
  $("compte").textContent = (rang + 1) + " / " + file.length;
  $("barre").style.width = (rang / file.length * 100) + "%";
  // une question pour le mot du rang : d'une AUTRE sorte que la precedente et jamais deja vue dans la partie.
  // Si ce mot ne le permet pas, un mot plus loin dans la file passe devant ;
  // en dernier recours seulement, la meme sorte, puis une question deja vue.
  const essai = (w, strict) => {
    const autres = melanger(SORTES.filter(x => x !== derniereSorte));
    for (const so of autres){
      for (let n = 0; n < 25; n++){
        motQ = null; vuQ = null; sensQ = null; sorteCourante = so;
        if (!EX[so](w)) break;
        if (!vus.has(cleQuestion())) return so;
      }
    }
    if (strict) return null;
    if (derniereSorte) for (let n = 0; n < 25; n++){           // la meme sorte, avec une question fraiche
      motQ = null; vuQ = null; sensQ = null; sorteCourante = derniereSorte;
      if (!EX[derniereSorte](w)) break;
      if (!vus.has(cleQuestion())) return derniereSorte;
    }
    for (const so of autres.concat(derniereSorte ? [derniereSorte] : [])){   // tout est deja vu : n'importe laquelle
      motQ = null; vuQ = null; sensQ = null; sorteCourante = so;
      if (EX[so](w)) return so;
    }
    return null;
  };
  let fait = essai(file[rang], true);
  for (let j = rang + 1; !fait && j < file.length; j++){
    fait = essai(file[j], true);
    if (fait) [file[rang], file[j]] = [file[j], file[rang]];
  }
  if (!fait) fait = essai(file[rang], false);
  vus.add(cleQuestion()); derniereSorte = fait; retenir();
  window.scrollTo(0, 0);
}
function fin(){
  $("barre").style.width = "100%"; $("compte").textContent = file.length + " / " + file.length; $("suite").hidden = true;
  $("zone").innerHTML = '<div class="fin"><div class="score">' + T("score", {b: bons, n: file.length}) + '</div>' + boutonEncore() + '<button type="button" id="terminer">' + T("terminer") + '</button></div>';
  brancherEncore();
  $("terminer").addEventListener("click", () => parler("fini", {bons, faits: file.length}));
}
// plus rien de du ni de nouveau : la partie le dit, et ne repose pas des mots deja sus
function toutRevu(prochaine){
  $("barre").style.width = "100%"; $("compte").textContent = ""; $("suite").hidden = true;
  const quand = Tirage.revu(prochaine, LANGUE);
  $("zone").innerHTML = '<div class="fin"><div class="score">' + (TIRAGE_TEXTES.revu[LANGUE] || TIRAGE_TEXTES.revu.fr) + '</div>'
    + (quand ? '<p class="consigne">' + (TIRAGE_TEXTES.prochaine[LANGUE] || TIRAGE_TEXTES.prochaine.fr).replace("{d}", quand) + '</p>' : "")
    + boutonEncore() + '<button type="button" id="terminer">' + T("terminer") + '</button></div>';
  brancherEncore();
  $("terminer").addEventListener("click", () => parler("fini", {bons: 0, faits: 0}));
}
// « Encore des questions » : en fin de partie et quand tout est revu, jamais dans la seance (elle a sa longueur)
const boutonEncore = () => Q.get("seance") === "1" ? "" : '<button type="button" id="encore">' + (TIRAGE_TEXTES.encore[LANGUE] || TIRAGE_TEXTES.encore.fr) + '</button>';
function brancherEncore(){ const b = $("encore"); if (b) b.addEventListener("click", encoreDesQuestions); }
async function encoreDesQuestions(){
  const mots = motsDuTheme();
  file = Tirage.supplement(mots, await Tirage.demander(mots), NB); rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(null);
  montrer();
}
async function demarrer(){
  const mots = motsDuTheme();
  const plan = Tirage.plan(mots, await Tirage.demander(mots), NB, NEUFS_MAX);
  file = plan.file; rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(plan.prochaine);
  montrer();
}
$("suite").addEventListener("click", () => { if (!file.length) return; rang++; if (rang >= file.length) fin(); else montrer(); });
$("retour").addEventListener("click", () => parler("fermer"));
$("retour").setAttribute("aria-label", T("retourAria"));
$("titre").textContent = T("titre");
document.title = T("titre");
fetch("manger/manger.json?v=1").then(r => r.json()).then(d => {
  D = d;
  if (Q.get("seance") === "1") demarrer(); else decouvrir();
});
</script>
