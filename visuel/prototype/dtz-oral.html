<!--
  MARK ET ANNA T'AIDENT A PREPARER LE DTZ -- L'ORAL (maquette, 3 nov. 2026, essai admin « dtz_oral » ; titre du 4 nov.).
  Jacques : « est-ce qu'on peut faire poser des questions par Anna ou Marc ». L'oral du DTZ en entier, dans son FORMAT
  (manuel du DTZ, 2009), en CINQ SECTIONS qu'on fait seules ou a la suite (examen complet) : 1 se presenter, 2 repondre a
  des questions, 3 decrire une photo, 4 raconter et comparer, 5 planifier a deux. Une page par exercice (SECTIONS).
  Tout le contenu est a nous : textes, sujet, photos (deux scenes deja faites de l'app), voix.

  LA FICTION. Mark parle allemand depuis l'enfance (scenes/personnages.json, « origine ») : il n'a pas besoin du DTZ.
  C'est donc une REPETITION (decide par Jacques le 3 nov. : « Oui, une repetition ») : Anna joue l'examinatrice, Mark joue l'autre candidat, et l'eleve parle pour lui-meme.
  Mark, de Montreal, explique en francais. On ne les voit jamais ensemble sur une image.

  LE VERDICT EST UNE ESTIMATION, et la page le dit. La reconnaissance vocale donne un texte ; on y mesure ce qui se
  mesure : les points de la consigne traites, la longueur, les liens (weil, dass, deshalb...), le passe, la
  comparaison, les propositions et les questions a l'autre. La justesse de la grammaire et la prononciation, elle
  ne les juge pas : c'est ecrit sous chaque verdict.

  LES VOIX ET LES CLIPS. Anna et Mark parlent en video (Kling, dtz/video/<id>.mp4, coupes a la fin de la voix) avec
  leurs voix de la serie (ElevenLabs v2, dtz/voix/<id>.mp3), listes par dtz/voix/manifest.json et fabriques par
  video/episode-dtz-oral/publier_medias.py ; sans fichier, la voix du telephone.

  LE MICRO. La reconnaissance du navigateur quand la page l'a (navigateur, site) ; sinon, dans les apps, elle la
  demande a l'app par message (« wortando-scene », type « micro ») : le module natif vit dans la page de l'app.
  Sans l'un ni l'autre : on ecrit sa reponse (utile aussi pour essayer sur un ordinateur).

  Parametres : nuit=1. Interface en francais seulement (essai admin).
-->
<style>

<script>
const Q = new URLSearchParams(location.search);
if (Q.get("nuit") === "1") document.documentElement.classList.add("nuit");
const DANS_APP = window.parent && window.parent !== window;
function parler(type, extra){ try{ if (DANS_APP) parent.postMessage(Object.assign({source:"wortando-scene", type}, extra || {}), "*"); }catch(e){} }

const IMG = { anna: "descripcion/Anna-visage.webp", mark: "descripcion/Mark-visage.webp" };
const NOMS = { anna: "Anna · examinatrice", mark: "Mark · l’autre candidat" };

// ---------------------------------------------------------------- le texte
// Chaque replique a un id : c'est le nom de son futur fichier son (dtz/voix/<id>.mp3).
const L = {
  // Partie 1
  a_bienvenue: ["anna", "Guten Tag und herzlich willkommen! Ich führe heute das Gespräch. Wir beginnen mit einer kurzen Vorstellung. Auf dem Blatt stehen ein paar Stichwörter. Herr Garnier, fangen Sie bitte an.",

  m_vorstellung: ["mark", "Gern. Mein Name ist Mark Garnier, ich bin fünfundzwanzig Jahre alt. Ich komme aus Montréal, das ist in Kanada. Mein Vater ist Frankokanadier und meine Mutter ist Deutsche, deshalb spreche ich Französisch, Englisch und Deutsch. Seit ein paar Monaten wohne ich in Berlin, in einer kleinen Wohnung. Im Moment mache ich ein Praktikum in einem Büro. Meine Familie lebt noch in Kanada, aber wir telefonieren jede Woche.",

  a_danke_mark: ["anna", "Vielen Dank. Und jetzt Sie, bitte. Stellen Sie sich vor.",
    "Merci beaucoup. Et maintenant vous, s’il vous plaît. Présentez-vous."],
  // 1b : une question de suite, choisie selon ce qui manque
  a_frage_familie: ["anna", "Danke schön. Erzählen Sie doch noch etwas über Ihre Familie. Wer gehört dazu, und wo leben die anderen?",

    "Merci. Et que faites-vous volontiers pendant votre temps libre ? Racontez un peu."],

  a_ihr_foto: ["anna", "Danke. Und was sehen Sie auf Ihrem Foto?", "Merci. Et vous, que voyez-vous sur votre photo ?"],
  a_erfahrung: ["anna", "Danke. Und wie ist das bei Ihnen: Wo kaufen Sie am liebsten ein, auf dem Markt oder im Supermarkt? Und wie war das in Ihrem Heimatland?",

  // Partie 3
  a_planen: ["anna", "Vielen Dank. Jetzt kommt der letzte Teil. Sie planen zusammen einen Ausflug mit Ihrem Deutschkurs. Auf dem Blatt stehen ein paar Fragen. Sprechen Sie miteinander und einigen Sie sich. Herr Garnier, fangen Sie an.",
    "Merci beaucoup. Voici la dernière partie. Vous organisez ensemble une sortie avec votre cours d’allemand. Sur la feuille, il y a quelques questions. Parlez ensemble et mettez-vous d’accord. Monsieur Garnier, commencez."],
  m_p1: ["mark", "Also, wohin fahren wir? Ich hätte Lust auf einen See, zum Beispiel den Wannsee. Da kann man schwimmen und picknicken. Was meinst du?",
    "Alors, on va où ? J’aurais envie d’un lac, par exemple le Wannsee. On peut s’y baigner et pique-niquer. Qu’est-ce que tu en penses ?"],

  m_p4: ["mark", "Und was nehmen wir mit? Ich kann einen Kuchen backen. Was bringst du mit?",

  m_p5: ["mark", "Gut. Wer sagt den anderen Bescheid? Schreibst du in die Gruppe, oder soll ich das machen?",
    "Bien. Qui prévient les autres ? Tu écris dans le groupe, ou je m’en occupe ?"],
  m_ok: ["mark", "Gute Idee, einverstanden!", "Bonne idée, d’accord !"],
  m_ok2: ["mark", "Okay, das passt mir.", "D’accord, ça me va."],
  m_nein: ["mark", "Hm, stimmt, da hast du recht. Dann machen wir es so.", "Hum, c’est vrai, tu as raison. Alors on fait comme ça."],
  m_nachfrage: ["mark", "Wie meinst du das? Sag ruhig, was du denkst.", "Tu veux dire quoi ? Dis-moi ce que tu en penses."],
  m_ende: ["mark", "Super, dann haben wir alles geplant. Ich freue mich schon!", "Super, alors on a tout prévu. J’ai déjà hâte !"],
  // La fin
  a_ende_B1: ["anna", "Vielen Dank, wir sind am Ende. Wenn das heute die Prüfung gewesen wäre, hätten Sie im Sprechen wahrscheinlich B1 erreicht. Sehr schön!",
    "Merci beaucoup, nous avons terminé. Si c’était l’examen aujourd’hui, vous auriez probablement obtenu le B1 à l’oral. Très bien !"],

    "Merci beaucoup, nous avons terminé. Si c’était l’examen aujourd’hui, vous auriez probablement obtenu l’A2 à l’oral. Il ne manque plus grand-chose pour le B1."],
  a_ende_moins: ["anna", "Vielen Dank, wir sind am Ende. Für A2 war es heute noch etwas knapp. Üben Sie weiter, das lohnt sich!",
    "Merci beaucoup, nous avons terminé. Pour l’A2, c’était encore un peu juste aujourd’hui. Continuez à vous entraîner, ça vaut la peine !"]

// Mark, coach, en francais (texte seul : sa voix enregistree parle allemand).
const COACH = {
  accueil: "Salut ! Moi, c’est Mark. Au DTZ, l’oral se passe à deux, devant deux examinateurs, sans temps de préparation : environ 20 minutes en tout. On le répète ensemble : Anna joue l’examinatrice, moi l’autre candidat. Toi, tu parles pour toi, à voix haute.",
  p1a: "Partie 1 : se présenter. Tu parles environ une minute, seul. Les mots-clés de la feuille t’aident, mais tu n’es pas obligé de tous les traiter. Je passe en premier : écoute comment je fais.",
  p1b: "Ensuite, Anna te pose une ou deux questions sur ce que tu viens de dire. Réponds en plusieurs phrases, avec une raison (« weil… », « deshalb… ») : une réponse d’un mot ne montre rien.",
  p2a: "Partie 2 : une photo. Dis ce que tu vois, où (links, rechts, im Hintergrund), et ce qui se passe, même si tu n’en es pas sûr : « Ich glaube… », « Vielleicht… ». Je décris la mienne d’abord.",
  p2b: "Puis Anna te demande ton expérience et une comparaison avec ton pays. C’est là que le B1 se joue : raconter au passé et comparer (« mehr als », « billiger », « bei uns… »).",

  fin: "Bravo d’être allé jusqu’au bout ! Le résultat ci-dessous est une estimation : l’app entend ce que tu dis, pas comment tu le dis."
};
const AIDE = {
  p1a: ["Ich heiße …", "Ich komme aus …", "Ich wohne seit … in …", "Ich arbeite als … / Ich suche Arbeit.", "Ich bin verheiratet und habe … Kinder.", "Ich spreche …"],
  p1b: ["… weil …", "Deshalb …", "Zum Beispiel …", "Am liebsten …"],
  p2a: ["Auf dem Foto sehe ich …", "Links / Rechts / In der Mitte …", "Im Hintergrund …", "Ich glaube, …", "Vielleicht …"],
  p2b: ["Ich kaufe meistens …", "In meinem Heimatland …", "Bei uns war das anders: …", "… ist billiger / frischer als …", "Früher habe ich …"],
  p3: ["Wir könnten …", "Wie wäre es mit …?", "Gute Idee!", "Lieber …, weil …", "Was meinst du?", "Einverstanden."]
};
const STICHWORTE = ["Name", "Herkunft", "Wohnort", "Arbeit / Beruf", "Familie", "Sprachen"];
const PLAN_NOTIZEN = ["Wohin?", "Wann?", "Wie hinkommen?", "Was mitnehmen?", "Wer sagt Bescheid?"];

// ---------------------------------------------------------------- la mesure
const norm = s => String(s || "").toLowerCase().replace(/[.,!?;:«»"„“()]/g, " ").replace(/\s+/g, " ").trim();
const nbMots = s => norm(s).split(" ").filter(Boolean).length;
const a = (re, s) => re.test(norm(s));
const LIENS = /\b(weil|dass|wenn|obwohl|als|damit|deshalb|darum|deswegen|trotzdem|außerdem|denn|ob|zum beispiel)\b/;
const PROPOSE = /\b(wir könnten|können wir|wie wäre es|wollen wir|lass uns|lasst uns|ich schlage vor|vielleicht|wir sollten|ich würde|was hältst du|treffen wir uns|ich bringe|ich kann|ich nehme)\b/;
const REAGIT = /\b(gute idee|einverstanden|okay|ok|genau|stimmt|super|prima|toll|ich finde|lieber|nicht so gut|ich weiß nicht|klingt gut|das passt|passt mir|gerne|gern|ja|nein)\b/;
const DEMANDE = /\b(was meinst du|was denkst du|oder|passt (dir|es dir)|hast du|kannst du|willst du|möchtest du|wie findest du|bringst du|machst du|und du)\b/;
const PASSE = /\b(habe|hast|hat|haben|bin|bist|ist|sind|war|waren|hatte|hatten)\b[^.]*\bge\w+(t|en)\b|\b(war|waren|hatte|hatten|früher)\b/;
const POINTS_1A = [
  ["Name", /\b(heiße|heisse|mein name|name ist)\b/],
  ["Herkunft", /\b(komme|komm) (aus|ursprünglich)|\b(geboren|stamme aus|bin aus)\b/],
  ["Wohnort", /\b(wohne|lebe (in|seit|hier|jetzt|mit)|wohnort)\b/],
  ["Arbeit / Beruf", /\b(arbeite|arbeit|beruf|beruflich|studiere|student|studentin|praktikum|ausbildung|job|stelle|arbeitslos|rente|rentner|rentnerin|hausfrau|hausmann)\b/],
  ["Familie", /\b(verheiratet|ledig|geschieden|kinder|kind|sohn|söhne|tochter|töchter|frau|mann|familie|eltern|mutter|vater|bruder|schwester|geschwister|allein|single|partner|partnerin)\b/],
  ["Sprachen", /\b(spreche|sprache|sprachen|muttersprache)\b/]
];
const VOCAB_FOTO = /\b(supermarkt|laden|geschäft|frau|mutter|kind|tochter|mädchen|einkaufswagen|wagen|korb|regal|regale|milch|flasche|banane|bananen|brot|eier|tüte|einkauf|einkaufen|kauft|kaufen|kasse|mann|leute|joghurt|lebensmittel)\b/g;

function crit(texte, label, ok){ return { label, ok: !!ok }; }
function niveauDe(okB1, okA2){ return okB1 ? "B1" : okA2 ? "A2" : "moins"; }

const JUGES = {
  p1a(t){
    const pts = POINTS_1A.filter(p => a(p[1], t)).map(p => p[0]);
    const n = nbMots(t), lien = a(LIENS, t);
    return { points: pts, niveau: niveauDe(pts.length >= 5 && n >= 45 && lien, pts.length >= 3 && n >= 20), crit: [
      crit(t, "Points de la feuille traités : " + pts.length + " sur 6" + (pts.length ? " (" + pts.join(", ") + ")" : ""), pts.length >= 4),
      crit(t, "Une vraie minute : " + n + " mots entendus (visé : 45 et plus)", n >= 45),
      crit(t, "Des phrases liées (weil, denn, deshalb, dass…)", lien)
    ]};
  },
  p1b(t){
    const n = nbMots(t), lien = a(LIENS, t), ex = a(/\b(zum beispiel|z b|zum beispiel|am liebsten|oft|jeden|jede|manchmal)\b/, t);
    return { niveau: niveauDe(n >= 35 && lien, n >= 15), crit: [
      crit(t, "Plusieurs phrases : " + n + " mots (visé : 35 et plus)", n >= 35),
      crit(t, "Une raison ou une suite (weil, denn, deshalb, dass…)", lien),
      crit(t, "Un détail concret (zum Beispiel, oft, am liebsten…)", ex)
    ]};
  },
  p2a(t){
    const n = nbMots(t);
    const vocab = new Set((norm(t).match(VOCAB_FOTO) || []));
    const c = [
      crit(t, "Tu dis ce qu’on voit (Auf dem Foto sehe ich…, Man sieht…)", a(/\b(auf dem (foto|bild)|ich sehe|man sieht|sieht man|zu sehen)\b/, t)),
      crit(t, "Tu situes (links, rechts, vorne, im Hintergrund…)", a(/\b(links|rechts|vorne|vorn|hinten|hintergrund|vordergrund|in der mitte|neben|daneben)\b/, t)),
      crit(t, "Des mots de la photo : " + vocab.size + " (" + (Array.from(vocab).slice(0, 6).join(", ") || "aucun") + ")", vocab.size >= 3),
      crit(t, "Tu imagines la situation (Ich glaube, vielleicht, wahrscheinlich…)", a(/\b(vielleicht|wahrscheinlich|ich glaube|ich denke|ich vermute|sieht so aus|scheint)\b/, t)),
      crit(t, "Une à deux minutes : " + n + " mots (visé : 40 et plus)", n >= 40)
    ];
    const ok = c.filter(x => x.ok).length;
    return { niveau: niveauDe(ok >= 4 && n >= 30, ok >= 2 && n >= 15), crit: c };
  },
  p2b(t){
    const n = nbMots(t);
    const c = [
      crit(t, "Ton habitude (meistens, normalerweise, lieber, am liebsten…)", a(/\b(meistens|normalerweise|oft|immer|manchmal|lieber|am liebsten|jede woche|samstags|selten)\b/, t)),
      crit(t, "Ton pays d’origine (in meinem Land, bei uns, in meiner Heimat…)", a(/\b(heimat|heimatland|meinem land|bei uns|in meinem)\b/, t)),
      crit(t, "Une comparaison (als, anders, billiger, mehr, genauso…)", a(/\b(als|anders|genauso|mehr|weniger|billiger|teurer|größer|kleiner|besser|frischer|dagegen|gegensatz)\b/, t)),
      crit(t, "Le passé (habe … gekauft, war, früher…)", a(PASSE, t)),
      crit(t, "Une raison (weil, denn, deshalb…)", a(LIENS, t)),
      crit(t, "Assez long : " + n + " mots (visé : 40 et plus)", n >= 40)
    ];
    const ok = c.filter(x => x.ok).length;
    return { niveau: niveauDe(ok >= 4 && c[2].ok && n >= 30, ok >= 2 && n >= 15), crit: c };
  },
  p3(tours){
    const tout = tours.join(" . ");
    const compte = re => tours.filter(t => a(re, t)).length;
    const pris = tours.filter(t => nbMots(t) >= 4).length;
    const prop = compte(PROPOSE), reac = compte(REAGIT), frage = compte(DEMANDE);
    const raison = compte(LIENS);
    const c = [
      crit(tout, "Tu as répondu aux 5 questions de la feuille : " + pris + " sur 5", pris >= 4),
      crit(tout, "Tu proposes (Wir könnten…, Wie wäre es…, Ich bringe…) : " + prop, prop >= 2),
      crit(tout, "Tu réagis à ce que je dis (Gute Idee, lieber…, einverstanden) : " + reac, reac >= 2),
      crit(tout, "Tu me poses des questions (Was meinst du ?, Hast du…?) : " + frage, frage >= 1),
      crit(tout, "Tu donnes des raisons (weil, denn, deshalb…) : " + raison, raison >= 1)
    ];
    const ok = c.filter(x => x.ok).length;
    return { niveau: niveauDe(ok >= 4 && c[0].ok, pris >= 3 && ok >= 2), crit: c };
  }
};

// ---------------------------------------------------------------- la voix
const VOIX_A_FUIR = ["albert","bad news","bahh","bells","boing","bubbles","cellos","good news","jester","organ","superstar","trinoids","whisper","wobble","zarvox","deranged","hysterical","junior","ralph","kathy","fred","princess","bruce","agnes","vicki","eddy","flo","grandma","grandpa","reed","rocko","sandy","shelley"];
let ENREGISTRE = {};
fetch("dtz/voix/manifest.json", {cache: "no-store"}).then(r => r.ok ? r.json() : {}).then(m => { ENREGISTRE = m || {}; }).catch(() => {});
let voixDe = { anna: null, mark: null };
function choisirVoix(){
  const toutes = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  const de = toutes.filter(v => /^de/i.test(v.lang) && !VOIX_A_FUIR.some(f => (v.name || "").toLowerCase().includes(f)));
  const trouve = re => de.find(v => re.test(v.name));
  voixDe.anna = trouve(/anna|petra|helena|katja|marlene|google deutsch|hedda|female|frau/i) || de[0] || null;
  voixDe.mark = trouve(/markus|yannick|martin|conrad|stefan|hans|killian|male|mann/i) || de.find(v => v !== voixDe.anna) || de[0] || null;
}
try{ choisirVoix(); if (window.speechSynthesis) speechSynthesis.onvoiceschanged = choisirVoix; }catch(e){}
let audioEnCours = null;
function taire(){
  try{ if (audioEnCours){ audioEnCours.pause(); audioEnCours = null; } }catch(e){}
  try{ if (window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
}
// LA VIDEO D'ABORD (variante B, decision de Jacques du 3 nov. : « B : video »). Une replique qui a son clip
// (manifeste : {video: 1}) se joue dans le cadre de sa bulle, avec le son du clip ; sinon sa voix enregistree
// ({son: 1}), sinon la voix du telephone. Un navigateur qui refuse la lecture avec le son (iOS hors du geste) laisse
// le bouton ▶ du cadre : la suite attend que le clip ait ete joue ou que l'on passe.
function dire(id, cadre){
  return new Promise(fini => {
    taire();
    const [qui, texte] = L[id];
    const e = ENREGISTRE[id] || {};
    if (e.video && cadre){
      const v = cadre.querySelector("video");
      const lancer = cadre.querySelector(".lancer");
      audioEnCours = v;
      let rendu = false;
      const fin = () => { if (rendu) return; rendu = true; lancer.hidden = true; fini(); };
      v.onended = fin; v.onerror = fin;
      lancer.onclick = () => { lancer.hidden = true; v.play().catch(fin); };
      try{ v.currentTime = 0; }catch(err){}
      v.play().then(() => { lancer.hidden = true; }).catch(() => { lancer.hidden = false; });
      return;
    }
    if (e === 1 || e.son){
      const au = new Audio("dtz/voix/" + id + ".mp3");
      audioEnCours = au;
      au.onended = au.onerror = () => fini();
      au.play().catch(() => fini());
      return;
    }
    if (!window.speechSynthesis){ fini(); return; }
    const u = new SpeechSynthesisUtterance(texte);
    u.lang = "de-DE"; u.rate = 0.92;
    const v = voixDe[qui]; if (v) u.voice = v;
    if (voixDe.anna === voixDe.mark) u.pitch = qui === "mark" ? 0.85 : 1.1;
    u.onend = u.onerror = () => fini();
    speechSynthesis.speak(u);
    setTimeout(fini, 400 + texte.length * 110);   // filet : certains moteurs n'appellent jamais onend
  });
}

// ---------------------------------------------------------------- le micro
// ecouter() rend un objet { arreter() } ; surTexte(texte, final) a chaque resultat ; surFin(texte) a la fin.
const Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
let ecouteApp = null;   // la reponse de l'app, quand c'est elle qui ecoute
window.addEventListener("message", e => {
  const d = e.data;
  if (!d || d.source !== "wortando-app" || d.type !== "micro" || !ecouteApp) return;
  if (d.etat === "texte") ecouteApp.surTexte(d.texte || "");
  else if (d.etat === "fin") { const f = ecouteApp; ecouteApp = null; f.surFin(d.texte || ""); }
  else if (d.etat === "indisponible") { const f = ecouteApp; ecouteApp = null; f.surFin(null); }
});
function ecouter(surTexte, surFin){
  if (Reco){
    let actif = true, finals = "", provisoire = "", reco = null, fini = false;
    const total = () => (finals + " " + provisoire).replace(/\s+/g, " ").trim();
    const terminer = () => { if (fini) return; fini = true; surFin(total()); };
    const lancer = () => {
      reco = new Reco();
      reco.lang = "de-DE"; reco.continuous = true; reco.interimResults = true;
      reco.onresult = ev => {
        provisoire = "";
        for (let i = ev.resultIndex; i < ev.results.length; i++){
          const r = ev.results[i];
          if (r.isFinal) finals += " " + r[0].transcript; else provisoire += " " + r[0].transcript;
        }
        surTexte(total());
      };
      reco.onerror = ev => { if (ev && (ev.error === "not-allowed" || ev.error === "service-not-allowed")){ actif = false; if (!finals){ fini = true; surFin(null); } } };
      // Une longue reponse : le moteur s'arrete apres un silence, on le relance tant qu'on ecoute.
      reco.onend = () => { if (actif) { try{ lancer(); }catch(e){ terminer(); } } else setTimeout(terminer, 150); };
      reco.start();
    };
    try{ lancer(); }catch(e){ setTimeout(() => surFin(null), 0); return { arreter(){} }; }
    return { arreter(){ actif = false; try{ reco.stop(); }catch(e){} setTimeout(terminer, 1800); } };
  }
  if (DANS_APP){
    ecouteApp = { surTexte, surFin };
    parler("micro", { action: "start", langue: "de-DE" });
    return { arreter(){ parler("micro", { action: "stop" }); } };
  }
  setTimeout(() => surFin(null), 0);
  return { arreter(){} };
}

// Le tour de parole de l'eleve : micro, texte entendu, ou saisie au clavier.
function aToi(consigne, limiteS, quandFini){
  const z = el("div", "micro-zone");
  const m = el("button", "micro", "🎙"); m.type = "button"; m.setAttribute("aria-label", "Parler");
  const info = el("div", "micro-info", consigne);
  const entendu = el("div", "entendu"); entendu.lang = "de"; entendu.hidden = true;
  const clavier = el("button", "lien", "⌨ Écrire ma réponse à la place"); clavier.type = "button";
  z.append(m, info, entendu, clavier);
  zone.appendChild(z);
  let ec = null, debut = 0, minuterie = null, coupe = null, rendu = false;
  const rendre = t => { if (rendu) return; rendu = true; z.remove(); quandFini(t || ""); };
  const arreter = () => { if (!ec) return; clearInterval(minuterie); clearTimeout(coupe); m.classList.remove("ecoute"); m.textContent = "…"; m.disabled = true; info.textContent = "Je réfléchis…"; ec.arreter(); ec = null; };
  m.onclick = () => {
    if (ec){ arreter(); return; }
    taire();
    entendu.hidden = false; entendu.textContent = "";
    m.classList.add("ecoute"); m.textContent = "■"; debut = Date.now();
    const tic = () => { const s = Math.floor((Date.now() - debut) / 1000); info.textContent = "Je t’écoute · " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") + " · touche ■ pour finir"; };
    tic(); minuterie = setInterval(tic, 500);
    coupe = setTimeout(arreter, limiteS * 1000);
    ec = ecouter(t => { entendu.textContent = t; }, t => {
      clearInterval(minuterie); clearTimeout(coupe); ec = null;
      if (t === null){ m.classList.remove("ecoute"); m.textContent = "🎙"; m.disabled = false; info.textContent = "Le micro ne répond pas ici. Écris ta réponse ci-dessous."; clavier.click(); return; }
      rendre(t);
    });
  };
  clavier.onclick = () => {
    if (ec) return;
    clavier.remove();
    const ta = el("textarea"); ta.lang = "de"; ta.placeholder = "Écris ici ce que tu dirais, en allemand…";
    const ok = el("button", "lien", "Valider ma réponse ✓"); ok.type = "button";
    ok.onclick = () => { if (ta.value.trim()) rendre(ta.value.trim()); };
    z.append(ta, ok); ta.focus();
  };
}

  ]},
  { cle: "p2b", titre: "Raconter et comparer", de: "Erzählen und vergleichen", ex: [
    { titre: "Ton expérience", jouer: [["bulle", "a_erfahrung"]], juge: "p2b", limite: 100, consigne: "À toi : raconte et compare, environ une minute" }
  ]},
  { cle: "p3", titre: "Planifier avec Mark", de: "Gemeinsam etwas planen", ex: PLAN_NOTIZEN.map((q, k) => ({
    titre: q, tour: k, feuille: "plan", limite: 50,
    jouer: k === 0 ? [["bulle", "a_planen"], ["bulle", "m_p1"]] : [["bulle", "m_p" + (k + 1)]]
  }))}
];
const QUESTIONS_1B = ["a_frage_familie", "a_frage_beruf", "a_frage_freizeit", "a_frage_deutsch"];
const RANG = { moins: 0, A2: 1, B1: 2 }, NIV = ["moins", "A2", "B1"];

// L'etat des sections reste d'une visite a l'autre (« ‹ » ramene a la liste sans rien perdre). Stockage du
// navigateur, enveloppe : une fenetre privee le refuse, la page marche sans.
const CLE_ETAT = "wortando_dtzOral";
let ETAT = {};
try{ ETAT = JSON.parse(localStorage.getItem(CLE_ETAT) || "{}") || {}; }catch(e){ ETAT = {}; }
function sauver(){ try{ localStorage.setItem(CLE_ETAT, JSON.stringify(ETAT)); }catch(e){} }
function etatSection(s){ const c = SECTIONS[s].cle; if (!ETAT[c]) ETAT[c] = { fait: [], rep: [], res: [] }; return ETAT[c]; }
let examen = false, ici = { s: -1, e: -1 };

// Les deux questions de la section 2 portent d'abord sur ce que l'eleve n'a pas dit en se presentant (comme le
// ferait l'examinatrice) ; tirees une fois par passage de la section.
function questions1b(){
  const st = etatSection(1);
  if (!st.questions){
    const pts = (etatSection(0).res[1] || {}).points || [];
    const prio = QUESTIONS_1B.filter(id => (id === "a_frage_familie" && !pts.includes("Familie")) || (id === "a_frage_beruf" && !pts.includes("Arbeit / Beruf")));
    const reste = QUESTIONS_1B.filter(id => !prio.includes(id)).sort(() => Math.random() - 0.5);
    st.questions = prio.concat(reste).slice(0, 2);
    sauver();
  }
  return st.questions;
}
function aJouer(s, e){
  const X = SECTIONS[s].ex[e];
  return X.question != null ? [["bulle", questions1b()[X.question]]] : X.jouer;
}
function chip(n){ return el("span", "niv " + n, n === "moins" ? "pas encore A2" : n); }
// Ce que vaut un tour de la planification, pris seul (la section entiere se juge sur les cinq : JUGES.p3).
function critTour(t){
  return [
    crit(t, "Tu réponds en une phrase (" + nbMots(t) + " mots)", nbMots(t) >= 4),
    crit(t, "Tu proposes (Wir könnten…, Wie wäre es…, Ich bringe…)", a(PROPOSE, t)),
    crit(t, "Tu réagis (Gute Idee, lieber…, einverstanden)", a(REAGIT, t)),
    crit(t, "Tu poses une question à Mark (Was meinst du ?, … oder …?)", a(DEMANDE, t)),
    crit(t, "Tu donnes une raison (weil, denn, deshalb…)", a(LIENS, t))
  ];
}
function resultatSection(s){
  const S = SECTIONS[s], st = etatSection(s);
  if (S.cle === "p3") return S.ex.some((x, k) => st.rep[k] != null) ? JUGES.p3(S.ex.map((x, k) => st.rep[k] || "")) : null;
  const rs = S.ex.map((x, k) => x.juge ? st.res[k] : null).filter(Boolean);
  if (!rs.length) return null;
  if (rs.length === 1) return rs[0];
  const r = Math.floor(rs.reduce((n, x) => n + RANG[x.niveau], 0) / rs.length);
  return { niveau: NIV[r], crit: [].concat(...rs.map(x => x.crit)) };
}

function accueil(){
  examen = false; ici = { s: -1, e: -1 };
  vider(); entete("Préparation au DTZ · entraînement", "Mark et Anna t’aident à préparer l’oral"); points(-1);
  zone.appendChild(el("h2", "", "L’oral du DTZ, en répétition"));
  coach("accueil");
  const liste = el("div", "sections");
  liste.appendChild(el("b", "", "Les cinq sections (environ 20 minutes à deux)"));
  SECTIONS.forEach((S, s) => {
    const st = etatSection(s), n = S.ex.length, f = S.ex.filter((x, k) => st.fait[k]).length;
    const b = el("button", "section"); b.type = "button";
    b.appendChild(el("span", "num", String(s + 1)));
    const t = el("span", "nomsec"); t.appendChild(el("b", "", S.titre));
    const d = el("small", "", S.de); d.lang = "de"; t.appendChild(d); b.appendChild(t);
    const etat = el("span", "etat" + (f === n ? " fait" : ""), f === n ? "✓" : f ? f + " / " + n : "");
    if (f === n) etat.setAttribute("aria-label", "fait");
    b.appendChild(etat);
    b.onclick = () => { examen = false; exercice(s, 0); };
    liste.appendChild(b);
  });
  zone.appendChild(liste);
  zone.appendChild(el("p", "limite", "Touche une section pour t’y entraîner seule, ou fais l’examen complet : les cinq sections à la suite, puis l’estimation A2 / B1 d’Anna. Mode entraînement : expliqué, avec des aides et des modèles. L’examen blanc, minuté et sans aide, viendra ensuite."));
  bouton("▶ Examen complet", () => { examen = true; exercice(0, 0); });
}

function exercice(s, e){
  ici = { s, e };
  const S = SECTIONS[s], X = S.ex[e], st = etatSection(s);
  if (e === 0 && s === 1 && !st.fait.length) questions1b();
  vider();
  entete((examen ? "Examen complet · " : "") + "Exercice " + (e + 1) + " sur " + S.ex.length, "Section " + (s + 1) + " · " + S.titre);
  points(s, e);
  const p = el("p", "partie", S.de); p.lang = "de"; zone.appendChild(p);
  zone.appendChild(el("h2", "", X.titre));
  // Le conseil de Mark ouvre la section ; les exercices suivants gardent seulement les tournures qui aident.
  coach(S.cle, e > 0);
  let f = null;
  if (X.feuille === "stichworte") f = feuille("Ihr Aufgabenblatt", STICHWORTE);
  if (X.feuille === "plan"){
    f = feuille("Gemeinsames Aufgabenblatt", PLAN_NOTIZEN, "Sie möchten mit Ihrem Deutschkurs einen Ausflug machen. Sie beide organisieren ihn. Planen Sie, was Sie tun können.");
    f.querySelectorAll(".puces span").forEach((x, k) => { if (st.fait[k]) x.classList.add("ok"); if (k === e) x.classList.add("ici"); });
  }
  if (X.photo){ zone.appendChild(el("div", "micro-info", X.photo[1])); photo(X.photo[0]); }
  const jouer = aJouer(s, e);
  const premier = L[jouer.find(x => x[0] === "bulle")[1]][0];
  bouton(premier === "mark" ? "Écouter Mark" : "Écouter Anna", async () => {
    suite.hidden = true;
    for (const j of jouer){
      if (j[0] === "bulle") await bulle(j[1]);
      else { zone.appendChild(el("div", "micro-info", j[2])); photo(j[1]); }
    }
    if (X.modele){ st.fait[e] = true; sauver(); points(s, e); bouton("Continuer", () => apres(s, e)); return; }
    if (X.tour != null){ tourPlan(s, e, false, f); return; }
    aToi(X.consigne, X.limite, t => {
      const res = JUGES[X.juge](t);
      st.rep[e] = t; st.res[e] = res; st.fait[e] = true; sauver(); points(s, e);
      if (X.juge === "p1a" && f) f.querySelectorAll(".puces span").forEach(x => { if ((res.points || []).includes(x.textContent)) x.classList.add("ok"); });
      montrerVerdict(res, t, () => exercice(s, e), () => apres(s, e));
    });
  });
}
// Un tour de la planification : Mark pose sa question, l'eleve repond, Mark reagit. Trop court, il relance une fois ;
// un refus, il se range ; sinon il accepte. Au dernier tour, il conclut.
function tourPlan(s, e, relance, f){
  const st = etatSection(s);
  aToi("À toi : réponds à Mark (" + PLAN_NOTIZEN[e] + ")", 50, async t => {
    const ligne = el("div", "entendu", t || "(rien entendu)"); ligne.lang = "de"; zone.appendChild(ligne);
    if (nbMots(t) < 4 && !relance){ await bulle("m_nachfrage"); tourPlan(s, e, true, f); return; }
    st.rep[e] = t; st.fait[e] = true; sauver(); points(s, e);
    if (f && nbMots(t) >= 4) f.querySelectorAll(".puces span")[e].classList.add("ok");
    const refus = /\b(nicht|lieber|keine lust|zu weit|zu teuer|schlecht|leider)\b/.test(norm(t));
    await bulle(e < 4 ? (refus ? "m_nein" : (e % 2 ? "m_ok2" : "m_ok")) : "m_ende");
    montrerVerdict({ crit: critTour(t) }, null, () => exercice(s, e), () => apres(s, e), "Le retour de Mark");
  });
}
function apres(s, e){
  if (e + 1 < SECTIONS[s].ex.length) return exercice(s, e + 1);
  if (examen) return s + 1 < SECTIONS.length ? exercice(s + 1, 0) : fin();
  recap(s);
}

function recap(s){
  const S = SECTIONS[s], st = etatSection(s);
  ici = { s, e: "recap" };
  vider(); entete("Fin de la section", "Section " + (s + 1) + " · " + S.titre); points(s, -1);
  zone.appendChild(el("h2", "", "Ton récapitulatif"));
  S.ex.forEach((X, k) => {
    if (X.modele) return;
    const c = el("div", "verdict");
    const r = X.juge ? st.res[k] : null;
    const h = el("h3", "", X.titre); if (r) h.appendChild(chip(r.niveau)); c.appendChild(h);
    const j = aJouer(s, k).filter(x => x[0] === "bulle").pop();
    if (j){ const q = el("div", "question", L[j[1]][1]); q.lang = "de"; c.appendChild(q); }
    if (st.rep[k] != null){
      c.appendChild(el("div", "micro-info", "Ta réponse :"));
      const e = el("div", "entendu", st.rep[k] || "(rien entendu)"); e.lang = "de"; c.appendChild(e);
      c.appendChild(el("div", "micro-info", X.tour != null ? "Le retour de Mark :" : "Le retour d’Anna :"));
      const ul = el("ul", "crit"); (r ? r.crit : critTour(st.rep[k])).forEach(x => ul.appendChild(el("li", x.ok ? "ok" : "", x.label))); c.appendChild(ul);
    } else c.appendChild(el("p", "limite", "Pas encore fait : touche son point en haut pour y aller."));
    zone.appendChild(c);
  });
  // La section entiere, quand elle a plusieurs reponses (les deux questions, la conversation) : une seule estimation.
  const r = resultatSection(s);
  if (r && S.ex.filter(x => !x.modele).length > 1){
    const c = el("div", "verdict");
    const h = el("h3", "", S.cle === "p3" ? "Toute la conversation" : "Toute la section"); h.appendChild(chip(r.niveau)); c.appendChild(h);
    if (S.cle === "p3"){ const ul = el("ul", "crit"); r.crit.forEach(x => ul.appendChild(el("li", x.ok ? "ok" : "", x.label))); c.appendChild(ul); }
    zone.appendChild(c);
  }
  zone.appendChild(el("p", "limite", LIMITE));
  const act = el("div", "actions");
  const refaire = el("button", "", "Refaire la section"); refaire.type = "button";
  refaire.onclick = () => { if (s === 1) st.questions = null; exercice(s, 0); };
  const toutes = el("button", "", "Toutes les sections"); toutes.type = "button"; toutes.onclick = accueil;
  act.append(refaire, toutes); zone.appendChild(act);
  if (s + 1 < SECTIONS.length) bouton("Section suivante", () => exercice(s + 1, 0));
  else { toutes.remove(); bouton("Toutes les sections", accueil); }
}

async function fin(){
  ici = { s: -1, e: "fin" };
  vider(); entete("Examen complet", "Le verdict d’Anna"); points(-1);
  const niv = SECTIONS.map((S, s) => (resultatSection(s) || {}).niveau || "moins");
  const b1 = niv.filter(x => x === "B1").length, a2 = niv.filter(x => x !== "moins").length;
  const global = b1 >= 3 && a2 === 5 ? "B1" : a2 >= 3 ? "A2" : "moins";
  zone.appendChild(el("h2", "", "Le verdict d’Anna"));
  await bulle("a_ende_" + global, true);
  // Le cadre du clip, pour que dire() joue la VIDEO : sans lui, la voix seule passait sous l'image fixe et les levres
  // d'Anna ne bougeaient pas (Jacques, 4 nov. 2026).
  const cadreVerdict = [...zone.querySelectorAll(".clip")].pop() || null;
  const tab = el("table", "tableau");
  SECTIONS.forEach((S, i) => { const tr = el("tr"); tr.appendChild(el("td", "", (i + 1) + " · " + S.titre)); const td = el("td"); td.appendChild(chip(niv[i])); tr.appendChild(td); tab.appendChild(tr); });
  zone.appendChild(tab);
  zone.appendChild(el("p", "limite", "Au DTZ, le B1 à l’examen entier exige le B1 à l’oral, et aussi dans au moins une épreuve écrite (Écouter et Lire, ou Écrire). " + LIMITE));
  coach("fin");
  const act = el("div", "actions");
  const r = el("button", "", "Refaire l’examen"); r.type = "button"; r.onclick = () => { examen = true; etatSection(1).questions = null; exercice(0, 0); };
  const t = el("button", "", "Toutes les sections"); t.type = "button"; t.onclick = accueil;
  act.append(r, t); zone.appendChild(act);
  bouton("Terminer", () => parler("fini", { faits: 0, bons: 0 }));
  dire("a_ende_" + global, cadreVerdict);
}

// « ‹ » : d'une section (ou du verdict) vers la liste des sections ; de la liste, on quitte l'oral.
document.getElementById("retour").onclick = () => {
  taire();
  if (ici.s >= 0 || ici.e === "fin"){ accueil(); return; }
  if (DANS_APP) parler("fermer"); else history.back();
};
// Agrandir les images (themes/zoom.js, decision de Jacques du 3 nov. : « Oui, les deux ») : aucune image de l'oral ne
// sert a repondre, toutes s'ouvrent au toucher -- les photos a decrire et les portraits d'Anna et de Mark.
Zoom.init({direct: "img.photo, .qui img", loupe: "", langue: "fr"});
accueil();
</script>
