<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Descripción física</title>
<!--
  DECRIRE UNE PERSONNE (v1076, 2 nov. 2026). Le theme « Descripcion fisica » du cours d'espagnol de Jacques, pour
  l'espagnol ET l'allemand (« on pourrait utiliser l'approche pour l'espagnol et l'allemand »). Douze personnes
  photorealistes (Mark, Anna et dix autres, visuel/descripcion/personnages.py), detourees et rangees a l'echelle de
  leur taille ; une planche des couleurs d'yeux. Ouverte par l'app dans le cadre des scenes (sceneCadre), elle
  parle comme une scene : « exercice » et « bonne » a chaque reponse (objectif du jour, carreaux), « fini » et
  « fermer » a la fin. Parametres : apprendre=es|de, lang=<interface>, nuit=1, seance=1 (six questions, depuis la seance du jour).
  Les phrases sont FABRIQUEES depuis les combinaisons (personnages.json) : une image ne dit que ce qu'elle montre.
-->
<style>
:root{--fond1:#82AFDB;--fond3:#C0D6EA;--encre:#1C2430;--gris:#4C566B;--ambre:#E8A23A;--ambre-f:#A86A0E;--vert:#2F9E6A;--rouge:#C8473A;
  --verre:rgba(255,255,255,.88);--bord:rgba(255,255,255,.95);--carte:#F7F8FA;--police:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html.nuit{--fond1:#0E1C26;--fond3:#18303F;--encre:#EEF2F5;--gris:#A9B8C4;--ambre-f:#E8A23A;--vert:#5CC98F;--rouge:#F07F72;
  --verre:rgba(20,36,50,.88);--bord:rgba(255,255,255,.14);--carte:#22384A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,var(--fond1),var(--fond3));background-attachment:fixed;color:var(--encre);font-family:var(--police);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 90px) max(12px,env(safe-area-inset-left,0px))}
.haut{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto 10px}
.retour{width:42px;height:42px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);color:var(--encre);font:800 22px var(--police);cursor:pointer;flex:0 0 auto}
.titre{flex:1;font-weight:900;font-size:18px}
.compte{font-weight:800;font-size:14px;color:var(--gris)}
.barre{max-width:560px;margin:0 auto 12px;height:6px;border-radius:3px;background:rgba(28,36,48,.12);overflow:hidden}
.barre i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2BB5AA,#14807A);transition:width .3s}
main{max-width:560px;margin:0 auto;background:var(--verre);border:1px solid var(--bord);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px}
.consigne{font-size:14px;font-weight:700;color:var(--gris);margin:0}
.enonce{direction:ltr;text-align:left;background:var(--carte);border-radius:14px;padding:12px 14px;font-weight:800;line-height:1.5;font-size:17px}
.trou{display:inline-block;min-width:70px;border-bottom:2px solid var(--ambre);text-align:center;color:var(--ambre-f)}
.rangee{display:flex;align-items:flex-end;justify-content:center;gap:4px;background:var(--carte);border-radius:14px;padding:10px 6px 6px;min-height:0}
.rangee button{flex:1 1 0;min-width:0;border:3px solid transparent;border-radius:14px;background:none;padding:2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.rangee img{display:block;width:auto;max-width:100%;object-fit:contain}
.rangee .nom{font-size:12px;font-weight:800;color:var(--gris);margin-top:2px}
.rangee button.juste{border-color:var(--vert)} .rangee button.faux{border-color:var(--rouge)}
.vue{display:grid;grid-template-columns:minmax(90px,130px) 1fr;gap:10px;align-items:center}
.vue img{width:100%;height:auto;display:block;border-radius:12px;background:var(--carte)}
.vue .visage{border-radius:12px}
.photo{width:100%;height:auto;display:block;border-radius:14px}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix button,.liste button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:9px 15px;font:800 15px var(--police);cursor:pointer}
.liste{display:flex;flex-direction:column;gap:8px}
.liste button{border-radius:14px;text-align:start;font-weight:700;line-height:1.4}
.choix button.juste,.liste button.juste{background:var(--vert);border-color:var(--vert);color:#fff}
.choix button.faux,.liste button.faux{background:var(--rouge);border-color:var(--rouge);color:#fff}
button:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
button:disabled{cursor:default}
.retourMsg{min-height:1.4em;font-weight:800;font-size:15px;margin:0}
.retourMsg.ok{color:var(--vert)} .retourMsg.ko{color:var(--rouge)}
.suite{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:54px;border:0;border-radius:27px;
  color:#fff;font:800 17px var(--police);background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer}
.suite[hidden]{display:none}
.fin{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:10px 0}
.fin .score{font-size:22px;font-weight:900}
.fin button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:10px 18px;font:800 16px var(--police);cursor:pointer}
[lang]{unicode-bidi:isolate}
/* la decouverte (3 nov. 2026) : des cases a toucher, le mot dessous, la voix au toucher */
.sec{font-weight:900;font-size:15px;margin:6px 0 0}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.case{border:3px solid transparent;border-radius:14px;background:var(--carte);padding:0 0 6px;cursor:pointer;color:var(--encre);font:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;overflow:hidden}
.case img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.case.yeux img{aspect-ratio:16/9}
.case b{font-size:15px;font-weight:900;line-height:1.2;padding:0 4px}
.case small{font-size:12px;font-weight:700;color:var(--gris);line-height:1.25;padding:0 4px;text-align:center}
.case.actif{border-color:var(--ambre)}
.case .hp{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-inline-start:4px}
.case .hp path{fill:none;stroke:var(--ambre-f);stroke-width:2.2;stroke-linecap:round}
</style>
</head>
<body>
<div class="haut"><button class="retour" id="retour" type="button">‹</button><div class="titre" id="titre"></div><div class="compte" id="compte" dir="ltr"></div></div>
<div class="barre"><i id="barre"></i></div>
<main id="zone"></main>
<button class="suite" id="suite" type="button" hidden></button>
<script src="themes/tirage.js?v=1"></script>
<script>
const Q = new URLSearchParams(location.search);
const APPRENDRE = Q.get("apprendre") === "de" ? "de" : "es";
const LANGUE = (l => ["fr", "en", "tr", "uk", "fa", "ar", "pt", "pl", "ru", "de"].includes(l) ? l : "fr")(((Q.get("lang") || "fr").toLowerCase().split(/[-_]/)[0]));
if (Q.get("nuit") === "1") document.documentElement.classList.add("nuit");
document.documentElement.lang = LANGUE;
document.documentElement.dir = (LANGUE === "fa" || LANGUE === "ar") ? "rtl" : "ltr";
// vingt questions seule ; six dans la seance du jour (seance=1), un jour sur trois a la place de la scene
const NB = Q.get("seance") === "1" ? 6 : 20;

const TEXTES = {
  titre:    {fr:"Décrire une personne", en:"Describing people", tr:"Birini tarif etmek", uk:"Описати людину", fa:"توصیف یک نفر", ar:"وصف شخص", pt:"Descrever uma pessoa", pl:"Opisywanie osób", ru:"Описать человека", de:"Menschen beschreiben"},
  quien:    {fr:"Lis la description et touche la bonne personne.", en:"Read the description and tap the right person.", tr:"Tarifi oku ve doğru kişiye dokun.", uk:"Прочитай опис і торкнися потрібної людини.", fa:"توضیح را بخوان و روی شخص درست بزن.", ar:"اقرأ الوصف والمس الشخص الصحيح.", pt:"Leia a descrição e toque na pessoa certa.", pl:"Przeczytaj opis i dotknij właściwej osoby.", ru:"Прочитай описание и нажми на нужного человека.", de:"Lies die Beschreibung und tippe auf die richtige Person."},
  completa: {fr:"Regarde l'image et complète la phrase.", en:"Look at the picture and complete the sentence.", tr:"Resme bak ve cümleyi tamamla.", uk:"Подивися на зображення й доповни речення.", fa:"به تصویر نگاه کن و جمله را کامل کن.", ar:"انظر إلى الصورة وأكمل الجملة.", pt:"Olhe a imagem e complete a frase.", pl:"Spójrz na obrazek i uzupełnij zdanie.", ru:"Посмотри на картинку и дополни предложение.", de:"Sieh dir das Bild an und ergänze den Satz."},
  verbe:    {fr:"Quel verbe va avec ces mots ?", en:"Which verb goes with these words?", tr:"Bu kelimelerle hangi fiil kullanılır?", uk:"Яке дієслово пасує до цих слів?", fa:"کدام فعل با این کلمه‌ها می‌آید؟", ar:"أي فعل يناسب هذه الكلمات؟", pt:"Que verbo combina com estas palavras?", pl:"Który czasownik pasuje do tych słów?", ru:"Какой глагол подходит к этим словам?", de:"Welches Verb passt zu diesen Wörtern?"},
  accord:   {fr:"Choisis la bonne forme : l'adjectif s'accorde avec la personne.", en:"Choose the right form: the adjective agrees with the person.", tr:"Doğru biçimi seç: sıfat kişiye uyar.", uk:"Обери правильну форму: прикметник узгоджується з людиною.", fa:"شکل درست را انتخاب کن: صفت با شخص هماهنگ می‌شود.", ar:"اختر الصيغة الصحيحة: تتوافق الصفة مع الشخص.", pt:"Escolha a forma certa: o adjetivo concorda com a pessoa.", pl:"Wybierz właściwą formę: przymiotnik zgadza się z osobą.", ru:"Выбери правильную форму: прилагательное согласуется с человеком.", de:"Wähle die richtige Form: Das Adjektiv richtet sich nach der Person."},
  elige:    {fr:"Quelle description correspond à cette personne ?", en:"Which description matches this person?", tr:"Hangi tarif bu kişiye uyuyor?", uk:"Який опис підходить цій людині?", fa:"کدام توضیح با این شخص جور است؟", ar:"أي وصف يطابق هذا الشخص؟", pt:"Qual descrição corresponde a esta pessoa?", pl:"Który opis pasuje do tej osoby?", ru:"Какое описание подходит этому человеку?", de:"Welche Beschreibung passt zu dieser Person?"},
  taille:   {fr:"Compare leur taille et touche la bonne personne.", en:"Compare their height and tap the right person.", tr:"Boylarını karşılaştır ve doğru kişiye dokun.", uk:"Порівняй їхній зріст і торкнися потрібної людини.", fa:"قدشان را مقایسه کن و روی شخص درست بزن.", ar:"قارن أطوالهم والمس الشخص الصحيح.", pt:"Compare a altura e toque na pessoa certa.", pl:"Porównaj ich wzrost i dotknij właściwej osoby.", ru:"Сравни их рост и нажми на нужного человека.", de:"Vergleiche ihre Größe und tippe auf die richtige Person."},
  yeux:     {fr:"De quelle couleur sont ces yeux ?", en:"What colour are these eyes?", tr:"Bu gözler ne renk?", uk:"Якого кольору ці очі?", fa:"این چشم‌ها چه رنگی‌اند؟", ar:"ما لون هاتين العينين؟", pt:"De que cor são estes olhos?", pl:"Jakiego koloru są te oczy?", ru:"Какого цвета эти глаза?", de:"Welche Farbe haben diese Augen?"},
  suivant:  {fr:"Suivant", en:"Next", tr:"Devam", uk:"Далі", fa:"بعدی", ar:"التالي", pt:"Próximo", pl:"Dalej", ru:"Дальше", de:"Weiter"},
  encore:   {fr:"Encore une fois", en:"Once more", tr:"Bir kez daha", uk:"Ще раз", fa:"یک بار دیگر", ar:"مرة أخرى", pt:"Mais uma vez", pl:"Jeszcze raz", ru:"Ещё раз", de:"Noch einmal"},
  terminer: {fr:"Terminer", en:"Finish", tr:"Bitir", uk:"Завершити", fa:"پایان", ar:"إنهاء", pt:"Terminar", pl:"Zakończ", ru:"Завершить", de:"Beenden"},
  bonne:    {fr:"La bonne réponse : {r}", en:"The right answer: {r}", tr:"Doğru cevap: {r}", uk:"Правильна відповідь: {r}", fa:"پاسخ درست: {r}", ar:"الإجابة الصحيحة: {r}", pt:"A resposta certa: {r}", pl:"Prawidłowa odpowiedź: {r}", ru:"Правильный ответ: {r}", de:"Die richtige Antwort: {r}"},
  score:    {fr:"{b} bonnes réponses sur {n}", en:"{b} correct answers out of {n}", tr:"{n} sorudan {b} doğru", uk:"{b} правильних відповідей із {n}", fa:"{b} پاسخ درست از {n}", ar:"{b} إجابات صحيحة من {n}", pt:"{b} respostas certas de {n}", pl:"{b} poprawnych odpowiedzi na {n}", ru:"{b} правильных ответов из {n}", de:"{b} von {n} richtig"},
  intro:    {fr:"Touche une image pour voir le mot et l'entendre.", en:"Tap a picture to see the word and hear it.", tr:"Kelimeyi görmek ve duymak için bir resme dokun.", uk:"Торкнися зображення, щоб побачити слово й почути його.", fa:"روی یک تصویر بزن تا واژه را ببینی و بشنوی.", ar:"المس صورة لترى الكلمة وتسمعها.", pt:"Toque em uma imagem para ver a palavra e ouvi-la.", pl:"Dotknij obrazka, aby zobaczyć słowo i je usłyszeć.", ru:"Нажми на картинку, чтобы увидеть слово и услышать его.", de:"Tippe auf ein Bild, um das Wort zu sehen und zu hören."},
  s_yeux:   {fr:"Les yeux", en:"Eyes", tr:"Gözler", uk:"Очі", fa:"چشم‌ها", ar:"العيون", pt:"Os olhos", pl:"Oczy", ru:"Глаза", de:"Die Augen"},
  s_couleur:{fr:"La couleur des cheveux", en:"Hair colour", tr:"Saç rengi", uk:"Колір волосся", fa:"رنگ مو", ar:"لون الشعر", pt:"A cor do cabelo", pl:"Kolor włosów", ru:"Цвет волос", de:"Die Haarfarbe"},
  s_forme:  {fr:"Les cheveux : longueur et forme", en:"Hair: length and type", tr:"Saç: uzunluk ve biçim", uk:"Волосся: довжина й форма", fa:"مو: بلندی و حالت", ar:"الشعر: الطول والشكل", pt:"O cabelo: comprimento e tipo", pl:"Włosy: długość i rodzaj", ru:"Волосы: длина и форма", de:"Die Haare: Länge und Form"},
  s_taille: {fr:"La taille", en:"Height", tr:"Boy", uk:"Зріст", fa:"قد", ar:"الطول", pt:"A altura", pl:"Wzrost", ru:"Рост", de:"Die Größe"},
  s_plus:   {fr:"Lunettes, barbe, moustache", en:"Glasses, beard, moustache", tr:"Gözlük, sakal, bıyık", uk:"Окуляри, борода, вуса", fa:"عینک، ریش، سبیل", ar:"النظارة واللحية والشارب", pt:"Óculos, barba, bigode", pl:"Okulary, broda, wąsy", ru:"Очки, борода, усы", de:"Brille, Bart, Schnurrbart"},
  commencer:{fr:"Commencer les exercices", en:"Start the exercises", tr:"Alıştırmalara başla", uk:"Почати вправи", fa:"شروع تمرین‌ها", ar:"ابدأ التمارين", pt:"Começar os exercícios", pl:"Zacznij ćwiczenia", ru:"Начать упражнения", de:"Übungen starten"},
  retourAria:{fr:"Retour", en:"Back", tr:"Geri", uk:"Назад", fa:"بازگشت", ar:"رجوع", pt:"Voltar", pl:"Wstecz", ru:"Назад", de:"Zurück"}
};
function T(cle, v){ let s = (TEXTES[cle] || {})[LANGUE] || (TEXTES[cle] || {}).fr || cle; for (const k in (v || {})) s = s.split("{" + k + "}").join(v[k]); return s; }

// ---------- la langue apprise : les phrases, fabriquees depuis les combinaisons ----------
const NOMS = {Ines:"Inés", Tomas:"Tomás"};
const nom = id => NOMS[id] || id;
const ES = {
  bravo: "¡Muy bien!",
  verbes: ["es", "tiene", "lleva"],
  altura: {alto:"alto", mediano:"de estatura mediana", bajo:"bajo"},
  tam: {delgado:"delgado", gordo:"gordo", fuerte:"fuerte"},
  largo: {corto:"corto", largo:"largo"}, tipo: {liso:"liso", ondulado:"ondulado", rizado:"rizado"},
  color: {negro:"negro", castano:"castaño", castano_claro:"castaño claro", rubio:"rubio", rojo:"rojo"},
  ojos: {verdes:"verdes", azules:"azules", castanos:"castaños", negros:"negros", grises:"grises"},
  lleva: {gafas:"gafas", gafas_sol:"gafas de sol", barba:"barba", bigote:"bigote", perilla:"perilla", pendiente:"un pendiente", pendientes:"pendientes", tatuaje:"un tatuaje"},
  acc(p, m){ return p.sexe === "f" && /o$/.test(m) ? m.replace(/o$/, "a") : m; },
  phrases(p){
    const alt = p.altura === "mediano" ? "de estatura mediana" : this.acc(p, p.altura), tam = p.tam === "fuerte" ? "fuerte" : this.acc(p, p.tam);
    const out = ["Es " + alt + " y " + tam + "."];
    if (p.largo === "calvo") out.push("Es " + this.acc(p, "calvo") + ".");
    else {
      out.push("Tiene el pelo " + p.largo + ", " + p.tipo + " y " + this.color[p.color] + ".");
      if (p.color === "rojo") out.push("Es " + this.acc(p, "pelirrojo") + ".");
    }
    if (p.ojos) out.push("Tiene los ojos " + this.ojos[p.ojos] + ".");
    if (p.lleva.length) out.push("Lleva " + p.lleva.map(k => this.lleva[k]).join(" y ") + ".");
    return out.join(" ");
  },
  // Completa : la phrase a trous, la bonne reponse et les autres choix de la categorie
  trous(p){
    const t = [];
    if (p.largo !== "calvo"){
      t.push({phrase:"Tiene el pelo ___.", rep:this.color[p.color], opts:Object.values(this.color), k:"color", v:p.color});
      t.push({phrase:"Tiene el pelo ___.", rep:this.tipo[p.tipo], opts:Object.values(this.tipo), k:"tipo", v:p.tipo});
      t.push({phrase:"Tiene el pelo ___.", rep:this.largo[p.largo], opts:Object.values(this.largo), k:"largo", v:p.largo});
    }
    if (p.ojos) t.push({phrase:"Tiene los ojos ___.", rep:this.ojos[p.ojos], opts:Object.values(this.ojos), visage:true, k:"ojos", v:p.ojos});
    if (p.lleva.length) t.push({phrase:"Lleva ___.", rep:this.lleva[p.lleva[0]], opts:["gafas", "gafas de sol", "barba", "bigote", "perilla", "pendientes", "un tatuaje"], k:"lleva", v:p.lleva[0]});
    t.push({phrase:"Es ___.", rep:p.tam === "fuerte" ? "fuerte" : this.acc(p, p.tam), opts:[this.acc(p, "delgado"), this.acc(p, "gordo"), "fuerte"], corps:true, k:"tam", v:p.tam});
    return t;
  },
  // Les traits un a un, pour les descriptions PARTIELLES de « ¿Quién es? » (3 nov. 2026, « une centaine de
  // questions par theme ») : deux ou trois traits qui ne designent qu'une des personnes montrees.
  traits(p){
    const t = [{k:"altura", v:p.altura, txt:"Es " + (p.altura === "mediano" ? "de estatura mediana" : this.acc(p, p.altura)) + "."},
               {k:"tam", v:p.tam, txt:"Es " + (p.tam === "fuerte" ? "fuerte" : this.acc(p, p.tam)) + "."}];
    if (p.largo === "calvo") t.push({k:"calvo", v:true, txt:"Es " + this.acc(p, "calvo") + "."});
    else t.push({k:"color", v:p.color, txt:"Tiene el pelo " + this.color[p.color] + "."},
                {k:"forme", v:p.largo + "/" + p.tipo, txt:"Tiene el pelo " + p.largo + " y " + p.tipo + "."});
    if (p.ojos) t.push({k:"ojos", v:p.ojos, txt:"Tiene los ojos " + this.ojos[p.ojos] + "."});
    p.lleva.forEach(x => t.push({k:"lleva:" + x, v:true, txt:"Lleva " + this.lleva[x] + "."}));
    return t;
  },
  // Comme la description complete : « Es alta y delgada. », « Tiene el pelo corto, liso y rubio. », « Lleva gafas y barba. »
  assembler(p, ch){
    const a = ch.find(t => t.k === "altura"), b = ch.find(t => t.k === "tam");
    const co = ch.find(t => t.k === "color"), fo = ch.find(t => t.k === "forme"), ll = ch.filter(t => t.k.indexOf("lleva:") === 0);
    const out = [];
    if (a && b) out.push(a.txt.slice(0, -1) + " y " + b.txt.slice(3)); else if (a || b) out.push((a || b).txt);
    if (ch.some(t => t.k === "calvo")) out.push(ch.find(t => t.k === "calvo").txt);
    if (co && fo) out.push("Tiene el pelo " + p.largo + ", " + p.tipo + " y " + this.color[p.color] + "."); else if (co || fo) out.push((co || fo).txt);
    if (ch.some(t => t.k === "ojos")) out.push(ch.find(t => t.k === "ojos").txt);
    if (ll.length) out.push("Lleva " + ll.map(t => this.lleva[t.k.slice(6)]).join(" y ") + ".");
    return out.join(" ");
  },
  // le sexe se lit dans l'accord (alto / alta, calvo / calva), pas dans « tiene el pelo rubio »

function repondAussi(q, ch, p){

// Un mot absent du corpus est rendu « hors jeu » par l'app et n'est jamais demande.
function motsDuTheme(){
  const par = {};
  Object.keys(BASES).forEach(k => Object.keys(BASES[k]).forEach(v => {
    const m = motDe(k, v); if (!m) return;
    (par[m.mot] = par[m.mot] || Object.assign({attrs: []}, m)).attrs.push([k, v]);
  }));
  if (APPRENDRE === "es") ["pelirrojo", "calvo"].forEach(m => { par[m] = par[m] || {mot: m, cat: "adjectif", attrs: []}; });
  return Object.values(par);
}
// les mots que porte un trait de p (« Tiene el pelo corto y liso » porte corto et liso)
function portes(t, p){
  const m = (k, v) => (motDe(k, v) || {}).mot;
  if (t.k === "forme") return [m("largo", p.largo), m("tipo", p.tipo)];
  if (t.k === "calvo") return APPRENDRE === "es" ? ["calvo"] : [];
  if (t.k.indexOf("lleva:") === 0) return [m("lleva", t.k.slice(6))];
  return [m(t.k, t.v)];
}

    let texte = L.phrases(P[c]);

    z.appendChild(r); z.insertAdjacentHTML("beforeend", '<p class="retourMsg" id="msg"></p>');

  completa(w){
    const cand = [];
    IDS.forEach(i => L.trous(P[i]).forEach(tr => { if (!w || (motDe(tr.k, tr.v) || {}).mot === w.mot) cand.push([i, tr]); }));

    motQ = motDe(tr.k, tr.v);
    const opts = melanger([tr.rep, ...melanger([...new Set(tr.opts)].filter(o => o !== tr.rep)).slice(0, 3)]);
    const img = tr.visage ? '<img class="visage" alt="" src="descripcion/' + id + '-visage.webp">' : '<img alt="" src="descripcion/' + id + '.webp">';
    const z = $("zone"); z.innerHTML = '<p class="consigne">' + T("completa") + '</p><div class="vue">' + img + '<div class="enonce">' + cible(nom(id) + " — " + tr.phrase.replace("___", '<span class="trou" id="trou">?</span>')) + '</div></div><div class="choix" id="choix"></div><p class="retourMsg" id="msg"></p>';
    const ch = $("choix"); let bon;
    opts.forEach(o => { const b = document.createElement("button"); b.type = "button"; b.lang = APPRENDRE; b.textContent = o; if (o === tr.rep) bon = b;
      b.addEventListener("click", () => { marquer(ch, b, bon); $("trou").textContent = tr.rep; juger(o === tr.rep, tr.rep); }); ch.appendChild(b); });
    return true;
  },
  // es / tiene / lleva -- ist / hat / traegt, sur une expression qui contient le mot (« el pelo rizado », « blaue Augen »)
  verbe(w){
    const contient = (texte, m) => {
      if (m !== "gafas de sol" && texte.indexOf("gafas de sol") >= 0) return false;
      if (m.indexOf(" ") >= 0) return texte === m;
      const f = m.replace(/o$/, "a");
      return texte.split(/[\s,]+/).some(x => [m, m + "s", m + "es", m + "e", f, f + "s"].includes(x));
    };
    const cand = w ? L.mots.filter(([texte]) => contient(texte, w.mot)) : L.mots;
    if (!cand.length) return false;
    const [mot, v] = hasard(cand);
    motQ = motCourant(w);
    const z = $("zone"); z.innerHTML = '<p class="consigne">' + T("verbe") + '</p><div class="enonce" style="text-align:center;font-size:21px">' + cible('<span class="trou" id="trou">?</span> ' + mot) + '</div><div class="choix" id="choix" style="justify-content:center"></div><p class="retourMsg" id="msg"></p>';
    const ch = $("choix"); let bon;
    L.verbes.forEach(o => { const b = document.createElement("button"); b.type = "button"; b.lang = APPRENDRE; b.textContent = o; if (o === v) bon = b;
      b.addEventListener("click", () => { marquer(ch, b, bon); $("trou").textContent = v; juger(o === v, v + " " + mot); }); ch.appendChild(b); });
    return true;
  },
  accord(w){
    if (APPRENDRE !== "es") return false;
    const adj = [["alto", p => p.altura === "alto"], ["bajo", p => p.altura === "bajo"], ["delgado", p => p.tam === "delgado"], ["gordo", p => p.tam === "gordo"], ["rubio", p => p.color === "rubio" && p.largo !== "calvo"], ["pelirrojo", p => p.color === "rojo"], ["calvo", p => p.largo === "calvo"]]
      .filter(a => !w || a[0] === w.mot);
    const cand = [];
    adj.forEach(a => IDS.forEach(i => { if (a[1](P[i])) cand.push([i, a]); }));
    if (!cand.length) return false;
    const [id, a] = hasard(cand);
    const masc = a[0], fem = a[0].replace(/o$/, "a"), rep = P[id].sexe === "f" ? fem : masc;
    motQ = {mot: masc, cat: "adjectif"};
    const z = $("zone"); z.innerHTML = '<p class="consigne">' + T("accord") + '</p><div class="vue"><img alt="" src="descripcion/' + id + '.webp"><div class="enonce">' + cible(nom(id) + ' es <span class="trou" id="trou">?</span>.') + '</div></div><div class="choix" id="choix"></div><p class="retourMsg" id="msg"></p>';
    const ch = $("choix"); let bon;
    [masc, fem].forEach(o => { const b = document.createElement("button"); b.type = "button"; b.lang = "es"; b.textContent = o; if (o === rep) bon = b;
      b.addEventListener("click", () => { marquer(ch, b, bon); $("trou").textContent = rep; juger(o === rep, nom(id) + " es " + rep + "."); }); ch.appendChild(b); });
    return true;
  },
  elige(w){
    const qui = w ? IDS.filter(i => porte(P[i], w)) : IDS;
    if (!qui.length) return false;
    const id = hasard(qui), autres = melanger(IDS.filter(i => i !== id)).slice(0, 2), ids = melanger([id, ...autres]);
    motQ = motCourant(w);
    const z = $("zone"); z.innerHTML = '<p class="consigne">' + T("elige") + '</p><div class="vue"><img alt="" src="descripcion/' + id + '.webp"><img class="visage" alt="" src="descripcion/' + id + '-visage.webp"></div><div class="liste" id="choix"></div><p class="retourMsg" id="msg"></p>';
    const ch = $("choix"); let bon;
    ids.forEach(o => { const b = document.createElement("button"); b.type = "button"; b.lang = APPRENDRE; b.dir = "ltr"; b.textContent = L.phrases(P[o]); if (o === id) bon = b;
      b.addEventListener("click", () => { marquer(ch, b, bon); juger(o === id, L.phrases(P[id])); }); ch.appendChild(b); });
    return true;
  },
  // ¿Quien es mas alto? -- il vise alto ou bajo (gross ou klein)
  taille(w){
    const alt = w ? (w.attrs || []).find(a => a[0] === "altura" && (a[1] === "alto" || a[1] === "bajo")) : null;
    if (w && !alt) return false;
    // trois personnes de tailles nettement differentes (au moins 8 cm entre chacune)
    let ids, n = 0;
    do { ids = melanger(IDS).slice(0, 3); n++; } while (n < 200 && ids.some((a, i) => ids.some((b, j) => i < j && Math.abs(P[a].metres - P[b].metres) < 0.08)));
    const grand = alt ? alt[1] === "alto" : Math.random() < 0.6, rep = ids.reduce((m, i) => (grand ? P[i].metres > P[m].metres : P[i].metres < P[m].metres) ? i : m, ids[0]);
    motQ = motCourant(w);
    const z = $("zone"); z.innerHTML = '<p class="consigne">' + T("taille") + '</p><div class="enonce" style="text-align:center">' + cible(grand ? L.plusGrand : L.plusPetit) + '</div>';
    const r = rangee(ids, 240, (b, id) => { const bon = r.querySelector('[data-id="' + rep + '"]'); marquer(r, b, bon); juger(id === rep, nom(rep)); });
    z.appendChild(r); z.insertAdjacentHTML("beforeend", '<p class="retourMsg" id="msg"></p>');
    return true;
  },
  yeux(w){
    const couleurs = Object.keys(OPTS_YEUX).filter(c => !w || (motDe("ojos", c) || {}).mot === w.mot);
    if (!couleurs.length) return false;
    const c = hasard(couleurs), opts = melanger(Object.keys(OPTS_YEUX));
    motQ = motDe("ojos", c);
    const z = $("zone"); z.innerHTML = '<p class="consigne">' + T("yeux") + '</p><img class="photo" alt="" src="descripcion/yeux-' + c + '.webp"><div class="enonce" style="text-align:center">' + cible(L.yeuxQ) + '</div><div class="choix" id="choix" style="justify-content:center"></div><p class="retourMsg" id="msg"></p>';
    const ch = $("choix"); let bon;
    opts.forEach(o => { const b = document.createElement("button"); b.type = "button"; b.lang = APPRENDRE; b.textContent = OPTS_YEUX[o]; if (o === c) bon = b;
      b.addEventListener("click", () => { marquer(ch, b, bon); juger(o === c, L.yeuxRep(c)); }); ch.appendChild(b); });
    return true;
  }
};
const SORTES = Object.keys(EX).filter(x => APPRENDRE === "es" || x !== "accord");

// LA PARTIE (3 nov. 2026, « le tirage suit les mots ») : la file des MOTS vient de l'app (Tirage.plan : les dus,
// les rates recents, puis au plus NEUFS_MAX nouveaux) ; chaque mot recoit une question d'une sorte qui le vise,
// jamais la meme sorte deux fois de suite, jamais deux fois la meme question. Rate, il revient plus loin.
const NEUFS_MAX = Q.get("seance") === "1" ? 3 : 10;
let vus = new Set(), sorteCourante = null, derniereSorte = null;
function cleQuestion(){
  const z = $("zone"), en = z.querySelector(".enonce");
  return sorteCourante + "|" + (en ? en.textContent : "") + "|" + Array.from(z.querySelectorAll("img")).map(i => i.getAttribute("src")).sort().join(",");
}
function montrer(){
  repondu = false; $("suite").hidden = true;
  $("compte").textContent = (rang + 1) + " / " + file.length;
  $("barre").style.width = (rang / file.length * 100) + "%";
  // une question pour le mot du rang : d'une AUTRE sorte que la precedente et jamais deja vue dans la partie.
  // Si ce mot ne le permet pas (der Bart : deux personnes, deja montrees), un mot plus loin dans la file passe devant ;
  // en dernier recours seulement, la meme sorte, puis une question deja vue.
  const essai = (w, strict) => {
    const autres = melanger(SORTES.filter(x => x !== derniereSorte));
    for (const so of autres){
      for (let n = 0; n < 25; n++){
        motQ = null; sorteCourante = so;
        if (!EX[so](w)) break;
        if (!vus.has(cleQuestion())) return so;
      }
    }
    if (strict) return null;
    if (derniereSorte) for (let n = 0; n < 25; n++){           // la meme sorte, avec une question fraiche
      motQ = null; sorteCourante = derniereSorte;
      if (!EX[derniereSorte](w)) break;
      if (!vus.has(cleQuestion())) return derniereSorte;
    }
    for (const so of autres.concat(derniereSorte ? [derniereSorte] : [])){   // tout est deja vu : n'importe laquelle
      motQ = null; sorteCourante = so;
      if (EX[so](w)) return so;
    }
    return null;
  };
  let fait = essai(file[rang], true);
  for (let j = rang + 1; !fait && j < file.length; j++){
    fait = essai(file[j], true);
    if (fait) [file[rang], file[j]] = [file[j], file[rang]];
  }
  if (!fait) fait = essai(file[rang], false);
  vus.add(cleQuestion()); derniereSorte = fait;
  window.scrollTo(0, 0);
}
function fin(){
  $("barre").style.width = "100%"; $("compte").textContent = file.length + " / " + file.length; $("suite").hidden = true;
  $("zone").innerHTML = '<div class="fin"><div class="score">' + T("score", {b: bons, n: file.length}) + '</div>' + boutonEncore() + '<button type="button" id="terminer">' + T("terminer") + '</button></div>';
  brancherEncore();
  $("terminer").addEventListener("click", () => parler("fini", {bons, faits: file.length}));
}
// plus rien de du ni de nouveau : la partie le dit, et ne repose pas des mots deja sus
function toutRevu(prochaine){
  $("barre").style.width = "100%"; $("compte").textContent = ""; $("suite").hidden = true;
  const quand = Tirage.revu(prochaine, LANGUE);
  $("zone").innerHTML = '<div class="fin"><div class="score">' + (TIRAGE_TEXTES.revu[LANGUE] || TIRAGE_TEXTES.revu.fr) + '</div>'
    + (quand ? '<p class="consigne">' + (TIRAGE_TEXTES.prochaine[LANGUE] || TIRAGE_TEXTES.prochaine.fr).replace("{d}", quand) + '</p>' : "")
    + boutonEncore() + '<button type="button" id="terminer">' + T("terminer") + '</button></div>';
  brancherEncore();
  $("terminer").addEventListener("click", () => parler("fini", {bons: 0, faits: 0}));
}
// « Encore des questions » : en fin de partie et quand tout est revu, jamais dans la seance (elle a sa longueur)
const boutonEncore = () => Q.get("seance") === "1" ? "" : '<button type="button" id="encore">' + (TIRAGE_TEXTES.encore[LANGUE] || TIRAGE_TEXTES.encore.fr) + '</button>';
function brancherEncore(){ const b = $("encore"); if (b) b.addEventListener("click", encoreDesQuestions); }
async function encoreDesQuestions(){
  const mots = motsDuTheme();
  file = Tirage.supplement(mots, await Tirage.demander(mots), NB); rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(null);
  montrer();
}
async function demarrer(){
  const mots = motsDuTheme();
  const plan = Tirage.plan(mots, await Tirage.demander(mots), NB, NEUFS_MAX);
  file = plan.file; rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(plan.prochaine);
  montrer();
}
$("suite").addEventListener("click", () => { if (!file.length) return; rang++; if (rang >= file.length) fin(); else montrer(); });
$("retour").addEventListener("click", () => parler("fermer"));
$("retour").setAttribute("aria-label", T("retourAria"));
$("titre").textContent = T("titre");
document.title = T("titre");
preparerVoix();
fetch("descripcion/personnages.json?v=1").then(r => r.json()).then(d => { P = d; IDS = Object.keys(d); if (Q.get("seance") === "1") demarrer(); else decouvrir(); });
</script>
