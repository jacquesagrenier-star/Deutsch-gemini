<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La journée</title>
<!--
  LA JOURNEE (theme illustre, 3 nov. 2026, vague 1 de Jacques : « la journee (verbes pronominaux, l'heure) »).
  On suit des PERSONNES et le TEMPS QUI PASSE : un lundi d'Anna, le samedi de Mark, un jour d'ecole chez Jan et
  Katrin. Pas les scenes fruehstueck et schlafzimmer, qui sont des lieux et leurs objets (regle 2 de Jacques).
  Ce qu'on y apprend : les verbes pronominaux (me levanto / ich ziehe mich an), les verbes separables (Anna steht
  um sieben Uhr auf), L'HEURE (a las siete y media / um halb acht : une horloge dessinee sur chaque image, a
  l'heure exacte), l'ordre de la journee (primero, despues / zuerst, dann, danach) et la frequence (siempre, a
  veces, nunca / immer, manchmal, nie). Les heures s'ecrivent en lettres : aucune phrase dite n'a de chiffre.
  Toute la donnee vient de journee/journee.json (visuel/journee/journee.py) : aucune phrase ecrite a la main.
  Ouverte par l'app dans le cadre des scenes (sceneCadre), elle parle comme une scene : « exercice » et « bonne »
  a chaque reponse, « reponse » {mot, genre, cat, juste} pour le mot teste, « fini » et « fermer » a la fin.
  Parametres : apprendre=es|de, lang=<interface>, nuit=1, seance=1 (six questions, pas de decouverte),
  variante=latam (la computadora, la escuela, la voix de Monica), r=<AUDIO_REVISION>.
  Le tirage suit les mots (themes/tirage.js) ; la voix : le fichier enregistre, sinon le telephone (themes/voix.js).
  L'ANGLAIS (apprendre=en, 4 nov. 2026, Jacques : « il manque beaucoup de themes en anglais ») : les memes images et
  la meme mecanique, des phrases ecrites pour l'anglais (objet EN). L'anglais n'a presque pas de pronominaux : on y
  apprend le present simple de la routine (she gets up, le -s, does / doesn't), les verbes a particule de la journee
  (wake up, get up, get dressed, go to bed), l'heure (a quarter to seven ; en americain aussi six forty-five), la place
  des adverbes de frequence (avant le verbe, apres be) et first / then / after that / finally. variante=gb : have a
  shower, have breakfast, pyjamas. L'image du metro d'Anna (anna-6, la rame jaune de Berlin) est ecartee : Boston.
-->
<style>
:root{--fond1:#82AFDB;--fond3:#C0D6EA;--encre:#1C2430;--gris:#4C566B;--ambre:#E8A23A;--ambre-f:#A86A0E;--vert:#2F9E6A;--rouge:#C8473A;
  --verre:rgba(255,255,255,.88);--bord:rgba(255,255,255,.95);--carte:#F7F8FA;--police:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html.nuit{--fond1:#0E1C26;--fond3:#18303F;--encre:#EEF2F5;--gris:#A9B8C4;--ambre-f:#E8A23A;--vert:#5CC98F;--rouge:#F07F72;
  --verre:rgba(20,36,50,.88);--bord:rgba(255,255,255,.14);--carte:#22384A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
/* LA PAGE A LA HAUTEUR DE L'ECRAN, COMME UNE SCENE (3 nov. 2026, Jacques sur iPhone : « Commencer » « pas
   completement en bas ») : le contenu defile DANS le body, le document garde la hauteur du cadre (familia.html). */
html{height:100%;overflow:hidden}
body{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;box-sizing:border-box}
body{background:linear-gradient(180deg,var(--fond1),var(--fond3));background-attachment:fixed;color:var(--encre);font-family:var(--police);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 90px) max(10px,env(safe-area-inset-left,0px))}
.haut{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto 10px}
.retour{width:42px;height:42px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);color:var(--encre);font:800 22px var(--police);cursor:pointer;flex:0 0 auto}
html[dir="rtl"] .retour{transform:scaleX(-1)}
.titre{flex:1;font-weight:900;font-size:18px}
.compte{font-weight:800;font-size:14px;color:var(--gris)}
.barre{max-width:560px;margin:0 auto 12px;height:6px;border-radius:3px;background:rgba(28,36,48,.12);overflow:hidden}
.barre i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2BB5AA,#14807A);transition:width .3s}
main{max-width:560px;margin:0 auto;background:var(--verre);border:1px solid var(--bord);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}
.consigne{font-size:14px;font-weight:700;color:var(--gris);margin:0}
.enonce{direction:ltr;text-align:left;background:var(--carte);border-radius:14px;padding:12px 14px;font-weight:800;line-height:1.5;font-size:17px}
.enonce.centre{text-align:center;font-size:19px}
.trou{display:inline-block;min-width:56px;border-bottom:2px solid var(--ambre);text-align:center;color:var(--ambre-f)}
/* une etape : la photo en 4:3 et, dans son coin, l'horloge a l'heure exacte (dessinee ici, jamais generee) */
.photo{position:relative;width:100%;max-width:480px;margin:0 auto;border-radius:16px;overflow:hidden;background:var(--carte)}
.photo img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.cadran{position:absolute;right:8px;bottom:8px;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.92);border-radius:999px;padding:4px 8px 4px 5px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.cadran svg.horloge{width:62px;height:62px;display:block}
.cadran svg.moment{width:20px;height:20px;display:block}
/* dans la frise et les vignettes, l'horloge reste petite : la photo doit se voir */
.photo.petite .cadran svg.horloge{width:24px;height:24px}
.photo.petite .cadran{right:3px;bottom:3px;padding:2px}
.photo.petite .cadran svg.moment{display:none}
/* la semaine de la frequence : sept jours, coche ou non */
.semaine{direction:ltr;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--carte);border-radius:14px;padding:8px}
.semaine div{text-align:center;font-weight:800;font-size:13px;color:var(--gris)}
.semaine b{display:flex;align-items:center;justify-content:center;margin:4px auto 0;width:30px;height:30px;border-radius:50%;font-size:17px}
.semaine b.oui{background:var(--vert);color:#fff} .semaine b.non{background:rgba(120,130,150,.18);color:var(--gris)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choix button .semaine{padding:4px;gap:2px}
.choix button .semaine b{width:22px;height:22px;font-size:13px}
.visages{display:flex;gap:8px;justify-content:center}
.visages img{width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;background:var(--carte)}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix.centre{justify-content:center}
.choix.liste{flex-direction:column}
.choix button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:9px 15px;font:800 15px var(--police);cursor:pointer;text-align:left}
.choix.liste button{border-radius:14px}
.choix button.juste{background:var(--vert);border-color:var(--vert);color:#fff}
.choix button.faux{background:var(--rouge);border-color:var(--rouge);color:#fff}
/* remettre dans l'ordre : quatre etapes a toucher de la premiere a la derniere */
.ordre{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ordre button{position:relative;border:3px solid transparent;border-radius:14px;background:var(--carte);padding:0 0 6px;cursor:pointer;overflow:hidden;text-align:left;color:var(--encre);font:700 13px/1.35 var(--police)}
.ordre button img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;margin-bottom:5px}
.ordre button span.t{display:block;padding:0 7px;direction:ltr;text-align:left}
.ordre button i{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;background:var(--ambre);color:#1C2430;font:900 17px/30px var(--police);font-style:normal;text-align:center;display:none}
.ordre button.pris i{display:block}
.ordre button.juste{border-color:var(--vert)} .ordre button.juste i{background:var(--vert);color:#fff;display:block}
.ordre button.faux{border-color:var(--rouge)}
button:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
button:disabled{cursor:default}
.retourMsg{min-height:1.4em;font-weight:800;font-size:15px;margin:0;line-height:1.45}
.retourMsg.ok{color:var(--vert)} .retourMsg.ko{color:var(--rouge)}
.retourMsg .phrase{display:block;color:var(--encre);font-weight:700}
/* la decouverte : trois journees, la frise des etapes, la fiche de celle qu'on touche */
.onglets{display:flex;gap:6px;background:var(--carte);border-radius:999px;padding:4px}
.onglets button{flex:1;border:0;border-radius:999px;background:none;color:var(--gris);font:800 14px var(--police);padding:8px 4px;cursor:pointer}
.onglets button[aria-selected="true"]{background:var(--ambre);color:#1C2430}
.frise{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.frise button{border:3px solid transparent;border-radius:12px;padding:0;background:var(--carte);cursor:pointer;overflow:hidden;display:block}
.frise button .photo{border-radius:0}
.frise button.choisi{border-color:var(--ambre)}
/* LA FRISE DANS LA QUESTION (retour de Jacques du 5 nov. 2026) : la journee entiere, l'etape connue entouree, celle
   qu'on demande en pointilles avec son « ? » */
.titreJour{text-align:center;font-weight:800;font-size:15px;color:var(--gris)}
.frise .case{position:relative;border:3px solid transparent;border-radius:12px;overflow:hidden;background:var(--carte)}
.frise .case .photo{border-radius:0}
.frise .case.choisi{border-color:var(--ambre)}
.frise .case.demandee{border:3px dashed var(--ambre-f)}
.frise .case .marque{position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:999px;display:grid;place-items:center;
  background:var(--ambre);color:#1C2430;font:800 15px var(--police);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.fiche{background:var(--carte);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.fiche .dit{font-weight:800;font-size:18px;line-height:1.4}
.fiche .ligne{display:flex;align-items:flex-start;gap:10px}
.fiche .ligne > div{flex:1}
.fiche .ecoute{width:44px;height:44px;flex:0 0 auto;border-radius:50%;border:2px solid var(--ambre);background:var(--verre);color:var(--encre);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fiche .ecoute svg{width:22px;height:22px}
.regle{margin:0;font-size:14px;font-weight:700;line-height:1.45;color:var(--gris);background:var(--carte);border-radius:12px;padding:10px 12px}
.suite{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:54px;border:0;border-radius:27px;
  color:#fff;font:800 17px var(--police);background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer}
.suite[hidden]{display:none}
/* Jacques, 3 nov. 2026, comme dans les scenes : « commencer les exercices ou continuer soit toujours en bas
   completement de l'ecran ». Tous les boutons d'action sont fixes en bas, jamais dans le flux : la suite (Commencer,
   Continuer, Terminer) et, a la fin, « Encore des questions » et « Terminer » cote a cote (.bas, comme familia.html). */
.suite{z-index:5000}
.bas{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:5000}
.bas button{flex:1 1 0;min-width:0;height:54px;border:0;border-radius:27px;padding:0 12px;color:#fff;font:800 16px/1.15 var(--police);
  background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer}
.fin{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:10px 0}
.fin .score{font-size:22px;font-weight:900}
[lang]{unicode-bidi:isolate}
/* la traduction dans la langue d'interface : une ligne, plus petite, en gris (3 nov. 2026) */
.trad.faux{color:var(--rouge);font-style:italic}
.trad{display:block;font-size:13px;font-weight:600;color:var(--gris);line-height:1.35;margin-top:2px}
</style>
</head>
<body>
<div class="haut"><button class="retour" id="retour" type="button">‹</button><div class="titre" id="titre"></div><div class="compte" id="compte" dir="ltr"></div></div>
<div class="barre"><i id="barre"></i></div>
<main id="zone"></main>
<button class="suite" id="suite" type="button" hidden></button>
<script src="themes/tirage.js?v=3"></script>
<script src="themes/voix.js?v=7"></script>
<script src="themes/fin.js?v=2"></script>
<script src="themes/zoom.js?v=4"></script>
<script src="themes/verre.js?v=8"></script>
<script>
const Q = new URLSearchParams(location.search);
const APPRENDRE = ["de", "en"].includes(Q.get("apprendre")) ? Q.get("apprendre") : "es";
const GB = APPRENDRE === "en" && Q.get("variante") === "gb";
const LATAM = APPRENDRE === "es" && Q.get("variante") === "latam";
const LANGUE = (l => ["fr", "en", "tr", "uk", "fa", "ar", "pt", "pl", "ru", "de"].includes(l) ? l : "fr")(((Q.get("lang") || "fr").toLowerCase().split(/[-_]/)[0]));
if (Q.get("nuit") === "1") document.documentElement.classList.add("nuit");
// agrandir (themes/zoom.js) : un toucher sur une photo d'etape, une fiche ou un visage ; la loupe sur ce qu'on touche
// pour repondre (les quatre etapes a remettre dans l'ordre) et sur les cases de la frise
Zoom.init({direct: ".photo img, .duo img, .visages img", loupe: ".ordre button, .frise button", langue: LANGUE});
document.documentElement.lang = LANGUE;
document.documentElement.dir = (LANGUE === "fa" || LANGUE === "ar") ? "rtl" : "ltr";
// vingt questions seul (Jacques, 3 nov.), six dans la seance du jour, sans la decouverte
const NB = Q.get("seance") === "1" ? Math.max(2, Math.min(12, parseInt(Q.get("nb"), 10) || 6)) : 20;   // nb : le reglage « Questions par scene et par theme » de la seance du jour (5 · 8 · 12, 7 nov. 2026)

const TEXTES = {
  titre:     {fr:"La journée", en:"Daily routine", tr:"Günlük rutin", uk:"Розпорядок дня", fa:"کارهای روزانه", ar:"الروتين اليومي", pt:"A rotina do dia", pl:"Plan dnia", ru:"Распорядок дня", de:"Der Tagesablauf"},
  intro:     {fr:"Touche un moment de la journée : tu le vois, tu lis l'heure et tu l'entends.", en:"Tap a moment of the day: you see it, read the time and hear it.", tr:"Günün bir anına dokun: onu gör, saati oku ve dinle.", uk:"Торкнися моменту дня: побачиш його, прочитаєш час і почуєш.", fa:"روی یکی از لحظه‌های روز بزن: آن را می‌بینی، ساعت را می‌خوانی و می‌شنوی.", ar:"المس لحظة من اليوم: تراها وتقرأ الساعة وتسمعها.", pt:"Toque em um momento do dia: você vê, lê a hora e ouve.", pl:"Dotknij chwili dnia: zobaczysz ją, odczytasz godzinę i usłyszysz.", ru:"Нажми на момент дня: увидишь его, прочитаешь время и услышишь.", de:"Tippe auf einen Moment des Tages: Du siehst ihn, liest die Uhrzeit und hörst ihn."},
  regleEs:   {fr:"Les verbes pronominaux ont un pronom qui suit la personne : me levanto, te levantas, se levanta, nos levantamos, se levantan. L'heure : a las siete y media (7 h 30), a las ocho menos cuarto (7 h 45).", en:"Reflexive verbs take a pronoun that matches the person: me levanto, te levantas, se levanta, nos levantamos, se levantan. Time: a las siete y media (7:30), a las ocho menos cuarto (7:45).", tr:"Dönüşlü fiiller kişiye uyan bir zamir alır: me levanto, te levantas, se levanta, nos levantamos, se levantan. Saat: a las siete y media (7.30), a las ocho menos cuarto (7.45).", uk:"Зворотні дієслова мають займенник, що відповідає особі: me levanto, te levantas, se levanta, nos levantamos, se levantan. Час: a las siete y media (7:30), a las ocho menos cuarto (7:45).", fa:"فعل‌های بازتابی ضمیری دارند که با شخص هماهنگ است: me levanto، te levantas، se levanta، nos levantamos، se levantan. ساعت: a las siete y media (7:30)، a las ocho menos cuarto (7:45).", ar:"للأفعال الانعكاسية ضمير يوافق الشخص: me levanto، te levantas، se levanta، nos levantamos، se levantan. الساعة: a las siete y media (7:30)، a las ocho menos cuarto (7:45).", pt:"Os verbos reflexivos têm um pronome que acompanha a pessoa: me levanto, te levantas, se levanta, nos levantamos, se levantan. As horas: a las siete y media (7h30), a las ocho menos cuarto (7h45).", pl:"Czasowniki zwrotne mają zaimek zgodny z osobą: me levanto, te levantas, se levanta, nos levantamos, se levantan. Godzina: a las siete y media (7:30), a las ocho menos cuarto (7:45).", ru:"У возвратных глаголов есть местоимение, которое согласуется с лицом: me levanto, te levantas, se levanta, nos levantamos, se levantan. Время: a las siete y media (7:30), a las ocho menos cuarto (7:45).", de:"Reflexive Verben haben ein Pronomen, das zur Person passt: me levanto, te levantas, se levanta, nos levantamos, se levantan. Die Uhrzeit: a las siete y media (7.30 Uhr), a las ocho menos cuarto (7.45 Uhr)."},
  regleDe:   {fr:"Le verbe séparable se coupe en deux, sa particule va à la fin : aufstehen, Anna steht um sieben Uhr auf. Et attention : halb acht, c'est 7 h 30, la demi-heure AVANT huit heures.", en:"A separable verb splits in two and its particle goes to the end: aufstehen, Anna steht um sieben Uhr auf. And watch out: halb acht is 7:30, half an hour BEFORE eight.", tr:"Ayrılabilen fiil ikiye bölünür, öneki sona gider: aufstehen, Anna steht um sieben Uhr auf. Dikkat: halb acht 7.30 demektir, sekizden yarım saat ÖNCE.", uk:"Відокремлюване дієслово розпадається на дві частини, префікс іде в кінець: aufstehen, Anna steht um sieben Uhr auf. І увага: halb acht — це 7:30, пів години ДО восьмої.", fa:"فعل جداشدنی دو تکه می‌شود و پیشوندش به آخر جمله می‌رود: aufstehen، Anna steht um sieben Uhr auf. و دقت کن: halb acht یعنی 7:30، نیم ساعت پیش از هشت.", ar:"ينقسم الفعل القابل للفصل إلى جزأين وتذهب سابقته إلى آخر الجملة: aufstehen، Anna steht um sieben Uhr auf. وانتبه: halb acht تعني 7:30، أي نصف ساعة قبل الثامنة.", pt:"O verbo separável se divide em dois e a partícula vai para o fim: aufstehen, Anna steht um sieben Uhr auf. E atenção: halb acht é 7h30, meia hora ANTES das oito.", pl:"Czasownik rozdzielnie złożony dzieli się na dwie części, a przedrostek idzie na koniec: aufstehen, Anna steht um sieben Uhr auf. Uwaga: halb acht to 7:30, pół godziny PRZED ósmą.", ru:"Отделяемый глагол делится на две части, приставка уходит в конец: aufstehen, Anna steht um sieben Uhr auf. И внимание: halb acht — это 7:30, полчаса ДО восьми.", de:"Trennbare Verben teilen sich, die Vorsilbe steht am Ende: aufstehen, Anna steht um sieben Uhr auf. Und: halb acht ist 7.30 Uhr."},
  ecouter:   {fr:"Écouter", en:"Listen", tr:"Dinle", uk:"Слухати", fa:"گوش بده", ar:"استمع", pt:"Ouvir", pl:"Posłuchaj", ru:"Слушать", de:"Anhören"},
  commencer: {fr:"Commencer", en:"Start", tr:"Başla", uk:"Почати", fa:"شروع", ar:"ابدأ", pt:"Começar", pl:"Zacznij", ru:"Начать", de:"Starten"},

// ---------- la donnee (journee.json) ----------
let D = null, ETAPES = [];                  // ETAPES : {cle, jour, rang, verbe, sujet, h, m}, dans l'ordre des journees
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const n = s => D.sujets[s].n;               // l'indice des formes : 2 (il, elle), 4 (ils)
const etapesDu = j => ETAPES.filter(e => e.jour === j);

// ---------- l'heure en lettres : la meme regle que journee.py (heure_es, heure_de) ----------
const NOMBRES_ES = ["doce", "una", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve", "diez", "once", "doce"];
const NOMBRES_DE = ["zwölf", "eins", "zwei", "drei", "vier", "fünf", "sechs", "sieben", "acht", "neun", "zehn", "elf", "zwölf"];
function heureEs(h, m){
  const k = (m > 30 ? h + 1 : h) % 12;
  let s = (k === 1 ? "a la una" : "a las " + NOMBRES_ES[k]) + ({0: "", 15: " y cuarto", 30: " y media", 45: " menos cuarto"})[m];
  if (h >= 12 && h < 20) s += " de la tarde"; else if (h >= 20) s += " de la noche";
  return s;
}
function heureDe(h, m, soir){
  const k = h % 12 || 12, s = k < 12 ? k + 1 : 1, nom = x => x === 1 ? "ein" : NOMBRES_DE[x];
  const t = ({0: "um " + nom(k) + " Uhr", 15: "um Viertel nach " + NOMBRES_DE[k], 30: "um halb " + NOMBRES_DE[s], 45: "um Viertel vor " + NOMBRES_DE[s]})[m];
  return t + (h >= 18 && soir !== false ? " abends" : "");
}
// dans la traduction, l'heure s'ecrit en chiffres (elle n'est pas dite) ; en allemand pour qui apprend l'espagnol
function heureTrad(h, m){
  if (LANGUE === "fr") return "à " + h + " h" + (m ? " " + String(m).padStart(2, "0") : "");
  if (LANGUE === "en") return "at " + (h % 12 || 12) + ":" + String(m).padStart(2, "0") + (h < 12 ? " a.m." : " p.m.");
  if (LANGUE === "pt") return "às " + h + "h" + (m ? String(m).padStart(2, "0") : "");
  return heureDe(h, m);
}

  formes(vb, k){ const v = D.verbes[vb].es, c = (LATAM && v.latam && v.latam.c) || v.c || ""; return {pr: v.pr ? v.pr[k] : "", v: v.v[k], c}; },

// L'ANGLAIS : « Anna takes a shower. What happens next? » -- « Then she gets dressed. » / « After that, she gets
// dressed. » ; « What happens before that? » -- « Before that, she gets up. » ; « What happens at the end of the
// day? » -- « Finally, she goes to bed. » Les leurres viennent du bon cote de la journee, comme en espagnol.
function suiteEn(w){
  if (w && w.role === "ordre") return premier(w);
  if (w && !w.verbes && !["apres", "fin"].includes(w.role)) return false;
  const longueur = e => etapesDu(e.jour).length;
  const candDe = mode => (w && w.verbes ? etapesDe(w) : ETAPES).filter(e => mode === "avant" ? longueur(e) - e.rang - 1 >= 2
                                                                      : mode === "fin" ? e.rang === longueur(e) - 1 && e.rang >= 2 : e.rang >= 2);
  // un verbe du debut de journee (wake up) n'a rien avant lui : on essaie les autres sens
  let mode = w && !w.verbes ? (w.role === "fin" ? "fin" : "apres") : hasard(["apres", "apres", "avant", "fin"]);
  let cand = candDe(mode);
  for (const m of ["apres", "avant"]) if (!cand.length && w && w.verbes){ mode = m; cand = candDe(mode); }
  if (!cand.length) return false;
  const r = hasard(cand), d = etapesDu(r.jour), montree = mode === "avant" ? d[r.rang + 1] : d[r.rang - 1];
  const leurres = melanger(mode === "avant" ? d.slice(r.rang + 1) : d.slice(0, r.rang)).slice(0, 3);
  const lien = mode === "avant" ? "before that" : mode === "fin" ? "finally" : w && ["then", "after that"].includes(w.mot) ? w.mot : hasard(["then", "after that"]);
  const dit = e => etapeApresLien(e, lien, montree.sujet, false);
  const rep = dit(r), opts = unique([rep, ...leurres.map(dit)]);
  if (opts.length < 3) return false;
  motQ = w || motsDuTheme().find(x => x.mot === lien) || motDuVerbe(r.verbe);
  tradQ = tradEtape(r);
  const enonce = EN.phrase(montree.verbe, EN.sujet(montree.sujet, true), n(montree.sujet), null, null, montree.sujet) + " "
               + (mode === "avant" ? "What happens before that?" : mode === "fin" ? "What happens at the end of the day?" : "What happens next?");
  ecran(mode === "avant" ? "avant" : mode === "fin" ? "finJour" : "apres", friseQuestion(r.jour, montree, r), enonce, true, true);
  tradsChoix = {}; [r, ...leurres].forEach(e => { tradsChoix[dit(e)] = tradGeste(e.verbe, e.sujet); });
  boutons($("choix"), melanger(opts), rep, ok => juger(ok, rep, etapeApresLien(r, lien, montree.sujet)));
  return true;
}
// L'ANGLAIS : « Anna takes a shower before she gets dressed. » vrai ou faux -- before / after suivis du present simple,
// les deux photos et leurs horloges. Le meme sujet dans les deux gestes, jamais la famille (« before it eats »).
function avantApresEn(w){
  if (w && !w.verbes) return false;
  const paires = [];
  ETAPES.forEach(a => ETAPES.forEach(b => { if (a.jour === b.jour && a.sujet === b.sujet && a.sujet !== "familia" && a.rang !== b.rang && a.verbe !== b.verbe
    && (!w || w.verbes.includes(a.verbe) || w.verbes.includes(b.verbe))) paires.push([a, b]); }));

// le moment que trahissent l'icone du cadran et la fin de l'heure ecrite (« de la tarde », « abends »)
// (en anglais, la fin de l'heure ecrite : rien le matin, in the afternoon, in the evening, at night -- suffixeEn)
const periode = h => (h >= 18 || h < 6 ? "lune" : "soleil") + (APPRENDRE === "en" ? suffixeEn(h) : APPRENDRE === "es" ? (h < 12 ? 0 : h < 20 ? 1 : 2) : (h < 18 ? 0 : 1));
// la semaine d'une frequence : tout coche (siempre), rien (nunca), les jours du fait (a veces) ; pour « laquelle
// des trois semaines ? », un « a veces » quelconque si le fait n'en est pas un
const coches = (f, fa) => f === "siempre" ? [1, 1, 1, 1, 1, 1, 1] : f === "nunca" ? [0, 0, 0, 0, 0, 0, 0] : (fa && fa.jours) || [1, 0, 0, 1, 0, 1, 0];
const semaineHTML = c => '<div class="semaine">' + L.jours.map((j, i) => '<div>' + j + '<b class="' + (c[i] ? "oui" : "non") + '">' + (c[i] ? "✓" : "·") + '</b></div>').join("") + '</div>';
// le moment de la journee d'une etape, quand il ne fait aucun doute (19 h 30 n'est ni franchement « tarde » ni « noche »)
// En anglais : le matin avant midi ; le soir de 18 h 30 a 19 h 30 ; la nuit a partir de 23 h. 18 h, 20 h, 22 h 30 n'y
// sont pas (« in the evening » ou « at night » ? on entend les deux), et rien n'a lieu l'apres-midi.
function quand(e){
  const t = e.h * 60 + e.m;
  if (APPRENDRE === "en") return t < 12 * 60 ? "morning" : t >= 18 * 60 + 30 && t <= 19 * 60 + 30 ? "evening" : t >= 23 * 60 ? "night" : null;
  if (APPRENDRE === "es") return t < 12 * 60 ? "manana" : t >= 13 * 60 && t <= 18 * 60 + 30 ? "tarde" : t >= 21 * 60 ? "noche" : null;
  if (/Abend/.test(D.verbes[e.verbe].de.c || "")) return null;          // pas « am Abend zu Abend »
  return t <= 9 * 60 ? "morgen" : t >= 18 * 60 && t <= 22 * 60 + 30 ? "abend" : null;
}
// « Anna se ducha por la mañana. » vrai ou faux : la photo, l'horloge ; le faux change le moment
function momentVraiFaux(w){
  const cand = ETAPES.filter(e => quand(e) === w.moment);
  if (!cand.length) return false;
  // en anglais, le faux n'est jamais le moment voisin (le soir / la nuit) : seulement ce que l'horloge dement franchement
  const VOISIN_EN = {evening: "night", night: "evening"};
  const e = hasard(cand), vrai = Math.random() < 0.5, autre = hasard(Object.keys(L.moments).filter(k => k !== w.moment && !(APPRENDRE === "en" && VOISIN_EN[w.moment] === k)));
  const dit = k => APPRENDRE === "de" ? (f => [DE.sujet(e.sujet, true), f.v, f.r, f.o, L.moments[k], f.c, f.p].filter(Boolean).join(" ") + ".")(DE.formes(e.verbe, n(e.sujet)))
                 : APPRENDRE === "en" ? [EN.sujet(e.sujet, true), EN.pred(e.verbe, n(e.sujet), e.sujet), L.moments[k]].join(" ") + "."
                                       : [ES.sujet(e.sujet, true), ES.pred(e.verbe, n(e.sujet)), L.moments[k]].join(" ") + ".";
  motQ = w; tradQ = tradEtape(e);
  const juste = dit(w.moment), phrase = vrai ? juste : dit(autre);

  const rep = vrai ? L.vrai : L.faux;
  boutons($("choix"), [L.vrai, L.faux], rep, ok => juger(ok, rep, juste));

// « ¿Qué hace Mark primero? » / « Was macht Mark zuerst? » : la premiere etape d'une journee d'Anna ou de Mark (un seul

function premier(w){

// la personne d'un exercice de conjugaison : yo / tu / nosotros (sans image), ou le sujet de l'etape (avec son image)

const NEUFS_MAX = Q.get("seance") === "1" ? 3 : 10;

function cleQuestion(){
  const z = $("zone"), en = z.querySelector(".enonce");
  // sans enonce (le verbe separable, la place du verbe, l'ordre), ce sont les phrases a choisir qui font la question
  const sans = en ? "" : Array.from(z.querySelectorAll("#choix button, .ordre button .t")).map(b => b.textContent).sort().join(",");
  return sorteCourante + "|" + (en ? en.textContent : "") + "|" + sans + "|" + Array.from(z.querySelectorAll("img")).map(i => i.getAttribute("src")).sort().join(",");
}
function montrer(){
  repondu = false; $("suite").hidden = true; choixFaux = null;
  $("compte").textContent = (rang + 1) + " / " + file.length;
  $("barre").style.width = (rang / file.length * 100) + "%";
  const essai = (w, strict) => {
    const autres = melanger(SORTES.filter(x => x !== derniereSorte));
    for (const so of autres){
      for (let k = 0; k < 25; k++){
        motQ = null; tradQ = null; sorteCourante = so;
        if (!EX[so](w)) break;
        if (!vus.has(cleQuestion())) return so;
      }
    }
    if (strict) return null;
    if (derniereSorte) for (let k = 0; k < 25; k++){           // la meme sorte, avec une question fraiche
      motQ = null; tradQ = null; sorteCourante = derniereSorte;
      if (!EX[derniereSorte](w)) break;
      if (!vus.has(cleQuestion())) return derniereSorte;
    }
    for (const so of autres.concat(derniereSorte ? [derniereSorte] : [])){   // tout est deja vu : n'importe laquelle
      motQ = null; tradQ = null; sorteCourante = so;
      if (EX[so](w)) return so;
    }
    return null;
  };
  let fait = essai(file[rang], true);
  for (let j = rang + 1; !fait && j < file.length; j++){
    fait = essai(file[j], true);
    if (fait) [file[rang], file[j]] = [file[j], file[rang]];
  }
  if (!fait) fait = essai(file[rang], false);
  vus.add(cleQuestion()); derniereSorte = fait;
  window.scrollTo(0, 0); document.body.scrollTop = 0;
}
function fin(){
  $("barre").style.width = "100%"; $("compte").textContent = file.length + " / " + file.length; $("suite").hidden = true;
  $("zone").innerHTML = Fin.bilan(LANGUE, bons, file.length, T("score", {b: bons, n: file.length})) + boutonsFin();
  brancherEncore();
  $("terminer").addEventListener("click", () => parler("fini", {bons, faits: file.length}));
}
// plus rien de du ni de nouveau : la partie le dit, et ne repose pas des mots deja sus
function toutRevu(prochaine){
  $("barre").style.width = "100%"; $("compte").textContent = ""; $("suite").hidden = true;
  const quand = Tirage.revu(prochaine, LANGUE);
  $("zone").innerHTML = Fin.revu(TIRAGE_TEXTES.revu[LANGUE] || TIRAGE_TEXTES.revu.fr, quand ? (TIRAGE_TEXTES.prochaine[LANGUE] || TIRAGE_TEXTES.prochaine.fr).replace("{d}", quand) : "") + boutonsFin();
  brancherEncore();
  $("terminer").addEventListener("click", () => parler("fini", {bons: 0, faits: 0}));
}
// « Encore des questions » : en fin de partie et quand tout est revu, jamais dans la seance (elle a sa longueur)
// les deux boutons de la fin, fixes en bas de l'ecran (.bas)
const boutonEncore = () => Q.get("seance") === "1" ? "" : '<button type="button" id="encore">' + (TIRAGE_TEXTES.encore[LANGUE] || TIRAGE_TEXTES.encore.fr) + '</button>';
const boutonsFin = () => '<div class="bas">' + boutonEncore() + '<button type="button" id="terminer">' + T("terminer") + '</button></div>';
function brancherEncore(){ const b = $("encore"); if (b) b.addEventListener("click", encoreDesQuestions); }
async function encoreDesQuestions(){
  const mots = motsDuTheme();
  file = Tirage.supplement(mots, await Tirage.demander(mots), NB); rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(null);
  montrer();
}
async function demarrer(){
  const mots = motsDuTheme();
  const plan = Tirage.plan(mots, await Tirage.demander(mots), NB, NEUFS_MAX);
  file = plan.file; rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(plan.prochaine);
  montrer();
}
$("suite").addEventListener("click", () => { if (!file.length) return; rang++; if (rang >= file.length) fin(); else montrer(); });
$("retour").addEventListener("click", () => parler("fermer"));
$("retour").setAttribute("aria-label", T("retourAria"));
$("titre").textContent = T("titre");
document.title = T("titre");
fetch("journee/journee.json?v=1").then(r => r.json()).then(d => {
  D = d;
  ETAPES = Object.keys(d.jours).flatMap(j => d.jours[j].etapes.map(([verbe, sujet, h, m], rang) => ({cle: j + "-" + (rang + 1), jour: j, rang, verbe, sujet, h, m})));
  if (APPRENDRE === "en"){
    // Boston : sans les images ecartees (la cle garde le nom de l'image, le rang se recompte dans la journee) ; un
    // geste sans phrase anglaise sort aussi des leurres
    ETAPES = ETAPES.filter(e => !ECARTEES_EN.includes(e.cle) && VERBES_EN[e.verbe]);
    const rangs = {}; ETAPES.forEach(e => { e.rang = rangs[e.jour] = (e.jour in rangs) ? rangs[e.jour] + 1 : 0; });
    Object.keys(D.verbes).forEach(vb => { if (!VERBES_EN[vb]) delete D.verbes[vb]; });
    Object.keys(D.jours).forEach(j => { D.jours[j].titre.en = TITRES_EN[j]; });
    // la frequence et ses phrases anglaises (FREQ_EN), au lieu de celles de l'espagnol et de l'allemand
    Object.keys(D.adverbes).forEach(c => { D.adverbes[c].en = ({siempre: "always", "a veces": "sometimes", nunca: "never"})[c]; });
    D.frequences = FREQ_EN.map(x => Object.assign({}, x, {en: (x.be ? [x.S, x.v, "{A}", x.r] : [x.S, "{A}", x.v, x.r]).filter(Boolean).join(" ") + "."}));
  }
  if (Q.get("seance") === "1") demarrer(); else decouvrir();
});
</script>
