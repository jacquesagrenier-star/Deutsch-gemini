<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emociones y carácter</title>
<!--
  LES EMOTIONS ET LE CARACTERE (theme illustre, 3 nov. 2026). Troisieme theme illustre apres « Decrire une personne »
  et la famille ; Jacques : « une session pour les emotions, le test, la colere, puis etc. », accord du 3 nov. :
  « Oui, les trois » (48 images, 9 mots au corpus, leurs voix). La suite de Descripcion fisica, son cours d'espagnol.
  UNE EMOTION SE LIT SUR UN VISAGE : six personnes deja faites (Anna, Carmen, Gisela, Mark, Diego, Ben), 36
  portraits, chaque emotion sur trois visages. UN TRAIT DE CARACTERE DEMANDE UNE SITUATION : douze petites
  scenes, en paires de contraires. Images et mots : visuel/emociones/emociones.py -> emociones/emociones.json.
  L'axe : ser / estar en espagnol (esta triste, es timido, tiene miedo) ; en allemand tout se dit avec sein, sauf
  la peur (hat Angst), d'ou « ist oder hat? » et « Gefuehl oder Charakter? ».
  Ouverte par l'app dans le cadre des scenes (sceneCadre), elle parle comme une scene : « exercice » et « bonne »
  a chaque reponse (objectif du jour, carreaux), « fini » et « fermer » a la fin.
  Parametres : apprendre=es|de, lang=<interface>, nuit=1, seance=1 (six questions, pas de decouverte),
  variante=latam (enojado, la voix de Monica), r=<AUDIO_REVISION> (la voix de la decouverte).
  A chaque reponse, « reponse » {mot, genre, cat, juste} : le mot teste avance dans la progression commune aux cartes.
  Le tirage suit les mots (themes/tirage.js, commun aux themes) : les dus, les rates, puis les nouveaux.
  Les phrases sont FABRIQUEES depuis emociones.json : une image ne dit que ce qu'elle montre.
  L'ANGLAIS (4 nov. 2026, apprendre=en, variante=gb ; « il manque beaucoup de themes en anglais ») : les memes images,
  des phrases ecrites pour l'anglais -- be + adjectif partout (she is afraid, jamais « she has fear » ; has a cold, la
  seule tournure avec have), feel + adjectif (jamais un adverbe), -ed / -ing (bored / boring), et le caractere
  (« What is she like? » -- She is shy.) face a l'emotion du moment (« How is she feeling? » -- She is nervous today.).
  Le britannique : ill, untidy, film, flat, shop (tables EN_* ci-dessous).
-->
<style>
:root{--fond1:#82AFDB;--fond3:#C0D6EA;--encre:#1C2430;--gris:#4C566B;--ambre:#E8A23A;--ambre-f:#A86A0E;--vert:#2F9E6A;--rouge:#C8473A;
  --verre:rgba(255,255,255,.88);--bord:rgba(255,255,255,.95);--carte:#F7F8FA;--police:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html.nuit{--fond1:#0E1C26;--fond3:#18303F;--encre:#EEF2F5;--gris:#A9B8C4;--ambre-f:#E8A23A;--vert:#5CC98F;--rouge:#F07F72;
  --verre:rgba(20,36,50,.88);--bord:rgba(255,255,255,.14);--carte:#22384A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
/* LA PAGE A LA HAUTEUR DE L'ECRAN, COMME UNE SCENE (3 nov. 2026, Jacques sur iPhone : « Commencer » « pas
   completement en bas »). Le document d'une scene ne depasse jamais son cadre ; celui d'un theme defilait (Decrire :
   2 500 px), et sur iPhone un bouton fixe dans un cadre dont le document deborde ne tombe pas au bas de l'ecran.
   Le contenu defile donc DANS le body, et le document garde la hauteur du cadre. */
html{height:100%;overflow:hidden}
body{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;box-sizing:border-box}
body{background:linear-gradient(180deg,var(--fond1),var(--fond3));background-attachment:fixed;color:var(--encre);font-family:var(--police);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 90px) max(10px,env(safe-area-inset-left,0px))}
.haut{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto 10px}
.retour{width:42px;height:42px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);color:var(--encre);font:800 22px var(--police);cursor:pointer;flex:0 0 auto}
html[dir="rtl"] .retour{transform:scaleX(-1)}
.titre{flex:1;font-weight:900;font-size:18px}
.compte{font-weight:800;font-size:14px;color:var(--gris)}
.barre{max-width:560px;margin:0 auto 12px;height:6px;border-radius:3px;background:rgba(28,36,48,.12);overflow:hidden}
.barre i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2BB5AA,#14807A);transition:width .3s}
main{max-width:560px;margin:0 auto;background:var(--verre);border:1px solid var(--bord);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}
.consigne{font-size:14px;font-weight:700;color:var(--gris);margin:0}
.enonce{direction:ltr;text-align:left;background:var(--carte);border-radius:14px;padding:12px 14px;font-weight:800;line-height:1.5;font-size:17px}
.enonce.centre{text-align:center;font-size:19px}
.trou{display:inline-block;min-width:64px;border-bottom:2px solid var(--ambre);text-align:center;color:var(--ambre-f)}
/* une image : le portrait carre ou la situation en 4:3, jamais plus haute que l'ecran ne le permet */
.photo{display:block;width:100%;max-width:340px;margin:0 auto;height:auto;border-radius:16px;background:var(--carte)}
.photo.scene{max-width:none;aspect-ratio:4/3;object-fit:cover}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duo figure{margin:0;text-align:center;font-weight:800;color:var(--gris);font-size:13px}
.duo img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block;margin-bottom:4px;background:var(--carte)}
/* quatre visages a toucher */
.visages{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.visages button{border:3px solid transparent;border-radius:16px;background:var(--carte);padding:0;cursor:pointer;overflow:hidden;display:block}
.visages img{display:block;width:100%;height:auto;aspect-ratio:1}
.visages .nom{display:block;font-size:13px;font-weight:800;color:var(--gris);padding:3px 0 5px}
.visages button.juste{border-color:var(--vert)} .visages button.faux{border-color:var(--rouge)}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix.centre{justify-content:center}
.choix button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:9px 15px;font:800 15px var(--police);cursor:pointer}
.choix button.juste{background:var(--vert);border-color:var(--vert);color:#fff}
.choix button.faux{background:var(--rouge);border-color:var(--rouge);color:#fff}
button:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
button:disabled{cursor:default}
.retourMsg{min-height:1.4em;font-weight:800;font-size:15px;margin:0;line-height:1.45}
.retourMsg.ok{color:var(--vert)} .retourMsg.ko{color:var(--rouge)}
.retourMsg .phrase{display:block;color:var(--encre);font-weight:700}
/* la decouverte : deux onglets, une planche de vignettes, la fiche de celle qu'on touche */
.onglets{display:flex;gap:6px;background:var(--carte);border-radius:999px;padding:4px}
.onglets button{flex:1;border:0;border-radius:999px;background:none;color:var(--gris);font:800 15px var(--police);padding:8px 6px;cursor:pointer}
.onglets button[aria-selected="true"]{background:var(--ambre);color:#1C2430}
.planche{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.planche.scenes{grid-template-columns:repeat(3,1fr)}
.planche button{border:3px solid transparent;border-radius:12px;padding:0;background:var(--carte);cursor:pointer;overflow:hidden;display:block}
.planche img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover}
.planche.scenes img{aspect-ratio:4/3}
.planche button.choisi{border-color:var(--ambre)}
.fiche{background:var(--carte);border-radius:14px;padding:10px;display:grid;grid-template-columns:minmax(110px,44%) 1fr;gap:12px;align-items:center}
.fiche img{width:100%;height:auto;border-radius:10px;display:block}
.fiche .mot{font-weight:900;font-size:24px;color:var(--ambre-f);line-height:1.15}
.fiche .dit{font-weight:800;font-size:17px;line-height:1.4;margin-top:6px}
.fiche .ecoute{margin-top:10px;width:44px;height:44px;border-radius:50%;border:2px solid var(--ambre);background:var(--verre);color:var(--encre);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fiche .ecoute svg{width:22px;height:22px}
.regle{margin:0;font-size:14px;font-weight:700;line-height:1.45;color:var(--gris);background:var(--carte);border-radius:12px;padding:10px 12px}
.suite{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:54px;border:0;border-radius:27px;
  color:#fff;font:800 17px var(--police);background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer}
.suite[hidden]{display:none}
/* « Suivant », « Commencer » tout en bas ET au-dessus de tout (Jacques, 3 nov. 2026, la regle des scenes) : sans
   z-index, une image ou une loupe (z-index 2) qui defile passait devant le bouton fixe */
.suite{z-index:5000}
/* les boutons de la fin (« Encore des questions », « Terminer ») : fixes en bas, cote a cote, comme familia.html */
.bas{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:5000}
.bas button{flex:1 1 0;min-width:0;height:54px;border:0;border-radius:27px;padding:0 12px;color:#fff;font:800 16px/1.15 var(--police);
  background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer}
.fin{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:10px 0}
.fin .score{font-size:22px;font-weight:900}
.fin button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:10px 18px;font:800 16px var(--police);cursor:pointer}
[lang]{unicode-bidi:isolate}
/* la traduction dans la langue d'interface : une ligne, plus petite, en gris (3 nov. 2026) */
.trad{display:block;font-size:13px;font-weight:600;color:var(--gris);line-height:1.35;margin-top:2px}
/* le mot choisi, quand il est faux (l'anglais) : sa traduction, en rouge */
.trad.faux{color:var(--rouge);font-style:italic}
</style>
</head>

<script>
const Q = new URLSearchParams(location.search);
// l'anglais (4 nov. 2026) : les memes images, ses phrases a lui ; variante=gb, le britannique (ill, untidy, film)
const APPRENDRE = ["de", "en"].includes(Q.get("apprendre")) ? Q.get("apprendre") : "es";
const GB = APPRENDRE === "en" && Q.get("variante") === "gb";
const LATAM = APPRENDRE === "es" && Q.get("variante") === "latam";
const LANGUE = (l => ["fr", "en", "tr", "uk", "fa", "ar", "pt", "pl", "ru", "de"].includes(l) ? l : "fr")(((Q.get("lang") || "fr").toLowerCase().split(/[-_]/)[0]));
if (Q.get("nuit") === "1") document.documentElement.classList.add("nuit");
document.documentElement.lang = LANGUE;
document.documentElement.dir = (LANGUE === "fa" || LANGUE === "ar") ? "rtl" : "ltr";
// vingt questions seul (Jacques, 3 nov.), six dans la seance du jour, sans la decouverte
const NB = Q.get("seance") === "1" ? Math.max(2, Math.min(12, parseInt(Q.get("nb"), 10) || 6)) : 20;   // nb : le reglage « Questions par scene et par theme » de la seance du jour (5 · 8 · 12, 7 nov. 2026)
// agrandir (themes/zoom.js) : un toucher sur un portrait, une scene ou une fiche, la loupe sur les visages a choisir
Zoom.init({direct: "img.photo, .duo img, .fiche img", loupe: ".visages button", langue: LANGUE});

const TEXTES = {
  titre:     {fr:"Émotions et caractère", en:"Feelings and personality", tr:"Duygular ve karakter", uk:"Емоції та характер", fa:"احساسات و منش", ar:"المشاعر والطباع", pt:"Emoções e personalidade", pl:"Emocje i charakter", ru:"Эмоции и характер", de:"Gefühle und Charakter"},

  introCar:  {fr:"Touche une image : tu vois comment est la personne, et tu l'entends.", en:"Tap a picture to see and hear what the person is like.", tr:"Bir resme dokun: kişinin nasıl biri olduğunu gör ve dinle.", uk:"Торкнися зображення: побачиш і почуєш, яка це людина.", fa:"روی یک تصویر بزن تا ببینی و بشنوی آن شخص چه منشی دارد.", ar:"المس صورة لترى وتسمع كيف هو طبع الشخص.", pt:"Toque em uma imagem para ver e ouvir como a pessoa é.", pl:"Dotknij obrazka, aby zobaczyć i usłyszeć, jaka jest ta osoba.", ru:"Нажми на картинку, чтобы увидеть и услышать, какой это человек.", de:"Tippe auf ein Bild: Du siehst und hörst, wie die Person ist."},

  ecouter:   {fr:"Écouter", en:"Listen", tr:"Dinle", uk:"Слухати", fa:"گوش بده", ar:"استمع", pt:"Ouvir", pl:"Posłuchaj", ru:"Слушать", de:"Anhören"},
  commencer: {fr:"Commencer", en:"Start", tr:"Başla", uk:"Почати", fa:"شروع", ar:"ابدأ", pt:"Começar", pl:"Zacznij", ru:"Начать", de:"Starten"},
  commentEst:{fr:"Regarde le visage : comment se sent cette personne ?", en:"Look at the face: how does this person feel?", tr:"Yüze bak: bu kişi nasıl hissediyor?", uk:"Подивися на обличчя: як почувається ця людина?", fa:"به چهره نگاه کن: این شخص چه حسی دارد؟", ar:"انظر إلى الوجه: بماذا يشعر هذا الشخص؟", pt:"Olhe o rosto: como esta pessoa se sente?", pl:"Spójrz na twarz: jak czuje się ta osoba?", ru:"Посмотри на лицо: что чувствует этот человек?", de:"Sieh dir das Gesicht an: Wie fühlt sich diese Person?"},
  quien:     {fr:"Lis la question et touche le bon visage.", en:"Read the question and tap the right face.", tr:"Soruyu oku ve doğru yüze dokun.", uk:"Прочитай запитання й торкнися потрібного обличчя.", fa:"سؤال را بخوان و روی چهرهٔ درست بزن.", ar:"اقرأ السؤال والمس الوجه الصحيح.", pt:"Leia a pergunta e toque no rosto certo.", pl:"Przeczytaj pytanie i dotknij właściwej twarzy.", ru:"Прочитай вопрос и нажми на нужное лицо.", de:"Lies die Frage und tippe auf das richtige Gesicht."},
  serEstar:  {fr:"Choisis le bon verbe : es, está ou tiene ?", en:"Choose the right verb: es, está or tiene?", tr:"Doğru fiili seç: es, está mı tiene mi?", uk:"Обери правильне дієслово: es, está чи tiene?", fa:"فعل درست را انتخاب کن: es، está یا tiene؟", ar:"اختر الفعل الصحيح: es أم está أم tiene؟", pt:"Escolha o verbo certo: es, está ou tiene?", pl:"Wybierz właściwy czasownik: es, está czy tiene?", ru:"Выбери правильный глагол: es, está или tiene?", de:"Wähle das richtige Verb: es, está oder tiene?"},
  istHat:    {fr:"Choisis le bon verbe : ist ou hat ?", en:"Choose the right verb: ist or hat?", tr:"Doğru fiili seç: ist mi hat mı?", uk:"Обери правильне дієслово: ist чи hat?", fa:"فعل درست را انتخاب کن: ist یا hat؟", ar:"اختر الفعل الصحيح: ist أم hat؟", pt:"Escolha o verbo certo: ist ou hat?", pl:"Wybierz właściwy czasownik: ist czy hat?", ru:"Выбери правильный глагол: ist или hat?", de:"Wähle das richtige Verb: ist oder hat?"},

                 .concat(TRAITS().filter(t => (!w || t === w.t) && D.caracteres[t].es[0] !== D.caracteres[t].es[1]).map(t => ["t", null, t]));   // pas feliz, inteligente, pobre...
    if (!cand.length) return false;
    const [k, , x] = hasard(cand), p = k === "t" ? unePersonne(x) : unPortrait(x)[0], m = k === "e" ? D.emotions[x] : D.caracteres[x], formes = (LATAM && m.latam) || m.es;
    const rep = formes[fem(p) ? 1 : 0], verbe = k === "e" ? "está" : "es"; motQ = w || (k === "e" ? motE(x) : motT(x)); sensQ = k === "e" ? {p, e: x} : {p, t: x};
    ecran("accord", k === "e" ? portrait(p, x) : scene(x, p), avecTrou(nom(p) + " " + verbe + " ___."));
    boutons($("choix"), melanger([formes[0], formes[1]]), rep, ok => { $("trou").textContent = rep; juger(ok, rep, nom(p) + " " + verbe + " " + rep + "."); });
    return true;
  },
  // « ¿Cómo es Sergio? » / « Wie ist Sergio? » : une scene, quatre traits
  commentEs(w){
    if (w && !w.t) return false;
    // l'anglais : « What is Sergio like? » -- « He is stingy. »
    if (APPRENDRE === "en"){
      const t = w ? w.t : hasard(TRAITS()), p = unePersonne(t), P = EN.pron(p), rep = P + " " + predT(p, t) + "."; motQ = w || motT(t); sensQ = {p, t};
      tradsOpts[rep] = TR ? frOpt(p, TR.t[t]) : null;
      const leurres = leurresT(t, 3).map(x => { const o = P + " " + predT(p, x) + "."; tradsOpts[o] = TR ? frOpt(p, TR.t[x]) : null; return o; });
      ecran("commentCar", scene(t, p), EN.commentEs(p), true);
      boutons($("choix"), melanger([rep, ...leurres]), rep, ok => juger(ok, rep, phraseT(p, t)));
      return true;
    }
    const t = w ? w.t : hasard(TRAITS()), p = unePersonne(t), rep = predT(p, t); motQ = w || motT(t); sensQ = {p, t};
    ecran("commentCar", scene(t, p), L.commentEs(p), true);
    boutons($("choix"), melanger([rep, ...leurresT(t, 3).map(x => predT(p, x))]), rep, ok => juger(ok, rep, phraseT(p, t)));
    return true;
  },
  // « Sergio es tacaño. Marta, al contrario, es ___. » : la paire d'images ; le mot vise est celui de la reponse
  contraire(w){
    if (w && !(w.t && D.caracteres[w.t].contraire)) return false;
    const c = w ? w.t : hasard(TRAITS().filter(x => D.caracteres[x].contraire)), t = D.caracteres[c].contraire, a = unePersonne(t), b = unePersonne(c);   // b en dernier : la rotation retient le mot vise
    const forme = (x, p) => APPRENDRE === "de" ? D.caracteres[x].de : APPRENDRE === "en" ? EN_T[x] : ES.forme(D.caracteres[x], p);
    const rep = forme(c, b); motQ = w || motT(c); sensQ = {a, t, b, c};
    const leurres = melanger(TRAITS().filter(x => x !== c && x !== t && loin(x, c, VOISINS_T))).slice(0, 3).map(x => forme(x, b));
    const duo = '<div class="duo"><figure><img alt="" src="' + imgT(t, a) + '">' + nom(a) + '</figure><figure><img alt="" src="' + imgT(c, b) + '">' + nom(b) + '</figure></div>';
    const phrase = L.contraire(a, D.caracteres[t], b);
    ecran("contraire", duo, avecTrou(phrase));
    boutons($("choix"), melanger([rep, ...leurres]), rep, ok => { $("trou").textContent = rep; juger(ok, rep, phrase.replace("___", rep)); });
    return true;
  },
  // « Diego está contento. » vrai ou faux -- le faux n'est jamais une emotion voisine (sinon il serait discutable)
  vraifaux(w){
    if (w && !w.e && !w.h) return false;
    const [p, e] = unPortrait(w && (w.e || w.h)), vrai = Math.random() < 0.5; motQ = w || motE(e); sensQ = {p, e, h: !!(w && w.h)};
    const juste = w && w.h ? (APPRENDRE === "en" ? nom(p) + " " + predH(e) + "." : nom(p) + " hat " + D.haben[e] + ".") : phraseE(p, e);
    const phrase = vrai ? juste : phraseE(p, hasard(EMOS().filter(x => loin(x, e, VOISINS))));
    ecran("vraifaux", portrait(p, e), phrase, true);
    const rep = vrai ? L.vrai : L.faux;
    boutons($("choix"), [L.vrai, L.faux], rep, ok => juger(ok, rep, juste));
    return true;
  },
  // « Ben ist müde. » : ein Gefühl (jetzt) oder der Charakter (immer) ? -- la question que l'espagnol pose par ser / estar
  gefuehl(w){
    if (w && w.h) return false;
    const emotion = w ? !!w.e : Math.random() < 0.5;
    let image, phrase;
    if (emotion){ const [p, e] = unPortrait(w && w.e); motQ = w || motE(e); sensQ = {p, e}; image = portrait(p, e); phrase = phraseE(p, e); }
    else { const t = w ? w.t : hasard(TRAITS()), p = unePersonne(t); motQ = w || motT(t); sensQ = {p, t}; image = scene(t, p); phrase = phraseT(p, t); }
    ecran("gefuehl", image, phrase, true);
    const rep = emotion ? DE.gefuehl : DE.charakter;
    boutons($("choix"), [DE.gefuehl, DE.charakter], rep, ok => juger(ok, rep, phrase));
    return true;
  },
  // L'ANGLAIS SEULEMENT : « Carmen ___ afraid. » is / has -- tout se dit avec be (la peur aussi, le piege du francais
  // « elle a peur »), sauf « has a cold » ; et « Diego ___ in a bad mood. »
  beHave(w){
    if (APPRENDRE !== "en" || (w && w.ing)) return false;
    let image, phrase, rep;
    const r = Math.random();
    if (w ? !!w.h : r < 0.35){
      const e = w ? w.h : hasard(Object.keys(EN_H)), p = unPortrait(e)[0]; motQ = w || motE(e, true); sensQ = {p, e, h: true};
      image = portrait(p, e); rep = EN_H[e].v; phrase = nom(p) + " ___ " + EN_H[e].x + ".";
    } else if (w ? !!w.t : r < 0.6){ const t = w ? w.t : hasard(TRAITS()), p = unePersonne(t); motQ = w || motT(t); sensQ = {p, t}; image = scene(t, p); rep = "is"; phrase = nom(p) + " ___ " + EN_T[t] + "."; }
    else { const [p, e] = unPortrait(w ? w.e : (r < 0.75 ? "miedo" : null)); motQ = w || motE(e); sensQ = {p, e}; image = portrait(p, e); rep = "is"; phrase = nom(p) + " ___ " + EN_E[e] + "."; }
    ecran("beHave", image, avecTrou(phrase));
    boutons($("choix"), ["is", "has"], rep, ok => { $("trou").textContent = rep; juger(ok, rep, phrase.replace("___", rep)); });
    return true;
  },
  // L'ANGLAIS SEULEMENT : feel + adjectif (« Carmen feels sad. »), jamais l'adverbe (sadly), qui sert de piege
  feel(w){
    if (APPRENDRE !== "en" || (w && !w.e)) return false;
    const [p, e] = unPortrait(w && w.e), adj = EN_E[e], adv = EN_ADV[e]; motQ = w || motE(e); sensQ = {p, e};
    const leurres = melanger(EMOS().filter(x => loin(x, e, VOISINS))).slice(0, adv ? 2 : 3).map(x => EN_E[x]);
    const phrase = nom(p) + " feels ___.";
    if (FR_EN && TR){ const f = forme2(TR.e[e], p); tradQ = nom(p) + " " + (f.indexOf("est ") === 0 ? "se sent " + f.slice(4) : f) + "."; }
    ecran("feel", portrait(p, e), avecTrou(phrase));
    boutons($("choix"), melanger([adj].concat(adv ? [adv] : [], leurres)), adj, ok => { $("trou").textContent = adj; juger(ok, adj, phrase.replace("___", adj)); });
    return true;
  },
  // L'ANGLAIS SEULEMENT : -ed ou -ing ? « Ben is ___. He has nothing to do. » (bored), « The movie is ___. » (boring)
  edIng(w){
    if (APPRENDRE !== "en") return false;
    const q = questionEdIng(w); if (!q) return false;
    ecran("edIng", q.image, avecTrou(q.phrase));
    boutons($("choix"), melanger([q.d.ed, q.d.ing]), q.rep, ok => { $("trou").textContent = q.rep; juger(ok, q.rep, q.phrase.replace("___", q.rep)); });
    return true;
  },
  // L'ANGLAIS SEULEMENT : la meme phrase, juste ou avec l'autre forme (« The movie is bored. ») : correcte ou non ?
  edIngVf(w){
    if (APPRENDRE !== "en") return false;
    const q = questionEdIng(w); if (!q) return false;
    const vrai = Math.random() < 0.5, autre = q.rep === q.d.ed ? q.d.ing : q.d.ed;
    const juste = q.phrase.replace("___", q.rep), montree = vrai ? juste : q.phrase.replace("___", autre);
    ecran("edIngVf", q.image, montree, true);
    const rep = vrai ? EN.correct : EN.incorrect;
    boutons($("choix"), [EN.correct, EN.incorrect], rep, ok => juger(ok, rep, juste));
    return true;
  },
  // L'ANGLAIS SEULEMENT : la question qui va avec la reponse. L'humeur du moment : « How is Mark feeling? » -- « He is
  // worried today. » ; le caractere : « What is Elena like? » -- « She is shy. » Les pieges : « What does Elena like? »
  // (ce qu'elle aime) et « How is Elena like? » (le calque du francais « Comment est-elle ? »)
  question(w){
    if (APPRENDRE !== "en" || (w && !w.e && !w.t) || (w && SANS_QUESTION.includes(w.t))) return false;
    const emotion = w ? !!w.e : Math.random() < 0.5;
    let p, x, image, reponse, frRep = null;
    if (emotion){ [p, x] = unPortrait(w && w.e); motQ = w || motE(x); sensQ = {p, e: x}; image = portrait(p, x); reponse = EN.pron(p) + " " + pred(p, x) + " today.";
                  if (TR) frRep = frOpt(p, TR.e[x]).replace(/\.$/, " aujourd'hui."); }
    else { x = w ? w.t : hasard(TRAITS().filter(t => !SANS_QUESTION.includes(t))); p = unePersonne(x); motQ = w || motT(x); sensQ = {p, t: x}; image = scene(x, p);
           reponse = EN.pron(p) + " " + predT(p, x) + "."; if (TR) frRep = frOpt(p, TR.t[x]); }
    const n = nom(p), qE = "How is " + n + " feeling?", qT = "What is " + n + " like?", qX = "How is " + n + " like?", qL = "What does " + n + " like?";
    const rep = emotion ? qE : qT;
    tradsOpts[qE] = "Comment " + n + " se sent-" + (fem(p) ? "elle" : "il") + " ?";
    tradsOpts[qT] = "Comment est " + n + " ? (son caractère)";
    tradsOpts[qX] = "une phrase fautive : on dit What is " + n + " like?";
    tradsOpts[qL] = "Qu'est-ce qu" + (/^[AEIOUÉ]/.test(n) ? "'" : "e ") + n + " aime ?";
    if (FR_EN && frRep) tradQ = tradsOpts[rep] + " — " + frRep;
    ecran("question", image, avecTrou("– ___<br>– " + reponse));
    boutons($("choix"), melanger([qE, qT, qX, qL]), rep, ok => { $("trou").textContent = rep; juger(ok, rep, rep + " " + reponse); });
    return true;
  }
};
// l'anglais : la phrase a trou des -ed / -ing, sur une personne (son visage, le mot en -ed) ou une chose (sans image,
// le mot en -ing) ; null si le mot vise n'en a pas
const SANS_QUESTION = ["rico", "pobre"];          // riche, pauvre : une situation, pas un caractere (« What is he like? »)
function questionEdIng(w){
  if (w && !(w.ing || (w.e && EN_EDING[w.e]))) return null;
  const choses = w ? !!w.ing : Math.random() < 0.4;
  const e = w ? (w.ing || w.e) : hasard(Object.keys(EN_EDING)), d = EN_EDING[e];
  if (choses){ const [phrase, fr] = hasard(d.choses); motQ = w || motIng(e); sensQ = null; tradQ = FR_EN ? fr : null; return {d, image: "", phrase, rep: d.ing}; }
  const [p] = unPortrait(e); motQ = w || motE(e); sensQ = {p, e};
  tradQ = FR_EN && TR ? nom(p) + " " + forme2(TR.e[e], p) + EN.gens(d.gens[1], p) : null;
  return {d, image: portrait(p, e), phrase: EN.gens(d.gens[0], p), rep: d.ed};
}
// les sortes de la langue apprise : ser / estar et l'accord en espagnol ; ist / hat et Gefuehl / Charakter en allemand ;
// en anglais, is / has, feel, -ed / -ing et la question (How is she feeling? / What is she like?)
const SEULES_EN = ["beHave", "feel", "edIng", "edIngVf", "question"];
const SORTES = Object.keys(EX).filter(x => APPRENDRE === "es" ? !["istHat", "gefuehl"].concat(SEULES_EN).includes(x)
                                          : APPRENDRE === "de" ? !["serEstar", "accord"].concat(SEULES_EN).includes(x) : !["serEstar", "accord", "istHat", "gefuehl"].includes(x));

// ---------- la decouverte : deux planches a toucher, le mot se voit et s'entend ----------
function decouvrir(){
  $("compte").textContent = ""; $("barre").style.width = "0%";
  const z = $("zone"), dec = D.decouverte, phrases = phrasesDecouverte();
  z.innerHTML = '<div class="onglets" role="tablist"><button type="button" role="tab" id="oE">' + T("ongletEmo") + '</button><button type="button" role="tab" id="oC">' + T("ongletCar") + '</button></div>'
              + '<p class="consigne" id="intro"></p><div class="planche" id="planche"></div><div class="fiche" id="fiche"></div>'
              + '<p class="regle">' + isoler(T(APPRENDRE === "de" ? "regleDe" : APPRENDRE === "en" ? "regleEn" : "regleEs")) + '</p>'
              // l'anglais : -ed / -ing et feel, puis l'americain et le britannique
              + (APPRENDRE === "en" ? '<p class="regle">' + T("bonEdIng", {film: MOVIE}) + '</p><p class="regle">' + T(GB ? "bonGb" : "bonUs") + '</p>' : "");
  const montrer = (cle, emotion) => {
    const p = emotion ? dec.visages[cle] : dec.caracteres[cle], m = emotion ? D.emotions[cle] : D.caracteres[cle];
    const motVu = APPRENDRE === "en" ? (emotion ? EN_E[cle] : EN_T[cle])
                : APPRENDRE === "de" ? (emotion ? pred(p, cle) : "ist " + m.de).replace(/^ist /, "") : (emotion ? pred(p, cle) : predT(p, cle)).replace(/^(está|es) /, "");
    const ph = phrases[cle];
    $("planche").querySelectorAll("button").forEach(b => b.classList.toggle("choisi", b.dataset.cle === cle));
    $("fiche").innerHTML = '<img alt="" src="' + (emotion ? imgP(p, cle) : imgT(cle, p)) + '"><div><div class="mot">' + cible(motVu) + '</div><div class="dit">' + cible(ph.texte) + '</div>'
                         + ((t => t ? traduction(t) : "")(traduire(emotion ? {p, e: cle} : {p, t: cle}) || (TR ? null : glose(emotion ? motE(cle) : motT(cle)))))
                         + '<button type="button" class="ecoute" id="ecoute" aria-label="' + T("ecouter") + '">' + HP + '</button></div>';
    $("ecoute").addEventListener("click", () => dire(ph.texte));
    dire(ph.texte);
  };
  const onglet = emotion => {
    $("oE").setAttribute("aria-selected", emotion); $("oC").setAttribute("aria-selected", !emotion);
    $("intro").textContent = T(emotion ? "introEmo" : "introCar");
    const pl = $("planche"); pl.className = "planche" + (emotion ? "" : " scenes"); pl.innerHTML = "";
    (emotion ? EMOS() : TRAITS()).forEach(cle => {
      const b = document.createElement("button"); b.type = "button"; b.dataset.cle = cle;
      const p = emotion ? dec.visages[cle] : dec.caracteres[cle];
      b.setAttribute("aria-label", nom(p));
      b.innerHTML = '<img alt="" src="' + (emotion ? imgP(p, cle) : imgT(cle, p)) + '">';
      b.addEventListener("click", () => montrer(cle, emotion));
      pl.appendChild(b);
    });
    // la fiche s'ouvre sur la premiere, sans parler : le son ne vient que d'un geste
    const premiere = emotion ? EMOS()[0] : TRAITS()[0];
    const garde = dire; dire = () => {}; montrer(premiere, emotion); dire = garde;
  };
  $("oE").addEventListener("click", () => onglet(true));
  $("oC").addEventListener("click", () => onglet(false));
  onglet(true);
  const s = $("suite"); s.textContent = T("commencer"); s.hidden = false;
  s.onclick = () => { s.onclick = null; try { Voix.arreter(); } catch(e){} demarrer(); };
}

// LA PARTIE (3 nov. 2026, « le tirage suit les mots ») : la file des MOTS vient de l'app (Tirage.plan : les dus,
// les rates recents, puis au plus NEUFS_MAX nouveaux) ; chaque mot recoit une question d'une sorte qui le vise,
// jamais la meme sorte deux fois de suite, jamais deux fois la meme question. Rate, il revient plus loin.
// Recopie de familia.html (visuel/THEMES-ILLUSTRES.md : ces fonctions sont identiques d'un theme a l'autre).
const NEUFS_MAX = Q.get("seance") === "1" ? 3 : 10;
let vus = new Set(), sorteCourante = null, derniereSorte = null;
function cleQuestion(){
  const z = $("zone"), en = z.querySelector(".enonce");
  return sorteCourante + "|" + (en ? en.textContent : "") + "|" + Array.from(z.querySelectorAll("img")).map(i => i.getAttribute("src")).sort().join(",");
}
function montrer(){
  repondu = false; $("suite").hidden = true; choixFaux = null;
  $("compte").textContent = (rang + 1) + " / " + file.length;
  $("barre").style.width = (rang / file.length * 100) + "%";
  // une question pour le mot du rang : d'une AUTRE sorte que la precedente et jamais deja vue dans la partie.
  // Si ce mot ne le permet pas, un mot plus loin dans la file passe devant ;
  // en dernier recours seulement, la meme sorte, puis une question deja vue.
  const essai = (w, strict) => {
    const autres = melanger(SORTES.filter(x => x !== derniereSorte));
    for (const so of autres){
      for (let n = 0; n < 25; n++){
        motQ = null; vuQ = null; sensQ = null; tradQ = null; tradsOpts = {}; sorteCourante = so;
        if (!EX[so](w)) break;
        if (!vus.has(cleQuestion())) return so;
      }
    }
    if (strict) return null;
    if (derniereSorte) for (let n = 0; n < 25; n++){           // la meme sorte, avec une question fraiche
      motQ = null; vuQ = null; sensQ = null; tradQ = null; tradsOpts = {}; sorteCourante = derniereSorte;
      if (!EX[derniereSorte](w)) break;
      if (!vus.has(cleQuestion())) return derniereSorte;
    }
    for (const so of autres.concat(derniereSorte ? [derniereSorte] : [])){   // tout est deja vu : n'importe laquelle
      motQ = null; vuQ = null; sensQ = null; tradQ = null; tradsOpts = {}; sorteCourante = so;
      if (EX[so](w)) return so;
    }
    return null;
  };
  let fait = essai(file[rang], true);
  for (let j = rang + 1; !fait && j < file.length; j++){
    fait = essai(file[j], true);
    if (fait) [file[rang], file[j]] = [file[j], file[rang]];
  }
  if (!fait) fait = essai(file[rang], false);
  vus.add(cleQuestion()); derniereSorte = fait; retenir();
  window.scrollTo(0, 0); document.body.scrollTop = 0;
}
function fin(){
  $("barre").style.width = "100%"; $("compte").textContent = file.length + " / " + file.length; $("suite").hidden = true;
  $("zone").innerHTML = Fin.bilan(LANGUE, bons, file.length, T("score", {b: bons, n: file.length}))
    + '<div class="bas">' + boutonEncore() + '<button type="button" id="terminer">' + T("terminer") + '</button></div>';
  brancherEncore();
  $("terminer").addEventListener("click", () => parler("fini", {bons, faits: file.length}));
}
// plus rien de du ni de nouveau : la partie le dit, et ne repose pas des mots deja sus
function toutRevu(prochaine){
  $("barre").style.width = "100%"; $("compte").textContent = ""; $("suite").hidden = true;
  const quand = Tirage.revu(prochaine, LANGUE);
  $("zone").innerHTML = Fin.revu(TIRAGE_TEXTES.revu[LANGUE] || TIRAGE_TEXTES.revu.fr, quand ? (TIRAGE_TEXTES.prochaine[LANGUE] || TIRAGE_TEXTES.prochaine.fr).replace("{d}", quand) : "") + '<div class="bas">' + boutonEncore() + '<button type="button" id="terminer">' + T("terminer") + '</button></div>';
  brancherEncore();
  $("terminer").addEventListener("click", () => parler("fini", {bons: 0, faits: 0}));
}
// « Encore des questions » : en fin de partie et quand tout est revu, jamais dans la seance (elle a sa longueur)
const boutonEncore = () => Q.get("seance") === "1" ? "" : '<button type="button" id="encore">' + (TIRAGE_TEXTES.encore[LANGUE] || TIRAGE_TEXTES.encore.fr) + '</button>';
function brancherEncore(){ const b = $("encore"); if (b) b.addEventListener("click", encoreDesQuestions); }
async function encoreDesQuestions(){
  const mots = motsDuTheme();
  file = Tirage.supplement(mots, await Tirage.demander(mots), NB); rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(null);
  montrer();
}
async function demarrer(){
  const mots = motsDuTheme();
  const plan = Tirage.plan(mots, await Tirage.demander(mots), NB, NEUFS_MAX);
  file = plan.file; rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(plan.prochaine);
  montrer();
}
$("suite").addEventListener("click", () => { if (!file.length) return; rang++; if (rang >= file.length) fin(); else montrer(); });
$("retour").addEventListener("click", () => parler("fermer"));
$("retour").setAttribute("aria-label", T("retourAria"));
$("titre").textContent = T("titre");
document.title = T("titre");
fetch("emociones/emociones.json?v=1").then(r => r.json()).then(d => {
  D = d; PORTRAITS = Object.entries(d.portraits).flatMap(([p, es]) => es.map(e => [p, e]));
  // l'anglais : le mot de chaque emotion et de chaque trait, la ou les phrases le cherchent (m.en)
  if (APPRENDRE === "en"){ Object.keys(D.emotions).forEach(k => { D.emotions[k].en = EN_E[k]; }); Object.keys(D.caracteres).forEach(k => { D.caracteres[k].en = EN_T[k]; }); }
  if (Q.get("seance") === "1") demarrer(); else decouvrir();
});
