<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les démarches</title>
<!--
  LES DEMARCHES (theme illustre, vague 3, 4 nov. 2026). L'administration et la vie pratique, au coeur du DTZ : le
  Buergeramt, prendre rendez-vous, s'inscrire, le formulaire, les documents, la banque, l'assurance maladie, le medecin.
  En allemand, Mark Garnier a Berlin-Pankow (Gartenstrasse 12, comme les documents du DTZ) ; en espagnol, le Mark de
  « Mark en Madrid ». Les images n'ont AUCUN texte : le formulaire, l'avis, les heures d'ouverture et la confirmation
  de rendez-vous sont dessines ici, en HTML. Donnees : visuel/demarches/demarches.py -> demarches/demarches.json.
  L'axe : Wo? + datif (im Buergeramt, bei der Bank), les verbes separables (Mark fuellt das Formular aus), le Sie du
  guichet (Fuellen Sie bitte ... aus!) ; en espagnol, le usted (Rellene el formulario, por favor) et estar abierta.
  Ouverte par l'app dans le cadre des scenes (sceneCadre), elle parle comme une scene : « exercice » et « bonne » a
  chaque reponse, « reponse » {mot, genre, cat, juste} pour le mot teste, « fini » et « fermer » a la fin.
  Parametres : apprendre=es|de, lang=<interface>, nuit=1, seance=1 (six questions, pas de decouverte), variante=latam.
  Le tirage suit les mots (themes/tirage.js). Les phrases sont FABRIQUEES depuis demarches.json, jamais ecrites une a
  une ; un leurre n'est jamais une reponse possible (« aussi », « aussi_v », « faux » dans demarches.py).
-->
<style>
:root{--fond1:#82AFDB;--fond3:#C0D6EA;--encre:#1C2430;--gris:#4C566B;--ambre:#E8A23A;--ambre-f:#A86A0E;--vert:#2F9E6A;--rouge:#C8473A;
  --verre:rgba(255,255,255,.88);--bord:rgba(255,255,255,.95);--carte:#F7F8FA;--papier:#FFFDF7;--trait:#C9CFD8;--police:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html.nuit{--fond1:#0E1C26;--fond3:#18303F;--encre:#EEF2F5;--gris:#A9B8C4;--ambre-f:#E8A23A;--vert:#5CC98F;--rouge:#F07F72;
  --verre:rgba(20,36,50,.88);--bord:rgba(255,255,255,.14);--carte:#22384A;--papier:#1D2F3D;--trait:#40576A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
/* la page a la hauteur de l'ecran, comme une scene (visuel/THEMES-ILLUSTRES.md) : le contenu defile DANS le body */
html{height:100%;overflow:hidden}
body{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;box-sizing:border-box}
body{background:linear-gradient(180deg,var(--fond1),var(--fond3));background-attachment:fixed;color:var(--encre);font-family:var(--police);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 156px) max(10px,env(safe-area-inset-left,0px))}
.haut{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto 10px}
.retour{width:42px;height:42px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);color:var(--encre);font:800 22px var(--police);cursor:pointer;flex:0 0 auto}
html[dir="rtl"] .retour{transform:scaleX(-1)}
.titre{flex:1;font-weight:900;font-size:18px}
.compte{font-weight:800;font-size:14px;color:var(--gris)}
.barre{max-width:560px;margin:0 auto 12px;height:6px;border-radius:3px;background:rgba(28,36,48,.12);overflow:hidden}
.barre i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2BB5AA,#14807A);transition:width .3s}
main{max-width:560px;margin:0 auto;background:var(--verre);border:1px solid var(--bord);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}
.consigne{font-size:14px;font-weight:700;color:var(--gris);margin:0}
.enonce{direction:ltr;text-align:left;background:var(--carte);border-radius:14px;padding:12px 14px;font-weight:800;line-height:1.5;font-size:17px}
.enonce.centre{text-align:center;font-size:19px}
.trou{display:inline-block;min-width:64px;border-bottom:2px solid var(--ambre);text-align:center;color:var(--ambre-f)}
/* les images sont en 4:3 ; une image pas encore faite garde sa place (fond uni), la page marche sans elle */
.photo{display:block;width:100%;max-width:420px;margin:0 auto;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:16px;background:var(--carte)}
.rangee{display:grid;grid-template-columns:1fr 1fr;gap:8px;direction:ltr}
.rangee.trois{grid-template-columns:1fr 1fr 1fr}
.rangee button{border:3px solid transparent;border-radius:14px;background:var(--carte);padding:0;cursor:pointer;overflow:hidden;display:block}
.rangee img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.rangee button.juste{border-color:var(--vert)} .rangee button.faux{border-color:var(--rouge)}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix.centre{justify-content:center}
.choix.liste{flex-direction:column}
.choix button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:9px 15px;font:800 15px var(--police);cursor:pointer;text-align:center}
.choix.liste button{border-radius:14px;text-align:left}
.choix button.juste{background:var(--vert);border-color:var(--vert);color:#fff}
.choix button.faux{background:var(--rouge);border-color:var(--rouge);color:#fff}
button:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
button:disabled{cursor:default}
.ecoute{width:48px;height:48px;border-radius:50%;border:2px solid var(--ambre);background:var(--verre);color:var(--encre);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ecoute svg{width:24px;height:24px}
.ecoute.grand{width:64px;height:64px;margin:0 auto} .ecoute.grand svg{width:32px;height:32px}
.retourMsg{min-height:1.4em;font-weight:800;font-size:15px;margin:0;line-height:1.45}
.retourMsg.ok{color:var(--vert)} .retourMsg.ko{color:var(--rouge)}
.retourMsg .phrase{display:block;color:var(--encre);font-weight:700}
.trad{display:block;font-size:13px;font-weight:600;font-style:italic;color:var(--gris);line-height:1.35;margin-top:2px}
.trad.faux{color:var(--rouge);font-style:normal}
.retourMsg .mot{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--gris);font-weight:700}
.retourMsg .mot .ecoute{width:38px;height:38px} .retourMsg .mot .ecoute svg{width:19px;height:19px}
/* LES PAPIERS, dessines ici (aucun texte dans les images) : le formulaire, l'avis, les heures, la confirmation */
.papier{direction:ltr;text-align:left;background:var(--papier);border:1px solid var(--trait);border-radius:6px;padding:12px 12px 10px;box-shadow:0 6px 16px rgba(28,36,48,.12);
  font-size:14px;line-height:1.4;color:var(--encre);position:relative}
.papier .entete{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--gris);border-bottom:2px solid var(--encre);padding-bottom:5px;margin-bottom:8px}
.papier h3{margin:0 0 8px;font-size:17px;font-weight:900}
.papier .cases{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.papier .case{border:1px solid var(--trait);border-radius:4px;padding:3px 6px 4px;min-height:42px;background:rgba(255,255,255,.35)}
html.nuit .papier .case{background:rgba(255,255,255,.03)}
.papier .case.large{grid-column:1 / -1}
.papier .case .lab{display:block;font-size:10.5px;font-weight:800;color:var(--gris);text-transform:uppercase;letter-spacing:.02em}
.papier .case .val{display:block;font-size:15px;font-weight:700;font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;color:#1D4E9E}
html.nuit .papier .case .val{color:#9CC3FF}
.papier .case .val.signe{font-family:"Segoe Script","Brush Script MT","Snell Roundhand",cursive;font-size:19px}
.papier .case.cachee .lab{color:var(--ambre-f)}
.papier .case.vise{border:2px solid var(--ambre);background:rgba(232,162,58,.12)}
.papier ul{margin:4px 0 6px;padding-left:20px}
.papier li{margin:2px 0;font-weight:700}
.papier table{border-collapse:collapse;width:100%;font-size:14px}
.papier td{padding:3px 4px;border-bottom:1px dotted var(--trait)} .papier td:first-child{font-weight:800;width:42%}
.papier .note{font-size:12.5px;color:var(--gris);margin:6px 0 0;font-weight:700}
.papier .gros{font-size:16px;font-weight:900;margin:6px 0}
/* la decouverte */
.section{font-weight:900;font-size:15px;margin:4px 0 -4px}
.fiche{background:var(--carte);border-radius:14px;padding:10px;display:grid;grid-template-columns:minmax(120px,48%) 1fr;gap:12px;align-items:center}
.fiche img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;background:var(--verre)}
.fiche .mot{font-weight:900;font-size:21px;color:var(--ambre-f);line-height:1.15}
.fiche .sens{font-weight:700;font-size:14px;color:var(--gris);margin-top:2px}
.fiche .dit{font-weight:800;font-size:16px;line-height:1.4;margin-top:6px}
.fiche .ligne{display:flex;align-items:center;gap:10px;margin-top:8px}
.planche{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;direction:ltr}
.planche button{border:3px solid transparent;border-radius:10px;padding:0;background:var(--carte);cursor:pointer;overflow:hidden;display:block}
.planche img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.planche button.choisi{border-color:var(--ambre)}
.papier .case.touche{cursor:pointer}
.regle{margin:0;font-size:14px;font-weight:700;line-height:1.45;color:var(--gris);background:var(--carte);border-radius:12px;padding:10px 12px}
/* TOUS LES BOUTONS D'ACTION TOUT EN BAS DE L'ECRAN, comme dans les scenes (Jacques, 3 nov. 2026) */
.suite{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:54px;border:0;border-radius:27px;z-index:5000;
  color:#fff;font:800 17px var(--police);background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer}
.suite[hidden]{display:none}
.bas{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5000;display:flex;flex-direction:column;gap:8px}
.bas button{height:54px;border:0;border-radius:27px;font:800 17px var(--police);cursor:pointer;
  color:#fff;background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28)}
.bas button.second{background:var(--verre);color:var(--encre);border:2px solid var(--ambre);box-shadow:0 6px 16px rgba(28,36,48,.14)}
.fin{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:10px 0}
.fin .score{font-size:22px;font-weight:900}
[lang]{unicode-bidi:isolate}
</style>
</head>
<body>
<div class="haut"><button class="retour" id="retour" type="button">‹</button><div class="titre" id="titre"></div><div class="compte" id="compte" dir="ltr"></div></div>
<div class="barre"><i id="barre"></i></div>
<main id="zone"></main>
<button class="suite" id="suite" type="button" hidden></button>
<script src="themes/tirage.js?v=1"></script>
<script src="themes/zoom.js?v=4"></script>
<script src="themes/verre.js?v=1"></script>
<script src="themes/voix.js?v=2"></script>
<script>
const Q = new URLSearchParams(location.search);
const APPRENDRE = Q.get("apprendre") === "de" ? "de" : "es";
const LANGUE = (l => ["fr", "en", "tr", "uk", "fa", "ar", "pt", "pl", "ru", "de"].includes(l) ? l : "fr")(((Q.get("lang") || "fr").toLowerCase().split(/[-_]/)[0]));
if (Q.get("nuit") === "1") document.documentElement.classList.add("nuit");
document.documentElement.lang = LANGUE;
document.documentElement.dir = (LANGUE === "fa" || LANGUE === "ar") ? "rtl" : "ltr";
const NB = Q.get("seance") === "1" ? 6 : 20;
Zoom.init({direct: "img.photo, .fiche img", loupe: ".rangee button", langue: LANGUE});

const TEXTES = {
  titre:     {fr:"Les démarches", en:"Paperwork and appointments", tr:"Resmî işler", uk:"Офіційні справи", fa:"کارهای اداری", ar:"المعاملات الإدارية", pt:"Os trâmites", pl:"Sprawy urzędowe", ru:"Официальные дела", de:"Behördengänge"},
  intro:     {fr:"Touche une image : tu vois la démarche ou le document, et tu l'entends. En bas, le formulaire de Mark : touche une case.", en:"Tap a picture to see and hear the step or the document. Below is Mark's form: tap a box.", tr:"Bir resme dokun: işlemi ya da belgeyi gör ve dinle. Aşağıda Mark'ın formu var: bir kutuya dokun.", uk:"Торкнися зображення: побачиш і почуєш дію чи документ. Нижче — формуляр Марка: торкнися клітинки.", fa:"روی یک تصویر بزن تا کار یا مدرک را ببینی و بشنوی. پایین، فرم مارک است: روی یک خانه بزن.", ar:"المس صورة لترى الإجراء أو الوثيقة وتسمعها. في الأسفل استمارة مارك: المس خانة.", pt:"Toque em uma imagem para ver e ouvir o passo ou o documento. Embaixo está o formulário do Mark: toque em um campo.", pl:"Dotknij obrazka, aby zobaczyć i usłyszeć czynność lub dokument. Niżej formularz Marka: dotknij pola.", ru:"Нажми на картинку, чтобы увидеть и услышать действие или документ. Ниже — анкета Марка: нажми на поле.", de:"Tippe auf ein Bild: Du siehst und hörst den Schritt oder das Dokument. Unten steht Marks Formular: Tippe auf ein Feld."},
  secDem:    {fr:"Ce que fait Mark", en:"What Mark does", tr:"Mark ne yapıyor", uk:"Що робить Марк", fa:"مارک چه می‌کند", ar:"ماذا يفعل مارك", pt:"O que o Mark faz", pl:"Co robi Mark", ru:"Что делает Марк", de:"Was Mark macht"},
  secDoc:    {fr:"Les documents", en:"The documents", tr:"Belgeler", uk:"Документи", fa:"مدارک", ar:"الوثائق", pt:"Os documentos", pl:"Dokumenty", ru:"Документы", de:"Die Dokumente"},
  secForm:   {fr:"Le formulaire de Mark", en:"Mark's form", tr:"Mark'ın formu", uk:"Формуляр Марка", fa:"فرم مارک", ar:"استمارة مارك", pt:"O formulário do Mark", pl:"Formularz Marka", ru:"Анкета Марка", de:"Marks Formular"},
  regleDe:   {fr:"Wo? On répond avec le datif : im Bürgeramt (in dem), bei der Bank, in der Praxis. Beaucoup de verbes des démarches sont séparables : Mark füllt das Formular aus, Mark meldet seine Wohnung an — le petit mot va à la fin ; unterschreiben, lui, ne se sépare pas. Au guichet, on dit Sie : Füllen Sie bitte das Formular aus!", en:"Wo? You answer with the dative: im Bürgeramt (in dem), bei der Bank, in der Praxis. Many verbs for paperwork are separable: Mark füllt das Formular aus, Mark meldet seine Wohnung an — the small word goes to the end; unterschreiben does not split. At the counter you say Sie: Füllen Sie bitte das Formular aus!", tr:"Wo? sorusuna datif ile cevap verilir: im Bürgeramt (in dem), bei der Bank, in der Praxis. Resmî işlerle ilgili birçok fiil ayrılabilir: Mark füllt das Formular aus, Mark meldet seine Wohnung an — küçük kelime sona gider; unterschreiben ise ayrılmaz. Gişede Sie denir: Füllen Sie bitte das Formular aus!", uk:"На Wo? відповідають давальним відмінком: im Bürgeramt (in dem), bei der Bank, in der Praxis. Багато дієслів для справ відокремлювані: Mark füllt das Formular aus, Mark meldet seine Wohnung an — маленьке слово йде в кінець; unterschreiben не розділяється. Біля віконця кажуть Sie: Füllen Sie bitte das Formular aus!", fa:"به Wo? با حالت داتیو جواب می‌دهیم: im Bürgeramt (in dem)، bei der Bank، in der Praxis. بسیاری از فعل‌های کارهای اداری جداشدنی‌اند: Mark füllt das Formular aus، Mark meldet seine Wohnung an — واژهٔ کوچک به آخر می‌رود؛ اما unterschreiben جدا نمی‌شود. پشت باجه Sie می‌گوییم: Füllen Sie bitte das Formular aus!", ar:"نجيب عن Wo? بحالة الجر (الداتيف): im Bürgeramt ‏(in dem)، bei der Bank، in der Praxis. كثير من أفعال المعاملات قابلة للفصل: Mark füllt das Formular aus، Mark meldet seine Wohnung an — الكلمة الصغيرة تذهب إلى آخر الجملة؛ أما unterschreiben فلا ينفصل. عند الشباك نقول Sie: Füllen Sie bitte das Formular aus!", pt:"Wo? Responde-se com o dativo: im Bürgeramt (in dem), bei der Bank, in der Praxis. Muitos verbos dos trâmites são separáveis: Mark füllt das Formular aus, Mark meldet seine Wohnung an — a palavrinha vai para o fim; unterschreiben não se separa. No guichê, usa-se Sie: Füllen Sie bitte das Formular aus!", pl:"Na Wo? odpowiada się celownikiem: im Bürgeramt (in dem), bei der Bank, in der Praxis. Wiele czasowników ze spraw urzędowych jest rozdzielnych: Mark füllt das Formular aus, Mark meldet seine Wohnung an — małe słowo idzie na koniec; unterschreiben się nie rozdziela. Przy okienku mówi się Sie: Füllen Sie bitte das Formular aus!", ru:"На Wo? отвечают дательным падежом: im Bürgeramt (in dem), bei der Bank, in der Praxis. Многие глаголы для официальных дел — отделяемые: Mark füllt das Formular aus, Mark meldet seine Wohnung an — маленькое слово уходит в конец; unterschreiben не разделяется. У окошка говорят Sie: Füllen Sie bitte das Formular aus!"},
  regleEs:   {fr:"Au guichet, on vouvoie : usted. Pour demander poliment, le verbe prend la forme du subjonctif : Rellene el formulario, Firme aquí, Saque un número, por favor. Un lieu est ouvert ou fermé en ce moment : estar (la oficina está cerrada). Où ? en el banco, en la consulta.", en:"At the counter you use usted. To ask politely, the verb takes the subjunctive form: Rellene el formulario, Firme aquí, Saque un número, por favor. A place is open or closed right now: estar (la oficina está cerrada). Where? en el banco, en la consulta.", pt:"No guichê, trata-se por usted. Para pedir com educação, o verbo vai para a forma do subjuntivo: Rellene el formulario, Firme aquí, Saque un número, por favor. Um lugar está aberto ou fechado agora: estar (la oficina está cerrada). Onde? en el banco, en la consulta.", ar:"عند الشباك نستعمل usted. للطلب بأدب يأخذ الفعل صيغة الشرطي (subjuntivo): Rellene el formulario، Firme aquí، Saque un número, por favor. المكان مفتوح أو مغلق الآن: estar ‏(la oficina está cerrada). أين؟ en el banco، en la consulta.", de:"Am Schalter sagt man usted. Für eine höfliche Bitte steht das Verb im Subjunktiv: Rellene el formulario, Firme aquí, Saque un número, por favor. Ob ein Ort gerade offen oder geschlossen ist, sagt man mit estar (la oficina está cerrada). Wo? en el banco, en la consulta."},
  c_document:{fr:"Regarde l'image : quel document est-ce ?", en:"Look at the picture: which document is it?", tr:"Resme bak: bu hangi belge?", uk:"Подивися на зображення: що це за документ?", fa:"به تصویر نگاه کن: این کدام مدرک است؟", ar:"انظر إلى الصورة: ما هذه الوثيقة؟", pt:"Olhe a imagem: que documento é este?", pl:"Spójrz na obrazek: jaki to dokument?", ru:"Посмотри на картинку: что это за документ?", de:"Sieh dir das Bild an: Welches Dokument ist das?"},
  c_entendre:{fr:"Écoute le mot et touche le bon document.", en:"Listen to the word and tap the right document.", tr:"Kelimeyi dinle ve doğru belgeye dokun.", uk:"Послухай слово й торкнися потрібного документа.", fa:"واژه را گوش کن و روی مدرک درست بزن.", ar:"استمع إلى الكلمة والمس الوثيقة الصحيحة.", pt:"Ouça a palavra e toque no documento certo.", pl:"Posłuchaj słowa i dotknij właściwego dokumentu.", ru:"Послушай слово и нажми на нужный документ.", de:"Hör dir das Wort an und tippe auf das richtige Dokument."},
  c_ou:      {fr:"Où Mark fait-il cela ? Choisis le bon lieu.", en:"Where does Mark do this? Choose the right place.", tr:"Mark bunu nerede yapıyor? Doğru yeri seç.", uk:"Де Марк це робить? Обери правильне місце.", fa:"مارک این کار را کجا انجام می‌دهد؟ جای درست را انتخاب کن.", ar:"أين يفعل مارك ذلك؟ اختر المكان الصحيح.", pt:"Onde o Mark faz isso? Escolha o lugar certo.", pl:"Gdzie Mark to robi? Wybierz właściwe miejsce.", ru:"Где Марк это делает? Выбери правильное место.", de:"Wo macht Mark das? Wähle den richtigen Ort."},

function T(cle, v){ let s = (TEXTES[cle] || {})[LANGUE] || (TEXTES[cle] || {}).fr || cle; for (const k in (v || {})) s = s.split("{" + k + "}").join(v[k]); return s; }

// ---------- la donnee (demarches.json) ----------
let D = null, LX, HO, DOC, DEM, CH, FO, AV, TE, CJ;
const PHRASE_TRADUITE = LANGUE !== APPRENDRE && (["fr", "en", "pt"].includes(LANGUE) || (LANGUE === "de" && APPRENDRE === "es"));

const $ = id => document.getElementById(id);

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

// ---------- les mots du theme (la forme du corpus) et leur traduction ----------
const MOTS = () => D.mots[APPRENDRE];
const memeMot = (a, b) => a && b && a.mot === b.mot && (a.genre || null) === (b.genre || null) && (a.cat || null) === (b.cat || null);

// ---------- la langue apprise : les phrases ----------
const conj = v => CJ[v];
const decoupe = f => { const i = f.indexOf(" "); return i < 0 ? [f, ""] : [f.slice(0, i), f.slice(i + 1)]; };   // « meldet an » -> [meldet, an]
// « Mark meldet seine Wohnung im Bürgeramt an. » / « Mark abre una cuenta en el banco. »
function phraseMark(d, avecLieu, lieuForce){
  const lieu = lieuForce || d.lieu, L = lieu && avecLieu !== false ? LX[lieu].dat : "";
  if (ES_) return espaces("Mark " + conj(d.v).er + " " + d.obj + " " + L + ".");
  const [v, p] = decoupe(conj(d.v).er);
  return espaces("Mark " + v + " " + d.obj + " " + L + " " + p + ".");
}
function phraseTrou(d){            // le lieu remplace par ___
  if (ES_) return espaces("Mark " + conj(d.v).er + " " + d.obj + " ___.");
  const [v, p] = decoupe(conj(d.v).er);
  return espaces("Mark " + v + " " + d.obj + " ___ " + p + ".");
}
function tradMark(d, avecLieu, lieuForce){
  if (!TL) return null;
  const lieu = lieuForce || d.lieu, t = d.t[TL]; if (!t) return null;
  const a = lieu && avecLieu !== false ? (LX[lieu].trad[TL] || [])[1] || "" : "";
  return espaces(t.replace("{L}", a ? " " + a : ""));
}
const infinitifPhrase = d => ES_ ? espaces(d.v + " " + d.obj) : espaces(d.obj + " " + d.v);   // « ein Konto eröffnen » / « abrir una cuenta »

function phrasePolie(d, forme){
  if (ES_) return espaces(cap(forme) + " " + d.sie + ", por favor.");

  return espaces(cap(forme) + " Sie bitte " + d.sie + " " + p + "!");
}
const docAff = k => { const d = DOC[k]; return d.genre + " " + (d.affiche || d.mot); };

let file = [], rang = 0, bons = 0, repondu = false;

function viser(w){ motQ = w ? {mot: w.mot, genre: w.genre || null, cat: w.cat || null} : null; }
function juger(ok, bonneTexte, phrase){
  if (repondu) return; repondu = true;
  if (ok) bons++;
  parler("exercice", {juste: ok}); if (ok){ parler("bonne"); Voix.bravo(); }
  if (motQ) parler("reponse", {mot: motQ.mot, genre: motQ.genre || null, cat: motQ.cat || null, juste: ok});
  if (!ok && file[rang]) Tirage.remettre(file, rang, file[rang], NB);
  const m = $("msg"); m.className = "retourMsg " + (ok ? "ok" : "ko");
  const g = motQ ? glose(motQ) : "";
  m.innerHTML = (ok ? cible(ES_ ? "¡Muy bien!" : "Sehr gut!") : T("bonne", {r: cible(esc(bonneTexte))}))
    + (phrase && (ok || phrase !== bonneTexte) ? '<span class="phrase">' + cible(esc(phrase)) + '</span>' : "")
    + traduction(tradQ)
    + (!ok && choixFaux && choixFaux.trad ? '<span class="trad faux" dir="auto">' + T("choix", {c: cible(esc(choixFaux.texte)) + " — " + esc(choixFaux.trad)}) + '</span>' : "")
    + (motQ && g ? '<span class="mot"><button type="button" class="ecoute" id="redire" aria-label="' + T("ecouter") + '">' + HP + '</button>' + cible(esc(dirQ || motQ.mot)) + ' · <span>' + esc(g) + '</span></span>' : "");
  const r = $("redire"); if (r) r.addEventListener("click", () => dire(dirQ || motQ.mot));
  dire(phrase || bonneTexte);
  const s = $("suite"); s.textContent = rang + 1 >= file.length ? T("terminer") : T("suivant"); s.hidden = false;
}
// des boutons de texte ; trads : la traduction du choix faux (le corpus ou la page), facultative
function boutons(conteneur, options, bonne, apres, trads){
  let bon;
  options.forEach(o => {
    const b = document.createElement("button"); b.type = "button"; b.lang = APPRENDRE; b.dir = "ltr"; b.textContent = o; if (o === bonne) bon = b;
    b.addEventListener("click", () => {
      conteneur.querySelectorAll("button").forEach(x => { x.disabled = true; if (x === bon) x.classList.add("juste"); });
      if (b !== bon) b.classList.add("faux");
      choixFaux = o === bonne ? null : {texte: o, trad: trads ? trads(o) : null};
      apres(o === bonne);
    });
    conteneur.appendChild(b);
  });
}
function images(conteneur, ids, bonne, apres, trads){
  let bon;

      if (b !== bon) b.classList.add("faux");

}

function papierFormulaire(f, cachee, vise){

    const val = x.signature ? '<span class="val signe">Mark Garnier</span>' : '<span class="val">' + esc(x.v) + '</span>';
    return '<div class="case' + (large ? " large" : "") + (c === cachee ? " cachee vise" : "") + (c === vise ? " vise" : "") + '" data-champ="' + c + '"><span class="lab">'
      + (c === cachee ? "?" : esc(x.label)) + '</span>' + val + '</div>';
  }).join("");
  return '<div class="papier" lang="' + APPRENDRE + '">' + entete(LX[f.lieu].carte) + '<h3>' + esc(f.titre) + '</h3><div class="cases">' + cases + '</div></div>';

const itemDoc = k => cap(DOC[k].acc.replace(/^(der|die|das|den|ein|eine|el|la|los|las|un|una) /, ""));
function papierAvis(a){

function plages(k, j){
  const p = (HO[k] || {})[j] || [];
  if (!p.length) return ES_ ? "cerrado" : "geschlossen";
  const f = h => ES_ ? h + ":00" : String(h);
  return p.map(([a, b]) => f(a) + "–" + f(b)).join(ES_ ? " y " : " und ") + (ES_ ? "" : " Uhr");
}
function papierHoraires(k){
  const lignes = [1, 2, 3, 4, 5].map(j => '<tr><td>' + cap(jour(j)) + '</td><td>' + esc(plages(k, j)) + '</td></tr>').join("")
    + '<tr><td>' + cap(jour(6)) + (ES_ ? " y " : " und ") + jour(7) + '</td><td>' + (ES_ ? "cerrado" : "geschlossen") + '</td></tr>';
  return '<div class="papier" lang="' + APPRENDRE + '">' + entete(LX[k].carte) + '<h3>' + (ES_ ? "Horario de atención al público" : "Öffnungszeiten") + '</h3><table>' + lignes + '</table></div>';

// la confirmation de rendez-vous : un jour OUVERT du lieu, une heure dans ses plages, entre le 16 nov. et le 18 dec. 2026

    let q, rep, opts, trads = null;
    if (sorte === "jour"){
      q = ES_ ? "¿Qué día es la cita de Mark?" : "An welchem Tag ist Marks Termin?";
      const f = j => (ES_ ? "el " : "am ") + jour(j);
      rep = f(t.j); opts = melanger([t.j, ...melanger([1, 2, 3, 4, 5].filter(j => j !== t.j)).slice(0, 3)]).map(f);
      trads = o => { const j = [1, 2, 3, 4, 5].find(x => f(x) === o); return j ? tradJour(j) : null; };
    } else if (sorte === "heure"){
      q = ES_ ? "¿A qué hora es la cita de Mark?" : "Um wie viel Uhr ist Marks Termin?";
      const f = h => (ES_ ? "a las " : "um ") + heureMin(h);
      const autres = [t.h + 1, t.h - 1, t.h + 0.5, t.h + 2, t.h - 2].filter(h => h >= 7 && h <= 19);
      rep = f(t.h); opts = melanger([rep, ...melanger(autres).slice(0, 3).map(f)]);
    } else {
      q = ES_ ? "¿Dónde es la cita de Mark?" : "Wo ist Marks Termin?";
      rep = LX[t.k].dat; opts = melanger([rep, ...melanger(Object.keys(LX).filter(k => k !== t.k)).slice(0, 3).map(k => LX[k].dat)]);
      trads = tradLieuChoix;
    }
    tradQ = terminTrad(t); dirQ = TE.genre + " " + TE.mot;
    ecran("c_termin", papierTermin(t), q, {centre: true});
    boutons($("choix"), opts, rep, ok => juger(ok, rep, terminPhrase(t)), trads);
    return true;
  },
  // vrai ou faux : sur le formulaire, l'avis, les heures, le rendez-vous ou le lieu d'une demarche
  vraifaux(w){
    const sources = [];
    const cs = champsDe(w).filter(c => CH[c].vf !== false && (CH[c].faux || []).length); if (cs.length) sources.push("champ");
    if (!w || AV.some(a => a.docs.some(k => docsDe(w).includes(k)))) sources.push("avis");
    if (!w || estOuvertMot(w)) sources.push("horaire");
    if (!w || estTermin(w)) sources.push("termin");
    if (!w || lieuxDe(w).length) sources.push("lieu");
    if (w && !w.cat && !lieuxDe(w).length && !docsDe(w).length && !cs.length && !estTermin(w)) return false;
    const src = sources.filter(s => s !== "lieu" || DEM.some(d => d.lieu && leurresLieu(d).length && (!w || lieuxDe(w).includes(d.lieu))));
    if (!src.length) return false;
    const s = hasard(src), vrai = Math.random() < 0.5;
    let avant = "", phrase, juste;
    if (s === "champ"){
      const c = hasard(cs), f = hasard(FO.filter(x => x.champs.includes(c))); viser(w || champMot(c));
      const v = vrai ? CH[c].v : hasard(CH[c].faux);
      avant = papierFormulaire(f, null, c); phrase = champPhrase(c, v); juste = champPhrase(c, CH[c].v);
      tradQ = tradChampPhrase(c, CH[c].v); dirQ = CH[c].label;
    } else if (s === "avis"){
      const ks = w ? docsDe(w) : null;
      const a = hasard(AV.filter(x => !ks || x.docs.some(k => ks.includes(k))));
      const dans = hasard(a.docs.filter(x => !ks || ks.includes(x)));
      const hors = Object.keys(DOC).filter(x => !a.docs.includes(x) && DOC[x].mot !== DOC[dans].mot);
      const k = vrai || !hors.length ? dans : hasard(hors);
      viser(w || docMot(dans));
      avant = papierAvis(a); phrase = avisPhrase(a, k); juste = avisPhrase(a, dans);
      tradQ = avisTrad(a, dans); dirQ = docAff(dans);
      if (k !== dans) { viser(w || docMot(dans)); }
    } else if (s === "horaire"){
      const voulu = w ? Object.keys(D.ouvert[APPRENDRE]).indexOf(w.mot) === 0 : null;
      let t = null;
      for (let n = 0; n < 60 && !t; n++){ const x = tirerHoraire(hasard(Object.keys(HO))); if (voulu === null || x.ouvert === voulu) t = x; }
      if (!t) return false;
      viser(w || ouvertMot(t.ouvert));
      avant = papierHoraires(t.k);
      juste = horairePhrase(t.k, t.j, t.h, ouvertForme(t.k, t.ouvert));
      phrase = vrai ? juste : horairePhrase(t.k, t.j, t.h, ouvertForme(t.k, !t.ouvert));
      tradQ = horaireTrad(t.k, t.j, t.h, t.ouvert); dirQ = ouvertForme(t.k, t.ouvert);
    } else if (s === "termin"){
      viser(w || nom(TE.mot, TE.genre));
      const t = tirerTermin(hasard(Object.keys(HO)));
      const autreJ = hasard([1, 2, 3, 4, 5].filter(j => j !== t.j));
      avant = papierTermin(t);
      const p = j => ES_ ? "La cita de Mark es el " + jour(j) + "." : "Marks Termin ist am " + jour(j) + ".";
      phrase = p(vrai ? t.j : autreJ); juste = terminPhrase(t);
      tradQ = terminTrad(t); dirQ = TE.genre + " " + TE.mot;
    } else {
      const lieux = w ? lieuxDe(w) : null;
      const d = hasard(DEM.filter(x => x.lieu && leurresLieu(x).length && (!lieux || lieux.includes(x.lieu))));
      viser(w || lieuMot(d.lieu));
      phrase = vrai ? phraseMark(d, true) : phraseMark(d, true, hasard(leurresLieu(d)));
      juste = phraseMark(d, true);
      avant = d.img ? photo(d.img) : "";
      tradQ = tradMark(d, true); dirQ = LX[d.lieu].nom;
    }
    const V = ES_ ? ["Verdadero", "Falso"] : ["Richtig", "Falsch"];
    const rep = phrase === juste ? V[0] : V[1];
    ecran("c_vraifaux", avant, phrase, {centre: true});
    boutons($("choix"), V, rep, ok => juger(ok, rep, juste));
    return true;
  }
};
const SORTES = Object.keys(EX).filter(x => !(ES_ && x === "ordre"));

// ---------- la decouverte ----------
function textesAVoix(){
  if (!D) return [];
  const t = DEM.map(d => phraseMark(d, true)).concat(Object.keys(DOC).map(docAff), Object.keys(CH).map(c => CH[c].label), DEM.map(d => d.v));
  return [...new Set(t)];
}
function decouvrir(){
  $("compte").textContent = ""; $("barre").style.width = "0%";
  const z = $("zone");
  const dems = DEM.filter(d => d.img), docs = Object.keys(DOC).filter(k => DOC[k].img);
  const planche = (id, items) => '<div class="planche" id="' + id + '">' + items.map(([k, img, label]) => '<button type="button" data-k="' + k + '" aria-label="' + esc(label) + '"><img alt="" src="' + imgSrc(img) + '"></button>').join("") + '</div>';
  const f = FO[0];
  z.innerHTML = '<p class="consigne">' + T("intro") + '</p><div class="fiche" id="fiche"></div>'
    + '<div class="section">' + T("secDem") + '</div>' + planche("pDem", dems.map(d => ["d:" + d.id, d.img, phraseMark(d, false)]))
    + '<div class="section">' + T("secDoc") + '</div>' + planche("pDoc", docs.map(k => ["k:" + k, DOC[k].img, docAff(k)]))
    + '<div class="section">' + T("secForm") + '</div>' + papierFormulaire(f)
    + '<p class="regle">' + isoler(T(ES_ ? "regleEs" : "regleDe")) + '</p>';
  const fiche = (img, mot, sens, dit, trad) => {
    $("fiche").innerHTML = (img ? '<img alt="" src="' + imgSrc(img) + '">' : '<div></div>') + '<div><div class="mot">' + cible(esc(mot)) + '</div><div class="sens">' + esc(sens || "") + '</div>'
      + '<div class="dit">' + cible(esc(dit)) + '</div>' + traduction(trad) + '<div class="ligne"><button type="button" class="ecoute" id="ecoute" aria-label="' + T("ecouter") + '">' + HP + '</button></div></div>';
    $("ecoute").addEventListener("click", () => dire(dit));
    dire(dit);
  };
  const choisir = cle => {
    document.querySelectorAll(".planche button").forEach(b => b.classList.toggle("choisi", b.dataset.k === cle));
    const [t, id] = cle.split(":");
    if (t === "d"){ const d = DEM.find(x => x.id === id); fiche(d.img, d.v, glose({mot: d.v, cat: "verbe"}), phraseMark(d, true), tradMark(d, true)); }
    else fiche(DOC[id].img, docAff(id), glose(docMot(id)), docPhrase(id), docTrad(id));
  };
  document.querySelectorAll(".planche button").forEach(b => b.addEventListener("click", () => choisir(b.dataset.k)));
  z.querySelectorAll(".papier .case").forEach(el => {
    el.classList.add("touche");
    el.addEventListener("click", () => {
      const c = el.dataset.champ;
      z.querySelectorAll(".papier .case").forEach(x => x.classList.toggle("vise", x === el));
      fiche(null, CH[c].label, CH[c].mot ? glose(champMot(c)) : tradChamp(c, 1), champCourt(c, CH[c].v), champCourtTrad(c, CH[c].v));
    });
  });
  const garde = dire; dire = () => {}; if (dems.length) choisir("d:" + dems[0].id); dire = garde;
  const s = $("suite"); s.textContent = T("commencer"); s.hidden = false;
  s.onclick = () => { s.onclick = null; Voix.arreter(); demarrer(); };
}

// ---------- LA PARTIE : recopiee de contrarios.html (identique d'un theme a l'autre) ----------
const NEUFS_MAX = Q.get("seance") === "1" ? 3 : 10;
let vus = new Set(), sorteCourante = null, derniereSorte = null;
function cleQuestion(){
  const z = $("zone"), en = z.querySelector(".enonce"), pa = z.querySelector(".papier");
  return sorteCourante + "|" + (en ? en.textContent : "") + "|" + (pa ? pa.textContent : "") + "|" + Array.from(z.querySelectorAll("img")).map(i => i.getAttribute("src")).sort().join(",");
}
function remise(){ motQ = null; tradQ = null; choixFaux = null; dirQ = null; }
function montrer(){
  repondu = false; $("suite").hidden = true;
  $("compte").textContent = (rang + 1) + " / " + file.length;
  $("barre").style.width = (rang / file.length * 100) + "%";
  const garde = dire; dire = () => {};
  const essai = (w, strict) => {
    const autres = melanger(SORTES.filter(x => x !== derniereSorte));
    for (const so of autres){
      for (let n = 0; n < 25; n++){
        remise(); sorteCourante = so;
        if (!EX[so](w)) break;
        if (!vus.has(cleQuestion())) return so;
      }
    }
    if (strict) return null;
    if (derniereSorte) for (let n = 0; n < 25; n++){
      remise(); sorteCourante = derniereSorte;
      if (!EX[derniereSorte](w)) break;
      if (!vus.has(cleQuestion())) return derniereSorte;
    }
    for (const so of autres.concat(derniereSorte ? [derniereSorte] : [])){
      remise(); sorteCourante = so;
      if (EX[so](w)) return so;
    }
    return null;
  };
  let fait = essai(file[rang], true);
  for (let j = rang + 1; !fait && j < file.length; j++){
    fait = essai(file[j], true);
    if (fait) [file[rang], file[j]] = [file[j], file[rang]];
  }
  if (!fait) fait = essai(file[rang], false);
  dire = garde;
  if (fait === "entendre"){ const e = $("ecoute"); if (e) e.click(); }
  vus.add(cleQuestion()); derniereSorte = fait;
  window.scrollTo(0, 0); document.body.scrollTop = 0;
}
function fin(){
  $("barre").style.width = "100%"; $("compte").textContent = file.length + " / " + file.length; $("suite").hidden = true;
  $("zone").innerHTML = '<div class="fin"><div class="score">' + T("score", {b: bons, n: file.length}) + '</div></div>' + boutonsBas();
  brancherEncore();
  $("terminer").addEventListener("click", () => parler("fini", {bons, faits: file.length}));
}
function toutRevu(prochaine){
  $("barre").style.width = "100%"; $("compte").textContent = ""; $("suite").hidden = true;
  const quand = Tirage.revu(prochaine, LANGUE);
  $("zone").innerHTML = '<div class="fin"><div class="score">' + (TIRAGE_TEXTES.revu[LANGUE] || TIRAGE_TEXTES.revu.fr) + '</div>'
    + (quand ? '<p class="consigne">' + (TIRAGE_TEXTES.prochaine[LANGUE] || TIRAGE_TEXTES.prochaine.fr).replace("{d}", quand) + '</p>' : "")
    + '</div>' + boutonsBas();
  brancherEncore();
  $("terminer").addEventListener("click", () => parler("fini", {bons: 0, faits: 0}));
}
const boutonEncore = () => Q.get("seance") === "1" ? "" : '<button type="button" class="second" id="encore">' + (TIRAGE_TEXTES.encore[LANGUE] || TIRAGE_TEXTES.encore.fr) + '</button>';
const boutonsBas = () => '<div class="bas">' + boutonEncore() + '<button type="button" id="terminer">' + T("terminer") + '</button></div>';
function brancherEncore(){ const b = $("encore"); if (b) b.addEventListener("click", encoreDesQuestions); }
async function encoreDesQuestions(){
  const mots = motsDuTheme();
  file = Tirage.supplement(mots, await Tirage.demander(mots), NB); rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(null);
  montrer();
}
async function demarrer(){
  const mots = motsDuTheme();
  const plan = Tirage.plan(mots, await Tirage.demander(mots), NB, NEUFS_MAX);
  file = plan.file; rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(plan.prochaine);
  montrer();
}
$("suite").addEventListener("click", () => { if (!file.length) return; rang++; if (rang >= file.length) fin(); else montrer(); });
$("retour").addEventListener("click", () => parler("fermer"));
$("retour").setAttribute("aria-label", T("retourAria"));
$("titre").textContent = T("titre");
document.title = T("titre");
fetch("demarches/demarches.json?v=1").then(r => r.json()).then(d => {
  D = d; LX = D.lieux[APPRENDRE]; HO = D.horaires[APPRENDRE]; DOC = D.docs[APPRENDRE]; DEM = D.demarches[APPRENDRE];
  CH = D.champs[APPRENDRE]; FO = D.formulaires[APPRENDRE]; AV = D.avis[APPRENDRE]; TE = D.termin[APPRENDRE]; CJ = D.conj[APPRENDRE];
  if (Q.get("seance") === "1") demarrer(); else decouvrir();
});
