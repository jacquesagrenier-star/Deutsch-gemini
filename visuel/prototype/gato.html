<title>Où est le chat ?</title>
<!--
  « OU EST LE CHAT ? » (theme illustre, 3 nov. 2026) : les PREPOSITIONS DE LIEU en images, en espagnol et en
  allemand. Un chat (Moritz, chez Ben et Mia) et UNE piece ; d'une image a l'autre, seule sa place change. En
  allemand, c'est l'exercice des cas : « Wo ist die Katze? Auf dem Tisch. » (datif, la position) et « Wohin springt
  die Katze? Auf den Tisch. » (accusatif, le mouvement : l'image d'AVANT et une fleche, puis l'image d'APRES) ; les
  contractions im, am, ins, ans, aufs. En espagnol, la preposition ne change pas avec le mouvement, seul « a »
  s'ajoute (salta a la mesa) ; del et al.
  Ce qui existait deja et qu'on ne double pas : le panneau Prepositions (Quel cas ?, Wo ou Wohin ? en texte,
  Laquelle ?, Verbes a preposition) et la scene du salon de Mark ; cette page y est reliee par un bouton
  M'ENTRAINER. Toute la donnee vient de visuel/gato/gato.py -> gato/gato.json : aucune phrase n'est ecrite ici.
  Ouverte par l'app dans le cadre des scenes (sceneCadre), elle parle comme une scene : « exercice » et « bonne »
  a chaque reponse, « reponse » {mot, genre, cat, juste} pour le mot teste (une preposition : cat « praep »), « fini »
  et « fermer » a la fin. Parametres : apprendre=es|de, lang=<interface>, nuit=1, seance=1 (six questions, pas de
  decouverte), variante=latam (la voix), r=<AUDIO_REVISION>. Le tirage suit les mots (themes/tirage.js).
-->
<style>
:root{--fond1:#82AFDB;--fond3:#C0D6EA;--encre:#1C2430;--gris:#4C566B;--ambre:#E8A23A;--ambre-f:#A86A0E;--vert:#2F9E6A;--rouge:#C8473A;
  --dat:#A86A0E;--akk:#1E7F86;--verre:rgba(255,255,255,.88);--bord:rgba(255,255,255,.95);--carte:#F7F8FA;--police:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html.nuit{--fond1:#0E1C26;--fond3:#18303F;--encre:#EEF2F5;--gris:#A9B8C4;--ambre-f:#E8A23A;--vert:#5CC98F;--rouge:#F07F72;
  --dat:#F0B45A;--akk:#5FD0D6;--verre:rgba(20,36,50,.88);--bord:rgba(255,255,255,.14);--carte:#22384A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,var(--fond1),var(--fond3));background-attachment:fixed;color:var(--encre);font-family:var(--police);

.haut{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto 10px}
.retour{width:42px;height:42px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);color:var(--encre);font:800 22px var(--police);cursor:pointer;flex:0 0 auto}
html[dir="rtl"] .retour{transform:scaleX(-1)}
.titre{flex:1;font-weight:900;font-size:18px}
.compte{font-weight:800;font-size:14px;color:var(--gris)}
.barre{max-width:560px;margin:0 auto 12px;height:6px;border-radius:3px;background:rgba(28,36,48,.12);overflow:hidden}
.barre i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2BB5AA,#14807A);transition:width .3s}
main{max-width:560px;margin:0 auto;background:var(--verre);border:1px solid var(--bord);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}
.consigne{font-size:14px;font-weight:700;color:var(--gris);margin:0}
.enonce{direction:ltr;text-align:left;background:var(--carte);border-radius:14px;padding:12px 14px;font-weight:800;line-height:1.5;font-size:17px}
.enonce.centre{text-align:center;font-size:19px}
.trou{display:inline-block;min-width:56px;border-bottom:2px solid var(--ambre);text-align:center;color:var(--ambre-f)}
/* la piece : 4:3, la fleche du mouvement par-dessus (viewBox 100 x 75) ; la gauche reste a gauche en arabe et en persan */
.cadre{position:relative;width:100%;max-width:560px;margin:0 auto;direction:ltr;border-radius:16px;overflow:hidden;background:var(--carte);aspect-ratio:4/3}
/* .vue : l'image entiere, agrandie et deplacee pour cadrer le chat (cadrage()) ; la fleche la suit */
.cadre .vue,.rangee .vue{position:absolute}
.cadre img,.rangee .vue img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .35s}
.cadre svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity .35s}
.cadre .etiquette{position:absolute;left:8px;top:8px;background:rgba(28,36,48,.72);color:#fff;font:800 12px var(--police);border-radius:999px;padding:3px 9px;letter-spacing:.02em}
.cas-dat{color:var(--dat);font-weight:900} .cas-akk{color:var(--akk);font-weight:900}
/* des images a toucher (« touche la bonne image », l'ecoute) */
.rangee{display:grid;grid-template-columns:1fr 1fr;gap:8px;direction:ltr}
.rangee.trois{grid-template-columns:1fr 1fr 1fr}
.rangee button{border:3px solid transparent;border-radius:14px;background:var(--carte);padding:0;cursor:pointer;overflow:hidden;display:block;position:relative;aspect-ratio:4/3}
.rangee button.juste{border-color:var(--vert)} .rangee button.faux{border-color:var(--rouge)}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix.centre{justify-content:center}
.choix button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:9px 15px;font:800 15px var(--police);cursor:pointer}
.choix button.juste{background:var(--vert);border-color:var(--vert);color:#fff}
.choix button.faux{background:var(--rouge);border-color:var(--rouge);color:#fff}
button:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
button:disabled{cursor:default}
.ecoute{width:48px;height:48px;border-radius:50%;border:2px solid var(--ambre);background:var(--verre);color:var(--encre);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ecoute svg{width:24px;height:24px}
.ecoute.grand{width:64px;height:64px;margin:0 auto} .ecoute.grand svg{width:32px;height:32px}
.retourMsg{min-height:1.4em;font-weight:800;font-size:15px;margin:0;line-height:1.45}
.retourMsg.ok{color:var(--vert)} .retourMsg.ko{color:var(--rouge)}
.retourMsg .phrase{display:block;color:var(--encre);font-weight:700}
.trad{display:block;font-size:13px;font-weight:600;font-style:italic;color:var(--gris);line-height:1.35;margin-top:2px}
.retourMsg .mot{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--gris);font-weight:700}
.retourMsg .mot .ecoute{width:38px;height:38px} .retourMsg .mot .ecoute svg{width:19px;height:19px}
.retourMsg .choisi{display:block;margin-top:6px;color:var(--gris);font-weight:700}
.retourMsg .choisi b{color:var(--rouge)}
/* la decouverte : la piece, la phrase, deux onglets (ou il est / ou il va) et les prepositions a toucher */
.onglets{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--carte);border-radius:999px;padding:4px}
.onglets button{border:0;border-radius:999px;background:none;color:var(--gris);font:800 14px var(--police);padding:9px 6px;cursor:pointer}
.onglets button.actif{background:var(--verre);color:var(--encre);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.dit{display:flex;align-items:center;gap:10px;background:var(--carte);border-radius:14px;padding:10px 12px}
.dit .texte{flex:1;font-weight:800;font-size:17px;line-height:1.4}
.puces{display:flex;flex-wrap:wrap;gap:7px;direction:ltr}
.puces button{border:2px solid var(--bord);background:var(--carte);color:var(--encre);border-radius:12px;padding:7px 11px;font:700 14px var(--police);cursor:pointer}
.puces button.choisi{border-color:var(--ambre);background:var(--verre)}
.regle{margin:0;font-size:14px;font-weight:700;line-height:1.5;color:var(--gris);background:var(--carte);border-radius:12px;padding:10px 12px}
.regle b{color:var(--encre)}
.regle .exemples{display:block;margin-top:6px;color:var(--encre);font-weight:700;text-align:left}
.suite{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:54px;border:0;border-radius:27px;
  color:#fff;font:800 17px var(--police);background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer}
.suite{z-index:5000}
.suite[hidden]{display:none}
/* la fin de partie : « Encore des questions » et « Terminer », fixes en bas comme .suite (regle des scenes, 3 nov.) */
.bas{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;gap:10px;z-index:5000}
.bas[hidden]{display:none}
.bas button{flex:1;height:54px;border-radius:27px;font:800 16px var(--police);cursor:pointer;padding:0 10px}
.bas .principal{border:0;color:#fff;background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28)}
.bas .second{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.fin{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:10px 0}
.fin .score{font-size:22px;font-weight:900}
[lang]{unicode-bidi:isolate}
</style>

if (Q.get("nuit") === "1") document.documentElement.classList.add("nuit");
document.documentElement.lang = LANGUE;
document.documentElement.dir = (LANGUE === "fa" || LANGUE === "ar") ? "rtl" : "ltr";
// vingt questions seul (Jacques, 3 nov.), six dans la seance du jour, sans la decouverte

const TEXTES = {

  intro:     {fr:"Voici Moritz, le chat de Ben et Mia. Touche une place : Moritz y va, tu vois la phrase et tu l'entends.", en:"This is Moritz, Ben and Mia's cat. Tap a place: Moritz goes there, and you see and hear the sentence.", tr:"Bu Moritz, Ben ile Mia'nın kedisi. Bir yere dokun: Moritz oraya gider, cümleyi görür ve duyarsın.", uk:"Це Моріц, кіт Бена й Мії. Торкнися місця: Моріц іде туди, а ти бачиш і чуєш речення.", fa:"این موریتس است، گربهٔ بن و میا. روی یک جا بزن: موریتس به آنجا می‌رود و تو جمله را می‌بینی و می‌شنوی.", ar:"هذا موريتس، قطّ بن وميا. المس مكانًا: يذهب موريتس إليه، وترى الجملة وتسمعها.", pt:"Este é o Moritz, o gato do Ben e da Mia. Toque em um lugar: o Moritz vai até lá, e você vê e ouve a frase.", pl:"To jest Moritz, kot Bena i Mii. Dotknij miejsca: Moritz tam idzie, a ty widzisz i słyszysz zdanie.", ru:"Это Мориц, кот Бена и Мии. Нажми на место: Мориц идёт туда, а ты видишь и слышишь фразу.", de:"Das ist Moritz, der Kater von Ben und Mia. Tippe auf einen Ort: Moritz geht dorthin, und du siehst und hörst den Satz."},
  ongletPos: {fr:"Où il est", en:"Where it is", tr:"Nerede duruyor", uk:"Де він є", fa:"کجاست", ar:"أين هو", pt:"Onde ele está", pl:"Gdzie jest", ru:"Где он", de:"Wo er ist"},

  aussi:     {fr:"On dit aussi :", en:"You can also say:", tr:"Şöyle de denir:", uk:"Також кажуть:", fa:"این را هم می‌گویند:", ar:"ويُقال أيضًا:", pt:"Também se diz:", pl:"Mówi się też:", ru:"Также говорят:", de:"Man sagt auch:"},

  wo:        {fr:"Regarde l'image et choisis la bonne place.", en:"Look at the picture and choose the right place.", tr:"Resme bak ve doğru yeri seç.", uk:"Подивися на зображення й обери правильне місце.", fa:"به تصویر نگاه کن و جای درست را انتخاب کن.", ar:"انظر إلى الصورة واختر المكان الصحيح.", pt:"Olhe a imagem e escolha o lugar certo.", pl:"Spójrz na obrazek i wybierz właściwe miejsce.", ru:"Посмотри на картинку и выбери правильное место.", de:"Sieh dir das Bild an und wähle den richtigen Ort."},
  dativ:     {fr:"Il est là, sans bouger : choisis l'article (datif).", en:"It is there, not moving: choose the article (dative).", tr:"Orada duruyor, hareket etmiyor: artikeli seç (Dativ).", uk:"Він там, не рухається: обери артикль (Dativ).", fa:"آنجاست و حرکت نمی‌کند: حرف تعریف را انتخاب کن (Dativ).", ar:"إنه هناك ولا يتحرك: اختر أداة التعريف (Dativ).", pt:"Ele está ali, parado: escolha o artigo (dativo).", pl:"Jest tam, nie rusza się: wybierz rodzajnik (Dativ).", ru:"Он там и не двигается: выбери артикль (Dativ).", de:"Er ist dort und bewegt sich nicht: Wähle den Artikel (Dativ)."},

// LE CADRAGE : a 375 px de large, la piece entiere montre un chat d'une quinzaine de pixels. On cadre donc autour du
// chat (et, pour un mouvement, autour du depart ET de l'arrivee), en gardant au moins la moitie de la largeur de la
// piece pour s'y reperer ; les personnes et la piece vide restent entieres. Rend le style de .vue (l'image entiere,
// agrandie et deplacee) : la fleche, dans .vue, garde ses coordonnees de l'image.
function cadrage(ids, minimum){
  const pts = ids.map(i => D.images[i] && !D.images[i].personnes && !D.images[i].geste && D.images[i].chat).filter(Boolean);
  if (!pts.length || pts.length < ids.length) return "left:0;top:0;width:100%;height:100%";
  const xs = pts.map(q => q[0] / 100), ys = pts.map(q => q[1] / 100);
  const w = Math.min(1, Math.max(minimum, Math.max(...xs) - Math.min(...xs) + .3, Math.max(...ys) - Math.min(...ys) + .32));
  const borne = (c) => Math.min(1 - w, Math.max(0, c - w / 2));
  const x0 = borne((Math.max(...xs) + Math.min(...xs)) / 2), y0 = borne((Math.max(...ys) + Math.min(...ys)) / 2 - .04);

  return "width:" + pc(1 / w) + ";height:" + pc(1 / w) + ";left:" + pc(-x0 / w) + ";top:" + pc(-y0 / w);
}

// LE MAUVAIS CHOIX TRADUIT (decision de Jacques du 3 nov., regle commune des themes) : apres une erreur, ce que
// l'eleve a choisi et ce que ca veut dire -- « ✗ unter dem Sofa · sous le canape ». Une image touchee : sa phrase. Un
// groupe (preposition + nom) : sa traduction (gato.json, groupes) en fr, en, pt (et de pour l'espagnol), ailleurs la
// glose de sa preposition. Un verbe : son sens (le corpus). Un article, hay, Richtig : rien a traduire.
function choixTraduit(c){
  if (!c || LANGUE === APPRENDRE) return null;
  const glose = m => { const g = (D.gloses[APPRENDRE] || {})[m] || {}; return g[LANGUE] || g.fr || ""; };
  if (D.places[c]){ const ph = pl(c).phrase; return {aff: ph, sens: tradPhrase(ph) || glose(DE_APP ? pl(c).prep : pl(c).preps[0])}; }
  const g = (D.groupes[APPRENDRE] || {})[c];

  if (g) return {aff: c + (g.cas ? " (" + (g.cas === "dat" ? "Wo? → Dativ" : "Wohin? → Akkusativ") + ")" : ""), sens: PHRASE_TRADUITE ? (g[LANGUE] || "") : glose(g.prep)};
  if (DE_APP && INF[c]) return {aff: c + " (" + INF[c] + ")", sens: glose(INF[c])};
  return null;
}

function boutons(conteneur, options, bonne, apres){

    b.addEventListener("click", () => {

      if (b !== bon) b.classList.add("faux");

// l'ecran d'une question : la consigne, une image (ou rien), l'enonce, les choix, le message
function ecran(consigne, image, enonce, centre){
  $("zone").innerHTML = '<p class="consigne">' + T(consigne) + '</p>' + (image || "")
    + '<div class="enonce' + (centre ? " centre" : "") + '">' + cible(enonce) + '</div><div class="choix' + (centre ? " centre" : "") + '" id="choix"></div><p class="retourMsg" id="msg"></p>';
}
const trou = () => '<span class="trou" id="trou">?</span>';
const avecTrou = s => s.replace("___", trou());
const remplir = rep => { const t = $("trou"); if (t) t.textContent = rep; };

// ---------- ce qu'une question peut dire de chaque place ----------
// Les « items » : chaque fait que montre une image, a la forme de la langue apprise. En espagnol, une place a
// plusieurs prepositions justes (encima de / sobre / en la mesa) : un item par forme, et les autres formes justes
// ne sont jamais des leurres.
function itemsOu(){
  const out = [];
  PLACES().forEach(id => {
    const p = pl(id), nom = D.places[id].de.nom;
    if (DE_APP) out.push({img: id, place: id, q: p.qWo, rep: p.wo, phrase: p.phrase, prep: p.prep, nom, vrais: [p.wo], cas: "dat"});
    else p.preps.forEach((x, i) => out.push({img: id, place: id, q: "¿Dónde está el gato?", rep: p.donde[i], phrase: "El gato está " + p.donde[i] + ".", prep: x, nom, vrais: p.donde}));
  });
  Object.keys(D.personnes).forEach(id => {
    const q = D.personnes[id][APPRENDRE];
    out.push({img: id, q: q.q, rep: q.rep, phrase: q.phrase, prep: q.prep, nom: q.nom || null, vrais: [q.rep], cas: "dat",
              leurres: (DE_APP ? D.personnes[id].leurresDe : D.personnes[id].leurresEs).map(([a, b]) => groupe(a, b, "dat"))});
  });
  D.objets.forEach(o => {
    const x = o[APPRENDRE];
    if (DE_APP) out.push({img: "piece", q: x.q, rep: x.rep, phrase: x.phrase, prep: x.prep, nom: o.id === "bild-wand" ? x.nom : null, vrais: [x.rep], leurres: x.leurres, cas: "dat"});
    else x.rep.forEach((r, i) => out.push({img: "piece", q: x.q, rep: r, phrase: x.phrase.replace(x.rep[0], r), prep: x.preps[i], nom: o.id === "bild-wand" ? x.nom : null, vrais: x.rep, leurres: x.leurres}));
  });
  return out;
}
// le groupe « preposition + article + nom » d'une cle de nom, comme gato.py (pour les leurres des personnes)
function groupe(prep, n, cas){
  const p = PLACES().map(id => D.places[id]).find(x => x.de.nom === n);
  if (DE_APP){
    const g = p ? p.de.genre : (n === "wand" ? "die" : "der"), mot = p ? p.de.mot : (n === "wand" ? "Wand" : n);
    const art = (cas === "akk" ? {der: "den", die: "die", das: "das"} : {der: "dem", die: "der", das: "dem"})[g];
    const k = {"in dem": "im", "an dem": "am", "in das": "ins", "an das": "ans"}[prep + " " + art];
    return k ? k + " " + mot : prep + " " + art + " " + mot;
  }
  const g = p ? p.es.genre : "la", mot = p ? p.es.mot : "pared";
  return (prep.endsWith(" de") && g === "el") ? prep.slice(0, -3) + " del " + mot : prep + " " + g + " " + mot;
}
// les leurres d'un item de place : d'autres places FAUSSES sur cette image -- le meme objet d'abord (sous la table
// contre sur la table), puis la meme preposition (sur la chaise), puis le reste
function leurresPlace(it, n){
  if (it.leurres) return melanger(it.leurres.filter(x => !it.vrais.includes(x))).slice(0, n);
  const autres = itemsOu().filter(o => o.place && compatibles(o.place, it.place) && !it.vrais.includes(o.rep) && o.rep !== it.rep);
  const memeObjet = melanger(autres.filter(o => o.nom === it.nom)), memePrep = melanger(autres.filter(o => o.prep === it.prep && o.nom !== it.nom));
  return uniques(memeObjet.concat(memePrep, melanger(autres)).map(o => o.rep)).slice(0, n);
}
let ITEMS = null;
const items = () => ITEMS || (ITEMS = itemsOu());
// un item pour le mot vise (preposition ou nom), sinon au hasard parmi ceux que propose filtre
function itemPour(w, filtre){
  const c = items().filter(it => (!filtre || filtre(it)) && (!w || (estPrep(w) && it.prep === w.mot) || (estNom(w) && it.nom === w.n)));
  return c.length ? hasard(c) : null;
}
// les places ou l'on peut aller, avec leur mouvement (et une place d'AVANT compatible)
const depart = dest => hasard(PLACES().filter(s => compatibles(s, dest)));

// LES VERBES DE POSITION (allemand) : l'etat (liegt, sitzt : Wo?) ou le geste (legt, setzt : Wohin?), sur une place,
// un mouvement du chat (legt sich vor das Sofa) ou un geste d'Anna et de Ben
const PAIRE = {liegt: "legt", sitzt: "setzt", legt: "liegt", setzt: "sitzt"}, INF = {liegt: "liegen", sitzt: "sitzen", legt: "legen", setzt: "setzen"};
function verbeVise(w){
  if (!DE_APP || (w && !estVerbe(w))) return null;
  const c = [];
  PLACES().forEach(id => { const p = pl(id);
    c.push(["wo", id, p.vWo]);
    if (/^(legt|setzt) sich$/.test(p.vWohin)) c.push(["wohin", id, p.vWohin.split(" ")[0]]); });
  Object.keys(D.gestes).forEach(id => c.push(["geste", id, D.gestes[id].de.verbe]));
  const cand = c.filter(([, , v]) => INF[v] && (!w || INF[v] === w.mot));
  return cand.length ? hasard(cand) : null;
}

// ---------- la decouverte : la piece, deux onglets, les places a toucher ----------
function decouvrir(){
  $("compte").textContent = ""; $("barre").style.width = "0%";
  const z = $("zone");
  z.innerHTML = '<p class="consigne">' + T("intro") + '</p><div id="vue"></div>'
    + '<div class="dit"><div class="texte" id="dit"></div><button type="button" class="ecoute" id="ecoute" aria-label="' + T("ecouter") + '">' + HP + '</button></div>'
    + '<div class="onglets" role="tablist"><button type="button" id="oPos" role="tab">' + T("ongletPos") + '</button><button type="button" id="oMvt" role="tab">' + T("ongletMvt") + '</button></div>'
    + '<div class="puces" id="puces"></div><p class="regle" id="regle"></p><p class="regle">' + regle(DE_APP ? "kurz" : "contrEs") + '</p>';
  let ici = "sofa-vor", phraseDite = "";
  // en espagnol, les autres formes justes de la meme place (« sobre la mesa », « en la mesa ») sous la phrase
  const montrerPhrase = (phrase, groupeTxt, cas, autres) => {
    phraseDite = phrase;
    $("dit").innerHTML = cible(groupeTxt ? marquerDans(phrase, groupeTxt, cas) : phrase) + traduction(tradPhrase(phrase))
      + (autres && autres.length ? '<span class="trad">' + T("aussi") + ' ' + cible(autres.join(" · ")) + '</span>' : "");
  };
  $("ecoute").addEventListener("click", () => dire(phraseDite));
  // ou il est : la place, la phrase au datif
  const position = () => {
    $("oPos").classList.add("actif"); $("oMvt").classList.remove("actif");
    $("regle").innerHTML = regle(DE_APP ? "regleWo" : "regleEs");
    const pu = $("puces"); pu.innerHTML = "";
    const liste = items().filter(it => it.place && (DE_APP || it.rep === pl(it.place).donde[0]))
      .concat(items().filter(it => !it.place && (DE_APP || it.vrais[0] === it.rep)));
    liste.forEach(it => {
      const b = document.createElement("button"); b.type = "button"; b.lang = APPRENDRE;
      b.innerHTML = it.place ? marquer(it.rep, "dat") : marquerDans(it.phrase.replace(/\.$/, ""), it.rep, "dat");
      b.addEventListener("click", () => {
        pu.querySelectorAll("button").forEach(x => x.classList.toggle("choisi", x === b));
        if (it.place) ici = it.place;
        $("vue").innerHTML = photo(it.img); montrerPhrase(it.phrase, it.rep, "dat", it.vrais.filter(x => x !== it.rep)); dire(it.phrase);
      });
      pu.appendChild(b);
    });
  };
  // ou il va : l'image d'avant (la place ou il etait) et la fleche, puis l'image d'apres
  const mouvement = () => {
    $("oMvt").classList.add("actif"); $("oPos").classList.remove("actif");
    $("regle").innerHTML = regle(DE_APP ? "regleWohin" : "regleEs");
    const pu = $("puces"); pu.innerHTML = "";
    const liste = PLACES().map(id => ({dest: id, rep: DE_APP ? pl(id).wohin : pl(id).mvVerbe + " " + pl(id).mvLieu, phrase: pl(id).mouvement}))
      .concat(Object.keys(D.gestes).map(id => ({img: id, rep: D.gestes[id][APPRENDRE].rep, phrase: D.gestes[id][APPRENDRE].phrase, entier: true})))
      .concat([{img: "saut-ueber", rep: D.ueber[APPRENDRE].rep, phrase: D.ueber[APPRENDRE].phrase, entier: true}]);
    liste.forEach(it => {
      const b = document.createElement("button"); b.type = "button"; b.lang = APPRENDRE;
      b.innerHTML = marquerDans(it.entier ? it.phrase.replace(/\.$/, "") : it.rep, it.rep, "akk");
      b.addEventListener("click", () => {
        pu.querySelectorAll("button").forEach(x => x.classList.toggle("choisi", x === b));
        const groupeTxt = DE_APP ? it.rep : null;
        montrerPhrase(it.phrase, groupeTxt, "akk"); dire(it.phrase);
        if (!it.dest){ $("vue").innerHTML = photo(it.img); return; }
        const avant = ici !== it.dest && compatibles(ici, it.dest) ? ici : depart(it.dest);
        $("vue").innerHTML = photo(avant, it.dest);
        const dest = it.dest, ph = $("photo"), f = document.querySelector("#vue .fleche");
        setTimeout(() => { if (!ph.isConnected) return; if (f) f.style.opacity = "0"; ph.src = imgSrc(dest); }, 1400);
        ici = it.dest;
      });
      pu.appendChild(b);
    });
  };
  $("oPos").addEventListener("click", position); $("oMvt").addEventListener("click", mouvement);
  position();
  // la piece s'ouvre sur Moritz devant le canape, sans parler : le son ne vient que d'un geste
  const premier = items().find(it => it.place === "sofa-vor");
  $("vue").innerHTML = photo("sofa-vor"); montrerPhrase(premier.phrase, premier.rep, "dat");
  const s = $("suite"); s.textContent = T("commencer"); s.hidden = false;
  s.onclick = () => { s.onclick = null; taire(); demarrer(); };
}

// LA PARTIE (3 nov. 2026, « le tirage suit les mots ») : la file des MOTS vient de l'app (Tirage.plan : les dus,
// les rates recents, puis au plus NEUFS_MAX nouveaux) ; chaque mot recoit une question d'une sorte qui le vise,
// jamais la meme sorte deux fois de suite, jamais deux fois la meme question. Rate, il revient plus loin.
// Recopie de familia.html (visuel/THEMES-ILLUSTRES.md : ces fonctions sont identiques d'un theme a l'autre).
const NEUFS_MAX = Q.get("seance") === "1" ? 3 : 10;
let vus = new Set(), sorteCourante = null, derniereSorte = null;
function cleQuestion(){
  const z = $("zone"), en = z.querySelector(".enonce");
  return sorteCourante + "|" + (en ? en.textContent : "") + "|" + Array.from(z.querySelectorAll("img")).map(i => i.getAttribute("src")).sort().join(",");
}
function montrer(){
  repondu = false; $("suite").hidden = true; $("bas").hidden = true;
  $("compte").textContent = (rang + 1) + " / " + file.length;
  $("barre").style.width = (rang / file.length * 100) + "%";
  // une question pour le mot du rang : d'une AUTRE sorte que la precedente et jamais deja vue dans la partie.
  // Si ce mot ne le permet pas, un mot plus loin dans la file passe devant ;
  // en dernier recours seulement, la meme sorte, puis une question deja vue.
  // (l'ecoute parle a chaque essai : on la fait taire pendant qu'on cherche, elle parle une fois choisie)
  const garde = dire; dire = () => {};
  const raz = so => { motQ = null; tradQ = null; apresQ = null; choixQ = null; sorteCourante = so; };
  const essai = (w, strict) => {
    const autres = melanger(SORTES.filter(x => x !== derniereSorte));
    for (const so of autres){
      for (let n = 0; n < 25; n++){
        raz(so);
        if (!EX[so](w)) break;
        if (!vus.has(cleQuestion())) return so;
      }
    }
    if (strict) return null;
    if (derniereSorte) for (let n = 0; n < 25; n++){           // la meme sorte, avec une question fraiche
      raz(derniereSorte);
      if (!EX[derniereSorte](w)) break;
      if (!vus.has(cleQuestion())) return derniereSorte;
    }
    for (const so of autres.concat(derniereSorte ? [derniereSorte] : [])){   // tout est deja vu : n'importe laquelle
      raz(so);
      if (EX[so](w)) return so;
    }
    return null;
  };
  let fait = essai(file[rang], true);
  for (let j = rang + 1; !fait && j < file.length; j++){
    fait = essai(file[j], true);
    if (fait) [file[rang], file[j]] = [file[j], file[rang]];
  }
  if (!fait) fait = essai(file[rang], false);
  dire = garde;
  if (fait === "entendre"){ const e = $("ecoute"); if (e) e.click(); }
  vus.add(cleQuestion()); derniereSorte = fait;
  window.scrollTo(0, 0);
}
function fin(){
  $("barre").style.width = "100%"; $("compte").textContent = file.length + " / " + file.length; $("suite").hidden = true;
  $("zone").innerHTML = '<div class="fin"><div class="score">' + T("score", {b: bons, n: file.length}) + '</div></div>';
  basDePartie();
  $("terminer").addEventListener("click", () => parler("fini", {bons, faits: file.length}));
}
// plus rien de du ni de nouveau : la partie le dit, et ne repose pas des mots deja sus
function toutRevu(prochaine){
  $("barre").style.width = "100%"; $("compte").textContent = ""; $("suite").hidden = true;
  const quand = Tirage.revu(prochaine, LANGUE);
  $("zone").innerHTML = '<div class="fin"><div class="score">' + (TIRAGE_TEXTES.revu[LANGUE] || TIRAGE_TEXTES.revu.fr) + '</div>'
    + (quand ? '<p class="consigne">' + (TIRAGE_TEXTES.prochaine[LANGUE] || TIRAGE_TEXTES.prochaine.fr).replace("{d}", quand) + '</p>' : "")
    + '</div>';
  basDePartie();
  $("terminer").addEventListener("click", () => parler("fini", {bons: 0, faits: 0}));
}
// « Encore des questions » : en fin de partie et quand tout est revu, jamais dans la seance (elle a sa longueur)
const boutonEncore = () => Q.get("seance") === "1" ? "" : '<button type="button" class="second" id="encore">' + (TIRAGE_TEXTES.encore[LANGUE] || TIRAGE_TEXTES.encore.fr) + '</button>';
function basDePartie(){
  const b = $("bas"); b.innerHTML = boutonEncore() + '<button type="button" class="principal" id="terminer">' + T("terminer") + '</button>'; b.hidden = false;
  const e = $("encore"); if (e) e.addEventListener("click", () => { b.hidden = true; encoreDesQuestions(); });
}
async function encoreDesQuestions(){
  const mots = motsDuTheme();
  file = Tirage.supplement(mots, await Tirage.demander(mots), NB); rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(null);
  montrer();
}
async function demarrer(){
  const mots = motsDuTheme();
  const plan = Tirage.plan(mots, await Tirage.demander(mots), NB, NEUFS_MAX);
  file = plan.file; rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(plan.prochaine);
  montrer();
}
$("suite").addEventListener("click", () => { if (!file.length) return; rang++; if (rang >= file.length) fin(); else montrer(); });
$("retour").addEventListener("click", () => parler("fermer"));
$("retour").setAttribute("aria-label", T("retourAria"));
$("titre").textContent = T("titre");
document.title = T("titre");
fetch("gato/gato.json?v=1").then(r => r.json()).then(d => {
  D = d;
  if (Q.get("seance") === "1") demarrer(); else decouvrir();
});
</script>
