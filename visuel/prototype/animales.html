<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les animaux</title>
<!--
  LES ANIMAUX (theme illustre de la vague 2, 3 nov. 2026), en espagnol et en allemand. La ferme a deja sa scene
  (bauernhof), ou l'on nomme les animaux en les touchant : ici un autre angle (regle 2 des themes) -- le genre et le
  pluriel (der / die / das compte ; el / la, -s / -es, pez -> peces), ou ils vivent (la ferme, la foret, la mer, la
  maison), ce qu'ils mangent (fressen, pas essen ; el pescado se mange, el pez nage), leur couleur (accordee en
  espagnol, avec terminaison devant le nom en allemand) et leur taille (größer als, mas grande que).
  Les animaux de la ferme sont ceux de la scene, le chat est Moritz (« Ou est le chat ? »). Toute la donnee et toutes
  les phrases viennent de visuel/animales/animales.py -> animales/animales.json : aucune phrase n'est ecrite ici,
  seuls les gabarits des questions (« Wo lebt ___ ? »). Un leurre n'est jamais qu'une valeur clairement fausse.
  Ouverte par l'app dans le cadre des scenes (sceneCadre), elle parle comme une scene : « exercice » et « bonne »
  a chaque reponse, « reponse » {mot, genre, cat, juste} pour le mot teste, « fini » et « fermer » a la fin.
  Parametres : apprendre=es|de, lang=<interface>, nuit=1, seance=1 (six questions, pas de decouverte),
  variante=latam (la voix), r=<AUDIO_REVISION>. Le tirage suit les mots (themes/tirage.js).
  L'ANGLAIS (4 nov. 2026, apprendre=en, variante=gb) : les memes images, aucune ecartee (ECARTEES_EN vide : ni
  enseigne, ni plaque, ni document), ses phrases a lui (EN_A, EN_H, EN_F, EN_C, EX_EN, plus bas). Il n'a ni genre ni
  accord : il enseigne le pluriel, regulier et irregulier (mouse -> mice, sheep, fish, deer qui ne changent pas, et
  sans image goose -> geese, wolf -> wolves, puppy -> puppies), there is / there are, on a farm mais in the forest,
  le present simple et son -s (A rabbit eats carrots. Cats eat fish. : le generique au pluriel, sans article),
  doesn't / don't, bigger than et the biggest, has (has got en britannique), it / its / their, et la couleur devant
  le nom, sans -s (white sheep, an orange fox). Americain / britannique : gray / grey, color / colour, has / has got.
-->
<style>
:root{--fond1:#82AFDB;--fond3:#C0D6EA;--encre:#1C2430;--gris:#4C566B;--ambre:#E8A23A;--ambre-f:#A86A0E;--vert:#2F9E6A;--rouge:#C8473A;
  --verre:rgba(255,255,255,.88);--bord:rgba(255,255,255,.95);--carte:#F7F8FA;--police:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html.nuit{--fond1:#0E1C26;--fond3:#18303F;--encre:#EEF2F5;--gris:#A9B8C4;--ambre-f:#E8A23A;--vert:#5CC98F;--rouge:#F07F72;
  --verre:rgba(20,36,50,.88);--bord:rgba(255,255,255,.14);--carte:#22384A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
/* LA PAGE A LA HAUTEUR DE L'ECRAN, comme une scene (regle commune du 3 nov. 2026) : le contenu defile dans le body ;
   sur iPhone, le bouton fixe d'un cadre dont le document deborde ne tombait pas au bas */
html{height:100%;overflow:hidden}
body{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;box-sizing:border-box}
body{background:linear-gradient(180deg,var(--fond1),var(--fond3));background-attachment:fixed;color:var(--encre);font-family:var(--police);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 90px) max(10px,env(safe-area-inset-left,0px))}
.haut{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto 10px}
.retour{width:42px;height:42px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);color:var(--encre);font:800 22px var(--police);cursor:pointer;flex:0 0 auto}
html[dir="rtl"] .retour{transform:scaleX(-1)}
.titre{flex:1;font-weight:900;font-size:18px}
.compte{font-weight:800;font-size:14px;color:var(--gris)}
.barre{max-width:560px;margin:0 auto 12px;height:6px;border-radius:3px;background:rgba(28,36,48,.12);overflow:hidden}
.barre i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2BB5AA,#14807A);transition:width .3s}
main{max-width:560px;margin:0 auto;background:var(--verre);border:1px solid var(--bord);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}
.consigne{font-size:14px;font-weight:700;color:var(--gris);margin:0}
.enonce{direction:ltr;text-align:left;background:var(--carte);border-radius:14px;padding:12px 14px;font-weight:800;line-height:1.5;font-size:17px}
.enonce.centre{text-align:center;font-size:19px}
.trou{display:inline-block;min-width:64px;border-bottom:2px solid var(--ambre);text-align:center;color:var(--ambre-f)}
/* les images sont en 4:3 */
.photo{display:block;width:100%;max-width:420px;margin:0 auto;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:16px;background:var(--carte)}
/* deux images cote a cote : la gauche reste a gauche en arabe et en persan */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;direction:ltr}
.duo img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block;background:var(--carte)}
/* le nombre d'animaux d'une question de pluriel sans image de groupe : « ein Fuchs, zwei ___ » */
.fois{display:block;text-align:center;font-weight:900;font-size:15px;color:var(--gris);margin-top:-4px}
/* des images a toucher */
.rangee{display:grid;grid-template-columns:1fr 1fr;gap:8px;direction:ltr}
.rangee.trois{grid-template-columns:1fr 1fr 1fr}
.rangee button{border:3px solid transparent;border-radius:14px;background:var(--carte);padding:0;cursor:pointer;overflow:hidden;display:block;position:relative}
.rangee img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.rangee button.juste{border-color:var(--vert)} .rangee button.faux{border-color:var(--rouge)}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix.centre{justify-content:center}
.choix button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:9px 15px;font:800 15px var(--police);cursor:pointer}
.choix button.juste{background:var(--vert);border-color:var(--vert);color:#fff}
.choix button.faux{background:var(--rouge);border-color:var(--rouge);color:#fff}
button:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
button:disabled{cursor:default}
.ecoute{width:48px;height:48px;border-radius:50%;border:2px solid var(--ambre);background:var(--verre);color:var(--encre);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ecoute svg{width:24px;height:24px}
.ecoute.grand{width:64px;height:64px;margin:0 auto} .ecoute.grand svg{width:32px;height:32px}
.retourMsg{min-height:1.4em;font-weight:800;font-size:15px;margin:0;line-height:1.45}
.retourMsg.ok{color:var(--vert)} .retourMsg.ko{color:var(--rouge)}
.retourMsg .phrase{display:block;color:var(--encre);font-weight:700}
.trad{display:block;font-size:13px;font-weight:600;font-style:italic;color:var(--gris);line-height:1.35;margin-top:2px}
.trad.faux{color:var(--rouge);font-style:italic}
.retourMsg .mot{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--gris);font-weight:700}
.retourMsg .mot .ecoute{width:38px;height:38px} .retourMsg .mot .ecoute svg{width:19px;height:19px}
/* la decouverte : la fiche de l'animal touche, puis les animaux par lieu */
.fiche{background:var(--carte);border-radius:14px;padding:10px;display:grid;grid-template-columns:minmax(120px,48%) 1fr;gap:12px;align-items:center}
.fiche img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;background:var(--verre)}
.fiche .mot{font-weight:900;font-size:22px;color:var(--ambre-f);line-height:1.15}
.fiche .pluriel{font-weight:800;font-size:15px;color:var(--encre);margin-top:2px}
.fiche .sens{font-weight:700;font-size:14px;color:var(--gris);margin-top:2px}
.fiche .dit{font-weight:800;font-size:15px;line-height:1.4;margin-top:6px}
.fiche .ligne{display:flex;align-items:center;gap:10px;margin-top:8px}
.lieu{margin:4px 0 0;font-weight:900;font-size:15px}
.lieu .trad{display:inline;margin-inline-start:6px}
.grille{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;direction:ltr}
.grille button{border:3px solid transparent;border-radius:12px;background:var(--carte);padding:0;cursor:pointer;overflow:hidden;display:block;position:relative}
.grille img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.grille button.choisi{border-color:var(--ambre)}
.regle{margin:0;font-size:14px;font-weight:700;line-height:1.5;color:var(--gris);background:var(--carte);border-radius:12px;padding:10px 12px}
.regle .exemples{display:block;margin-top:6px;color:var(--encre);font-weight:700;text-align:left}
/* TOUS LES BOUTONS D'ACTION TOUT EN BAS DE L'ECRAN, comme dans les scenes (Jacques, 3 nov. 2026) */
.suite{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:54px;border:0;border-radius:27px;z-index:5000;
  color:#fff;font:800 17px var(--police);background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer}
.suite[hidden]{display:none}
.bas{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;gap:10px;z-index:5000}
.bas[hidden]{display:none}
.bas button{flex:1;height:54px;border-radius:27px;font:800 16px var(--police);cursor:pointer;padding:0 10px}
.bas .principal{border:0;color:#fff;background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28)}
.bas .second{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.fin{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:10px 0}
.fin .score{font-size:22px;font-weight:900}
[lang]{unicode-bidi:isolate}
</style>
</head>
<body>
<div class="haut"><button class="retour" id="retour" type="button">‹</button><div class="titre" id="titre"></div><div class="compte" id="compte" dir="ltr"></div></div>
<div class="barre"><i id="barre"></i></div>
<main id="zone"></main>
<button class="suite" id="suite" type="button" hidden></button>
<div class="bas" id="bas" hidden></div>
<script src="themes/tirage.js?v=1"></script>
<script src="themes/voix.js?v=4"></script>
<script src="themes/zoom.js?v=3"></script>
<script src="themes/verre.js?v=5"></script>
<script>
const Q = new URLSearchParams(location.search);
// l'anglais (4 nov. 2026, « il manque beaucoup de themes en anglais ») : les memes images, ses phrases a lui ; variante=gb
const APPRENDRE = ["de", "en"].includes(Q.get("apprendre")) ? Q.get("apprendre") : "es";
const GB = APPRENDRE === "en" && Q.get("variante") === "gb";
const EN_APP = APPRENDRE === "en";
const DE_APP = APPRENDRE === "de";
const LANGUE = (l => ["fr", "en", "tr", "uk", "fa", "ar", "pt", "pl", "ru", "de"].includes(l) ? l : "fr")(((Q.get("lang") || "fr").toLowerCase().split(/[-_]/)[0]));
if (Q.get("nuit") === "1") document.documentElement.classList.add("nuit");
document.documentElement.lang = LANGUE;
document.documentElement.dir = (LANGUE === "fa" || LANGUE === "ar") ? "rtl" : "ltr";
// agrandir (themes/zoom.js) : un toucher sur la photo d'une question, la fiche ou les deux animaux compares ; la loupe
// sur ce qu'on touche pour repondre (les images a choisir) et sur les animaux de la decouverte
Zoom.init({direct: "img.photo, .duo img, .fiche img", loupe: ".rangee button, .grille button", langue: LANGUE});
// vingt questions seul (Jacques, 3 nov.), six dans la seance du jour, sans la decouverte
const NB = Q.get("seance") === "1" ? 6 : 20;

const TEXTES = {
  titre:     {fr:"Les animaux", en:"Animals", tr:"Hayvanlar", uk:"Тварини", fa:"حیوانات", ar:"الحيوانات", pt:"Os animais", pl:"Zwierzęta", ru:"Животные", de:"Die Tiere"},
  intro:     {fr:"Touche un animal : tu vois son nom et son pluriel, où il vit et ce qu'il mange, et tu l'entends.", en:"Tap an animal to see its name and plural, where it lives and what it eats, and to hear it.", tr:"Bir hayvana dokun: adını ve çoğulunu, nerede yaşadığını ve ne yediğini gör ve dinle.", uk:"Торкнися тварини: побачиш її назву й множину, де вона живе і що їсть, і почуєш.", fa:"روی یک حیوان بزن: نام و جمعش، جایی که زندگی می‌کند و آنچه می‌خورد را می‌بینی و می‌شنوی.", ar:"المس حيوانًا: ترى اسمه وجمعه وأين يعيش وماذا يأكل، وتسمعه.", pt:"Toque em um animal: você vê o nome e o plural, onde vive e o que come, e ouve.", pl:"Dotknij zwierzęcia: zobaczysz jego nazwę i liczbę mnogą, gdzie żyje i co je, i usłyszysz.", ru:"Нажми на животное: увидишь его название и множественное число, где оно живёт и что ест, и услышишь.", de:"Tippe auf ein Tier: Du siehst seinen Namen und die Mehrzahl, wo es lebt und was es frisst, und hörst es."},
  regleDe:   {fr:"Chaque nom a son article, à apprendre avec lui : der, die ou das. Un mot en -chen est toujours das. Au pluriel, l'article est toujours die, et c'est la fin du mot qui change, souvent avec un Umlaut. Un animal frisst, une personne isst.", en:"Every noun has its article, to learn with it: der, die or das. A word ending in -chen is always das. In the plural the article is always die, and the end of the word changes, often with an umlaut. An animal frisst, a person isst.", tr:"Her ismin artikeli vardır, isimle birlikte öğrenilir: der, die ya da das. -chen ile biten kelime her zaman das'tır. Çoğulda artikel her zaman die'dir; kelimenin sonu değişir, çoğu zaman Umlaut ile. Hayvan frisst, insan isst.", uk:"Кожен іменник має свій артикль, його вчать разом зі словом: der, die або das. Слово на -chen завжди das. У множині артикль завжди die, а змінюється кінець слова, часто з умлаутом. Тварина frisst, людина isst.", fa:"هر اسم حرف تعریف خودش را دارد که باید همراهش یاد گرفت: der، die یا das. واژه‌ای که به ‎-chen ختم شود همیشه das است. در جمع، حرف تعریف همیشه die است و پایان واژه تغییر می‌کند، اغلب با اوملاوت. حیوان frisst، انسان isst.", ar:"لكل اسم أداة تعريف تُحفظ معه: der أو die أو das. الكلمة المنتهية بـ ‎-chen دائمًا das. في الجمع تكون الأداة دائمًا die، ويتغيّر آخر الكلمة، وغالبًا مع الأوملاوت. الحيوان frisst، والإنسان isst.", pt:"Cada substantivo tem seu artigo, que se aprende junto: der, die ou das. Uma palavra terminada em -chen é sempre das. No plural, o artigo é sempre die, e o fim da palavra muda, muitas vezes com trema. Um animal frisst, uma pessoa isst.", pl:"Każdy rzeczownik ma swój rodzajnik, którego uczy się razem z nim: der, die albo das. Słowo zakończone na -chen to zawsze das. W liczbie mnogiej rodzajnik to zawsze die, a zmienia się koniec słowa, często z umlautem. Zwierzę frisst, człowiek isst.", ru:"У каждого существительного свой артикль, его учат вместе со словом: der, die или das. Слово на -chen всегда das. Во множественном числе артикль всегда die, а меняется конец слова, часто с умлаутом. Животное frisst, человек isst.", de:"Jedes Nomen hat seinen Artikel, den man mitlernt: der, die oder das. Ein Wort auf -chen ist immer das. Im Plural ist der Artikel immer die, und das Ende des Wortes ändert sich, oft mit Umlaut. Ein Tier frisst, ein Mensch isst."},
  regleEs:   {fr:"el ou la : le genre s'apprend avec le mot (la oveja, el ratón). Au pluriel : -s après une voyelle, -es après une consonne, et z devient c (el pez, los peces). La couleur s'accorde avec l'animal (la oveja blanca), sauf marrón, gris, rosa, naranja et azul, qui ne changent pas. El pez vit dans l'eau, el pescado se mange.", en:"el or la: learn the gender with the word (la oveja, el ratón). In the plural: -s after a vowel, -es after a consonant, and z becomes c (el pez, los peces). The colour agrees with the animal (la oveja blanca), except marrón, gris, rosa, naranja and azul, which never change. El pez lives in the water; el pescado is fish you eat.", tr:"el mi la mı: cinsiyet kelimeyle birlikte öğrenilir (la oveja, el ratón). Çoğulda ünlüden sonra -s, ünsüzden sonra -es gelir; z ise c olur (el pez, los peces). Renk hayvana uyar (la oveja blanca); marrón, gris, rosa, naranja ve azul değişmez. El pez suda yaşar, el pescado yenen balıktır.", uk:"el чи la: рід вчать разом зі словом (la oveja, el ratón). У множині: -s після голосної, -es після приголосної, а z стає c (el pez, los peces). Колір узгоджується з твариною (la oveja blanca), крім marrón, gris, rosa, naranja й azul, які не змінюються. El pez живе у воді, el pescado — риба, яку їдять.", fa:"el یا la: جنس را همراه واژه یاد بگیر (la oveja، el ratón). در جمع: بعد از مصوت ‎-s، بعد از صامت ‎-es، و z به c تبدیل می‌شود (el pez، los peces). رنگ با حیوان هماهنگ می‌شود (la oveja blanca)، جز marrón، gris، rosa، naranja و azul که تغییر نمی‌کنند. El pez در آب زندگی می‌کند؛ el pescado ماهیِ خوردنی است.", ar:"el أم la: يُحفظ الجنس مع الكلمة (la oveja، el ratón). في الجمع: ‎-s بعد حرف علّة، و‎-es بعد حرف ساكن، ويصير z حرف c ‏(el pez، los peces). يتوافق اللون مع الحيوان (la oveja blanca)، إلا marrón وgris وrosa وnaranja وazul فلا تتغيّر. El pez يعيش في الماء، وel pescado هو السمك الذي يُؤكل.", pt:"el ou la: o gênero se aprende com a palavra (la oveja, el ratón). No plural: -s depois de vogal, -es depois de consoante, e o z vira c (el pez, los peces). A cor concorda com o animal (la oveja blanca), menos marrón, gris, rosa, naranja e azul, que não mudam. El pez vive na água; el pescado é o peixe que se come.", pl:"el czy la: rodzaju uczy się razem ze słowem (la oveja, el ratón). W liczbie mnogiej: -s po samogłosce, -es po spółgłosce, a z zmienia się w c (el pez, los peces). Kolor zgadza się ze zwierzęciem (la oveja blanca), oprócz marrón, gris, rosa, naranja i azul, które się nie zmieniają. El pez żyje w wodzie, el pescado to ryba do jedzenia.", ru:"el или la: род учат вместе со словом (la oveja, el ratón). Во множественном числе: -s после гласной, -es после согласной, а z меняется на c (el pez, los peces). Цвет согласуется с животным (la oveja blanca), кроме marrón, gris, rosa, naranja и azul, которые не меняются. El pez живёт в воде, el pescado — рыба, которую едят.", de:"el oder la: Das Geschlecht lernt man mit dem Wort (la oveja, el ratón). Im Plural: -s nach einem Vokal, -es nach einem Konsonanten, und z wird zu c (el pez, los peces). Die Farbe richtet sich nach dem Tier (la oveja blanca), außer marrón, gris, rosa, naranja und azul, die gleich bleiben. El pez lebt im Wasser, el pescado ist Fisch zum Essen."},
  ecouter:   {fr:"Écouter", en:"Listen", tr:"Dinle", uk:"Слухати", fa:"گوش بده", ar:"استمع", pt:"Ouvir", pl:"Posłuchaj", ru:"Слушать", de:"Anhören"},
  commencer: {fr:"Commencer", en:"Start", tr:"Başla", uk:"Почати", fa:"شروع", ar:"ابدأ", pt:"Começar", pl:"Zacznij", ru:"Начать", de:"Starten"},
  nom:       {fr:"Regarde l'image : quel animal est-ce ?", en:"Look at the picture: which animal is it?", tr:"Resme bak: bu hangi hayvan?", uk:"Подивися на зображення: що це за тварина?", fa:"به تصویر نگاه کن: این کدام حیوان است؟", ar:"انظر إلى الصورة: ما هذا الحيوان؟", pt:"Olhe a imagem: que animal é?", pl:"Spójrz na obrazek: jakie to zwierzę?", ru:"Посмотри на картинку: что это за животное?", de:"Sieh dir das Bild an: Welches Tier ist das?"},

// les exemples de la regle, dans la langue apprise
const EXEMPLES = {
  de: "der Hund → die Hunde · die Kuh → die Kühe · das Huhn → die Hühner · der Bär → die Bären · das Eichhörnchen → die Eichhörnchen · Die Kuh frisst Gras.",
  es: "la vaca → las vacas · el ratón → los ratones · el pez → los peces · la oveja blanca · el oso marrón · El delfín come pescado."
};
function T(cle, v){ let s = (TEXTES[cle] || {})[LANGUE] || (TEXTES[cle] || {}).fr || cle; for (const k in (v || {})) s = s.split("{" + k + "}").join(v[k]); return s; }

// ---------- la donnee (animales.json, fabrique par visuel/animales/animales.py) ----------
let D = null;
// en anglais, aucune image n'est ecartee (regardees une a une le 4 nov. 2026 : ni enseigne, ni plaque, ni document)
const ECARTEES_EN = [];
const ANI = () => Object.keys(D.animaux).filter(a => !EN_APP || !ECARTEES_EN.includes(a));
const an = a => D.animaux[a];
const P = cle => D.phrases[APPRENDRE][cle];                    // une phrase de la langue apprise, par sa cle
const sg = (a, maj) => { const [art, nom] = an(a)[APPRENDRE]; return (maj ? art.charAt(0).toUpperCase() + art.slice(1) : art) + " " + nom; };
const plDe = (a, maj) => EN_APP ? (maj ? "Two " : "two ") + an(a).en[2] : DE_APP ? (maj ? "Die " : "die ") + an(a).de[2] : ((an(a).es[0] === "el" ? "los" : "las") + " " + an(a).es[2]).replace(/^l/, maj ? "L" : "l");
const femEs = a => an(a).es[0] === "la";
const lieu = h => D.habitats[h][APPRENDRE];
const aliment = f => D.aliments[f][APPRENDRE];
const couleur = (c, a) => DE_APP ? D.couleurs[c].de : D.couleurs[c].es[femEs(a) ? 1 : 0];
// ou il vit vraiment, et ou il ne vit clairement pas (jamais un lieu « aussi »)
const vitLa = (a, h) => an(a).ou === h || an(a).aussi.includes(h);
const pasLa = (a, h) => an(a).ou && !vitLa(a, h);
// la phrase entiere traduite en francais, anglais, portugais (et en allemand pour qui apprend l'espagnol), comme la
// famille ; ailleurs, le mot teste et sa traduction tiree du corpus (animales.json, gloses)
const PHRASE_TRADUITE = LANGUE !== APPRENDRE && (["fr", "en", "pt"].includes(LANGUE) || (LANGUE === "de" && APPRENDRE === "es"));
const tradPhrase = p => PHRASE_TRADUITE ? (((D.trad[APPRENDRE] || {})[p] || {})[LANGUE] || null) : null;
const traduction = t => t ? '<span class="trad" dir="auto">' + t + '</span>' : "";
const glose = m => { if (LANGUE === APPRENDRE) return ""; const g = (D.gloses[APPRENDRE] || {})[m] || {}; return g[LANGUE] || g.fr || ""; };

// ---------- la voix : le fichier enregistre s'il existe, sinon le telephone (themes/voix.js) ----------
let dire = t => Voix.dire(t);
const taire = () => Voix.arreter();
const HP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

// ---------- utilitaires ----------
const $ = id => document.getElementById(id);
const melanger = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
const hasard = a => a[Math.floor(Math.random() * a.length)];
const uniques = a => a.filter((x, i) => a.indexOf(x) === i);
const cible = t => '<span lang="' + APPRENDRE + '" dir="ltr">' + t + '</span>';
// en persan et en arabe, chaque passage en lettres latines s'isole, sinon l'algorithme bidi en retourne les mots
const isoler = s => document.documentElement.dir !== "rtl" ? s : s.replace(/[A-Za-zÀ-ÿñÑßäöüÄÖÜ-]+(?:[ ()]+[A-Za-zÀ-ÿñÑßäöüÄÖÜ-]+)*\)?/g, m => '<span dir="ltr">' + m + '</span>');
const imgSrc = a => "animales/" + a + ".webp";
const photo = a => '<img class="photo" alt="" src="' + imgSrc(a) + '">';
function parler(type, extra){ try{ parent.postMessage(Object.assign({source:"wortando-scene", type}, extra || {}), "*"); }catch(e){} }
let file = [], rang = 0, bons = 0, repondu = false;
// LE MOT DE LA QUESTION (regle 3, 3 nov. : « un mot appris compte partout ») : juger() l'envoie (« reponse »), l'app
// fait avancer sa carte (revisionDeScene). Un animal, un lieu, un aliment : un nom du corpus {mot, genre}.
let motQ = null, tradQ = null, choixQ = null, animalQ = null;     // animalQ : l'animal de la question (le genre d'une couleur choisie)

// LES MOTS DU THEME, a la forme du corpus : les quinze animaux, les quatre lieux, les aliments. En allemand, der Fisch
// est a la fois l'animal et ce qu'on mange : UN mot, avec ses deux roles.
let MOTS = null;
function motsDuTheme(){
  if (MOTS) return MOTS;
  if (EN_APP) return (MOTS = motsDuThemeEn());
  const out = [], par = {};
  const ajouter = (mot, genre, role, id) => {
    const k = genre + " " + mot;
    if (!par[k]){ par[k] = {k, mot, genre, roles: {}}; out.push(par[k]); }
    par[k].roles[role] = id;
  };
  ANI().forEach(a => ajouter(an(a)[APPRENDRE][1], an(a)[APPRENDRE][0], "a", a));
  Object.keys(D.habitats).forEach(h => { const [m, g] = D.habitats[h][DE_APP ? "motDe" : "motEs"]; ajouter(m, g, "h", h); });
  Object.keys(D.aliments).forEach(f => { const [m, g] = D.aliments[f][DE_APP ? "motDe" : "motEs"]; ajouter(m, g, "f", f); });
  MOTS = out;
  return MOTS;
}
const motAnimal = a => motsDuTheme().find(w => w.roles.a === a);
const motLieu = h => motsDuTheme().find(w => w.roles.h === h);
const motAliment = f => motsDuTheme().find(w => w.roles.f === f);
const motDe = w => ({mot: w.mot, genre: w.genre || null, cat: w.cat || null});
// le mot de la question : celui que la file demande (w), sinon le mot de l'animal (ou du lieu, de l'aliment) vise
function viser(w, defaut){ motQ = motDe(w || defaut); }

// LE MAUVAIS CHOIX TRADUIT (decision de Jacques du 3 nov., format commun « Tu as choisi : X — sa traduction ») : un
// animal (nomme ou touche), un lieu (« im Meer » -> dans la mer), un aliment, une couleur. Un article, un pluriel, une
// forme du verbe, Richtig / Falsch : rien a traduire.
function choixTraduit(c){
  if (EN_APP) return choixTraduitEn(c);
  if (!c || LANGUE === APPRENDRE) return null;
  if (D.animaux[c]) return {aff: sg(c), sens: glose(an(c)[APPRENDRE][1])};
  const a = ANI().find(x => sg(x) === c);
  if (a) return {aff: c, sens: glose(an(a)[APPRENDRE][1])};
  const h = Object.keys(D.habitats).find(x => lieu(x) === c);
  if (h){ const t = ((D.tradLieux[APPRENDRE] || {})[c] || {})[LANGUE]; return {aff: c, sens: t || glose(D.habitats[h][DE_APP ? "motDe" : "motEs"][0])}; }
  const f = Object.keys(D.aliments).find(x => aliment(x) === c);
  if (f) return {aff: c, sens: glose(D.aliments[f][DE_APP ? "motDe" : "motEs"][0])};
  // une couleur : en espagnol, traduite au genre de l'animal de la question (el perro gris -> gris, la vaca gris -> grise)
  const tc = ((D.tradCouleurs[APPRENDRE] || {})[DE_APP ? c : c + "|" + (animalQ && femEs(animalQ) ? 1 : 0)] || {});
  if (tc[LANGUE]) return {aff: c, sens: tc[LANGUE]};
  const coul = Object.keys(D.couleurs).find(x => D.couleurs[x].de === c || D.couleurs[x].es.includes(c));
  if (coul){ const mots = D.couleurs[coul][DE_APP ? "motsDe" : "motsEs"]; return {aff: c, sens: mots.map(glose).filter(Boolean).join(", ")}; }
  return null;
}

// apres la reponse : la phrase juste et sa traduction, le mot teste et sa traduction ; LA VOIX DIT LA PHRASE AFFICHEE
// EN ENTIER (Jacques, 3 nov. : « Oui, partout ») ; le haut-parleur de la ligne du mot la redit
function juger(ok, bonneTexte, phrase){
  if (repondu) return; repondu = true;
  if (ok) bons++;
  parler("exercice", {juste: ok}); if (ok){ parler("bonne"); Voix.bravo(); }   // le son des cartes et des scenes
  if (motQ) parler("reponse", {mot: motQ.mot, genre: motQ.genre || null, cat: motQ.cat || null, juste: ok});
  if (!ok && file[rang]) Tirage.remettre(file, rang, file[rang], NB);   // rate : il revient dans la partie
  const m = $("msg"); m.className = "retourMsg " + (ok ? "ok" : "ko");
  const mt = motQ ? {aff: (motQ.genre ? motQ.genre + " " : "") + motQ.mot, sens: glose(motQ.mot)} : null;

    + (phrase && phrase !== bonneTexte ? '<span class="phrase">' + cible(phrase) + '</span>' : "")
    + traduction(tradQ || tradPhrase(phrase || bonneTexte))
    + (!ok && (c => c && c.sens ? '<span class="trad faux" dir="auto">' + T("choix", {r: cible(c.aff)}) + " — " + c.sens + '</span>' : "")(choixTraduit(choixQ)) || "")
    + (mt ? '<span class="mot"><button type="button" class="ecoute" id="redire" aria-label="' + T("ecouter") + '">' + HP + '</button>' + cible(mt.aff) + (mt.sens ? ' · <span dir="auto">' + mt.sens + '</span>' : "") + '</span>' : "");
  if (mt) $("redire").addEventListener("click", () => dire(phrase || bonneTexte));
  dire(phrase || bonneTexte);
  const s = $("suite"); s.textContent = rang + 1 >= file.length ? T("terminer") : T("suivant"); s.hidden = false;
}
function boutons(conteneur, options, bonne, apres){
  let bon;
  options.forEach(o => {
    const b = document.createElement("button"); b.type = "button"; b.lang = APPRENDRE; b.dir = "ltr"; b.textContent = o; if (o === bonne) bon = b;
    b.addEventListener("click", () => {
      conteneur.querySelectorAll("button").forEach(x => { x.disabled = true; if (x === bon) x.classList.add("juste"); });
      if (b !== bon) b.classList.add("faux");
      choixQ = o; apres(o === bonne);
    });
    conteneur.appendChild(b);
  });
}
// des images a toucher : la bonne est a ; data-id pour les controles (tests/themes_illustres.py)
function images(conteneur, ids, bonne, apres){

      if (b !== bon) b.classList.add("faux");
      choixQ = a; apres(a === bonne);
    });
    conteneur.appendChild(b);
  });
}
// l'ecran d'une question : la consigne, une image (ou rien), l'enonce, les choix, le message
function ecran(consigne, image, enonce, centre){
  $("zone").innerHTML = '<p class="consigne">' + T(consigne) + '</p>' + (image || "")
    + '<div class="enonce' + (centre ? " centre" : "") + '">' + cible(enonce) + '</div><div class="choix' + (centre ? " centre" : "") + '" id="choix"></div><p class="retourMsg" id="msg"></p>';
}
const trou = () => '<span class="trou" id="trou">?</span>';
const avecTrou = s => s.replace("___", trou());
// une phrase avec un trou a la place d'un mot (« Die Kuh ___ Gras. ») : le mot doit y etre une seule fois, entier
function troue(phrase, mot){
  const t = phrase.split(" "), i = t.findIndex(x => x.replace(/[.,]$/, "") === mot);
  if (i < 0) return null;
  t[i] = "___" + t[i].slice(mot.length);
  return t.join(" ");
}
// les questions de gabarit, dans la langue apprise ; les phrases, elles, viennent toutes de la donnee
const QDE = {
  nom: "Was ist das?", wo: a => "Wo lebt " + sg(a) + "?", frisst: a => "Was frisst " + sg(a) + "?", farbe: a => "Welche Farbe hat " + sg(a) + "?",
  welchesLebt: h => "Welches Tier lebt " + lieu(h) + "?", welchesFrisst: f => "Welches Tier frisst " + aliment(f) + "?",
  groesser: "Welches Tier ist größer?", kleiner: "Welches Tier ist kleiner?", vrai: "Richtig", faux: "Falsch"
};
const QES = {
  nom: "¿Qué animal es?", wo: a => "¿Dónde vive " + sg(a) + "?", frisst: a => "¿Qué come " + sg(a) + "?",
  welchesLebt: h => "¿Qué animal vive " + lieu(h) + "?", welchesFrisst: f => "¿Qué animal come " + aliment(f) + "?",
  groesser: "¿Qué animal es más grande?", kleiner: "¿Qué animal es más pequeño?", vrai: "Verdadero", faux: "Falso"
};
const QL = DE_APP ? QDE : QES;
// un animal que la file vise (w.roles.a), ou au hasard parmi ceux qui conviennent ; null si aucun
function animalPour(w, filtre){
  if (w && w.roles.a) return filtre(w.roles.a) ? w.roles.a : null;
  if (w) return null;
  const c = ANI().filter(filtre);
  return c.length ? hasard(c) : null;
}

  comparer(w){

// ---------- L'ANGLAIS (4 nov. 2026) ----------
// Les phrases sont ecrites pour l'anglais, fabriquees depuis les memes animaux (animales.json : ou il vit, ce qu'il
// mange, sa couleur, sa taille) ; rien n'est traduit de l'espagnol. Ce que le theme enseigne : le pluriel, regulier et
// irregulier (mouse -> mice, sheep -> sheep), there is / there are, on a farm / in the forest, le present simple et son
// -s (A rabbit eats carrots. Cats eat fish. : le generique au pluriel, sans article), doesn't / don't, bigger than et
// the biggest, has (has got en britannique), it / its, et la couleur devant le nom, sans -s (white sheep).
const anA = s => /^[aeiou]/i.test(s) ? "an" : "a";
const avecA = s => anA(s) + " " + s;
const maj = s => s.charAt(0).toUpperCase() + s.slice(1);
const GRIS = GB ? "grey" : "gray", COULEUR = GB ? "colour" : "color";
// LES ANIMAUX EN ANGLAIS. mot, pl : le nom et son pluriel (le corpus anglais) ; faux : des pluriels clairement faux ;
// fr : [le, les, un, genre] ; groupe : l'image en montre plusieurs (3, ou « many » pour le banc de poissons) ;
// img: false : sans image (les pluriels irreguliers goose, wolf, deer, puppy, et rabbit pour « A rabbit eats carrots ») ;
// ou, aussi : ou il vit, et ou il peut AUSSI vivre (jamais un leurre) ; habPl : « Cows live on a farm » est vrai en
// general (pas « Dogs live on a farm ») ; pasSg : « A fish lives in the sea » serait faux (le poisson rouge) ;
// mange, non : ce qu'il mange, et ce qu'il ne mange clairement pas (le leurre, la negation) ; pattes, ailes : has /
// has got ; ici : ou l'image le montre (There is a cat on the sofa) ; its : une phrase de l'image avec son possessif.
const EN_A = {
  kuh:   {mot: "cow", pl: "cows", faux: ["cow", "cowes"], fr: ["la vache", "les vaches", "une vache", "f"], ou: "bauernhof", habPl: true,
          mange: ["grass"], non: ["meat", "fish"], pattes: 4, ici: ["on the farm", "à la ferme"],
          its: ["The cow is eating grass. ___ legs are white.", "Its", "La vache mange de l'herbe. Ses pattes sont blanches."]},
  pferd: {mot: "horse", pl: "horses", faux: ["horse", "horsees"], fr: ["le cheval", "les chevaux", "un cheval", "m"], ou: "bauernhof", habPl: true,

  quel(w){

  // « What does the cow eat? » / « What do cows eat? » grass / meat / fish : seulement ce qu'il ne mange clairement pas
  manger(w){

  // le present simple et son -s : « The cow ___ grass. » eats / eat / eating ; « Cows ___ on a farm. » live / lives
  verbe(w){

  // la negation : « A cow ___ eat meat. » doesn't / don't / isn't ; « Cows ___ live in the sea. » don't
  negatif(w){

        en: maj(sujEn(a, n)) + " ___ eat " + EN_F[f].aff + ".", fr: maj(sujFr(a, n)) + " ne " + (n === "sg" ? "mange" : "mangent") + " pas " + EN_F[f].pas + "."})));

        ns.forEach(n => cand.push({a, n, t: "live", mot: motH(h),
          en: maj(sujEn(a, n)) + " ___ live " + EN_H[h].lieu + ".", fr: maj(sujFr(a, n)) + " ne " + (n === "sg" ? "vit" : "vivent") + " pas " + EN_H[h].fr + "."}));
      });
    });
    const c = cand.filter(x => !w || x.a === w.roles.a || x.mot === w || (wV(w) && w.roles.v === x.t));
    if (!c.length) return false;
    const x = hasard(c);
    viser(w, motA(x.a));
    const rep = x.n === "sg" ? "doesn't" : "don't", opts = x.n === "sg" ? ["doesn't", "don't", "isn't"] : ["don't", "doesn't", "aren't"];
    const phrase = E(x.en.replace("___", rep), x.fr);

  entendre(w){

  // True or False : ou il vit, ce qu'il mange, sa couleur -- le faux n'est jamais qu'une valeur clairement fausse

  // « Which animal is bigger? » : deux animaux a deux crans de taille au moins, on touche le bon
  taille(w){

    const phrase = E(maj(avecA(A(rep).mot)) + " is " + (plus ? "bigger" : "smaller") + " than " + avecA(A(autre).mot) + ".",

  // « A horse is ___ than a dog. » bigger / more big / biggest (jamais « more big », jamais le superlatif avec than)
  comparer(w){

    const enonce = maj(avecA(A(a).mot)) + " is ___ than " + avecA(A(b).mot) + ".";

  // le superlatif : trois animaux, « The cow is the ___ of the three. » biggest / bigger / most big
  superlatif(w){

      if (petits.length >= 2) cand.push([true, a, petits]);

    $("ecoute").addEventListener("click", () => dire(dit));
    dire(dit);

  const li = $("lieux");

    li.insertAdjacentHTML("beforeend", '<p class="lieu">' + cible(lieu(h)) + (t && LANGUE !== APPRENDRE ? '<span class="trad" dir="auto">' + t + '</span>' : "") + '</p>');

    liste.forEach(a => {
      const b = document.createElement("button"); b.type = "button"; b.dataset.id = a; b.setAttribute("aria-label", sg(a));

      g.appendChild(b);
    });
    li.appendChild(g);
  });
  // la fiche s'ouvre sur la vache, sans parler : le son ne vient que d'un geste
  const garde = dire; dire = () => {}; montrerFiche(D.groupes[0][1][0]); dire = garde;
  const s = $("suite"); s.textContent = T("commencer"); s.hidden = false;
  s.onclick = () => { s.onclick = null; taire(); demarrer(); };
}
// tout ce que la page peut dire dans la decouverte : l'inventaire des voix (visuel/voix_themes.py)
function textesAVoix(){
  if (D && EN_APP) return Object.values(D.dit.en).concat(IMG().map(nomAff));        // l'ecoute dit « a cow », et « sheep » pour une image de groupe
  return D ? Object.values(D.dit[APPRENDRE]).concat(ANI().map(a => sg(a))) : [];
}

// LA PARTIE (3 nov. 2026, « le tirage suit les mots ») : la file des MOTS vient de l'app (Tirage.plan : les dus,
// les rates recents, puis au plus NEUFS_MAX nouveaux) ; chaque mot recoit une question d'une sorte qui le vise,
// jamais la meme sorte deux fois de suite, jamais deux fois la meme question. Rate, il revient plus loin.
// Recopie de familia.html (visuel/THEMES-ILLUSTRES.md : ces fonctions sont identiques d'un theme a l'autre).
const NEUFS_MAX = Q.get("seance") === "1" ? 3 : 10;
let vus = new Set(), sorteCourante = null, derniereSorte = null;
function cleQuestion(){
  const z = $("zone"), en = z.querySelector(".enonce");
  return sorteCourante + "|" + (en ? en.textContent : "") + "|" + Array.from(z.querySelectorAll("img")).map(i => i.getAttribute("src")).sort().join(",");
}
function montrer(){
  repondu = false; $("suite").hidden = true; $("bas").hidden = true;
  $("compte").textContent = (rang + 1) + " / " + file.length;
  $("barre").style.width = (rang / file.length * 100) + "%";
  // une question pour le mot du rang : d'une AUTRE sorte que la precedente et jamais deja vue dans la partie.
  // Si ce mot ne le permet pas, un mot plus loin dans la file passe devant ;
  // en dernier recours seulement, la meme sorte, puis une question deja vue.
  // (l'ecoute parle a chaque essai : on la fait taire pendant qu'on cherche, elle parle une fois choisie)
  const garde = dire; dire = () => {};
  const raz = so => { motQ = null; tradQ = null; choixQ = null; animalQ = null; sorteCourante = so; };
  const essai = (w, strict) => {
    const autres = melanger(SORTES.filter(x => x !== derniereSorte));
    for (const so of autres){
      for (let n = 0; n < 25; n++){
        raz(so);
        if (!EX[so](w)) break;
        if (!vus.has(cleQuestion())) return so;
      }
    }
    if (strict) return null;
    if (derniereSorte) for (let n = 0; n < 25; n++){           // la meme sorte, avec une question fraiche
      raz(derniereSorte);
      if (!EX[derniereSorte](w)) break;
      if (!vus.has(cleQuestion())) return derniereSorte;
    }
    for (const so of autres.concat(derniereSorte ? [derniereSorte] : [])){   // tout est deja vu : n'importe laquelle
      raz(so);
      if (EX[so](w)) return so;
    }
    return null;
  };
  let fait = essai(file[rang], true);
  for (let j = rang + 1; !fait && j < file.length; j++){
    fait = essai(file[j], true);
    if (fait) [file[rang], file[j]] = [file[j], file[rang]];
  }
  if (!fait) fait = essai(file[rang], false);
  dire = garde;
  if (fait === "entendre"){ const e = $("ecoute"); if (e) e.click(); }
  vus.add(cleQuestion()); derniereSorte = fait;
  window.scrollTo(0, 0); document.body.scrollTop = 0;
}
function fin(){
  $("barre").style.width = "100%"; $("compte").textContent = file.length + " / " + file.length; $("suite").hidden = true;
  $("zone").innerHTML = '<div class="fin"><div class="score">' + T("score", {b: bons, n: file.length}) + '</div></div>';
  basDePartie();
  $("terminer").addEventListener("click", () => parler("fini", {bons, faits: file.length}));
}
// plus rien de du ni de nouveau : la partie le dit, et ne repose pas des mots deja sus
function toutRevu(prochaine){
  $("barre").style.width = "100%"; $("compte").textContent = ""; $("suite").hidden = true;
  const quand = Tirage.revu(prochaine, LANGUE);
  $("zone").innerHTML = '<div class="fin"><div class="score">' + (TIRAGE_TEXTES.revu[LANGUE] || TIRAGE_TEXTES.revu.fr) + '</div>'
    + (quand ? '<p class="consigne">' + (TIRAGE_TEXTES.prochaine[LANGUE] || TIRAGE_TEXTES.prochaine.fr).replace("{d}", quand) + '</p>' : "")
    + '</div>';
  basDePartie();
  $("terminer").addEventListener("click", () => parler("fini", {bons: 0, faits: 0}));
}
// « Encore des questions » : en fin de partie et quand tout est revu, jamais dans la seance (elle a sa longueur)
const boutonEncore = () => Q.get("seance") === "1" ? "" : '<button type="button" class="second" id="encore">' + (TIRAGE_TEXTES.encore[LANGUE] || TIRAGE_TEXTES.encore.fr) + '</button>';
function basDePartie(){
  const b = $("bas"); b.innerHTML = boutonEncore() + '<button type="button" class="principal" id="terminer">' + T("terminer") + '</button>'; b.hidden = false;
  const e = $("encore"); if (e) e.addEventListener("click", () => { b.hidden = true; encoreDesQuestions(); });
}
async function encoreDesQuestions(){
  const mots = motsDuTheme();
  file = Tirage.supplement(mots, await Tirage.demander(mots), NB); rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(null);
  montrer();
}
async function demarrer(){
  const mots = motsDuTheme();
  const plan = Tirage.plan(mots, await Tirage.demander(mots), NB, NEUFS_MAX);
  file = plan.file; rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(plan.prochaine);
  montrer();
}
$("suite").addEventListener("click", () => { if (!file.length) return; rang++; if (rang >= file.length) fin(); else montrer(); });
$("retour").addEventListener("click", () => parler("fermer"));
$("retour").setAttribute("aria-label", T("retourAria"));
$("titre").textContent = T("titre");
document.title = T("titre");
fetch("animales/animales.json?v=1").then(r => r.json()).then(d => {
  D = d;
  if (EN_APP) preparerAnglais();
  if (Q.get("seance") === "1") demarrer(); else decouvrir();
});
</script>
