<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les loisirs</title>
<!--
  « LES LOISIRS » (theme illustre, vague 2, 3 nov. 2026), en espagnol et en allemand. Quinze activites, chacune
  photographiee avec une personne deja connue (Decrire une personne, la famille d'Anna) ; ce que la photo ne montre
  pas est DESSINE depuis la donnee : la FICHE de la personne (♥ elle aime, ✗ elle n'aime pas) et un CALENDRIER de
  quatre semaines (la frequence : 28, 16, 6, 1 ou 0 jours). On y apprend :
    - me gusta + infinitif (le / les, toujours gusta) ; gern apres le verbe, nicht gern ;
    - jugar a (al futbol) ou tocar (la guitarra), hacer deporte, montar en bicicleta, sacar fotos ;
      spielen (Fussball, Gitarre : sans article), machen (Sport, Fotos), fahren (Rad) ;
    - siempre, a menudo, a veces, rara vez, nunca ; immer, oft, manchmal, selten, nie ;
    - proposer et repondre : ¿Quieres...? ¿Vamos a...? ; Hast du Lust, ... zu ...? Wollen wir ...?
  Les instruments sont ceux de la scene de la musique. Toute la donnee vient de visuel/loisirs/loisirs.py ->
  loisirs/loisirs.json ; les phrases se fabriquent ici, dans la langue apprise et dans la langue de traduction, a
  partir des MEMES choix (la personne, l'activite, la frequence, aimer ou non) : aucune n'est ecrite a la main.
  Ouverte par l'app dans le cadre des scenes (sceneCadre), elle parle comme une scene : « exercice » et « bonne » a
  chaque reponse, « reponse » {mot, genre, cat, juste} pour le mot teste, « fini » et « fermer ». Parametres :
  apprendre=es|de, lang=<interface>, nuit=1, seance=1 (six questions, pas de decouverte), variante=latam (la voix),
  r=<AUDIO_REVISION>. Le tirage suit les mots (themes/tirage.js).
-->
<style>
:root{--fond1:#82AFDB;--fond3:#C0D6EA;--encre:#1C2430;--gris:#4C566B;--ambre:#E8A23A;--ambre-f:#A86A0E;--vert:#2F9E6A;--rouge:#C8473A;
  --coeur:#D2486A;--croix:#5B6578;--case:#E4E8EE;--verre:rgba(255,255,255,.88);--bord:rgba(255,255,255,.95);--carte:#F7F8FA;--police:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html.nuit{--fond1:#0E1C26;--fond3:#18303F;--encre:#EEF2F5;--gris:#A9B8C4;--ambre-f:#E8A23A;--vert:#5CC98F;--rouge:#F07F72;
  --coeur:#F2789A;--croix:#A9B8C4;--case:#2C4558;--verre:rgba(20,36,50,.88);--bord:rgba(255,255,255,.14);--carte:#22384A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,var(--fond1),var(--fond3));background-attachment:fixed;color:var(--encre);font-family:var(--police);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 90px) max(10px,env(safe-area-inset-left,0px))}
.haut{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto 10px}
.retour{width:42px;height:42px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);color:var(--encre);font:800 22px var(--police);cursor:pointer;flex:0 0 auto}
html[dir="rtl"] .retour{transform:scaleX(-1)}
.titre{flex:1;font-weight:900;font-size:18px}
.compte{font-weight:800;font-size:14px;color:var(--gris)}
.barre{max-width:560px;margin:0 auto 12px;height:6px;border-radius:3px;background:rgba(28,36,48,.12);overflow:hidden}
.barre i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2BB5AA,#14807A);transition:width .3s}
main{max-width:560px;margin:0 auto;background:var(--verre);border:1px solid var(--bord);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}
.consigne{font-size:14px;font-weight:700;color:var(--gris);margin:0}
.enonce{direction:ltr;text-align:left;background:var(--carte);border-radius:14px;padding:12px 14px;font-weight:800;line-height:1.5;font-size:17px}
.enonce.centre{text-align:center;font-size:19px}
.trou{display:inline-block;min-width:56px;border-bottom:2px solid var(--ambre);text-align:center;color:var(--ambre-f)}
/* la photo d'une activite (3:4) : assez haute pour voir le geste, assez basse pour laisser la question a l'ecran */
.photo{width:min(100%,36vh,280px);margin:0 auto;border-radius:16px;overflow:hidden;background:var(--carte);aspect-ratio:3/4}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
/* des images a toucher (« touche la bonne photo », l'ecoute, le bon calendrier) */
.rangee{display:grid;grid-template-columns:1fr 1fr;gap:8px;direction:ltr}
.rangee.trois{grid-template-columns:1fr 1fr 1fr}
.rangee button{border:3px solid transparent;border-radius:14px;background:var(--carte);padding:0;cursor:pointer;overflow:hidden;display:block;position:relative;color:var(--encre)}
.rangee button.img{aspect-ratio:3/4}
.rangee button img{display:block;width:100%;height:100%;object-fit:cover}
.rangee button.juste{border-color:var(--vert)} .rangee button.faux{border-color:var(--rouge)}
.rangee button .cal{border-radius:0;padding:6px}
/* LE PICTOGRAMME d'une activite (dessine ici, viewBox 48) */
.picto{display:inline-flex;width:36px;height:36px;flex:0 0 auto;color:var(--encre)}
.picto svg{width:100%;height:100%}
/* LA FICHE : le visage, le nom, et une ligne par activite (pictogramme, ♥ ou ✗) */
.fiche{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--carte);border-radius:16px;padding:12px;direction:ltr}
.fiche .qui{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:84px}
.visage{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--case);display:block}
.fiche .nom{font-weight:900;font-size:15px}
.lignes{display:flex;flex-direction:column;gap:8px}
.ligne{display:flex;align-items:center;gap:8px;background:var(--verre);border-radius:12px;padding:5px 9px}
.avis{width:30px;height:30px;display:inline-flex}
.avis svg{width:100%;height:100%}
.avis.oui{color:var(--coeur)} .avis.non{color:var(--croix)}
/* LE CALENDRIER : quatre semaines, une case cochee par jour ou la personne le fait */
.cal{background:var(--carte);border-radius:16px;padding:10px;direction:ltr}
.cal .tete{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.cal .tete .visage{width:52px;height:52px}
.grille{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:250px;margin:0 auto}
.grille span{aspect-ratio:1;border-radius:6px;background:var(--case);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--gris)}
.grille span.j{background:none;aspect-ratio:auto;padding-bottom:2px}
.grille span.on{background:var(--ambre);color:#fff}
.grille span.on::after{content:"";width:40%;height:22%;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.rangee .grille{gap:2px} .rangee .grille span{border-radius:3px;font-size:8px} .rangee .grille span.j{display:none}
.rangee .cal .tete{display:none}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix.centre{justify-content:center}
.choix.colonne{flex-direction:column}
.choix button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:9px 15px;font:800 15px var(--police);cursor:pointer;text-align:center}
.choix.colonne button{border-radius:16px;text-align:left}
.choix button.juste{background:var(--vert);border-color:var(--vert);color:#fff}
.choix button.faux{background:var(--rouge);border-color:var(--rouge);color:#fff}
button:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
button:disabled{cursor:default}
.ecoute{width:48px;height:48px;border-radius:50%;border:2px solid var(--ambre);background:var(--verre);color:var(--encre);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ecoute svg{width:24px;height:24px}
.ecoute.grand{width:64px;height:64px;margin:0 auto} .ecoute.grand svg{width:32px;height:32px}
.retourMsg{min-height:1.4em;font-weight:800;font-size:15px;margin:0;line-height:1.45}
.retourMsg.ok{color:var(--vert)} .retourMsg.ko{color:var(--rouge)}
.retourMsg .phrase{display:block;color:var(--encre);font-weight:700}
.trad{display:block;font-size:13px;font-weight:600;font-style:italic;color:var(--gris);line-height:1.35;margin-top:2px}
.retourMsg .mot{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--gris);font-weight:700}
.retourMsg .mot .ecoute{width:38px;height:38px} .retourMsg .mot .ecoute svg{width:19px;height:19px}
.trad.faux{color:var(--rouge);font-style:italic}
.dialogue{display:block;color:var(--gris);font-weight:700;font-size:15px;margin-bottom:4px}
/* la decouverte : trois onglets (les activites, aimer et la frequence, proposer) */
.onglets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:var(--carte);border-radius:999px;padding:4px}
.onglets button{border:0;border-radius:999px;background:none;color:var(--gris);font:800 13px var(--police);padding:9px 4px;cursor:pointer;line-height:1.15}
.onglets button.actif{background:var(--verre);color:var(--encre);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.dit{display:flex;align-items:center;gap:10px;background:var(--carte);border-radius:14px;padding:10px 12px}
.dit .texte{flex:1;font-weight:800;font-size:17px;line-height:1.4}
.vignettes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;direction:ltr}
.vignettes button{border:2px solid transparent;border-radius:12px;padding:0;background:var(--carte);cursor:pointer;overflow:hidden;aspect-ratio:3/4}
.vignettes button img{display:block;width:100%;height:100%;object-fit:cover}
.vignettes button.choisi{border-color:var(--ambre)}
.visages{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;direction:ltr}
.visages button{border:2px solid transparent;border-radius:50%;padding:0;background:none;cursor:pointer;width:50px;height:50px}
.visages button img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.visages button.choisi{border-color:var(--ambre)}
.fiche .ligne{cursor:pointer;border:2px solid transparent}
.fiche .ligne.choisi{border-color:var(--ambre)}
.echelle{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;direction:ltr}
.echelle div{background:var(--carte);border-radius:10px;padding:6px 4px;text-align:center;font-weight:800;font-size:12px}
.echelle .grille{gap:1px;margin:4px auto 0} .echelle .grille span{border-radius:2px} .echelle .grille span.j{display:none}
.echelle .grille span.on::after{display:none}
.dialogues{display:flex;flex-direction:column;gap:8px}
.dialogues button{border:2px solid var(--bord);background:var(--carte);color:var(--encre);border-radius:14px;padding:9px 12px;font:700 15px var(--police);cursor:pointer;text-align:left;direction:ltr;display:flex;gap:10px;align-items:center}
.dialogues button.choisi{border-color:var(--ambre)}
.regle{margin:0;font-size:14px;font-weight:700;line-height:1.5;color:var(--gris);background:var(--carte);border-radius:12px;padding:10px 12px}
.regle b{color:var(--encre)}
.regle .exemples{display:block;margin-top:6px;color:var(--encre);font-weight:700;text-align:left}
.suite{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:54px;border:0;border-radius:27px;
  color:#fff;font:800 17px var(--police);background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer}
.suite{z-index:5000}
.suite[hidden]{display:none}
/* la fin de partie : « Encore des questions » et « Terminer », fixes en bas comme .suite (regle des scenes, 3 nov.) */
.bas{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;gap:10px;z-index:5000}
.bas[hidden]{display:none}
.bas button{flex:1;height:54px;border-radius:27px;font:800 16px var(--police);cursor:pointer;padding:0 10px}
.bas .principal{border:0;color:#fff;background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28)}
.bas .second{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.fin{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:10px 0}
.fin .score{font-size:22px;font-weight:900}
[lang]{unicode-bidi:isolate}
</style>
</head>
<body>
<div class="haut"><button class="retour" id="retour" type="button">‹</button><div class="titre" id="titre"></div><div class="compte" id="compte" dir="ltr"></div></div>
<div class="barre"><i id="barre"></i></div>
<main id="zone"></main>
<button class="suite" id="suite" type="button" hidden></button>
<div class="bas" id="bas" hidden></div>
<script src="themes/tirage.js?v=1"></script>
<script src="themes/voix.js?v=1"></script>
<script src="themes/zoom.js?v=3"></script>
<script>
const Q = new URLSearchParams(location.search);
const APPRENDRE = Q.get("apprendre") === "de" ? "de" : "es";
const LANGUE = (l => ["fr", "en", "tr", "uk", "fa", "ar", "pt", "pl", "ru", "de"].includes(l) ? l : "fr")(((Q.get("lang") || "fr").toLowerCase().split(/[-_]/)[0]));
if (Q.get("nuit") === "1") document.documentElement.classList.add("nuit");
document.documentElement.lang = LANGUE;
document.documentElement.dir = (LANGUE === "fa" || LANGUE === "ar") ? "rtl" : "ltr";
// agrandir (themes/zoom.js) : un toucher sur la photo de la question ; la loupe sur les photos a choisir
Zoom.init({direct: ".photo img, .fiche .visage, .cal .visage", loupe: ".rangee button.img", langue: LANGUE});
// vingt questions seul (Jacques, 3 nov.), six dans la seance du jour, sans la decouverte
const NB = Q.get("seance") === "1" ? 6 : 20;
const DE_APP = APPRENDRE === "de";

const TEXTES = {
  titre:     {fr:"Les loisirs", en:"Free time", tr:"Boş zaman", uk:"Дозвілля", fa:"اوقات فراغت", ar:"أوقات الفراغ", pt:"Lazer", pl:"Czas wolny", ru:"Досуг", de:"Freizeit"},
  ongletAct: {fr:"Les activités", en:"Activities", tr:"Etkinlikler", uk:"Заняття", fa:"فعالیت‌ها", ar:"الأنشطة", pt:"Atividades", pl:"Zajęcia", ru:"Занятия", de:"Aktivitäten"},
  ongletAime:{fr:"Aimer, la fréquence", en:"Likes, how often", tr:"Sevmek, sıklık", uk:"Любити, як часто", fa:"دوست داشتن، چند وقت یک‌بار", ar:"الحبّ، وكم مرّة", pt:"Gostar, a frequência", pl:"Lubić, jak często", ru:"Любить, как часто", de:"Mögen, wie oft"},
  ongletProp:{fr:"Proposer", en:"Suggesting", tr:"Teklif etmek", uk:"Запропонувати", fa:"پیشنهاد دادن", ar:"الاقتراح", pt:"Propor", pl:"Proponować", ru:"Предложить", de:"Vorschlagen"},
  introAct:  {fr:"Touche une photo : tu vois et tu entends ce que fait la personne.", en:"Tap a photo: you see and hear what the person is doing.", tr:"Bir fotoğrafa dokun: kişinin ne yaptığını görür ve duyarsın.", uk:"Торкнися фото: ти бачиш і чуєш, що робить людина.", fa:"روی یک عکس بزن: می‌بینی و می‌شنوی آن شخص چه می‌کند.", ar:"المس صورة: ترى وتسمع ما يفعله الشخص.", pt:"Toque numa foto: você vê e ouve o que a pessoa está fazendo.", pl:"Dotknij zdjęcia: widzisz i słyszysz, co robi ta osoba.", ru:"Нажми на фото: ты видишь и слышишь, что делает человек.", de:"Tippe auf ein Foto: Du siehst und hörst, was die Person macht."},
  introAime: {fr:"Touche une personne, puis une ligne de sa fiche : ♥ elle aime, ✗ elle n'aime pas. Le calendrier montre combien de jours elle le fait en quatre semaines.", en:"Tap a person, then a line of their card: ♥ they like it, ✗ they don't. The calendar shows on how many days they do it in four weeks.", tr:"Bir kişiye, sonra kartındaki bir satıra dokun: ♥ seviyor, ✗ sevmiyor. Takvim, dört haftada kaç gün yaptığını gösterir.", uk:"Торкнися людини, потім рядка її картки: ♥ любить, ✗ не любить. Календар показує, скільки днів за чотири тижні вона це робить.", fa:"روی یک نفر و بعد روی یک سطر کارتش بزن: ♥ دوست دارد، ✗ دوست ندارد. تقویم نشان می‌دهد در چهار هفته چند روز این کار را می‌کند.", ar:"المس شخصًا، ثم سطرًا من بطاقته: ♥ يحبّ، ✗ لا يحبّ. يُظهر التقويم في كم يومًا يفعل ذلك خلال أربعة أسابيع.", pt:"Toque numa pessoa e depois numa linha da ficha dela: ♥ gosta, ✗ não gosta. O calendário mostra em quantos dias ela faz isso em quatro semanas.", pl:"Dotknij osoby, a potem wiersza jej karty: ♥ lubi, ✗ nie lubi. Kalendarz pokazuje, w ile dni w ciągu czterech tygodni to robi.", ru:"Нажми на человека, потом на строку его карточки: ♥ любит, ✗ не любит. Календарь показывает, сколько дней за четыре недели он этим занимается.", de:"Tippe auf eine Person, dann auf eine Zeile ihrer Karte: ♥ mag es, ✗ mag es nicht. Der Kalender zeigt, an wie vielen Tagen in vier Wochen sie es macht."},
  introProp: {fr:"Pour proposer une activité, et pour répondre. Touche une ligne pour l'entendre.", en:"How to suggest an activity, and how to answer. Tap a line to hear it.", tr:"Bir etkinlik önermek ve cevap vermek için. Duymak için bir satıra dokun.", uk:"Як запропонувати заняття і як відповісти. Торкнися рядка, щоб почути.", fa:"برای پیشنهاد یک فعالیت و پاسخ دادن. روی یک سطر بزن تا آن را بشنوی.", ar:"لاقتراح نشاط وللردّ. المس سطرًا لتسمعه.", pt:"Para propor uma atividade e para responder. Toque numa linha para ouvir.", pl:"Jak zaproponować zajęcie i jak odpowiedzieć. Dotknij wiersza, aby go usłyszeć.", ru:"Как предложить занятие и как ответить. Нажми на строку, чтобы услышать.", de:"So schlägst du etwas vor, und so antwortest du. Tippe auf eine Zeile, um sie zu hören."},

  if (PAIRES) return PAIRES;
  PAIRES = [];
  faits().forEach((f, i) => faits().slice(i + 1).forEach(g => { if (g.a === f.a && g.gern === f.gern && g.p !== f.p) PAIRES.push({ps: [f.p, g.p], a: f.a, gern: f.gern}); }));
  return PAIRES;
}

// ---------- LES PHRASES, fabriquees dans chaque langue a partir des memes choix ----------
// L : es, de (les langues apprises, et l'allemand traduction de l'espagnol), fr, en, pt (le Bresil)
const r = (s) => s ? " " + s : "";
const et = (L, ps) => ps.length === 1 ? nom(ps[0]) : nom(ps[0]) + {es: " y a ", de: " und ", fr: " et ", en: " and ", pt: " e "}[L] + nom(ps[1]);
const P = {
  // « Felix juega al fútbol. »
  fait(L, p, a){ const x = act(a, L);
    return L === "en" || L === "pt" ? nom(p) + " " + x.v3 + "." : nom(p) + " " + x.v + r(x.reste) + "."; },
  // « A Felix le gusta jugar al fútbol. » / « Felix spielt gern Fußball. » ; ps : une ou deux personnes
  aime(L, ps, a, oui){ const x = act(a, L), n = et(L, ps), deux = ps.length > 1;
    if (L === "es") return "A " + n + (oui ? "" : " no") + (deux ? " les" : " le") + " gusta " + x.inf + ".";
    if (L === "de") return n + " " + (deux ? x.vpl : x.v) + (oui ? " gern" : " nicht gern") + r(x.reste) + ".";
    if (L === "fr") return n + (oui ? (deux ? " aiment " : " aime ") : (deux ? " n'aiment pas " : " n'aime pas ")) + x.inf + ".";
    if (L === "en") return n + (oui ? (deux ? " like " : " likes ") : (deux ? " don't like " : " doesn't like ")) + x.ing + ".";
    return n + (oui ? (deux ? " gostam de " : " gosta de ") : (deux ? " não gostam de " : " não gosta de ")) + x.inf + "."; },
  // « Felix juega al fútbol a menudo. » / « Felix spielt oft Fußball. »
  freq(L, p, a, q){ const x = act(a, L), adv = D.adv[L][q], n = nom(p);
    if (L === "es") return ["immer", "selten", "nie"].includes(q) ? n + " " + adv + " " + x.v + r(x.reste) + "." : n + " " + x.v + r(x.reste) + " " + adv + ".";
    if (L === "de") return n + " " + x.v + " " + adv + r(x.reste) + ".";
    if (L === "fr") return q === "nie" ? n + " ne " + x.v + " jamais" + r(x.neg) + "." : n + " " + x.v + " " + adv + r(x.reste) + ".";
    if (L === "en") return n + " " + adv + " " + x.v3 + ".";
    return q === "oft" ? n + " " + x.v3 + " " + adv + "." : n + " " + adv + " " + x.v3 + "."; },
  // « ¿Con qué frecuencia juega Felix al fútbol? » / « Wie oft spielt Felix Fußball? »
  qFreq(L, p, a){ const x = act(a, L);
    return L === "es" ? "¿Con qué frecuencia " + x.v + " " + nom(p) + r(x.reste) + "?" : "Wie oft " + x.v + " " + nom(p) + r(x.reste) + "?"; },
  qQuoi(L, p){ return L === "es" ? "¿Qué hace " + nom(p) + "?" : "Was macht " + nom(p) + "?"; },
  // proposer : f = 0 (¿Quieres…? / Hast du Lust…?), 1 (¿Vamos a…? / Wollen wir…?) ; app : la langue apprise de la
  // question, dont la traduction suit la tournure (« Tu veux… » pour ¿Quieres…?, « Tu as envie de… » pour Lust)
  propose(L, a, f, app){ const x = act(a, L);
    if (L === "es") return f ? "¿Vamos a " + x.inf + "?" : "¿Quieres " + x.inf + "?";
    if (L === "de") return f ? "Wollen wir " + (x.reste ? x.reste + " " : "") + x.inf + "?" : (x.reste ? "Hast du Lust, " + x.reste + " zu " + x.inf + "?" : "Hast du Lust zu " + x.inf + "?");
    if (L === "fr") return f ? "On " + x.v + r(x.reste) + " ?" : (app === "de" ? "Tu as envie de " + x.inf + " ?" : "Tu veux " + x.inf + " ?");
    if (L === "en") return f ? "Shall we " + x.inf + "?" : (app === "de" ? "Do you feel like " + x.ing + "?" : "Do you want to " + x.inf + "?");
    return f ? "Vamos " + x.inf + "?" : (app === "de" ? "Você está a fim de " + x.inf + "?" : "Você quer " + x.inf + "?"); },
  // repondre : oui (la fiche dit ♥) ou non (✗) ; sexe pour « obrigado / obrigada »
  repond(L, a, oui, sexe){ const x = act(a, L);
    if (L === "es") return oui ? "¡Sí, claro! Me gusta mucho " + x.inf + "." : "No, gracias. No me gusta " + x.inf + ".";
    if (L === "de") return oui ? "Ja, gern! Ich " + x.ich + " gern" + r(x.reste) + "." : "Nein, danke. Ich " + x.ich + " nicht gern" + r(x.reste) + ".";
    if (L === "fr") return oui ? "Oui, avec plaisir ! J'aime beaucoup " + x.inf + "." : "Non, merci. Je n'aime pas " + x.inf + ".";
    if (L === "en") return oui ? "Yes, sure! I really like " + x.ing + "." : "No, thanks. I don't like " + x.ing + ".";
    return oui ? "Sim, claro! Eu gosto muito de " + x.inf + "." : "Não, " + (sexe === "f" ? "obrigada" : "obrigado") + ". Eu não gosto de " + x.inf + "."; }
};

// LE MOT DE LA QUESTION (regle 3, 3 nov. : « un mot appris compte partout ») : juger() l'envoie (« reponse »), l'app
// fait avancer sa carte (revisionDeScene). Un nom : {mot: "Gitarre", genre: "die"} ; un verbe : {mot: "spielen",

let motQ = null, tradQ = null, choixQ = null;
// LES MOTS DU THEME, a la forme du corpus
let MOTS = null;
function motsDuTheme(){
  if (MOTS) return MOTS;
  const noms = [], verbes = [];
  ACTS().forEach(a => { const x = act(a);
    if (x.nom && !noms.some(n => n.mot === x.nom[0])) noms.push({k: "n:" + x.nom[0], mot: x.nom[0], genre: x.nom[1]});
    if (!verbes.some(v => v.mot === x.verbe)) verbes.push({k: "v:" + x.verbe, mot: x.verbe, cat: "verbe"}); });
  const autres = D.autres[APPRENDRE].map(([m, c]) => c === "die" ? {k: "n:" + m, mot: m, genre: c} : {k: (c === "verbe" ? "v:" : "a:") + m, mot: m, cat: c});
  MOTS = noms.concat(verbes, autres);
  return MOTS;
}
const motDe = w => ({mot: w.mot, genre: w.genre || null, cat: w.cat || null});
function viser(w, defaut){ motQ = w ? motDe(w) : defaut; }
const estAdv = w => w && w.cat === "adverbe" && w.mot !== "gern";
const advFreq = w => estAdv(w) ? D.freq.find(f => D.adv[APPRENDRE][f] === w.mot) : null;
const estAime = w => w && (w.mot === "gustar" || w.mot === "gern");
const estPropose = w => w && (w.mot === "querer" || w.mot === "Lust");
// les activites que vise un mot (son nom ou son verbe) ; tout, sans mot ; rien pour un adverbe ou « gustar »
function actsPour(w){
  if (!w) return ACTS();
  if (w.k && w.k.startsWith("n:")) return ACTS().filter(a => act(a).nom && act(a).nom[0] === w.mot);
  if (w.cat === "verbe") return ACTS().filter(a => act(a).verbe === w.mot);
  return [];
}
const estMotAct = w => w && actsPour(w).length > 0;
// le mot d'une activite qui porte la question : son nom s'il en a un (Gitarre), sinon son verbe (tanzen)
const motAct = a => act(a).nom ? {mot: act(a).nom[0], genre: act(a).nom[1], cat: null} : {mot: act(a).verbe, genre: null, cat: "verbe"};
const motVerbe = a => ({mot: act(a).verbe, genre: null, cat: "verbe"});
const motAdv = q => ({mot: D.adv[APPRENDRE][q], genre: null, cat: "adverbe"});
const motAime = () => DE_APP ? {mot: "gern", genre: null, cat: "adverbe"} : {mot: "gustar", genre: null, cat: "verbe"};
const motPropose = () => DE_APP ? {mot: "Lust", genre: "die", cat: null} : {mot: "querer", genre: null, cat: "verbe"};
// les faits que vise un mot : une activite, une frequence, aimer
function faitsPour(w){
  if (!w || estAime(w)) return faits();
  if (estAdv(w)) return faits().filter(f => f.freq === advFreq(w));
  const as = actsPour(w); return faits().filter(f => as.includes(f.a));
}
// le mot montre sous la reponse : « die Gitarre », « jugar », « a menudo », et sa traduction (le corpus)
function montreDe(m){
  if (!m) return null;
  const g = (D.gloses[APPRENDRE] || {})[m.mot] || {};
  return {aff: m.genre ? m.genre + " " + m.mot : m.mot, sens: LANGUE === APPRENDRE ? "" : (g[LANGUE] || g.fr || "")};
}
const glose = m => { const g = (D.gloses[APPRENDRE] || {})[m] || {}; return LANGUE === APPRENDRE ? "" : (g[LANGUE] || g.fr || ""); };
// LE MAUVAIS CHOIX TRADUIT (regle commune, 3 nov.) : choixQ = {texte, trad} pose par la question pour chaque choix qui
// a une traduction sure (une phrase fabriquee, un verbe, un adverbe) ; rien pour une phrase fautive, un article
let choixTrad = {};

// apres la reponse : la phrase juste et sa traduction, le mot teste et sa voix
function juger(ok, bonneTexte, phrase){
  if (repondu) return; repondu = true;
  if (ok) bons++;
  parler("exercice", {juste: ok}); if (ok) parler("bonne");
  if (motQ) parler("reponse", {mot: motQ.mot, genre: motQ.genre || null, cat: motQ.cat || null, juste: ok});
  if (!ok && file[rang]) Tirage.remettre(file, rang, file[rang], NB);   // rate : il revient dans la partie
  const m = $("msg"); m.className = "retourMsg " + (ok ? "ok" : "ko");
  const mt = montreDe(motQ), c = !ok && choixQ != null ? choixTrad[choixQ] : null;
  m.innerHTML = (ok ? cible(DE_APP ? "Sehr gut!" : "¡Muy bien!") : T("bonne", {r: cible(bonneTexte)}))
    + (phrase && phrase !== bonneTexte ? '<span class="phrase">' + cible(phrase) + '</span>' : "")
    + traduction(tradQ)
    + (c && c.sens ? '<span class="trad faux" dir="auto">' + T("choix", {r: cible(c.aff)}) + " — " + c.sens + '</span>' : "")
    + (mt ? '<span class="mot"><button type="button" class="ecoute" id="redire" aria-label="' + T("ecouter") + '">' + HP + '</button>' + cible(mt.aff) + (mt.sens ? ' · <span dir="auto">' + mt.sens + '</span>' : "") + '</span>' : "");
  if (mt) $("redire").addEventListener("click", () => dire(phrase || bonneTexte));
  dire(phrase || bonneTexte);
  const s = $("suite"); s.textContent = rang + 1 >= file.length ? T("terminer") : T("continuer"); s.hidden = false;
}
function boutons(conteneur, options, bonne, apres){
  let bon;
  options.forEach(o => {
    const b = document.createElement("button"); b.type = "button"; b.lang = APPRENDRE; b.dir = "ltr"; b.textContent = o; if (o === bonne){ bon = b; b.dataset.bon = "1"; }
    b.addEventListener("click", () => {
      conteneur.querySelectorAll("button").forEach(x => { x.disabled = true; if (x === bon) x.classList.add("juste"); });
      if (b !== bon) b.classList.add("faux");
      choixQ = o; apres(o === bonne);
    });
    conteneur.appendChild(b);
  });
}
// des images (ou des calendriers) a toucher : ids, le dessin de chacun, la bonne ; data-id pour les controles
function aToucher(conteneur, ids, dessin, bonne, apres, img){
  let bon;
  conteneur.className = "rangee" + (ids.length === 3 ? " trois" : "");
  ids.forEach(i => {
    const b = document.createElement("button"); b.type = "button"; b.dataset.id = i; if (img) b.className = "img";
    b.innerHTML = dessin(i); if (i === bonne){ bon = b; b.dataset.bon = "1"; }
    b.addEventListener("click", () => {
      conteneur.querySelectorAll("button").forEach(x => { x.disabled = true; if (x === bon) x.classList.add("juste"); });
      if (b !== bon) b.classList.add("faux");
      choixQ = i; apres(i === bonne);
    });
    conteneur.appendChild(b);
  });
}

const SORTE_VERBE = DE_APP ? ["spielen", "machen", "fahren"] : ["jugar", "tocar", "hacer", "montar", "sacar"];

// ---------- les exercices ----------
// Chaque sorte sait viser un mot w (false si elle ne le peut pas) ; sans w, une question au hasard (les controles).
const EX = {
  // « ¿Qué hace Inés? » : la photo, la bonne phrase et deux phrases d'autres activites
  quoi(w){
    if (w && !estMotAct(w)) return false;
    const a = hasard(actsPour(w)), p = quiFait(a);
    viser(w, motAct(a));
    const autres = melanger(autresPour(p, a));
    // d'abord une activite du meme verbe (tocar el piano contre tocar la guitarra), puis de l'autre (jugar)
    const meme = autres.filter(b => act(b).verbe === act(a).verbe), diff = autres.filter(b => act(b).sorte && act(b).sorte !== act(a).sorte);
    const leurres = uniques(meme.slice(0, 1).concat(diff.slice(0, 1), autres)).slice(0, 2);
    const bonne = P.fait(A_, p, a);
    choixTrad = {}; leurres.forEach(b => choixTrad[P.fait(A_, p, b)] = {aff: P.fait(A_, p, b), sens: tr("fait", p, b) || glose(act(b).nom ? act(b).nom[0] : act(b).verbe)});
    tradQ = tr("fait", p, a);
    ecran(T("quoi"), photo(a), cible(P.qQuoi(A_, p)), true, true);
    boutons($("choix"), melanger([bonne, ...leurres.map(b => P.fait(A_, p, b))]), bonne, ok => juger(ok, bonne));
    return true;
  },
  // « Inés ___ la guitarra. » toca / juega / hace ; « Felix ___ Fußball. » spielt / macht / fährt
  verbe(w){
    if (w && !estMotAct(w)) return false;
    const c = actsPour(w).filter(a => SORTE_VERBE.includes(act(a).sorte));
    if (!c.length) return false;
    const a = hasard(c), x = act(a), p = quiFait(a);
    viser(w, w && w.cat === "verbe" ? motVerbe(a) : motAct(a));
    const formes = DE_APP ? {spielen: "spielt", machen: "macht", fahren: "fährt"} : {jugar: "juega", tocar: "toca", hacer: "hace", montar: "monta", sacar: "saca"};
    const autres = SORTE_VERBE.filter(s => s !== x.sorte);
    // en espagnol, jugar et tocar sont toujours la : c'est la confusion du francais (jouer)
    const leurres = DE_APP ? autres : uniques(autres.filter(s => s === "jugar" || s === "tocar").concat(melanger(autres))).slice(0, 2);
    choixTrad = {}; leurres.forEach(s => choixTrad[formes[s]] = {aff: formes[s] + " (" + s + ")", sens: glose(s)});
    tradQ = tr("fait", p, a);
    ecran(T("verbe"), photo(a), avecTrou(nom(p) + " ___" + r(x.reste) + "."));
    boutons($("choix"), melanger([x.v, ...leurres.map(s => formes[s])]), x.v, ok => { remplir(x.v); juger(ok, x.v, P.fait(A_, p, a)); });
    return true;
  },
  // « Felix juega ___ fútbol. » al / el / a el ; « Inés toca ___ guitarra. » la / a la / al
  art(w){
    if (DE_APP || (w && !estMotAct(w))) return false;
    const c = actsPour(w).filter(a => act(a).art);
    if (!c.length) return false;
    const a = hasard(c), x = act(a), p = quiFait(a);
    viser(w, w && w.cat === "verbe" ? motVerbe(a) : motAct(a));
    const opts = x.art === "al" ? ["al", "el", "a el"] : x.art === "la" ? ["la", "a la", "al"] : ["el", "al", "a el"];
    choixTrad = {}; tradQ = tr("fait", p, a);
    ecran(T("art"), photo(a), avecTrou(nom(p) + " " + x.v + " ___ " + x.nom[0] + "."));
    boutons($("choix"), melanger(opts), x.art, ok => { remplir(x.art); juger(ok, x.art, P.fait(A_, p, a)); });
    return true;
  },
  // la conjugaison : « Heinz ___. » liest / lest / lesen ; « Felix und Pablo ___ gern Fußball. » spielen / spielt ;
  // « Felix ___ al fútbol. » juega / juegas / juga (u -> ue)
  forme(w){
    if (w && !estMotAct(w)) return false;
    const as = actsPour(w);
    const pl = DE_APP ? paires().filter(x => x.gern && as.includes(x.a)) : [];
    const deux = pl.length && Math.random() < 0.4;
    const a = deux ? null : hasard(as);
    const f = deux ? hasard(pl) : null, aa = deux ? f.a : a, x = act(aa), conj = D.formes[APPRENDRE][x.verbe];
    viser(w, motVerbe(aa));
    let image, enonce, bonne, juste, leurres;
    if (deux){
      image = fiche(f.ps, [[aa, true]]);
      bonne = x.vpl; juste = P.aime(A_, f.ps, aa, true); tradQ = tr("aime", f.ps, aa, true);
      enonce = et(A_, f.ps) + " ___ gern" + r(x.reste) + ".";
      leurres = uniques([conj.er_sie_es, conj.du].filter(v => v !== bonne));
    } else {
      const p = quiFait(aa);
      image = photo(aa); bonne = x.v; juste = P.fait(A_, p, aa); tradQ = tr("fait", p, aa);
      enonce = nom(p) + " ___" + r(x.reste) + ".";
      const cand = DE_APP ? [conj.ich, conj.wir, conj.ihr, conj.du] : [conj.du, x.verbe, conj.sie_Sie].concat(x.verbe === "jugar" ? ["juga"] : []);
      leurres = melanger(uniques(cand.filter(v => v && v !== bonne)));
      if (!DE_APP && x.verbe === "jugar") leurres = ["juga"].concat(leurres.filter(v => v !== "juga"));
    }
    leurres = leurres.slice(0, 2);
    choixTrad = {};
    ecran(T("forme"), image, avecTrou(enonce));
    boutons($("choix"), melanger([bonne, ...leurres]), bonne, ok => { remplir(bonne); juger(ok, bonne, juste); });
    return true;
  },
  // ESPAGNOL, aimer : (a) le pronom -- « A Heinz ___ gusta leer. » le / les / me ; (b) la phrase de la fiche --
  // « A Felix no le gusta bailar. » contre le contraire et la faute (« A Felix no gusta bailar. »)
  gusta(w){
    if (DE_APP) return false;
    if (w && !estAime(w) && !estMotAct(w)) return false;
    const as = w && estMotAct(w) ? actsPour(w) : ACTS();
    const pl = paires().filter(x => as.includes(x.a)), fs = faits().filter(f => as.includes(f.a));
    const variante = !w || estAime(w) ? hasard(["pronom", "pronom", "phrase"]) : "phrase";
    const deux = pl.length && Math.random() < 0.35;
    const f = deux ? hasard(pl) : hasard(fs), ps = deux ? f.ps : [f.p], x = act(f.a);
    viser(w, w && estMotAct(w) ? motAct(f.a) : motAime());
    const juste = P.aime("es", ps, f.a, f.gern);
    tradQ = tr("aime", ps, f.a, f.gern); choixTrad = {};
    const image = fiche(ps, [[f.a, f.gern]]);
    if (variante === "pronom"){
      const bonne = deux ? "les" : "le";
      ecran(T("ficheTrou"), image, avecTrou("A " + et("es", ps) + (f.gern ? "" : " no") + " ___ gusta " + x.inf + "."));
      boutons($("choix"), melanger(deux ? ["les", "le", "se"] : ["le", "les", "me"]), bonne, ok => { remplir(bonne); juger(ok, bonne, juste); });
    } else {
      const contraire = P.aime("es", ps, f.a, !f.gern);
      const faute = "A " + et("es", ps) + (f.gern ? "" : " no") + " gusta " + x.inf + ".";
      choixTrad[contraire] = {aff: contraire, sens: tr("aime", ps, f.a, !f.gern)};
      ecran(T("fichePhrase"), image, "", true, true);
      $("zone").querySelector(".enonce").remove();
      boutons($("choix"), melanger([juste, contraire, faute]), juste, ok => juger(ok, juste));
    }
    return true;
  },
  // ALLEMAND, l'ordre des mots : gern / nicht gern (la fiche) ou un adverbe de frequence (le calendrier), juste apres
  // le verbe -- « Felix spielt oft Fußball. » contre « Felix oft spielt Fußball. » et une autre frequence
  ordre(w){
    if (!DE_APP) return false;
    if (w && !estAime(w) && !estAdv(w) && !estMotAct(w)) return false;
    let mode = estAime(w) ? "gern" : estAdv(w) ? "freq" : hasard(["gern", "freq"]);
    const f = hasard(faitsPour(w)), x = act(f.a), n = nom(f.p);
    choixTrad = {};
    let image, juste, leurres;
    if (mode === "gern"){
      viser(w, w && estMotAct(w) ? motAct(f.a) : motAime());
      image = fiche([f.p], [[f.a, f.gern]]);
      juste = P.aime("de", [f.p], f.a, f.gern); tradQ = tr("aime", [f.p], f.a, f.gern);
      const contraire = P.aime("de", [f.p], f.a, !f.gern);
      choixTrad[contraire] = {aff: contraire, sens: tr("aime", [f.p], f.a, !f.gern)};
      leurres = [contraire, n + (f.gern ? " gern " : " nicht gern ") + x.v + r(x.reste) + "."];
    } else {
      viser(w, w && estMotAct(w) ? motAct(f.a) : motAdv(f.freq));
      image = calendrier(f.p, f.a, f.freq);
      juste = P.freq("de", f.p, f.a, f.freq); tradQ = tr("freq", f.p, f.a, f.freq);
      const loin = {immer: "nie", oft: "selten", manchmal: "immer", selten: "oft", nie: "immer"}[f.freq];
      const autre = P.freq("de", f.p, f.a, loin);
      choixTrad[autre] = {aff: autre, sens: tr("freq", f.p, f.a, loin)};
      leurres = [autre, n + " " + f.freq + " " + x.v + r(x.reste) + "."];
    }
    ecran(T("fichePhrase"), image, "", true, true);
    $("zone").querySelector(".enonce").remove();
    boutons($("choix"), melanger([juste, ...leurres]), juste, ok => juger(ok, juste));
    return true;
  },
  // la frequence : (a) le calendrier, « ¿Con qué frecuencia juega Felix al fútbol? » -> a menudo / siempre / nunca ;
  // (b) la phrase, et trois calendriers de la meme personne
  frequence(w){
    if (w && !estAdv(w) && !estMotAct(w)) return false;
    const f = hasard(faitsPour(w));
    viser(w, w && estMotAct(w) ? motAct(f.a) : motAdv(f.freq));
    const juste = P.freq(A_, f.p, f.a, f.freq); tradQ = tr("freq", f.p, f.a, f.freq);
    const autres = melanger(D.freq.filter(q => q !== f.freq)).slice(0, 2);
    choixTrad = {}; autres.forEach(q => choixTrad[D.adv[APPRENDRE][q]] = {aff: D.adv[APPRENDRE][q], sens: glose(D.adv[APPRENDRE][q])});
    if (Math.random() < 0.6){
      ecran(T("freq"), calendrier(f.p, f.a, f.freq), cible(P.qFreq(A_, f.p, f.a)), true);
      boutons($("choix"), melanger([f.freq, ...autres].map(q => D.adv[APPRENDRE][q])), D.adv[APPRENDRE][f.freq], ok => juger(ok, D.adv[APPRENDRE][f.freq], juste));
    } else {
      autres.forEach(q => choixTrad[q] = {aff: P.freq(A_, f.p, f.a, q), sens: tr("freq", f.p, f.a, q) || glose(D.adv[APPRENDRE][q])});
      $("zone").innerHTML = '<p class="consigne">' + T("freqCal") + '</p><div class="cal"><div class="tete">' + imgVisage(f.p) + picto(f.a) + '</div></div>'
        + '<div class="enonce centre">' + cible(juste) + '</div><div id="rang"></div><p class="retourMsg" id="msg"></p>';
      aToucher($("rang"), melanger([f.freq, ...autres]), q => '<div class="cal">' + grille(q) + '</div>', f.freq, ok => juger(ok, juste, juste));
    }
    return true;
  },
  // la phrase, et quatre photos : une seule la montre
  cual(w){
    if (w && !estMotAct(w)) return false;
    const a = hasard(actsPour(w)), p = quiFait(a);
    viser(w, motAct(a));
    const juste = P.fait(A_, p, a); tradQ = tr("fait", p, a);
    const autres = melanger(ACTS().filter(b => b !== a));
    const proches = autres.filter(b => act(b).verbe === act(a).verbe || act(b).sorte === act(a).sorte);
    choixTrad = {}; autres.forEach(b => choixTrad[b] = {aff: P.fait(A_, quiFait(b), b), sens: tr("fait", quiFait(b), b)});
    $("zone").innerHTML = '<p class="consigne">' + T("cual") + '</p><div class="enonce centre">' + cible(juste) + '</div><div id="rang"></div><p class="retourMsg" id="msg"></p>';
    aToucher($("rang"), melanger([a, ...uniques(proches.slice(0, 1).concat(autres)).slice(0, 3)]), vignette, a, ok => juger(ok, juste, juste), true);
    return true;
  },
  // l'ecoute : la phrase dite, trois photos
  entendre(w){
    if (w && !estMotAct(w)) return false;
    const a = hasard(actsPour(w)), p = quiFait(a);
    viser(w, motAct(a));
    const juste = P.fait(A_, p, a); tradQ = tr("fait", p, a);
    const autres = melanger(ACTS().filter(b => b !== a)).slice(0, 2);
    choixTrad = {}; autres.forEach(b => choixTrad[b] = {aff: P.fait(A_, quiFait(b), b), sens: tr("fait", quiFait(b), b)});
    $("zone").innerHTML = '<p class="consigne">' + T("entendre") + '</p><button type="button" class="ecoute grand" id="ecoute" aria-label="' + T("reecouter") + '">' + HP + '</button>'
      + '<div id="rang"></div><p class="retourMsg" id="msg"></p>';
    $("ecoute").addEventListener("click", () => dire(juste));
    aToucher($("rang"), melanger([a, ...autres]), vignette, a, ok => juger(ok, juste, juste), true);
    dire(juste);
    return true;
  },
  // vrai ou faux : la photo (ce qu'il fait), la fiche (ce qu'il aime) ou le calendrier (combien de fois)
  vraifaux(w){
    const modes = !w ? ["photo", "fiche", "cal"] : estAime(w) ? ["fiche"] : estAdv(w) ? ["cal"] : estMotAct(w) ? ["photo", "fiche", "cal"] : [];
    if (!modes.length) return false;
    const mode = hasard(modes), vrai = Math.random() < 0.5;
    let image, phrase, juste;
    if (mode === "photo"){
      const a = hasard(actsPour(w)), p = quiFait(a);
      // le faux : une activite qu'il n'aime pas ou qui n'est pas sur sa fiche, jamais une qu'il fait aussi
      const b = hasard(autresPour(p, a));
      viser(w, motAct(a));
      image = photo(a); juste = P.fait(A_, p, a); phrase = vrai ? juste : P.fait(A_, p, b); tradQ = tr("fait", p, a);
    } else if (mode === "fiche"){
      const f = hasard(faitsPour(w));
      viser(w, w && estMotAct(w) ? motAct(f.a) : motAime());
      image = fiche([f.p], [[f.a, f.gern]]); juste = P.aime(A_, [f.p], f.a, f.gern);
      phrase = vrai ? juste : P.aime(A_, [f.p], f.a, !f.gern); tradQ = tr("aime", [f.p], f.a, f.gern);
    } else {
      const f = hasard(faitsPour(w));
      viser(w, w && estMotAct(w) ? motAct(f.a) : motAdv(f.freq));
      const q2 = hasard(D.freq.filter(q => q !== f.freq));
      image = calendrier(f.p, f.a, f.freq); juste = P.freq(A_, f.p, f.a, f.freq);
      phrase = vrai ? juste : P.freq(A_, f.p, f.a, q2); tradQ = tr("freq", f.p, f.a, f.freq);
    }
    choixTrad = {};
    ecran(T("vraifaux"), image, cible(phrase), true);
    const V = DE_APP ? "Richtig" : "Verdadero", F = DE_APP ? "Falsch" : "Falso", rep = vrai ? V : F;
    boutons($("choix"), [V, F], rep, ok => juger(ok, rep, juste));
    return true;
  },
  // proposer : la photo de l'activite, la phrase correcte et deux fautes de construction (pas de traduction : elles
  // ne veulent rien dire). ¿Quieres + infinitif? ¿Vamos a + infinitif? ; Hast du Lust, … zu …? Wollen wir …?
  proposer(w){
    if (w && !estPropose(w) && !estMotAct(w)) return false;
    const a = hasard(actsPour(estMotAct(w) ? w : null)), x = act(a), conj = D.formes[APPRENDRE][x.verbe];
    const f = estPropose(w) ? 0 : hasard([0, 1]);
    viser(w, estPropose(w) ? motPropose() : (w ? motAct(a) : (f === 0 ? motPropose() : motAct(a))));
    const juste = P.propose(A_, a, f); tradQ = tr("propose", a, f, APPRENDRE);
    let leurres;
    if (!DE_APP) leurres = f ? ["¿Vamos " + x.inf + "?", "¿Vamos a " + conj.wir + r(x.reste) + "?"] : ["¿Quieres " + conj.du + r(x.reste) + "?", "¿Quieres a " + x.inf + "?"];
    else if (f) leurres = x.reste ? ["Wollen wir " + x.reste + " zu " + x.inf + "?", "Wollen wir " + x.inf + " " + x.reste + "?"] : ["Wollen wir zu " + x.inf + "?", "Wollen wir " + x.v + "?"];
    else leurres = x.reste ? ["Hast du Lust, " + x.reste + " " + x.inf + "?", "Hast du Lust, zu " + x.reste + " " + x.inf + "?"] : ["Hast du Lust " + x.inf + "?", "Hast du Lust zu " + x.v + "?"];
    choixTrad = {};
    ecran(T("proposer"), photo(a), "", true, true);
    $("zone").querySelector(".enonce").remove();
    boutons($("choix"), melanger([juste, ...leurres]), juste, ok => juger(ok, juste));
    return true;
  },
  // repondre : la fiche de la personne et une proposition ; elle repond oui ou non selon ♥ ou ✗
  repondre(w){
    if (w && !estAime(w) && !estMotAct(w) && !estPropose(w)) return false;
    const f = hasard(faitsPour(estPropose(w) ? null : w)), x = act(f.a), conj = D.formes[APPRENDRE][x.verbe], sexe = D.personnes[f.p].sexe;
    const pf = estPropose(w) ? 0 : hasard([0, 1]);
    viser(w, w && estMotAct(w) ? motAct(f.a) : estPropose(w) ? motPropose() : motAime());
    const juste = P.repond(A_, f.a, f.gern, sexe), contraire = P.repond(A_, f.a, !f.gern, sexe);
    tradQ = tr("repond", f.a, f.gern, sexe);
    let faute;
    if (DE_APP) faute = f.gern ? "Ja, gern! Ich gern " + x.ich + r(x.reste) + "." : "Nein, danke. Ich nicht gern " + x.ich + r(x.reste) + ".";
    else faute = f.gern ? "¡Sí, claro! Me gusto mucho " + x.inf + "." : "No, gracias. No gusta " + x.inf + ".";
    choixTrad = {}; choixTrad[contraire] = {aff: contraire, sens: tr("repond", f.a, !f.gern, sexe)};
    ecran(T("repondre", {n: nom(f.p)}), fiche([f.p], [[f.a, f.gern]]),
      '<span class="dialogue">' + T("ami") + ' :</span>' + cible(P.propose(A_, f.a, pf)), false, true);
    boutons($("choix"), melanger([juste, contraire, faute]), juste, ok => juger(ok, juste));
    return true;
  }
};
// les sortes de la langue apprise
const SORTES = DE_APP ? ["quoi", "verbe", "forme", "ordre", "frequence", "cual", "entendre", "vraifaux", "proposer", "repondre"]
                      : ["quoi", "verbe", "art", "forme", "gusta", "frequence", "cual", "entendre", "vraifaux", "proposer", "repondre"];

// ---------- la decouverte : les activites, aimer et la frequence, proposer ----------
function decouvrir(){
  $("compte").textContent = ""; $("barre").style.width = "0%";
  const z = $("zone");
  z.innerHTML = '<div class="onglets" role="tablist"><button type="button" id="o1" role="tab">' + T("ongletAct") + '</button><button type="button" id="o2" role="tab">'
    + T("ongletAime") + '</button><button type="button" id="o3" role="tab">' + T("ongletProp") + '</button></div><div id="volet"></div>';
  let phraseDite = "";
  const ligneDite = (texte, trad) => { phraseDite = texte; $("dit").innerHTML = cible(texte) + traduction(trad); };
  const bandeau = () => '<div class="dit"><div class="texte" id="dit"></div><button type="button" class="ecoute" id="ecoute" aria-label="' + T("ecouter") + '">' + HP + '</button></div>';
  const ecouteur = () => $("ecoute").addEventListener("click", () => dire(phraseDite));
  const onglet = i => ["o1", "o2", "o3"].forEach((o, k) => $(o).classList.toggle("actif", k === i));
  // les activites : la grande photo, la phrase, les quinze vignettes
  const activites = () => {
    onglet(0);
    $("volet").innerHTML = '<p class="consigne">' + T("introAct") + '</p><div id="grand"></div>' + bandeau() + '<div class="vignettes" id="vign"></div><p class="regle">' + regle("regleAct") + '</p>';
    ecouteur();
    const montrerAct = a => { $("grand").innerHTML = photo(a); ligneDite(P.fait(A_, quiFait(a), a), tr("fait", quiFait(a), a)); };
    ACTS().forEach(a => {
      const b = document.createElement("button"); b.type = "button"; b.innerHTML = vignette(a);
      b.addEventListener("click", () => { $("vign").querySelectorAll("button").forEach(x => x.classList.toggle("choisi", x === b)); montrerAct(a); dire(phraseDite); });
      $("vign").appendChild(b);
    });
    montrerAct(ACTS()[0]); $("vign").firstChild.classList.add("choisi");
  };
  // aimer et la frequence : les visages, la fiche, le calendrier de la ligne touchee ; l'echelle des cinq adverbes
  const aimer = () => {
    onglet(1);
    $("volet").innerHTML = '<p class="consigne">' + T("introAime") + '</p><div class="visages" id="vis"></div><div id="laFiche"></div><div id="leCal"></div>' + bandeau()
      + '<p class="regle">' + regle("regleAime") + '</p><p class="regle">' + regle("regleFreq") + '</p><div class="echelle" id="echelle"></div>';
    ecouteur();
    $("echelle").innerHTML = D.freq.map(q => '<div><span lang="' + APPRENDRE + '" dir="ltr">' + D.adv[APPRENDRE][q] + '</span>' + grille(q) + '</div>').join("");
    const montrerLigne = (p, f) => {
      $("laFiche").querySelectorAll(".ligne").forEach(l => l.classList.toggle("choisi", l.dataset.a === f.a));
      $("leCal").innerHTML = '<div class="cal">' + grille(f.freq) + '</div>';
      const t = P.aime(A_, [p], f.a, f.gern) + " " + P.freq(A_, p, f.a, f.freq);
      const tt = PHRASE_TRADUITE ? tr("aime", [p], f.a, f.gern) + " " + tr("freq", p, f.a, f.freq) : null;
      ligneDite(t, tt);
    };
    const montrerPers = p => {
      $("vis").querySelectorAll("button").forEach(x => x.classList.toggle("choisi", x.dataset.p === p));
      $("laFiche").innerHTML = fiche([p], D.fiches[p].map(f => [f.a, f.gern]));
      $("laFiche").querySelectorAll(".ligne").forEach(l => l.addEventListener("click", () => { montrerLigne(p, faitDe(p, l.dataset.a)); dire(phraseDite); }));
      montrerLigne(p, faitDe(p, D.fiches[p][0].a));
    };
    PERS().forEach(p => {
      const b = document.createElement("button"); b.type = "button"; b.dataset.p = p; b.innerHTML = '<img alt="' + nom(p) + '" src="' + visage(p) + '">';
      b.addEventListener("click", () => { montrerPers(p); dire(phraseDite); });
      $("vis").appendChild(b);
    });
    montrerPers(PERS()[0]);
  };
  // proposer : des dialogues faits depuis les fiches (une proposition, la reponse de la personne selon sa fiche)
  const proposer = () => {
    onglet(2);
    $("volet").innerHTML = '<p class="consigne">' + T("introProp") + '</p><p class="regle">' + regle("regleProp") + '</p>' + bandeau() + '<div class="dialogues" id="dial"></div>';
    ecouteur();
    const exemples = [["Rosa", "tenis", 0], ["Felix", "bailar", 1], ["Ines", "cantar", 0], ["Heinz", "baloncesto", 0], ["Elena", "bailar", 1], ["Tomas", "piano", 1]];
    exemples.forEach(([p, a, pf]) => {
      const f = faitDe(p, a), sexe = D.personnes[p].sexe;
      const q = P.propose(A_, a, pf), rep = P.repond(A_, a, f.gern, sexe);
      [[q, tr("propose", a, pf, APPRENDRE), null], [rep, tr("repond", a, f.gern, sexe), p]].forEach(([t, tt, qui]) => {
        const b = document.createElement("button"); b.type = "button"; b.lang = APPRENDRE;
        b.innerHTML = (qui ? imgVisage(qui).replace('class="visage"', 'class="visage" style="width:34px;height:34px"') : picto(a)) + '<span>' + t + '</span>';
        b.addEventListener("click", () => { $("dial").querySelectorAll("button").forEach(x => x.classList.toggle("choisi", x === b)); ligneDite(t, tt); dire(t); });
        $("dial").appendChild(b);
      });
    });
    const premier = exemples[0];
    ligneDite(P.propose(A_, premier[1], premier[2]), tr("propose", premier[1], premier[2], APPRENDRE));
  };
  $("o1").addEventListener("click", activites); $("o2").addEventListener("click", aimer); $("o3").addEventListener("click", proposer);
  activites();
  const s = $("suite"); s.textContent = T("commencer"); s.hidden = false;
  s.onclick = () => { s.onclick = null; taire(); demarrer(); };
}
// ce que la page peut dire hors des parties (visuel/voix_themes.py) : les phrases de la decouverte
function textesAVoix(){
  const t = [];
  ACTS().forEach(a => t.push(P.fait(A_, quiFait(a), a)));
  faits().forEach(f => t.push(P.aime(A_, [f.p], f.a, f.gern) + " " + P.freq(A_, f.p, f.a, f.freq)));
  ACTS().forEach(a => [0, 1].forEach(pf => t.push(P.propose(A_, a, pf))));
  return uniques(t);
}

// LA PARTIE (3 nov. 2026, « le tirage suit les mots ») : la file des MOTS vient de l'app (Tirage.plan : les dus,
// les rates recents, puis au plus NEUFS_MAX nouveaux) ; chaque mot recoit une question d'une sorte qui le vise,
// jamais la meme sorte deux fois de suite, jamais deux fois la meme question. Rate, il revient plus loin.
// Recopie de familia.html (visuel/THEMES-ILLUSTRES.md : ces fonctions sont identiques d'un theme a l'autre).
const NEUFS_MAX = Q.get("seance") === "1" ? 3 : 10;
let vus = new Set(), sorteCourante = null, derniereSorte = null;
function cleQuestion(){
  const z = $("zone"), en = z.querySelector(".enonce");
  // la bonne reponse en fait partie (les sortes sans enonce : la phrase a choisir) ; les leurres non : la meme
  // question avec d'autres leurres n'en est pas une nouvelle
  const j = z.querySelector("#choix button[data-bon], #rang button[data-bon]");
  return sorteCourante + "|" + (en ? en.textContent : "") + "|" + (j ? (j.dataset.id || j.textContent) : "")
    + "|" + Array.from(z.querySelectorAll(".photo img, .fiche img, .cal .tete img")).map(i => i.getAttribute("src")).sort().join(",")
    + "|" + Array.from(z.querySelectorAll(".fiche .ligne, .cal .tete .picto")).map(l => l.dataset.a || l.innerHTML.length).join(",")
    + "|" + (z.querySelector("#rang") ? "r" : z.querySelectorAll(".grille span.on").length);
}
function montrer(){
  repondu = false; $("suite").hidden = true; $("bas").hidden = true;
  $("compte").textContent = (rang + 1) + " / " + file.length;
  $("barre").style.width = (rang / file.length * 100) + "%";
  // une question pour le mot du rang : d'une AUTRE sorte que la precedente et jamais deja vue dans la partie.
  // Si ce mot ne le permet pas, un mot plus loin dans la file passe devant ;
  // en dernier recours seulement, la meme sorte, puis une question deja vue.
  // (l'ecoute parle a chaque essai : on la fait taire pendant qu'on cherche, elle parle une fois choisie)
  const garde = dire; dire = () => {};
  const raz = so => { motQ = null; tradQ = null; choixQ = null; choixTrad = {}; sorteCourante = so; };
  const essai = (w, strict) => {
    const autres = melanger(SORTES.filter(x => x !== derniereSorte));
    for (const so of autres){
      for (let n = 0; n < 25; n++){
        raz(so);
        if (!EX[so](w)) break;
        if (!vus.has(cleQuestion())) return so;
      }
    }
    if (strict) return null;
    if (derniereSorte) for (let n = 0; n < 25; n++){           // la meme sorte, avec une question fraiche
      raz(derniereSorte);
      if (!EX[derniereSorte](w)) break;
      if (!vus.has(cleQuestion())) return derniereSorte;
    }
    for (const so of autres.concat(derniereSorte ? [derniereSorte] : [])){   // tout est deja vu : n'importe laquelle
      raz(so);
      if (EX[so](w)) return so;
    }
    return null;
  };
  let fait = essai(file[rang], true);
  for (let j = rang + 1; !fait && j < file.length; j++){
    fait = essai(file[j], true);
    if (fait) [file[rang], file[j]] = [file[j], file[rang]];
  }
  if (!fait) fait = essai(file[rang], false);
  dire = garde;
  if (fait === "entendre"){ const e = $("ecoute"); if (e) e.click(); }
  vus.add(cleQuestion()); derniereSorte = fait;
  window.scrollTo(0, 0);
}
function fin(){
  $("barre").style.width = "100%"; $("compte").textContent = file.length + " / " + file.length; $("suite").hidden = true;
  $("zone").innerHTML = '<div class="fin"><div class="score">' + T("score", {b: bons, n: file.length}) + '</div></div>';
  basDePartie();
  $("terminer").addEventListener("click", () => parler("fini", {bons, faits: file.length}));
}
// plus rien de du ni de nouveau : la partie le dit, et ne repose pas des mots deja sus
function toutRevu(prochaine){
  $("barre").style.width = "100%"; $("compte").textContent = ""; $("suite").hidden = true;
  const quand = Tirage.revu(prochaine, LANGUE);
  $("zone").innerHTML = '<div class="fin"><div class="score">' + (TIRAGE_TEXTES.revu[LANGUE] || TIRAGE_TEXTES.revu.fr) + '</div>'
    + (quand ? '<p class="consigne">' + (TIRAGE_TEXTES.prochaine[LANGUE] || TIRAGE_TEXTES.prochaine.fr).replace("{d}", quand) + '</p>' : "")
    + '</div>';
  basDePartie();
  $("terminer").addEventListener("click", () => parler("fini", {bons: 0, faits: 0}));
}
// « Encore des questions » : en fin de partie et quand tout est revu, jamais dans la seance (elle a sa longueur)
const boutonEncore = () => Q.get("seance") === "1" ? "" : '<button type="button" class="second" id="encore">' + (TIRAGE_TEXTES.encore[LANGUE] || TIRAGE_TEXTES.encore.fr) + '</button>';
function basDePartie(){
  const b = $("bas"); b.innerHTML = boutonEncore() + '<button type="button" class="principal" id="terminer">' + T("terminer") + '</button>'; b.hidden = false;
  const e = $("encore"); if (e) e.addEventListener("click", () => { b.hidden = true; encoreDesQuestions(); });
}
async function encoreDesQuestions(){
  const mots = motsDuTheme();
  file = Tirage.supplement(mots, await Tirage.demander(mots), NB); rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(null);
  montrer();
}
async function demarrer(){
  const mots = motsDuTheme();
  const plan = Tirage.plan(mots, await Tirage.demander(mots), NB, NEUFS_MAX);
  file = plan.file; rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(plan.prochaine);
  montrer();
}
$("suite").addEventListener("click", () => { if (!file.length) return; rang++; if (rang >= file.length) fin(); else montrer(); });
$("retour").addEventListener("click", () => parler("fermer"));
$("retour").setAttribute("aria-label", T("retourAria"));
$("titre").textContent = T("titre");
document.title = T("titre");
fetch("loisirs/loisirs.json?v=1").then(r => r.json()).then(d => {
  D = d;
  if (Q.get("seance") === "1") demarrer(); else decouvrir();
});
