<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Im Spanischkurs</title>
<!--
  PROTOTYPE de scene interactive (6 oct. 2026). Hors de l'app : il s'ouvre en
  double-cliquant ce fichier. Les zones et les mots viennent de
  scene-<nom>.js, que construire.py refait depuis themes.json.

  UNE PAGE POUR TOUTES LES SCENES : index.html montre la classe,
  index.html?scene=arztpraxis le cabinet medical. Rien de propre a une scene
  ne vit ici -- titre, consigne, questions A2-C1 sont dans <nom>.points.json.
  Ajouter une scene ne doit jamais vouloir dire recopier cette page.

  Une seule image, une couche par niveau (A1 noms ; A2 prepositions ; B1 verbes
  de position ; B2 relatives ; C1 hypotheses). Les pastilles changent de couche
  sur la meme image -- idee de Jacques.
-->
<style>
:root{
  --encre:#1C2430; --ambre:#E8A23A; --papier:#FBF7EF;
  --der:#2563EB; --die:#DC2626; --das:#16A34A;
  --ok:#15803D; --faux:#B91C1C;
}
*{box-sizing:border-box}
html,body{margin:0;background:#11151b;color:var(--encre);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.cadre{max-width:430px;margin:0 auto;position:relative}
.scene{position:relative;width:100%;aspect-ratio:1080/1935;overflow:hidden;
  background:#2a2a2a;user-select:none;-webkit-user-select:none}
.scene img{position:absolute;inset:0;width:100%;height:100%;display:block}
.zone{position:absolute;border:0;padding:0;margin:0;background:transparent;
  cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:6px}
.zone:focus-visible{outline:2px dashed var(--ambre)}
.voir-zones .zone{outline:1.5px solid rgba(232,162,58,.85);background:rgba(232,162,58,.10)}

/* le haut : AU-DESSUS de l'image -- pose sur le plafond, il cachait l'horloge et la lampe */
.haut{position:sticky;top:0;padding:8px 8px 8px;z-index:2000;background:#11151b;
  display:flex;flex-direction:column;gap:6px}
.barre{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
/* flex-wrap (9 oct.) : avec « Retourner Mark » et cinq pastilles, la barre
   sortait de l'ecran a 375 px -- B2 et C1 n'etaient plus touchables. */
.titre{font-weight:700;font-size:15px;color:var(--encre);background:rgba(251,247,239,.92);
  padding:6px 10px;border-radius:999px}
.retour-choix{text-decoration:none;font-weight:600}
.retour-choix:focus-visible{outline:2px solid var(--ambre);outline-offset:2px}
/* l'autre vue de la scene : Mark de face, puis de dos (9 oct.) */
.retourner{text-decoration:none;font-weight:700;background:var(--ambre);white-space:nowrap}
.retourner[hidden]{display:none}
.retourner:focus-visible{outline:2px solid var(--encre);outline-offset:2px}
.niveaux{display:flex;gap:4px;background:rgba(251,247,239,.92);padding:3px;border-radius:999px}
.niveaux button{border:0;background:transparent;font:600 13px/1 inherit;color:var(--encre);
  padding:7px 9px;border-radius:999px;cursor:pointer;min-width:34px}
.niveaux button[aria-pressed=true]{background:var(--encre);color:#fff}
.carte{background:rgba(251,247,239,.96);border-radius:14px;padding:10px 12px;
  box-shadow:0 4px 18px rgba(0,0,0,.25);font-size:15px;line-height:1.35}
.carte .consigne{font-size:12px;letter-spacing:.02em;text-transform:uppercase;
  color:#8F560B;font-weight:700;margin-bottom:3px}
.carte .question{font-size:18px;font-weight:650}
.modes{display:flex;gap:6px;margin-top:8px}
.modes button{flex:1;border:1.5px solid var(--encre);background:transparent;border-radius:10px;
  padding:7px;font:600 13px inherit;cursor:pointer}
.modes button[aria-pressed=true]{background:var(--encre);color:#fff}

/* le bas : sur le plancher */
.bas{position:absolute;left:0;right:0;bottom:0;z-index:2000;padding:8px;
  display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.bas > .explication,.bas > .suite,.bas > .score{flex-basis:100%}
/* Quand l'objet de la question est dans le bas de l'image (le portable, le
   sac), le panneau monte sur le mur et le plafond, ou il n'y a presque rien. */
.bas.en-haut{bottom:auto;top:0;align-items:flex-start}
/* TOUJOURS AU MEME ENDROIT (Jacques, 9 oct.) : en C1 les reponses etaient en
   haut de l'image, en B2 en bas, en B1 en haut -- selon ou tombait l'objet
   de la question. Sur une scene du corps, ou Mark occupe toute la hauteur,
   elles cachaient toujours quelque chose. Le panneau vit maintenant SOUS LA
   QUESTION, dans le bandeau du haut : meme place, et rien de l'image cache. */
.haut .bas{position:static;padding:8px 0 0;align-items:stretch}
.choix{border:0;border-radius:12px;padding:10px 12px;font:600 15px inherit;text-align:left;flex:1 1 auto;
  background:rgba(251,247,239,.96);color:var(--encre);cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.25)}
.choix.ok{background:#DCFCE7;outline:2px solid var(--ok)}
.choix.faux{background:#FEE2E2;outline:2px solid var(--faux)}
.choix:disabled{cursor:default}
.explication{background:rgba(28,36,48,.94);color:#fff;border-radius:12px;padding:10px 12px;
  font-size:14px;line-height:1.4}
.explication b{color:var(--ambre)}
.suite{border:0;border-radius:12px;padding:12px;font:700 16px inherit;background:var(--ambre);
  color:var(--encre);cursor:pointer}
.score{font-size:13px;color:#fff;text-align:right;text-shadow:0 1px 3px #000}

/* le contour lumineux d'un objet : une toile a la resolution des masques,
   etiree sur la scene, avec un halo ambre */
.voile{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1490;display:block}
.contours{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1500;display:block;overflow:visible;
  filter:drop-shadow(0 0 3px rgba(232,162,58,.9))}
.contours.vivant{animation:lueur 1.4s ease-in-out infinite}
@keyframes lueur{50%{filter:drop-shadow(0 0 7px rgba(232,162,58,1))}}
@media (prefers-reduced-motion:reduce){.contours.vivant{animation:none}}
/* (ancien) le cadre lumineux autour d'un objet */
.anneau{position:absolute;border-radius:10px;pointer-events:none;z-index:1500;
  box-shadow:0 0 0 3px var(--ambre),0 0 0 9999px rgba(0,0,0,.28);
  animation:pulse 1.2s ease-in-out infinite}
.anneau.second{box-shadow:0 0 0 3px #fff;animation:none;border:2px dashed #fff}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--ambre),0 0 0 9999px rgba(0,0,0,.28)}}
@media (prefers-reduced-motion:reduce){.anneau{animation:none}}

/* l'etiquette d'un mot */
.etiquette{position:absolute;z-index:1800;transform:translate(-50%,-100%);
  background:#fff;border-radius:10px;padding:6px 10px 7px;white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.35);font-size:15px;pointer-events:none;
  text-align:center}
.etiquette.dessous{transform:translate(-50%,0)}
.etiquette .art{font-weight:800}
.etiquette .nom{font-weight:700}
.etiquette .fr{display:block;font-size:12px;color:#556}
.g-der{color:var(--der)} .g-die{color:var(--die)} .g-das{color:var(--das)}
.secoue{animation:secoue .35s}
@keyframes secoue{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* le gros plan d'un visage (Jacques, 6 oct.) : un calque qui part du cadre du
   visage dans la scene et s'agrandit jusqu'a la remplir */
/* LES CONFETTIS ET LE SON D'UNE REUSSITE (Jacques, 9 oct. : « quand c'est une
   reussite, on devrait encore avoir des petits confettis avec le bruit »).
   Les memes que l'app : launchConfetti() et les trois notes de BRAVO_NOTES. */
.confetti-piece{position:fixed;top:0;left:0;border-radius:2px;pointer-events:none;z-index:9999;
  animation-name:confettiBurst;animation-timing-function:cubic-bezier(.15,.7,.4,1);animation-fill-mode:forwards}
@keyframes confettiBurst{
  0%{transform:translate(-50%,-50%) rotate(0deg) scale(1);opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.confetti-piece{display:none}}
/* le nom de la vue, le temps d'un changement d'image (« Mark, de dos ») */
.bandeau-vue{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:1700;
  background:rgba(28,36,48,.9);color:#fff;border-radius:999px;padding:7px 14px;
  font:700 14px inherit;pointer-events:none;white-space:nowrap;animation:bandeau 1.8s ease forwards}
@keyframes bandeau{0%{opacity:0}12%{opacity:1}75%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.bandeau-vue{animation:none}}
/* dans la seance, c'est l'app qui change de vue, pas l'eleve */
.en-seance .retourner{display:none}
.gros-plan{position:absolute;z-index:1600;overflow:hidden;background:#111;
  transition:left .45s ease,top .45s ease,width .45s ease,height .45s ease}
.gros-plan .fond{position:absolute;inset:0;background-repeat:no-repeat}
.gros-plan svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
/* FIXE, juste sous la carte (place par placerFermer) : le gros plan est plus
   haut que l'ecran du telephone, et un bouton pose en haut de l'image passait
   sous la carte collee des qu'on descendait voir le bas de l'affiche -- plus
   moyen de revenir (Jacques, 6 oct.). */
/* Et VOYANT : petit et creme sur une image claire, Jacques ne le trouvait
   pas (« je ne vois pas comment rapetisser l'image », 6 oct.). */
.gros-plan .fermer{position:fixed;left:8px;top:8px;z-index:3;border:2px solid var(--encre);border-radius:999px;
  padding:11px 16px;font:800 16px inherit;background:var(--ambre);color:var(--encre);
  box-shadow:0 4px 16px rgba(0,0,0,.45);cursor:pointer}
.gros-plan .fermer:focus-visible{outline:2px solid var(--ambre);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.gros-plan{transition:none}}

.pied{max-width:430px;margin:10px auto 30px;padding:0 12px;color:#c9ced8;font-size:12px;line-height:1.5}
/* Dans la seance : ni pastilles (le niveau est celui de la seance), ni modes
   (on cherche), ni pied de controle. */
.en-seance .niveaux,.en-seance .modes,.en-seance .pied{display:none}
/* Et tout tient dans l'ecran : l'image prend la hauteur qui reste sous la
   carte (ajusterSeance), quitte a etre plus etroite. Il fallait faire
   defiler pour atteindre les reponses (Jacques, 6 oct.). */
.en-cadre .cadre{max-width:none}
.en-cadre .scene{margin:0 auto}
.pied label{display:flex;gap:6px;align-items:center;margin-bottom:6px;color:#fff}
</style>
</head>
<body>
<div class="cadre">
  <div class="haut">
    <div class="barre">
      <a class="titre retour-choix" id="retourChoix" href="choix-seance.html" aria-label="Retour au choix de la séance">‹</a>
      <a class="titre retourner" id="retourner" hidden></a>
      <div class="niveaux" id="niveaux" role="group" aria-label="Niveau"></div>
    </div>
    <div class="carte" id="carte"></div>
  </div>
  <div class="scene" id="scene">
    <img id="photo" alt="">
    <div class="bas" id="bas"></div>
  </div>
</div>
<div class="pied">
  <label><input type="checkbox" id="voirZones"> Montrer les zones à toucher (contrôle)</label>
  Prototype — rien n'est enregistré. Image générée (fal), voix du navigateur.
</div>

<script>
/* La scene a charger : ?scene=arztpraxis, la classe par defaut. Le nom ne
   garde que des minuscules et des tirets, puisqu'il devient un nom de
   fichier. document.write et pas fetch() : un navigateur refuse fetch() sur
   file://, et le prototype doit s'ouvrir d'un double-clic. */
const NOM_SCENE = (new URLSearchParams(location.search).get("scene") || "")
  .replace(/[^a-z-]/g, "") || "klassenzimmer";
/* ?t= : jamais la version en cache. Le telephone de Jacques a melange une
   ancienne image et de nouvelles coordonnees (6 oct.) ; un prototype qu'on
   corrige toutes les dix minutes ne doit rien garder. */
/* La facon de montrer Mark sur une scene du corps : DECIDE par Jacques le
   9 oct. -- « l'eclairage de Mark, ce n'est pas beau ; on avait decide une
   ligne de contour ». Le trait bleu est donc le defaut ; ?mise=sombre garde
   l'ancien projecteur pour comparer. */
const MISE = new URLSearchParams(location.search).get("mise") === "sombre" ? "sombre" : "bleu";
const FRAIS = "?t=" + Date.now();
/* Chaque fichier ecrit window.SCENE et window.MASQUES : on les range au fur
   et a mesure, sous le nom de la vue, avant que la suivante les ecrase. */
const RANGER = v => `<script>window.SCENES=window.SCENES||{};window.MASQUES_DE=window.MASQUES_DE||{};`
  + `window.SCENES["${v}"]=window.SCENE;window.MASQUES_DE["${v}"]=window.MASQUES;<\/script>`;
document.write(`<script src="scene-${NOM_SCENE}.js${FRAIS}"><\/script>`
             + `<script src="masques-${NOM_SCENE}.js${FRAIS}"><\/script>` + RANGER(NOM_SCENE));
</script>
<script>
/* UNE SCENE, PLUSIEURS VUES (9 oct. 2026) : Mark de face et de dos, les
   quatre etals du marche. Les autres vues du groupe (champ vues) se chargent
   ICI, d'un coup : passer de l'une a l'autre ne recharge plus la page, et le
   score de la seance survit au changement d'image. */
for (const v of (window.SCENES[NOM_SCENE].vues || []))
  if (v !== NOM_SCENE && /^[a-z-]+$/.test(v))
    document.write(`<script src="scene-${v}.js${FRAIS}"><\/script>`
                 + `<script src="masques-${v}.js${FRAIS}"><\/script>` + RANGER(v));
</script>
<script>
"use strict";
let VUE = NOM_SCENE;
const VUES = window.SCENES[NOM_SCENE].vues || [NOM_SCENE];
let S = window.SCENES[VUE];
window.MASQUES = window.MASQUES_DE[VUE];
let P = Object.fromEntries(S.points.map(p => [p.id, p]));
const $ = id => document.getElementById(id);
const scene = $("scene");
document.querySelector(".haut").appendChild($("bas"));
$("photo").src = S.image;
$("photo").alt = S.alt || "";
document.title = S.titre || "Scène";
/* Dans la seance, ce lien RAMENE au choix scene / cartes : il dit « Retour »,
   comme les autres retours de l'app. « ‹ Beim Arzt » ressemblait a un titre
   et menait ailleurs (Jacques, 6 oct.). Hors seance, il garde le titre. */
/* « ‹ Retour » PARTOUT (Jacques, 9 oct.) : le titre de la scene (« Auf dem
   Markt », « Im Spanischkurs ») ressemblait a un titre, pas a une sortie. */
$("retourChoix").textContent = "‹ Retour";
scene.style.aspectRatio = MASQUES.W + " / " + MASQUES.H;
/* Le retour a l'ecran de choix de la seance (la maquette) : a cote dans le
   depot, choix-seance.html ; publiee, la maquette est la page d'accueil et
   la classe s'appelle classe.html. */
if (/classe\.html$/.test(location.pathname)) $("retourChoix").href = "index.html";
/* L'AUTRE VUE de la meme scene (9 oct.) : Mark de face, puis de dos ; l'etal
   suivant au marche. Hors seance, ce bouton sert a FLANER d'une vue a
   l'autre. Dans la seance il disparait : c'est l'app qui change de vue quand
   la question l'exige (Jacques : « l'image devrait changer automatiquement »). */
function majAutreVue(){
  const b = $("retourner");
  b.hidden = !S.autre_vue;
  if (!S.autre_vue) return;
  const q = new URLSearchParams(location.search);
  q.set("scene", S.autre_vue.scene);
  b.href = "?" + q.toString();
  b.textContent = S.autre_vue.libelle;
}
majAutreVue();
$("retourner").addEventListener("click", e => {
  if (!S.autre_vue || !window.SCENES[S.autre_vue.scene]) return;   // vue non chargee : le lien recharge
  e.preventDefault();
  activerVue(S.autre_vue.scene, true);
  if (niveau === "A1" && modeA1 === "decouvrir") decouvrir();
});

/* ---------- la reussite : confettis et trois notes ---------- */
/* Copie de launchConfetti() et de BRAVO_NOTES (index.html de l'app) : la
   scene doit feter une bonne reponse exactement comme les cartes. */
const BRAVO_NOTES = [1046.5, 1318.51, 1567.98];   // do, mi, sol
let audioCtx = null;
function sonBravo(){
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    audioCtx = audioCtx || new C();
    const t0 = audioCtx.currentTime;
    BRAVO_NOTES.forEach((f, k) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = t0 + k * 0.11;
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.32, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.4);
    });
  } catch (e) {}
}
function confettis(){
  const couleurs = ["#3b82f6", "#8b5cf6", "#22c55e", "#f59e0b", "#ef4444", "#06b6d4"];
  const cx = innerWidth / 2, cy = innerHeight * 0.35;
  for (let k = 0; k < 28; k++){
    const e = document.createElement("div"), a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 150;
    e.className = "confetti-piece";
    e.style.left = cx + "px"; e.style.top = cy + "px";
    e.style.background = couleurs[Math.floor(Math.random() * couleurs.length)];
    e.style.setProperty("--dx", Math.cos(a) * d + "px");
    e.style.setProperty("--dy", Math.sin(a) * d - 70 + "px");
    e.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
    e.style.width = (5 + Math.random() * 5) + "px";
    e.style.height = (8 + Math.random() * 8) + "px";
    e.style.animationDuration = (0.8 + Math.random() * 0.6) + "s";
    document.body.appendChild(e);
    e.addEventListener("animationend", () => e.remove());
  }
}
function bravo(){ confettis(); sonBravo(); }

/* ---------- la voix ---------- */
let voixDe = null;
function chargerVoix(){
  const v = speechSynthesis.getVoices();
  voixDe = v.find(x => /^de(-|_)DE/i.test(x.lang) && /google|natural|online/i.test(x.name))
        || v.find(x => /^de/i.test(x.lang)) || null;
}
if ("speechSynthesis" in window){ chargerVoix(); speechSynthesis.onvoiceschanged = chargerVoix; }
function dire(t){
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "de-DE"; if (voixDe) u.voice = voixDe; u.rate = .92;
  speechSynthesis.speak(u);
}

/* ---------- les zones : des MASQUES, plus des rectangles ---------- */
/* Jacques, 6 oct. : « comme sur Apple, l'objet au complet, meme avec les pattes
   de la table ». Chaque zone a son masque (detourer.py, SAM 2) : on teste les
   PIXELS de l'objet sous le doigt, et le surlignage suit son contour.
   Le plan d'une zone : une personne passe DEVANT ce qui est derriere elle (le
   prof devant le tableau), et ce qui est pose sur elle herite de son plan. A
   plan egal, le plus petit objet gagne. */
let MW = MASQUES.w, MH = MASQUES.h;
/* Les parties d'un gros plan (l'oeil, le nez du prof) n'ont pas de masque :
   ce sont des ellipses, touchees seulement dans le gros plan.
   Une seule fois par vue : les masques decodes restent sur les zones. */
let ZONES = [];
function preparerZones(){
  ZONES = S.points.filter(p => !p.detail);
  if (S._prete) return;
  for (const p of ZONES){
    const m = new Uint8Array(MW * MH);
    let k = 0, v = 0;
    for (const n of MASQUES.zones[p.id]){ if (v) m.fill(1, k, k + n); k += n; v ^= 1; }
    p.masque = m;
    let x0 = MW, y0 = MH, x1 = -1, y1 = -1, n = 0;
    for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (m[y*MW + x]){
      n++; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    p.pixels = n;
    p.cadre = [x0/MW*100, y0/MH*100, (x1-x0+1)/MW*100, (y1-y0+1)/MH*100];
  }
  S._prete = true;
}
preparerZones();
const plan = p => { let n = 0, z = p, k = 0; while (z && k < 5){ n = Math.max(n, z.devant || 0); z = P[z.sur]; k++; } return n; };
const devantDe = (a, b) => plan(b) - plan(a) || a.pixels - b.pixels;
/* Ce qui est sous le doigt, avec une marge : un doigt couvre plus qu'un pixel,
   et le stylo d'Anna ne fait que quelques pixels de large. */
const RAYON = 3;
function sous(xp, yp){
  const cx = Math.floor(xp / 100 * MW), cy = Math.floor(yp / 100 * MH);
  const exact = [], proche = [];
  for (const p of ZONES){
    if (p.masque[cy*MW + cx]) { exact.push(p); continue; }
    cherche: for (let dy = -RAYON; dy <= RAYON; dy++) for (let dx = -RAYON; dx <= RAYON; dx++){
      const x = cx + dx, y = cy + dy;
      if (x >= 0 && y >= 0 && x < MW && y < MH && p.masque[y*MW + x]){ proche.push(p); break cherche; }
    }
  }
  // Les PETITS objets (un stylo) se rattrapent de plus loin : 7 pixels de
  // masque, ~7 px d'ecran. Jacques n'arrivait pas a toucher le stylo d'Anna.
  const petits = ZONES.filter(p => p.pixels < MW * MH * 0.004 && !exact.includes(p) && (() => {
    for (let dy = -7; dy <= 7; dy++) for (let dx = -7; dx <= 7; dx++){
      const x = cx + dx, y = cy + dy;
      if (x >= 0 && y >= 0 && x < MW && y < MH && p.masque[y*MW + x]) return true;
    }
    return false;
  })());
  return {exact: exact.sort(devantDe), proche: proche.sort(devantDe), petits};
}
/* Un bouton invisible par zone, pour le clavier et les lecteurs d'ecran
   seulement : le doigt, lui, est lu par la scene. */
function boutonsZones(){
  scene.querySelectorAll("button.zone").forEach(b => b.remove());
  for (const p of ZONES){
    const [x,y,w,h] = p.cadre;
    const b = document.createElement("button");
    b.className = "zone"; b.dataset.id = p.id;
    b.style.cssText = `left:${x}%;top:${y}%;width:${w}%;height:${h}%;pointer-events:none`;
    b.setAttribute("aria-label", p.personne || p.mot);
    b.addEventListener("click", () => toucher(p.id, null));
    scene.appendChild(b);
  }
}
boutonsZones();
scene.addEventListener("click", e => {
  if (e.target.closest(".bas") || e.target.closest("button:not(.zone)") || e.target.closest(".gros-plan")) return;
  const r = scene.getBoundingClientRect();
  const pt = [(e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 100];
  const g = grosPlanSous(pt);
  if (g && !zoom && veutGrosPlan(g)) return ouvrirGrosPlan(g);
  const {exact, proche} = sous(pt[0], pt[1]);
  const p = exact[0] || proche[0];
  if (p) toucher(p.id, pt);
});

/* ---------- surlignage : le contour de l'objet ---------- */
/* Le contour est un TRACE VECTORIEL (detourer.py : masque nettoye, puis
   polygone simplifie), dessine en SVG : net a tout zoom, et un bord droit
   reste droit. Jacques, 6 oct. : le contour du masque etire faisait des
   escaliers sur la table. Deux calques : le voile (qui assombrit le reste) et
   le contour avec son halo -- sur un seul, le halo teintait toute l'image. */
const SVG = "http://www.w3.org/2000/svg";
let TW = MASQUES.W, TH = MASQUES.H;
function calque(classe){
  const v = document.createElementNS(SVG, "svg");
  v.setAttribute("viewBox", `0 0 ${TW} ${TH}`);
  v.setAttribute("preserveAspectRatio", "none");
  v.setAttribute("class", classe);
  v.setAttribute("aria-hidden", "true");
  scene.appendChild(v);
  return v;
}
const voile = calque("voile"), toile = calque("contours");
const chemin = id => (MASQUES.traces[id] || []).map(pts => {
  let d = "";
  for (let k = 0; k < pts.length; k += 2) d += (k ? "L" : "M") + pts[k] + " " + pts[k+1];
  return d + "Z";
}).join("");
let allumes = [];
function dessiner(){
  const principaux = allumes.filter(a => !a.second);
  // LE PROJECTEUR (8 oct.) : sur une scene du corps, Mark reste eclaire et le
  // reste de la piece s'assombrit un peu, en Decouvrir comme en Trouve -- on
  // comprend sans un mot que c'est LUI qu'on explore (Jacques : « en mode
  // decouvrir, on peut etre porte a cliquer sur le medecin aussi »).
  // Un surlignage le remplace le temps de la reponse.
  // Deux facons de le montrer (essai du 8 oct.) ; Jacques a choisi le trait
  // bleu le 9 oct. (voir MISE) :
  //   ?mise=sombre : Mark eclaire, le reste assombri ;
  //   bleu (defaut) : la photo intacte, un trait BLEU fin et calme autour de
  //   Mark, toujours la -- dans le calque du voile, qui ne pulse pas, pour
  //   ne jamais se confondre avec le contour AMBRE d'une reponse.
  const corps = S.corps && MASQUES.traces[S.corps];
  const projecteur = !principaux.length && corps && MISE === "sombre";
  const traitBleu = corps && MISE === "bleu"
    ? `<path d="${chemin(S.corps)}" fill="none" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke="rgba(255,255,255,.75)" stroke-width="4.5"/>`
    + `<path d="${chemin(S.corps)}" fill="none" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke="#2F6FE4" stroke-width="2.25"/>`
    : "";
  voile.innerHTML = (principaux.length
    ? `<path fill="rgba(0,0,0,.30)" fill-rule="evenodd" d="M0 0H${TW}V${TH}H0Z${principaux.map(a => chemin(a.id)).join("")}"/>`
    : projecteur ? `<path fill="rgba(0,0,0,.38)" fill-rule="evenodd" d="M0 0H${TW}V${TH}H0Z${chemin(S.corps)}"/>` : "") + traitBleu;
  // les references d'abord, la cible par-dessus
  toile.innerHTML = [...allumes.filter(a => a.second), ...principaux].map(a =>
    `<path d="${chemin(a.id)}" fill="none" vector-effect="non-scaling-stroke" stroke-linejoin="round"
       stroke="${a.second ? "#fff" : "#E8A23A"}" stroke-width="${a.second ? 2 : 2.75}"
       ${a.second ? 'stroke-dasharray="6 4"' : ""}/>`).join("");
  toile.classList.toggle("vivant", principaux.length > 0);
}
function effacer(){ allumes = []; dessiner(); scene.querySelectorAll(".etiquette").forEach(n => n.remove());
  if (zoom) zoom.svg.innerHTML = ""; }
function anneau(id, second){
  if (zoom && zoom.g.formes[id]) return anneauGros(id, second);
  allumes.push({id, second: !!second}); dessiner();
}
const englobe = p => p.cadre;
$("voirZones").addEventListener("change", e => {
  if (e.target.checked){ allumes = S.points.map(p => ({id: p.id, second: true})); dessiner(); }
  else effacer();
});
function groupe(p){
  const art = p.genre || "";
  return `<span class="art g-${art}">${art}</span> <span class="nom g-${art}">${p.mot}</span>`;
}
/* Tous les noms d'une zone, le principal d'abord. En « Trouve ! », l'etiquette
   montre le mot DEMANDE : on demande die Frau et on touche Anna, elle dit
   « Anna · die Frau » (Jacques, 6 oct.). */
const nomsDe = p => [{genre: p.genre, mot: p.mot, fr: p.fr, pluriel: p.pluriel}, ...p.aussi];
/* `quel` : le rang du nom a montrer, ou le mot lui-meme (celui qu'on a
   demande en « Trouve ! ») ; par defaut, le nom principal. */
function etiquette(id, quel){
  if (zoom && zoom.g.formes[id]) return etiquetteGros(id);
  const p = P[id], [x,y,w,h] = englobe(p);
  const noms = nomsDe(p);
  const n = (typeof quel === "string" ? noms.find(m => m.mot === quel) : noms[quel || 0]) || noms[0];
  const e = document.createElement("div");
  const dessous = y < 30;
  e.className = "etiquette" + (dessous ? " dessous" : "");
  const cx = Math.min(80, Math.max(20, x + w/2));
  e.style.left = cx + "%";
  e.style.top = (dessous ? y + h + 1 : y - 1) + "%";
  // Le nom seul, sans la liste de ses autres noms : voir le crayon dans la
  // liste d'Anna ne voulait rien dire, et la liste melait tout (Jacques, 6 oct.).
  e.innerHTML = (p.personne ? `<b>${p.personne}</b> · ` : "") + groupe(n)
              + `<span class="fr">${n.fr}${n.pluriel ? " · pl. die " + n.pluriel : ""}</span>`;
  scene.appendChild(e);
  // Une etiquette centree sur un objet du bord sortait de l'ecran (das Handy) :
  // on la ramene dans le cadre apres l'avoir mesuree.
  const r = e.getBoundingClientRect(), c = scene.getBoundingClientRect(), marge = 6;
  if (r.left < c.left + marge) e.style.left = `calc(${e.style.left} + ${c.left + marge - r.left}px)`;
  else if (r.right > c.right - marge) e.style.left = `calc(${e.style.left} - ${r.right - c.right + marge}px)`;
}

/* ---------- le gros plan d'un visage ---------- */
/* Jacques, 6 oct. : l'oeil, le nez, la bouche sont trop petits pour le doigt
   dans la scene entiere. Toucher le visage du prof l'agrandit : le calque part
   du cadre du visage et s'etend a toute la scene, et ses parties deviennent
   des cibles a la taille du doigt. Une partie est une ellipse en % de l'image
   (construire.py) ; dans le gros plan, on la touche, on l'entoure et on
   l'etiquette dans ces memes coordonnees.
   ⚠️ L'image n'a que 1080 px de large : le visage en fait une centaine, et le
   gros plan est flou. C'est un essai du GESTE ; la vraie scene aura son
   visage agrandi par une IA. */
let GROS = S.grosPlans || [];
let zoom = null; // {g, el, svg} tant que le gros plan est ouvert
const dans = (pt, [x,y,w,h]) => pt[0] >= x && pt[0] <= x + w && pt[1] >= y && pt[1] <= y + h;
const grosPlanSous = pt => GROS.find(g => dans(pt, g.declencheur)) || null;
const portePartie = (g, mot) => Object.keys(g.formes).some(id => porte(P[id], mot));
/* En « Trouve ! », le visage ne s'ouvre que si le mot demande y est : quand on
   demande der Mann, toucher la tete du prof repond tout de suite. */
function veutGrosPlan(g){
  if (attendUnToucher()) return portePartie(g, attenteToucher);
  return true;
}
/* La bonne reponse n'existe que de pres (le nez) : on ouvre le gros plan pour
   la montrer. Les lunettes et la barbe se voient aussi dans la scene. */
const grosPlanDe = ids => GROS.find(g => ids.length && ids.every(id => g.formes[id] && P[id].detail)) || null;

function ouvrirGrosPlan(g, sansAnim){
  fermerGrosPlan(); effacer();
  const [x,y,w,h] = g.cadre;
  const el = document.createElement("div");
  el.className = "gros-plan";
  el.setAttribute("role", "group"); el.setAttribute("aria-label", "Gros plan");
  el.innerHTML = `<div class="fond"></div>
    <svg viewBox="${x} ${y} ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"></svg>
    <button type="button" class="fermer">✕ Revenir à la scène</button>`;
  const fond = el.querySelector(".fond");
  if (g.image){
    // Le cadre decoupe dans la source pleine resolution (construire.py, « net ») :
    // plus de pixels que la scene web agrandie.
    fond.style.backgroundImage = `url(${g.image})`;
    fond.style.backgroundSize = "100% 100%";
  } else {
    fond.style.backgroundImage = `url(${S.image})`;
    fond.style.backgroundSize = `${10000 / w}% ${10000 / h}%`;
    fond.style.backgroundPosition = `${100 * x / (100 - w)}% ${100 * y / (100 - h)}%`;
  }
  const poser = (l, t, ww, hh) => Object.assign(el.style, {left: l + "%", top: t + "%", width: ww + "%", height: hh + "%"});
  poser(...(sansAnim ? [0, 0, 100, 100] : g.cadre));
  scene.appendChild(el);
  if (!sansAnim){ void el.offsetWidth; poser(0, 0, 100, 100); }
  zoom = {g, el, svg: el.querySelector("svg")};
  // Le haut du gros plan doit se voir. Sur le telephone, la scene depasse
  // l'ecran : apres un defilement, la carte collee en haut couvrait le haut de
  // l'image -- les cheveux de Mark (Jacques, 6 oct. : « voir sa tete au
  // complet »). On ramene le haut de la scene juste sous la carte.
  const haut = document.querySelector(".haut").getBoundingClientRect().bottom;
  const ecart = scene.getBoundingClientRect().top - haut;
  if (ecart < 0) window.scrollBy({top: ecart, behavior: sansAnim ? "auto" : "smooth"});
  placerFermer();
  el.querySelector(".fermer").addEventListener("click", ev => {
    ev.stopPropagation(); fermerGrosPlan(); if (!verrou) effacer();
  });
  el.addEventListener("click", toucherGros);
}
function fermerGrosPlan(){ if (!zoom) return; zoom.el.remove(); zoom = null; }
/* Le bouton de retour : a gauche de la scene, juste sous la carte collee. */
function placerFermer(){
  if (!zoom) return;
  const b = zoom.el.querySelector(".fermer");
  b.style.left = (scene.getBoundingClientRect().left + 8) + "px";
  b.style.top = (document.querySelector(".haut").getBoundingClientRect().bottom + 8) + "px";
}
addEventListener("resize", placerFermer);
document.addEventListener("keydown", e => { if (e.key === "Escape" && zoom){ fermerGrosPlan(); if (!verrou) effacer(); } });

function partiesSous(pt, marge){
  return Object.entries(zoom.g.formes)
    .filter(([, [cx,cy,rx,ry]]) => ((pt[0]-cx) / (rx*marge))**2 + ((pt[1]-cy) / (ry*marge))**2 <= 1)
    .sort((a, b) => a[1][2]*a[1][3] - b[1][2]*b[1][3])
    .map(([id]) => id);
}
function toucherGros(e){
  if (e.target.closest(".fermer")) return;
  e.stopPropagation();
  const r = zoom.el.getBoundingClientRect(), [x,y,w,h] = zoom.g.cadre;
  const pt = [x + (e.clientX - r.left) / r.width * w, y + (e.clientY - r.top) / r.height * h];
  // un doigt deborde : sans rien dessous, on rattrape la partie la plus proche
  let ids = partiesSous(pt, 1);
  if (!ids.length) ids = partiesSous(pt, 1.35);
  if (!ids.length) return;
  // Sous le doigt, souvent deux parties : l'oeil derriere le verre des
  // lunettes, la bouche dans la barbe, et toujours la tete. En « Trouve ! »,
  // celle qu'on demande compte ; sinon, la plus petite -- la plus precise.
  const attendu = attendUnToucher();
  toucher((attendu && ids.find(z => touche(P[z], attenteToucher))) || ids[0], null);
}
function anneauGros(id, second){
  const [cx,cy,rx,ry] = zoom.g.formes[id];
  zoom.svg.insertAdjacentHTML("beforeend",
    `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" vector-effect="non-scaling-stroke"
       stroke="${second ? "#fff" : "#E8A23A"}" stroke-width="${second ? 2 : 3}"
       ${second ? 'stroke-dasharray="6 4"' : 'style="filter:drop-shadow(0 0 4px rgba(232,162,58,.9))"'}/>`);
}
function etiquetteGros(id){
  const p = P[id], [cx,cy,rx,ry] = zoom.g.formes[id], [x,y,w,h] = zoom.g.cadre;
  const haut = (cy - ry - y) / h * 100, dessous = haut < 22;
  const e = document.createElement("div");
  e.className = "etiquette" + (dessous ? " dessous" : "");
  e.style.left = Math.min(80, Math.max(20, (cx - x) / w * 100)) + "%";
  e.style.top = (dessous ? (cy + ry - y) / h * 100 + 1 : haut - 1) + "%";
  e.innerHTML = groupe(p) + `<span class="fr">${p.fr}${p.pluriel ? " · pl. die " + p.pluriel : ""}</span>`;
  zoom.el.appendChild(e);
}

/* ---------- les couches ---------- */
/* Les couches viennent de la SCENE (<nom>.points.json) : chaque scene a ses
   questions, et seules les couches qu'elle a ont une pastille. */
/* Une scene a plusieurs vues met leurs questions EN COMMUN, chacune gardant
   sa vue (_vue) : la seance tire parmi toutes, et poser() montre la bonne. */
const COUCHES = (() => {
  const c = {};
  for (const v of VUES){
    for (const [niv, couche] of Object.entries(window.SCENES[v].couches || {})){
      c[niv] = c[niv] || {titre: couche.titre};
      if (couche.qs) c[niv].qs = (c[niv].qs || []).concat(couche.qs.map(q => Object.assign({_vue: v}, q)));
    }
  }
  return Object.keys(c).length ? c : {A1: {titre: "Noms et articles"}};
})();

/* ---------- changer de vue ---------- */
/* Sans recharger : la page connait deja toutes les vues du groupe. Un fondu
   et un bandeau (« Mark, de dos ») disent ce qui change, pour que l'image qui
   bouge seule ne surprenne pas. */
function activerVue(v, annoncer){
  if (v === VUE || !window.SCENES[v]) return;
  fermerGrosPlan(); effacer();
  VUE = v; S = window.SCENES[v]; window.MASQUES = window.MASQUES_DE[v];
  P = Object.fromEntries(S.points.map(p => [p.id, p]));
  MW = MASQUES.w; MH = MASQUES.h; TW = MASQUES.W; TH = MASQUES.H;
  preparerZones(); boutonsZones();
  for (const c of [voile, toile]) c.setAttribute("viewBox", `0 0 ${TW} ${TH}`);
  GROS = S.grosPlans || [];
  $("photo").src = S.image; $("photo").alt = S.alt || "";
  scene.style.aspectRatio = MASQUES.W + " / " + MASQUES.H;
  majAutreVue(); dessiner();
  if (!annoncer) return;
  if (scene.animate) scene.animate([{opacity: .15}, {opacity: 1}], {duration: 420, easing: "ease-out"});
  if (S.nom_vue){
    const b = document.createElement("div");
    b.className = "bandeau-vue"; b.textContent = S.nom_vue;
    scene.appendChild(b);
    setTimeout(() => b.remove(), 1800);
  }
}

/* ---------- DANS LA SEANCE DU JOUR (?seance=1&niveau=B1) ----------
   L'app ouvre cette page dans un cadre, au debut de la seance (essai v713,
   reserve a Jacques). Decisions de la maquette choix-seance.html : TROIS
   questions, au niveau de la seance, sans pastilles ; a partir de l'A2,
   l'une des trois revise le niveau d'avant. A la fin, la page le dit a
   l'app (postMessage), qui enchaine sur les cartes. Le titre, en haut, rend
   la main a l'app au lieu de mener a la maquette. */
const PARAMS = new URLSearchParams(location.search);
const EN_SEANCE = PARAMS.get("seance") === "1";
const NB_SEANCE = 3;
function envoyer(type, donnees){
  if (window.parent !== window)
    window.parent.postMessage(Object.assign({source: "wortando-scene", type, scene: NOM_SCENE}, donnees || {}), "*");
}
if (EN_SEANCE) document.body.classList.add("en-seance");
if (window.parent !== window) document.body.classList.add("en-cadre");
/* Ouverte DANS l'app (la seance, ou le tableau de bord admin qui ouvre une
   scene entiere pour la tester) : le lien du haut rend la main a l'app au
   lieu de mener a la maquette. */
if (window.parent !== window)
  $("retourChoix").addEventListener("click", e => { e.preventDefault(); envoyer("fermer", {bons, faits}); });
/* La largeur de l'image pour que carte + image tiennent dans la hauteur de
   l'ecran. Recalculee quand la carte change de hauteur (une question plus
   longue) et quand l'ecran tourne. */
function ajusterSeance(){
  if (window.parent === window) return;
  const dispo = innerHeight - document.querySelector(".haut").offsetHeight;
  const largeur = Math.min(document.querySelector(".cadre").clientWidth, dispo * MASQUES.W / MASQUES.H);
  scene.style.width = Math.max(200, Math.floor(largeur)) + "px";
  placerFermer();
}
if (window.parent !== window){
  addEventListener("resize", ajusterSeance);
  new ResizeObserver(ajusterSeance).observe(document.querySelector(".haut"));
}

/* ---------- etat ---------- */
let niveau = (EN_SEANCE && COUCHES[PARAMS.get("niveau")]) ? PARAMS.get("niveau") : "A1";
let modeA1 = EN_SEANCE ? "trouver" : "decouvrir", i = 0, bons = 0, faits = 0, attenteToucher = null, verrou = false;
/* Une etape « Trouve ! » glissee dans une suite de questions A2 (la seance) :
   le niveau reste A2, mais on attend un toucher. */
let etapeTrouve = false;
const attendUnToucher = () => ((niveau === "A1" && modeA1 === "trouver") || etapeTrouve) && attenteToucher && !verrou;
const melanger = a => a.map(v => [Math.random(), v]).sort((x,y) => x[0]-y[0]).map(v => v[1]);
/* Les trois questions d'une seance : deux du niveau, une du niveau d'avant
   s'il a des questions (en B1, une preposition de l'A2) ; sinon trois du
   niveau. Chacune garde son niveau, pour l'afficher. */
function ordreSeance(niv){
  const k = Object.keys(COUCHES), avant = k[k.indexOf(niv) - 1];
  const ici = melanger(COUCHES[niv].qs).map(q => Object.assign({_niv: niv}, q));
  if (avant && COUCHES[avant].qs && COUCHES[avant].qs.length)
    return melanger([...ici.slice(0, NB_SEANCE - 1),
                     Object.assign({_niv: avant}, melanger(COUCHES[avant].qs)[0])]);
  // En A2, le niveau d'avant est l'A1 : il n'a pas de questions a choix, il a
  // « Trouve ! ». Jacques, 9 oct. : « si on est en A2, on devrait avoir la
  // possibilite de faire du A1 aussi ».
  const aTrouver = A_TROUVER.filter(m => aSonNiveau(m, "A1"));
  if (avant === "A1" && aTrouver.length)
    return melanger([...ici.slice(0, NB_SEANCE - 1),
                     {_niv: "A1", _trouve: melanger(aTrouver)[0]}]);
  return ici.slice(0, NB_SEANCE);
}

/* les pastilles */
for (const n of Object.keys(COUCHES)){
  const b = document.createElement("button");
  b.textContent = n; b.setAttribute("aria-pressed", n === niveau);
  b.addEventListener("click", () => { niveau = n; demarrer(); });
  $("niveaux").appendChild(b);
}
function demarrer(){
  $("niveaux").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.textContent === niveau));
  i = 0; bons = 0; faits = 0; attenteToucher = null; verrou = false; etapeTrouve = false; fermerGrosPlan(); effacer();
  if (niveau === "A1") return modeA1 === "decouvrir" ? decouvrir() : trouver();
  COUCHES[niveau].ordre = EN_SEANCE ? ordreSeance(niveau) : melanger(COUCHES[niveau].qs);
  poser();
}

/* ---------- A1 ---------- */
function entete(consigne, question, avecModes){
  $("carte").innerHTML = `<div class="consigne">${consigne}</div><div class="question">${question}</div>`
    + (avecModes ? `<div class="modes"><button data-m="decouvrir">Découvrir</button><button data-m="trouver">Trouve !</button></div>` : "");
  $("carte").querySelectorAll(".modes button").forEach(b => {
    b.setAttribute("aria-pressed", b.dataset.m === modeA1);
    b.addEventListener("click", () => { modeA1 = b.dataset.m; demarrer(); });
  });
}
function decouvrir(){
  $("bas").classList.remove("en-haut");
  entete("A1 · " + COUCHES.A1.titre, S.consigne || "Touche un objet ou une personne.", true);
  $("bas").innerHTML = "";
}
/* Une cible est un MOT, pas une zone : « die Frau » est juste sur Anna comme
   sur la dame en rouge (remarque de Jacques, 6 oct.). porte() dit si une
   zone porte ce nom, sous son nom principal ou dans « aussi ». */
const porte = (p, mot) => p.mot === mot || p.aussi.some(a => a.mot === mot);
/* Toucher ce qui est POSE SUR l'objet demande est juste : le manteau sur la
   porte, les lunettes sur le prof (Jacques, 6 oct.). Dans ce sens seulement --
   demander der Mantel et toucher la porte reste faux. */
const touche = (p, mot) => {
  for (let z = p, n = 0; z && n < 5; z = P[z.sur], n++) if (porte(z, mot)) return true;
  return false;
};
// Les mots qu'on ne demande pas en « Trouve ! » (le mur : il est partout).
// Toutes les vues du groupe, chaque mot avec les vues ou il se trouve.
const A_TROUVER = (() => {
  const vus = new Map();
  for (const v of VUES){
    const s = window.SCENES[v], exclus = s.exclus || [];
    for (const p of s.points){
      for (const m of [{mot: p.mot, genre: p.genre, niveau: p.niveau}, ...p.aussi]){
        if (exclus.includes(m.mot)) continue;
        if (!vus.has(m.mot)) vus.set(m.mot, {mot: m.mot, genre: m.genre, niveau: m.niveau, vues: []});
        if (!vus.get(m.mot).vues.includes(v)) vus.get(m.mot).vues.push(v);
      }
    }
  }
  return [...vus.values()];
})();
/* DANS LA SEANCE, Trouve ! reste au niveau de l'eleve. Le 9 oct., une seance
   A2 a demande « Rüebli » -- la carotte en suisse, niveau B1 -- parce que les
   variantes regionales repondent sur la cagette de leur synonyme. Un mot
   au-dessus du niveau de la seance ne se DEMANDE pas ; il se touche toujours
   en Decouvrir. Hors seance, rien n'est filtre. */
const RANG = {A1: 1, A2: 2, B1: 3, B2: 4, C1: 5, C2: 6};
const aSonNiveau = (m, niv) => !EN_SEANCE || !m.niveau || (RANG[m.niveau] || 9) <= (RANG[niv] || 9);
const zonesDe = mot => S.points.filter(p => porte(p, mot)).map(p => p.id);
let fileTrouver = [];
/* A QUI appartient ce qu'on demande. Jacques, 6 oct. : on demande l'oreille
   ou les doigts, et l'on va toucher la medecin -- qui a des oreilles aussi,
   mais seules celles de Mark sont des cibles. La racine d'une zone : on
   remonte « sur » jusqu'au bout (l'oreille -> Mark). Une personne : un
   prenom, ou une zone qui porte der Mann / die Frau. */
const racine = z => { for (let n = 0; z.sur && P[z.sur] && n < 5; n++) z = P[z.sur]; return z; };
const estPersonne = z => !!z.personne || [z.mot, ...z.aussi.map(a => a.mot)].some(m => m === "Mann" || m === "Frau");
const nomDe = z => z.personne ? `<b>${z.personne}</b>` : groupe(z);
/* Le proprietaire, si TOUTES les zones du mot sont des parties d'UNE seule
   personne (das Ohr -> Mark). Sinon rien : die Brille est au prof et a la
   dame, et der Mann EST Mark -- le dire donnerait la reponse. */
function proprietaire(mot){
  const zones = zonesDe(mot).map(id => P[id]);
  // UNE SCENE DU CORPS ("corps" dans le .points.json) : on cherche sur LUI.
  // Jacques, 8 oct. : « faire comprendre a l'etudiant que c'est sur le corps
  // de Mark qu'on va chercher ». La medecin a des mains, mais die Hand se
  // cherche sur Mark ; toucher les siennes donne le message doux, pas un point.
  const corps = S.corps && P[S.corps];
  if (corps && zones.some(z => z.sur && racine(z) === corps)) return corps;
  if (!zones.length || zones.some(z => !z.sur)) return null;
  const r = [...new Set(zones.map(racine))];
  return r.length === 1 && estPersonne(r[0]) ? r[0] : null;
}
function trouver(){
  if (!fileTrouver.length || i === 0)
    fileTrouver = melanger(A_TROUVER.filter(m => aSonNiveau(m, niveau))).slice(0, EN_SEANCE ? NB_SEANCE : 10);
  if (i >= fileTrouver.length) return fin();
  const p = fileTrouver[i]; attenteToucher = p.mot;
  // Le mot n'est pas dans cette vue (die Wade sur Mark de face) : l'app
  // tourne Mark, ou passe a l'etal d'a cote, avant de poser la question.
  if (!p.vues.includes(VUE)) activerVue(p.vues[0], true);
  const chez = proprietaire(p.mot);
  $("bas").classList.remove("en-haut");
  entete("A1 · Trouve !  " + (i+1) + " / " + fileTrouver.length,
         `Touche : ${groupe(p)}${chez ? " — sur " + nomDe(chez) : ""} <button class="choix" style="padding:4px 10px;font-size:13px;margin-left:6px" id="reecouter">🔈</button>`, true);
  $("reecouter").addEventListener("click", () => dire(p.genre + " " + p.mot));
  $("bas").innerHTML = `<div class="score">${bons} / ${faits}</div>`;
  dire(p.genre + " " + p.mot);
}
function toucher(id, pt){
  const p = P[id];
  if (niveau === "A1" && modeA1 === "decouvrir"){
    effacer(); anneau(id); etiquette(id);
    dire((p.personne ? p.personne + ". " : "") + p.genre + " " + p.mot);
    return;
  }
  if ((niveau === "A1" || etapeTrouve) && attenteToucher && !verrou){
    // Sur une scene du corps, seules les zones de Mark comptent (et sont
    // montrees en cas d'erreur) : la main de la medecin n'est pas une cible.
    const proprio = proprietaire(attenteToucher);
    const aLui = z => !proprio || racine(z) === proprio;
    const cible = attenteToucher, bonnes = zonesDe(cible).filter(id => aLui(P[id]));
    // Seulement ce qui est AU MEME PLAN que le premier plan sous le doigt : les
    // mains de Mark et la table, oui ; la tete du prof et le tableau derriere, non.
    // Tout ce qui est sous le doigt AU MEME PLAN que le premier plan : les mains
    // de Mark et la table, oui ; la tete du prof et le tableau derriere, non.
    const {exact, proche, petits} = pt ? sous(pt[0], pt[1]) : {exact: [], proche: [], petits: []};
    // Si le doigt ne tombe pile sur rien (a cote d'une patte de table), tout ce
    // qui est PROCHE compte, sans regarder le plan : on ne sait pas lequel il visait.
    const devantTout = Math.max(plan(p), ...exact.map(plan));
    const candidats = exact.length ? [p, ...exact.filter(z => plan(z) === devantTout)] : [p, ...proche];
    // Et un PETIT objet demande (un cahier, des lunettes) compte s'il est a
    // portee du doigt, meme si le doigt est tombe sur la table juste a cote :
    // sur une table le doigt touche toujours la table, et la marge ne servait
    // jamais au cahier (Jacques, 6 oct. : « le cahier de Mark ne fonctionne pas »).
    const PETIT = MW * MH * 0.004;
    const retenue = candidats.find(z => touche(z, cible) && aLui(z))
                 || petits.find(z => touche(z, cible) && aLui(z));
    // Toucher l'oreille de la medecin quand on demande celle de Mark n'est pas
    // une faute de vocabulaire : le mot etait juste, la personne non. On le
    // dit, sans compter de point, et la question reste ouverte.
    const chez = !retenue && proprio;
    if (chez){
      const r = racine(p);
      if (r !== chez && estPersonne(r)){
        effacer(); anneau(r.id, true);
        $("bas").innerHTML = `<div class="explication">Ça, c'est ${nomDe(r)}. Cherche ${groupe(A_TROUVER.find(t => t.mot === cible))} sur ${nomDe(chez)}.</div>`
                           + `<div class="score">${bons} / ${faits}</div>`;
        return;
      }
    }
    const juste = !!retenue;
    verrou = true; faits++;
    effacer();
    if (juste){
      bons++; bravo();
      // On encadre ce qui porte le nom : la porte, pas le manteau qu'on a touche.
      let support = retenue.id;
      for (let z = retenue, n = 0; z && n < 5; z = P[z.sur], n++) if (porte(z, cible)){ support = z.id; break; }
      anneau(support); etiquette(support, cible);
    }
    else { const g = !zoom && grosPlanDe(bonnes);
           if (g) ouvrirGrosPlan(g, true);
           bonnes.forEach(z => anneau(z)); anneau(id, true); scene.classList.add("secoue");
           setTimeout(() => scene.classList.remove("secoue"), 400); }
    // Pas de chiffre : le pull de Mark a deux zones (la sienne et celle de Mark),
    // compter les zones annoncerait « 4 pulls » pour trois.
    const autres = bonnes.length > 1 ? " <i>Il y en a d'autres dans la scène.</i>" : "";
    // La traduction dans la reponse, jamais dans la question (Jacques, 6 oct.).
    const sens = mot => { const z = S.points.find(q => q.mot === mot); if (z) return z.fr;
      for (const q of S.points){ const a = q.aussi.find(x => x.mot === mot); if (a) return a.fr; } return ""; };
    const demande = A_TROUVER.find(t => t.mot === cible);
    const traduit = g => `${groupe(g)} <i>= ${sens(g.mot)}</i>`;
    $("bas").innerHTML = `<div class="explication">${juste ? "Richtig ! " + traduit(demande) + "." + autres
        : traduit(demande) + " : c'était " + (bonnes.length > 1 ? "à l'un de ces endroits" : "ici")
          + ". Tu avais touché : " + traduit(p) + "."}</div>
                          <button class="suite" id="suite">Weiter</button>`;
    $("suite").addEventListener("click", () => {
      i++; verrou = false; fermerGrosPlan(); effacer();
      if (etapeTrouve){ etapeTrouve = false; attenteToucher = null; poser(); } else trouver();
    });
    return;
  }
  // aux autres niveaux, toucher un objet montre son nom : on peut toujours chercher un mot
  effacer(); anneau(id); etiquette(id); dire(p.genre + " " + p.mot);
}

/* ---------- A2 a C1 : une question a choix ---------- */
function poser(){
  const c = COUCHES[niveau], q = c.ordre[i];
  if (!q) return fin();
  if (q._trouve) return poserTrouve(q._trouve, c.ordre.length);
  // Seul l'objet de la question s'allume : montrer la reference AVANT la
  // reponse soufflait la moitie de la reponse (le Tisch encadre).
  // La question porte sur une autre vue (le dos, l'etal des legumes) : on y va.
  if (q._vue && q._vue !== VUE) activerVue(q._vue, true);
  fermerGrosPlan(); effacer(); anneau(q.f);
  const bas = id => { if (!id) return 0; const [,y,,h] = englobe(P[id]); return y + h; };
  $("bas").classList.toggle("en-haut", Math.max(bas(q.f), bas(q.r)) > 62);
  const niv = q._niv || niveau;
  entete(niv + " · " + COUCHES[niv].titre + "  " + (i+1) + " / " + c.ordre.length, q.q, false);
  const opts = melanger(q.c.map((t,k) => ({t, ok:k === 0})));
  $("bas").innerHTML = opts.map((o,k) => `<button class="choix" data-k="${k}">${o.t}</button>`).join("")
                     + `<div class="score">${bons} / ${faits}</div>`;
  $("bas").querySelectorAll(".choix").forEach((b,k) => b.addEventListener("click", () => repondre(q, opts, k)));
}
/* Une etape A1 dans la seance A2 : la meme question que « Trouve ! ». */
function poserTrouve(p, total){
  etapeTrouve = true; attenteToucher = p.mot;
  if (!p.vues.includes(VUE)) activerVue(p.vues[0], true);
  fermerGrosPlan(); effacer();
  const chez = proprietaire(p.mot);
  $("bas").classList.remove("en-haut");
  entete("A1 · Trouve !  " + (i+1) + " / " + total,
         `Touche : ${groupe(p)}${chez ? " — sur " + nomDe(chez) : ""}`, false);
  $("bas").innerHTML = `<div class="score">${bons} / ${faits}</div>`;
  dire(p.genre + " " + p.mot);
}
function repondre(q, opts, k){
  if (verrou) return; verrou = true; faits++;
  const juste = opts[k].ok; if (juste){ bons++; bravo(); }
  // Apres la reponse, le panneau se resserre : la bonne reponse seule (et la
  // fausse si on s'est trompe), pour ne pas couvrir le sac ou la table.
  $("bas").querySelectorAll(".choix").forEach((b,j) => {
    b.disabled = true;
    if (opts[j].ok) b.classList.add("ok");
    else if (j === k) b.classList.add("faux");
    else b.remove();
  });
  dire(q.phrase);
  if (q.r) anneau(q.r, true);
  const ex = document.createElement("div");
  ex.className = "explication";
  ex.innerHTML = (juste ? "Richtig ! " : "") + q.n;
  const suite = document.createElement("button");
  suite.className = "suite"; suite.textContent = "Weiter";
  suite.addEventListener("click", () => { i++; verrou = false; poser(); });
  const sc = $("bas").querySelector(".score"); sc.textContent = bons + " / " + faits;
  $("bas").insertBefore(ex, sc); $("bas").insertBefore(suite, sc);
}
/* Le mot de la fin suit le score. « 0 sur 3 — bravo ! » sonnait faux
   (Jacques, 6 oct.) : un compliment qu'on recoit quoi qu'on fasse ne veut
   plus rien dire, meme quand il est merite. */
function bilan(){
  const s = `${bons} sur ${faits}`;
  if (!faits) return s;
  if (bons === faits) return `${s} — sans faute, bravo !`;
  if (bons * 2 >= faits) return `${s} — bien joué.`;
  if (bons > 0) return `${s} — ça viendra : on retient aussi en se trompant.`;
  return `${s} — pas grave, on retient aussi en se trompant.`;
}
function fin(){
  effacer(); attenteToucher = null; $("bas").classList.remove("en-haut");
  if (EN_SEANCE){
    entete("Scène terminée", bilan(), false);
    $("bas").innerHTML = `<button class="suite" id="encore">Continuer avec mes cartes →</button>`;
    $("encore").addEventListener("click", () => envoyer("fini", {bons, faits}));
    return;
  }
  entete(niveau + " · terminé", bilan(), niveau === "A1");
  $("bas").innerHTML = `<button class="suite" id="encore">Encore une fois</button>`;
  $("encore").addEventListener("click", demarrer);
}

demarrer();
</script>
