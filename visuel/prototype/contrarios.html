<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Los contrarios</title>
<!--
  LES CONTRAIRES (theme illustre, 3 nov. 2026). Des CHOSES et des lieux, pas des personnes : la fin de la liste
  « Adjetivos comunes » du cours d'espagnol de Jacques (accord du 3 nov. : « go ») -- ancho / estrecho, abierto /
  cerrado, bueno / malo, raro, extrano, precioso, asqueroso, bonito / feo ; et grande / pequeno, nuevo / viejo,
  lleno / vacio. Une image par mot, les paires cote a cote (la meme porte ouverte puis fermee). Feo ne va jamais
  sous un vrai visage : un vase. Images et mots : visuel/contrarios/contrarios.py -> contrarios/contrarios.json.
  L'axe : le contraire, l'accord (la puerta abierta, el vaso lleno) et ser / estar (la calle ES estrecha, la puerta
  ESTA abierta) en espagnol ; en allemand, la terminaison (der Koffer ist gross / ein grosser Koffer).
  Ouverte par l'app dans le cadre des scenes (sceneCadre), elle parle comme une scene : « exercice » et « bonne »
  a chaque reponse, « reponse » {mot, genre, cat, juste} pour le mot teste, « fini » et « fermer » a la fin.
  Parametres : apprendre=es|de, lang=<interface>, nuit=1, seance=1 (six questions, pas de decouverte),
  variante=latam (la voix de Monica), r=<AUDIO_REVISION>.
  Le tirage suit les mots (themes/tirage.js). Les phrases sont FABRIQUEES depuis contrarios.json, et un leurre n'est
  jamais qu'un mot clairement faux pour l'image (le champ « faux ») : une image ne dit que ce qu'elle montre.
-->
<style>
:root{--fond1:#82AFDB;--fond3:#C0D6EA;--encre:#1C2430;--gris:#4C566B;--ambre:#E8A23A;--ambre-f:#A86A0E;--vert:#2F9E6A;--rouge:#C8473A;
  --verre:rgba(255,255,255,.88);--bord:rgba(255,255,255,.95);--carte:#F7F8FA;--police:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html.nuit{--fond1:#0E1C26;--fond3:#18303F;--encre:#EEF2F5;--gris:#A9B8C4;--ambre-f:#E8A23A;--vert:#5CC98F;--rouge:#F07F72;
  --verre:rgba(20,36,50,.88);--bord:rgba(255,255,255,.14);--carte:#22384A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
/* LA PAGE A LA HAUTEUR DE L'ECRAN, COMME UNE SCENE (3 nov. 2026, Jacques sur iPhone : « Commencer » « pas
   completement en bas »). Le document d'une scene ne depasse jamais son cadre ; celui d'un theme defilait (Decrire :
   2 500 px), et sur iPhone un bouton fixe dans un cadre dont le document deborde ne tombe pas au bas de l'ecran.
   Le contenu defile donc DANS le body, et le document garde la hauteur du cadre. */
html{height:100%;overflow:hidden}
body{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;box-sizing:border-box}
body{background:linear-gradient(180deg,var(--fond1),var(--fond3));background-attachment:fixed;color:var(--encre);font-family:var(--police);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 156px) max(10px,env(safe-area-inset-left,0px))}
.haut{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto 10px}
.retour{width:42px;height:42px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);color:var(--encre);font:800 22px var(--police);cursor:pointer;flex:0 0 auto}
html[dir="rtl"] .retour{transform:scaleX(-1)}
.titre{flex:1;font-weight:900;font-size:18px}
.compte{font-weight:800;font-size:14px;color:var(--gris)}
.barre{max-width:560px;margin:0 auto 12px;height:6px;border-radius:3px;background:rgba(28,36,48,.12);overflow:hidden}
.barre i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2BB5AA,#14807A);transition:width .3s}
main{max-width:560px;margin:0 auto;background:var(--verre);border:1px solid var(--bord);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}
.consigne{font-size:14px;font-weight:700;color:var(--gris);margin:0}
.enonce{direction:ltr;text-align:left;background:var(--carte);border-radius:14px;padding:12px 14px;font-weight:800;line-height:1.5;font-size:17px}
.enonce.centre{text-align:center;font-size:19px}
.trou{display:inline-block;min-width:64px;border-bottom:2px solid var(--ambre);text-align:center;color:var(--ambre-f)}
/* les images sont en 4:3 ; jamais plus hautes que l'ecran ne le permet */
.photo{display:block;width:100%;max-width:420px;margin:0 auto;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:16px;background:var(--carte)}
/* deux images cote a cote : la gauche reste a gauche en arabe et en persan (« de la izquierda », « links ») */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;direction:ltr}
.duo img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block;background:var(--carte)}
/* des images a toucher (« ¿Qué puerta está abierta? », l'ecoute) */
.rangee{display:grid;grid-template-columns:1fr 1fr;gap:8px;direction:ltr}
.rangee.trois{grid-template-columns:1fr 1fr 1fr}
.rangee button{border:3px solid transparent;border-radius:14px;background:var(--carte);padding:0;cursor:pointer;overflow:hidden;display:block}
.rangee img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.rangee button.juste{border-color:var(--vert)} .rangee button.faux{border-color:var(--rouge)}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix.centre{justify-content:center}
.choix button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:9px 15px;font:800 15px var(--police);cursor:pointer}
.choix button.juste{background:var(--vert);border-color:var(--vert);color:#fff}
.choix button.faux{background:var(--rouge);border-color:var(--rouge);color:#fff}
button:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
button:disabled{cursor:default}
.ecoute{width:48px;height:48px;border-radius:50%;border:2px solid var(--ambre);background:var(--verre);color:var(--encre);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ecoute svg{width:24px;height:24px}
.ecoute.grand{width:64px;height:64px;margin:0 auto} .ecoute.grand svg{width:32px;height:32px}
.retourMsg{min-height:1.4em;font-weight:800;font-size:15px;margin:0;line-height:1.45}
.retourMsg.ok{color:var(--vert)} .retourMsg.ko{color:var(--rouge)}
.retourMsg .phrase{display:block;color:var(--encre);font-weight:700}
.trad{display:block;font-size:13px;font-weight:600;font-style:italic;color:var(--gris);line-height:1.35;margin-top:2px}
.retourMsg .mot{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--gris);font-weight:700}
.retourMsg .mot .ecoute{width:38px;height:38px} .retourMsg .mot .ecoute svg{width:19px;height:19px}
/* apres une erreur : le mot choisi, barre, en rouge, avec sa traduction ; le bon mot dessous, en vert */
.retourMsg .mot.choisi{color:var(--rouge);min-height:38px} .retourMsg .mot.choisi s{text-decoration-thickness:2px}
.retourMsg .mot.bon{color:var(--vert)}
/* la decouverte : la fiche de l'image touchee, puis la planche des paires */
.fiche{background:var(--carte);border-radius:14px;padding:10px;display:grid;grid-template-columns:minmax(120px,48%) 1fr;gap:12px;align-items:center}
.fiche img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;background:var(--verre)}
.fiche .mot{font-weight:900;font-size:24px;color:var(--ambre-f);line-height:1.15}
.fiche .sens{font-weight:700;font-size:14px;color:var(--gris);margin-top:2px}
.fiche .dit{font-weight:800;font-size:16px;line-height:1.4;margin-top:6px}
.fiche .ligne{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.fiche .vers{border:0;background:none;color:var(--gris);font:700 14px var(--police);cursor:pointer;padding:4px 0;text-align:start}
.fiche .vers b{color:var(--encre)}
.planche{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paire{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--carte);border-radius:12px;padding:3px;direction:ltr}
.paire button{border:3px solid transparent;border-radius:10px;padding:0;background:none;cursor:pointer;overflow:hidden;display:block}
.paire img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;background:var(--verre)}
.paire button.choisi{border-color:var(--ambre)}
.paire .signe{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;background:var(--ambre);color:#1C2430;
  font:900 14px/24px var(--police);text-align:center;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.regle{margin:0;font-size:14px;font-weight:700;line-height:1.45;color:var(--gris);background:var(--carte);border-radius:12px;padding:10px 12px}
/* TOUS LES BOUTONS D'ACTION TOUT EN BAS DE L'ECRAN, comme dans les scenes (Jacques, 3 nov. 2026 : « commencer les exercices ou
   continuer soit toujours en bas completement de l'ecran ») : Commencer et Suivant (.suite), Encore des questions et Terminer
   (.bas, en fin de partie et quand tout est revu), jamais dans le flux du texte. */
.suite{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:54px;border:0;border-radius:27px;z-index:5000;
  color:#fff;font:800 17px var(--police);background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer}
.suite[hidden]{display:none}
.bas{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5000;display:flex;flex-direction:column;gap:8px}
.bas button{height:54px;border:0;border-radius:27px;font:800 17px var(--police);cursor:pointer;
  color:#fff;background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28)}
/* « Encore des questions » : la meme forme, en second, pour que Terminer reste l'action principale */
.bas button.second{background:var(--verre);color:var(--encre);border:2px solid var(--ambre);box-shadow:0 6px 16px rgba(28,36,48,.14)}
.fin{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:10px 0}
.fin .score{font-size:22px;font-weight:900}
[lang]{unicode-bidi:isolate}
</style>
</head>
<body>
<div class="haut"><button class="retour" id="retour" type="button">‹</button><div class="titre" id="titre"></div><div class="compte" id="compte" dir="ltr"></div></div>
<div class="barre"><i id="barre"></i></div>
<main id="zone"></main>
<button class="suite" id="suite" type="button" hidden></button>
<script src="themes/tirage.js?v=3"></script>
<script src="themes/zoom.js?v=4"></script>
<script src="themes/verre.js?v=7"></script>
<script src="themes/voix.js?v=7"></script>
<script>
const Q = new URLSearchParams(location.search);
// l'anglais (3 nov. 2026, « pour que l'anglais suive aussi ») : les memes images, ses phrases a lui ; variante=gb
const APPRENDRE = ["de", "en"].includes(Q.get("apprendre")) ? Q.get("apprendre") : "es";
const GB = APPRENDRE === "en" && Q.get("variante") === "gb";
const LATAM = APPRENDRE === "es" && Q.get("variante") === "latam";
const LANGUE = (l => ["fr", "en", "tr", "uk", "fa", "ar", "pt", "pl", "ru", "de"].includes(l) ? l : "fr")(((Q.get("lang") || "fr").toLowerCase().split(/[-_]/)[0]));
if (Q.get("nuit") === "1") document.documentElement.classList.add("nuit");
document.documentElement.lang = LANGUE;
document.documentElement.dir = (LANGUE === "fa" || LANGUE === "ar") ? "rtl" : "ltr";
// vingt questions seul (Jacques, 3 nov.), six dans la seance du jour, sans la decouverte
const NB = Q.get("seance") === "1" ? Math.max(2, Math.min(12, parseInt(Q.get("nb"), 10) || 6)) : 20;   // nb : le reglage « Questions par scene et par theme » de la seance du jour (5 · 8 · 12, 7 nov. 2026)
// agrandir (themes/zoom.js) : un toucher sur une photo, une paire ou la fiche, la loupe sur les images a choisir
Zoom.init({direct: "img.photo, .duo img, .fiche img", loupe: ".rangee button", langue: LANGUE});

const TEXTES = {
  titre:     {fr:"Les contraires", en:"Opposites", tr:"Zıt anlamlılar", uk:"Протилежності", fa:"متضادها", ar:"الأضداد", pt:"Os contrários", pl:"Przeciwieństwa", ru:"Противоположности", de:"Gegensätze"},
  intro:     {fr:"Touche une image : tu vois le mot, tu l'entends, et son contraire est juste à côté.", en:"Tap a picture to see and hear the word; its opposite is right next to it.", tr:"Bir resme dokun: kelimeyi gör ve dinle; zıttı hemen yanında.", uk:"Торкнися зображення: побачиш і почуєш слово, а поруч — його протилежність.", fa:"روی یک تصویر بزن تا واژه را ببینی و بشنوی؛ متضادش درست کنارش است.", ar:"المس صورة لترى الكلمة وتسمعها، وضدّها بجانبها مباشرة.", pt:"Toque em uma imagem para ver e ouvir a palavra; o contrário está logo ao lado.", pl:"Dotknij obrazka, aby zobaczyć i usłyszeć słowo; jego przeciwieństwo jest tuż obok.", ru:"Нажми на картинку, чтобы увидеть и услышать слово; рядом — его противоположность.", de:"Tippe auf ein Bild: Du siehst und hörst das Wort, sein Gegenteil steht gleich daneben."},
  regleEs:   {fr:"Ce qu'est une chose, sa forme, sa taille : ser (la calle es estrecha). Comment elle se trouve en ce moment : estar (la puerta está abierta, el vaso está vacío). L'adjectif s'accorde avec le nom : el vaso lleno, la botella llena.", en:"What a thing is like, its shape and size: ser (la calle es estrecha). How it is right now: estar (la puerta está abierta, el vaso está vacío). The adjective agrees with the noun: el vaso lleno, la botella llena.", tr:"Bir şeyin nasıl olduğu, biçimi, boyutu: ser (la calle es estrecha). Şu anki durumu: estar (la puerta está abierta, el vaso está vacío). Sıfat isme uyar: el vaso lleno, la botella llena.", uk:"Якою є річ, її форма й розмір: ser (la calle es estrecha). Який її стан зараз: estar (la puerta está abierta, el vaso está vacío). Прикметник узгоджується з іменником: el vaso lleno, la botella llena.", fa:"اینکه چیزی چگونه است، شکل و اندازه‌اش: ser (la calle es estrecha). حالِ اکنونش: estar (la puerta está abierta، el vaso está vacío). صفت با اسم هماهنگ می‌شود: el vaso lleno، la botella llena.", ar:"ما هو الشيء، شكله وحجمه: ser ‏(la calle es estrecha). حاله الآن: estar ‏(la puerta está abierta، el vaso está vacío). تتوافق الصفة مع الاسم: el vaso lleno، la botella llena.", pt:"O que uma coisa é, sua forma, seu tamanho: ser (la calle es estrecha). Como ela está agora: estar (la puerta está abierta, el vaso está vacío). O adjetivo concorda com o substantivo: el vaso lleno, la botella llena.", pl:"Jaka jest rzecz, jej kształt i rozmiar: ser (la calle es estrecha). W jakim jest stanie teraz: estar (la puerta está abierta, el vaso está vacío). Przymiotnik zgadza się z rzeczownikiem: el vaso lleno, la botella llena.", ru:"Какая вещь, её форма и размер: ser (la calle es estrecha). В каком она состоянии сейчас: estar (la puerta está abierta, el vaso está vacío). Прилагательное согласуется с существительным: el vaso lleno, la botella llena.", de:"Wie eine Sache ist, ihre Form, ihre Größe: ser (la calle es estrecha). Wie sie gerade ist: estar (la puerta está abierta, el vaso está vacío). Das Adjektiv richtet sich nach dem Nomen: el vaso lleno, la botella llena."},
  regleDe:   {fr:"Après sein, l'adjectif ne change pas : der Koffer ist groß. Devant le nom, il prend une terminaison : ein großer Koffer, eine große Tür, ein großes Glas.", en:"After sein, the adjective does not change: der Koffer ist groß. Before the noun, it takes an ending: ein großer Koffer, eine große Tür, ein großes Glas.", tr:"sein'dan sonra sıfat değişmez: der Koffer ist groß. İsmin önünde ek alır: ein großer Koffer, eine große Tür, ein großes Glas.", uk:"Після sein прикметник не змінюється: der Koffer ist groß. Перед іменником він має закінчення: ein großer Koffer, eine große Tür, ein großes Glas.", fa:"بعد از sein صفت تغییر نمی‌کند: der Koffer ist groß. پیش از اسم، پسوند می‌گیرد: ein großer Koffer، eine große Tür، ein großes Glas.", ar:"بعد sein لا تتغيّر الصفة: der Koffer ist groß. وقبل الاسم تأخذ نهاية: ein großer Koffer، eine große Tür، ein großes Glas.", pt:"Depois de sein, o adjetivo não muda: der Koffer ist groß. Antes do substantivo, ele ganha uma terminação: ein großer Koffer, eine große Tür, ein großes Glas.", pl:"Po sein przymiotnik się nie zmienia: der Koffer ist groß. Przed rzeczownikiem dostaje końcówkę: ein großer Koffer, eine große Tür, ein großes Glas.", ru:"После sein прилагательное не меняется: der Koffer ist groß. Перед существительным оно получает окончание: ein großer Koffer, eine große Tür, ein großes Glas.", de:"Nach sein bleibt das Adjektiv gleich: der Koffer ist groß. Vor dem Nomen bekommt es eine Endung: ein großer Koffer, eine große Tür, ein großes Glas."},
  contraireDe:{fr:"Le contraire :", en:"Opposite:", tr:"Zıttı:", uk:"Протилежне:", fa:"متضاد:", ar:"الضد:", pt:"O contrário:", pl:"Przeciwieństwo:", ru:"Противоположность:", de:"Gegenteil:"},
  presque:   {fr:"Presque le même sens :", en:"Almost the same:", tr:"Neredeyse aynı anlamda:", uk:"Майже те саме:", fa:"تقریباً هم‌معنی:", ar:"بالمعنى نفسه تقريبًا:", pt:"Quase o mesmo:", pl:"Prawie to samo:", ru:"Почти то же самое:", de:"Fast dasselbe:"},
  ecouter:   {fr:"Écouter", en:"Listen", tr:"Dinle", uk:"Слухати", fa:"گوش بده", ar:"استمع", pt:"Ouvir", pl:"Posłuchaj", ru:"Слушать", de:"Anhören"},
  commencer: {fr:"Commencer", en:"Start", tr:"Başla", uk:"Почати", fa:"شروع", ar:"ابدأ", pt:"Começar", pl:"Zacznij", ru:"Начать", de:"Starten"},
  comment:   {fr:"Regarde l'image et choisis le bon mot.", en:"Look at the picture and choose the right word.", tr:"Resme bak ve doğru kelimeyi seç.", uk:"Подивися на зображення й обери правильне слово.", fa:"به تصویر نگاه کن و واژهٔ درست را انتخاب کن.", ar:"انظر إلى الصورة واختر الكلمة الصحيحة.", pt:"Olhe a imagem e escolha a palavra certa.", pl:"Spójrz na obrazek i wybierz właściwe słowo.", ru:"Посмотри на картинку и выбери правильное слово.", de:"Sieh dir das Bild an und wähle das richtige Wort."},
  cual:      {fr:"Lis la question et touche la bonne image.", en:"Read the question and tap the right picture.", tr:"Soruyu oku ve doğru resme dokun.", uk:"Прочитай запитання й торкнися потрібного зображення.", fa:"سؤال را بخوان و روی تصویر درست بزن.", ar:"اقرأ السؤال والمس الصورة الصحيحة.", pt:"Leia a pergunta e toque na imagem certa.", pl:"Przeczytaj pytanie i dotknij właściwego obrazka.", ru:"Прочитай вопрос и нажми на нужную картинку.", de:"Lies die Frage und tippe auf das richtige Bild."},

  }
  const bons = ks.filter(k => f.startsWith(D.mots[k].de) && ["", "er", "e", "es"].includes(f.slice(D.mots[k].de.length)));
  return bons.sort((a, b) => D.mots[b].de.length - D.mots[a].de.length)[0] || null;
}

  // « La calle ___ estrecha. » es / está -- seulement les mots ou un seul verbe est juste (contrarios.py, SER, ESTAR)
  serEstar(w){

    const [t, x] = hasard(imgs.concat(phr));

    boutons($("choix"), ["es", "está"], rep, ok => { $("trou").textContent = rep; juger(ok, rep, phrase.replace("___", rep), ES.forme(k, t === "i" ? im(x).es[0] : x[2])); });

  // « La puerta está ___. » abierta / abierto -- pas grande (la meme forme), une image ou une phrase sans image
  accord(w){

  },
  // « Das ist ein ___ Koffer. » / « Der Koffer ist ___. » : la terminaison devant le nom, aucune apres sein
  endung(w){
    const imgs = IMG().filter(i => !w || im(i).mot === w.k).flatMap(i => [["a", i], ["p", i]]);
    const phr = D.phrasesDe.filter(([m]) => !w || m === D.mots[w.k].de).map(p => ["d", p]);

  vraifaux(w){

  comparatif(w){

                    phrase = EN.nom(g, true) + " on the left is ___ than the one on the right."; tradQ = PHRASE_TRADUITE && LANGUE === "fr" ? FR_COMP[g] || null : null; }
    else { k = x[0]; phrase = x[1]; tradQ = PHRASE_TRADUITE && LANGUE === "fr" ? x[2] : null; }
    viser(w, k);
    const [c, s] = EN_COMP[k], contraire = D.mots[k].contraire;

    ecran("comparatif", image, avecTrou(phrase));

  // L'ANGLAIS SEULEMENT : a ou an devant l'adjectif (« This is an old bike. »), sur l'image ou sur une phrase sans image
  article(w){

    const phr = EN_ARTICLE.filter(([k]) => !w || k === w.k).map(p => ["p", p]);

    boutons($("choix"), ["a", "an"], rep, ok => { $("trou").textContent = rep; juger(ok, rep, phrase.replace("___", rep), EN_MOTS[k]); });

  // l'ecoute : le mot dit (« estrecha »), deux ou trois images dont une seule le montre (les autres l'ont en « faux »)
  entendre(w){

// LA PARTIE (3 nov. 2026, « le tirage suit les mots ») : la file des MOTS vient de l'app (Tirage.plan : les dus,
// les rates recents, puis au plus NEUFS_MAX nouveaux) ; chaque mot recoit une question d'une sorte qui le vise,
// jamais la meme sorte deux fois de suite, jamais deux fois la meme question. Rate, il revient plus loin.
// Recopie de familia.html (visuel/THEMES-ILLUSTRES.md : ces fonctions sont identiques d'un theme a l'autre).
const NEUFS_MAX = Q.get("seance") === "1" ? 3 : 10;
let vus = new Set(), sorteCourante = null, derniereSorte = null;
function cleQuestion(){
  const z = $("zone"), en = z.querySelector(".enonce");
  return sorteCourante + "|" + (en ? en.textContent : "") + "|" + Array.from(z.querySelectorAll("img")).map(i => i.getAttribute("src")).sort().join(",");
}
function montrer(){
  repondu = false; $("suite").hidden = true;
  $("compte").textContent = (rang + 1) + " / " + file.length;
  $("barre").style.width = (rang / file.length * 100) + "%";
  // une question pour le mot du rang : d'une AUTRE sorte que la precedente et jamais deja vue dans la partie.
  // Si ce mot ne le permet pas, un mot plus loin dans la file passe devant ;
  // en dernier recours seulement, la meme sorte, puis une question deja vue.
  // (l'ecoute parle a chaque essai : on la fait taire pendant qu'on cherche, elle parle une fois choisie)
  const garde = dire; dire = () => {};
  const essai = (w, strict) => {
    const autres = melanger(SORTES.filter(x => x !== derniereSorte));
    for (const so of autres){
      for (let n = 0; n < 25; n++){
        motQ = null; cleQ = null; tradQ = null; choixTexte = choixImage = fauxQ = null; sorteCourante = so;
        if (!EX[so](w)) break;
        if (!vus.has(cleQuestion())) return so;
      }
    }
    if (strict) return null;
    if (derniereSorte) for (let n = 0; n < 25; n++){           // la meme sorte, avec une question fraiche
      motQ = null; cleQ = null; tradQ = null; choixTexte = choixImage = fauxQ = null; sorteCourante = derniereSorte;
      if (!EX[derniereSorte](w)) break;
      if (!vus.has(cleQuestion())) return derniereSorte;
    }
    for (const so of autres.concat(derniereSorte ? [derniereSorte] : [])){   // tout est deja vu : n'importe laquelle
      motQ = null; cleQ = null; tradQ = null; choixTexte = choixImage = fauxQ = null; sorteCourante = so;
      if (EX[so](w)) return so;
    }
    return null;
  };
  let fait = essai(file[rang], true);
  for (let j = rang + 1; !fait && j < file.length; j++){
    fait = essai(file[j], true);
    if (fait) [file[rang], file[j]] = [file[j], file[rang]];
  }
  if (!fait) fait = essai(file[rang], false);
  dire = garde;
  if (fait === "entendre"){ const e = $("ecoute"); if (e) e.click(); }
  vus.add(cleQuestion()); derniereSorte = fait;
  window.scrollTo(0, 0); document.body.scrollTop = 0;
}
function fin(){
  $("barre").style.width = "100%"; $("compte").textContent = file.length + " / " + file.length; $("suite").hidden = true;
  $("zone").innerHTML = '<div class="fin"><div class="score">' + T("score", {b: bons, n: file.length}) + '</div></div>' + boutonsBas();
  brancherEncore();
  $("terminer").addEventListener("click", () => parler("fini", {bons, faits: file.length}));
}
// plus rien de du ni de nouveau : la partie le dit, et ne repose pas des mots deja sus
function toutRevu(prochaine){
  $("barre").style.width = "100%"; $("compte").textContent = ""; $("suite").hidden = true;
  const quand = Tirage.revu(prochaine, LANGUE);
  $("zone").innerHTML = '<div class="fin"><div class="score">' + (TIRAGE_TEXTES.revu[LANGUE] || TIRAGE_TEXTES.revu.fr) + '</div>'
    + (quand ? '<p class="consigne">' + (TIRAGE_TEXTES.prochaine[LANGUE] || TIRAGE_TEXTES.prochaine.fr).replace("{d}", quand) + '</p>' : "")
    + '</div>' + boutonsBas();
  brancherEncore();
  $("terminer").addEventListener("click", () => parler("fini", {bons: 0, faits: 0}));
}
// « Encore des questions » : en fin de partie et quand tout est revu, jamais dans la seance (elle a sa longueur)
const boutonEncore = () => Q.get("seance") === "1" ? "" : '<button type="button" class="second" id="encore">' + (TIRAGE_TEXTES.encore[LANGUE] || TIRAGE_TEXTES.encore.fr) + '</button>';
const boutonsBas = () => '<div class="bas">' + boutonEncore() + '<button type="button" id="terminer">' + T("terminer") + '</button></div>';
function brancherEncore(){ const b = $("encore"); if (b) b.addEventListener("click", encoreDesQuestions); }
async function encoreDesQuestions(){
  const mots = motsDuTheme();
  file = Tirage.supplement(mots, await Tirage.demander(mots), NB); rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(null);
  montrer();
}
async function demarrer(){
  const mots = motsDuTheme();
  const plan = Tirage.plan(mots, await Tirage.demander(mots), NB, NEUFS_MAX);
  file = plan.file; rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(plan.prochaine);
  montrer();
}
$("suite").addEventListener("click", () => { if (!file.length) return; rang++; if (rang >= file.length) fin(); else montrer(); });
$("retour").addEventListener("click", () => parler("fermer"));
$("retour").setAttribute("aria-label", T("retourAria"));
$("titre").textContent = T("titre");
document.title = T("titre");
fetch("contrarios/contrarios.json?v=1").then(r => r.json()).then(d => {
  D = d;
  if (APPRENDRE === "en"){
    const tr = D.phrasesTrad.es || {}, dit = {}, trEn = {};
    IMG().forEach(i => {
      dit[i] = (im(i).mot === "estrecho" ? EN.nom(i, true) + " is very narrow." : EN.phrase(i));
      trEn[dit[i]] = tr[D.dit.es[i]] || tr[ES.phrase(i)];
      trEn[EN.phrase(i)] = tr[ES.phrase(i)];
    });
    D.dit.en = dit; D.phrasesTrad.en = trEn; D.trad.en = D.trad.es;   // le sens du mot : celui du mot espagnol de la meme image
  }
  if (Q.get("seance") === "1") demarrer(); else decouvrir();
});
