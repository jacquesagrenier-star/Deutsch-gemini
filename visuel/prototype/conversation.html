<title>Conversations</title>
<!--
  LES CONVERSATIONS JOUEES (proposition 9 de la revue d'usage, decisions de Jacques du 11 nov. 2026). On ne repete plus
  une phrase ecrite : on REPOND, au micro ou en touchant une reponse, et la conversation suit le choix. Des
  embranchements ecrits a l'avance, pas d'intelligence artificielle. Mode d'emploi : visuel/CONVERSATIONS.md.

  UNE PAGE, DES DONNEES : conversation.html?c=<id>&apprendre=de|es lit conversation/donnees/<id>.<langue>.json et
  conversation/personnes.json. Sans « c », la liste des conversations (conversation/donnees/index.json). Ajouter une
  conversation, c'est ecrire un fichier ; tests/conversations.py le controle (chemins, longueur, registre, mots vus).

  FAMILLE « TOI » : l'apprenant joue son propre role, au Sie / usted, face aux gens du quartier ; ni Anna ni Mark a
  l'A1 (chronologie de la serie). VISAGES EXPRESSIFS (option A) : le portrait de la personne qui parle grandit,
  s'eclaire et s'anime doucement, son expression change selon le moment ; pas de bouche qui bouge.

  UNE ERREUR NE FAIT PAS PERDRE : reaction en allemand ou en espagnol, une ligne qui explique, la reponse se barre, on
  reessaie ; tout se retrouve dans le bilan. LE MICRO : la reponse ecrite la plus proche de ce qui a ete dit ; trop
  loin de toutes, « Wie bitte? » / « ¿Perdón? ». « Sans filet » cache les reponses jusqu'a « Je ne sais pas quoi dire ».
  VOIX : celle du telephone (aucune depense). Les nombres se disent en lettres (champ « dit » ou {x:mots}).

  Parametres : c, apprendre (de, es ; de par defaut), nuit=1 (sans parametre, suit le telephone hors de l'app),
  sansfilet=1.
-->
<style>
:root{--fond1:#C89B85;--fond3:#E4CFC4;--encre:#1C2430;--gris:#5A5348;--ambre:#E8A23A;--ambre-f:#8A5A10;--vert:#2F7D57;
  --rouge:#B23F33;--rouge-pale:#F7E0DC;--turq:#14807A;--verre:rgba(255,255,255,.92);--bord:rgba(28,36,48,.10);--carte:#FFFFFF;
  --toi:#FBEBD0;--police:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html.nuit{--fond1:#4A2F29;--fond3:#262127;--encre:#EEF2F5;--gris:#B9B0A2;--ambre-f:#F0B456;--vert:#7FD1A4;
  --rouge:#F0A08C;--rouge-pale:#3D221B;--turq:#4FC7BD;--verre:rgba(30,34,40,.92);--bord:rgba(255,255,255,.12);--carte:#252A31;--toi:#3A2E1A}
*{box-sizing:border-box}
/* LA PAGE NE DEFILE PAS (12 nov. 2026, Jacques sur l'app iPhone : « l'image saute », « l'ecran est vide, faut que je
   clique sur l'ecran »). Dans le cadre de l'app (un iframe de WKWebView), le defilement « smooth » de toute la page, les
   elements colles (position:sticky) et le flou en arriere-plan (backdrop-filter) ne se repeignaient pas toujours avant un
   toucher. Ici, une colonne de la hauteur de l'ecran : l'en-tete, les visages et les reponses sont des blocs fixes, le fil
   seul defile (scrollTop, sans animation) ; ni sticky, ni backdrop-filter, ni background-attachment:fixed. */
html,body{margin:0;height:100%}
body{background:linear-gradient(180deg,var(--fond1),var(--fond3));color:var(--encre);font-family:var(--police);

button{font-family:inherit;color:inherit}
.haut{display:flex;align-items:center;gap:10px;max-width:560px;width:100%;margin:0 auto 8px;flex:none}
.retour{width:42px;height:42px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);font:800 22px var(--police);cursor:pointer;flex:0 0 auto}
.titre{flex:1;font-weight:900;font-size:18px;line-height:1.2}
.titre small{display:block;font-size:12px;font-weight:800;color:var(--gris);letter-spacing:.06em;text-transform:uppercase}
.maquette{font:800 11px var(--police);letter-spacing:.06em;text-transform:uppercase;color:var(--ambre-f);border:1px solid var(--ambre);border-radius:999px;padding:4px 9px;flex:0 0 auto}
main{max-width:560px;width:100%;margin:0 auto;position:relative;z-index:1;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#ecran{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#ecran.jeu{display:flex;flex-direction:column;overflow:hidden}
#ecran.jeu .fil{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
/* LE PAYSAGE DE LA PARTIE « CONVERSATION » (choix de Jacques du 11 nov. : B, un paysage dessine au style des autres
   parties de la seance ; dessins de la session de la seance, conversation/paysages.js). Pose en bas d'ecran, fixe,
   derriere la conversation ; le sol se prolonge sous le dessin jusqu'au bord du telephone. */
#paysage{position:absolute;left:0;right:0;bottom:0;z-index:0;pointer-events:none;padding-bottom:env(safe-area-inset-bottom,0px)}
#paysage svg{display:block;width:100%;height:min(31vw,170px)}
body.avec-paysage{padding-bottom:calc(env(safe-area-inset-bottom,0px) + min(31vw,170px) + 12px)}
body.avec-paysage .recit,body.avec-paysage .consigne,body.avec-paysage .titre small,body.avec-paysage .perso{color:var(--encre)}
.paysages{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:560px;margin:0 auto 8px}
.paysages .consigne{margin:0;white-space:nowrap}
.paysages button{border:1px solid var(--bord);background:var(--verre);border-radius:999px;padding:5px 11px;font:800 12px var(--police);cursor:pointer}

.plateau{position:relative;flex:none;z-index:2;display:flex;justify-content:center;align-items:flex-end;gap:16px;padding:6px 0 12px;

.plateau:empty{display:none}
.perso{margin:0;text-align:center;font:800 12px var(--police);color:var(--gris);transition:opacity .35s,transform .35s;opacity:.55;transform:scale(.86)}
.perso[hidden]{display:none}
.perso.arrive{animation:arrive .5s ease-out}
@keyframes arrive{from{opacity:0;transform:translateY(10px) scale(.8)}}
.perso.parle,.perso.dernier{opacity:1;transform:scale(1)}

.cadre{position:relative;width:108px;height:108px;border-radius:26px;overflow:hidden;margin:0 auto 5px;background:#ccc;
  box-shadow:0 6px 18px rgba(0,0,0,.14);transition:box-shadow .35s}
.cadre img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s ease}
.cadre img.sort{opacity:0}
.cadre::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(circle at 30% 20%,rgba(255,224,170,.45),transparent 60%)}

  background:color-mix(in srgb,var(--fond3) 92%,transparent)}

// ---------------------------------------------------------------- les nombres, dans les trois langues
const NB = {
  de: { u: ["null","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn","elf","zwölf","dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn"],
        d: ["","","zwanzig","dreißig","vierzig","fünfzig","sechzig","siebzig","achtzig","neunzig"] },
  es: { u: ["cero","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve",
            "veinte","veintiuno","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis","veintisiete","veintiocho","veintinueve"],
        d: ["","","","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"] },
  en: { u: ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"],
        d: ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"] }
};
function nombre(n, l){
  const t = NB[l];
  if (l === "de"){
    if (n < 20) return t.u[n];
    const d = Math.floor(n / 10), u = n % 10;
    return u ? (u === 1 ? "ein" : t.u[u]) + "und" + t.d[d] : t.d[d];
  }
  if (l === "en"){
    if (n < 20) return t.u[n];
    const d = Math.floor(n / 10), u = n % 10;
    return t.d[d] + (u ? "-" + t.u[u] : "");
  }
  if (n < 30) return t.u[n];
  const d = Math.floor(n / 10), u = n % 10;
  return t.d[d] + (u ? " y " + t.u[u] : "");
}
// « un euro », « veintiún euros » : la forme courte devant un nom.
const devantNom = (n, l) => l === "en" ? nombre(n, l) : l === "de" ? (n === 1 ? "ein" : nombre(n, l)) : nombre(n, l).replace(/uno$/, "ún").replace(/^ún$/, "un");
function prixEnMots(c, l){
  const e = Math.floor(c / 100), ct = c % 100;
  if (l === "de") return devantNom(e, l) + " Euro" + (ct ? " " + nombre(ct, l) : "");
  // Boston : des dollars ; « three dollars and twenty cents »
  if (l === "en") return nombre(e, l) + (e === 1 ? " dollar" : " dollars") + (ct ? " and " + nombre(ct, l) + (ct === 1 ? " cent" : " cents") : "");
  return devantNom(e, l) + (e === 1 ? " euro" : " euros") + (ct ? " con " + nombre(ct, l) : "");
}
function prixEnChiffres(c, l){
  if (l === "en") return "$" + Math.floor(c / 100) + "." + String(c % 100).padStart(2, "0");
  const s = Math.floor(c / 100) + "," + String(c % 100).padStart(2, "0");
  if (l === "fr"){
    if (LANG === "en") return LANGUE === "en" ? "$" + s.replace(",", ".") : "€" + s.replace(",", ".");
    if (LANG === "ar") return s + (LANGUE === "en" ? " دولار" : " يورو");
    return s + (LANGUE === "en" ? " $" : " euros");
  }
  return s + (l === "de" ? " Euro" : " euros");
}
const majuscule = s => s.charAt(0).toUpperCase() + s.slice(1);

// ---------------------------------------------------------------- l'etat et les gabarits
let C, PERS, S;
function partieNeuve(){ S = { etat: {}, erreurs: [], dit: [], essaye: {} }; }
function calcul(nom){
  if (nom === "a_payer") return (C.panier || []).reduce((a, k) => a + ((C.prix || {})[S.etat[k]] || 0), 0);
  if (nom === "arrondi") return Math.ceil(calcul("a_payer") * 1.05 / 100);
  return null;
}
// {a_payer} : un prix (en chiffres, dans la langue du champ) ; {a_payer:mots} ; {arrondi} ; {arrondi:mots_maj} ;
// {x} d'un texte de C.textes (selon la valeur de sa cle dans l'etat) ; {x} d'une valeur de l'etat.
function gabarit(s, l){
  return String(s || "").replace(/\{(\w+)(?::(\w+))?\}/g, (tout, nom, forme) => {
    const v = calcul(nom);
    if (v != null){
      const prix = nom !== "arrondi";
      const ll = l === "fr" ? LANGUE : l;
      if (forme === "mots") return prix ? prixEnMots(v, ll) : nombre(v, ll);
      if (forme === "mots_maj") return majuscule(prix ? prixEnMots(v, ll) : devantNom(v, ll));
      return prix ? (l === "fr" ? prixEnChiffres(v, "fr") : prixEnChiffres(v, l)) : String(v);
    }
    const t = (C.textes || {})[nom];
    if (t) return t[S.etat[t.cle]] || "";
    return S.etat[nom] != null ? S.etat[nom] : "";
  });
}
const vrai = si => !si || Object.keys(si).every(k => (S.etat[k] || "") === si[k]);

// ---------------------------------------------------------------- les visages
const REPLI = { question: ["attentive", "sourire"], attentive: ["question", "sourire"], surprise: ["attentive", "sourire"],
                perplexe: ["attentive", "surprise", "sourire"], amuse: ["sourire"], sourire: ["attentive"] };
function visage(qui, air){
  const v = PERS[qui].visages;
  if (v[air]) return v[air];
  for (const a of (REPLI[air] || [])) if (v[a]) return v[a];
  return v.sourire || Object.values(v)[0];
}
const persos = {};

  if (!C) return;
  C.personnes.forEach((qui, i) => {

}
function poserVisage(qui, air){
  const cadre = persos[qui].querySelector(".cadre"), src = visage(qui, air);
  const actuelle = cadre.querySelector("img:not(.sort)");
  if (actuelle && actuelle.getAttribute("src") === src) return;

  cadre.appendChild(img);
  // un minuteur et non requestAnimationFrame : celui-ci s'arrete quand la page est en arriere-plan
  setTimeout(() => { img.classList.remove("sort"); if (actuelle){ actuelle.classList.add("sort"); setTimeout(() => actuelle.remove(), 400); } }, 30);
}
function entre(qui){ const f = persos[qui]; if (f.hidden){ f.hidden = false; f.classList.add("arrive"); } }
function quiParle(qui){ Object.entries(persos).forEach(([k, f]) => { f.classList.toggle("parle", k === qui); if (qui) f.classList.toggle("dernier", k === qui); }); }

// ---------------------------------------------------------------- la voix du telephone
const VOIX_A_FUIR = ["albert","bad news","bahh","bells","boing","bubbles","cellos","good news","jester","organ","superstar","trinoids","whisper","wobble","zarvox","deranged","hysterical","junior","ralph","kathy","fred","princess","bruce","agnes","vicki","eddy","flo","grandma","grandpa","reed","rocko","sandy","shelley"];
const FEMME = /anna|petra|helena|katja|marlene|hedda|female|frau|mujer|m[oó]nica|paulina|luc[ií]a|elvira|marisol|samantha|\bava\b|allison|susan|zira|karen|serena|kate|moira|google/i;
const HOMME = /markus|yannick|martin|conrad|stefan|hans|killian|male|mann|hombre|jorge|diego|[aá]lvaro|pablo|juan|carlos|\balex\b|daniel|\btom\b|aaron|david|arthur|oliver/i;
let voix = { f: null, m: null };
function choisirVoix(){
  const toutes = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  const ici = toutes.filter(v => (v.lang || "").toLowerCase().startsWith(LANGUE) && !VOIX_A_FUIR.some(f => (v.name || "").toLowerCase().includes(f)));
  // l'espagnol d'Espagne d'abord ; l'anglais de la variante (en-US ou en-GB) d'abord
  const pays = LANGUE === "es" ? /es-es/i : LANGUE === "en" ? (GB ? /en-gb/i : /en-us/i) : /^de/i;
  const devant = ici.filter(v => pays.test(v.lang));
  const liste = devant.length ? devant.concat(ici.filter(v => !devant.includes(v))) : ici;
  voix.f = liste.find(v => FEMME.test(v.name)) || liste[0] || null;
  voix.m = liste.find(v => HOMME.test(v.name)) || liste.find(v => v !== voix.f) || liste[0] || null;
}
try{ choisirVoix(); if (window.speechSynthesis) speechSynthesis.onvoiceschanged = choisirVoix; }catch(e){}
function taire(){ try{ if (window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }
function dire(texte, qui){
  return new Promise(fini => {
    taire();
    if (!window.speechSynthesis){ setTimeout(fini, 400 + texte.length * 45); return; }
    const u = new SpeechSynthesisUtterance(texte);
    u.lang = BCP47; u.rate = 0.92;
    const g = qui === "toi" ? "f" : ((PERS[qui] || {}).voix || "f");
    const v = voix[g]; if (v) u.voice = v;
    if (v && voix.f === voix.m) u.pitch = g === "m" ? 0.85 : 1.12;
    let rendu = false; const fin = () => { if (!rendu){ rendu = true; fini(); } };
    u.onend = u.onerror = fin;
    speechSynthesis.speak(u);
    setTimeout(fin, 900 + texte.length * 110);   // filet : certains moteurs n'appellent jamais onend
  });
}

// ---------------------------------------------------------------- le micro (meme pont que l'oral du telc)
const Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
let ecouteApp = null;
window.addEventListener("message", e => {
  const d = e.data;
  if (!d || d.source !== "wortando-app" || d.type !== "micro" || !ecouteApp) return;
  if (d.etat === "texte") ecouteApp.surTexte(d.texte || "");
  else if (d.etat === "fin") { const f = ecouteApp; ecouteApp = null; f.surFin(d.texte || ""); }
  else if (d.etat === "indisponible") { const f = ecouteApp; ecouteApp = null; f.surFin(null); }
});
const MICRO_POSSIBLE = !!Reco || DANS_APP;
function ecouter(surTexte, surFin){
  if (Reco){
    let finals = "", provisoire = "", fini = false, reco;
    const total = () => (finals + " " + provisoire).replace(/\s+/g, " ").trim();
    const terminer = () => { if (fini) return; fini = true; surFin(total()); };
    try{
      reco = new Reco();
      reco.lang = BCP47; reco.continuous = false; reco.interimResults = true;
      reco.onresult = ev => {
        provisoire = "";
        for (let i = ev.resultIndex; i < ev.results.length; i++){
          const r = ev.results[i];
          if (r.isFinal) finals += " " + r[0].transcript; else provisoire += " " + r[0].transcript;
        }
        surTexte(total());
      };
      reco.onerror = ev => { if (ev && (ev.error === "not-allowed" || ev.error === "service-not-allowed") && !fini){ fini = true; surFin(null); } };
      reco.onend = () => setTimeout(terminer, 100);
      reco.start();
    }catch(e){ setTimeout(() => surFin(null), 0); return { arreter(){} }; }
    return { arreter(){ try{ reco.stop(); }catch(e){} setTimeout(terminer, 1500); } };
  }
  if (DANS_APP){
    ecouteApp = { surTexte, surFin };
    parler("micro", { action: "start", langue: BCP47 });
    return { arreter(){ parler("micro", { action: "stop" }); } };
  }
  setTimeout(() => surFin(null), 0);
  return { arreter(){} };
}
// La reponse la plus proche : les mots en commun (Dice), sans majuscules, accents ni ponctuation, un mot a une lettre
// pres comptant a moitie ; ou les paires de lettres, pour les mots composes que la reconnaissance coupe.
const plier = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ß/g, "ss")
  .replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
const mots = s => plier(s).split(" ").filter(Boolean);
function proche(a, b){
  if (a === b) return 1;
  if (Math.abs(a.length - b.length) > 1 || a.length < 4) return 0;
  let i = 0; while (i < a.length && a[i] === b[i]) i++;
  return (a.slice(i + 1) === b.slice(i + 1) || a.slice(i) === b.slice(i + 1) || a.slice(i + 1) === b.slice(i)) ? 0.5 : 0;
}
function ressemblance(dit, cible){
  const a = mots(dit), b = mots(cible);
  if (!a.length || !b.length) return 0;
  const reste = b.slice(); let commun = 0;
  a.forEach(m => {
    let k = reste.indexOf(m), p = 1;
    if (k < 0){ p = 0; reste.forEach((x, j) => { const q = proche(m, x); if (q > p){ p = q; k = j; } }); }
    if (k >= 0 && p > 0){ commun += p; reste.splice(k, 1); }
  });
  const parMots = 2 * commun / (a.length + b.length);
  const paires = s => { const c = plier(s).replace(/ /g, ""), r = []; for (let i = 0; i < c.length - 1; i++) r.push(c.slice(i, i + 2)); return r; };
  const pa = paires(dit), pc = paires(cible), pb = pc.slice();
  let n = 0; pa.forEach(p => { const k = pb.indexOf(p); if (k >= 0){ n++; pb.splice(k, 1); } });
  return Math.max(parMots, (pa.length + pc.length ? 2 * n / (pa.length + pc.length) : 0) * 0.95);
}

let dernier = null, fil, repondre, sansFilet = Q.get("sansfilet") === "1", noeud = null, ecouteEnCours = null;
const attendre = ms => new Promise(r => setTimeout(r, ms));
function defiler(){
  // le fil pendant la conversation, l'ecran sinon ; scrollTop et non scrollTo({behavior:"smooth"}), qui laissait l'ecran
  // vide sur l'iPhone jusqu'a un toucher
  const z = (ecran.classList.contains("jeu") && fil) || ecran;
  setTimeout(() => { z.scrollTop = z.scrollHeight; }, 30);
}
async function replique(r){
  if (!vrai(r.si)) return;
  if (r.recit){ fil.appendChild(el("div", "recit", gabarit(fr(r.recit), "fr"))); defiler(); await attendre(700); return; }
  const qui = r.qui, t = gabarit(T(r, "t"), LANGUE), dit = T(r, "dit") ? gabarit(T(r, "dit"), LANGUE) : t;
  entre(qui); poserVisage(qui, r.air || "sourire");
  const ligne = el("div", "ligne");
  const img = el("img"); img.src = visage(qui, r.air || "sourire"); img.alt = ""; ligne.appendChild(img);
  const b = el("div", "bulle");
  b.appendChild(el("div", "nom", fr(PERS[qui].nom)));
  const d = el("div", "de appris", t); d.lang = LANGUE; d.dir = "ltr"; b.appendChild(d);
  const f = el("div", "fr", gabarit(trad(r), "fr")); f.hidden = true; b.appendChild(f);
  const outils = el("div", "outils");
  outils.appendChild(boutonHP(dit, qui));
  const tr = el("button", null, u("traduire")); tr.type = "button"; tr.onclick = () => { f.hidden = !f.hidden; }; outils.appendChild(tr);
  b.appendChild(outils); ligne.appendChild(b); fil.appendChild(ligne); defiler();
  quiParle(qui); dernier = qui;
  await dire(dit, qui);
  quiParle(null);
  await attendre(250);
}

async function commencer(nu){

// Le nombre de repliques a dire depuis un noeud jusqu'a la fin, par le plus court chemin (barre de la seance).
function restantDepuis(id, vus){
  vus = vus || new Set();
  if (!id || !C.noeuds[id] || vus.has(id)) return 0;
  vus.add(id);
  const suites = (C.noeuds[id].choix || []).filter(c => !c.faux && !c.repete);
  if (!suites.length) return 0;
  return 1 + Math.min.apply(null, suites.map(c => c.va ? restantDepuis(c.va, new Set(vus)) : 0));
}
async function jouer(id){
  noeud = id;
  for (const r of (C.noeuds[id].dit || [])) await replique(r);
  montrerChoix(false);
}
function montrerChoix(apresErreur){
  repondre.textContent = ""; repondre.hidden = false;
  repondre.appendChild(el("p", "consigne", sansFilet ? u("a_toi_micro") : (MICRO_POSSIBLE ? u("a_toi") : u("a_toi_touche"))));
  const ch = el("div", "choix" + (sansFilet && !apresErreur ? " cache" : ""));
  choixDe(noeud).forEach(c => {
    const b = el("button"); b.type = "button";
    const t = el("b", "appris", gabarit(T(c, "t"), LANGUE)); t.lang = LANGUE; t.dir = "ltr"; b.appendChild(t);
    b.appendChild(el("span", null, gabarit(trad(c), "fr")));
    if (essayes(noeud).has(c.i)){ b.disabled = true; if (c.faux) b.classList.add("faux-essaye"); }
    b.onclick = () => choisir(c, true);
    ch.appendChild(b);
  });
  repondre.appendChild(ch);
  const m = el("div", "micro");
  if (MICRO_POSSIBLE){
    const mic = el("button", "mic"); mic.type = "button"; mic.innerHTML = MIC_SVG; mic.setAttribute("aria-label", u("micro_aria"));
    mic.onclick = () => micro(mic); m.appendChild(mic);
  }
  if (sansFilet && ch.classList.contains("cache")){
    const sos = el("button", "lien", u("sos")); sos.type = "button";
    sos.onclick = () => { ch.classList.remove("cache"); sos.remove(); };
    m.appendChild(sos);
  }
  repondre.appendChild(m);
  repondre.appendChild(el("div", "entendu"));
  defiler();
}
function micro(bouton){
  const entendu = repondre.querySelector(".entendu");
  if (ecouteEnCours){ ecouteEnCours.arreter(); return; }
  taire();
  bouton.classList.add("ecoute"); entendu.textContent = u("ecoute");
  ecouteEnCours = ecouter(t => { entendu.textContent = "« " + t + " »"; }, async t => {
    ecouteEnCours = null; bouton.classList.remove("ecoute");
    if (t == null){
      // pas de micro (refuse, absent, pas de reconnaissance) : les reponses ecrites reviennent, et « Sans filet » s'arrete
      entendu.textContent = u("micro_indispo"); sansFilet = false;
      const ch = repondre.querySelector(".choix"); if (ch) ch.classList.remove("cache");
      const sos = repondre.querySelector(".lien"); if (sos) sos.remove();
      return;
    }
    if (!t){ entendu.textContent = u("rien"); return; }
    let meilleur = null, score = 0;
    choixDe(noeud).forEach(c => { if (essayes(noeud).has(c.i)) return; const s = ressemblance(t, gabarit(T(c, "t"), LANGUE)); if (s > score){ score = s; meilleur = c; } });
    if (!meilleur || score < SEUIL){
      repondre.hidden = true;
      await replique({ qui: dernier || C.personnes[0], air: "perplexe", t: MOTS_UI.pardon, fr: u("pardon"), [LANG]: u("pardon") });
      montrerChoix(true);
      const aide = el("div", "aide douce"); aide.innerHTML = u("tu_as_dit", { t: t.replace(/[<>&]/g, "") });
      repondre.insertBefore(aide, repondre.firstChild);
      return;
    }
    choisir(meilleur);
  });
}
async function choisir(c, touchee){
  if (ecouteEnCours){ ecouteEnCours.arreter(); ecouteEnCours = null; }
  repondre.hidden = true;
  maReplique(c);
  S.dit.push(c);
  // touchee : on ne l'a pas dite soi-meme, la voix la dit (au micro, on vient de la dire) ; puis un temps pour la voir
  if (touchee) await dire(T(c, "dit") ? gabarit(T(c, "dit"), LANGUE) : gabarit(T(c, "t"), LANGUE), "toi");
  await attendre(touchee ? 450 : 700);
  if (c.faux || c.repete){
    essayes(noeud).add(c.i);
    if (c.faux){ S.erreurs.push(c); parler("exercice"); }
    for (const r of (c.puis || [])) await replique(r);
    montrerChoix(true);
    if (c.faux){ const aide = el("div", "aide"); aide.innerHTML = loc(c.aide); repondre.insertBefore(aide, repondre.firstChild); }
    defiler();
    return;
  }
  parler("bonne");
  // 12 nov. 2026 : la part faite, pour la barre de la seance (« avance ») -- les repliques dites sur celles qui restent
  // par le plus court chemin jusqu'a la fin.
  try{ const faites = S.dit.filter(x => !x.faux && !x.repete).length, reste = c.va ? restantDepuis(c.va) : 0;
       parler("avance", { f: faites / (faites + reste) }); }catch(e){}
  Object.assign(S.etat, c.pose || {});
  for (const r of (c.puis || [])) await replique(r);
  if (c.va) await jouer(c.va); else fin();
}
function fin(){
  quiParle(null);
  if (!SEANCE) parler("fini");
  const c = el("div", "carte fin");
  c.appendChild(el("h2", null, S.erreurs.length ? u("bien") : u("parfait")));
  c.appendChild(el("p", null, gabarit(fr(C.bilan), "fr")));
  if (S.erreurs.length){
    c.appendChild(el("h3", null, u("erreurs")));
    const ul = el("ul");
    S.erreurs.forEach(e => { const li = el("li"); li.innerHTML = '<s dir="ltr" class="appris">' + gabarit(T(e, "t"), LANGUE) + "</s> : " + loc(e.aide); ul.appendChild(li); });
    c.appendChild(ul);
  }
  c.appendChild(el("h3", null, u("phrases")));
  S.dit.filter(x => !x.faux && !x.repete).forEach(x => {
    const p = el("div", "phrase"), t = gabarit(T(x, "t"), LANGUE);
    const b = el("b", "appris", t); b.lang = LANGUE; b.dir = "ltr"; p.appendChild(b);
    p.appendChild(boutonHP(t, "toi", ""));
    c.appendChild(p);
  });
  const re = el("button", "gros", u("rejouer")); re.type = "button"; re.onclick = () => commencer(sansFilet);
  if (SEANCE && DANS_APP){
    // dans la seance : « Continuer » rend la main a la seance (« fini ») ; « Rejouer » reste, en second
    const suite = el("button", "gros", u("continuer")); suite.type = "button";
    suite.onclick = () => { suite.disabled = true; parler("fini"); };
    re.className = "gros second";
    c.append(suite, re);
  } else {
    const ter = el("button", "gros second", u("terminer")); ter.type = "button"; ter.onclick = quitter;
    c.append(re, ter);
  }
  fil.appendChild(c); defiler();
}

// ---------------------------------------------------------------- la liste (maquette)
async function liste(){
  plateau.textContent = "";
  document.getElementById("surtitre").textContent = DANS_APP ? u("conversations") : u("maquette");
  document.getElementById("titre").textContent = u("jouer");
  const idx = await charger("conversation/donnees/index.json");
  // les lots en parallele : un lot pas encore ecrit (404) ne retarde pas les autres
  // dans l'app, seulement les lots deja publies (index.json, « publies ») ; la page seule montre tout (maquette)
  const visibles = DANS_APP ? idx.lots.filter(l => (idx.publies || []).includes(l)) : idx.lots;
  const lots = await Promise.all(visibles.map(lot => charger("conversation/donnees/lot-" + lot + ".json").catch(() => null)));
  const toutes = [];
  lots.forEach(l => { if (l) l.conversations.forEach(e => toutes.push(e)); });
  ecran.textContent = ""; ecran.classList.remove("jeu"); ecran.scrollTop = 0;
  const c = el("div", "liste");
  const lg = el("div", "langues"); lg.hidden = DANS_APP;   // dans l'app, la langue apprise est celle du compte
  ["de", "es", "en"].forEach(k => {
    const b = el("button", null, u(k)); b.type = "button"; b.setAttribute("aria-pressed", String(k === LANGUE));
    b.onclick = () => { location.href = adresse({ apprendre: k, variante: null }); }; lg.appendChild(b);
  });
  if (!DANS_APP) c.appendChild(lg);
  let groupe = null;
  const ici = toutes.filter(e => e.langues.includes(LANGUE));
  const donnees = await Promise.all(ici.map(e => charger("conversation/donnees/" + e.id + "." + LANGUE + ".json").catch(() => null)));
  for (let k = 0; k < ici.length; k++){
    const e = ici[k], d = donnees[k];
    if (!d) continue;
    const g = d.parcours === "premiers-pas" ? u("pp") : d.parcours === "voyage" ? u("voyage") : d.niveau;
    if (g !== groupe){ c.appendChild(el("h2", null, g)); groupe = g; }
    const a = el("a"); a.href = adresse({ c: e.id, liste: "1" });
    a.onclick = ev => { ev.preventDefault(); ouvrirDepuisListe(e.id); };
    const im = el("img"); im.alt = ""; im.src = PERS[d.personnes[0]].visages.sourire; a.appendChild(im);
    const t = el("div"); t.appendChild(el("b", null, fr(d.titre)));
    t.appendChild(el("span", null, d.etape ? u("ligne_etape", { n: d.etape, niv: d.niveau, m: Object.keys(d.noeuds).length }) : u("ligne", { niv: d.niveau, m: Object.keys(d.noeuds).length })));
    a.appendChild(t); c.appendChild(a);
  }
  if (!DANS_APP){
    const det = el("details");
    det.innerHTML = `<summary>La maquette, pour Jacques</summary>
      <p><b>Les conversations commencent à l'étape 1.</b> Tes répliques sont les phrases de l'étape (chaque étape de Premiers pas en a neuf) ; la personne en face ne dit que des phrases très courtes. Premiers pas : 3 ou 4 échanges, une minute ; fin de l'A1 : 5 ou 6 ; A2 : 6 à 8 ; B1 : jusqu'à dix. Elles se terminent toujours sur une réussite.</p>
      <p><b>Famille « toi »</b> : tu joues ton propre rôle, au Sie (usted en espagnol), face aux gens du quartier ; ni Anna ni Mark à l'A1. Les conversations « dans la peau de Mark » s'ouvriront avec les épisodes.</p>
      <p><b>Les visages</b> changent selon le moment et s'animent pendant que la personne parle. Ceux du policier sont à faire (un seul visage pour l'instant).</p>
      <p><b>Où elles s'insèrent</b> : dans la séance du jour, après la scène de l'étape, le jour où l'étape se termine ; un bouton à la fin de la scène ; Tout le contenu, rubrique PARLER.</p>`;
    c.appendChild(det);
  }
  ecran.appendChild(c);
}

// L'adresse de la page avec d'autres parametres (la langue, la nuit et la variante suivent).
function adresse(change){
  const q = new URLSearchParams(location.search);
  ["c", "liste", "t"].forEach(k => q.delete(k));
  Object.entries(change || {}).forEach(([k, v]) => { if (v == null) q.delete(k); else q.set(k, v); });
  return "?" + q.toString();
}
// La liste et les conversations dans la MEME page : ouvrir une conversation ou revenir a la liste ne recharge pas le cadre
// (le flash de l'iPhone, 12 nov.). L'adresse suit (pushState), pour que le bouton retour d'Android revienne a la liste.
let enConversation = !!Q.get("c"), depuisListe = Q.get("liste") === "1", pousse = false;
async function ouvrirDepuisListe(id){
  taire();
  try{ C = await charger("conversation/donnees/" + id + "." + LANGUE + ".json"); }catch(e){ return; }
  try{ history.pushState({ c: id }, "", adresse({ c: id, liste: "1" })); pousse = true; }catch(e){}
  enConversation = true; depuisListe = true;
  presentation();
}
function revenirALaListe(){
  taire(); if (ecouteEnCours) ecouteEnCours.arreter();
  enConversation = false; plateau.textContent = "";
  liste();
}
addEventListener("popstate", () => {
  const id = new URLSearchParams(location.search).get("c");
  if (!id && enConversation) revenirALaListe();
});
// Quitter une conversation : vers la liste si l'on en vient (dans l'app comme hors de l'app) ; sinon on ferme le cadre.
function quitter(){
  taire(); if (ecouteEnCours) ecouteEnCours.arreter();
  if (enConversation && depuisListe){
    if (pousse){ pousse = false; history.back(); }          // popstate ramene la liste
    else { try{ history.replaceState(null, "", adresse({})); }catch(e){} revenirALaListe(); }
  }
  else if (enConversation && !DANS_APP) location.href = adresse({});
  else if (DANS_APP) parler("fermer");
  else history.back();
}
document.getElementById("retour").onclick = quitter;
if (LANG === "ar") document.getElementById("retour").textContent = "›";
document.getElementById("retour").setAttribute("aria-label", u("retour"));
if (DANS_APP) document.getElementById("marque").hidden = true;

// ---------------------------------------------------------------- le paysage
// La teinte de l'ecran suit le dessin (fondEcran) ; les verres du plateau et des reponses prennent ses deux couleurs.
// Le banc (B), seul dessin deploye ; la teinte est celle de la partie (TEINTES_PAYSAGE.conv de l'app), d'ou les
// memes couleurs que le &fond= de la seance.
const paysage = PAYSAGE_CHOISI;
function melange(hex, cible, k){
  const h = c => [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16)), a = h(hex), b = h(cible);
  return "#" + a.map((v, i) => Math.round(v + (b[i] - v) * k).toString(16).padStart(2, "0")).join("");
}
function poserPaysage(){
  if (typeof dessinerPaysageConversation !== "function") return;
  const nuit = document.documentElement.classList.contains("nuit");
  const d = dessinerPaysageConversation(paysage, nuit), b = TEINTE_CONVERSATION, fond = nuit ? "#0B1626" : "#FFFFFF";
  document.getElementById("paysage").innerHTML = d.svg;
  document.getElementById("paysage").style.background = "linear-gradient(transparent 60%," + d.sol + " 60%)";
  const r = document.documentElement.style;
  r.setProperty("--fond1", nuit ? melange(b, fond, .58) : melange(b, fond, .42));
  r.setProperty("--fond3", nuit ? melange(b, fond, .82) : melange(b, fond, .72));
  document.body.classList.add("avec-paysage");
}
poserPaysage();
(async () => {
  try{
    // les personnes : celles de tous les lots, fusionnees (personnes.json, puis personnes-<lot>.json s'il existe)
    // les personnes : les communes (index.json), puis celles que chaque lot declare (« personnes » de lot-<id>.json) --
    // jamais un fichier qui n'existe pas (un 404 compterait comme une erreur dans les parcours de l'app)
    PERS = {};
    const idx = await charger("conversation/donnees/index.json");
    const lots = await Promise.all(idx.lots.map(l => charger("conversation/donnees/lot-" + l + ".json").catch(() => null)));
    const fichiers = idx.personnes.concat(lots.filter(l => l && l.personnes).map(l => l.personnes));
    (await Promise.all(fichiers.map(f => charger("conversation/" + f).catch(() => null)))).forEach(x => { if (x) Object.assign(PERS, x); });
    if (Q.get("c")){ C = await charger("conversation/donnees/" + Q.get("c") + "." + LANGUE + ".json"); presentation(); }
    else await liste();
  }catch(e){ ecran.textContent = u("introuvable"); }
})();
</script>
