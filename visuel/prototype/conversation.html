<title>Conversations</title>
<!--
  LES CONVERSATIONS JOUEES (proposition 9 de la revue d'usage, decisions de Jacques du 11 nov. 2026). On ne repete plus
  une phrase ecrite : on REPOND, au micro ou en touchant une reponse, et la conversation suit le choix. Des
  embranchements ecrits a l'avance, pas d'intelligence artificielle. Mode d'emploi : visuel/CONVERSATIONS.md.

  UNE PAGE, DES DONNEES : conversation.html?c=<id>&apprendre=de|es lit conversation/donnees/<id>.<langue>.json et
  conversation/personnes.json. Sans « c », la liste des conversations (conversation/donnees/index.json). Ajouter une
  conversation, c'est ecrire un fichier ; tests/conversations.py le controle (chemins, longueur, registre, mots vus).

  FAMILLE « TOI » : l'apprenant joue son propre role, au Sie / usted, face aux gens du quartier ; ni Anna ni Mark a
  l'A1 (chronologie de la serie). VISAGES EXPRESSIFS (option A) : le portrait de la personne qui parle grandit,
  s'eclaire et s'anime doucement, son expression change selon le moment ; pas de bouche qui bouge.

  UNE ERREUR NE FAIT PAS PERDRE : reaction en allemand ou en espagnol, une ligne qui explique, la reponse se barre, on
  reessaie ; tout se retrouve dans le bilan. LE MICRO : la reponse ecrite la plus proche de ce qui a ete dit ; trop
  loin de toutes, « Wie bitte? » / « ¿Perdón? ». « Sans filet » cache les reponses jusqu'a « Je ne sais pas quoi dire ».
  VOIX : celle du telephone (aucune depense). Les nombres se disent en lettres (champ « dit » ou {x:mots}).

  Parametres : c, apprendre (de, es ; de par defaut), nuit=1 (sans parametre, suit le telephone hors de l'app),
  sansfilet=1.
-->
<style>
:root{--fond1:#F3E7D6;--fond3:#E7D3B9;--encre:#1C2430;--gris:#5A5348;--ambre:#E8A23A;--ambre-f:#8A5A10;--vert:#2F7D57;
  --rouge:#B23F33;--rouge-pale:#F7E0DC;--turq:#14807A;--verre:rgba(255,255,255,.92);--bord:rgba(28,36,48,.10);--carte:#FFFFFF;

  --rouge:#F0A08C;--rouge-pale:#3D221B;--turq:#4FC7BD;--verre:rgba(30,34,40,.92);--bord:rgba(255,255,255,.12);--carte:#252A31;--toi:#3A2E1A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}

  padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(14px,env(safe-area-inset-left,0px))}

.plateau{position:sticky;top:0;z-index:2;display:flex;justify-content:center;align-items:flex-end;gap:16px;padding:6px 0 12px;
  background:color-mix(in srgb,var(--fond1) 80%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);margin:0 -14px 6px;border-radius:0 0 22px 22px}

.perso{margin:0;text-align:center;font:800 12px var(--police);color:var(--gris);transition:opacity .35s,transform .35s;opacity:.55;transform:scale(.86)}

  background:radial-gradient(circle at 30% 20%,rgba(255,224,170,.45),transparent 60%)}

  background:color-mix(in srgb,var(--fond3) 72%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

.choix{display:flex;flex-direction:column;gap:8px}

.choix.cache{display:none}

.fin ul{margin:0;padding-left:20px}

.phrase{display:flex;align-items:center;gap:8px;margin:6px 0}
.phrase b{flex:1}
.phrase button{border:0;background:none;color:var(--turq);cursor:pointer;padding:6px}
@media (prefers-reduced-motion:reduce){.mic.ecoute,.perso.parle .cadre img,.perso.parle .cadre::after,.perso.arrive{animation:none}.perso,.cadre img{transition:none}}
</style>

<body>
<div class="haut">
  <button class="retour" id="retour" type="button" aria-label="Retour">‹</button>
  <div class="titre"><small id="surtitre">Conversations</small><span id="titre">Jouer une conversation</span></div>
  <span class="maquette" id="marque">Maquette</span>
</div>
<main>
  <div class="plateau" id="plateau"></div>
  <div id="ecran"></div>
</main>
<script>
"use strict";
const Q = new URLSearchParams(location.search);
const DANS_APP = window.parent && window.parent !== window;
if (Q.get("nuit") === "1" || (!Q.has("nuit") && !DANS_APP && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches))
  document.documentElement.classList.add("nuit");
const LANGUE = ["es", "en"].includes(Q.get("apprendre")) ? Q.get("apprendre") : "de";
// L'anglais : americain par defaut, britannique en variante (variante=gb) ; un champ t_gb / dit_gb remplace t / dit.
const GB = LANGUE === "en" && Q.get("variante") === "gb";
const BCP47 = { de: "de-DE", es: "es-ES", en: GB ? "en-GB" : "en-US" }[LANGUE];
const T = (o, champ) => (GB && o[champ + "_gb"] != null) ? o[champ + "_gb"] : o[champ];
function parler(type, extra){ try{ if (DANS_APP) parent.postMessage(Object.assign({source: "wortando-scene", type}, extra || {}), "*"); }catch(e){} }
const charger = url => fetch(url, { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(url + " : " + r.status); return r.json(); });
const ecran = document.getElementById("ecran"), plateau = document.getElementById("plateau");
function el(tag, cls, texte){ const e = document.createElement(tag); if (cls) e.className = cls; if (texte != null) e.textContent = texte; return e; }
const fr = o => (o && (o.fr || o.en)) || "";
const MOTS_UI = {
  de: { pardon: "Wie bitte?", pardon_fr: "Pardon ?" },
  es: { pardon: "¿Perdón?", pardon_fr: "Pardon ?" },
  en: { pardon: "Sorry?", pardon_fr: "Pardon ?" }
}[LANGUE];

// ---------------------------------------------------------------- les nombres, dans les trois langues
const NB = {
  de: { u: ["null","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn","elf","zwölf","dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn"],
        d: ["","","zwanzig","dreißig","vierzig","fünfzig","sechzig","siebzig","achtzig","neunzig"] },
  es: { u: ["cero","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve",
            "veinte","veintiuno","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis","veintisiete","veintiocho","veintinueve"],
        d: ["","","","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"] },
  en: { u: ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"],
        d: ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"] }
};
function nombre(n, l){
  const t = NB[l];
  if (l === "de"){
    if (n < 20) return t.u[n];
    const d = Math.floor(n / 10), u = n % 10;
    return u ? (u === 1 ? "ein" : t.u[u]) + "und" + t.d[d] : t.d[d];
  }
  if (l === "en"){
    if (n < 20) return t.u[n];
    const d = Math.floor(n / 10), u = n % 10;
    return t.d[d] + (u ? "-" + t.u[u] : "");
  }
  if (n < 30) return t.u[n];
  const d = Math.floor(n / 10), u = n % 10;
  return t.d[d] + (u ? " y " + t.u[u] : "");
}
// « un euro », « veintiún euros » : la forme courte devant un nom.
const devantNom = (n, l) => l === "en" ? nombre(n, l) : l === "de" ? (n === 1 ? "ein" : nombre(n, l)) : nombre(n, l).replace(/uno$/, "ún").replace(/^ún$/, "un");
function prixEnMots(c, l){
  const e = Math.floor(c / 100), ct = c % 100;
  if (l === "de") return devantNom(e, l) + " Euro" + (ct ? " " + nombre(ct, l) : "");
  // Boston : des dollars ; « three dollars and twenty cents »
  if (l === "en") return nombre(e, l) + (e === 1 ? " dollar" : " dollars") + (ct ? " and " + nombre(ct, l) + (ct === 1 ? " cent" : " cents") : "");
  return devantNom(e, l) + (e === 1 ? " euro" : " euros") + (ct ? " con " + nombre(ct, l) : "");
}
function prixEnChiffres(c, l){
  if (l === "en") return "$" + Math.floor(c / 100) + "." + String(c % 100).padStart(2, "0");
  const s = Math.floor(c / 100) + "," + String(c % 100).padStart(2, "0");
  if (l === "fr" && LANGUE === "en") return s + " $";
  return s + (l === "de" ? " Euro" : " euros");
}
const majuscule = s => s.charAt(0).toUpperCase() + s.slice(1);

// ---------------------------------------------------------------- l'etat et les gabarits
let C, PERS, S;
function partieNeuve(){ S = { etat: {}, erreurs: [], dit: [], essaye: {} }; }
function calcul(nom){
  if (nom === "a_payer") return (C.panier || []).reduce((a, k) => a + ((C.prix || {})[S.etat[k]] || 0), 0);
  if (nom === "arrondi") return Math.ceil(calcul("a_payer") * 1.05 / 100);
  return null;
}
// {a_payer} : un prix (en chiffres, dans la langue du champ) ; {a_payer:mots} ; {arrondi} ; {arrondi:mots_maj} ;
// {x} d'un texte de C.textes (selon la valeur de sa cle dans l'etat) ; {x} d'une valeur de l'etat.
function gabarit(s, l){
  return String(s || "").replace(/\{(\w+)(?::(\w+))?\}/g, (tout, nom, forme) => {
    const v = calcul(nom);
    if (v != null){
      const prix = nom !== "arrondi";
      const ll = l === "fr" ? LANGUE : l;
      if (forme === "mots") return prix ? prixEnMots(v, ll) : nombre(v, ll);
      if (forme === "mots_maj") return majuscule(prix ? prixEnMots(v, ll) : devantNom(v, ll));
      return prix ? (l === "fr" ? prixEnChiffres(v, "fr") : prixEnChiffres(v, l)) : String(v);
    }
    const t = (C.textes || {})[nom];
    if (t) return t[S.etat[t.cle]] || "";
    return S.etat[nom] != null ? S.etat[nom] : "";
  });
}
const vrai = si => !si || Object.keys(si).every(k => (S.etat[k] || "") === si[k]);

// ---------------------------------------------------------------- les visages
const REPLI = { question: ["attentive", "sourire"], attentive: ["question", "sourire"], surprise: ["attentive", "sourire"],
                perplexe: ["attentive", "surprise", "sourire"], amuse: ["sourire"], sourire: ["attentive"] };
function visage(qui, air){
  const v = PERS[qui].visages;
  if (v[air]) return v[air];
  for (const a of (REPLI[air] || [])) if (v[a]) return v[a];
  return v.sourire || Object.values(v)[0];
}
const persos = {};
function plateauNeuf(){
  plateau.textContent = "";
  Object.keys(persos).forEach(k => delete persos[k]);
  if (!C) return;
  C.personnes.forEach((qui, i) => {
    const f = el("figure", "perso" + (i === 0 ? " dernier" : "")); f.dataset.qui = qui; f.hidden = i > 0;
    f.appendChild(el("div", "cadre")); f.appendChild(document.createTextNode(fr(PERS[qui].nom)));
    plateau.appendChild(f); persos[qui] = f;
    poserVisage(qui, "sourire");
    Object.values(PERS[qui].visages).forEach(s => { const im = new Image(); im.src = s; });
  });
}
function poserVisage(qui, air){
  const cadre = persos[qui].querySelector(".cadre"), src = visage(qui, air);
  const actuelle = cadre.querySelector("img:not(.sort)");
  if (actuelle && actuelle.getAttribute("src") === src) return;
  const img = new Image(); img.alt = ""; img.src = src; img.className = "sort";
  cadre.appendChild(img);
  // un minuteur et non requestAnimationFrame : celui-ci s'arrete quand la page est en arriere-plan
  setTimeout(() => { img.classList.remove("sort"); if (actuelle){ actuelle.classList.add("sort"); setTimeout(() => actuelle.remove(), 400); } }, 30);
}
function entre(qui){ const f = persos[qui]; if (f.hidden){ f.hidden = false; f.classList.add("arrive"); } }
function quiParle(qui){ Object.entries(persos).forEach(([k, f]) => { f.classList.toggle("parle", k === qui); if (qui) f.classList.toggle("dernier", k === qui); }); }

// ---------------------------------------------------------------- la voix du telephone
const VOIX_A_FUIR = ["albert","bad news","bahh","bells","boing","bubbles","cellos","good news","jester","organ","superstar","trinoids","whisper","wobble","zarvox","deranged","hysterical","junior","ralph","kathy","fred","princess","bruce","agnes","vicki","eddy","flo","grandma","grandpa","reed","rocko","sandy","shelley"];
const FEMME = /anna|petra|helena|katja|marlene|hedda|female|frau|mujer|m[oó]nica|paulina|luc[ií]a|elvira|marisol|samantha|\bava\b|allison|susan|zira|karen|serena|kate|moira|google/i;
const HOMME = /markus|yannick|martin|conrad|stefan|hans|killian|male|mann|hombre|jorge|diego|[aá]lvaro|pablo|juan|carlos|\balex\b|daniel|\btom\b|aaron|david|arthur|oliver/i;
let voix = { f: null, m: null };
function choisirVoix(){
  const toutes = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  const ici = toutes.filter(v => (v.lang || "").toLowerCase().startsWith(LANGUE) && !VOIX_A_FUIR.some(f => (v.name || "").toLowerCase().includes(f)));
  // l'espagnol d'Espagne d'abord ; l'anglais de la variante (en-US ou en-GB) d'abord
  const pays = LANGUE === "es" ? /es-es/i : LANGUE === "en" ? (GB ? /en-gb/i : /en-us/i) : /^de/i;
  const devant = ici.filter(v => pays.test(v.lang));
  const liste = devant.length ? devant.concat(ici.filter(v => !devant.includes(v))) : ici;
  voix.f = liste.find(v => FEMME.test(v.name)) || liste[0] || null;
  voix.m = liste.find(v => HOMME.test(v.name)) || liste.find(v => v !== voix.f) || liste[0] || null;
}
try{ choisirVoix(); if (window.speechSynthesis) speechSynthesis.onvoiceschanged = choisirVoix; }catch(e){}
function taire(){ try{ if (window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }
function dire(texte, qui){
  return new Promise(fini => {
    taire();
    if (!window.speechSynthesis){ setTimeout(fini, 400 + texte.length * 45); return; }
    const u = new SpeechSynthesisUtterance(texte);
    u.lang = BCP47; u.rate = 0.92;
    const g = qui === "toi" ? "f" : ((PERS[qui] || {}).voix || "f");
    const v = voix[g]; if (v) u.voice = v;
    if (v && voix.f === voix.m) u.pitch = g === "m" ? 0.85 : 1.12;
    let rendu = false; const fin = () => { if (!rendu){ rendu = true; fini(); } };
    u.onend = u.onerror = fin;
    speechSynthesis.speak(u);
    setTimeout(fin, 900 + texte.length * 110);   // filet : certains moteurs n'appellent jamais onend
  });
}

// ---------------------------------------------------------------- le micro (meme pont que l'oral du telc)
const Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
let ecouteApp = null;
window.addEventListener("message", e => {
  const d = e.data;
  if (!d || d.source !== "wortando-app" || d.type !== "micro" || !ecouteApp) return;
  if (d.etat === "texte") ecouteApp.surTexte(d.texte || "");
  else if (d.etat === "fin") { const f = ecouteApp; ecouteApp = null; f.surFin(d.texte || ""); }
  else if (d.etat === "indisponible") { const f = ecouteApp; ecouteApp = null; f.surFin(null); }
});
const MICRO_POSSIBLE = !!Reco || DANS_APP;
function ecouter(surTexte, surFin){
  if (Reco){
    let finals = "", provisoire = "", fini = false, reco;
    const total = () => (finals + " " + provisoire).replace(/\s+/g, " ").trim();
    const terminer = () => { if (fini) return; fini = true; surFin(total()); };
    try{
      reco = new Reco();
      reco.lang = BCP47; reco.continuous = false; reco.interimResults = true;
      reco.onresult = ev => {
        provisoire = "";
        for (let i = ev.resultIndex; i < ev.results.length; i++){
          const r = ev.results[i];
          if (r.isFinal) finals += " " + r[0].transcript; else provisoire += " " + r[0].transcript;
        }
        surTexte(total());
      };
      reco.onerror = ev => { if (ev && (ev.error === "not-allowed" || ev.error === "service-not-allowed") && !fini){ fini = true; surFin(null); } };
      reco.onend = () => setTimeout(terminer, 100);
      reco.start();
    }catch(e){ setTimeout(() => surFin(null), 0); return { arreter(){} }; }
    return { arreter(){ try{ reco.stop(); }catch(e){} setTimeout(terminer, 1500); } };
  }
  if (DANS_APP){
    ecouteApp = { surTexte, surFin };
    parler("micro", { action: "start", langue: BCP47 });
    return { arreter(){ parler("micro", { action: "stop" }); } };
  }
  setTimeout(() => surFin(null), 0);
  return { arreter(){} };
}
// La reponse la plus proche : les mots en commun (Dice), sans majuscules, accents ni ponctuation, un mot a une lettre
// pres comptant a moitie ; ou les paires de lettres, pour les mots composes que la reconnaissance coupe.
const plier = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ß/g, "ss")
  .replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
const mots = s => plier(s).split(" ").filter(Boolean);
function proche(a, b){
  if (a === b) return 1;
  if (Math.abs(a.length - b.length) > 1 || a.length < 4) return 0;
  let i = 0; while (i < a.length && a[i] === b[i]) i++;
  return (a.slice(i + 1) === b.slice(i + 1) || a.slice(i) === b.slice(i + 1) || a.slice(i + 1) === b.slice(i)) ? 0.5 : 0;
}
function ressemblance(dit, cible){
  const a = mots(dit), b = mots(cible);
  if (!a.length || !b.length) return 0;
  const reste = b.slice(); let commun = 0;
  a.forEach(m => {
    let k = reste.indexOf(m), p = 1;
    if (k < 0){ p = 0; reste.forEach((x, j) => { const q = proche(m, x); if (q > p){ p = q; k = j; } }); }
    if (k >= 0 && p > 0){ commun += p; reste.splice(k, 1); }
  });
  const parMots = 2 * commun / (a.length + b.length);
  const paires = s => { const c = plier(s).replace(/ /g, ""), r = []; for (let i = 0; i < c.length - 1; i++) r.push(c.slice(i, i + 2)); return r; };
  const pa = paires(dit), pc = paires(cible), pb = pc.slice();
  let n = 0; pa.forEach(p => { const k = pb.indexOf(p); if (k >= 0){ n++; pb.splice(k, 1); } });
  return Math.max(parMots, (pa.length + pc.length ? 2 * n / (pa.length + pc.length) : 0) * 0.95);
}
const SEUIL = 0.5;

// ---------------------------------------------------------------- l'ecran de jeu
const HP_SVG = '<svg class="ic-hp" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM18.584 5.106a.75.75 0 0 1 1.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 0 1-1.06-1.06 8.25 8.25 0 0 0 0-11.668.75.75 0 0 1 0-1.06Z"/><path d="M15.932 7.757a.75.75 0 0 1 1.061 0 6 6 0 0 1 0 8.486.75.75 0 0 1-1.06-1.061 4.5 4.5 0 0 0 0-6.364.75.75 0 0 1 0-1.06Z"/></svg>';
const MIC_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.25 4.5a3.75 3.75 0 1 1 7.5 0v8.25a3.75 3.75 0 1 1-7.5 0V4.5Z"/><path d="M6 10.5a.75.75 0 0 1 .75.75v1.5a5.25 5.25 0 1 0 10.5 0v-1.5a.75.75 0 0 1 1.5 0v1.5a6.751 6.751 0 0 1-6 6.709v2.291h3a.75.75 0 0 1 0 1.5h-7.5a.75.75 0 0 1 0-1.5h3v-2.291a6.751 6.751 0 0 1-6-6.709v-1.5A.75.75 0 0 1 6 10.5Z"/></svg>';
function boutonHP(texte, qui, libelle){
  const b = el("button"); b.type = "button"; b.innerHTML = HP_SVG; b.appendChild(document.createTextNode(libelle == null ? " Réécouter" : libelle));
  if (!libelle) b.setAttribute("aria-label", "Réécouter");
  b.onclick = () => dire(texte, qui);
  return b;
}
let dernier = null, fil, repondre, sansFilet = Q.get("sansfilet") === "1", noeud = null, ecouteEnCours = null;
const attendre = ms => new Promise(r => setTimeout(r, ms));
function defiler(){ setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }), 30); }
async function replique(r){
  if (!vrai(r.si)) return;
  if (r.recit){ fil.appendChild(el("div", "recit", gabarit(fr(r.recit), "fr"))); defiler(); await attendre(700); return; }
  const qui = r.qui, t = gabarit(T(r, "t"), LANGUE), dit = T(r, "dit") ? gabarit(T(r, "dit"), LANGUE) : t;
  entre(qui); poserVisage(qui, r.air || "sourire");
  const ligne = el("div", "ligne");
  const img = el("img"); img.src = visage(qui, r.air || "sourire"); img.alt = ""; ligne.appendChild(img);
  const b = el("div", "bulle");
  b.appendChild(el("div", "nom", fr(PERS[qui].nom)));
  const d = el("div", "de", t); d.lang = LANGUE; b.appendChild(d);
  const f = el("div", "fr", gabarit(r.fr, "fr")); f.hidden = true; b.appendChild(f);
  const outils = el("div", "outils");
  outils.appendChild(boutonHP(dit, qui));
  const tr = el("button", null, "Traduire"); tr.type = "button"; tr.onclick = () => { f.hidden = !f.hidden; }; outils.appendChild(tr);
  b.appendChild(outils); ligne.appendChild(b); fil.appendChild(ligne); defiler();
  quiParle(qui); dernier = qui;
  await dire(dit, qui);
  quiParle(null);
  await attendre(250);
}
function maReplique(c){
  const ligne = el("div", "ligne toi");
  const b = el("div", "bulle" + (c.faux ? " faux" : ""));
  b.appendChild(el("div", "nom", "Toi"));
  const d = el("div", "de", gabarit(T(c, "t"), LANGUE)); d.lang = LANGUE; b.appendChild(d);
  b.appendChild(el("div", "fr", gabarit(c.fr, "fr")));
  ligne.appendChild(b); fil.appendChild(ligne); defiler();
}
const choixDe = id => (C.noeuds[id].choix || []).map((c, i) => Object.assign({ i }, c)).filter(c => vrai(c.si));
const essayes = id => (S.essaye[id] = S.essaye[id] || new Set());

function presentation(){
  taire(); partieNeuve(); plateauNeuf();
  document.getElementById("surtitre").textContent = "Conversation · " + C.niveau + (C.etape ? " · étape " + C.etape : "");
  document.getElementById("titre").textContent = fr(C.titre);
  ecran.textContent = "";
  const c = el("div", "carte debut");
  c.appendChild(el("h1", null, fr(C.titre)));
  c.appendChild(el("p", null, fr(C.intro)));
  const p = el("p"); p.innerHTML = "<b>C'est toi qui réponds</b> : touche une réponse, ou dis-la au micro. La conversation suit ce que tu choisis."; c.appendChild(p);
  const puces = el("div", "puces");
  const nb = Object.keys(C.noeuds).length;
  [C.niveau, { de: "Allemand", es: "Espagnol", en: GB ? "Anglais (britannique)" : "Anglais" }[LANGUE], { Sie: "Sie", usted: "usted", poli: "registre poli" }[C.registre] || C.registre, (nb <= 5 ? "1 minute" : "3 minutes")]
    .forEach(x => puces.appendChild(el("span", null, x)));
  c.appendChild(puces);
  const go = el("button", "gros", "Commencer"); go.type = "button"; go.onclick = () => commencer(false);
  c.appendChild(go);
  if (MICRO_POSSIBLE){ const nu = el("button", "gros second", "Sans filet : tout au micro"); nu.type = "button"; nu.onclick = () => commencer(true); c.appendChild(nu); }
  else c.appendChild(el("p", "entendu", "Ce navigateur n'a pas de reconnaissance de la voix : touche les réponses."));
  ecran.appendChild(c);
}
async function commencer(nu){
  sansFilet = nu; partieNeuve(); plateauNeuf();
  ecran.textContent = "";
  fil = el("div", "fil"); ecran.appendChild(fil);
  repondre = el("div", "repondre"); repondre.hidden = true; ecran.appendChild(repondre);
  await jouer(C.debut);
}
async function jouer(id){
  noeud = id;
  for (const r of (C.noeuds[id].dit || [])) await replique(r);
  montrerChoix(false);
}
function montrerChoix(apresErreur){
  repondre.textContent = ""; repondre.hidden = false;
  repondre.appendChild(el("p", "consigne", sansFilet ? "À toi : réponds au micro." : (MICRO_POSSIBLE ? "À toi : touche ta réponse, ou dis-la au micro." : "À toi : touche ta réponse.")));
  const ch = el("div", "choix" + (sansFilet && !apresErreur ? " cache" : ""));
  choixDe(noeud).forEach(c => {
    const b = el("button"); b.type = "button";
    const t = el("b", null, gabarit(T(c, "t"), LANGUE)); t.lang = LANGUE; b.appendChild(t);
    b.appendChild(el("span", null, gabarit(c.fr, "fr")));
    if (essayes(noeud).has(c.i)){ b.disabled = true; if (c.faux) b.classList.add("faux-essaye"); }
    b.onclick = () => choisir(c);
    ch.appendChild(b);
  });
  repondre.appendChild(ch);
  const m = el("div", "micro");
  if (MICRO_POSSIBLE){
    const mic = el("button", "mic"); mic.type = "button"; mic.innerHTML = MIC_SVG; mic.setAttribute("aria-label", "Répondre au micro");
    mic.onclick = () => micro(mic); m.appendChild(mic);
  }
  if (sansFilet && ch.classList.contains("cache")){
    const sos = el("button", "lien", "Je ne sais pas quoi dire"); sos.type = "button";
    sos.onclick = () => { ch.classList.remove("cache"); sos.remove(); };
    m.appendChild(sos);
  }
  repondre.appendChild(m);
  repondre.appendChild(el("div", "entendu"));
  defiler();
}
function micro(bouton){
  const entendu = repondre.querySelector(".entendu");
  if (ecouteEnCours){ ecouteEnCours.arreter(); return; }
  taire();
  bouton.classList.add("ecoute"); entendu.textContent = "Je t'écoute…";
  ecouteEnCours = ecouter(t => { entendu.textContent = "« " + t + " »"; }, async t => {
    ecouteEnCours = null; bouton.classList.remove("ecoute");
    if (t == null){ entendu.textContent = "Le micro n'est pas disponible : touche ta réponse."; repondre.querySelector(".choix").classList.remove("cache"); return; }
    if (!t){ entendu.textContent = "Je n'ai rien entendu. Réessaie, plus près du téléphone."; return; }
    let meilleur = null, score = 0;
    choixDe(noeud).forEach(c => { if (essayes(noeud).has(c.i)) return; const s = ressemblance(t, gabarit(T(c, "t"), LANGUE)); if (s > score){ score = s; meilleur = c; } });
    if (!meilleur || score < SEUIL){
      repondre.hidden = true;
      await replique({ qui: dernier || C.personnes[0], air: "perplexe", t: MOTS_UI.pardon, fr: MOTS_UI.pardon_fr });
      montrerChoix(true);
      const aide = el("div", "aide douce"); aide.innerHTML = "<b>Tu as dit : « " + t.replace(/[<>&]/g, "") + " ».</b> Ce n'est pas une des réponses : redis-la, ou touche-la.";
      repondre.insertBefore(aide, repondre.firstChild);
      return;
    }
    choisir(meilleur);
  });
}
async function choisir(c){
  if (ecouteEnCours){ ecouteEnCours.arreter(); ecouteEnCours = null; }
  repondre.hidden = true;
  maReplique(c);
  S.dit.push(c);
  if (c.faux || c.repete){
    essayes(noeud).add(c.i);
    if (c.faux){ S.erreurs.push(c); parler("exercice"); }
    for (const r of (c.puis || [])) await replique(r);
    montrerChoix(true);
    if (c.faux){ const aide = el("div", "aide"); aide.innerHTML = fr(c.aide); repondre.insertBefore(aide, repondre.firstChild); }
    defiler();
    return;
  }
  parler("bonne");
  Object.assign(S.etat, c.pose || {});
  for (const r of (c.puis || [])) await replique(r);
  if (c.va) await jouer(c.va); else fin();
}
function fin(){
  quiParle(null);
  parler("fini");
  const c = el("div", "carte fin");
  c.appendChild(el("h2", null, S.erreurs.length ? "Bien joué !" : "Parfait, sans une erreur !"));
  c.appendChild(el("p", null, gabarit(fr(C.bilan), "fr")));
  if (S.erreurs.length){
    c.appendChild(el("h3", null, "Tes erreurs, corrigées"));
    const ul = el("ul");
    S.erreurs.forEach(e => { const li = el("li"); li.innerHTML = "<s>" + gabarit(T(e, "t"), LANGUE) + "</s> : " + fr(e.aide); ul.appendChild(li); });
    c.appendChild(ul);
  }
  c.appendChild(el("h3", null, "Les phrases que tu as dites"));
  S.dit.filter(x => !x.faux && !x.repete).forEach(x => {
    const p = el("div", "phrase"), t = gabarit(T(x, "t"), LANGUE);
    const b = el("b", null, t); b.lang = LANGUE; p.appendChild(b);
    p.appendChild(boutonHP(t, "toi", ""));
    c.appendChild(p);
  });
  const re = el("button", "gros", "Rejouer en répondant autrement"); re.type = "button"; re.onclick = () => commencer(sansFilet);
  const ter = el("button", "gros second", "Terminer"); ter.type = "button"; ter.onclick = () => { if (DANS_APP) parler("fermer"); else location.href = "?apprendre=" + LANGUE + (GB ? "&variante=gb" : ""); };
  c.append(re, ter);
  fil.appendChild(c); defiler();
}

// ---------------------------------------------------------------- la liste (maquette)
async function liste(){
  plateau.textContent = "";
  document.getElementById("surtitre").textContent = "Maquette";
  document.getElementById("titre").textContent = "Jouer une conversation";
  const idx = await charger("conversation/donnees/index.json");

  const c = el("div", "liste");

  });

    if (g !== groupe){ c.appendChild(el("h2", null, g)); groupe = g; }
    const a = el("a"); a.href = "?c=" + e.id + "&apprendre=" + LANGUE + (GB ? "&variante=gb" : "") + (Q.get("nuit") ? "&nuit=" + Q.get("nuit") : "");
    const im = el("img"); im.alt = ""; im.src = PERS[d.personnes[0]].visages.sourire; a.appendChild(im);
    const t = el("div"); t.appendChild(el("b", null, fr(d.titre)));

    a.appendChild(t); c.appendChild(a);
  }
  if (!DANS_APP){
    const det = el("details");
    det.innerHTML = `<summary>La maquette, pour Jacques</summary>
      <p><b>Les conversations commencent à l'étape 1.</b> Tes répliques sont les phrases de l'étape (chaque étape de Premiers pas en a neuf) ; la personne en face ne dit que des phrases très courtes. Premiers pas : 3 ou 4 échanges, une minute ; fin de l'A1 : 5 ou 6 ; A2 : 6 à 8 ; B1 : jusqu'à dix. Elles se terminent toujours sur une réussite.</p>
      <p><b>Famille « toi »</b> : tu joues ton propre rôle, au Sie (usted en espagnol), face aux gens du quartier ; ni Anna ni Mark à l'A1. Les conversations « dans la peau de Mark » s'ouvriront avec les épisodes.</p>
      <p><b>Les visages</b> changent selon le moment et s'animent pendant que la personne parle. Ceux du policier sont à faire (un seul visage pour l'instant).</p>
      <p><b>Où elles s'insèrent</b> : dans la séance du jour, après la scène de l'étape, le jour où l'étape se termine ; un bouton à la fin de la scène ; Tout le contenu, rubrique PARLER.</p>`;
    c.appendChild(det);
  }
  ecran.appendChild(c);
}

document.getElementById("retour").onclick = () => {
  taire(); if (ecouteEnCours) ecouteEnCours.arreter();
  if (DANS_APP) parler("fermer"); else if (Q.get("c")) location.href = "?apprendre=" + LANGUE + (GB ? "&variante=gb" : ""); else history.back();
};
if (DANS_APP) document.getElementById("marque").hidden = true;
(async () => {
  try{
    PERS = await charger("conversation/personnes.json");
    if (Q.get("c")){ C = await charger("conversation/donnees/" + Q.get("c") + "." + LANGUE + ".json"); presentation(); }
