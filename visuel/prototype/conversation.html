<!doctype html>

<title>Au café avec Anna et Mark</title>
<!--
  MAQUETTE : JOUER UNE CONVERSATION AVEC ANNA ET MARK (proposition 9 de la revue d'usage du 11 nov. 2026, « lance les
  10 » de Jacques). On ne repete plus une phrase ecrite : on REPOND, au micro ou en touchant une reponse, et la
  conversation suit le choix. Pas d'intelligence artificielle : des embranchements ecrits a l'avance.

  Au cafe, A1-A2 : Anna et Mark (amis, « du ») retrouvent l'eleve ; la serveuse dit « Sie ». Sept moments : saluer,
  la boisson (trois, chacune sa question), manger, le cinema samedi (accepter, deplacer, demander), payer (separement
  ou ensemble), le pourboire, au revoir. 2 x 6 x 2 x 2 x 2 x 2 x 2 = 384 conversations differentes. Les prix et la
  monnaie suivent ce qu'on a commande ; le jour du rendez-vous et l'invitation reviennent dans les adieux.

  UNE ERREUR NE FAIT PAS PERDRE : la personne en face reagit en allemand, comme dans la vie (« Wie bitte? »), une
  explication courte dit pourquoi, la reponse fautive se barre, on reessaie. Elles sont reprises a la fin.

  LE MICRO : la reconnaissance du navigateur (ou celle de l'app, par le meme pont que l'oral du telc), puis la reponse
  la plus proche de ce qui a ete dit, mot a mot ; trop loin de toutes, « Wie bitte? ». Mode « sans filet » : les
  reponses ecrites sont cachees jusqu'a « Je ne sais pas quoi dire ».

  VOIX : celle du telephone (consigne du chef, aucune depense). Fiches respectees : Anna est allemande et sans
  compagnon, Mark vient de Montreal ; ils sont amis. Images reprises : les portraits de descripcion/, la serveuse
  recadree depuis manger/cafe-camarera.webp (conversation/kellnerin.webp).

  Parametres : nuit=1 (mode nuit ; sans parametre, suit le telephone hors de l'app), sansfilet=1.
-->
<style>
:root{--fond1:#F3E7D6;--fond3:#E7D3B9;--encre:#1C2430;--gris:#5A5348;--ambre:#E8A23A;--ambre-f:#8A5A10;--vert:#2F7D57;--vert-pale:#DDF0E5;
  --rouge:#B23F33;--rouge-pale:#F7E0DC;--turq:#14807A;--verre:rgba(255,255,255,.92);--bord:rgba(28,36,48,.10);--carte:#FFFFFF;
  --toi:#FBEBD0;--police:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html.nuit{--fond1:#15191F;--fond3:#22201C;--encre:#EEF2F5;--gris:#B9B0A2;--ambre-f:#F0B456;--vert:#7FD1A4;--vert-pale:#17352A;
  --rouge:#F0A08C;--rouge-pale:#3D221B;--turq:#4FC7BD;--verre:rgba(30,34,40,.92);--bord:rgba(255,255,255,.12);--carte:#252A31;--toi:#3A2E1A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,var(--fond1),var(--fond3));background-attachment:fixed;color:var(--encre);font-family:var(--police);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(14px,env(safe-area-inset-left,0px))}
button{font-family:inherit;color:inherit}
.haut{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto 10px}
.retour{width:42px;height:42px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);font:800 22px var(--police);cursor:pointer;flex:0 0 auto}
.titre{flex:1;font-weight:900;font-size:18px;line-height:1.2}
.titre small{display:block;font-size:12px;font-weight:800;color:var(--gris);letter-spacing:.06em;text-transform:uppercase}
.maquette{font:800 11px var(--police);letter-spacing:.06em;text-transform:uppercase;color:var(--ambre-f);border:1px solid var(--ambre);border-radius:999px;padding:4px 9px;flex:0 0 auto}
main{max-width:560px;margin:0 auto}
.table{display:flex;justify-content:center;gap:18px;margin:4px 0 14px}
.table figure{margin:0;text-align:center;font-weight:800;font-size:12px;color:var(--gris)}
.table img{display:block;width:58px;height:58px;border-radius:50%;object-fit:cover;border:3px solid transparent;transition:border-color .2s,transform .2s}

.table figure.parle{color:var(--encre)}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:18px;padding:18px}

.debut p{margin:0 0 10px;line-height:1.5}
.puces{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}

.gros{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:900 17px var(--police);cursor:pointer;margin-top:10px;background:var(--vert);color:#fff}
.gros.second{background:transparent;color:var(--encre);border:2px solid var(--bord)}
html.nuit .gros{color:#10261B}
html.nuit .gros.second{color:var(--encre)}
details{margin-top:16px;border-top:1px solid var(--bord);padding-top:12px}
summary{font-weight:900;cursor:pointer}
details p,details li{line-height:1.5;font-size:15px}
details ul{padding-left:20px;margin:8px 0}
.fil{display:flex;flex-direction:column;gap:12px;padding-bottom:12px}

.outils{display:flex;gap:14px;margin-top:4px}

.ligne.toi .bulle{background:var(--toi);border-radius:18px 18px 6px 18px}
.ligne.toi .bulle.faux{background:var(--rouge-pale)}
.ligne.toi .bulle.faux .de{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--rouge)}
.recit{text-align:center;font-size:13px;font-weight:800;color:var(--gris);font-style:italic}
.aide{background:var(--rouge-pale);border-radius:14px;padding:11px 13px;line-height:1.45;font-size:15px}
.aide b{color:var(--rouge)}
.aide.douce{background:var(--toi)}
.aide.douce b{color:var(--ambre-f)}
.repondre{position:sticky;bottom:0;padding:10px 8px 6px;margin:0 -8px;border-radius:18px 18px 0 0;
  background:color-mix(in srgb,var(--fond3) 72%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.repondre[hidden]{display:none}
.consigne{font:800 13px var(--police);color:var(--gris);margin:0 0 8px;text-align:center}
.choix{display:flex;flex-direction:column;gap:8px}
.choix button{text-align:left;border:2px solid var(--bord);background:var(--carte);border-radius:14px;padding:11px 14px;cursor:pointer;min-height:52px}
.choix button b{display:block;font-size:17px;line-height:1.3}
.choix button span{display:block;font-size:13px;color:var(--gris);margin-top:2px}
.choix button:disabled{opacity:.45;cursor:default}
.choix button:disabled b{text-decoration:line-through}
.choix button.pressenti{border-color:var(--ambre)}
.choix.cache{display:none}
.micro{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
.mic{width:64px;height:64px;border-radius:50%;border:0;background:var(--ambre);color:#1C2430;cursor:pointer;display:grid;place-items:center}
.mic svg{width:28px;height:28px}
.mic.ecoute{animation:pouls 1.1s ease-in-out infinite;background:var(--rouge);color:#fff}
@keyframes pouls{50%{transform:scale(1.08)}}
.entendu{font-size:14px;color:var(--gris);text-align:center;min-height:20px;margin-top:6px}
.lien{border:0;background:none;color:var(--turq);font:800 14px var(--police);cursor:pointer;padding:4px}
.fin h2{margin:0 0 6px;font-size:24px}
.fin h3{margin:16px 0 6px;font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--gris)}
.fin ul{margin:0;padding-left:20px}
.fin li{margin:5px 0;line-height:1.45}
.phrase{display:flex;align-items:center;gap:8px;margin:6px 0}

.phrase button{border:0;background:none;color:var(--turq);cursor:pointer;padding:6px}
@media (prefers-reduced-motion:reduce){.mic.ecoute{animation:none}.table img{transition:none}}

<body>
<div class="haut">
  <button class="retour" id="retour" type="button" aria-label="Retour">‹</button>
  <div class="titre"><small>Conversation · A1-A2</small>Au café avec Anna et Mark</div>
  <span class="maquette" id="marque">Maquette</span>
</div>
<main>
  <div class="table" id="table">
    <figure data-qui="anna"><img src="descripcion/Anna-visage.webp" alt="">Anna</figure>
    <figure data-qui="mark"><img src="descripcion/Mark-visage.webp" alt="">Mark</figure>
    <figure data-qui="kellnerin"><img src="conversation/kellnerin.webp" alt="">la serveuse</figure>
  </div>
  <div id="ecran"></div>
</main>
<script>
"use strict";
const Q = new URLSearchParams(location.search);
const DANS_APP = window.parent && window.parent !== window;
if (Q.get("nuit") === "1" || (!Q.has("nuit") && !DANS_APP && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches))
  document.documentElement.classList.add("nuit");
function parler(type, extra){ try{ if (DANS_APP) parent.postMessage(Object.assign({source: "wortando-scene", type}, extra || {}), "*"); }catch(e){} }

const PORTRAIT = { anna: "descripcion/Anna-visage.webp", mark: "descripcion/Mark-visage.webp", kellnerin: "conversation/kellnerin.webp" };
const NOM = { anna: "Anna", mark: "Mark", kellnerin: "La serveuse", toi: "Toi" };

// ---------------------------------------------------------------- les nombres et les prix
// Les nombres se disent en lettres (regle de l'app) : l'ecran garde « 6,30 Euro », la voix recoit « sechs Euro dreissig ».
const UNITES = ["null","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn","elf","zwölf","dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn"];
const DIZAINES = ["","","zwanzig","dreißig","vierzig","fünfzig","sechzig","siebzig","achtzig","neunzig"];
function nombre(n){
  if (n < 20) return UNITES[n];
  const d = Math.floor(n / 10), u = n % 10;
  return u ? (u === 1 ? "ein" : UNITES[u]) + "und" + DIZAINES[d] : DIZAINES[d];
}
const majuscule = s => s.charAt(0).toUpperCase() + s.slice(1);
const enMots = cents => { const e = Math.floor(cents / 100), c = cents % 100; return (e === 1 ? "ein" : nombre(e)) + " Euro" + (c ? " " + nombre(c) : ""); };
const enChiffres = cents => Math.floor(cents / 100) + "," + String(cents % 100).padStart(2, "0") + " Euro";
const PRIX = { kaffee: 280, tee: 260, wasser: 220, kuchen: 350, amis: 600 };   // Anna : un cappuccino 3,20 ; Mark : un cafe 2,80

// ---------------------------------------------------------------- l'etat d'une partie
let S;
function partieNeuve(){ S = { boisson: null, kuchen: false, jour: "Samstag", ensemble: false, muede: false, erreurs: [], dit: [], aPaye: 0 }; }
const maPart = () => PRIX[S.boisson || "kaffee"] + (S.kuchen ? PRIX.kuchen : 0);
const aPayer = () => maPart() + (S.ensemble ? PRIX.amis : 0);
const arrondi = () => Math.ceil(aPayer() * 1.05 / 100);
const jourFr = () => S.jour === "Samstag" ? "samedi" : "dimanche";
const BOISSON_FR = { kaffee: "ton café", tee: "ton thé", wasser: "ton eau" };

// ---------------------------------------------------------------- la conversation
// Une replique : [qui, allemand, francais, lecture (ce que dit la voix, si elle differe)] ; ou ["recit", francais].
// Un choix : { de, fr, faire(), puis: [repliques], va } ; un choix fautif : { faux: true, de, fr, puis, aide }.
const N = {
  accueil: {
    dit: () => [["anna", "Hallo! Schön, dass du da bist. Setz dich doch!", "Salut ! Contente que tu sois là. Assieds-toi !"],
                ["mark", "Hi! Wie geht's dir?", "Salut ! Comment ça va ?"]],
    choix: [
      { de: "Gut, danke. Und dir?", fr: "Bien, merci. Et toi ?", puis: () => [["mark", "Mir geht's super, danke! Ich habe heute frei.", "Super bien, merci ! Je suis en congé aujourd'hui."]], va: "commande" },
      { de: "Es geht. Ich bin ein bisschen müde.", fr: "Ça va à peu près. Je suis un peu fatigué(e).", faire: () => { S.muede = true; },
        puis: () => [["anna", "Oh je! Dann brauchst du einen Kaffee.", "Oh là là ! Alors il te faut un café."]], va: "commande" },
      { faux: true, de: "Ich heiße gut, danke.", fr: "Je m'appelle bien, merci.",
        puis: () => [["mark", "Du heißt Gut? Haha, nein, nein …", "Tu t'appelles « Bien » ? Haha, non, non…"]],
        aide: "<b>« Ich heiße … »</b> veut dire « je m'appelle … ». Pour dire comment tu vas : « Gut, danke » ou « Es geht »." }
    ]
  },
  commande: {
    dit: () => [["recit", "La serveuse arrive à votre table."],
                ["kellnerin", "Guten Tag! Was möchten Sie trinken?", "Bonjour ! Qu'est-ce que vous voulez boire ?"]],
    choix: [
      { de: "Einen Kaffee, bitte.", fr: "Un café, s'il vous plaît.", faire: () => { S.boisson = "kaffee"; }, va: "lait" },
      { de: "Ich hätte gern einen Tee.", fr: "Je voudrais un thé.", faire: () => { S.boisson = "tee"; }, va: "the" },
      { de: "Ein Wasser, bitte.", fr: "Une eau, s'il vous plaît.", faire: () => { S.boisson = "wasser"; }, va: "wasser" },
      { faux: true, de: "Hallo! Gib mir einen Kaffee.", fr: "Salut ! Donne-moi un café.",
        puis: () => [["kellnerin", "Äh … wie bitte?", "Euh… pardon ?"]],
        aide: "<b>À la serveuse, on dit « Sie » et « bitte ».</b> « Gib mir » est un ordre qu'on donne à un ami. Dis plutôt : « Einen Kaffee, bitte » ou « Ich hätte gern einen Kaffee »." }
    ]
  },
  lait: {
    dit: () => [["kellnerin", "Mit Milch und Zucker?", "Avec du lait et du sucre ?"]],
    choix: [
      { de: "Mit Milch, bitte, aber ohne Zucker.", fr: "Avec du lait, s'il vous plaît, mais sans sucre.", va: "manger" },
      { de: "Nein, danke. Schwarz, bitte.", fr: "Non, merci. Noir, s'il vous plaît.", va: "manger" }
    ]
  },
  the: {
    dit: () => [["kellnerin", "Schwarztee oder Pfefferminztee?", "Du thé noir ou du thé à la menthe ?"]],
    choix: [
      { de: "Pfefferminztee, bitte.", fr: "Du thé à la menthe, s'il vous plaît.", va: "manger" },
      { de: "Schwarztee, bitte.", fr: "Du thé noir, s'il vous plaît.", va: "manger" }
    ]
  },
  wasser: {
    dit: () => [["kellnerin", "Mit oder ohne Kohlensäure?", "Gazeuse ou plate ?"]],
    choix: [
      { de: "Mit Kohlensäure, bitte.", fr: "Gazeuse, s'il vous plaît.", va: "manger" },
      { de: "Ohne Kohlensäure, bitte.", fr: "Plate, s'il vous plaît.", va: "manger" }
    ]
  },
  manger: {
    dit: () => [["kellnerin", "Möchten Sie auch etwas essen? Heute haben wir Apfelkuchen.", "Vous voulez aussi manger quelque chose ? Aujourd'hui, nous avons du gâteau aux pommes."]],
    choix: [
      { de: "Ja, gern. Ein Stück Apfelkuchen, bitte.", fr: "Oui, volontiers. Une part de gâteau aux pommes, s'il vous plaît.", faire: () => { S.kuchen = true; },
        puis: () => [["kellnerin", "Sehr gern. Kommt sofort!", "Avec plaisir. Ça arrive tout de suite !"]], va: "kino" },
      { de: "Nein, danke. Das ist alles.", fr: "Non, merci. Ce sera tout.",
        puis: () => [["kellnerin", "Gut. Kommt sofort!", "Bien. Ça arrive tout de suite !"]], va: "kino" },
      { de: "Was kostet der Kuchen?", fr: "Combien coûte le gâteau ?",
        puis: () => [["kellnerin", "Ein Stück kostet " + enChiffres(PRIX.kuchen) + ".", "Une part coûte 3,50 euros.", "Ein Stück kostet " + enMots(PRIX.kuchen) + "."]], va: "manger2" },
      { faux: true, de: "Ja, ich habe Apfelkuchen.", fr: "Oui, j'ai du gâteau aux pommes.",
        puis: () => [["kellnerin", "Sie haben schon Kuchen?", "Vous avez déjà du gâteau ?"]],
        aide: "<b>« Ich habe »</b> veut dire « j'ai ». Pour commander : « Ein Stück Apfelkuchen, bitte » ou « Ich nehme ein Stück Apfelkuchen »." }
    ]
  },
  manger2: {
    dit: () => [],
    choix: () => N.manger.choix.slice(0, 2)
  },
  kino: {
    dit: () => [["recit", "La serveuse apporte " + BOISSON_FR[S.boisson] + (S.kuchen ? " et ton gâteau." : ".")],
                ["mark", "Sag mal, hast du am Samstag Zeit? Anna und ich gehen ins Kino.", "Dis donc, tu as le temps samedi ? Anna et moi, on va au cinéma."]],
    choix: [
      { de: "Ja, gern! Um wie viel Uhr?", fr: "Oui, avec plaisir ! À quelle heure ?",
        puis: () => [["anna", "Um acht. Wir treffen uns vor dem Kino.", "À huit heures. On se retrouve devant le cinéma."]], va: "payer" },
      { de: "Am Samstag kann ich leider nicht. Geht auch Sonntag?", fr: "Samedi, je ne peux malheureusement pas. Dimanche, ça va aussi ?", faire: () => { S.jour = "Sonntag"; },
        puis: () => [["anna", "Sonntag? Klar, das geht auch. Dann um sieben.", "Dimanche ? Bien sûr, ça va aussi. Alors à sept heures."]], va: "payer" },
      { de: "Was für ein Film ist das?", fr: "C'est quel genre de film ?",
        puis: () => [["anna", "Eine Komödie aus Frankreich. Mit Untertiteln!", "Une comédie française. Avec des sous-titres !"]], va: "kino2" },
      { faux: true, de: "Ja, ich gehe gestern ins Kino.", fr: "Oui, je vais hier au cinéma.",
        puis: () => [["mark", "Gestern? Nein, wir gehen am Samstag!", "Hier ? Non, on y va samedi !"]],
        aide: "<b>« gestern »</b>, c'est hier. Pour accepter : « Ja, gern! » ; pour refuser : « Am Samstag kann ich leider nicht »." }
    ]
  },
  kino2: {
    dit: () => [],
    choix: () => N.kino.choix.slice(0, 2)
  },
  payer: {
    dit: () => [["recit", "Une heure plus tard."],
                ["kellnerin", "Möchten Sie zahlen?", "Vous voulez payer ?"]],
    choix: [
      { de: "Ja, getrennt, bitte.", fr: "Oui, séparément, s'il vous plaît.",
        puis: () => [["kellnerin", "Gern. Bei Ihnen macht das " + enChiffres(aPayer()) + ".", "Volontiers. Pour vous, ça fait " + enChiffres(aPayer()).replace("Euro", "euros") + ".",
                      "Gern. Bei Ihnen macht das " + enMots(aPayer()) + "."]], va: "pourboire" },
      { de: "Ja, zusammen, bitte. Ich lade euch ein!", fr: "Oui, ensemble, s'il vous plaît. Je vous invite !", faire: () => { S.ensemble = true; },
        puis: () => [["mark", "Echt? Danke, das ist nett!", "C'est vrai ? Merci, c'est sympa !"],
                     ["kellnerin", "Zusammen macht das " + enChiffres(aPayer()) + ".", "Ensemble, ça fait " + enChiffres(aPayer()).replace("Euro", "euros") + ".",
                      "Zusammen macht das " + enMots(aPayer()) + "."]], va: "pourboire" },
      { faux: true, de: "Ja, die Speisekarte, bitte.", fr: "Oui, la carte, s'il vous plaît.",
        puis: () => [["kellnerin", "Die Speisekarte? Möchten Sie noch etwas bestellen?", "La carte ? Vous voulez encore commander quelque chose ?"]],
        aide: "<b>« die Speisekarte »</b>, c'est le menu. Pour payer : « getrennt » (chacun paie sa part) ou « zusammen » (une seule addition)." }
    ]
  },
  pourboire: {
    dit: () => [],
    choix: () => [
      { de: majuscule(nombre(arrondi())) + " Euro. Stimmt so!", fr: arrondi() + " euros. Gardez la monnaie !",
        puis: () => [["kellnerin", "Oh, vielen Dank! Einen schönen Tag noch!", "Oh, merci beaucoup ! Bonne fin de journée !"]], va: "adieux" },
      { de: "Hier, bitte. Mit Karte.", fr: "Voilà. Par carte.",
        puis: () => [["kellnerin", "Danke schön! Einen schönen Tag noch!", "Merci ! Bonne fin de journée !"]], va: "adieux" }
    ]
  },
  adieux: {
    dit: () => [["anna", (S.ensemble ? "Danke für die Einladung! " : "So, ich muss los. ") + "Tschüss, bis " + S.jour + "!",
                 (S.ensemble ? "Merci pour l'invitation ! " : "Bon, je dois y aller. ") + "Salut, à " + jourFr() + " !"],
                ["mark", S.muede ? "Und schlaf heute gut!" : "Ciao, bis bald!", S.muede ? "Et dors bien ce soir !" : "Ciao, à bientôt !"]],
    choix: () => [
      { de: "Tschüss, bis " + S.jour + "!", fr: "Salut, à " + jourFr() + " !", va: null },
      { de: "Tschüss! Das war schön.", fr: "Salut ! C'était sympa.", va: null }
    ]
  }
};
const choixDe = id => typeof N[id].choix === "function" ? N[id].choix() : N[id].choix;

// ---------------------------------------------------------------- la voix du telephone
const VOIX_A_FUIR = ["albert","bad news","bahh","bells","boing","bubbles","cellos","good news","jester","organ","superstar","trinoids","whisper","wobble","zarvox","deranged","hysterical","junior","ralph","kathy","fred","princess","bruce","agnes","vicki","eddy","flo","grandma","grandpa","reed","rocko","sandy","shelley"];
let voixDe = {};
function choisirVoix(){
  const toutes = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  const de = toutes.filter(v => /^de/i.test(v.lang) && !VOIX_A_FUIR.some(f => (v.name || "").toLowerCase().includes(f)));
  const trouve = (re, sauf) => de.find(v => re.test(v.name) && !(sauf || []).includes(v));
  const femme = /anna|petra|helena|katja|marlene|google deutsch|hedda|female|frau|vicki|sandy/i;
  voixDe.anna = trouve(femme) || de[0] || null;
  voixDe.mark = trouve(/markus|yannick|martin|conrad|stefan|hans|killian|male|mann/i) || de.find(v => v !== voixDe.anna) || de[0] || null;
  voixDe.kellnerin = trouve(femme, [voixDe.anna]) || voixDe.anna;
  voixDe.toi = voixDe.mark;
}
try{ choisirVoix(); if (window.speechSynthesis) speechSynthesis.onvoiceschanged = choisirVoix; }catch(e){}
const HAUTEUR = { anna: 1.05, mark: 0.9, kellnerin: 1.2, toi: 1 };
function taire(){ try{ if (window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }
function dire(texte, qui){
  return new Promise(fini => {
    taire();
    if (!window.speechSynthesis){ setTimeout(fini, 400 + texte.length * 45); return; }
    const u = new SpeechSynthesisUtterance(texte);
    u.lang = "de-DE"; u.rate = 0.92;
    const v = voixDe[qui]; if (v) u.voice = v;
    // Deux personnes sur la meme voix : la hauteur les distingue.
    if (v && Object.keys(voixDe).some(k => k !== qui && voixDe[k] === v)) u.pitch = HAUTEUR[qui] || 1;
    let rendu = false; const fin = () => { if (!rendu){ rendu = true; fini(); } };
    u.onend = u.onerror = fin;
    speechSynthesis.speak(u);
    setTimeout(fin, 900 + texte.length * 110);   // filet : certains moteurs n'appellent jamais onend
  });
}

// ---------------------------------------------------------------- le micro (meme pont que l'oral du telc)
const Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
let ecouteApp = null;
window.addEventListener("message", e => {
  const d = e.data;
  if (!d || d.source !== "wortando-app" || d.type !== "micro" || !ecouteApp) return;
  if (d.etat === "texte") ecouteApp.surTexte(d.texte || "");
  else if (d.etat === "fin") { const f = ecouteApp; ecouteApp = null; f.surFin(d.texte || ""); }
  else if (d.etat === "indisponible") { const f = ecouteApp; ecouteApp = null; f.surFin(null); }
});
const MICRO_POSSIBLE = !!Reco || DANS_APP;
function ecouter(surTexte, surFin){
  if (Reco){
    let finals = "", provisoire = "", fini = false, reco;
    const total = () => (finals + " " + provisoire).replace(/\s+/g, " ").trim();
    const terminer = () => { if (fini) return; fini = true; surFin(total()); };
    try{
      reco = new Reco();
      reco.lang = "de-DE"; reco.continuous = false; reco.interimResults = true;
      reco.onresult = ev => {
        provisoire = "";
        for (let i = ev.resultIndex; i < ev.results.length; i++){
          const r = ev.results[i];
          if (r.isFinal) finals += " " + r[0].transcript; else provisoire += " " + r[0].transcript;
        }
        surTexte(total());
      };
      reco.onerror = ev => { if (ev && (ev.error === "not-allowed" || ev.error === "service-not-allowed") && !fini){ fini = true; surFin(null); } };
      reco.onend = () => setTimeout(terminer, 100);
      reco.start();
    }catch(e){ setTimeout(() => surFin(null), 0); return { arreter(){} }; }
    return { arreter(){ try{ reco.stop(); }catch(e){} setTimeout(terminer, 1500); } };
  }
  if (DANS_APP){
    ecouteApp = { surTexte, surFin };
    parler("micro", { action: "start", langue: "de-DE" });
    return { arreter(){ parler("micro", { action: "stop" }); } };
  }
  setTimeout(() => surFin(null), 0);
  return { arreter(){} };
}
// La reponse la plus proche de ce qui a ete dit : les mots en commun (coefficient de Dice), sans majuscules, accents
// allemands ni ponctuation. Un mot reconnu a une lettre pres compte a moitie (« Pfefferminz-Tee », « Kohlensaeure »).
const plier = s => s.toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
  .replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
const mots = s => plier(s).split(" ").filter(Boolean);
function proche(a, b){
  if (a === b) return 1;
  if (Math.abs(a.length - b.length) > 1 || a.length < 4) return 0;
  let i = 0; while (i < a.length && a[i] === b[i]) i++;
  return (a.slice(i + 1) === b.slice(i + 1) || a.slice(i) === b.slice(i + 1) || a.slice(i + 1) === b.slice(i)) ? 0.5 : 0;
}
function ressemblance(dit, cible){
  const a = mots(dit), b = mots(cible);
  if (!a.length || !b.length) return 0;
  const reste = b.slice(); let commun = 0;
  a.forEach(m => {
    let k = reste.indexOf(m), p = 1;
    if (k < 0){ p = 0; reste.forEach((x, j) => { const q = proche(m, x); if (q > p){ p = q; k = j; } }); }
    if (k >= 0 && p > 0){ commun += p; reste.splice(k, 1); }
  });
  const parMots = 2 * commun / (a.length + b.length);
  // Les mots composes que la reconnaissance coupe (« Pfefferminz Tee ») : les paires de lettres, sans les espaces.
  const paires = s => { const c = plier(s).replace(/ /g, ""), r = []; for (let i = 0; i < c.length - 1; i++) r.push(c.slice(i, i + 2)); return r; };
  const pa = paires(dit), pb = paires(cible).slice();
  let n = 0; pa.forEach(p => { const k = pb.indexOf(p); if (k >= 0){ n++; pb.splice(k, 1); } });
  const parLettres = pa.length + paires(cible).length ? 2 * n / (pa.length + paires(cible).length) : 0;
  return Math.max(parMots, parLettres * 0.95);
}
const SEUIL = 0.5;

// ---------------------------------------------------------------- l'ecran
const ecran = document.getElementById("ecran");
function el(tag, cls, texte){ const e = document.createElement(tag); if (cls) e.className = cls; if (texte != null) e.textContent = texte; return e; }
const HP_SVG = '<svg class="ic-hp" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM18.584 5.106a.75.75 0 0 1 1.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 0 1-1.06-1.06 8.25 8.25 0 0 0 0-11.668.75.75 0 0 1 0-1.06Z"/><path d="M15.932 7.757a.75.75 0 0 1 1.061 0 6 6 0 0 1 0 8.486.75.75 0 0 1-1.06-1.061 4.5 4.5 0 0 0 0-6.364.75.75 0 0 1 0-1.06Z"/></svg>';
const MIC_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.25 4.5a3.75 3.75 0 1 1 7.5 0v8.25a3.75 3.75 0 1 1-7.5 0V4.5Z"/><path d="M6 10.5a.75.75 0 0 1 .75.75v1.5a5.25 5.25 0 1 0 10.5 0v-1.5a.75.75 0 0 1 1.5 0v1.5a6.751 6.751 0 0 1-6 6.709v2.291h3a.75.75 0 0 1 0 1.5h-7.5a.75.75 0 0 1 0-1.5h3v-2.291a6.751 6.751 0 0 1-6-6.709v-1.5A.75.75 0 0 1 6 10.5Z"/></svg>';
function boutonHP(texte, qui, libelle){
  const b = el("button"); b.type = "button"; b.innerHTML = HP_SVG; b.appendChild(document.createTextNode(libelle == null ? " Réécouter" : libelle));
  if (!libelle) b.setAttribute("aria-label", "Réécouter");
  b.onclick = () => dire(texte, qui);
  return b;
}
function quiParle(qui){ document.querySelectorAll("#table figure").forEach(f => f.classList.toggle("parle", f.dataset.qui === qui)); }

let dernier = "mark", fil, repondre, sansFilet = Q.get("sansfilet") === "1";
const attendre = ms => new Promise(r => setTimeout(r, ms));
async function replique(r){
  if (r[0] === "recit"){ fil.appendChild(el("div", "recit", r[1])); defiler(); await attendre(500); return; }
  const [qui, de, fr, lecture] = r;
  const ligne = el("div", "ligne");
  const img = el("img"); img.src = PORTRAIT[qui]; img.alt = ""; ligne.appendChild(img);
  const b = el("div", "bulle");
  b.appendChild(el("div", "nom", NOM[qui]));
  const d = el("div", "de", de); d.lang = "de"; b.appendChild(d);
  const f = el("div", "fr", fr); f.hidden = true; b.appendChild(f);
  const outils = el("div", "outils");
  outils.appendChild(boutonHP(lecture || de, qui));
  const tr = el("button", null, "Traduire"); tr.type = "button"; tr.onclick = () => { f.hidden = !f.hidden; }; outils.appendChild(tr);
  b.appendChild(outils); ligne.appendChild(b); fil.appendChild(ligne); defiler();
  quiParle(qui); dernier = qui;
  await dire(lecture || de, qui);
  quiParle(null);
  await attendre(250);
}
function maReplique(c, faux){
  const ligne = el("div", "ligne toi");
  const b = el("div", "bulle" + (faux ? " faux" : ""));
  b.appendChild(el("div", "nom", NOM.toi));
  const d = el("div", "de", c.de); d.lang = "de"; b.appendChild(d);
  b.appendChild(el("div", "fr", c.fr));
  ligne.appendChild(b); fil.appendChild(ligne); defiler();
}
function defiler(){ requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" })); }

// ---------------------------------------------------------------- jouer
let noeud = null, essaye = new Set(), ecouteEnCours = null;
function debut(){
  taire(); quiParle(null);
  ecran.textContent = "";
  const c = el("div", "carte debut");
  c.innerHTML = `
    <h1>Au café avec Anna et Mark</h1>
    <p>Anna et Mark t'attendent au café. Tu commandes, tu parles avec eux, et tu décides de ce que tu fais samedi. <b>C'est toi qui réponds</b> : touche une réponse, ou dis-la au micro. La conversation suit ce que tu choisis.</p>
    <div class="puces"><span>A1-A2</span><span>5 minutes</span><span>du et Sie</span><span>384 conversations possibles</span></div>`;
  const go = el("button", "gros", "Commencer"); go.type = "button"; go.onclick = () => commencer(false);
  const nu = el("button", "gros second", "Sans filet : tout au micro"); nu.type = "button"; nu.onclick = () => commencer(true);
  c.append(go, nu);
  if (!MICRO_POSSIBLE) c.appendChild(el("p", "entendu", "Ce navigateur n'a pas de reconnaissance de la voix : touche les réponses."));
  if (!DANS_APP){
    const det = el("details");
    det.innerHTML = `<summary>La maquette, pour Jacques</summary>
      <p><b>Ce qu'elle montre.</b> Une conversation entière, de bout en bout, avec ses embranchements : trois boissons qui ont chacune leur question, le gâteau dont on peut demander le prix, le cinéma qu'on accepte, déplace à dimanche ou dont on demande le film, l'addition séparée ou l'invitation, le pourboire. Les prix et la monnaie suivent ce qu'on a commandé ; le jour du rendez-vous et l'invitation reviennent dans les adieux.</p>
      <p><b>Si on se trompe.</b> Cinq réponses sont fausses, et elles le sont comme le sont les vraies fautes : « Ich heiße gut », « Gib mir einen Kaffee » à la serveuse, « Ich habe Apfelkuchen », « gestern » pour samedi, « die Speisekarte » pour l'addition. La personne en face réagit en allemand (« Wie bitte? »), une ligne explique, la réponse se barre, on réessaie. Rien n'est perdu ; les erreurs reviennent dans le bilan.</p>
      <p><b>Le micro.</b> On dit sa réponse ; l'app prend la réponse écrite la plus proche, mot à mot. Trop loin de toutes : « Wie bitte? ». « Sans filet » cache les réponses écrites jusqu'à « Je ne sais pas quoi dire ».</p>
      <p><b>Où elle s'insère</b> (à décider) :</p>
      <ul>
        <li><b>La séance du jour</b> : la dernière carte d'une étape dont c'est le sujet (l'étape « commander » de l'A1 finit au café), à la place de la scène ce jour-là, comme le thème un jour sur trois.</li>
        <li><b>Les scènes</b> : sur la scène du café, un bouton « Jouer la conversation » ; on a vu le lieu, on y entre.</li>
        <li><b>Tout le contenu</b>, rubrique PARLER : « Conversations avec Anna et Mark », par lieu et par niveau (le café, le Bürgeramt, le médecin, l'hôtel…).</li>
      </ul>
      <p><b>Voix.</b> Celle du téléphone dans la maquette. Plus tard, les voix de la série pour Anna et Mark, une autre pour la serveuse, avec ton accord. Une conversation compterait dans la séance, et chaque bonne réponse ferait avancer ses mots comme dans les scènes.</p>
      <p><b>En espagnol</b>, la même mécanique : un autre texte, écrit pour l'espagnol (tú et usted), à Madrid.</p>`;
    c.appendChild(det);
  }
  ecran.appendChild(c);
}
async function commencer(nu){
  sansFilet = nu; partieNeuve();
  ecran.textContent = "";
  fil = el("div", "fil"); ecran.appendChild(fil);
  repondre = el("div", "repondre"); repondre.hidden = true; ecran.appendChild(repondre);
  await jouer("accueil");
}
async function jouer(id){
  noeud = id; essaye = new Set();
  for (const r of N[id].dit()) await replique(r);
  montrerChoix(false);
}
function montrerChoix(apresErreur){
  repondre.textContent = ""; repondre.hidden = false;
  const liste = choixDe(noeud);
  repondre.appendChild(el("p", "consigne", sansFilet ? "À toi : réponds au micro." : (MICRO_POSSIBLE ? "À toi : touche ta réponse, ou dis-la au micro." : "À toi : touche ta réponse.")));
  const ch = el("div", "choix" + (sansFilet && !apresErreur ? " cache" : ""));
  liste.forEach((c, i) => {
    const b = el("button"); b.type = "button";
    b.appendChild(el("b", null, c.de)); b.lastChild.lang = "de";
    b.appendChild(el("span", null, c.fr));
    b.disabled = essaye.has(i);
    b.onclick = () => choisir(i);
    ch.appendChild(b);
  });
  repondre.appendChild(ch);
  const m = el("div", "micro");
  if (MICRO_POSSIBLE){
    const mic = el("button", "mic"); mic.type = "button"; mic.innerHTML = MIC_SVG; mic.setAttribute("aria-label", "Répondre au micro");
    mic.onclick = () => micro(mic);
    m.appendChild(mic);
  }
  if (sansFilet && ch.classList.contains("cache")){
    const sos = el("button", "lien", "Je ne sais pas quoi dire"); sos.type = "button";
    sos.onclick = () => { ch.classList.remove("cache"); sos.remove(); };
    m.appendChild(sos);
  }
  repondre.appendChild(m);
  repondre.appendChild(el("div", "entendu"));
  defiler();
}
function micro(bouton){
  const entendu = repondre.querySelector(".entendu");
  if (ecouteEnCours){ ecouteEnCours.arreter(); return; }
  taire();
  bouton.classList.add("ecoute"); entendu.textContent = "Je t'écoute…";
  ecouteEnCours = ecouter(t => { entendu.textContent = "« " + t + " »"; }, async t => {
    ecouteEnCours = null; bouton.classList.remove("ecoute");
    if (t == null){ entendu.textContent = "Le micro n'est pas disponible : touche ta réponse."; repondre.querySelector(".choix").classList.remove("cache"); return; }
    if (!t){ entendu.textContent = "Je n'ai rien entendu. Réessaie, plus près du téléphone."; return; }
    const liste = choixDe(noeud);
    let meilleur = -1, score = 0;
    liste.forEach((c, i) => { if (essaye.has(i)) return; const s = ressemblance(t, c.de); if (s > score){ score = s; meilleur = i; } });
    if (meilleur < 0 || score < SEUIL){
      entendu.textContent = "Tu as dit : « " + t + " »";
      const qui = dernier;
      repondre.hidden = true;
      await replique([qui, "Wie bitte?", "Pardon ?"]);
      montrerChoix(true);
      const aide = el("div", "aide douce"); aide.innerHTML = "<b>Je n'ai pas reconnu une des réponses.</b> Redis-la, ou touche-la.";
      repondre.insertBefore(aide, repondre.firstChild);
      return;
    }
    choisir(meilleur, t);
  });
}
async function choisir(i, entenduTexte){
  if (ecouteEnCours){ ecouteEnCours.arreter(); ecouteEnCours = null; }
  const c = choixDe(noeud)[i];
  repondre.hidden = true;
  maReplique(c, c.faux);
  S.dit.push(c);
  if (c.faux){
    essaye.add(i);
    S.erreurs.push(c);
    parler("exercice");
    for (const r of c.puis()) await replique(r);
    montrerChoix(true);
    const aide = el("div", "aide"); aide.innerHTML = c.aide;
    repondre.insertBefore(aide, repondre.firstChild);
    defiler();
    return;
  }
  parler("bonne");
  if (c.faire) c.faire();
  if (c.puis) for (const r of c.puis()) await replique(r);
  if (c.va) await jouer(c.va); else fin();
}
function fin(){
  quiParle(null);
  parler("fini");
  const c = el("div", "carte fin");
  c.appendChild(el("h2", null, S.erreurs.length ? "Bien joué !" : "Parfait, sans une erreur !"));
  const b = { kaffee: "un café", tee: "un thé", wasser: "une eau" }[S.boisson];
  c.appendChild(el("p", null, "Tu as commandé " + b + (S.kuchen ? " et du gâteau aux pommes" : "") + ", "
    + (S.jour === "Samstag" ? "accepté le cinéma samedi" : "déplacé le cinéma à dimanche") + ", et "
    + (S.ensemble ? "invité Anna et Mark (" : "payé ta part (") + enChiffres(aPayer()).replace("Euro", "euros") + ")."));
  if (S.erreurs.length){
    c.appendChild(el("h3", null, "Tes erreurs, corrigées"));
    const ul = el("ul");
    S.erreurs.forEach(e => { const li = el("li"); li.innerHTML = "<s>" + e.de + "</s> : " + e.aide; ul.appendChild(li); });
    c.appendChild(ul);
  }
  c.appendChild(el("h3", null, "Les phrases que tu as dites"));
  S.dit.filter(x => !x.faux).forEach(x => {
    const p = el("div", "phrase");
    const t = el("b", null, x.de); t.lang = "de"; p.appendChild(t);
    p.appendChild(boutonHP(x.de, "toi", ""));
    c.appendChild(p);
  });
  const re = el("button", "gros", "Rejouer en répondant autrement"); re.type = "button"; re.onclick = () => commencer(sansFilet);
  const ter = el("button", "gros second", "Terminer"); ter.type = "button"; ter.onclick = () => { if (DANS_APP) parler("fermer"); else debut(); };
  c.append(re, ter);
  fil.appendChild(c); defiler();
}
document.getElementById("retour").onclick = () => { taire(); if (ecouteEnCours) ecouteEnCours.arreter(); if (DANS_APP) parler("fermer"); else debut(); };
if (DANS_APP) document.getElementById("marque").hidden = true;
debut();
</script>
