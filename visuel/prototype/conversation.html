<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Au café</title>
<!--
  MAQUETTE : JOUER UNE CONVERSATION (proposition 9 de la revue d'usage du 11 nov. 2026). On ne repete plus une phrase
  ecrite : on REPOND, au micro ou en touchant une reponse, et la conversation suit le choix. Des embranchements ecrits
  a l'avance, pas d'intelligence artificielle.

  VERSION A1, FAMILLE « TOI » (decisions de Jacques du 11 nov.) : l'apprenant joue son propre role, face a des
  personnes du quartier, au « Sie ». Ni Anna ni Mark : ils ne se connaissent pas encore a l'A1 (chronologie de la
  serie, video/EPISODES-SUIVANTS.md) ; les conversations « dans la peau de Mark » s'ouvriront avec les episodes.
  La serveuse, puis un voisin de table (« Ist hier noch frei? »), le quartier, le marche du samedi, l'addition.

  DES VISAGES EXPRESSIFS (option A, decision du 11 nov.) : le portrait de la personne qui parle, qui change selon le
  moment (sourire, question, surprise, « Wie bitte? ») et s'anime doucement pendant qu'elle parle (un zoom lent, une
  lumiere). Pas de bouche qui bouge, pas de video par replique. Images reprises : la serveuse recadree depuis
  manger/cafe-camarera.webp et cafe-pagar.webp (conversation/), le voisin depuis emociones/Tomas-*.webp. Les
  expressions qui manquent sont chiffrees a part, rien n'est genere sans l'accord de Jacques.

  UNE ERREUR NE FAIT PAS PERDRE : la personne en face reagit en allemand, une ligne explique, la reponse se barre, on
  reessaie ; les erreurs reviennent dans le bilan. LE MICRO : la reponse ecrite la plus proche de ce qui a ete dit ;
  trop loin de toutes, « Wie bitte? ». « Sans filet » cache les reponses jusqu'a « Je ne sais pas quoi dire ».
  VOIX : celle du telephone (aucune depense).

  Parametres : nuit=1 (sans parametre, suit le telephone hors de l'app), sansfilet=1.
-->
<style>
:root{--fond1:#F3E7D6;--fond3:#E7D3B9;--encre:#1C2430;--gris:#5A5348;--ambre:#E8A23A;--ambre-f:#8A5A10;--vert:#2F7D57;
  --rouge:#B23F33;--rouge-pale:#F7E0DC;--turq:#14807A;--verre:rgba(255,255,255,.92);--bord:rgba(28,36,48,.10);--carte:#FFFFFF;
  --toi:#FBEBD0;--police:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html.nuit{--fond1:#15191F;--fond3:#22201C;--encre:#EEF2F5;--gris:#B9B0A2;--ambre-f:#F0B456;--vert:#7FD1A4;
  --rouge:#F0A08C;--rouge-pale:#3D221B;--turq:#4FC7BD;--verre:rgba(30,34,40,.92);--bord:rgba(255,255,255,.12);--carte:#252A31;--toi:#3A2E1A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,var(--fond1),var(--fond3));background-attachment:fixed;color:var(--encre);font-family:var(--police);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(14px,env(safe-area-inset-left,0px))}
button{font-family:inherit;color:inherit}
.haut{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto 8px}
.retour{width:42px;height:42px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);font:800 22px var(--police);cursor:pointer;flex:0 0 auto}
.titre{flex:1;font-weight:900;font-size:18px;line-height:1.2}
.titre small{display:block;font-size:12px;font-weight:800;color:var(--gris);letter-spacing:.06em;text-transform:uppercase}
.maquette{font:800 11px var(--police);letter-spacing:.06em;text-transform:uppercase;color:var(--ambre-f);border:1px solid var(--ambre);border-radius:999px;padding:4px 9px;flex:0 0 auto}
main{max-width:560px;margin:0 auto}

/* LE PLATEAU : les personnes de la conversation, la personne qui parle en grand. */
.plateau{position:sticky;top:0;z-index:2;display:flex;justify-content:center;align-items:flex-end;gap:16px;padding:6px 0 12px;
  background:color-mix(in srgb,var(--fond1) 80%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);margin:0 -14px 6px;border-radius:0 0 22px 22px}
.perso{margin:0;text-align:center;font:800 12px var(--police);color:var(--gris);transition:opacity .35s,transform .35s;opacity:.55;transform:scale(.86)}
.perso[hidden]{display:none}
.perso.arrive{animation:arrive .5s ease-out}
@keyframes arrive{from{opacity:0;transform:translateY(10px) scale(.8)}}
.perso.parle,.perso.dernier{opacity:1;transform:scale(1)}
.perso.parle{color:var(--encre)}
.cadre{position:relative;width:108px;height:108px;border-radius:26px;overflow:hidden;margin:0 auto 5px;background:#ccc;
  box-shadow:0 6px 18px rgba(0,0,0,.14);transition:box-shadow .35s}
.cadre img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s ease}
.cadre img.sort{opacity:0}
/* Pendant qu'elle parle : un zoom lent et une lumiere chaude qui passe, rien de plus. */
.cadre::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(circle at 30% 20%,rgba(255,224,170,.45),transparent 60%)}
.perso.parle .cadre{box-shadow:0 0 0 3px var(--ambre),0 10px 26px rgba(232,162,58,.35)}
.perso.parle .cadre img{animation:respire 3.2s ease-in-out infinite alternate}
.perso.parle .cadre::after{opacity:1;animation:lueur 2.4s ease-in-out infinite alternate}
@keyframes respire{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes lueur{from{opacity:.35}to{opacity:.9}}

.carte{background:var(--carte);border:1px solid var(--bord);border-radius:18px;padding:18px}
.debut h1{font-size:24px;margin:0 0 8px;line-height:1.2}
.debut p{margin:0 0 10px;line-height:1.5}
.puces{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.puces span{font:800 12px var(--police);background:var(--toi);color:var(--ambre-f);border-radius:999px;padding:5px 10px}
.gros{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:900 17px var(--police);cursor:pointer;margin-top:10px;background:var(--vert);color:#fff}
.gros.second{background:transparent;color:var(--encre);border:2px solid var(--bord)}
html.nuit .gros{color:#10261B}
html.nuit .gros.second{color:var(--encre)}
details{margin-top:16px;border-top:1px solid var(--bord);padding-top:12px}
summary{font-weight:900;cursor:pointer}
details p,details li{line-height:1.5;font-size:15px}
details ul{padding-left:20px;margin:8px 0}
.fil{display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.ligne{display:flex;gap:10px;align-items:flex-end}
.ligne img{width:36px;height:36px;border-radius:12px;object-fit:cover;flex:0 0 auto}
.bulle{background:var(--carte);border:1px solid var(--bord);border-radius:18px 18px 18px 6px;padding:10px 13px;max-width:86%}
.bulle .nom{font:800 12px var(--police);color:var(--gris);margin-bottom:2px}
.bulle .de{font-size:18px;font-weight:800;line-height:1.35}
.bulle .fr{font-size:14px;color:var(--gris);margin-top:4px}
.outils{display:flex;gap:14px;margin-top:4px}
.outils button{border:0;background:none;color:var(--turq);font:800 13px var(--police);padding:4px 0;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.ic-hp{display:inline-block;width:1.05em;height:1.05em;vertical-align:-0.17em;flex:0 0 auto}
.ligne.toi{justify-content:flex-end}
.ligne.toi .bulle{background:var(--toi);border-radius:18px 18px 6px 18px}
.ligne.toi .bulle.faux{background:var(--rouge-pale)}
.ligne.toi .bulle.faux .de{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--rouge)}
.recit{text-align:center;font-size:13px;font-weight:800;color:var(--gris);font-style:italic}
.aide{background:var(--rouge-pale);border-radius:14px;padding:11px 13px;line-height:1.45;font-size:15px;margin-bottom:8px}
.aide b{color:var(--rouge)}
.aide.douce{background:var(--toi)}
.aide.douce b{color:var(--ambre-f)}
.repondre{position:sticky;bottom:0;padding:10px 8px 6px;margin:0 -8px;border-radius:18px 18px 0 0;
  background:color-mix(in srgb,var(--fond3) 72%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.repondre[hidden]{display:none}
.consigne{font:800 13px var(--police);color:var(--gris);margin:0 0 8px;text-align:center}
.choix{display:flex;flex-direction:column;gap:8px}
.choix button{text-align:left;border:2px solid var(--bord);background:var(--carte);border-radius:14px;padding:11px 14px;cursor:pointer;min-height:52px}
.choix button b{display:block;font-size:17px;line-height:1.3}
.choix button span{display:block;font-size:13px;color:var(--gris);margin-top:2px}
.choix button:disabled{opacity:.45;cursor:default}
.choix button:disabled b{text-decoration:line-through}
.choix.cache{display:none}
.micro{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
.mic{width:64px;height:64px;border-radius:50%;border:0;background:var(--ambre);color:#1C2430;cursor:pointer;display:grid;place-items:center}
.mic svg{width:28px;height:28px}
.mic.ecoute{animation:pouls 1.1s ease-in-out infinite;background:var(--rouge);color:#fff}
@keyframes pouls{50%{transform:scale(1.08)}}
.entendu{font-size:14px;color:var(--gris);text-align:center;min-height:20px;margin-top:6px}
.lien{border:0;background:none;color:var(--turq);font:800 14px var(--police);cursor:pointer;padding:4px}
.fin h2{margin:0 0 6px;font-size:24px}
.fin h3{margin:16px 0 6px;font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--gris)}
.fin ul{margin:0;padding-left:20px}
.fin li{margin:5px 0;line-height:1.45}
.phrase{display:flex;align-items:center;gap:8px;margin:6px 0}
.phrase b{flex:1}
.phrase button{border:0;background:none;color:var(--turq);cursor:pointer;padding:6px}
@media (prefers-reduced-motion:reduce){.mic.ecoute,.perso.parle .cadre img,.perso.parle .cadre::after,.perso.arrive{animation:none}.perso,.cadre img{transition:none}}
</style>
</head>
<body>
<div class="haut">
  <button class="retour" id="retour" type="button" aria-label="Retour">‹</button>
  <div class="titre"><small>Conversation · A1</small>Au café</div>
  <span class="maquette" id="marque">Maquette</span>
</div>
<main>
  <div class="plateau" id="plateau">
    <figure class="perso dernier" data-qui="kellnerin"><div class="cadre"></div>La serveuse</figure>
    <figure class="perso" data-qui="nachbar" hidden><div class="cadre"></div>Le voisin de table</figure>
  </div>
  <div id="ecran"></div>
</main>
<script>
"use strict";
const Q = new URLSearchParams(location.search);
const DANS_APP = window.parent && window.parent !== window;
if (Q.get("nuit") === "1" || (!Q.has("nuit") && !DANS_APP && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches))
  document.documentElement.classList.add("nuit");
function parler(type, extra){ try{ if (DANS_APP) parent.postMessage(Object.assign({source: "wortando-scene", type}, extra || {}), "*"); }catch(e){} }

// ---------------------------------------------------------------- les visages
// Une expression par moment. Celles qui n'existent pas encore retombent sur la plus proche (REPLI) : c'est la liste des
// images a fabriquer, chiffree a part.
const VISAGES = {
  kellnerin: { sourire: "conversation/kellnerin-sourire.webp", attentive: "conversation/kellnerin-attentive.webp" },
  nachbar: { sourire: "emociones/Tomas-contento.webp", surprise: "emociones/Tomas-sorprendido.webp",
             perplexe: "emociones/Tomas-nervioso.webp", amuse: "emociones/Tomas-avergonzado.webp" }
};
const REPLI = { question: ["attentive", "sourire"], surprise: ["attentive", "sourire"], perplexe: ["attentive", "surprise", "sourire"],
                amuse: ["sourire"], attentive: ["sourire"], sourire: ["attentive"] };
function visage(qui, air){
  const v = VISAGES[qui];
  if (v[air]) return v[air];
  for (const a of (REPLI[air] || [])) if (v[a]) return v[a];
  return v.sourire;
}
Object.values(VISAGES).forEach(v => Object.values(v).forEach(s => { const i = new Image(); i.src = s; }));
const NOM = { kellnerin: "La serveuse", nachbar: "Le voisin", toi: "Toi" };
const persos = {};
document.querySelectorAll(".perso").forEach(f => { persos[f.dataset.qui] = f; });
function poserVisage(qui, air){
  const cadre = persos[qui].querySelector(".cadre"), src = visage(qui, air);
  const actuelle = cadre.querySelector("img:not(.sort)");
  if (actuelle && actuelle.getAttribute("src") === src) return;
  const img = new Image(); img.alt = ""; img.src = src; img.className = "sort";
  cadre.appendChild(img);
  // un minuteur et non requestAnimationFrame : celui-ci s'arrete quand la page est en arriere-plan, et l'image restait invisible
  setTimeout(() => {
    img.classList.remove("sort");
    if (actuelle){ actuelle.classList.add("sort"); setTimeout(() => actuelle.remove(), 400); }
  }, 30);
}
function entre(qui){ const f = persos[qui]; if (f.hidden){ f.hidden = false; f.classList.add("arrive"); } }
function quiParle(qui){
  Object.entries(persos).forEach(([k, f]) => { f.classList.toggle("parle", k === qui); if (qui) f.classList.toggle("dernier", k === qui); });
}
function plateauNeuf(){
  persos.nachbar.hidden = true; persos.nachbar.classList.remove("arrive");
  Object.values(persos).forEach(f => f.classList.remove("parle"));
  persos.kellnerin.classList.add("dernier"); persos.nachbar.classList.remove("dernier");
  poserVisage("kellnerin", "sourire"); poserVisage("nachbar", "sourire");
}

// ---------------------------------------------------------------- les nombres et les prix
// Les nombres se disent en lettres (regle de l'app) : l'ecran garde « 6,30 Euro », la voix recoit « sechs Euro dreissig ».
const UNITES = ["null","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn","elf","zwölf","dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn"];
const DIZAINES = ["","","zwanzig","dreißig","vierzig","fünfzig","sechzig","siebzig","achtzig","neunzig"];
function nombre(n){
  if (n < 20) return UNITES[n];
  const d = Math.floor(n / 10), u = n % 10;
  return u ? (u === 1 ? "ein" : UNITES[u]) + "und" + DIZAINES[d] : DIZAINES[d];
}
const majuscule = s => s.charAt(0).toUpperCase() + s.slice(1);
const enMots = cents => { const e = Math.floor(cents / 100), c = cents % 100; return (e === 1 ? "ein" : nombre(e)) + " Euro" + (c ? " " + nombre(c) : ""); };
const enChiffres = cents => Math.floor(cents / 100) + "," + String(cents % 100).padStart(2, "0") + " Euro";
const enEuros = cents => enChiffres(cents).replace("Euro", "euros");
const PRIX = { kaffee: 280, tee: 260, wasser: 220, kuchen: 350 };

// ---------------------------------------------------------------- l'etat d'une partie
let S;
function partieNeuve(){ S = { boisson: null, kuchen: false, neu: true, markt: false, erreurs: [], dit: [] }; }
const aPayer = () => PRIX[S.boisson || "kaffee"] + (S.kuchen ? PRIX.kuchen : 0);
const arrondi = () => Math.ceil(aPayer() * 1.05 / 100);
const BOISSON_FR = { kaffee: "ton café", tee: "ton thé", wasser: "ton eau" };

// ---------------------------------------------------------------- la conversation
// Une replique : [qui, expression, allemand, francais, lecture (ce que dit la voix, si elle differe)] ; ou ["recit", francais].
// Un choix : { de, fr, faire(), puis: [repliques], va } ; un choix fautif : { faux: true, de, fr, puis, aide }.
const N = {
  commande: {
    dit: () => [["recit", "Tu entres dans un petit café du quartier. Tu t'assieds près de la fenêtre."],
                ["kellnerin", "sourire", "Guten Tag! Was möchten Sie trinken?", "Bonjour ! Qu'est-ce que vous voulez boire ?"]],
    choix: [
      { de: "Einen Kaffee, bitte.", fr: "Un café, s'il vous plaît.", faire: () => { S.boisson = "kaffee"; }, va: "lait" },
      { de: "Ich hätte gern einen Tee.", fr: "Je voudrais un thé.", faire: () => { S.boisson = "tee"; }, va: "the" },
      { de: "Ein Wasser, bitte.", fr: "Une eau, s'il vous plaît.", faire: () => { S.boisson = "wasser"; }, va: "wasser" },
      { faux: true, de: "Hallo! Gib mir einen Kaffee.", fr: "Salut ! Donne-moi un café.",
        puis: () => [["kellnerin", "perplexe", "Äh … wie bitte?", "Euh… pardon ?"]],
        aide: "<b>À la serveuse, on dit « Sie » et « bitte ».</b> « Gib mir » est un ordre qu'on donne à un ami. Dis plutôt : « Einen Kaffee, bitte » ou « Ich hätte gern einen Kaffee »." }
    ]
  },
  lait: {
    dit: () => [["kellnerin", "question", "Mit Milch und Zucker?", "Avec du lait et du sucre ?"]],
    choix: [
      { de: "Mit Milch, bitte, aber ohne Zucker.", fr: "Avec du lait, s'il vous plaît, mais sans sucre.", va: "manger" },
      { de: "Nein, danke. Schwarz, bitte.", fr: "Non, merci. Noir, s'il vous plaît.", va: "manger" }
    ]
  },
  the: {
    dit: () => [["kellnerin", "question", "Schwarztee oder Pfefferminztee?", "Du thé noir ou du thé à la menthe ?"]],
    choix: [
      { de: "Pfefferminztee, bitte.", fr: "Du thé à la menthe, s'il vous plaît.", va: "manger" },
      { de: "Schwarztee, bitte.", fr: "Du thé noir, s'il vous plaît.", va: "manger" }
    ]
  },
  wasser: {
    dit: () => [["kellnerin", "question", "Mit oder ohne Kohlensäure?", "Gazeuse ou plate ?"]],
    choix: [
      { de: "Mit Kohlensäure, bitte.", fr: "Gazeuse, s'il vous plaît.", va: "manger" },
      { de: "Ohne Kohlensäure, bitte.", fr: "Plate, s'il vous plaît.", va: "manger" }
    ]
  },
  manger: {
    dit: () => [["kellnerin", "question", "Möchten Sie auch etwas essen? Heute haben wir Apfelkuchen.", "Vous voulez aussi manger quelque chose ? Aujourd'hui, nous avons du gâteau aux pommes."]],
    choix: [
      { de: "Ja, gern. Ein Stück Apfelkuchen, bitte.", fr: "Oui, volontiers. Une part de gâteau aux pommes, s'il vous plaît.", faire: () => { S.kuchen = true; },
        puis: () => [["kellnerin", "sourire", "Sehr gern. Kommt sofort!", "Avec plaisir. Ça arrive tout de suite !"]], va: "frei" },
      { de: "Nein, danke. Das ist alles.", fr: "Non, merci. Ce sera tout.",
        puis: () => [["kellnerin", "sourire", "Gut. Kommt sofort!", "Bien. Ça arrive tout de suite !"]], va: "frei" },
      { de: "Was kostet der Kuchen?", fr: "Combien coûte le gâteau ?",
        puis: () => [["kellnerin", "attentive", "Ein Stück kostet " + enChiffres(PRIX.kuchen) + ".", "Une part coûte " + enEuros(PRIX.kuchen) + ".", "Ein Stück kostet " + enMots(PRIX.kuchen) + "."]], va: "manger2" },
      { faux: true, de: "Ja, ich habe Apfelkuchen.", fr: "Oui, j'ai du gâteau aux pommes.",
        puis: () => [["kellnerin", "surprise", "Sie haben schon Kuchen?", "Vous avez déjà du gâteau ?"]],
        aide: "<b>« Ich habe »</b> veut dire « j'ai ». Pour commander : « Ein Stück Apfelkuchen, bitte » ou « Ich nehme ein Stück Apfelkuchen »." }
    ]
  },
  manger2: { dit: () => [], choix: () => N.manger.choix.slice(0, 2) },
  frei: {
    dit: () => [["recit", "La serveuse apporte " + BOISSON_FR[S.boisson] + (S.kuchen ? " et ton gâteau." : ".") + " Le café se remplit. Un homme s'approche de ta table."],
                ["nachbar", "question", "Entschuldigung, ist hier noch frei?", "Excusez-moi, la place est libre ?"]],
    choix: [
      { de: "Ja, klar. Bitte!", fr: "Oui, bien sûr. Je vous en prie !",
        puis: () => [["nachbar", "sourire", "Danke schön!", "Merci beaucoup !"]], va: "viertel" },
      { de: "Ja, natürlich. Setzen Sie sich!", fr: "Oui, naturellement. Asseyez-vous !",
        puis: () => [["nachbar", "sourire", "Vielen Dank, sehr nett!", "Merci beaucoup, c'est très gentil !"]], va: "viertel" },
      { faux: true, de: "Nein, ich bin frei.", fr: "Non, je suis libre.",
        puis: () => [["nachbar", "perplexe", "Äh … und der Stuhl? Ist der frei?", "Euh… et la chaise ? Elle est libre ?"]],
        aide: "<b>« Ist hier noch frei? »</b> demande si la place est libre, pas toi. Réponds « Ja, klar » ou « Ja, natürlich »." }
    ]
  },
  viertel: {
    dit: () => [["nachbar", "question", "Sind Sie neu hier im Viertel?", "Vous êtes nouveau (nouvelle) dans le quartier ?"]],
    choix: [
      { de: "Ja, ich wohne seit einem Monat hier.", fr: "Oui, j'habite ici depuis un mois.",
        puis: () => [["nachbar", "sourire", "Ah, dann herzlich willkommen!", "Ah, alors bienvenue !"]], va: "markt" },
      { de: "Nein, ich wohne schon lange hier.", fr: "Non, j'habite ici depuis longtemps.", faire: () => { S.neu = false; },
        puis: () => [["nachbar", "surprise", "Ach so! Und ich habe Sie noch nie gesehen.", "Ah bon ! Et je ne vous ai encore jamais vu(e)."]], va: "markt" },
      { de: "Wie bitte? Können Sie das wiederholen?", fr: "Pardon ? Vous pouvez répéter ?",
        puis: () => [["nachbar", "sourire", "Natürlich. Wohnen Sie schon lange hier?", "Bien sûr. Vous habitez ici depuis longtemps ?"]], va: "viertel2" },
      { faux: true, de: "Ja, ich wohne hier seit morgen.", fr: "Oui, j'habite ici depuis demain.",

const VOIX_A_FUIR = ["albert","bad news","bahh","bells","boing","bubbles","cellos","good news","jester","organ","superstar","trinoids","whisper","wobble","zarvox","deranged","hysterical","junior","ralph","kathy","fred","princess","bruce","agnes","vicki","eddy","flo","grandma","grandpa","reed","rocko","sandy","shelley"];

function choisirVoix(){
  const toutes = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  const de = toutes.filter(v => /^de/i.test(v.lang) && !VOIX_A_FUIR.some(f => (v.name || "").toLowerCase().includes(f)));
  const trouve = re => de.find(v => re.test(v.name));
  voixDe.kellnerin = trouve(/anna|petra|helena|katja|marlene|google deutsch|hedda|female|frau/i) || de[0] || null;
  voixDe.nachbar = trouve(/markus|yannick|martin|conrad|stefan|hans|killian|male|mann/i) || de.find(v => v !== voixDe.kellnerin) || de[0] || null;
  voixDe.toi = voixDe.kellnerin;
}

function dire(texte, qui){
  return new Promise(fini => {

    if (!window.speechSynthesis){ setTimeout(fini, 400 + texte.length * 45); return; }
    const u = new SpeechSynthesisUtterance(texte);
    u.lang = "de-DE"; u.rate = 0.92;
    const v = voixDe[qui]; if (v) u.voice = v;
    if (v && voixDe.kellnerin === voixDe.nachbar) u.pitch = HAUTEUR[qui] || 1;
    let rendu = false; const fin = () => { if (!rendu){ rendu = true; fini(); } };
    u.onend = u.onerror = fin;
    speechSynthesis.speak(u);
    setTimeout(fin, 900 + texte.length * 110);   // filet : certains moteurs n'appellent jamais onend
  });
}

function ecouter(surTexte, surFin){
  if (Reco){
    let finals = "", provisoire = "", fini = false, reco;
    const total = () => (finals + " " + provisoire).replace(/\s+/g, " ").trim();
    const terminer = () => { if (fini) return; fini = true; surFin(total()); };
    try{
      reco = new Reco();
      reco.lang = "de-DE"; reco.continuous = false; reco.interimResults = true;
      reco.onresult = ev => {
        provisoire = "";
        for (let i = ev.resultIndex; i < ev.results.length; i++){
          const r = ev.results[i];
          if (r.isFinal) finals += " " + r[0].transcript; else provisoire += " " + r[0].transcript;
        }
        surTexte(total());
      };
      reco.onerror = ev => { if (ev && (ev.error === "not-allowed" || ev.error === "service-not-allowed") && !fini){ fini = true; surFin(null); } };
      reco.onend = () => setTimeout(terminer, 100);
      reco.start();
    }catch(e){ setTimeout(() => surFin(null), 0); return { arreter(){} }; }
    return { arreter(){ try{ reco.stop(); }catch(e){} setTimeout(terminer, 1500); } };
  }

}
// La reponse la plus proche de ce qui a ete dit : les mots en commun (coefficient de Dice), sans majuscules, accents
// allemands ni ponctuation, un mot a une lettre pres compte a moitie ; ou les paires de lettres, pour les mots
// composes que la reconnaissance coupe (« Pfefferminz Tee »).
const plier = s => s.toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
  .replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
const mots = s => plier(s).split(" ").filter(Boolean);
function proche(a, b){
  if (a === b) return 1;
  if (Math.abs(a.length - b.length) > 1 || a.length < 4) return 0;
  let i = 0; while (i < a.length && a[i] === b[i]) i++;
  return (a.slice(i + 1) === b.slice(i + 1) || a.slice(i) === b.slice(i + 1) || a.slice(i + 1) === b.slice(i)) ? 0.5 : 0;
}
function ressemblance(dit, cible){
  const a = mots(dit), b = mots(cible);
  if (!a.length || !b.length) return 0;
  const reste = b.slice(); let commun = 0;
  a.forEach(m => {
    let k = reste.indexOf(m), p = 1;
    if (k < 0){ p = 0; reste.forEach((x, j) => { const q = proche(m, x); if (q > p){ p = q; k = j; } }); }
    if (k >= 0 && p > 0){ commun += p; reste.splice(k, 1); }
  });
  const parMots = 2 * commun / (a.length + b.length);
  const paires = s => { const c = plier(s).replace(/ /g, ""), r = []; for (let i = 0; i < c.length - 1; i++) r.push(c.slice(i, i + 2)); return r; };
  const pa = paires(dit), pc = paires(cible), pb = pc.slice();
  let n = 0; pa.forEach(p => { const k = pb.indexOf(p); if (k >= 0){ n++; pb.splice(k, 1); } });
  const parLettres = pa.length + pc.length ? 2 * n / (pa.length + pc.length) : 0;
  return Math.max(parMots, parLettres * 0.95);
}

function micro(bouton){

    c.appendChild(el("h3", null, "Tes erreurs, corrigées"));
    const ul = el("ul");
    S.erreurs.forEach(e => { const li = el("li"); li.innerHTML = "<s>" + e.de + "</s> : " + e.aide; ul.appendChild(li); });
    c.appendChild(ul);
  }
  c.appendChild(el("h3", null, "Les phrases que tu as dites"));
  S.dit.filter(x => !x.faux).forEach(x => {
    const p = el("div", "phrase");
    const t = el("b", null, x.de); t.lang = "de"; p.appendChild(t);
    p.appendChild(boutonHP(x.de, "toi", ""));
    c.appendChild(p);
  });
  const re = el("button", "gros", "Rejouer en répondant autrement"); re.type = "button"; re.onclick = () => commencer(sansFilet);
  const ter = el("button", "gros second", "Terminer"); ter.type = "button"; ter.onclick = () => { if (DANS_APP) parler("fermer"); else debut(); };
  c.append(re, ter);
  fil.appendChild(c); defiler();
}
document.getElementById("retour").onclick = () => { taire(); if (ecouteEnCours) ecouteEnCours.arreter(); if (DANS_APP) parler("fermer"); else debut(); };
if (DANS_APP) document.getElementById("marque").hidden = true;
debut();
</script>
</body>
