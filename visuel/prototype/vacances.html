<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les vacances et le voyage</title>
<!--
  LES VACANCES ET LE VOYAGE (theme illustre, vague 4 de Jacques, 5 nov. 2026 : « les vacances et le voyage (Perfekt /
  preterito) »). LE POINT CENTRAL : RACONTER AU PASSE. En allemand le Perfekt (haben ou sein, le participe a la fin :
  Anna ist nach Malaga geflogen, Anna hat ein Eis gegessen), en espagnol le preterito indefinido (fui, visito, hizo).
  On suit trois voyages, une frise chacun : Anna a Malaga, Mark a Hambourg, la famille d'Anna a la mer Baltique. Et
  autour : faire sa valise (ce qui est sur le lit), reserver une chambre et parler a la reception (la confirmation
  de reservation se DESSINE ici), le temps qu'il a fait (au passe seulement, le theme de la meteo a le reste).
  Toute la donnee vient de vacances/vacances.json (visuel/vacances/vacances.py) : aucune phrase ecrite a la main.
  L'auxiliaire et le participe allemands sont LUS dans le Perfekt du corpus ; le preterito espagnol est celui du corpus.
  LA FRISE DANS LA QUESTION (decision du 5 nov. sur La journee) : une question sur l'ordre des evenements montre la
  frise du voyage, elle ne teste jamais la memoire de la decouverte.
  Ouverte par l'app dans le cadre des scenes (sceneCadre), elle parle comme une scene : « exercice » et « bonne »
  a chaque reponse, « reponse » {mot, genre, cat, juste} pour le mot teste, « fini » et « fermer » a la fin.
  Parametres : apprendre=es|de, lang=<interface>, nuit=1, seance=1 (six questions, pas de decouverte),
  variante=latam (en carro, un sandwich, el sueter), r=<AUDIO_REVISION>.
  Le tirage suit les mots (themes/tirage.js) ; la voix : le fichier enregistre, sinon le telephone (themes/voix.js).
-->
<style>
:root{--fond1:#82AFDB;--fond3:#C0D6EA;--encre:#1C2430;--gris:#4C566B;--ambre:#E8A23A;--ambre-f:#A86A0E;--vert:#2F9E6A;--rouge:#C8473A;
  --verre:rgba(255,255,255,.88);--bord:rgba(255,255,255,.95);--carte:#F7F8FA;--papier:#FFFDF7;--trait:#C9CFD8;--stylo:#1D4E9E;--police:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html.nuit{--fond1:#0E1C26;--fond3:#18303F;--encre:#EEF2F5;--gris:#A9B8C4;--ambre-f:#E8A23A;--vert:#5CC98F;--rouge:#F07F72;
  --verre:rgba(20,36,50,.88);--bord:rgba(255,255,255,.14);--carte:#22384A;--papier:#1D2F3D;--trait:#40576A;--stylo:#9CC3FF}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
/* LA PAGE A LA HAUTEUR DE L'ECRAN, COMME UNE SCENE (visuel/THEMES-ILLUSTRES.md) : le contenu defile DANS le body */
html{height:100%;overflow:hidden}
body{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;box-sizing:border-box}
body{background:linear-gradient(180deg,var(--fond1),var(--fond3));background-attachment:fixed;color:var(--encre);font-family:var(--police);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 90px) max(10px,env(safe-area-inset-left,0px))}
.haut{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto 10px}
.retour{width:42px;height:42px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);color:var(--encre);font:800 22px var(--police);cursor:pointer;flex:0 0 auto}
html[dir="rtl"] .retour{transform:scaleX(-1)}
.titre{flex:1;font-weight:900;font-size:18px}
.compte{font-weight:800;font-size:14px;color:var(--gris)}
.barre{max-width:560px;margin:0 auto 12px;height:6px;border-radius:3px;background:rgba(28,36,48,.12);overflow:hidden}
.barre i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2BB5AA,#14807A);transition:width .3s}
main{max-width:560px;margin:0 auto;background:var(--verre);border:1px solid var(--bord);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}
.consigne{font-size:14px;font-weight:700;color:var(--gris);margin:0}
.enonce{direction:ltr;text-align:left;background:var(--carte);border-radius:14px;padding:12px 14px;font-weight:800;line-height:1.5;font-size:17px}
.enonce.centre{text-align:center;font-size:19px}
.trou{display:inline-block;min-width:56px;border-bottom:2px solid var(--ambre);text-align:center;color:var(--ambre-f)}
.photo{position:relative;width:100%;max-width:480px;margin:0 auto;border-radius:16px;overflow:hidden;background:var(--carte)}
.photo img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
/* la frise d'un voyage, dans la decouverte ET dans les questions sur l'ordre : les photos dans l'ordre, numerotees */
.frise{direction:ltr;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.frise > div, .frise > button{position:relative;border:3px solid transparent;border-radius:12px;padding:0;background:var(--carte);overflow:hidden;display:block}
.frise > button{cursor:pointer}
.frise img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.frise .num{position:absolute;top:3px;left:3px;min-width:22px;height:22px;border-radius:11px;background:rgba(28,36,48,.78);color:#fff;font:900 13px/22px var(--police);text-align:center;padding:0 5px}
.frise .marque{border-color:var(--ambre)} .frise .marque .num{background:var(--ambre);color:#1C2430}
.frise .choisi{border-color:var(--ambre)}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix.centre{justify-content:center}
.choix.liste{flex-direction:column}
.choix button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:9px 15px;font:800 15px var(--police);cursor:pointer;text-align:left}
.choix.liste button{border-radius:14px}
.choix button.juste{background:var(--vert);border-color:var(--vert);color:#fff}
.choix button.faux{background:var(--rouge);border-color:var(--rouge);color:#fff}
/* remettre dans l'ordre : quatre phrases a toucher de la premiere a la derniere, la frise au-dessus */
.ordre{display:flex;flex-direction:column;gap:8px}
.ordre button{position:relative;border:2px solid var(--ambre);border-radius:14px;background:var(--verre);padding:10px 12px 10px 46px;cursor:pointer;text-align:left;color:var(--encre);font:800 15px/1.35 var(--police);min-height:46px}
.ordre button span.t{display:block;direction:ltr;text-align:left}
.ordre button i{position:absolute;top:50%;left:8px;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:var(--ambre);color:#1C2430;font:900 17px/30px var(--police);font-style:normal;text-align:center;display:none}
.ordre button.pris i{display:block}
.ordre button.juste{border-color:var(--vert)} .ordre button.juste i{background:var(--vert);color:#fff;display:block}
.ordre button.faux{border-color:var(--rouge)}
button:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
button:disabled{cursor:default}
.retourMsg{min-height:1.4em;font-weight:800;font-size:15px;margin:0;line-height:1.45}
.retourMsg.ok{color:var(--vert)} .retourMsg.ko{color:var(--rouge)}
.retourMsg .phrase{display:block;color:var(--encre);font-weight:700}
/* la decouverte : les onglets (trois voyages, les valises, l'hotel), la frise, la fiche */
.onglets{display:flex;flex-wrap:wrap;gap:4px;background:var(--carte);border-radius:18px;padding:4px}
.onglets button{flex:1 1 auto;border:0;border-radius:999px;background:none;color:var(--gris);font:800 13px var(--police);padding:7px 6px;cursor:pointer}
.onglets button[aria-selected="true"]{background:var(--ambre);color:#1C2430}
.fiche{background:var(--carte);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.fiche .dit{font-weight:800;font-size:18px;line-height:1.4}
.fiche .temps{font-weight:700;font-size:15px;color:var(--gris)}
.fiche .ligne{display:flex;align-items:flex-start;gap:10px}
.fiche .ligne > div{flex:1}
.ecoute{width:44px;height:44px;flex:0 0 auto;border-radius:50%;border:2px solid var(--ambre);background:var(--verre);color:var(--encre);cursor:pointer;display:flex;align-items:center;justify-content:center}
.ecoute svg{width:22px;height:22px}
.puces{display:flex;flex-wrap:wrap;gap:6px}
.puces button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:6px 12px;font:800 14px var(--police);cursor:pointer}
.regle{margin:0;font-size:14px;font-weight:700;line-height:1.45;color:var(--gris);background:var(--carte);border-radius:12px;padding:10px 12px}
.regle b{color:var(--encre)}
/* LA CONFIRMATION DE RESERVATION, dessinee ici (aucun texte dans les images) */
.papier{direction:ltr;text-align:left;background:var(--papier);border:1px solid var(--trait);border-radius:6px;padding:12px 12px 10px;box-shadow:0 6px 16px rgba(28,36,48,.12);font-size:14px;line-height:1.4;color:var(--encre)}
.papier .entete{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--gris);border-bottom:2px solid var(--encre);padding-bottom:5px;margin-bottom:8px}
.papier h3{margin:0 0 8px;font-size:17px;font-weight:900}
.papier .cases{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.papier .case{border:1px solid var(--trait);border-radius:4px;padding:3px 6px 4px;min-height:42px;background:rgba(255,255,255,.35)}
html.nuit .papier .case{background:rgba(255,255,255,.03)}
.papier .case .lab{display:block;font-size:10.5px;font-weight:800;color:var(--gris);text-transform:uppercase;letter-spacing:.02em}
.papier .case .val{display:block;font-size:15px;font-weight:800;color:var(--stylo)}
.suite{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:54px;border:0;border-radius:27px;
  color:#fff;font:800 17px var(--police);background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer}
.suite[hidden]{display:none}
/* Jacques, 3 nov. 2026, comme dans les scenes : « commencer les exercices ou continuer soit toujours en bas
   completement de l'ecran ». Tous les boutons d'action sont fixes en bas, jamais dans le flux. */
.suite{z-index:5000}
.bas{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:5000}
.bas button{flex:1 1 0;min-width:0;height:54px;border:0;border-radius:27px;padding:0 12px;color:#fff;font:800 16px/1.15 var(--police);
  background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer}
.fin{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:10px 0}
.fin .score{font-size:22px;font-weight:900}
[lang]{unicode-bidi:isolate}
/* la traduction dans la langue d'interface : une ligne, plus petite, en gris (3 nov. 2026) */
.trad.faux{color:var(--rouge);font-style:italic}
.trad{display:block;font-size:13px;font-weight:600;color:var(--gris);line-height:1.35;margin-top:2px}
</style>
</head>
<body>
<div class="haut"><button class="retour" id="retour" type="button">‹</button><div class="titre" id="titre"></div><div class="compte" id="compte" dir="ltr"></div></div>
<div class="barre"><i id="barre"></i></div>
<main id="zone"></main>
<button class="suite" id="suite" type="button" hidden></button>
<script src="themes/tirage.js?v=1"></script>
<script src="themes/voix.js?v=6"></script>
<script src="themes/zoom.js?v=4"></script>
<script src="themes/verre.js?v=6"></script>
<script>
const Q = new URLSearchParams(location.search);
const APPRENDRE = Q.get("apprendre") === "de" ? "de" : "es";
const DE_APP = APPRENDRE === "de";
const LATAM = !DE_APP && Q.get("variante") === "latam";
const LANGUE = (l => ["fr", "en", "tr", "uk", "fa", "ar", "pt", "pl", "ru", "de"].includes(l) ? l : "fr")(((Q.get("lang") || "fr").toLowerCase().split(/[-_]/)[0]));
if (Q.get("nuit") === "1") document.documentElement.classList.add("nuit");
// agrandir (themes/zoom.js) : un toucher sur une photo, une case de frise ou une reservation ; la loupe sur la frise
// de la decouverte (on la touche pour choisir une etape)
Zoom.init({direct: ".photo img, .frise > div img, .papier", loupe: ".frise > button", langue: LANGUE});
document.documentElement.lang = LANGUE;
document.documentElement.dir = (LANGUE === "fa" || LANGUE === "ar") ? "rtl" : "ltr";
// vingt questions seul (Jacques, 3 nov.), six dans la seance du jour, sans la decouverte
const NB = Q.get("seance") === "1" ? Math.max(2, Math.min(12, parseInt(Q.get("nb"), 10) || 6)) : 20;   // nb : le reglage « Questions par scene et par theme » de la seance du jour (5 · 8 · 12, 7 nov. 2026)

const TEXTES = {
  titre:     {fr:"Les vacances et le voyage", en:"Holidays and travel", tr:"Tatil ve seyahat", uk:"Відпустка й подорожі", fa:"تعطیلات و سفر", ar:"العطلة والسفر", pt:"As férias e a viagem", pl:"Wakacje i podróże", ru:"Отпуск и путешествия", de:"Urlaub und Reisen"},
  intro:     {fr:"Touche une photo du voyage : tu lis et tu entends ce qui s'est passé.", en:"Tap a photo of the trip: you read and hear what happened.", tr:"Yolculuğun bir fotoğrafına dokun: ne olduğunu oku ve dinle.", uk:"Торкнися фото з подорожі: прочитаєш і почуєш, що сталося.", fa:"روی یکی از عکس‌های سفر بزن: می‌خوانی و می‌شنوی چه اتفاقی افتاد.", ar:"المس صورة من الرحلة: تقرأ وتسمع ما حدث.", pt:"Toque em uma foto da viagem: você lê e ouve o que aconteceu.", pl:"Dotknij zdjęcia z podróży: przeczytasz i usłyszysz, co się wydarzyło.", ru:"Нажми на фото из поездки: прочитаешь и услышишь, что произошло.", de:"Tippe auf ein Foto der Reise: Du liest und hörst, was passiert ist."},
  introValise:{fr:"Ce qui est sur le lit avant le départ. Touche un objet pour l'entendre.", en:"What is on the bed before leaving. Tap an object to hear it.", tr:"Yola çıkmadan önce yatağın üstünde olanlar. Duymak için bir nesneye dokun.", uk:"Що лежить на ліжку перед від'їздом. Торкнися предмета, щоб почути його.", fa:"چیزهایی که پیش از رفتن روی تخت است. روی یک وسیله بزن تا آن را بشنوی.", ar:"ما على السرير قبل السفر. المس شيئًا لتسمعه.", pt:"O que está na cama antes da partida. Toque em um objeto para ouvi-lo.", pl:"Co leży na łóżku przed wyjazdem. Dotknij przedmiotu, żeby go usłyszeć.", ru:"Что лежит на кровати перед отъездом. Нажми на предмет, чтобы его услышать.", de:"Was vor der Abreise auf dem Bett liegt. Tippe auf einen Gegenstand, um ihn zu hören."},
  introHotel:{fr:"Une confirmation de réservation, et ce qu'on dit à la réception.", en:"A booking confirmation, and what you say at the reception desk.", tr:"Bir rezervasyon onayı ve resepsiyonda söylenenler.", uk:"Підтвердження бронювання і що кажуть на рецепції.", fa:"یک تأیید رزرو و آنچه در پذیرش گفته می‌شود.", ar:"تأكيد حجز، وما يُقال في الاستقبال.", pt:"Uma confirmação de reserva e o que se diz na recepção.", pl:"Potwierdzenie rezerwacji i to, co mówi się w recepcji.", ru:"Подтверждение бронирования и то, что говорят на ресепшене.", de:"Eine Buchungsbestätigung und was man an der Rezeption sagt."},
  regleDe:   {fr:"Pour raconter, l'allemand prend le <b>Perfekt</b> : haben ou sein conjugué en 2<sup>e</sup> place, le participe à la <b>fin</b>. <b>Sein</b> quand on se déplace ou qu'on arrive : Anna <b>ist</b> nach Málaga <b>geflogen</b>, Mark <b>ist</b> im Hotel <b>angekommen</b>. <b>Haben</b> pour le reste : Anna <b>hat</b> ein Eis <b>gegessen</b>. Le participe : ge…t (gekauft), ge…en pour les verbes forts (gegessen, geflogen), sans ge- après be- et pour -ieren (besichtigt, reserviert), ge- au milieu des séparables (angekommen). Sein lui-même se dit au prétérit : es <b>war</b> warm.",
              en:"To tell a story, German uses the <b>Perfekt</b>: haben or sein, conjugated in 2nd place, and the participle at the <b>end</b>. <b>Sein</b> for moving or arriving: Anna <b>ist</b> nach Málaga <b>geflogen</b>, Mark <b>ist</b> im Hotel <b>angekommen</b>. <b>Haben</b> for the rest: Anna <b>hat</b> ein Eis <b>gegessen</b>. The participle: ge…t (gekauft), ge…en for strong verbs (gegessen, geflogen), no ge- after be- and for -ieren (besichtigt, reserviert), ge- in the middle of separable verbs (angekommen). Sein itself goes into the simple past: es <b>war</b> warm.",
              tr:"Anlatırken Almanca <b>Perfekt</b> kullanır: haben ya da sein 2. sırada çekimlenir, ortaç <b>sonda</b> durur. Yer değiştirirken ya da varırken <b>sein</b>: Anna <b>ist</b> nach Málaga <b>geflogen</b>, Mark <b>ist</b> im Hotel <b>angekommen</b>. Geri kalanı için <b>haben</b>: Anna <b>hat</b> ein Eis <b>gegessen</b>. Ortaç: ge…t (gekauft), güçlü fiillerde ge…en (gegessen, geflogen), be- ve -ieren ile ge- yok (besichtigt, reserviert), ayrılabilen fiillerde ge- ortada (angekommen). Sein'in kendisi geçmiş zamanda söylenir: es <b>war</b> warm.",
              uk:"Щоб розповідати, німецька вживає <b>Perfekt</b>: haben або sein на 2-му місці, дієприкметник у <b>кінці</b>. <b>Sein</b> — коли рухаються чи прибувають: Anna <b>ist</b> nach Málaga <b>geflogen</b>, Mark <b>ist</b> im Hotel <b>angekommen</b>. <b>Haben</b> — для решти: Anna <b>hat</b> ein Eis <b>gegessen</b>. Дієприкметник: ge…t (gekauft), ge…en у сильних дієсловах (gegessen, geflogen), без ge- після be- і в -ieren (besichtigt, reserviert), ge- посередині у відокремлюваних (angekommen). Саме sein кажуть у претериті: es <b>war</b> warm.",
              fa:"برای تعریف کردن، آلمانی از <b>Perfekt</b> استفاده می‌کند: haben یا sein صرف‌شده در جایگاه دوم و اسم مفعول در <b>آخر</b> جمله. <b>sein</b> برای جابه‌جا شدن یا رسیدن: Anna <b>ist</b> nach Málaga <b>geflogen</b>، Mark <b>ist</b> im Hotel <b>angekommen</b>. <b>haben</b> برای بقیه: Anna <b>hat</b> ein Eis <b>gegessen</b>. اسم مفعول: ge…t (gekauft)، در فعل‌های قوی ge…en (gegessen، geflogen)، بدون ge- بعد از be- و در -ieren (besichtigt، reserviert)، و ge- در وسط فعل‌های جداشدنی (angekommen). خود sein در گذشتهٔ ساده می‌آید: es <b>war</b> warm.",
              ar:"للحكي تستعمل الألمانية <b>Perfekt</b>: haben أو sein مصرّفًا في المرتبة الثانية، واسم المفعول في <b>آخر</b> الجملة. <b>sein</b> عند التنقل أو الوصول: Anna <b>ist</b> nach Málaga <b>geflogen</b>، Mark <b>ist</b> im Hotel <b>angekommen</b>. <b>haben</b> لما تبقى: Anna <b>hat</b> ein Eis <b>gegessen</b>. اسم المفعول: ge…t (gekauft)، وge…en في الأفعال القوية (gegessen، geflogen)، ومن غير ge- بعد be- ومع -ieren (besichtigt، reserviert)، وge- في الوسط مع الأفعال المنفصلة (angekommen). أما sein نفسه فيُقال في الماضي البسيط: es <b>war</b> warm.",
              pt:"Para contar, o alemão usa o <b>Perfekt</b>: haben ou sein conjugado em 2º lugar e o particípio no <b>fim</b>. <b>Sein</b> quando alguém se desloca ou chega: Anna <b>ist</b> nach Málaga <b>geflogen</b>, Mark <b>ist</b> im Hotel <b>angekommen</b>. <b>Haben</b> para o resto: Anna <b>hat</b> ein Eis <b>gegessen</b>. O particípio: ge…t (gekauft), ge…en nos verbos fortes (gegessen, geflogen), sem ge- depois de be- e em -ieren (besichtigt, reserviert), ge- no meio dos separáveis (angekommen). O próprio sein vai para o pretérito: es <b>war</b> warm.",
              pl:"Opowiadając, niemiecki używa <b>Perfekt</b>: haben lub sein odmienione na 2. miejscu, imiesłów na <b>końcu</b>. <b>Sein</b>, gdy ktoś się przemieszcza lub dociera: Anna <b>ist</b> nach Málaga <b>geflogen</b>, Mark <b>ist</b> im Hotel <b>angekommen</b>. <b>Haben</b> w pozostałych przypadkach: Anna <b>hat</b> ein Eis <b>gegessen</b>. Imiesłów: ge…t (gekauft), ge…en w czasownikach mocnych (gegessen, geflogen), bez ge- po be- i w -ieren (besichtigt, reserviert), ge- w środku czasowników rozdzielnych (angekommen). Samo sein mówi się w czasie przeszłym prostym: es <b>war</b> warm.",
              ru:"Чтобы рассказывать, немецкий использует <b>Perfekt</b>: haben или sein на 2-м месте, причастие в <b>конце</b>. <b>Sein</b> — когда перемещаются или прибывают: Anna <b>ist</b> nach Málaga <b>geflogen</b>, Mark <b>ist</b> im Hotel <b>angekommen</b>. <b>Haben</b> — для остального: Anna <b>hat</b> ein Eis <b>gegessen</b>. Причастие: ge…t (gekauft), ge…en у сильных глаголов (gegessen, geflogen), без ge- после be- и у -ieren (besichtigt, reserviert), ge- в середине у отделяемых (angekommen). Сам sein говорят в претерите: es <b>war</b> warm.",
              de:"Beim Erzählen benutzt man das <b>Perfekt</b>: haben oder sein an 2. Stelle, das Partizip am <b>Ende</b>. <b>Sein</b> bei Bewegung und Ankunft (Anna ist nach Málaga geflogen), <b>haben</b> sonst (Anna hat ein Eis gegessen). Sein selbst steht im Präteritum: es war warm."},
  regleEs:   {fr:"Pour raconter un voyage fini, l'espagnol prend le <b>pretérito indefinido</b> : visit<b>é</b>, visit<b>aste</b>, visit<b>ó</b>, visit<b>amos</b>, visit<b>aron</b> ; com<b>í</b>, com<b>ió</b>, com<b>ieron</b>. L'accent compte : <b>visito</b> (je visite) n'est pas <b>visitó</b> (il, elle a visité). Les plus fréquents sont irréguliers : <b>fui, fue, fueron</b> (ir, et aussi ser), <b>hice, hizo, hicieron</b> (hacer). Les verbes en -gar prennent un u à la 1<sup>re</sup> personne : lle<b>gué</b>, ju<b>gué</b>. Le temps qu'il a fait : <b>hizo sol</b>, <b>hizo calor</b>, <b>llovió</b>.",
              en:"To tell about a finished trip, Spanish uses the <b>pretérito indefinido</b>: visit<b>é</b>, visit<b>aste</b>, visit<b>ó</b>, visit<b>amos</b>, visit<b>aron</b>; com<b>í</b>, com<b>ió</b>, com<b>ieron</b>. The accent matters: <b>visito</b> (I visit) is not <b>visitó</b> (he, she visited). The most frequent ones are irregular: <b>fui, fue, fueron</b> (ir, and ser too), <b>hice, hizo, hicieron</b> (hacer). Verbs in -gar take a u in the 1st person: lle<b>gué</b>, ju<b>gué</b>. The weather: <b>hizo sol</b>, <b>hizo calor</b>, <b>llovió</b>.",
              tr:"Bitmiş bir yolculuğu anlatırken İspanyolca <b>pretérito indefinido</b> kullanır: visit<b>é</b>, visit<b>aste</b>, visit<b>ó</b>, visit<b>amos</b>, visit<b>aron</b>; com<b>í</b>, com<b>ió</b>, com<b>ieron</b>. Vurgu önemlidir: <b>visito</b> (ziyaret ederim) ile <b>visitó</b> (ziyaret etti) aynı değildir. En sık olanlar düzensizdir: <b>fui, fue, fueron</b> (ir, ayrıca ser), <b>hice, hizo, hicieron</b> (hacer). -gar ile biten fiiller 1. tekil kişide u alır: lle<b>gué</b>, ju<b>gué</b>. Hava: <b>hizo sol</b>, <b>hizo calor</b>, <b>llovió</b>.",
              uk:"Щоб розповісти про завершену подорож, іспанська вживає <b>pretérito indefinido</b>: visit<b>é</b>, visit<b>aste</b>, visit<b>ó</b>, visit<b>amos</b>, visit<b>aron</b>; com<b>í</b>, com<b>ió</b>, com<b>ieron</b>. Наголос важливий: <b>visito</b> (я відвідую) — не <b>visitó</b> (він, вона відвідав(-ла)). Найчастіші — неправильні: <b>fui, fue, fueron</b> (ir, а також ser), <b>hice, hizo, hicieron</b> (hacer). Дієслова на -gar мають u в 1-й особі: lle<b>gué</b>, ju<b>gué</b>. Погода: <b>hizo sol</b>, <b>hizo calor</b>, <b>llovió</b>.",
              fa:"برای تعریف یک سفر تمام‌شده، اسپانیایی از <b>pretérito indefinido</b> استفاده می‌کند: visit<b>é</b>، visit<b>aste</b>، visit<b>ó</b>، visit<b>amos</b>، visit<b>aron</b>؛ com<b>í</b>، com<b>ió</b>، com<b>ieron</b>. تکیه مهم است: <b>visito</b> (بازدید می‌کنم) با <b>visitó</b> (بازدید کرد) فرق دارد. پرکاربردترین‌ها بی‌قاعده‌اند: <b>fui، fue، fueron</b> (ir و همچنین ser)، <b>hice، hizo، hicieron</b> (hacer). فعل‌های -gar در اول شخص u می‌گیرند: lle<b>gué</b>، ju<b>gué</b>. هوا: <b>hizo sol</b>، <b>hizo calor</b>، <b>llovió</b>.",
              ar:"للحديث عن رحلة انتهت تستعمل الإسبانية <b>pretérito indefinido</b>: visit<b>é</b>، visit<b>aste</b>، visit<b>ó</b>، visit<b>amos</b>، visit<b>aron</b>؛ com<b>í</b>، com<b>ió</b>، com<b>ieron</b>. للنبرة أهمية: <b>visito</b> (أزور) ليست <b>visitó</b> (زار، زارت). الأكثر استعمالًا شاذة: <b>fui، fue، fueron</b> (ir وكذلك ser)، <b>hice، hizo، hicieron</b> (hacer). الأفعال المنتهية بـ -gar تأخذ u مع المتكلم: lle<b>gué</b>، ju<b>gué</b>. الطقس: <b>hizo sol</b>، <b>hizo calor</b>، <b>llovió</b>.",
              pt:"Para contar uma viagem que terminou, o espanhol usa o <b>pretérito indefinido</b>: visit<b>é</b>, visit<b>aste</b>, visit<b>ó</b>, visit<b>amos</b>, visit<b>aron</b>; com<b>í</b>, com<b>ió</b>, com<b>ieron</b>. O acento conta: <b>visito</b> (eu visito) não é <b>visitó</b> (ele, ela visitou). Os mais frequentes são irregulares: <b>fui, fue, fueron</b> (ir, e também ser), <b>hice, hizo, hicieron</b> (hacer). Os verbos em -gar ganham um u na 1ª pessoa: lle<b>gué</b>, ju<b>gué</b>. O tempo que fez: <b>hizo sol</b>, <b>hizo calor</b>, <b>llovió</b>.",
              pl:"Opowiadając o zakończonej podróży, hiszpański używa <b>pretérito indefinido</b>: visit<b>é</b>, visit<b>aste</b>, visit<b>ó</b>, visit<b>amos</b>, visit<b>aron</b>; com<b>í</b>, com<b>ió</b>, com<b>ieron</b>. Akcent ma znaczenie: <b>visito</b> (zwiedzam) to nie <b>visitó</b> (zwiedził, zwiedziła). Najczęstsze są nieregularne: <b>fui, fue, fueron</b> (ir, a także ser), <b>hice, hizo, hicieron</b> (hacer). Czasowniki na -gar mają u w 1. osobie: lle<b>gué</b>, ju<b>gué</b>. Pogoda: <b>hizo sol</b>, <b>hizo calor</b>, <b>llovió</b>.",
              ru:"Чтобы рассказать о законченной поездке, испанский использует <b>pretérito indefinido</b>: visit<b>é</b>, visit<b>aste</b>, visit<b>ó</b>, visit<b>amos</b>, visit<b>aron</b>; com<b>í</b>, com<b>ió</b>, com<b>ieron</b>. Ударение важно: <b>visito</b> (я посещаю) — это не <b>visitó</b> (он, она посетил(а)). Самые частые — неправильные: <b>fui, fue, fueron</b> (ir, а также ser), <b>hice, hizo, hicieron</b> (hacer). Глаголы на -gar получают u в 1-м лице: lle<b>gué</b>, ju<b>gué</b>. Погода: <b>hizo sol</b>, <b>hizo calor</b>, <b>llovió</b>.",
              de:"Um von einer abgeschlossenen Reise zu erzählen, benutzt das Spanische das <b>pretérito indefinido</b>: visit<b>é</b>, visit<b>aste</b>, visit<b>ó</b>, visit<b>amos</b>, visit<b>aron</b>; com<b>í</b>, com<b>ió</b>, com<b>ieron</b>. Der Akzent zählt: <b>visito</b> (ich besichtige) ist nicht <b>visitó</b> (er, sie hat besichtigt). Die häufigsten sind unregelmäßig: <b>fui, fue, fueron</b> (ir, auch ser), <b>hice, hizo, hicieron</b> (hacer). Verben auf -gar bekommen in der 1. Person ein u: lle<b>gué</b>, ju<b>gué</b>. Das Wetter: <b>hizo sol</b>, <b>hizo calor</b>, <b>llovió</b>."},

  danach:    {fr:"Regarde la frise : qu'est-ce qui s'est passé juste après la photo encadrée ?", en:"Look at the timeline: what happened right after the framed photo?", tr:"Zaman şeridine bak: çerçeveli fotoğraftan hemen sonra ne oldu?", uk:"Подивися на стрічку подій: що сталося одразу після виділеного фото?", fa:"به نوار زمانی نگاه کن: درست بعد از عکسِ قاب‌دار چه اتفاقی افتاد؟", ar:"انظر إلى الشريط الزمني: ماذا حدث مباشرة بعد الصورة المؤطرة؟", pt:"Olhe a linha do tempo: o que aconteceu logo depois da foto destacada?", pl:"Spójrz na oś czasu: co wydarzyło się zaraz po zaznaczonym zdjęciu?", ru:"Посмотри на ленту событий: что произошло сразу после выделенного фото?", de:"Sieh dir die Zeitleiste an: Was ist direkt nach dem markierten Foto passiert?"},

    ecran("rezeption", carteHTML(r), "", false, true);

    boutons($("choix"), melanger(opts), rep, ok => juger(ok, rep));
    return true;
  },
  // LE PETIT-DEJEUNER : « Ist das Frühstück bei Lena inklusive? » -- « Ja, ... » / « Nein, ... »
  petitdej(w){
    if (w && w.resa !== "petitdej") return false;
    const r = hasard(D.reservations), rep = L.rPetitdej(r.petitdej);
    motQ = w || motResa("petitdej"); tradQ = tradPetitdej(r.petitdej);
    ecran("carte", carteHTML(r), L.qPetitdej(r), true);
    tradsChoix = {}; tradsChoix[L.rPetitdej(!r.petitdej)] = tradPetitdej(!r.petitdej);
    boutons($("choix"), [L.rPetitdej(true), L.rPetitdej(false)], rep, ok => juger(ok, rep));
    return true;
  },
  // LA RESERVATION, VRAI OU FAUX : la chambre, les nuits ou le petit-dejeuner, un fait change une fois sur deux
  carteVF(w){
    if (w && !["doppel", "einzel", "chambre", "nuit", "petitdej", "buchen", "accueil"].includes(w.resa)) return false;
    const r = hasard(resasPour(w));
    const quoi = w ? ({doppel: "chambre", einzel: "chambre", chambre: "chambre", buchen: "chambre", accueil: "chambre", nuit: "nuit", petitdej: "petitdej"})[w.resa] : hasard(["chambre", "nuit", "petitdej"]);
    const vrai = Math.random() < 0.5;
    let phrase, juste;
    if (quoi === "chambre"){ juste = L.vfChambre(r, r.chambre); phrase = vrai ? juste : L.vfChambre(r, r.chambre === "doppel" ? "einzel" : "doppel"); }
    else if (quoi === "nuit"){ juste = L.vfNuits(r, r.nuits); phrase = vrai ? juste : L.vfNuits(r, r.nuits === 1 ? 2 : hasard([r.nuits - 1, r.nuits + 1])); }
    else { juste = L.vfPetitdej(r.petitdej); phrase = vrai ? juste : L.vfPetitdej(!r.petitdej); }
    motQ = w || motResa(quoi === "chambre" ? (Math.random() < 0.5 ? r.chambre : DE_APP ? "buchen" : "accueil") : quoi);
    tradQ = quoi === "petitdej" ? tradPetitdej(r.petitdej) : null;
    ecran("carteVF", carteHTML(r), phrase, true);
    const rep = vrai ? L.vrai : L.faux;
    boutons($("choix"), [L.vrai, L.faux], rep, ok => juger(ok, rep, juste));
    return true;
  }
};
// ESPAGNOL : la forme reguliere qu'un apprenant fabrique pour un irregulier (« hació », « llegé », « jugé ») ; rien
// quand elle est juste (le verbe est regulier) ou qu'elle n'a pas de sens (ir : pas de radical)
function regulier(inf, k, juste){
  const refl = inf.endsWith("se"), base = refl ? inf.slice(0, -2) : inf, rad = base.slice(0, -2), fin = base.slice(-2);
  if (!rad) return null;
  const f = (fin === "ar" ? ["é", "aste", "ó", "amos", "aron"] : ["í", "iste", "ió", "imos", "ieron"])[k];
  const t = (refl ? ["me", "te", "se", "nos", "se"][k] + " " : "") + rad + f;
  return t === juste ? null : t;
}
// « Was hat Anna zuerst gemacht? » / « ... zum Schluss? » -- la frise entiere ; les leurres loin du bout demande
function premierDernier(w){
  const der = w ? w.lien === 3 : Math.random() < 0.4, v = hasard(Object.keys(D.voyages)), d = etapesDu(v);
  const r = der ? d[d.length - 1] : d[0], s = d[0].sujet;
  const dit = e => e.sujet === s ? L.pron(e) : L.etape(e);
  const loin = der ? d.slice(0, d.length - 2) : d.slice(2);
  const rep = dit(r), opts = unique([rep, ...melanger(loin).slice(0, 3).map(dit)]);
  motQ = w || motLien(der ? 3 : 0); tradQ = tradEtape(r);
  ecran(der ? "zuletzt" : "zuerst", friseHTML(v), der ? L.zuletzt(s) : L.zuerst(s), true, true);
  tradsChoix = {}; d.forEach(e => { tradsChoix[dit(e)] = tradEtape(e); });
  const lien = cap(D.liens[APPRENDRE][der ? 3 : 0]);
  const phrase = DE_APP ? DE.v2(lien, r, DE.sujet(r.sujet, false)) : lien + ", " + ES.phrase(r, ES.sujet(r.sujet, false));
  boutons($("choix"), melanger(opts), rep, ok => juger(ok, rep, phrase));
  return true;
}
// « Es hat geregnet. » vrai ou faux sur la photo ; le faux n'est jamais un fait douteux
function meteoVF(w){
  const cand = ETAPES.filter(e => e.meteo && e.meteo.vrais.includes(w.meteo));
  if (!cand.length) return false;
  const e = hasard(cand), vrai = Math.random() < 0.5;
  const faux = FAITS().filter(x => !e.meteo.vrais.includes(x) && !e.meteo.douteux.includes(x));
  const phrase = D.meteo[vrai ? w.meteo : hasard(faux)][APPRENDRE];
  motQ = w; tradQ = tradMeteo(w.meteo);
  ecran("vraifaux", photo(e.cle), phrase, true);
  const rep = vrai ? L.vrai : L.faux;
  boutons($("choix"), [L.vrai, L.faux], rep, ok => juger(ok, rep, D.meteo[w.meteo][APPRENDRE]));
  return true;
}
// « Auf dem Bett liegt ein Hut. » vrai ou faux ; le faux : un objet de l'autre valise
function litVF(w){
  const cles = Object.keys(D.valises).filter(v => D.valises[v].vus.includes(w.objet));
  if (!cles.length) return false;
  const v = hasard(cles), autre = Object.keys(D.valises).find(x => x !== v), vrai = Math.random() < 0.5;
  const absents = D.valises[autre].vus.filter(x => !D.valises[v].vus.includes(x));
  const o = D.objets[w.objet], phrase = L.surLit(vrai ? o : D.objets[hasard(absents)]);
  motQ = w; tradQ = tradObjet(o);
  ecran("vraifaux", photo(v), phrase, true);
  const rep = vrai ? L.vrai : L.faux;
  boutons($("choix"), [L.vrai, L.faux], rep, ok => juger(ok, rep, L.surLit(o)));
  return true;
}
// les sortes de la langue apprise
const SORTES = Object.keys(EX).filter(x => DE_APP ? x !== "forma" : !["hilfsverb", "partizip", "satzbau"].includes(x));
// pour tests/themes_illustres.py : remettre dans l'ordre se resout en quatre gestes, pas en un
function testerOrdre(){
  const z = $("ordre"); if (!z) return "";
  const bs = Array.from(z.querySelectorAll("button")).sort((a, b) => a.dataset.rang - b.dataset.rang);

// ---------- la decouverte : les trois voyages, les valises, l'hotel ----------
const ONGLETS = {de: {anna: "Anna", mark: "Mark", familia: "Die Familie", valises: "Koffer", hotel: "Hotel"},
                 es: {anna: "Anna", mark: "Mark", familia: "La familia", valises: "Maletas", hotel: "Hotel"}};
function decouvrir(){
  $("compte").textContent = ""; $("barre").style.width = "0%";
  const dec = D.decouverte[DE_APP ? "de" : LATAM ? "latam" : "es"];
  const z = $("zone");
  z.innerHTML = '<div class="onglets" role="tablist">' + Object.keys(ONGLETS[APPRENDRE]).map(j => '<button type="button" role="tab" data-j="' + j + '" lang="' + APPRENDRE + '" dir="ltr">' + ONGLETS[APPRENDRE][j] + '</button>').join("") + '</div>'
              + '<div id="page"></div><p class="regle">' + isoler(T(DE_APP ? "regleDe" : "regleEs")) + '</p>';
  const montrer = e => {
    const ph = dec[e.cle], t = tradEtape(e) || (TR ? null : glose(motDe(e)));
    const temps = e.meteo ? e.meteo.vrais.map(f => D.meteo[f][APPRENDRE]).join(" ") : "";
    $("frise").querySelectorAll("button").forEach(b => b.classList.toggle("choisi", b.dataset.cle === e.cle));
    $("fiche").innerHTML = photo(e.cle) + '<div class="ligne"><div><div class="dit">' + cible(ph.texte) + '</div>' + (t ? traduction(t) : "")
                         + (temps ? '<div class="temps">' + cible(temps) + '</div>' : "") + '</div>'
                         + '<button type="button" class="ecoute" id="ecoute" aria-label="' + T("ecouter") + '">' + HP + '</button></div>';
    $("ecoute").addEventListener("click", () => dire(ph.texte + (temps ? " " + temps : "")));
    dire(ph.texte);
  };
  const voyage = v => {
    $("page").innerHTML = '<p class="consigne">' + isoler(T("intro")) + '</p><div class="enonce centre">' + cible(D.voyages[v].titre[APPRENDRE]) + '</div><div class="fiche" id="fiche"></div><div class="frise" id="frise"></div>';
    const fr = $("frise");
    etapesDu(v).forEach(e => {
      const b = document.createElement("button"); b.type = "button"; b.dataset.cle = e.cle;
      b.setAttribute("aria-label", dec[e.cle].texte);
      b.innerHTML = '<span class="num">' + (e.rang + 1) + '</span><img alt="" src="' + img(e.cle) + '">';
      b.addEventListener("click", () => montrer(e));
      fr.appendChild(b);
    });
    // la fiche s'ouvre sur la premiere etape, sans parler : le son ne vient que d'un geste
    const garde = dire; dire = () => {}; montrer(etapesDu(v)[0]); dire = garde;
  };
  const valises = () => {
    $("page").innerHTML = '<p class="consigne">' + isoler(T("introValise")) + '</p>' + Object.keys(D.valises).map(v =>
      '<div class="fiche">' + photo(v) + '<div class="puces" data-v="' + v + '"></div></div>').join("") + '<p class="retourMsg" id="msg"></p>';
    document.querySelectorAll(".puces").forEach(p => D.valises[p.dataset.v].vus.forEach(k => {
      const o = D.objets[k], b = document.createElement("button"); b.type = "button"; b.lang = APPRENDRE; b.dir = "ltr"; b.textContent = L.objet(o);
      b.addEventListener("click", () => { const t = tradObjet(o) || tradMot({mot: o[APPRENDRE][1], genre: o[APPRENDRE][0]});
        $("msg").className = "retourMsg"; $("msg").innerHTML = '<span class="phrase">' + cible(L.surLit(o)) + '</span>' + (t ? traduction(t) : ""); dire(L.objet(o)); });
      p.appendChild(b);
    }));
  };
  const hotel = () => {
    const r = D.reservations[0], dit = L.accueil(r);
    $("page").innerHTML = '<p class="consigne">' + isoler(T("introHotel")) + '</p>' + photo("mark-hotel") + carteHTML(r)
      + '<div class="fiche"><div class="ligne"><div><div class="dit">' + cible(dit) + '</div>' + (tradAccueil(r.chambre, r.nuits) ? traduction(tradAccueil(r.chambre, r.nuits)) : "")
      + '<div class="temps">' + cible(L.rPetitdej(r.petitdej)) + '</div></div><button type="button" class="ecoute" id="ecoute" aria-label="' + T("ecouter") + '">' + HP + '</button></div></div>';
    $("ecoute").addEventListener("click", () => dire(dit));
  };
  const onglet = j => {
    z.querySelectorAll(".onglets button").forEach(b => b.setAttribute("aria-selected", b.dataset.j === j));
    if (j === "valises") valises(); else if (j === "hotel") hotel(); else voyage(j);
  };
  z.querySelectorAll(".onglets button").forEach(b => b.addEventListener("click", () => onglet(b.dataset.j)));
  onglet("anna");
  const s = $("suite"); s.textContent = T("commencer"); s.hidden = false;
  s.onclick = () => { s.onclick = null; try { Voix.arreter(); } catch(e){} demarrer(); };
}

// LA PARTIE (3 nov. 2026, « le tirage suit les mots ») : recopie de familia.html et journee.html (visuel/THEMES-ILLUSTRES.md :
// ces fonctions sont identiques d'un theme a l'autre). La cle d'une question compte aussi ses choix : la meme photo de
// valise avec un autre objet a trouver est une autre question.
const NEUFS_MAX = Q.get("seance") === "1" ? 3 : 10;
let vus = new Set(), sorteCourante = null, derniereSorte = null;
function cleQuestion(){
  const z = $("zone"), en = z.querySelector(".enonce");
  const choix = Array.from(z.querySelectorAll("#choix button, .ordre button .t")).map(b => b.textContent).sort().join(",");
  return sorteCourante + "|" + (en ? en.textContent : "") + "|" + choix + "|" + Array.from(z.querySelectorAll("img")).map(i => i.getAttribute("src")).sort().join(",") + "|" + (z.querySelector(".marque img") || {getAttribute: () => ""}).getAttribute("src");
}
function montrer(){
  repondu = false; $("suite").hidden = true; choixFaux = null;
  $("compte").textContent = (rang + 1) + " / " + file.length;
  $("barre").style.width = (rang / file.length * 100) + "%";
  const essai = (w, strict) => {
    const autres = melanger(SORTES.filter(x => x !== derniereSorte));
    for (const so of autres){
      for (let k = 0; k < 25; k++){
        motQ = null; tradQ = null; sorteCourante = so;
        if (!EX[so](w)) break;
        if (!vus.has(cleQuestion())) return so;
      }
    }
    if (strict) return null;
    if (derniereSorte) for (let k = 0; k < 25; k++){           // la meme sorte, avec une question fraiche
      motQ = null; tradQ = null; sorteCourante = derniereSorte;
      if (!EX[derniereSorte](w)) break;
      if (!vus.has(cleQuestion())) return derniereSorte;
    }
    for (const so of autres.concat(derniereSorte ? [derniereSorte] : [])){   // tout est deja vu : n'importe laquelle
      motQ = null; tradQ = null; sorteCourante = so;
      if (EX[so](w)) return so;
    }
    return null;
  };
  let fait = essai(file[rang], true);
  for (let j = rang + 1; !fait && j < file.length; j++){
    fait = essai(file[j], true);
    if (fait) [file[rang], file[j]] = [file[j], file[rang]];
  }
  if (!fait) fait = essai(file[rang], false);
  vus.add(cleQuestion()); derniereSorte = fait;
  window.scrollTo(0, 0); document.body.scrollTop = 0;
}
function fin(){
  $("barre").style.width = "100%"; $("compte").textContent = file.length + " / " + file.length; $("suite").hidden = true;
  $("zone").innerHTML = '<div class="fin"><div class="score">' + T("score", {b: bons, n: file.length}) + '</div></div>' + boutonsFin();
  brancherEncore();
  $("terminer").addEventListener("click", () => parler("fini", {bons, faits: file.length}));
}
// plus rien de du ni de nouveau : la partie le dit, et ne repose pas des mots deja sus
function toutRevu(prochaine){
  $("barre").style.width = "100%"; $("compte").textContent = ""; $("suite").hidden = true;
  const quand = Tirage.revu(prochaine, LANGUE);
  $("zone").innerHTML = '<div class="fin"><div class="score">' + (TIRAGE_TEXTES.revu[LANGUE] || TIRAGE_TEXTES.revu.fr) + '</div>'
    + (quand ? '<p class="consigne">' + (TIRAGE_TEXTES.prochaine[LANGUE] || TIRAGE_TEXTES.prochaine.fr).replace("{d}", quand) + '</p>' : "")
    + '</div>' + boutonsFin();
  brancherEncore();
  $("terminer").addEventListener("click", () => parler("fini", {bons: 0, faits: 0}));
}
// « Encore des questions » : en fin de partie et quand tout est revu, jamais dans la seance (elle a sa longueur)
const boutonEncore = () => Q.get("seance") === "1" ? "" : '<button type="button" id="encore">' + (TIRAGE_TEXTES.encore[LANGUE] || TIRAGE_TEXTES.encore.fr) + '</button>';
const boutonsFin = () => '<div class="bas">' + boutonEncore() + '<button type="button" id="terminer">' + T("terminer") + '</button></div>';
function brancherEncore(){ const b = $("encore"); if (b) b.addEventListener("click", encoreDesQuestions); }
async function encoreDesQuestions(){
  const mots = motsDuTheme();
  file = Tirage.supplement(mots, await Tirage.demander(mots), NB); rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(null);
  montrer();
}
async function demarrer(){
  const mots = motsDuTheme();
  const plan = Tirage.plan(mots, await Tirage.demander(mots), NB, NEUFS_MAX);
  file = plan.file; rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(plan.prochaine);
  montrer();
}
$("suite").addEventListener("click", () => { if (!file.length) return; rang++; if (rang >= file.length) fin(); else montrer(); });
$("retour").addEventListener("click", () => parler("fermer"));
$("retour").setAttribute("aria-label", T("retourAria"));
$("titre").textContent = T("titre");
document.title = T("titre");
fetch("vacances/vacances.json?v=1").then(r => r.json()).then(d => {
  D = d;
  const rangs = {};
  ETAPES = d.etapes.map(e => Object.assign({}, e, {rang: rangs[e.voyage] = (e.voyage in rangs) ? rangs[e.voyage] + 1 : 0}));
  if (Q.get("seance") === "1") demarrer(); else decouvrir();
});
