<!--
  L'ORAL DU TELC DEUTSCH A2·B1 AVEC MARK ET ANNA (6 nov. 2026, session « telc : Parler + examen blanc », decision de
  Jacques du 6 nov. : le telc en quatre sessions paralleles). Le FORMAT de l'epreuve (preparation-examens/FORMAT-TELC.md,
  releve dans l'Uebungstest gratuit du telc) : environ 15 minutes, a deux, deux examinateurs, sans image et sans
  preparation, sauf une minute de reflexion avant la partie 3.
    Teil 1A  Sich vorstellen        ≈ 1,5 min    } 6 points (critere I, 1A et 1B ensemble)
    Teil 1B  Anschlussfragen        ≈ 1 min      }
    Teil 2   Gemeinsam etwas planen ≈ 5 min a deux, 12 points
    Teil 3   Meinung begruenden     ≈ 5 min a deux, 12 points
  plus trois criteres d'ensemble sur 10 : prononciation et intonation, correction, etendue. Total : 60.
  TOUS LES TEXTES SONT A NOUS : sujets, repliques, reponses modeles. Rien du telc n'est repris, sauf le format.

  RIEN AU-DESSUS DU B1 (retour d'une testeuse B1 du 6 nov., journal 86595a5 : des reponses C1 dans un oral B1
  decouragent). Chaque exercice a deux reponses modeles, une A2 et une B1, et aucune autre. tests/telc_oral.py le
  verifie.

  LE MOTEUR EST CELUI DE L'ORAL DU DTZ (visuel/prototype/dtz-oral.html sur main, organisation decidee le 4 nov. :
  « Meme organisation pour le futur bloc telc ») : la liste des sections, une page par exercice avec ses points,
  le recapitulatif de fin de section, l'examen complet. Copie, pas reecriture : SECTIONS, exercice(), points(),
  apres(), recap(), fin(), resultatSection(), l'etat ETAT (autre CLE_ETAT), le micro, la voix, la video.
  Ce qui est propre au telc : les quatre sections, les sujets (trois a planifier, trois a debattre), les juges
  p3a / p3b (l'avis, la reaction), Mark qui defend le cote oppose, la minute de reflexion, le bareme sur 60.

  LES VIDEOS ET LES VOIX DU DTZ SONT REPRISES TELLES QUELLES (aucune depense) : les repliques qui gardent le meme
  texte allemand gardent leur id et donc leur clip (../dtz/video/<id>.mp4) ou leur voix (../dtz/voix/<id>.mp3) :
  l'accueil d'Anna, la presentation de Mark, les quatre questions de la partie 1B, les reactions de Mark et les trois
  verdicts d'Anna. Les repliques nouvelles (id « t_... ») passent par la voix du telephone ; leurs fichiers, s'ils
  sont un jour produits, se poseront au meme endroit sans changer de code (accord de Jacques necessaire).

  LE VERDICT EST UNE ESTIMATION, et la page le dit : l'app mesure le contenu (critere I), pas la prononciation, la
  correction ni l'etendue (criteres II a IV), qu'elle suppose au meme niveau.

  Parametres : lang (fr, en ; les autres langues retombent sur le francais), nuit=1, depuis=telc (le « ‹ » de la liste
  ramene a telc.html), examen=blanc (ouverte par l'examen blanc de telc.html : l'examen complet tout de suite, puis
  retour au verdict), rapide=1 (minute de reflexion raccourcie, pour les essais).
-->

    "Qu’est-ce qu’on apporte ? Moi, je prends des outils, pour le lit et les armoires. Et toi, tu apportes quoi ?",
    "What should we bring? I'll take some tools, for the bed and the wardrobes. What will you bring?"],
  t_umzug_4: ["mark", "Umziehen macht hungrig. Was machen wir mit dem Essen? Vielleicht bestellen wir Pizza für alle. Oder hast du eine andere Idee?",
    "Déménager, ça donne faim. On fait comment pour manger ? On commande peut-être des pizzas pour tout le monde. Ou tu as une autre idée ?",
    "Moving makes you hungry. What do we do about food? Maybe we order pizza for everyone. Or do you have another idea?"],
  t_umzug_5: ["mark", "Und am Abend, wenn alles fertig ist? Wir könnten zusammen auf die neue Wohnung anstoßen. Was hältst du davon?",
    "Et le soir, quand tout est fini ? On pourrait trinquer ensemble au nouvel appartement. Qu’en dis-tu ?",
    "And in the evening, when everything is done? We could raise a glass together to the new flat. What do you think of that?"],
  t_plan_geschenk: ["anna", "Vielen Dank. Jetzt kommt Teil zwei. Ihre Kollegin Sara hat nächste Woche Geburtstag, und Sie möchten ihr zusammen ein Geschenk machen. Auf dem Blatt stehen ein paar Punkte. Machen Sie Vorschläge und reagieren Sie auf die Vorschläge Ihres Partners. Herr Garnier, fangen Sie bitte an.",
    "Merci beaucoup. Voici la partie deux. Votre collègue Sara a son anniversaire la semaine prochaine, et vous voulez lui faire un cadeau ensemble. Sur la feuille, il y a quelques points. Faites des propositions et réagissez à celles de votre partenaire. Monsieur Garnier, commencez, s’il vous plaît.",
    "Thank you very much. Now comes part two. Your colleague Sara has her birthday next week, and you want to give her a present together. There are a few points on the sheet. Make suggestions and react to your partner's suggestions. Mr Garnier, please begin."],
  t_geschenk_1: ["mark", "Also, was schenken wir Sara? Sie liest sehr gern. Wie wäre es mit einem Buch?",
    "Alors, qu’est-ce qu’on offre à Sara ? Elle adore lire. Que dirais-tu d’un livre ?",
    "So, what shall we give Sara? She loves reading. How about a book?"],
  t_geschenk_2: ["mark", "Und wie viel Geld geben wir aus? Ich denke, jeder gibt zehn Euro. Ist das okay für dich?",
    "Et on dépense combien ? Je pense que chacun donne dix euros. Ça te va ?",
    "And how much shall we spend? I think everyone gives ten euros. Is that okay for you?"],
  t_geschenk_3: ["mark", "Wo kaufen wir das Geschenk? Ich kenne eine kleine Buchhandlung in der Nähe vom Büro. Oder bestellen wir es lieber im Internet?",
    "On achète le cadeau où ? Je connais une petite librairie près du bureau. Ou on préfère le commander sur Internet ?",
    "Where shall we buy the present? I know a little bookshop near the office. Or would we rather order it online?"],
  t_geschenk_4: ["mark", "Wann geben wir ihr das Geschenk? Vielleicht am Montag in der Mittagspause. Was meinst du?",
    "Quand est-ce qu’on lui donne le cadeau ? Peut-être lundi, à la pause de midi. Qu’en penses-tu ?",
    "When do we give her the present? Maybe on Monday in the lunch break. What do you think?"],
  t_geschenk_5: ["mark", "Wir brauchen auch noch eine Karte. Schreibst du sie, oder soll ich das machen?",
    "Il nous faut aussi une carte. Tu l’écris, ou je m’en occupe ?",
    "We also need a card. Will you write it, or shall I do it?"],

  // ---- Teil 3, ecrit pour le telc (voix du telephone)
  t_avis_auto: ["anna", "Danke schön. Jetzt kommt der letzte Teil. Es geht um die Frage: Braucht man in einer großen Stadt wie Berlin ein eigenes Auto? Sagen Sie Ihre Meinung und begründen Sie sie. Reagieren Sie auch auf die Meinung Ihres Partners. Sie haben jetzt eine Minute Zeit zum Nachdenken.",
    "Merci. Voici la dernière partie. La question est : dans une grande ville comme Berlin, a-t-on besoin d’une voiture à soi ? Donnez votre avis et justifiez-le. Réagissez aussi à l’avis de votre partenaire. Vous avez maintenant une minute pour réfléchir.",
    "Thank you. Now comes the last part. The question is: in a big city like Berlin, do you need a car of your own? Give your opinion and explain it. React to your partner's opinion too. You now have one minute to think."],
  t_avis_lernen: ["anna", "Danke schön. Jetzt kommt der letzte Teil. Es geht um die Frage: Lernt man eine Sprache besser in einem Kurs oder allein mit dem Handy? Sagen Sie Ihre Meinung und begründen Sie sie. Reagieren Sie auch auf die Meinung Ihres Partners. Sie haben jetzt eine Minute Zeit zum Nachdenken.",
    "Merci. Voici la dernière partie. La question est : apprend-on mieux une langue dans un cours ou seul avec son téléphone ? Donnez votre avis et justifiez-le. Réagissez aussi à l’avis de votre partenaire. Vous avez maintenant une minute pour réfléchir.",
    "Thank you. Now comes the last part. The question is: do you learn a language better in a course or on your own with your phone? Give your opinion and explain it. React to your partner's opinion too. You now have one minute to think."],
  t_avis_land: ["anna", "Danke schön. Jetzt kommt der letzte Teil. Es geht um die Frage: Lebt man besser in der Stadt oder auf dem Land? Sagen Sie Ihre Meinung und begründen Sie sie. Reagieren Sie auch auf die Meinung Ihres Partners. Sie haben jetzt eine Minute Zeit zum Nachdenken.",
    "Merci. Voici la dernière partie. La question est : vit-on mieux en ville ou à la campagne ? Donnez votre avis et justifiez-le. Réagissez aussi à l’avis de votre partenaire. Vous avez maintenant une minute pour réfléchir.",
    "Thank you. Now comes the last part. The question is: is life better in the city or in the countryside? Give your opinion and explain it. React to your partner's opinion too. You now have one minute to think."],
  t_a_los: ["anna", "So, die Minute ist um. Sie fangen bitte an.", "Voilà, la minute est passée. Commencez, s’il vous plaît.", "Right, the minute is up. Please begin."],
  // Mark defend le cote oppose : « gegenA » repond a un avis du cote A, « gegenB » a un avis du cote B
  t_auto_gegenA: ["mark", "Ich sehe das ein bisschen anders. In Berlin fahren Busse und Bahnen fast überall hin, und ein Parkplatz ist teuer und schwer zu finden. Ich habe zum Beispiel kein Auto, und ich komme mit dem Fahrrad überall hin. Was sagst du dazu?",
    "Moi, je vois ça un peu autrement. À Berlin, les bus et les trains vont presque partout, et une place de parking est chère et difficile à trouver. Moi, par exemple, je n’ai pas de voiture, et je vais partout à vélo. Qu’est-ce que tu en dis ?",
    "I see it a bit differently. In Berlin, buses and trains go almost everywhere, and a parking space is expensive and hard to find. I don't have a car, for example, and I get everywhere by bike. What do you say to that?"],
  t_auto_gegenB: ["mark", "Da bin ich nicht ganz deiner Meinung. Mit Kindern oder mit vielen Einkäufen ist ein Auto sehr praktisch. Meine Kollegin wohnt zum Beispiel am Stadtrand, und ohne Auto braucht sie über eine Stunde zur Arbeit. Was meinst du?",
    "Là, je ne suis pas tout à fait d’accord avec toi. Avec des enfants ou avec beaucoup de courses, une voiture est très pratique. Ma collègue, par exemple, habite en périphérie, et sans voiture elle met plus d’une heure pour aller au travail. Qu’en penses-tu ?",
    "I don't quite agree with you there. With children or with a lot of shopping, a car is very practical. My colleague, for example, lives on the edge of the city, and without a car it takes her over an hour to get to work. What do you think?"],
  t_lernen_gegenA: ["mark", "Ich sehe das anders. Mit einer App kann ich lernen, wann ich will: im Bus, in der Pause oder am Abend. Und ein Kurs kostet viel Geld. Ich lerne zum Beispiel gerade Spanisch, jeden Morgen zehn Minuten mit dem Handy, und das klappt gut. Was sagst du dazu?",
    "Moi, je vois ça autrement. Avec une appli, je peux apprendre quand je veux : dans le bus, à la pause ou le soir. Et un cours coûte cher. Moi, par exemple, j’apprends l’espagnol en ce moment, dix minutes chaque matin avec mon téléphone, et ça marche bien. Qu’est-ce que tu en dis ?",
    "I see it differently. With an app I can learn whenever I want: on the bus, during a break or in the evening. And a course costs a lot of money. For example, I'm learning Spanish at the moment, ten minutes every morning on my phone, and it works well. What do you say to that?"],
  t_lernen_gegenB: ["mark", "Da bin ich nicht ganz deiner Meinung. Allein mit dem Handy spricht man fast nie. Im Kurs muss man sprechen, und die Lehrerin korrigiert die Fehler. Eine Freundin von mir hat zum Beispiel in ihrem Kurs viele nette Leute kennengelernt. Was meinst du?",
    "Là, je ne suis pas tout à fait d’accord avec toi. Seul avec son téléphone, on ne parle presque jamais. En cours, on est obligé de parler, et la prof corrige les fautes. Une amie à moi, par exemple, a rencontré plein de gens sympas dans son cours. Qu’en penses-tu ?",
    "I don't quite agree with you there. On your own with your phone, you almost never speak. In a course you have to speak, and the teacher corrects your mistakes. A friend of mine, for example, met lots of nice people in her course. What do you think?"],
  t_land_gegenA: ["mark", "Ich sehe das anders. In der Stadt ist es laut, und die Mieten sind sehr hoch. Auf dem Land hat man Ruhe, Natur und oft einen Garten. Ich war zum Beispiel letzten Sommer zwei Wochen in einem kleinen Dorf, und ich habe so gut geschlafen wie nie. Was sagst du dazu?",
    "Moi, je vois ça autrement. En ville, c’est bruyant, et les loyers sont très élevés. À la campagne, on a le calme, la nature et souvent un jardin. Par exemple, l’été dernier, j’ai passé deux semaines dans un petit village, et j’ai dormi comme jamais. Qu’est-ce que tu en dis ?",
    "I see it differently. The city is noisy, and the rents are very high. In the countryside you have peace and quiet, nature and often a garden. Last summer, for example, I spent two weeks in a small village, and I slept better than ever. What do you say to that?"],
  t_land_gegenB: ["mark", "Da bin ich nicht ganz deiner Meinung. Auf dem Land fährt der Bus vielleicht nur zweimal am Tag, und ohne Auto ist man nicht flexibel. In der Stadt sind Arbeit, Ärzte und Geschäfte ganz nah. Ich gehe zum Beispiel zu Fuß zur Arbeit und abends noch ins Kino. Was meinst du?",
    "Là, je ne suis pas tout à fait d’accord avec toi. À la campagne, le bus passe peut-être deux fois par jour, et sans voiture on n’est pas libre de ses mouvements. En ville, le travail, les médecins et les magasins sont tout près. Moi, par exemple, je vais au travail à pied, et le soir je vais encore au cinéma. Qu’en penses-tu ?",
    "I don't quite agree with you there. In the countryside the bus may only run twice a day, and without a car you're not flexible. In the city, work, doctors and shops are all close by. I walk to work, for example, and still go to the cinema in the evening. What do you think?"],
  t_m_schluss: ["mark", "Okay, wir sehen das nicht ganz gleich, aber ich verstehe deine Argumente gut.",
    "D’accord, on ne voit pas ça tout à fait pareil, mais je comprends bien tes arguments.",
    "Okay, we don't see it quite the same way, but I understand your arguments well."]
};

  fest: { titre: { fr: "une fête de fin de cours", en: "an end-of-course party" }, intro: "t_plan_fest",

        b1: ["Der letzte Kurstag ist gut, aber nach dem Unterricht sind viele müde. Wie wäre es mit Freitagabend? Dann können alle länger bleiben.", "Le dernier jour du cours, c’est bien, mais après la leçon, beaucoup sont fatigués. Que dirais-tu du vendredi soir ? Comme ça, tout le monde peut rester plus longtemps.", "The last day of the course is good, but after class a lot of people are tired. How about Friday evening? Then everyone can stay longer."] },
      { m: "t_fest_2", a2: ["Ich möchte lieber ins Café gehen. Das ist schön.", "Je préférerais aller au café. C’est joli.", "I'd rather go to the café. It's nice."],
        b1: ["Ein Café ist gemütlich, aber für so viele Leute ist es teuer. Ich schlage vor, wir bleiben im Kursraum. Dort können wir auch Musik hören.", "Un café, c’est agréable, mais pour autant de monde, c’est cher. Je propose qu’on reste dans la salle de cours. Là, on peut aussi écouter de la musique.", "A café is cosy, but for so many people it's expensive. I suggest we stay in the classroom. We can listen to music there too."] },

      { m: "t_fest_4", a2: ["Musik ist gut. Ein Spiel ist auch lustig.", "La musique, c’est bien. Un jeu, c’est drôle aussi.", "Music is good. A game is fun too."],
        b1: ["Musik finde ich super. Wir könnten auch ein kleines Quiz über unseren Kurs machen, das macht bestimmt Spaß. Hast du Lust, die Fragen mit mir zu schreiben?", "La musique, je trouve ça super. On pourrait aussi faire un petit quiz sur notre cours, ce sera sûrement drôle. Tu as envie d’écrire les questions avec moi ?", "I think music is great. We could also do a little quiz about our course, that would definitely be fun. Do you fancy writing the questions with me?"] },
      { m: "t_fest_5", a2: ["Ja, Blumen sind gut. Ich kaufe sie.", "Oui, des fleurs, c’est bien. Je les achète.", "Yes, flowers are good. I'll buy them."],

    blatt: "Ihre Freundin Lena zieht am Samstag in eine neue Wohnung. Sie möchten ihr zusammen helfen.",

    tours: [

        b1: ["Acht Uhr ist mir ein bisschen zu früh, weil ich am Samstag erst um halb acht aufstehe. Wie wäre es mit neun Uhr? Dann bin ich sicher pünktlich.", "Huit heures, c’est un peu tôt pour moi, parce que le samedi je ne me lève qu’à sept heures et demie. Que dirais-tu de neuf heures ? Comme ça, je serai sûrement à l’heure.", "Eight is a bit early for me, because on Saturdays I don't get up until half past seven. How about nine? Then I'll definitely be on time."] },
      { m: "t_umzug_2", a2: ["Ein Transporter ist gut. Ich kann fahren.", "Une camionnette, c’est bien. Je peux conduire.", "A van is good. I can drive."],
        b1: ["Ein Transporter ist eine gute Idee, aber er kostet ziemlich viel. Vielleicht kann uns jemand ein großes Auto leihen. Ich frage heute Abend meinen Nachbarn.", "Une camionnette, c’est une bonne idée, mais ça coûte assez cher. Quelqu’un peut peut-être nous prêter une grande voiture. Je demande à mon voisin ce soir.", "A van is a good idea, but it costs quite a lot. Maybe someone can lend us a big car. I'll ask my neighbour this evening."] },
      { m: "t_umzug_3", a2: ["Ich bringe Kartons mit. Ich habe viele.", "J’apporte des cartons. J’en ai beaucoup.", "I'll bring boxes. I have a lot."],
        b1: ["Gut, dann nehme ich Kartons und Klebeband mit. Ich habe noch viele vom letzten Umzug. Brauchen wir auch Decken für die Möbel?", "Bien, alors je prends des cartons et du ruban adhésif. Il m’en reste beaucoup de mon dernier déménagement. Est-ce qu’il nous faut aussi des couvertures pour les meubles ?", "Good, then I'll bring boxes and tape. I still have lots from my last move. Do we need blankets for the furniture too?"] },
      { m: "t_umzug_4", a2: ["Pizza ist gut. Ich bezahle die Getränke.", "Des pizzas, c’est bien. Je paie les boissons.", "Pizza is good. I'll pay for the drinks."],
        b1: ["Pizza ist praktisch, aber ich würde lieber belegte Brötchen machen, das ist billiger und gesünder. Ich kann sie am Morgen vorbereiten.", "Les pizzas, c’est pratique, mais je préférerais faire des petits pains garnis, c’est moins cher et plus sain. Je peux les préparer le matin.", "Pizza is practical, but I'd rather make filled rolls, it's cheaper and healthier. I can prepare them in the morning."] },
      { m: "t_umzug_5", a2: ["Ja, gern. Ich bringe Saft mit.", "Oui, volontiers. J’apporte du jus.", "Yes, I'd like that. I'll bring some juice."],
        b1: ["Das finde ich schön, aber nach so einem Tag sind alle bestimmt sehr müde. Vielleicht trinken wir nur kurz etwas zusammen und feiern dann am nächsten Wochenende richtig.", "Je trouve ça bien, mais après une journée pareille, tout le monde sera sûrement très fatigué. On peut peut-être juste boire un verre ensemble et faire vraiment la fête le week-end suivant.", "I like that, but after a day like that everyone will surely be very tired. Maybe we just have a quick drink together and then celebrate properly the next weekend."] }

function crit(label, ok){ return { label, ok: !!ok }; }

  p3b(t){

    crit(u("c_t_phrase", {n: nbMots(t)}), nbMots(t) >= 4),
    crit(u("c_t_propose"), a(PROPOSE, t)),
    crit(u("c_t_reagis"), a(REAGIT, t)),
    crit(u("c_t_question"), a(DEMANDE, t)),
    crit(u("c_t_raison"), a(LIENS, t))
  ];
}
// Le cote que l'eleve a pris dans la partie 3 : celui dont les mots reviennent le plus ; a egalite, au hasard.
function coteDe(sujet, t){
  const n = norm(t);
  const sa = (n.match(sujet.reA) || []).length, sb = (n.match(sujet.reB) || []).length;
  return sa > sb ? "A" : sb > sa ? "B" : (Math.random() < 0.5 ? "A" : "B");
}

// ---------------------------------------------------------------- la voix
const VOIX_A_FUIR = ["albert","bad news","bahh","bells","boing","bubbles","cellos","good news","jester","organ","superstar","trinoids","whisper","wobble","zarvox","deranged","hysterical","junior","ralph","kathy","fred","princess","bruce","agnes","vicki","eddy","flo","grandma","grandpa","reed","rocko","sandy","shelley"];
let ENREGISTRE = {};
fetch(MEDIAS + "voix/manifest.json", {cache: "no-store"}).then(r => r.ok ? r.json() : {}).then(m => { ENREGISTRE = m || {}; }).catch(() => {});
let voixDe = { anna: null, mark: null };
function choisirVoix(){
  const toutes = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  const de = toutes.filter(v => /^de/i.test(v.lang) && !VOIX_A_FUIR.some(f => (v.name || "").toLowerCase().includes(f)));
  const trouve = re => de.find(v => re.test(v.name));
  voixDe.anna = trouve(/anna|petra|helena|katja|marlene|google deutsch|hedda|female|frau/i) || de[0] || null;
  voixDe.mark = trouve(/markus|yannick|martin|conrad|stefan|hans|killian|male|mann/i) || de.find(v => v !== voixDe.anna) || de[0] || null;
}
try{ choisirVoix(); if (window.speechSynthesis) speechSynthesis.onvoiceschanged = choisirVoix; }catch(e){}
let audioEnCours = null;
function taire(){
  try{ if (audioEnCours){ audioEnCours.pause(); audioEnCours = null; } }catch(e){}
  try{ if (window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
}
// La voix du telephone pour un texte libre (les reponses modeles qui n'ont pas de fichier).
function direTexte(texte, qui){
  return new Promise(fini => {
    taire();
    if (!window.speechSynthesis){ fini(); return; }
    const u0 = new SpeechSynthesisUtterance(texte);
    u0.lang = "de-DE"; u0.rate = 0.92;
    const v = voixDe[qui]; if (v) u0.voice = v;
    if (voixDe.anna === voixDe.mark) u0.pitch = qui === "mark" ? 0.85 : 1.1;
    u0.onend = u0.onerror = () => fini();
    speechSynthesis.speak(u0);
    setTimeout(fini, 400 + texte.length * 110);   // filet : certains moteurs n'appellent jamais onend
  });
}
// LA VIDEO D'ABORD (comme l'oral du DTZ) : une replique qui a son clip (manifeste : {video: 1}) se joue dans le cadre
// de sa bulle ; sinon sa voix enregistree ({son: 1}) ; sinon la voix du telephone.
function dire(id, cadre){
  return new Promise(fini => {
    taire();
    const [qui, texte] = L[id];
    const e = ENREGISTRE[id] || {};
    if (e.video && cadre){
      const v = cadre.querySelector("video");
      const lancer = cadre.querySelector(".lancer");
      audioEnCours = v;
      let rendu = false;
      const fin = () => { if (rendu) return; rendu = true; lancer.hidden = true; fini(); };
      v.onended = fin; v.onerror = fin;
      lancer.onclick = () => { lancer.hidden = true; v.play().catch(fin); };
      try{ v.currentTime = 0; }catch(err){}
      v.play().then(() => { lancer.hidden = true; }).catch(() => { lancer.hidden = false; });
      return;
    }
    if (e === 1 || e.son){
      const au = new Audio(MEDIAS + "voix/" + id + ".mp3");
      audioEnCours = au;
      au.onended = au.onerror = () => fini();
      au.play().catch(() => fini());
      return;
    }
    direTexte(texte, qui).then(fini);
  });
}

// ---------------------------------------------------------------- le micro
// ecouter() rend un objet { arreter() } ; surTexte(texte) a chaque resultat ; surFin(texte) a la fin (null : pas de micro).
const Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
let ecouteApp = null;   // la reponse de l'app, quand c'est elle qui ecoute
window.addEventListener("message", e => {
  const d = e.data;
  if (!d || d.source !== "wortando-app" || d.type !== "micro" || !ecouteApp) return;
  if (d.etat === "texte") ecouteApp.surTexte(d.texte || "");
  else if (d.etat === "fin") { const f = ecouteApp; ecouteApp = null; f.surFin(d.texte || ""); }
  else if (d.etat === "indisponible") { const f = ecouteApp; ecouteApp = null; f.surFin(null); }
});
function ecouter(surTexte, surFin){
  if (Reco){
    let actif = true, finals = "", provisoire = "", reco = null, fini = false;
    const total = () => (finals + " " + provisoire).replace(/\s+/g, " ").trim();
    const terminer = () => { if (fini) return; fini = true; surFin(total()); };
    const lancer = () => {
      reco = new Reco();
      reco.lang = "de-DE"; reco.continuous = true; reco.interimResults = true;
      reco.onresult = ev => {
        provisoire = "";
        for (let i = ev.resultIndex; i < ev.results.length; i++){
          const r = ev.results[i];
          if (r.isFinal) finals += " " + r[0].transcript; else provisoire += " " + r[0].transcript;
        }
        surTexte(total());
      };
      reco.onerror = ev => { if (ev && (ev.error === "not-allowed" || ev.error === "service-not-allowed")){ actif = false; if (!finals){ fini = true; surFin(null); } } };
      // Une longue reponse : le moteur s'arrete apres un silence, on le relance tant qu'on ecoute.
      reco.onend = () => { if (actif) { try{ lancer(); }catch(e){ terminer(); } } else setTimeout(terminer, 150); };
      reco.start();
    };
    try{ lancer(); }catch(e){ setTimeout(() => surFin(null), 0); return { arreter(){} }; }
    return { arreter(){ actif = false; try{ reco.stop(); }catch(e){} setTimeout(terminer, 1800); } };
  }
  if (DANS_APP){
    ecouteApp = { surTexte, surFin };
    parler("micro", { action: "start", langue: "de-DE" });
    return { arreter(){ parler("micro", { action: "stop" }); } };
  }
  setTimeout(() => surFin(null), 0);
  return { arreter(){} };
}

// Le tour de parole de l'eleve : micro, texte entendu, ou saisie au clavier.
function aToi(consigne, limiteS, quandFini){
  const z = el("div", "micro-zone");
  const m = el("button", "micro", "🎙"); m.type = "button"; m.setAttribute("aria-label", u("parler"));
  const info = el("div", "micro-info", consigne);
  const entendu = el("div", "entendu"); entendu.lang = "de"; entendu.hidden = true;
  const clavier = el("button", "lien", u("ecrire_place")); clavier.type = "button";
  z.append(m, info, entendu, clavier);
  zone.appendChild(z);
  let ec = null, debut = 0, minuterie = null, coupe = null, rendu = false;
  const rendre = t => { if (rendu) return; rendu = true; z.remove(); quandFini(t || ""); };
  const arreter = () => { if (!ec) return; clearInterval(minuterie); clearTimeout(coupe); m.classList.remove("ecoute"); m.textContent = "…"; m.disabled = true; info.textContent = u("reflechis"); ec.arreter(); ec = null; };
  m.onclick = () => {
    if (ec){ arreter(); return; }
    taire();
    entendu.hidden = false; entendu.textContent = "";
    m.classList.add("ecoute"); m.textContent = "■"; debut = Date.now();
    const tic = () => { const s = Math.floor((Date.now() - debut) / 1000); info.textContent = u("ecoute_tic", {t: Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0")}); };
    tic(); minuterie = setInterval(tic, 500);
    coupe = setTimeout(arreter, limiteS * 1000);
    ec = ecouter(t => { entendu.textContent = t; }, t => {
      clearInterval(minuterie); clearTimeout(coupe); ec = null;
      if (t === null){ m.classList.remove("ecoute"); m.textContent = "🎙"; m.disabled = false; info.textContent = u("micro_ko"); clavier.click(); return; }
      rendre(t);
    });
  };
  clavier.onclick = () => {
    if (ec) return;
    clavier.remove();
    const ta = el("textarea"); ta.lang = "de"; ta.placeholder = u("placeholder");
    const ok = el("button", "lien", u("valider")); ok.type = "button";
    ok.onclick = () => { if (ta.value.trim()) rendre(ta.value.trim()); };
    z.append(ta, ok); ta.focus();
  };
}

const QUESTIONS_1B = ["a_frage_familie", "a_frage_beruf", "a_frage_freizeit", "a_frage_deutsch"];

  { cle: "p1a", teil: "Teil 1A", titre: "s1", de: "Sich vorstellen" },

// Les exercices d'une section ; ceux de la partie 2 viennent du sujet choisi.
function exercices(s){
  const cle = SECTIONS[s].cle;
  if (cle === "p1a") return [
    { titre: u("ex_ecoute"), modele: true, jouer: [["a_bienvenue"], ["m_vorstellung"]], feuille: "stichworte" },
    { titre: u("ex_atoi"), jouer: [["a_danke_mark"]], feuille: "stichworte", juge: "p1a", limite: 120, consigne: u("cons_p1a") }
  ];
  if (cle === "p1b") return [
    { titre: u("ex_q1"), question: 0, juge: "p1b", limite: 80, consigne: u("cons_p1b") },
    { titre: u("ex_q2"), question: 1, juge: "p1b", limite: 80, consigne: u("cons_p1b") }
  ];
  if (cle === "p2"){ const P = sujetPlan(); return P.punkte.map((q, k) => ({ titre: q, tour: k, feuille: "plan", limite: 60 })); }
  return [
    { titre: u("ex_avis"), avis: 0, feuille: "avis", juge: "p3a", limite: 100, consigne: u("cons_p3a") },
    { titre: u("ex_reaction"), avis: 1, feuille: "avis", juge: "p3b", limite: 80, consigne: u("cons_p3b") }
  ];

const RANG = { moins: 0, A2: 1, B1: 2 }, NIV = ["moins", "A2", "B1"];
function etatSection(s){ const c = SECTIONS[s].cle; if (!ETAT[c]) ETAT[c] = { fait: [], rep: [], res: [] }; return ETAT[c]; }

// Les deux questions de la partie 1B portent d'abord sur ce que l'eleve n'a pas dit en se presentant (comme le
// ferait l'examinatrice) ; tirees une fois par passage de la section.
function questions1b(){
  const st = etatSection(1);
  if (!st.questions){
    const pts = (etatSection(0).res[1] || {}).points || [];
    const prio = QUESTIONS_1B.filter(id => (id === "a_frage_familie" && !pts.includes("Familie")) || (id === "a_frage_beruf" && !pts.includes("Beruf / Arbeit")) || (id === "a_frage_freizeit" && !pts.includes("Freizeit")));
    const reste = QUESTIONS_1B.filter(id => !prio.includes(id)).sort(() => Math.random() - 0.5);
    st.questions = prio.sort(() => Math.random() - 0.5).concat(reste).slice(0, 2);
    sauver();
  }
  return st.questions;
}
// Ce que dit Anna ou Mark avant le tour de l'eleve.
function aJouer(s, e){
  const S = SECTIONS[s], X = exercices(s)[e], st = etatSection(s);
  if (S.cle === "p1b") return [[questions1b()[X.question]]];
  if (S.cle === "p2"){ const P = sujetPlan(); return e === 0 ? [[P.intro], [P.tours[0].m]] : [[P.tours[e].m]]; }
  if (S.cle === "p3"){
    const A = sujetAvis();
    if (e === 0) return [[A.frage]];
    if (!st.cote) st.cote = Math.random() < 0.5 ? "A" : "B";
    return [[st.cote === "A" ? A.gegenA : A.gegenB]];
  }
  return X.jouer;
}
function modelesDe(s, e){
  const S = SECTIONS[s], st = etatSection(s);
  if (S.cle === "p1a") return { liste: MODELES_1A, note: u("modele_1a_note") };
  if (S.cle === "p1b") return { liste: MODELES_1B[questions1b()[exercices(s)[e].question]] };
  if (S.cle === "p2"){ const t = sujetPlan().tours[e]; return { liste: [{ niv: "A2", de: t.a2 }, { niv: "B1", de: t.b1 }] }; }
  const A = sujetAvis();
  return { liste: e === 0 ? A.avis : A.reaction[st.cote || "A"] };
}
function resultatSection(s){
  const S = SECTIONS[s], st = etatSection(s), ex = exercices(s);
  if (S.cle === "p2") return ex.some((x, k) => st.rep[k] != null) ? JUGES.p2(ex.map((x, k) => st.rep[k] || "")) : null;
  const rs = ex.map((x, k) => x.juge ? st.res[k] : null).filter(Boolean);
  if (!rs.length) return null;
  if (rs.length === 1) return rs[0];
  const r = Math.floor(rs.reduce((n, x) => n + RANG[x.niveau], 0) / rs.length);
  return { niveau: NIV[r], crit: [].concat(...rs.map(x => x.crit)) };
}

// ---------------------------------------------------------------- les ecrans
function accueil(){
  examen = false; ici = { s: -1, e: -1 }; chronoArreter();
  vider(); entete(petitTitre(), u("titre")); points(-1);
  zone.appendChild(el("h2", "", u("h_accueil")));
  coach("accueil");
  // L'epreuve en bref : la duree, la preparation, le bareme
  const f = el("div", "verdict");
  f.appendChild(el("h3", "", u("format_titre")));
  f.appendChild(el("p", "", u("format_intro")));
  const tab = el("table", "tableau");
  const tete = el("tr"); [u("f_partie"), u("f_duree"), u("f_points")].forEach((x, k) => { const th = el("th", k === 2 ? "pts" : "", x); tete.appendChild(th); }); tab.appendChild(tete);
  [[u("f_1a"), u("f_1a_d"), u("f_1_p")], [u("f_1b"), u("f_1b_d"), ""], [u("f_2"), u("f_2_d"), "12"], [u("f_3"), u("f_3_d"), "12"], [u("f_criteres"), "", u("f_criteres_p")]].forEach(r => {
    const tr0 = el("tr"); r.forEach((x, k) => tr0.appendChild(el("td", k === 2 ? "pts" : "", x))); tab.appendChild(tr0);
  });
  const tot = el("tr", "total"); [u("f_total"), "≈ 15 min", "60"].forEach((x, k) => tot.appendChild(el("td", k === 2 ? "pts" : "", x))); tab.appendChild(tot);
  f.appendChild(tab);
  f.appendChild(el("p", "limite", u("f_resultat")));
  zone.appendChild(f);
  // Les sections
  const liste = el("div", "sections");
  liste.appendChild(el("b", "", u("sections_titre")));
  SECTIONS.forEach((S, s) => {
    const st = etatSection(s), ex = exercices(s), n = ex.length, fa = ex.filter((x, k) => st.fait[k]).length;
    const b = el("button", "section"); b.type = "button";
    b.appendChild(el("span", "num", S.teil.replace("Teil ", "")));
    const t = el("span", "nomsec"); t.appendChild(el("b", "", u(S.titre)));
    const sous = S.cle === "p2" ? S.de + " · " + tr(sujetPlan().titre) : S.cle === "p3" ? S.de + " · " + tr(sujetAvis().titre) : S.de;
    const d = el("small", "", sous); t.appendChild(d); b.appendChild(t);
    const etat = el("span", "etat" + (fa === n ? " fait" : ""), fa === n ? "✓" : fa ? fa + " / " + n : "");
    b.appendChild(etat);
    b.onclick = () => { examen = false; exercice(s, 0); };
    liste.appendChild(b);
  });
  zone.appendChild(liste);
  zone.appendChild(el("p", "limite", u("accueil_note")));
  bouton(u("examen_btn"), lancerExamen);
}

// L'examen complet : un sujet neuf pour les parties 2 et 3, les quatre sections remises a zero, sans aide.
function lancerExamen(){
  changerSujet("p2"); changerSujet("p3");
  SECTIONS.forEach(S => { delete ETAT[S.cle]; });
  sauver();
  examen = true; chronoLancer();
  exercice(0, 0);
}

function exercice(s, e){
  ici = { s, e };
  const S = SECTIONS[s], ex = exercices(s), X = ex[e], st = etatSection(s);
  if (s === 1 && e === 0 && !st.fait.length) questions1b();
  vider();
  entete((examen ? u("examen_complet") + " · " : "") + u("exo_n", {n: e + 1, sur: ex.length}), u("section_n", {n: s + 1}) + " · " + u(S.titre));
  points(s, e);
  const p = el("p", "partie", S.teil + " · " + S.de); zone.appendChild(p);
  zone.appendChild(el("h2", "", X.titre));
  // Le conseil de Mark et ce qu'attend l'examinateur ouvrent la section ; ensuite, seules les tournures qui aident.
  // A l'examen complet : rien de tout cela.
  if (!examen){
    coach(S.cle, e > 0);
    if (e === 0) attend(S.cle);
    if (e === 0 && (S.cle === "p2" || S.cle === "p3")){
      const l = el("div", "sujet");
      l.appendChild(el("span", "", u("sujet", {s: tr((S.cle === "p2" ? sujetPlan() : sujetAvis()).titre)})));
      const b = el("button", "lien", u("autre_sujet")); b.type = "button"; b.onclick = () => { changerSujet(S.cle); exercice(s, 0); };
      l.appendChild(b); zone.appendChild(l);
    }
  }
  let f = null;
  if (X.feuille === "stichworte") f = feuille("Ihr Aufgabenblatt", STICHWORTE);
  if (X.feuille === "plan"){
    const P = sujetPlan();
    f = feuille("Gemeinsames Aufgabenblatt", P.punkte, P.blatt);
    f.querySelectorAll(".puces span").forEach((x, k) => { if (st.fait[k]) x.classList.add("ok"); if (k === e) x.classList.add("ici"); });
  }
  if (X.feuille === "avis") feuille("Ihre Aufgabe", null, sujetAvis().blatt);
  const jouer = aJouer(s, e);
  const premier = L[jouer[0][0]][0];
  bouton(premier === "mark" ? u("ecouter_mark") : u("ecouter_anna"), async () => {
    suite.hidden = true;
    for (const j of jouer) await bulle(j[0]);
    if (X.modele){
      st.fait[e] = true; sauver(); points(s, e);
      if (!examen) modeles(modelesDe(s, e).liste, modelesDe(s, e).note, true);
      bouton(u("continuer"), () => apres(s, e));
      return;
    }
    if (X.tour != null){ tourPlan(s, e, false, f); return; }
    // la partie 3 commence par la minute de reflexion
    if (S.cle === "p3" && e === 0){ await reflexion(); await bulle("t_a_los"); }
    aToi(X.consigne, X.limite, async t => {
      const res = JUGES[X.juge](t);
      st.rep[e] = t; st.res[e] = res; st.fait[e] = true;
      if (S.cle === "p3" && e === 0) st.cote = coteDe(sujetAvis(), t);
      sauver(); points(s, e);
      if (X.juge === "p1a" && f) f.querySelectorAll(".puces span").forEach(x => { if ((res.points || []).includes(x.textContent)) x.classList.add("ok"); });
      if (S.cle === "p3" && e === 1) await bulle("t_m_schluss");
      if (examen) return apres(s, e);
      montrerVerdict(res, t, () => exercice(s, e), () => apres(s, e), null, () => modeles(modelesDe(s, e).liste, modelesDe(s, e).note, false));
    });
  });
}
// Un tour de la planification : Mark propose, l'eleve repond, Mark reagit. Trop court, il relance une fois ; un refus,
// il se range ; sinon il accepte. Au dernier tour, il conclut.
function tourPlan(s, e, relance, f){
  const st = etatSection(s), P = sujetPlan();
  aToi(u("cons_tour", {p: P.punkte[e]}), 60, async t => {
    const ligne = el("div", "entendu", t || u("rien")); ligne.lang = "de"; zone.appendChild(ligne);
    if (nbMots(t) < 4 && !relance){ await bulle("m_nachfrage"); tourPlan(s, e, true, f); return; }
    st.rep[e] = t; st.fait[e] = true; sauver(); points(s, e);
    if (f && nbMots(t) >= 4) f.querySelectorAll(".puces span")[e].classList.add("ok");
    const refus = /\b(nicht|lieber|keine lust|zu früh|zu spät|zu weit|zu teuer|schlecht|leider|aber)\b/.test(norm(t));
    await bulle(e < P.tours.length - 1 ? (refus ? "m_nein" : (e % 2 ? "m_ok2" : "m_ok")) : "m_ende");
    if (examen) return apres(s, e);
    montrerVerdict({ crit: critTour(t) }, null, () => exercice(s, e), () => apres(s, e), u("retour_mark"),
      () => modeles(modelesDe(s, e).liste, null, false));
  });
}
function apres(s, e){
  if (e + 1 < exercices(s).length) return exercice(s, e + 1);
  if (examen) return s + 1 < SECTIONS.length ? exercice(s + 1, 0) : fin();
  recap(s);
}

function recap(s){
  const S = SECTIONS[s], st = etatSection(s), ex = exercices(s);
  ici = { s, e: "recap" };
  vider(); entete(u("fin_section"), u("section_n", {n: s + 1}) + " · " + u(S.titre)); points(s, -1);
  zone.appendChild(el("h2", "", u("recap")));
  ex.forEach((X, k) => {
    if (X.modele) return;
    const c = el("div", "verdict");
    const r = X.juge ? st.res[k] : null;
    const h = el("h3", "", X.titre); if (r) h.appendChild(chip(r.niveau)); c.appendChild(h);
    const j = aJouer(s, k).slice(-1)[0];
    if (j){ const q = el("div", "question", L[j[0]][1]); q.lang = "de"; c.appendChild(q); }
    if (st.rep[k] != null){
      c.appendChild(el("div", "micro-info", u("ta_reponse")));
      const e = el("div", "entendu", st.rep[k] || u("rien")); e.lang = "de"; c.appendChild(e);
      c.appendChild(el("div", "micro-info", X.tour != null ? u("retour_mark") : u("retour_anna")));
      const ul = el("ul", "crit"); (r ? r.crit : critTour(st.rep[k])).forEach(x => ul.appendChild(el("li", x.ok ? "ok" : "", x.label))); c.appendChild(ul);
    } else c.appendChild(el("p", "limite", u("pas_fait")));
    zone.appendChild(c);
  });
  const r = resultatSection(s);
  if (r && ex.filter(x => !x.modele).length > 1){
    const c = el("div", "verdict");
    const h = el("h3", "", S.cle === "p2" ? u("toute_conv") : S.cle === "p3" ? u("toute_disc") : u("toute_section")); h.appendChild(chip(r.niveau)); c.appendChild(h);
    if (S.cle === "p2"){ const ul = el("ul", "crit"); r.crit.forEach(x => ul.appendChild(el("li", x.ok ? "ok" : "", x.label))); c.appendChild(ul); }
    zone.appendChild(c);
  }
  zone.appendChild(el("p", "limite", u("limite")));
  const act = el("div", "actions");
  const refaire = el("button", "", u("refaire_section")); refaire.type = "button";
  refaire.onclick = () => { if (s === 1) st.questions = null; if (s === 3) st.cote = null; exercice(s, 0); };
  const toutes = el("button", "", u("toutes")); toutes.type = "button"; toutes.onclick = accueil;
  act.append(refaire, toutes); zone.appendChild(act);
  if (s + 1 < SECTIONS.length) bouton(u("suivante"), () => exercice(s + 1, 0));
  else { toutes.remove(); bouton(u("toutes"), accueil); }
}

// ---------------------------------------------------------------- le verdict
// Le critere I (le contenu) par partie, sur l'echelle du telc pour une partie de l'oral (FORMAT-TELC.md) :
// B1 bien rempli 12, B1 rempli 9, A2 bien rempli 6, A2 rempli 4, sous A2 2, rien 0. La partie 1 vaut 6 : la moitie.
function points12(res){
  if (!res) return 0;
  const ok = res.crit.filter(c => c.ok).length, n = res.crit.length;
  if (res.niveau === "B1") return ok === n ? 12 : 9;
  if (res.niveau === "A2") return ok * 2 >= n ? 6 : 4;
  return 2;
}
function estimation(){
  const r = SECTIONS.map((S, s) => resultatSection(s));
  const p1 = (points12(r[0]) + points12(r[1])) / 4, p2 = points12(r[2]), p3 = points12(r[3]);
  const I = p1 + p2 + p3;
  // Les criteres II a IV (prononciation, correction, etendue : 30 points) ne se mesurent pas ici : on les suppose au
  // niveau du contenu. Seuils du telc pour une competence : 70 % (42) pour le B1, 40 % (24) pour l'A2.
  const sprechen = Math.round(I * 2);
  const niveau = sprechen >= 42 ? "B1" : sprechen >= 24 ? "A2" : "moins";
  // le niveau d'une partie, pour le tableau : la partie 1 reunit 1A et 1B
  const nivP = (...rs) => { const v = rs.filter(Boolean); return v.length ? NIV[Math.floor(v.reduce((n, x) => n + RANG[x.niveau], 0) / v.length)] : "moins"; };
  return { p1, p2, p3, I, sprechen, niveau, niv: [nivP(r[0], r[1]), nivP(r[2]), nivP(r[3])] };
}
const virgule = n => LANG === "fr" ? String(n).replace(".", ",") : String(n);
function enregistrer(est){
  // le dernier resultat de l'oral, sous la cle de commun.js (wortando_telc_resultats), pour l'accueil et le verdict
  try{
    const k = "wortando_telc_resultats", r = JSON.parse(localStorage.getItem(k) || "{}") || {};
    r.Sp = { quand: Date.now(), points: est.sprechen, sur: 60, niveau: est.niveau, partieI: est.I };
    localStorage.setItem(k, JSON.stringify(r));
  }catch(e){}
  // l'examen blanc en cours (telc/examen.js) : la part de l'oral
  if (BLANC){
    try{
      const k = "wortando_telc_blanc", b = JSON.parse(localStorage.getItem(k) || "null");
      if (b && b.res){ b.res.Sp = { sprechen: est.sprechen, detail: { partieI: est.I, niveau: est.niveau } }; localStorage.setItem(k, JSON.stringify(b)); }
    }catch(e){}
  }
  parler("resultat", { mode: "oral_telc", points: est.sprechen, sur: 60, niveau: est.niveau });
}

async function fin(){
  ici = { s: -1, e: "fin" };
  chronoArreter();
  vider(); entete(u("examen_complet"), u("verdict_anna")); points(-1);
  const est = estimation();
  enregistrer(est);
  zone.appendChild(el("h2", "", u("verdict_anna")));
  await bulle("a_ende_" + est.niveau, true);
  // Le cadre du clip, pour que dire() joue la VIDEO (sinon la voix seule passe sous l'image fixe).
  const cadreVerdict = [...zone.querySelectorAll(".clip")].pop() || null;
  const tab = el("table", "tableau");
  const tete = el("tr"); [u("v_partie"), "", u("v_points")].forEach((x, k) => tete.appendChild(el("th", k === 2 ? "pts" : "", x))); tab.appendChild(tete);
  [[u("v_t1"), est.niv[0], est.p1, 6], [u("v_t2"), est.niv[1], est.p2, 12], [u("v_t3"), est.niv[2], est.p3, 12]].forEach(r => {
    const tr0 = el("tr"); tr0.appendChild(el("td", "", r[0])); const td = el("td"); td.appendChild(chip(r[1])); tr0.appendChild(td);
    tr0.appendChild(el("td", "pts", virgule(r[2]) + " / " + r[3])); tab.appendChild(tr0);
  });
  const t1 = el("tr"); t1.appendChild(el("td", "", u("v_contenu"))); t1.appendChild(el("td")); t1.appendChild(el("td", "pts", virgule(est.I) + " / 30")); tab.appendChild(t1);
  const t2 = el("tr", "total"); t2.appendChild(el("td", "", u("v_oral"))); const tdn = el("td"); tdn.appendChild(chip(est.niveau)); t2.appendChild(tdn);
  t2.appendChild(el("td", "pts", est.sprechen + " / 60")); tab.appendChild(t2);
  zone.appendChild(tab);
  zone.appendChild(el("p", "limite", u("v_note") + " " + u("limite")));
  if (BLANC){
    zone.appendChild(el("p", "", u("blanc_note")));
    bouton(u("vers_blanc"), () => versTelc({ partie: "BLANC", etape: "verdict" }));
  } else {
    coach("fin");
    const act = el("div", "actions");
    const r = el("button", "", u("refaire_examen")); r.type = "button"; r.onclick = lancerExamen;
    const t = el("button", "", u("toutes")); t.type = "button"; t.onclick = accueil;
    act.append(r, t); zone.appendChild(act);
    bouton(u("terminer"), () => { if (DEPUIS_TELC) versTelc(); else parler("fini", { faits: 0, bons: 0 }); });
  }
  dire("a_ende_" + est.niveau, cadreVerdict);
}

// « ‹ » : d'une section (ou du verdict) vers la liste des sections ; de la liste, vers le bloc telc (ou on quitte).
// Pendant l'examen blanc, la liste n'existe pas : « ‹ » ramene a l'examen blanc.
document.getElementById("retour").setAttribute("aria-label", LANG === "en" ? "Back" : "Retour");
document.getElementById("retour").onclick = () => {
  taire();
  if (BLANC){ versTelc({ partie: "BLANC" }); return; }
  if (ici.s >= 0 || ici.e === "fin"){ accueil(); return; }
  if (DEPUIS_TELC){ versTelc(); return; }
  if (DANS_APP) parler("fermer"); else history.back();
};

try{ Zoom.init({direct: ".qui img", loupe: "", langue: LANG}); }catch(e){}
document.title = u("titre");
if (BLANC) lancerExamen(); else accueil();
