<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les métiers</title>
<!--
  « LES METIERS » (theme illustre, 3 nov. 2026) : les PROFESSIONS, en espagnol et en allemand. Qui fait quoi, ou
  chacun travaille, « Je suis medecin » SANS ARTICLE (Ich bin Arztin, Soy medica ; avec un adjectif, l'article
  revient : Sie ist eine gute Arztin), le masculin et le feminin (der Arzt / die Arztin, el medico / la medica,
  el / la policia), « als » et jamais « wie » (Er arbeitet als Kellner), « trabaja de camarero ».
  Les personnes : neuf professionnels des scenes, recadres dans leur scene (ils montrent ou ils travaillent), et dix
  personnes de « Decrire une personne » en tenue de travail. Toute la donnee vient de visuel/metiers/metiers.py ->
  metiers/metiers.json : aucune phrase n'est ecrite ici.
  Ouverte par l'app dans le cadre des scenes (sceneCadre), elle parle comme une scene : « exercice » et « bonne »
  a chaque reponse, « reponse » {mot, genre, cat, juste} pour le mot teste, « fini » et « fermer » a la fin.
  Parametres : apprendre=es|de, lang=<interface>, nuit=1, seance=1 (six questions, pas de decouverte),
  variante=latam (la voix), r=<AUDIO_REVISION>. Le tirage suit les mots (themes/tirage.js).
  L'ANGLAIS (4 nov. 2026, apprendre=en, variante=gb) : les memes images, ses phrases a lui (EN_J, EN_L, EN_FAIT,
  EX_EN, plus bas) -- c'est l'INVERSE de l'espagnol et de l'allemand : le metier prend TOUJOURS son article (She is a
  doctor, He is an engineer : a ou an selon le son qui suit), « What does she do? » pour demander le metier (jamais
  « What is she doing? »), work as / at / in / for / on (jamais « like »), le present simple et son -s (He drives a
  bus, She teaches art). Presque aucun metier n'a de feminin : waiter / waitress et actor / actress existent, mais
  police officer, firefighter, flight attendant valent pour tous. Des metiers sans image (an engineer, an artist,
  a firefighter...) font travailler a / an. Elena et Tomas sont ecartes en anglais (« POLIZEI » sur l'uniforme,
  pas a Boston) : le policier n'a plus que des questions sans image. Americain / britannique : salesperson / shop
  assistant, store / shop, pharmacy / chemist's, doctor's office / doctor's surgery, mail carrier / postman,
  math / maths, mom / mum, neighbor / neighbour, movies / films.
-->
<style>
:root{--fond1:#82AFDB;--fond3:#C0D6EA;--encre:#1C2430;--gris:#4C566B;--ambre:#E8A23A;--ambre-f:#A86A0E;--vert:#2F9E6A;--rouge:#C8473A;
  --verre:rgba(255,255,255,.88);--bord:rgba(255,255,255,.95);--carte:#F7F8FA;--police:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html.nuit{--fond1:#0E1C26;--fond3:#18303F;--encre:#EEF2F5;--gris:#A9B8C4;--ambre-f:#E8A23A;--vert:#5CC98F;--rouge:#F07F72;
  --verre:rgba(20,36,50,.88);--bord:rgba(255,255,255,.14);--carte:#22384A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
/* LA PAGE A LA HAUTEUR DE L'ECRAN, COMME UNE SCENE (regle commune, 3 nov. 2026 : sur iPhone, un bouton fixe dans un
   cadre dont le document deborde ne tombe pas au bas de l'ecran) : le contenu defile DANS le body. */
html{height:100%;overflow:hidden}
body{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;box-sizing:border-box}
body{background:linear-gradient(180deg,var(--fond1),var(--fond3));background-attachment:fixed;color:var(--encre);font-family:var(--police);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 90px) max(10px,env(safe-area-inset-left,0px))}
.haut{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto 10px}
.retour{width:42px;height:42px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);color:var(--encre);font:800 22px var(--police);cursor:pointer;flex:0 0 auto}
html[dir="rtl"] .retour{transform:scaleX(-1)}
.titre{flex:1;font-weight:900;font-size:18px}
.compte{font-weight:800;font-size:14px;color:var(--gris)}
.barre{max-width:560px;margin:0 auto 12px;height:6px;border-radius:3px;background:rgba(28,36,48,.12);overflow:hidden}
.barre i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2BB5AA,#14807A);transition:width .3s}
main{max-width:560px;margin:0 auto;background:var(--verre);border:1px solid var(--bord);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}
.consigne{font-size:14px;font-weight:700;color:var(--gris);margin:0}
.enonce{direction:ltr;text-align:left;background:var(--carte);border-radius:14px;padding:12px 14px;font-weight:800;line-height:1.5;font-size:17px}
.enonce.centre{text-align:center;font-size:19px}
.trou{display:inline-block;min-width:56px;border-bottom:2px solid var(--ambre);text-align:center;color:var(--ambre-f)}
/* la personne de la question : 3:4, assez petite pour laisser les choix a l'ecran a 375 px */
.photo{width:62%;max-width:280px;margin:0 auto;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--carte)}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
/* des personnes a toucher : trois de front, ou quatre en deux rangees */
.rangee{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;direction:ltr}
.rangee.quatre{grid-template-columns:1fr 1fr;max-width:330px;margin:0 auto;width:100%}
.rangee button{border:3px solid transparent;border-radius:14px;background:var(--carte);padding:0;cursor:pointer;overflow:hidden;display:block;position:relative;aspect-ratio:3/4}
.rangee button img{display:block;width:100%;height:100%;object-fit:cover}
.rangee button.juste{border-color:var(--vert)} .rangee button.faux{border-color:var(--rouge)}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix.centre{justify-content:center}
.choix button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:9px 15px;font:800 15px var(--police);cursor:pointer}
.choix.phrases{flex-direction:column;align-items:stretch}
.choix.phrases button{border-radius:14px;text-align:left}
.choix button.juste{background:var(--vert);border-color:var(--vert);color:#fff}
.choix button.faux{background:var(--rouge);border-color:var(--rouge);color:#fff}
button:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
button:disabled{cursor:default}
.ecoute{width:48px;height:48px;border-radius:50%;border:2px solid var(--ambre);background:var(--verre);color:var(--encre);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ecoute svg{width:24px;height:24px}
.ecoute.grand{width:64px;height:64px;margin:0 auto} .ecoute.grand svg{width:32px;height:32px}
.retourMsg{min-height:1.4em;font-weight:800;font-size:15px;margin:0;line-height:1.45}
.retourMsg.ok{color:var(--vert)} .retourMsg.ko{color:var(--rouge)}
.retourMsg .phrase{display:block;color:var(--encre);font-weight:700}
.trad{display:block;font-size:13px;font-weight:600;font-style:italic;color:var(--gris);line-height:1.35;margin-top:2px}
.retourMsg .mot{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--gris);font-weight:700}
.retourMsg .mot .ecoute{width:38px;height:38px} .retourMsg .mot .ecoute svg{width:19px;height:19px}
.trad.faux{color:var(--rouge);font-style:italic}
/* la decouverte : deux onglets, la fiche de la personne touchee, la galerie ; les paires */
.onglets{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--carte);border-radius:999px;padding:4px}
.onglets button{border:0;border-radius:999px;background:none;color:var(--gris);font:800 14px var(--police);padding:9px 6px;cursor:pointer}
.onglets button.actif{background:var(--verre);color:var(--encre);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.fiche{display:flex;gap:12px;align-items:flex-start;background:var(--carte);border-radius:16px;padding:10px}
.fiche img{width:38%;max-width:170px;aspect-ratio:3/4;object-fit:cover;border-radius:12px;flex:0 0 auto;cursor:zoom-in}
.fiche .lignes{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.fiche .ligne{font-weight:800;font-size:16px;line-height:1.35;direction:ltr;text-align:left}
.fiche .ecoute{align-self:flex-start}
.galerie{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;direction:ltr}
.galerie button{border:3px solid transparent;border-radius:12px;background:var(--carte);padding:0;cursor:pointer;overflow:hidden;position:relative;display:flex;flex-direction:column}
.galerie button img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.galerie button span{display:block;font:800 11px var(--police);color:var(--encre);padding:3px 2px 4px;line-height:1.2;text-align:center}
.galerie button.choisi{border-color:var(--ambre)}
.paires{display:flex;flex-direction:column;gap:6px}
.paires button{display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px solid var(--bord);background:var(--carte);color:var(--encre);border-radius:12px;padding:8px 12px;font:800 15px var(--police);cursor:pointer;text-align:left}
.paires button .trad{margin:0}
.paires button.choisi{border-color:var(--ambre)}
.regle{margin:0;font-size:14px;font-weight:700;line-height:1.5;color:var(--gris);background:var(--carte);border-radius:12px;padding:10px 12px}
.regle b{color:var(--encre)}
.regle .exemples{display:block;margin-top:6px;color:var(--encre);font-weight:700;text-align:left}
.suite{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:54px;border:0;border-radius:27px;
  color:#fff;font:800 17px var(--police);background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer}
.suite{z-index:5000}
.suite[hidden]{display:none}
/* la fin de partie : « Encore des questions » et « Terminer », fixes en bas comme .suite (regle des scenes, 3 nov.) */
.bas{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;gap:10px;z-index:5000}
.bas[hidden]{display:none}
.bas button{flex:1;height:54px;border-radius:27px;font:800 16px var(--police);cursor:pointer;padding:0 10px}
.bas .principal{border:0;color:#fff;background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28)}
.bas .second{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.fin{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:10px 0}
.fin .score{font-size:22px;font-weight:900}
[lang]{unicode-bidi:isolate}
</style>
</head>
<body>
<div class="haut"><button class="retour" id="retour" type="button">‹</button><div class="titre" id="titre"></div><div class="compte" id="compte" dir="ltr"></div></div>
<div class="barre"><i id="barre"></i></div>
<main id="zone"></main>
<button class="suite" id="suite" type="button" hidden></button>
<div class="bas" id="bas" hidden></div>
<script src="themes/tirage.js?v=1"></script>
<script src="themes/voix.js?v=2"></script>
<script src="themes/zoom.js?v=4"></script>
<script src="themes/verre.js?v=5"></script>
<script>
const Q = new URLSearchParams(location.search);
// l'anglais (4 nov. 2026, « il manque beaucoup de themes en anglais ») : les memes images, ses phrases a lui ; variante=gb
const APPRENDRE = ["de", "en"].includes(Q.get("apprendre")) ? Q.get("apprendre") : "es";
const GB = APPRENDRE === "en" && Q.get("variante") === "gb";
const LANGUE = (l => ["fr", "en", "tr", "uk", "fa", "ar", "pt", "pl", "ru", "de"].includes(l) ? l : "fr")(((Q.get("lang") || "fr").toLowerCase().split(/[-_]/)[0]));
if (Q.get("nuit") === "1") document.documentElement.classList.add("nuit");
document.documentElement.lang = LANGUE;
document.documentElement.dir = (LANGUE === "fa" || LANGUE === "ar") ? "rtl" : "ltr";
// agrandir (themes/zoom.js) : un toucher sur la personne de la question ou de la fiche ; la loupe sur les personnes a
// choisir et sur celles de la galerie
Zoom.init({direct: ".photo img, .fiche img", loupe: ".rangee button, .galerie button", langue: LANGUE});
// vingt questions seul (Jacques, 3 nov.), six dans la seance du jour, sans la decouverte
const NB = Q.get("seance") === "1" ? 6 : 20;

const TEXTES = {
  titre:     {fr:"Les métiers", en:"Jobs", tr:"Meslekler", uk:"Професії", fa:"شغل‌ها", ar:"المهن", pt:"As profissões", pl:"Zawody", ru:"Профессии", de:"Berufe"},

              fa:"چه کسی چه کاری می‌کند، و کجا؟ روی یک نفر بزن: شغلش، جای کارش و کاری را که می‌کند می‌بینی و می‌شنوی.",
              ar:"من يفعل ماذا، وأين؟ المس شخصًا: ترى مهنته وأين يعمل وماذا يفعل، وتسمع ذلك.",

              de:"Wer macht was, und wo? Tippe auf eine Person: Du siehst ihren Beruf, wo sie arbeitet und was sie macht, und hörst es."},
  ongletPers:{fr:"Les personnes", en:"The people", tr:"Kişiler", uk:"Люди", fa:"آدم‌ها", ar:"الأشخاص", pt:"As pessoas", pl:"Osoby", ru:"Люди", de:"Die Personen"},
  ongletPaires:{fr:"Masculin, féminin", en:"Masculine, feminine", tr:"Eril, dişil", uk:"Чоловічий, жіночий рід", fa:"مذکر، مؤنث", ar:"المذكر والمؤنث", pt:"Masculino, feminino", pl:"Rodzaj męski, żeński", ru:"Мужской, женский род", de:"Männlich, weiblich"},

  noteArticle:{fr:"Pour dire son métier, <b>pas d'article</b>, comme en français. Avec un adjectif, l'article revient :",
              en:"To say your job, <b>no article</b> (unlike English). With an adjective, the article comes back:",
              tr:"Mesleği söylerken <b>artikel kullanılmaz</b>. Sıfat gelince artikel geri gelir:",
              uk:"Коли називаєш професію, <b>артикль не потрібен</b>. З прикметником артикль повертається:",
              fa:"برای گفتن شغل، <b>حرف تعریف لازم نیست</b>. با صفت، حرف تعریف برمی‌گردد:",

  noteArticleEs:{fr:"Pour dire son métier, <b>pas d'article</b>, comme en français :",
              en:"To say your job, <b>no article</b> (unlike English):",
              tr:"Mesleği söylerken <b>artikel kullanılmaz</b>:",
              uk:"Коли називаєш професію, <b>артикль не потрібен</b>:",
              fa:"برای گفتن شغل، <b>حرف تعریف لازم نیست</b>:",
              ar:"عند ذكر المهنة <b>لا تُستعمل أداة</b>:",
              pt:"Para dizer a profissão, <b>sem artigo</b>, como em português:",

              de:"Beim Beruf steht <b>kein Artikel</b> – wie im Deutschen:"},
  noteFem:   {fr:"Le féminin : <b>-in</b>. Parfois un Umlaut, et une exception :",
              en:"The feminine: <b>-in</b>. Sometimes an umlaut, and one exception:",
              tr:"Dişil biçim: <b>-in</b>. Bazen bir Umlaut, bir de istisna:",
              uk:"Жіночий рід: <b>-in</b>. Іноді умлаут, і один виняток:",
              fa:"مؤنث: <b>-in</b>. گاهی با اوملاوت، و یک استثنا:",
              ar:"المؤنث: <b>-in</b>. أحيانًا مع علامة Umlaut، واستثناء واحد:",
              pt:"O feminino: <b>-in</b>. Às vezes com trema (Umlaut), e uma exceção:",
              pl:"Rodzaj żeński: <b>-in</b>. Czasem z umlautem, i jeden wyjątek:",
              ru:"Женский род: <b>-in</b>. Иногда с умлаутом, и одно исключение:",
              de:"Die weibliche Form: <b>-in</b>. Manchmal mit Umlaut, und eine Ausnahme:"},
  noteFemEs: {fr:"Le féminin : <b>-o → -a</b>, <b>-or → -ora</b>, <b>-e → -a</b>. Certains mots ne changent pas : seul l'article change.",

              fa:"مؤنث: <b>-o → -a</b>، <b>-or → -ora</b>، <b>-e → -a</b>. بعضی کلمه‌ها تغییر نمی‌کنند و فقط حرف تعریف عوض می‌شود.",

              pl:"Rodzaj żeński: <b>-o → -a</b>, <b>-or → -ora</b>, <b>-e → -a</b>. Niektóre słowa się nie zmieniają: zmienia się tylko rodzajnik.",

              de:"Die weibliche Form: <b>-o → -a</b>, <b>-or → -ora</b>, <b>-e → -a</b>. Manche Wörter bleiben gleich, nur der Artikel ändert sich."},
  noteAls:   {fr:"« Travailler comme » : <b>als</b>, jamais « wie ».", en:"“To work as”: <b>als</b>, never “wie”.", tr:"“… olarak çalışmak”: <b>als</b>, asla “wie” değil.",

              pt:"“Trabalhar como”: <b>als</b>, nunca “wie”.", pl:"„Pracować jako”: <b>als</b>, nigdy „wie”.", ru:"«Работать кем-то»: <b>als</b>, никогда не «wie».", de:"„Arbeiten als“: <b>als</b>, nie „wie“."},

const DE_APP = APPRENDRE === "de";
const cleNote = c => DE_APP ? c : APPRENDRE === "en" ? c + "En" : c + "Es";
const regle = cle => isoler(T(cleNote(cle))) + '<span class="exemples" lang="' + APPRENDRE + '" dir="ltr">' + EXEMPLES[cleNote(cle)] + '</span>';
function T(cle, v){ let s = (TEXTES[cle] || {})[LANGUE] || (TEXTES[cle] || {}).fr || cle; for (const k in (v || {})) s = s.split("{" + k + "}").join(v[k]); return s; }

// ---------- la donnee (metiers.json, fabrique par visuel/metiers/metiers.py) ----------
let D = null;
// en anglais, Elena et Tomas sont ecartes : « POLIZEI » sur l'uniforme, ce n'est pas Boston
const EN_ECARTES = ["Elena", "Tomas"];
const PERS = () => Object.keys(D.personnes).filter(id => APPRENDRE !== "en" || !EN_ECARTES.includes(id));
const P = id => D.personnes[id];
const PH = id => D.phrases[APPRENDRE][id];
const forme = (met, s) => D.metiers[met][APPRENDRE][s];                     // {genre, mot}
const affiche = (met, s) => forme(met, s).genre + " " + forme(met, s).mot;  // « die Ärztin »
const autre = s => s === "m" ? "f" : "m";
const voisins = (a, b) => a === b || D.metiers[a].confus.includes(b) || D.metiers[b].confus.includes(a);
// la phrase entiere traduite en francais, anglais, portugais (et en allemand pour qui apprend l'espagnol), comme la
// famille ; ailleurs, le mot teste et sa traduction tiree du corpus (metiers.json, gloses)
const PHRASE_TRADUITE = LANGUE !== APPRENDRE && (["fr", "en", "pt"].includes(LANGUE) || (LANGUE === "de" && APPRENDRE === "es"));
const tradPhrase = p => PHRASE_TRADUITE ? (((D.trad[APPRENDRE] || {})[p] || {})[LANGUE] || null) : null;
const traduction = t => t ? '<span class="trad" dir="auto">' + t + '</span>' : "";
const glose = m => { const g = (D.gloses[APPRENDRE] || {})[m] || {}; return LANGUE === APPRENDRE ? "" : (g[LANGUE] || g.fr || ""); };

// ---------- la voix : le fichier enregistre s'il existe, sinon le telephone (themes/voix.js) ----------
// une fleche de paire (« der Arzt → die Ärztin ») se dit comme une virgule
let dire = t => Voix.dire(t ? t.replace(/ → /g, ", ") : t);
const taire = () => Voix.arreter();
const HP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

// ---------- utilitaires ----------
const $ = id => document.getElementById(id);
const melanger = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
const hasard = a => a[Math.floor(Math.random() * a.length)];
const uniques = a => a.filter((x, i) => a.indexOf(x) === i);
const cible = t => '<span lang="' + APPRENDRE + '" dir="ltr">' + t + '</span>';
// en persan et en arabe, chaque passage en lettres latines s'isole, sinon l'algorithme bidi en retourne les mots
const isoler = s => document.documentElement.dir !== "rtl" ? s : s.split(/(<[^>]+>)/).map(x => x.charAt(0) === "<" ? x
  : x.replace(/[A-Za-zÀ-ÿñÑßäöüÄÖÜ¿?]+(?:[ ,'.()+=→-]+[A-Za-zÀ-ÿñÑßäöüÄÖÜ¿?]+)*/g, m => '<span dir="ltr">' + m + '</span>')).join("");
const imgSrc = id => "metiers/" + D.personnes[id].img + ".webp";
const photo = id => '<div class="photo"><img id="photo" alt="" src="' + imgSrc(id) + '"></div>';
function parler(type, extra){ try{ parent.postMessage(Object.assign({source:"wortando-scene", type}, extra || {}), "*"); }catch(e){} }
let file = [], rang = 0, bons = 0, repondu = false;
// LE MOT DE LA QUESTION (regle 3, 3 nov. : « un mot appris compte partout ») : juger() l'envoie (« reponse »), l'app
// fait avancer sa carte (revisionDeScene). Un metier : {mot: "Ärztin", genre: "die"} / {mot: "médica", genre: "la"} ;
// un lieu : {mot: "Bäckerei", genre: "die"} ; un verbe : {mot: "backen", cat: "verbe"}.
let motQ = null, tradQ = null, choixQ = null;

// LES MOTS DU THEME, a la forme du corpus : les douze metiers au masculin et au feminin, les lieux, les verbes
let MOTS = null;
function motsDuTheme(){
  if (MOTS) return MOTS;
  if (APPRENDRE === "en") return (MOTS = motsDuThemeEn());
  MOTS = [];
  Object.keys(D.metiers).forEach(met => ["m", "f"].forEach(s => { const f = forme(met, s); MOTS.push({k: "j:" + met + ":" + s, met, s, mot: f.mot, genre: f.genre}); }));
  Object.keys(D.lieux).forEach(l => { const n = D.lieux[l].nom[APPRENDRE]; MOTS.push({k: "l:" + l, lieu: l, mot: n.mot, genre: n.genre}); });
  uniques(PERS().map(id => PH(id).fait.inf)).forEach(v => MOTS.push({k: "v:" + v, mot: v, cat: "verbe"}));
  return MOTS;
}
const estJob = w => w && w.met, estLieu = w => w && w.lieu, estVerbe = w => w && w.cat === "verbe";
const motJob = (met, s) => ({mot: forme(met, s).mot, genre: forme(met, s).genre});
const motLieu = l => ({mot: D.lieux[l].nom[APPRENDRE].mot, genre: D.lieux[l].nom[APPRENDRE].genre});
const motVerbe = v => ({mot: v, cat: "verbe"});
// « sens » : en anglais seulement, pour un mot a deux cartes au corpus (le britannique chemist's : pharmacie / pharmacie-droguerie)
function viser(w, defaut){ motQ = w ? Object.assign({mot: w.mot, genre: w.genre || null, cat: w.cat || null}, w.sens ? {sens: w.sens} : {}) : defaut; }
// les personnes qui ont la forme visee (Diego et la medecin du cabinet n'ont pas la meme : Arzt, Ärztin)
const avecForme = w => PERS().filter(id => !w || (P(id).metier === w.met && P(id).sexe === w.s));
// le mot montre sous la reponse : « die Ärztin », « die Bäckerei », « backen », et sa traduction (le corpus)
function montreDe(m){
  if (!m) return null;
  // en anglais, un verbe a sa glose a part (« cook » est un nom et un verbe)
  return {aff: m.genre ? m.genre + " " + m.mot : m.mot, sens: glose(APPRENDRE === "en" && m.cat === "verbe" ? "v:" + m.mot : m.mot)};
}
// LE MAUVAIS CHOIX TRADUIT (decision de Jacques du 3 nov., regle commune des themes) : apres une erreur, ce que
// l'eleve a choisi et ce que ca veut dire. Un metier : sa forme avec l'article et sa glose (« die Ärztin — la
// medecin ») ; un lieu : sa traduction ; un verbe : son infinitif et son sens ; une personne touchee : sa phrase.
// Une phrase a l'article en trop, als / wie, ein / der : rien a traduire.
function choixTraduit(c){
  if (APPRENDRE === "en") return choixTraduitEn(c);
  if (!c || LANGUE === APPRENDRE) return null;
  if (D.personnes[c]){ const ph = PH(c).cual; return {aff: ph, sens: tradPhrase(ph) || glose(forme(P(c).metier, P(c).sexe).mot)}; }
  for (const met of Object.keys(D.metiers)) for (const s of ["m", "f"]){
    if (forme(met, s).mot === c){ const tr = D.metiers[met].trad[LANGUE]; return {aff: affiche(met, s), sens: (PHRASE_TRADUITE && tr ? tr[s === "m" ? 0 : 1] : "") || glose(c)}; }
  }
  for (const l of Object.keys(D.lieux)){
    if (D.lieux[l][APPRENDRE] === c) return {aff: c, sens: (PHRASE_TRADUITE ? D.lieux[l].trad[LANGUE] : "") || glose(D.lieux[l].nom[APPRENDRE].mot)};
  }
  for (const met of Object.keys(D.metiers)){
    if (D.metiers[met].verbes[APPRENDRE] === c){ const inf = D.metiers[met].inf[APPRENDRE]; return {aff: c + " (" + inf + ")", sens: glose(inf)}; }
  }
  return null;
}

// apres la reponse : la phrase juste et sa traduction, le mot teste et sa voix
function juger(ok, bonneTexte, phrase){
  if (repondu) return; repondu = true;
  if (ok) bons++;
  parler("exercice", {juste: ok}); if (ok){ parler("bonne"); Voix.bravo(); }   // le son des cartes et des scenes
  if (motQ) parler("reponse", Object.assign({mot: motQ.mot, genre: motQ.genre || null, cat: motQ.cat || null}, motQ.sens ? {sens: motQ.sens} : {}, {juste: ok}));
  if (!ok && file[rang]) Tirage.remettre(file, rang, file[rang], NB);   // rate : il revient dans la partie
  const m = $("msg"); m.className = "retourMsg " + (ok ? "ok" : "ko");
  const mt = montreDe(motQ);
  m.innerHTML = (ok ? cible(DE_APP ? "Sehr gut!" : APPRENDRE === "en" ? "Well done!" : "¡Muy bien!") : T("bonne", {r: cible(bonneTexte)}))
    + (phrase && phrase !== bonneTexte ? '<span class="phrase">' + cible(phrase) + '</span>' : "")
    + traduction(tradQ || tradPhrase(phrase || bonneTexte))

  neutre(w){

    const c = EN_NEUTRE.filter(x => !w || x[0] === w.j); if (!c.length) return false;
    const [k, s, fait, frFait, piege, sensPiege] = hasard(c), J = JK(k); SENS_EN.clear();
    viser(w, motJ(J));
    const ids = personnesJ(J).filter(id => P(id).sexe === s), id = ids.length && Math.random() < 0.5 ? hasard(ids) : null;
    const N = id ? (nomDe(id) || maj(ilEn(id))) : hasard(EN_NOMS[s]), Nf = id ? sujFr(id) : N, il = s === "f" ? "She" : "He";
    const phrase = N + " " + fait + ". " + il + "'s " + anA(J.mot) + " ___.";
    const juste = E(phrase.replace("___", J.mot), Nf + " " + frFait + ". " + maj(ilFr(s)) + " est " + frJ(J, s) + ".");
    sensA(piege, sensPiege);
    ecran("neutre", id ? photo(id) : "", avecTrou(phrase), true);
    boutons($("choix"), melanger([J.mot, piege]), J.mot, ok => { remplir(J.mot); juger(ok, J.mot, juste); });
    return true;
  },
  // qui fait quoi, sans image : « Who puts out fires? » a firefighter / a lawyer / an artist -- le present simple
  definition(w){
    if (w && !estJ(w)) return false;
    const c = EN_J.filter(J => J.def && (!w || J.k === w.j)); if (!c.length) return false;
    const J = hasard(c), [d, fr] = J.def, v = d.split(" ")[0]; SENS_EN.clear();
    viser(w, motJ(J));
    const autres = melanger(EN_J.filter(x => x.def && !voisinsEn(x, J) && x.def[0].split(" ")[0] !== v)).slice(0, 2);
    const rep = avecA(J.mot), opts = [rep].concat(autres.map(x => avecA(x.mot)));
    [J].concat(autres).forEach(x => sensA(avecA(x.mot), unFr(x, "m")));
    const phrase = E(maj(rep) + " " + d + ".", fr);
    ecran("definition", "", "Who " + d + "?", true);
    boutons($("choix"), melanger(opts), rep, ok => juger(ok, rep, phrase));
    return true;
  },
  // la phrase, et quatre personnes : une seule la dit (le meme metier, l'autre sexe, est le piege : he ou she)
  cual(w){
    if (w && !estJ(w)) return false;
    const c = PERS().filter(id => !w || jobDe(id).k === w.j); if (!c.length) return false;
    const id = hasard(c), ph = PH(id).cual, J = jobDe(id); SENS_EN.clear();
    viser(w, motJ(J));
    const autres = PERS().filter(o => o !== id && PH(o).cual !== ph);
    const piege = melanger(autres.filter(o => P(o).metier === P(id).metier)).slice(0, 1);
    const ids = melanger([id].concat(piege, melanger(autres.filter(o => !piege.includes(o))).slice(0, 3 - piege.length)));
    $("zone").innerHTML = '<p class="consigne">' + T("cual") + '</p><div class="enonce centre">' + cible(ph) + '</div><div id="rang"></div><p class="retourMsg" id="msg"></p>';
    images($("rang"), ids, id, ok => juger(ok, ph, ph));
    return true;
  },
  // l'ecoute : la phrase dite, trois personnes
  entendre(w){
    if (w && !estJ(w)) return false;
    const c = PERS().filter(id => !w || jobDe(id).k === w.j); if (!c.length) return false;
    const id = hasard(c), ph = PH(id).cual, J = jobDe(id); SENS_EN.clear();
    viser(w, motJ(J));
    const autres = PERS().filter(o => o !== id && PH(o).cual !== ph);
    const piege = melanger(autres.filter(o => P(o).metier === P(id).metier)).slice(0, 1);
    const ids = melanger([id].concat(piege, melanger(autres.filter(o => !piege.includes(o))).slice(0, 2 - piege.length)));
    $("zone").innerHTML = '<p class="consigne">' + T("entendre") + '</p><button type="button" class="ecoute grand" id="ecoute" aria-label="' + T("reecouter") + '">' + HP + '</button>'
      + '<div id="rang"></div><p class="retourMsg" id="msg"></p>';
    $("ecoute").addEventListener("click", () => dire(ph));
    images($("rang"), ids, id, ok => juger(ok, ph, ph));
    dire(ph);
    return true;
  },
  // True or False : son metier, son lieu de travail, ce qu'il fait
  vraifaux(w){
    let genre;
    if (!w) genre = hasard(["job", "lieu", "verbe"]);
    else genre = estJ(w) ? "job" : estL(w) ? "lieu" : "verbe";
    const c = PERS().filter(id => !w || (genre === "job" ? jobDe(id).k === w.j : genre === "lieu" ? D.metiers[P(id).metier].lieux.includes(w.lieu) : PH(id).fait.inf === w.mot));
    if (!c.length) return false;
    const id = hasard(c), J = jobDe(id), q = PH(id), M = D.metiers[P(id).metier], vrai = Math.random() < 0.5; SENS_EN.clear();
    let juste, faux;
    if (genre === "job"){
      viser(w, motJ(J));
      juste = q.beruf.phrase;
      const X = hasard(EN_J.filter(x => personnesJ(x).length && !voisinsEn(x, J) && (!x.sexe || x.sexe === P(id).sexe)));
      faux = estEn(id) + " " + avecA(X.mot) + ".";
    } else if (genre === "lieu"){
      const lid = w ? w.lieu : hasard(M.lieux);
      viser(w, motL(lid));
      juste = q.ou.lieux[lid];
      const l2 = hasard(Object.keys(EN_L).filter(l => !M.lieux.includes(l) && !M.pasFaux.includes(l)));
      faux = sujEn(id) + " works " + lieuEn(l2) + ".";
    } else {
      viser(w, motV(q.fait.inf));
      juste = q.fait.phrase;
      faux = juste.replace(" " + q.fait.v + " ", " " + hasard(q.fait.faux) + " ");
    }
    ecran("vraifaux", photo(id), vrai ? juste : faux, true);
    const rep = vrai ? "True" : "False";
    boutons($("choix"), ["True", "False"], rep, ok => juger(ok, rep, juste));
    return true;
  }
};
if (APPRENDRE === "en") Object.assign(EX, EX_EN);
// la liste du second onglet, en anglais : chaque metier avec son article (et waiter, waitress ; actor, actress)
const listeEn = () => EN_J.filter(J => J.k !== "waitress").map(J => ({en: J.k === "waiter" ? "a waiter · a waitress" : J.k === "actor" ? "an actor · an actress" : avecA(J.mot),
                                                                      fr: J.k === "waiter" ? "le serveur · la serveuse" : J.k === "actor" ? "l'acteur · l'actrice" : J.gl}));

// ---------- la decouverte : les personnes (la fiche et la galerie), puis le masculin et le feminin ----------
// ce qu'une fiche dit : son metier, ou elle travaille, ce qu'elle fait
const ficheDe = id => { if (APPRENDRE === "en") return PH(id).fiche; const q = PH(id), l = D.metiers[P(id).metier].lieux[0]; return [q.beruf.phrase, q.ou.lieux[l], q.fait.phrase]; };
// les personnes dans l'ordre des metiers : la personne de la scene, puis le portrait
const ORDRE = () => Object.keys(D.metiers).flatMap(met => PERS().filter(id => P(id).metier === met).sort((a, b) => (P(a).scene ? 0 : 1) - (P(b).scene ? 0 : 1)));
function textesAVoix(){
  if (!D) return [];
  if (APPRENDRE === "en") return PERS().map(id => ficheDe(id).join(" ")).concat(listeEn().map(x => x.en.replace(" · ", ", ")));
  return PERS().map(id => ficheDe(id).join(" ")).concat(D.paires[APPRENDRE].map(x => x.m + ", " + x.f));
}
function decouvrir(){
  $("compte").textContent = ""; $("barre").style.width = "0%";
  const z = $("zone");
  z.innerHTML = '<p class="consigne">' + T("intro") + '</p>'
    + '<div class="onglets" role="tablist"><button type="button" id="oPers" role="tab">' + T("ongletPers") + '</button><button type="button" id="oPaires" role="tab">' + T(APPRENDRE === "en" ? "ongletPairesEn" : "ongletPaires") + '</button></div>'
    + '<div id="vue"></div>';
  let dit = "";
  const personnes = () => {
    $("oPers").classList.add("actif"); $("oPaires").classList.remove("actif");
    $("vue").innerHTML = '<div class="fiche" id="fiche"></div><div class="galerie" id="galerie"></div>'
      + '<p class="regle">' + regle("noteArticle") + '</p><p class="regle">' + regle("noteAls") + '</p>'
      + (APPRENDRE === "en" ? '<p class="regle">' + isoler(T(GB ? "bonGb" : "bonUs")) + '</p>' : "");
    const montrerFiche = (id, parle) => {
      const lignes = ficheDe(id);
      dit = lignes.join(" ");
      $("fiche").innerHTML = '<img alt="" src="' + imgSrc(id) + '"><div class="lignes">'
        + lignes.map(l => '<div class="ligne">' + cible(l) + traduction(tradPhrase(l) || (l === lignes[0] ? glose(forme(P(id).metier, P(id).sexe).mot) : "")) + '</div>').join("")
        + '<button type="button" class="ecoute" id="ecoute" aria-label="' + T("ecouter") + '">' + HP + '</button></div>';
      $("ecoute").addEventListener("click", () => dire(dit));
      if (parle) dire(dit);
    };
    const g = $("galerie");
    ORDRE().forEach((id, n) => {
      const b = document.createElement("button"); b.type = "button"; b.dataset.id = id;
      b.innerHTML = '<img alt="" src="' + imgSrc(id) + '"><span lang="' + APPRENDRE + '">' + (P(id).nom ? P(id).nom + " · " : "") + forme(P(id).metier, P(id).sexe).mot + '</span>';
      b.addEventListener("click", () => {
        g.querySelectorAll("button").forEach(x => x.classList.toggle("choisi", x === b));
        montrerFiche(id, true);
        $("fiche").scrollIntoView({behavior: "smooth", block: "nearest"});
      });
      if (!n) b.classList.add("choisi");
      g.appendChild(b);
    });
    // la page s'ouvre sur la premiere personne, sans parler : le son ne vient que d'un geste
    montrerFiche(ORDRE()[0], false);
  };
  const paires = () => {
    $("oPaires").classList.add("actif"); $("oPers").classList.remove("actif");
    $("vue").innerHTML = '<p class="regle">' + regle("noteFem") + '</p><div class="paires" id="paires"></div>';
    const pa = $("paires");
    D.paires[APPRENDRE].forEach(x => {
      const b = document.createElement("button"); b.type = "button";
      const t = tradPhrase(x.m + " → " + x.f) || (glose(x.m.split(" ").slice(1).join(" ")) + " · " + glose(x.f.split(" ").slice(1).join(" ")));
      b.innerHTML = '<span>' + cible(x.m + " · " + x.f) + traduction(t) + '</span>' + HP.replace("<svg", '<svg width="20" height="20"');
      b.addEventListener("click", () => { pa.querySelectorAll("button").forEach(y => y.classList.toggle("choisi", y === b)); dire(x.m + ", " + x.f); });
      pa.appendChild(b);
    });
  };
  // en anglais, le second onglet : un mot pour tous, chaque metier avec son article
  const pairesEn = () => {
    $("oPaires").classList.add("actif"); $("oPers").classList.remove("actif");
    $("vue").innerHTML = '<p class="regle">' + regle("noteFem") + '</p><div class="paires" id="paires"></div>';
    const pa = $("paires");
    listeEn().forEach(x => {
      const b = document.createElement("button"); b.type = "button";
      b.innerHTML = '<span>' + cible(x.en) + traduction(LANGUE === APPRENDRE ? "" : x.fr) + '</span>' + HP.replace("<svg", '<svg width="20" height="20"');
      b.addEventListener("click", () => { pa.querySelectorAll("button").forEach(y => y.classList.toggle("choisi", y === b)); dire(x.en.replace(" · ", ", ")); });
      pa.appendChild(b);
    });
  };
  $("oPers").addEventListener("click", personnes); $("oPaires").addEventListener("click", APPRENDRE === "en" ? pairesEn : paires);
  personnes();
  const s = $("suite"); s.textContent = T("commencer"); s.hidden = false;
  s.onclick = () => { s.onclick = null; taire(); demarrer(); };
}

// LA PARTIE (3 nov. 2026, « le tirage suit les mots ») : la file des MOTS vient de l'app (Tirage.plan : les dus,
// les rates recents, puis au plus NEUFS_MAX nouveaux) ; chaque mot recoit une question d'une sorte qui le vise,
// jamais la meme sorte deux fois de suite, jamais deux fois la meme question. Rate, il revient plus loin.
// Recopie de familia.html (visuel/THEMES-ILLUSTRES.md : ces fonctions sont identiques d'un theme a l'autre).
const NEUFS_MAX = Q.get("seance") === "1" ? 3 : 10;
let vus = new Set(), sorteCourante = null, derniereSorte = null;
function cleQuestion(){
  const z = $("zone"), en = z.querySelector(".enonce");
  return sorteCourante + "|" + (en ? en.textContent : "") + "|" + Array.from(z.querySelectorAll("img")).map(i => i.getAttribute("src")).sort().join(",");
}
function montrer(){
  repondu = false; $("suite").hidden = true; $("bas").hidden = true;
  $("compte").textContent = (rang + 1) + " / " + file.length;
  $("barre").style.width = (rang / file.length * 100) + "%";
  // une question pour le mot du rang : d'une AUTRE sorte que la precedente et jamais deja vue dans la partie.
  // Si ce mot ne le permet pas, un mot plus loin dans la file passe devant ;
  // en dernier recours seulement, la meme sorte, puis une question deja vue.
  // (l'ecoute parle a chaque essai : on la fait taire pendant qu'on cherche, elle parle une fois choisie)
  const garde = dire; dire = () => {};
  const raz = so => { motQ = null; tradQ = null; choixQ = null; sorteCourante = so; };
  const essai = (w, strict) => {
    const autres = melanger(SORTES.filter(x => x !== derniereSorte));
    for (const so of autres){
      for (let n = 0; n < 25; n++){
        raz(so);
        if (!EX[so](w)) break;
        if (!vus.has(cleQuestion())) return so;
      }
    }
    if (strict) return null;
    if (derniereSorte) for (let n = 0; n < 25; n++){           // la meme sorte, avec une question fraiche
      raz(derniereSorte);
      if (!EX[derniereSorte](w)) break;
      if (!vus.has(cleQuestion())) return derniereSorte;
    }
    for (const so of autres.concat(derniereSorte ? [derniereSorte] : [])){   // tout est deja vu : n'importe laquelle
      raz(so);
      if (EX[so](w)) return so;
    }
    return null;
  };
  let fait = essai(file[rang], true);
  for (let j = rang + 1; !fait && j < file.length; j++){
    fait = essai(file[j], true);
    if (fait) [file[rang], file[j]] = [file[j], file[rang]];
  }
  if (!fait) fait = essai(file[rang], false);
  dire = garde;
  if (fait === "entendre"){ const e = $("ecoute"); if (e) e.click(); }
  vus.add(cleQuestion()); derniereSorte = fait;
  window.scrollTo(0, 0); document.body.scrollTop = 0;
}
function fin(){
  $("barre").style.width = "100%"; $("compte").textContent = file.length + " / " + file.length; $("suite").hidden = true;
  $("zone").innerHTML = '<div class="fin"><div class="score">' + T("score", {b: bons, n: file.length}) + '</div></div>';
  basDePartie();
  $("terminer").addEventListener("click", () => parler("fini", {bons, faits: file.length}));
}
// plus rien de du ni de nouveau : la partie le dit, et ne repose pas des mots deja sus
function toutRevu(prochaine){
  $("barre").style.width = "100%"; $("compte").textContent = ""; $("suite").hidden = true;
  const quand = Tirage.revu(prochaine, LANGUE);
  $("zone").innerHTML = '<div class="fin"><div class="score">' + (TIRAGE_TEXTES.revu[LANGUE] || TIRAGE_TEXTES.revu.fr) + '</div>'
    + (quand ? '<p class="consigne">' + (TIRAGE_TEXTES.prochaine[LANGUE] || TIRAGE_TEXTES.prochaine.fr).replace("{d}", quand) + '</p>' : "")
    + '</div>';
  basDePartie();
  $("terminer").addEventListener("click", () => parler("fini", {bons: 0, faits: 0}));
}
// « Encore des questions » : en fin de partie et quand tout est revu, jamais dans la seance (elle a sa longueur)
const boutonEncore = () => Q.get("seance") === "1" ? "" : '<button type="button" class="second" id="encore">' + (TIRAGE_TEXTES.encore[LANGUE] || TIRAGE_TEXTES.encore.fr) + '</button>';
function basDePartie(){
  const b = $("bas"); b.innerHTML = boutonEncore() + '<button type="button" class="principal" id="terminer">' + T("terminer") + '</button>'; b.hidden = false;
  const e = $("encore"); if (e) e.addEventListener("click", () => { b.hidden = true; encoreDesQuestions(); });
}
async function encoreDesQuestions(){
  const mots = motsDuTheme();
  file = Tirage.supplement(mots, await Tirage.demander(mots), NB); rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(null);
  montrer();
}
async function demarrer(){
  const mots = motsDuTheme();
  const plan = Tirage.plan(mots, await Tirage.demander(mots), NB, NEUFS_MAX);
  file = plan.file; rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(plan.prochaine);
  montrer();
}
$("suite").addEventListener("click", () => { if (!file.length) return; rang++; if (rang >= file.length) fin(); else montrer(); });
$("retour").addEventListener("click", () => parler("fermer"));
$("retour").setAttribute("aria-label", T("retourAria"));
$("titre").textContent = T("titre");
document.title = T("titre");
fetch("metiers/metiers.json?v=1").then(r => r.json()).then(d => {
  D = d;
  if (APPRENDRE === "en") preparerAnglais();
  if (Q.get("seance") === "1") demarrer(); else decouvrir();
});
