<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El cuerpo y la salud</title>
<!--
  LE CORPS ET LA SANTE (theme illustre, vague 1, 3 nov. 2026). L'angle : DIRE OU ON A MAL ET COMMENT ON SE SENT --
  des personnes qui ont mal, pas les objets et les lieux des scenes arztpraxis, apotheke et untersuchung.
  Les memes personnes que « Decrire une personne » et la famille d'Anna : le corps se touche sur leurs silhouettes et
  leurs visages ; la douleur se montre (la main sur l'endroit) ; « malade » et « fatigue » sont les visages
  d'Emotions (le lien estar enfermo / tener fiebre, krank sein / Fieber haben).
  L'axe : me duele / me duelen et le pronom (me, te, le, nos, les) ; mir tut / mir tun weh, le DATIF (mir, dir, ihm,
  ihr, Ihnen, uns) ; tener / haben + le mal (fiebre, tos, gripe sans article ; Fieber, Husten) ; le conseil (tienes
  que, du musst dich…) ; et le dialogue chez le medecin, pour l'oral du DTZ.
  Ouverte par l'app dans le cadre des scenes (sceneCadre), elle parle comme une scene : « exercice » et « bonne »
  a chaque reponse, « reponse » {mot, genre, cat, juste} pour le mot teste, « fini » et « fermer » a la fin.
  Parametres : apprendre=es|de|en, lang=<interface>, nuit=1, seance=1 (six questions, pas de decouverte),
  variante=latam|es (espagnol), us|gb (anglais), r=<AUDIO_REVISION>. Les phrases sont FABRIQUEES depuis cuerpo/cuerpo.json
  (visuel/cuerpo/cuerpo.py) : une image ne dit que ce qu'elle montre.
  L'ANGLAIS (4 nov. 2026, essai admin, a Boston, interface en francais) : les memes images et la meme mecanique,
  des phrases ecrites pour l'anglais (objet EN, tables EN_* dans la page) : my / his / her devant la partie du corps,
  jamais « the » (My head hurts, Her knee hurts) ; hurts / hurt ; I have a cold / a fever / the flu ; les composes
  headache, toothache, backache, stomachache, earache et a sore throat ; should + le verbe nu ; for / since ; les
  pluriels foot / feet, tooth / teeth. Le britannique (variante=gb) : a temperature, ill, stomach ache, plaster,
  chemist's, surgery, 38 degres au lieu de 101.
  LE PORTUGAIS (lot P3, 11 nov. 2026, interface en francais) : les memes images et la meme mecanique, des phrases
  ecrites pour le portugais (objet PO, tables PT_* dans la page). Au Portugal : dói-me a cabeça / doem-me os pés, le
  pronom apres le verbe (me, te, lhe, nos, lhes), ao Mark dói-lhe…, tenho dores de cabeça ; estar com febre, estar
  constipado ; tens de + l'infinitif, tenho de me sentar ; o senhor, a senhora, « senhora doutora ». Le Bresil
  (variante=br) : le possessif sans article (minha cabeça dói, a cabeça dele dói), estou com dor de cabeça, estou
  resfriado, você tem que se sentar, vou lhe passar uma receita, um curativo, a tela. as costas (le dos) est pluriel.
-->
<style>
:root{--fond1:#82AFDB;--fond3:#C0D6EA;--encre:#1C2430;--gris:#4C566B;--ambre:#E8A23A;--ambre-f:#A86A0E;--vert:#2F9E6A;--rouge:#C8473A;
  --verre:rgba(255,255,255,.88);--bord:rgba(255,255,255,.95);--carte:#F7F8FA;--zone:rgba(232,162,58,.30);--zone-b:rgba(255,255,255,.95);--police:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html.nuit{--fond1:#0E1C26;--fond3:#18303F;--encre:#EEF2F5;--gris:#A9B8C4;--ambre-f:#E8A23A;--vert:#5CC98F;--rouge:#F07F72;
  --verre:rgba(20,36,50,.88);--bord:rgba(255,255,255,.14);--carte:#22384A;--zone:rgba(232,162,58,.40);--zone-b:rgba(255,255,255,.85)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
/* la page a la hauteur de l'ecran, comme une scene : le contenu defile dans le body (sur iPhone, sinon « Commencer »
   n'est pas tout en bas) */
html{height:100%;overflow:hidden}
body{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;box-sizing:border-box}
body{background:linear-gradient(180deg,var(--fond1),var(--fond3));background-attachment:fixed;color:var(--encre);font-family:var(--police);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 90px) max(10px,env(safe-area-inset-left,0px))}
.haut{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto 10px}
.retour{width:42px;height:42px;border-radius:50%;border:1px solid var(--bord);background:var(--verre);color:var(--encre);font:800 22px var(--police);cursor:pointer;flex:0 0 auto}
html[dir="rtl"] .retour{transform:scaleX(-1)}
.titre{flex:1;font-weight:900;font-size:18px}
.compte{font-weight:800;font-size:14px;color:var(--gris)}
.barre{max-width:560px;margin:0 auto 12px;height:6px;border-radius:3px;background:rgba(28,36,48,.12);overflow:hidden}
.barre i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2BB5AA,#14807A);transition:width .3s}
main{max-width:560px;margin:0 auto;background:var(--verre);border:1px solid var(--bord);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}
.consigne{font-size:14px;font-weight:700;color:var(--gris);margin:0}
.enonce{direction:ltr;text-align:left;background:var(--carte);border-radius:14px;padding:12px 14px;font-weight:800;line-height:1.5;font-size:17px}
.enonce.centre{text-align:center;font-size:19px}
.trou{display:inline-block;min-width:54px;border-bottom:2px solid var(--ambre);text-align:center;color:var(--ambre-f)}
/* une image : la personne qui a mal (3:4), le medecin (4:3) */
.photo{display:block;width:100%;max-width:300px;margin:0 auto;height:auto;aspect-ratio:3/4;object-fit:cover;border-radius:16px;background:var(--carte)}
.photo.doc{object-position:50% 20%}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.duo figure{margin:0;text-align:center;font-weight:800;color:var(--gris);font-size:13px}
.duo img{width:100%;height:auto;aspect-ratio:3/4;object-fit:cover;border-radius:12px;display:block;margin-bottom:4px;background:var(--carte)}
/* la silhouette ou le visage a toucher, et ses zones */
.corps{position:relative;margin:0 auto;line-height:0}
.corps.pied{height:min(58vh,460px);width:fit-content}
.corps.pied img{height:100%;width:auto}
.corps.face{width:100%;max-width:360px}
.corps.face img{width:100%;height:auto;border-radius:14px}
.corps img{display:block}
/* une zone : 30 px a toucher, un petit point visible au centre (la personne reste visible) */
.corps .zone{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:0;padding:0;cursor:pointer;
  --pt:var(--ambre);background:radial-gradient(circle,var(--pt) 0 5px,var(--zone-b) 5px 7.5px,transparent 8px)}
.corps .zone.choisi{--pt:#C8473A;background:radial-gradient(circle,var(--pt) 0 7px,#fff 7px 10px,transparent 10.5px)}
.corps .zone.juste{--pt:var(--vert);background:radial-gradient(circle,var(--pt) 0 8px,#fff 8px 11px,transparent 11.5px)}
.corps .zone.faux{--pt:var(--rouge);background:radial-gradient(circle,var(--pt) 0 8px,#fff 8px 11px,transparent 11.5px)}
.corps.marque .zone{display:none}
.corps.marque .zone.cible{display:block;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:rgba(232,162,58,.35);border:3px solid #fff;animation:pouls 1.4s ease-in-out infinite}
@keyframes pouls{50%{box-shadow:0 0 0 10px rgba(232,162,58,.25)}}
@media (prefers-reduced-motion:reduce){.corps.marque .zone.cible{animation:none}}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix.centre{justify-content:center}
.choix.liste{flex-direction:column}
.choix button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:9px 15px;font:800 15px var(--police);cursor:pointer;text-align:start}
.choix.liste button{border-radius:14px}
.choix button.juste{background:var(--vert);border-color:var(--vert);color:#fff}
.choix button.faux{background:var(--rouge);border-color:var(--rouge);color:#fff}
button:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
button:disabled{cursor:default}
.retourMsg{min-height:1.4em;font-weight:800;font-size:15px;margin:0;line-height:1.45}
.retourMsg.ok{color:var(--vert)} .retourMsg.ko{color:var(--rouge)}
.retourMsg .phrase{display:block;color:var(--encre);font-weight:700}
/* la decouverte : quatre onglets, une planche, la fiche de ce qu'on touche */
.onglets{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--carte);border-radius:16px;padding:4px}
.onglets button{border:0;border-radius:12px;background:none;color:var(--gris);font:800 13px var(--police);padding:8px 4px;cursor:pointer;line-height:1.2}
.onglets button[aria-selected="true"]{background:var(--ambre);color:#1C2430}
.planche{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.planche button{border:3px solid transparent;border-radius:12px;padding:0;background:var(--carte);cursor:pointer;overflow:hidden;display:block}
.planche img{display:block;width:100%;height:auto;aspect-ratio:3/4;object-fit:cover}
.planche button.choisi{border-color:var(--ambre)}
.fiche{background:var(--carte);border-radius:14px;padding:10px;display:grid;grid-template-columns:minmax(110px,42%) 1fr;gap:12px;align-items:center}
.fiche img{width:100%;height:auto;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.fiche .mot{font-weight:900;font-size:22px;color:var(--ambre-f);line-height:1.15}
.fiche .dit{font-weight:800;font-size:17px;line-height:1.4;margin-top:6px}
.fiche .conseil{margin-top:10px;font-weight:700;font-size:15px;line-height:1.4;border-top:1px solid rgba(28,36,48,.12);padding-top:8px}
.fiche .conseil small{display:block;color:var(--gris);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.ecoute{margin-top:8px;width:44px;height:44px;border-radius:50%;border:2px solid var(--ambre);background:var(--verre);color:var(--encre);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.ecoute svg{width:22px;height:22px}
.motCorps{text-align:center;min-height:3.2em}
.motCorps .mot{font-weight:900;font-size:22px;color:var(--ambre-f)}
.gens{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.gens button{border:2px solid transparent;border-radius:50%;padding:0;width:46px;height:46px;overflow:hidden;background:var(--carte);cursor:pointer}
.gens button img{width:100%;height:100%;object-fit:cover;display:block}
.gens button[aria-pressed="true"]{border-color:var(--ambre)}
.dialogue{display:flex;flex-direction:column;gap:8px}
.dialogue .ligne{display:flex;gap:8px;align-items:flex-start;background:var(--carte);border-radius:14px;padding:8px 10px;border:0;text-align:start;color:var(--encre);font:inherit;cursor:pointer;width:100%}
.dialogue .qui{flex:0 0 auto;font-size:12px;font-weight:900;color:var(--ambre-f);min-width:52px;padding-top:3px}
.dialogue .txt{font-weight:800;font-size:16px;line-height:1.4}
.dialogue .ligne.patient{background:rgba(43,181,170,.12)}
/* le haut-parleur de chaque replique (Jacques, 5 nov. : « il faudrait qu'il y ait des petits haut-parleurs pour les
   lignes, pour qu'on puisse voir qu'on peut cliquer pour entendre ») : celui de l'app, dans un rond, au bout de la ligne */
.dialogue .dit{flex:1 1 auto;min-width:0}
.dialogue .hp-ligne{flex:0 0 auto;align-self:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--ambre);background:var(--verre);
  color:var(--encre);display:inline-flex;align-items:center;justify-content:center}
.dialogue .hp-ligne .ic-hp{width:18px;height:18px;display:block}
.dialogue .ligne:active .hp-ligne,.dialogue .ligne.joue .hp-ligne{background:var(--ambre);color:#1C2430}
.regle{margin:0;font-size:14px;font-weight:700;line-height:1.45;color:var(--gris);background:var(--carte);border-radius:12px;padding:10px 12px}
.suite{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:54px;border:0;border-radius:27px;
  color:#fff;font:800 17px var(--police);background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28);cursor:pointer;z-index:5000}
.suite[hidden]{display:none}
/* les boutons de la fin, eux aussi tout en bas de l'ecran (Jacques, 3 nov. : « toujours en bas complètement », comme les scenes) */
.basFixe{position:fixed;left:max(16px,calc(50% - 199px));right:max(16px,calc(50% - 199px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:5000}
.basFixe[hidden]{display:none}
.basFixe button{flex:1;height:54px;border-radius:27px;font:800 16px var(--police);cursor:pointer;padding:0 10px;line-height:1.15}
.basFixe button{border:0;color:#fff;background:linear-gradient(180deg,rgba(120,200,150,.94),rgba(52,140,90,.96));box-shadow:0 10px 24px rgba(30,90,60,.28)}
.fin{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:10px 0}
.fin .score{font-size:22px;font-weight:900}
.fin button{border:2px solid var(--ambre);background:var(--verre);color:var(--encre);border-radius:999px;padding:10px 18px;font:800 16px var(--police);cursor:pointer}
[lang]{unicode-bidi:isolate}
.trad{display:block;font-size:13px;font-weight:600;font-style:italic;color:var(--gris);line-height:1.35;margin-top:2px}
.trad.faux{color:var(--rouge)}
@media (max-width:400px){.planche{grid-template-columns:repeat(4,1fr)}.onglets button{font-size:12px}}
</style>
</head>
<body>
<div class="haut"><button class="retour" id="retour" type="button">‹</button><div class="titre" id="titre"></div><div class="compte" id="compte" dir="ltr"></div></div>
<div class="barre"><i id="barre"></i></div>
<main id="zone"></main>
<button class="suite" id="suite" type="button" hidden></button>
<div class="bas basFixe" id="basFixe" hidden></div>
<script src="themes/tirage.js?v=3"></script>
<script src="themes/voix.js?v=7"></script>
<script src="themes/fin.js?v=2"></script>
<script src="themes/zoom.js?v=3"></script>
<script src="themes/verre.js?v=8"></script>
<script>
const Q = new URLSearchParams(location.search);
// le portugais (lot P3, 11 nov. 2026) : apprendre=pt, variante=br pour le Bresil
const APPRENDRE = ["de", "en", "pt"].includes(Q.get("apprendre")) ? Q.get("apprendre") : "es";
const GB = APPRENDRE === "en" && Q.get("variante") === "gb";
const BR = APPRENDRE === "pt" && Q.get("variante") === "br";
const LANGUE = (l => ["fr", "en", "tr", "uk", "fa", "ar", "pt", "pl", "ru", "de"].includes(l) ? l : "fr")(((Q.get("lang") || "fr").toLowerCase().split(/[-_]/)[0]));
if (Q.get("nuit") === "1") document.documentElement.classList.add("nuit");
document.documentElement.lang = LANGUE;
document.documentElement.dir = (LANGUE === "fa" || LANGUE === "ar") ? "rtl" : "ltr";
// vingt questions seul (Jacques, 3 nov.), six dans la seance du jour, sans la decouverte
const NB = Q.get("seance") === "1" ? Math.max(2, Math.min(12, parseInt(Q.get("nb"), 10) || 6)) : 20;   // nb : le reglage « Questions par scene et par theme » de la seance du jour (5 · 8 · 12, 7 nov. 2026)
// agrandir (themes/zoom.js) : un toucher sur la photo d'une personne, d'un medecin ou d'une fiche ; la loupe sur la
// silhouette et le visage qu'on touche pour repondre (« Toca la rodilla »), pour ne jamais repondre en voulant regarder
Zoom.init({direct: "img.photo, .duo img, .fiche img", loupe: ".corps", langue: LANGUE});

const TEXTES = {
  titre:     {fr:"Le corps et la santé", en:"Body and health", tr:"Vücut ve sağlık", uk:"Тіло і здоров'я", fa:"بدن و سلامتی", ar:"الجسم والصحة", pt:"O corpo e a saúde", pl:"Ciało i zdrowie", ru:"Тело и здоровье", de:"Körper und Gesundheit"},
  oCorps:    {fr:"Le corps", en:"The body", tr:"Vücut", uk:"Тіло", fa:"بدن", ar:"الجسم", pt:"O corpo", pl:"Ciało", ru:"Тело", de:"Der Körper"},
  oMal:      {fr:"J'ai mal", en:"It hurts", tr:"Ağrım var", uk:"Мені болить", fa:"درد دارم", ar:"أشعر بألم", pt:"Estou com dor", pl:"Boli mnie", ru:"Мне больно", de:"Es tut weh"},
  oMalade:   {fr:"Je suis malade", en:"I'm sick", tr:"Hastayım", uk:"Я хворію", fa:"مریضم", ar:"أنا مريض", pt:"Estou doente", pl:"Jestem chory", ru:"Я болею", de:"Ich bin krank"},
  oMedecin:  {fr:"Chez le médecin", en:"At the doctor's", tr:"Doktorda", uk:"У лікаря", fa:"پیش پزشک", ar:"عند الطبيب", pt:"No médico", pl:"U lekarza", ru:"У врача", de:"Beim Arzt"},
  introCorps:{fr:"Touche un point sur le corps : tu vois le mot et tu l'entends. Change de personne en dessous.", en:"Tap a spot on the body to see and hear the word. Switch person below.", tr:"Vücutta bir noktaya dokun: kelimeyi gör ve dinle. Aşağıdan kişiyi değiştir.", uk:"Торкнися точки на тілі: побачиш і почуєш слово. Нижче можна змінити людину.", fa:"روی نقطه‌ای از بدن بزن تا واژه را ببینی و بشنوی. پایین‌تر می‌توانی شخص را عوض کنی.", ar:"المس نقطة على الجسم لترى الكلمة وتسمعها. غيّر الشخص في الأسفل.", pt:"Toque em um ponto do corpo para ver e ouvir a palavra. Troque de pessoa embaixo.", pl:"Dotknij punktu na ciele, aby zobaczyć i usłyszeć słowo. Poniżej zmienisz osobę.", ru:"Нажми на точку на теле, чтобы увидеть и услышать слово. Ниже можно сменить человека.", de:"Tippe auf einen Punkt am Körper: Du siehst und hörst das Wort. Unten wechselst du die Person."},
  introMal:  {fr:"Touche une personne : tu vois et tu entends où elle a mal.", en:"Tap a person to see and hear where it hurts.", tr:"Bir kişiye dokun: nerenin ağrıdığını gör ve dinle.", uk:"Торкнися людини: побачиш і почуєш, де їй болить.", fa:"روی یک نفر بزن تا ببینی و بشنوی کجایش درد می‌کند.", ar:"المس شخصًا لترى وتسمع أين يؤلمه.", pt:"Toque em uma pessoa para ver e ouvir onde dói.", pl:"Dotknij osoby, aby zobaczyć i usłyszeć, co ją boli.", ru:"Нажми на человека, чтобы увидеть и услышать, где у него болит.", de:"Tippe auf eine Person: Du siehst und hörst, wo es wehtut."},
  introMalade:{fr:"Touche une personne : ce qu'elle a, et le conseil qu'on lui donne.", en:"Tap a person to see what is wrong, and the advice they get.", tr:"Bir kişiye dokun: neyi olduğunu ve ona verilen tavsiyeyi gör.", uk:"Торкнися людини: що з нею, і яку пораду їй дають.", fa:"روی یک نفر بزن: چه مشکلی دارد و چه توصیه‌ای به او می‌کنند.", ar:"المس شخصًا: ما الذي يعانيه، والنصيحة التي تُقدَّم له.", pt:"Toque em uma pessoa: o que ela tem e o conselho que recebe.", pl:"Dotknij osoby: co jej dolega i jaką radę dostaje.", ru:"Нажми на человека: что с ним и какой совет ему дают.", de:"Tippe auf eine Person: was sie hat und welchen Rat sie bekommt."},
  introMedecin:{fr:"Un rendez-vous chez la médecin. Touche une réplique pour l'entendre : c'est l'oral de l'examen.", en:"An appointment with the doctor. Tap a line to hear it: it's the speaking part of the exam.", tr:"Doktorda bir randevu. Dinlemek için bir cümleye dokun: sınavın sözlü bölümü.", uk:"Візит до лікарки. Торкнися репліки, щоб її почути: це усна частина іспиту.", fa:"یک نوبت پیش پزشک. روی هر جمله بزن تا بشنوی: این بخش شفاهی آزمون است.", ar:"موعد عند الطبيبة. المس جملة لتسمعها: إنه الجزء الشفهي من الامتحان.", pt:"Uma consulta com a médica. Toque em uma fala para ouvi-la: é a parte oral do exame.", pl:"Wizyta u lekarki. Dotknij kwestii, aby ją usłyszeć: to część ustna egzaminu.", ru:"Приём у врача. Нажми на реплику, чтобы её услышать: это устная часть экзамена.", de:"Ein Termin bei der Ärztin. Tippe auf einen Satz, um ihn zu hören: Das ist der mündliche Teil der Prüfung."},
  regleMalEs:{fr:"« Me duele » pour une chose, « me duelen » pour plusieurs : me duele la cabeza, me duelen los pies. Pour quelqu'un d'autre : te, le, nos, les (a Mark le duele la espalda).", en:"\"Me duele\" for one thing, \"me duelen\" for several: me duele la cabeza, me duelen los pies. For someone else: te, le, nos, les (a Mark le duele la espalda).", tr:"Tek bir şey için « me duele », birden fazlası için « me duelen »: me duele la cabeza, me duelen los pies. Başkası için: te, le, nos, les (a Mark le duele la espalda).", uk:"« Me duele » — коли болить щось одне, « me duelen » — кілька: me duele la cabeza, me duelen los pies. Про іншу людину: te, le, nos, les (a Mark le duele la espalda).", fa:"« me duele » برای یک چیز، « me duelen » برای چند چیز: me duele la cabeza، me duelen los pies. برای کسی دیگر: te، le، nos، les (a Mark le duele la espalda).", ar:"« me duele » لشيء واحد و« me duelen » لعدة أشياء: me duele la cabeza، ‏me duelen los pies. ولشخص آخر: te، le، nos، les ‏(a Mark le duele la espalda).", pt:"« Me duele » para uma coisa, « me duelen » para várias: me duele la cabeza, me duelen los pies. Para outra pessoa: te, le, nos, les (a Mark le duele la espalda).", pl:"« Me duele » — gdy boli jedna rzecz, « me duelen » — kilka: me duele la cabeza, me duelen los pies. O kimś innym: te, le, nos, les (a Mark le duele la espalda).", ru:"« Me duele » — когда болит что-то одно, « me duelen » — несколько: me duele la cabeza, me duelen los pies. О другом человеке: te, le, nos, les (a Mark le duele la espalda).", de:"„Me duele“ für eine Sache, „me duelen“ für mehrere: me duele la cabeza, me duelen los pies. Für jemand anderen: te, le, nos, les (a Mark le duele la espalda)."},
  regleMalDe:{fr:"En allemand, « ça me fait mal » se dit au datif : mir, dir, ihm, ihr, Ihnen, uns. tut pour une chose, tun pour plusieurs : mir tut der Kopf weh, mir tun die Füße weh. On dit aussi : ich habe Kopfschmerzen.", en:"In German, \"it hurts me\" takes the dative: mir, dir, ihm, ihr, Ihnen, uns. tut for one thing, tun for several: mir tut der Kopf weh, mir tun die Füße weh. You can also say: ich habe Kopfschmerzen.", tr:"Almancada « bana acı veriyor » datif ile söylenir: mir, dir, ihm, ihr, Ihnen, uns. Tek şey için tut, birden fazlası için tun: mir tut der Kopf weh, mir tun die Füße weh. Şöyle de denir: ich habe Kopfschmerzen.", uk:"Німецькою « мені болить » кажуть із давальним відмінком: mir, dir, ihm, ihr, Ihnen, uns. tut — для одного, tun — для кількох: mir tut der Kopf weh, mir tun die Füße weh. Можна й так: ich habe Kopfschmerzen.", fa:"در آلمانی « درد می‌کند » با حالت مفعول‌له (داتیو) گفته می‌شود: mir، dir، ihm، ihr، Ihnen، uns. برای یک چیز tut و برای چند چیز tun: mir tut der Kopf weh، mir tun die Füße weh. این را هم می‌گویند: ich habe Kopfschmerzen.", ar:"في الألمانية تُقال « يؤلمني » بحالة الجر (الداتيف): mir، dir، ihm، ihr، Ihnen، uns. ‏tut لشيء واحد و‏tun لعدة أشياء: ‏mir tut der Kopf weh، ‏mir tun die Füße weh. ويُقال أيضًا: ‏ich habe Kopfschmerzen.", pt:"Em alemão, « dói em mim » se diz com o dativo: mir, dir, ihm, ihr, Ihnen, uns. tut para uma coisa, tun para várias: mir tut der Kopf weh, mir tun die Füße weh. Também se diz: ich habe Kopfschmerzen.", pl:"Po niemiecku « boli mnie » mówi się z celownikiem: mir, dir, ihm, ihr, Ihnen, uns. tut — o jednej rzeczy, tun — o kilku: mir tut der Kopf weh, mir tun die Füße weh. Można też: ich habe Kopfschmerzen.", ru:"По-немецки « мне больно » говорят с дательным падежом: mir, dir, ihm, ihr, Ihnen, uns. tut — для одного, tun — для нескольких: mir tut der Kopf weh, mir tun die Füße weh. Можно и так: ich habe Kopfschmerzen.", de:"Mir tut der Kopf weh, mir tun die Füße weh: mir, dir, ihm, ihr, Ihnen, uns."},
  regleMaladeEs:{fr:"Le mal se dit avec tener, souvent sans article : tengo fiebre, tos, gripe — mais tengo un resfriado. Comment on se sent : estar (estoy cansado). Le conseil : tienes que + l'infinitif.", en:"Illness takes tener, often without an article: tengo fiebre, tos, gripe — but tengo un resfriado. How you feel: estar (estoy cansado). Advice: tienes que + the infinitive.", tr:"Hastalık tener ile, çoğu zaman artikelsiz söylenir: tengo fiebre, tos, gripe — ama tengo un resfriado. Nasıl hissettiğin: estar (estoy cansado). Tavsiye: tienes que + mastar.", uk:"Хворобу кажуть із tener, часто без артикля: tengo fiebre, tos, gripe — але tengo un resfriado. Як почуваєшся: estar (estoy cansado). Порада: tienes que + інфінітив.", fa:"بیماری را با tener و اغلب بدون حرف تعریف می‌گویند: tengo fiebre، tos، gripe — اما tengo un resfriado. حال و احوال: estar (estoy cansado). توصیه: tienes que + مصدر.", ar:"يُقال المرض مع tener وغالبًا بلا أداة تعريف: tengo fiebre، tos، gripe — لكن tengo un resfriado. والشعور: estar ‏(estoy cansado). والنصيحة: tienes que + المصدر.", pt:"A doença se diz com tener, muitas vezes sem artigo: tengo fiebre, tos, gripe — mas tengo un resfriado. Como você se sente: estar (estoy cansado). O conselho: tienes que + infinitivo.", pl:"Chorobę mówi się z tener, często bez rodzajnika: tengo fiebre, tos, gripe — ale tengo un resfriado. Jak się czujesz: estar (estoy cansado). Rada: tienes que + bezokolicznik.", ru:"Болезнь говорят с tener, часто без артикля: tengo fiebre, tos, gripe — но tengo un resfriado. Как себя чувствуешь: estar (estoy cansado). Совет: tienes que + инфинитив.", de:"Krankheiten sagt man mit tener, oft ohne Artikel: tengo fiebre, tos, gripe — aber tengo un resfriado. Wie man sich fühlt: estar (estoy cansado). Der Rat: tienes que + Infinitiv."},
  regleMaladeDe:{fr:"Le mal se dit avec haben : ich habe Fieber, Husten (sans article), eine Grippe, eine Erkältung. Comment on se sent : sein (ich bin müde). Le conseil : du musst + l'infinitif à la fin, avec dich pour un verbe réfléchi : du musst dich ausruhen.", en:"Illness takes haben: ich habe Fieber, Husten (no article), eine Grippe, eine Erkältung. How you feel: sein (ich bin müde). Advice: du musst + the infinitive at the end, with dich for a reflexive verb: du musst dich ausruhen.", tr:"Hastalık haben ile söylenir: ich habe Fieber, Husten (artikelsiz), eine Grippe, eine Erkältung. Nasıl hissettiğin: sein (ich bin müde). Tavsiye: du musst + sonda mastar, dönüşlü fiilde dich ile: du musst dich ausruhen.", uk:"Хворобу кажуть із haben: ich habe Fieber, Husten (без артикля), eine Grippe, eine Erkältung. Як почуваєшся: sein (ich bin müde). Порада: du musst + інфінітив у кінці, із dich для зворотного дієслова: du musst dich ausruhen.", fa:"بیماری را با haben می‌گویند: ich habe Fieber، Husten (بدون حرف تعریف)، eine Grippe، eine Erkältung. حال و احوال: sein (ich bin müde). توصیه: du musst + مصدر در آخر جمله، و برای فعل انعکاسی dich: du musst dich ausruhen.", ar:"يُقال المرض مع haben: ‏ich habe Fieber، Husten (بلا أداة)، eine Grippe، eine Erkältung. والشعور: sein ‏(ich bin müde). والنصيحة: du musst + المصدر في آخر الجملة، مع dich للفعل الانعكاسي: ‏du musst dich ausruhen.", pt:"A doença se diz com haben: ich habe Fieber, Husten (sem artigo), eine Grippe, eine Erkältung. Como você se sente: sein (ich bin müde). O conselho: du musst + infinitivo no fim, com dich para um verbo reflexivo: du musst dich ausruhen.", pl:"Chorobę mówi się z haben: ich habe Fieber, Husten (bez rodzajnika), eine Grippe, eine Erkältung. Jak się czujesz: sein (ich bin müde). Rada: du musst + bezokolicznik na końcu, z dich przy czasowniku zwrotnym: du musst dich ausruhen.", ru:"Болезнь говорят с haben: ich habe Fieber, Husten (без артикля), eine Grippe, eine Erkältung. Как себя чувствуешь: sein (ich bin müde). Совет: du musst + инфинитив в конце, с dich для возвратного глагола: du musst dich ausruhen.", de:"Ich habe Fieber, ich bin müde, du musst dich ausruhen."},
  regleMedecin:{fr:"Chez le médecin, on se vouvoie. Dis où tu as mal et depuis quand ; écoute le conseil et remercie.", en:"At the doctor's, people use the polite form. Say where it hurts and since when; listen to the advice and say thank you.", tr:"Doktorda resmî hitap edilir. Nerenin ağrıdığını ve ne zamandan beri olduğunu söyle; tavsiyeyi dinle ve teşekkür et.", uk:"У лікаря звертаються на « ви ». Скажи, де болить і відколи; вислухай пораду й подякуй.", fa:"پیش پزشک رسمی صحبت می‌کنند. بگو کجایت درد می‌کند و از کی؛ به توصیه گوش بده و تشکر کن.", ar:"عند الطبيب نستعمل صيغة الاحترام. قل أين يؤلمك ومنذ متى، واستمع إلى النصيحة واشكر.", pt:"No médico, usa-se o tratamento formal. Diga onde dói e desde quando; ouça o conselho e agradeça.", pl:"U lekarza mówi się per pan, pani. Powiedz, co boli i od kiedy; wysłuchaj rady i podziękuj.", ru:"У врача говорят на « вы ». Скажи, где болит и с какого времени; выслушай совет и поблагодари.", de:"Beim Arzt sagt man Sie. Sag, wo es wehtut und seit wann; hör dir den Rat an und bedank dich."},
  conseil:   {fr:"Le conseil", en:"Advice", tr:"Tavsiye", uk:"Порада", fa:"توصیه", ar:"النصيحة", pt:"O conselho", pl:"Rada", ru:"Совет", de:"Der Rat"},

  queDuele:  {fr:"Regarde l'image : où cette personne a-t-elle mal ?", en:"Look at the picture: where does it hurt?", tr:"Resme bak: bu kişinin neresi ağrıyor?", uk:"Подивися на зображення: де болить цій людині?", fa:"به تصویر نگاه کن: کجای این شخص درد می‌کند؟", ar:"انظر إلى الصورة: أين يتألم هذا الشخص؟", pt:"Olhe a imagem: onde dói nesta pessoa?", pl:"Spójrz na obrazek: co boli tę osobę?", ru:"Посмотри на картинку: где у этого человека болит?", de:"Sieh dir das Bild an: Wo tut es der Person weh?"},

  nombrar:   {fr:"Quelle partie du corps est marquée ?", en:"Which part of the body is marked?", tr:"Vücudun hangi bölümü işaretli?", uk:"Яку частину тіла позначено?", fa:"کدام عضو بدن علامت خورده است؟", ar:"أي جزء من الجسم مُعلَّم؟", pt:"Qual parte do corpo está marcada?", pl:"Która część ciała jest zaznaczona?", ru:"Какая часть тела отмечена?", de:"Welcher Körperteil ist markiert?"},

  pronEs:    {fr:"Choisis le bon pronom : me, te, le, nos ou les ?", en:"Choose the right pronoun: me, te, le, nos or les?", tr:"Doğru zamiri seç: me, te, le, nos ya da les?", uk:"Обери правильний займенник: me, te, le, nos чи les?", fa:"ضمیر درست را انتخاب کن: me، te، le، nos یا les؟", ar:"اختر الضمير الصحيح: me أم te أم le أم nos أم les؟", pt:"Escolha o pronome certo: me, te, le, nos ou les?", pl:"Wybierz właściwy zaimek: me, te, le, nos czy les?", ru:"Выбери правильное местоимение: me, te, le, nos или les?", de:"Wähle das richtige Pronomen: me, te, le, nos oder les?"},
  pronDe:    {fr:"Choisis le bon pronom au datif : mir, dir, ihm, ihr, Ihnen ou uns ?", en:"Choose the right dative pronoun: mir, dir, ihm, ihr, Ihnen or uns?", tr:"Doğru datif zamirini seç: mir, dir, ihm, ihr, Ihnen ya da uns?", uk:"Обери займенник у давальному відмінку: mir, dir, ihm, ihr, Ihnen чи uns?", fa:"ضمیر درست داتیو را انتخاب کن: mir، dir، ihm، ihr، Ihnen یا uns؟", ar:"اختر ضمير الجر الصحيح: mir أم dir أم ihm أم ihr أم Ihnen أم uns؟", pt:"Escolha o pronome certo no dativo: mir, dir, ihm, ihr, Ihnen ou uns?", pl:"Wybierz zaimek w celowniku: mir, dir, ihm, ihr, Ihnen czy uns?", ru:"Выбери местоимение в дательном падеже: mir, dir, ihm, ihr, Ihnen или uns?", de:"Wähle das richtige Pronomen im Dativ: mir, dir, ihm, ihr, Ihnen oder uns?"},
  queTiene:  {fr:"Regarde l'image : qu'est-ce qui ne va pas ?", en:"Look at the picture: what's wrong?", tr:"Resme bak: sorun ne?", uk:"Подивися на зображення: що сталося?", fa:"به تصویر نگاه کن: چه مشکلی دارد؟", ar:"انظر إلى الصورة: ما المشكلة؟", pt:"Olhe a imagem: o que está acontecendo?", pl:"Spójrz na obrazek: co się dzieje?", ru:"Посмотри на картинку: что случилось?", de:"Sieh dir das Bild an: Was ist los?"},
  verboEs:   {fr:"Choisis le bon verbe : tiene, está, duele ou duelen ?", en:"Choose the right verb: tiene, está, duele or duelen?", tr:"Doğru fiili seç: tiene, está, duele ya da duelen?", uk:"Обери правильне дієслово: tiene, está, duele чи duelen?", fa:"فعل درست را انتخاب کن: tiene، está، duele یا duelen؟", ar:"اختر الفعل الصحيح: tiene أم está أم duele أم duelen؟", pt:"Escolha o verbo certo: tiene, está, duele ou duelen?", pl:"Wybierz właściwy czasownik: tiene, está, duele czy duelen?", ru:"Выбери правильный глагол: tiene, está, duele или duelen?", de:"Wähle das richtige Verb: tiene, está, duele oder duelen?"},
  verboDe:   {fr:"Choisis le bon verbe : hat, ist, tut ou tun ?", en:"Choose the right verb: hat, ist, tut or tun?", tr:"Doğru fiili seç: hat, ist, tut ya da tun?", uk:"Обери правильне дієслово: hat, ist, tut чи tun?", fa:"فعل درست را انتخاب کن: hat، ist، tut یا tun؟", ar:"اختر الفعل الصحيح: hat أم ist أم tut أم tun؟", pt:"Escolha o verbo certo: hat, ist, tut ou tun?", pl:"Wybierz właściwy czasownik: hat, ist, tut czy tun?", ru:"Выбери правильный глагол: hat, ist, tut или tun?", de:"Wähle das richtige Verb: hat, ist, tut oder tun?"},

let MOTS = null;

  if (MOTS) return MOTS;

  if (APPRENDRE === "pt") return (MOTS = motsPortugais());

    const [mot, g] = APPRENDRE === "de" ? v.cde : v.ces, cle = g + " " + mot;

  Object.entries(D.sintomas).forEach(([k, v]) => { const [mot, g] = APPRENDRE === "de" ? v.cde : v.ces; MOTS.push({mot, genre: g, s: k}); });
  Object.entries(D.estados).forEach(([k, v]) => MOTS.push({mot: APPRENDRE === "de" ? v.de : v.es[0], cat: "adjectif", e: k}));
  if (APPRENDRE === "de"){
    Object.entries(SCHMERZ).forEach(([k, mot]) => MOTS.push({mot, genre: "die", schmerz: k}));
    MOTS.push({mot: "Rezept", genre: "das", c: "receta"}, {mot: "Termin", genre: "der", c: "cita"}, {mot: "Arzt", genre: "der", doc: "m"}, {mot: "Ärztin", genre: "die", doc: "f"});

    const ache = !!(w && w.ache), p = quelquun(k), image = imgMal(k, p).split("/").pop().replace(".webp", "");
    const cs = Object.keys(D.consejos).filter(c => D.consejos[c].va.includes(k) || (D.consejos[c].images || []).includes(image));
    if (!cs.length) return false;
    const c = hasard(cs), per = hasard(["1", "2", "3"]); motQ = w || motDe(k);
    const dit = plein(ache ? EN.ache("1", k, p) : EN.mal("1", k, p)), dit3 = plein(ache ? EN.ache("3", k, p) : EN.mal("3", k, p));
    const phrase = per === "1" ? nom(p) + ": “" + dit + " " + EN.consejo("1", c, p) + "”"
                 : per === "2" ? nom(p) + ": “" + dit + "” — " + EN.consejo("2", c, p)
                 : dit3 + " " + EN.consejo("3", c, p);
    sensQ = tr => {
      const m = x => ache || genre(k) === "d" ? tr.dolor(x, k, p) : genre(k) === "s" ? tr.sint(x, k, p) : tr.estado(x, k, p);
      return per === "1" ? nom(p) + " : « " + m("1") + " " + tr.consejo("1", c, p) + " »" : per === "2" ? nom(p) + " : « " + m("1") + " » — " + tr.consejo("2", c, p)
           : m("3") + " " + tr.consejo("3", c, p);
    };
    return aTrou("should", photo(k, p), phrase, "modal", ["should", "should to", "shoulds", "must to"]);
  },
  // L'ANGLAIS SEULEMENT : for + une duree, since + un point de depart ; jamais during (le francais dit « depuis »)
  depuis(w){
    if (APPRENDRE !== "en") return false;
    const ache = !!(w && w.ache);
    const k = ache ? w.ache : unMal(w, x => x !== "alergia"); if (!k) return false;
    const f = docAuHasard(), p = quelquun(k, nomDoc(f)); motQ = w || motDe(k);
    const g = ache ? "a" : genre(k);
    const q = g === "a" ? "How long have you had " + EN.unAche(k) + "?"
            : g === "d" ? "How long " + (PLURIEL(k) ? "have" : "has") + " your " + EN.parte(k) + " been hurting?"
            : g === "s" ? "How long have you had " + EN.sintPlein(k) + "?" : "How long have you been " + EN_ETAT[k] + "?";
    const pour = Math.random() < 0.5, d = hasard(pour ? ["two days", "three days", "four days", "a week"] : ["yesterday", "Monday", "last week", "this morning"]);
    const phrase = "— Hello, " + nom(p) + ". " + q + " — ⟦prep|" + (pour ? "For" : "Since") + "⟧ " + d + ".";
    sensQ = tr => tr.depuis(k, ache, p, d);
    return aTrou("depuis", duo(fig(imgDoc(f), nomDoc(f), EN.doc(f)), fig(imgMal(k, p), p)), phrase, "prep", ["For", "Since", "During"]);
  }
};
// l'anglais : « Where does it hurt, Carmen? » -> « My knee. » (la personne repond elle-meme, avec my)
function queDueleEn(k, p){
  const mon = x => "My " + EN.parte(x) + ".", rep = mon(k), ls = leurresMaux(k, 3, x => genre(x) === "d", p);
  sensQ = tr => tr.dolor("1", k, p);
  ecran("queDuele", photo(k, p), EN.queDuele(p), true);
  boutons($("choix"), melanger([rep, ...ls.map(mon)]), rep, ok => juger(ok, rep, plein(EN.dolor("1", k, p))),
          o => { const x = ls.find(y => mon(y) === o); return x && TR ? FR_EN.mon(x) : null; });
  return true;
}
// des composes leurres : jamais un voisin (l'oreille et la dent se touchent sur la joue), jamais un mal que la personne
// montre sur une autre image
function leurresAche(k, n, p){
  const l = Object.keys(EN_ACHE).filter(x => x !== k && !(p && gensDe(x).includes(p))), loins = l.filter(x => loin(x, k));
  return melanger(loins.length >= n ? loins : l).slice(0, n);
}
// LE DIALOGUE CHEZ LE MEDECIN (l'oral du DTZ) : la replique du medecin ou du patient, la case du mot teste
function dialogue(w, qui){
  const M = L[qui], f = docAuHasard(), doc = fig(imgDoc(f), nomDoc(f), L.doc(f));
  let phrase, cas, opts, image, sens;
  if (w && w.doc){
    if (qui !== "medico") return false;
    const ff = w.doc === "*" ? docAuHasard() : w.doc === "f", p = nomDoc(ff); motQ = w;
    phrase = L.quien(p, ff); cas = "mot"; opts = L.leurres.quien; image = docSeul(ff);
    sens = tr => tr.quien(p, ff);
  } else if (w ? w.c : Math.random() < 0.25){
    const c = w ? w.c : hasard(["receta", "cita"]); motQ = w || motsDuTheme().find(m => m.c === c);
    phrase = M[c](f); cas = "mot"; opts = L.leurres[c]; image = docSeul(f); sens = tr => tr[qui][c](f);
  } else if (w ? (w.e === "enfermo" && APPRENDRE === "de") : (APPRENDRE === "de" && Math.random() < 0.1)){
    if (qui !== "medico") return false;
    motQ = w || motDe("enfermo"); phrase = DE.medico.krank(); cas = "mal"; opts = DE.leurres.krank;
    const p = quelquun("gripe", nomDoc(f)); image = duo(doc, fig(imgMal("gripe", p), p)); sens = tr => tr.medico.krank(p);
  } else if (w && w.schmerz || (!w && APPRENDRE === "de" && Math.random() < 0.2)){
    const k = w ? w.schmerz : hasard(Object.keys(SCHMERZ)), p = quelquun(k, nomDoc(f)); motQ = w || motsDuTheme().find(m => m.schmerz === k);
    phrase = M.schmerz(k, p); cas = "mal"; opts = melanger(Object.values(SCHMERZ));
    image = duo(doc, fig(imgMal(k, p), p)); sens = tr => tr[qui].schmerz(k, p);
  } else if (APPRENDRE === "en" && (w ? w.ache : Math.random() < 0.2)){
    // l'anglais : « How long have you had a toothache? », « I've had a headache for three days. »
    const k = w ? w.ache : hasard(Object.keys(EN_ACHE)), p = quelquun(k, nomDoc(f)); motQ = w || motsDuTheme().find(m => m.ache === k);
    phrase = M.ache(k, p); cas = "mal"; opts = leurresAche(k, 3, p).map(EN.unAche);
    image = duo(doc, fig(imgMal(k, p), p)); sens = tr => tr[qui].ache(k, p);
  } else {
    const k = unMal(w, x => genre(x) === "d" || x === "fiebre"); if (!k) return false;
    const p = quelquun(k, nomDoc(f)); motQ = w || motDe(k);
    image = duo(doc, fig(imgMal(k, p), p));
    if (k === "fiebre"){
      phrase = M.fiebre(p); cas = "mal";
      opts = APPRENDRE === "de" ? ["Fieber", "Husten", "eine Allergie", "eine Grippe"] : APPRENDRE === "en" ? EN.fiebreOpts : APPRENDRE === "pt" ? PO.fiebreOpts : ["fiebre", "tos", "alergia", "gripe"];
      sens = tr => tr[qui].fiebre(p);
    } else {
      phrase = M.parte(k, p); cas = "parte"; opts = [L.parte(k), ...leurresMaux(k, 3, x => genre(x) === "d" && PLURIEL(x) === PLURIEL(k), p).map(L.parte)];
      sens = tr => tr[qui].parte(k, p);
    }
  }
  sensQ = sens;
  const rep = trou(phrase, cas)[1];
  return aTrou(qui, image, phrase, cas, [rep].concat(opts.filter(x => x !== rep)).slice(0, 4));
}
// les sortes propres a l'anglais n'existent qu'en anglais ; le pronom reflechi n'existe pas en anglais
const SORTES_EN = ["ache", "article", "pluriel", "should", "depuis"];
const SORTES = Object.keys(EX).filter(x => APPRENDRE === "en" ? x !== "reflexivo" : !SORTES_EN.includes(x));

// tout ce que la page peut dire : la decouverte et les mots cles (visuel/voix_themes.py en fait l'inventaire)
function textesAVoix(){
  const dec = D.decouverte, t = [];
  DOLORES().forEach(k => t.push(plein(L.dolor("1", k, dec[k]))));
  Object.keys(D.sintomas).forEach(k => t.push(plein(L.sint("1", k, dec[k]))));
  t.push(plein(L.estado("1", "cansado", dec.cansado)));
  Object.values(D.consejoDecouverte).forEach(c => t.push(plein(L.consejo("2", c))));
  L.dialogue.forEach(l => t.push(l[1]));
  Object.keys(D.partes).filter(k => P(k).toucher).forEach(k => t.push(L.un(k)));
  // l'anglais : la fiche « My head hurts. I have a headache. » et les composes seuls
  if (APPRENDRE === "en"){
    DOLORES().filter(k => EN_ACHE[k]).forEach(k => t.push(plein(EN.dolor("1", k)) + " " + plein(EN.ache("1", k))));
    Object.keys(EN_ACHE).forEach(k => t.push(plein(EN.ache("1", k))));
  }
  return t.concat(motsDuTheme().map(motCle));
}

// ---------- la decouverte : quatre onglets, on touche, on voit, on entend ----------
function decouvrir(){
  $("compte").textContent = ""; $("barre").style.width = "0%";
  const z = $("zone"), dec = D.decouverte;
  z.innerHTML = '<div class="onglets" role="tablist">' + ["oCorps", "oMal", "oMalade", "oMedecin"].map((o, i) => '<button type="button" role="tab" data-o="' + i + '">' + T(o) + '</button>').join("") + '</div><div id="onglet"></div>';
  const fiche = (k, p, extra) => {
    const g = genre(k), dit = plein(L.mal("1", k, p)) + (APPRENDRE === "en" && g === "d" && EN_ACHE[k] ? " " + plein(EN.ache("1", k, p)) : "")
                                + (APPRENDRE === "pt" && g === "d" && PT_DOR[k] ? " " + PO.dores(k) : ""), trad = TR ? (g === "d" ? TR.dolor("1", k, p) : g === "s" ? TR.sint("1", k, p) : TR.estado("1", k, p)) : glose(motDe(k));
    const c = D.consejoDecouverte[k], conseil = c ? plein(L.consejo("2", c)) : null;
    let h = '<img alt="" src="' + imgMal(k, p) + '"' + repli(p) + '><div><div class="mot">' + cible(APPRENDRE === "pt" ? PO.fiche(k, p) : APPRENDRE === "en" ? (g === "d" ? EN.parte(k) : g === "s" ? EN.sintPlein(k) : EN_ETAT[k]) : g === "d" ? L.parte(k) : g === "s" ? (APPRENDRE === "de" ? D.sintomas[k].de : D.sintomas[k].es) : (APPRENDRE === "de" ? D.estados[k].de : D.estados[k].es[fem(p) ? 1 : 0])) + '</div>'
          + '<div class="dit">' + cible(dit) + '</div>' + (trad ? traduction(trad) : "")
          + '<button type="button" class="ecoute" id="ecoute" aria-label="' + T("ecouter") + '">' + HP + '</button>';
    if (conseil) h += '<div class="conseil"><small>' + T("conseil") + '</small>' + cible(conseil) + (TR ? traduction(TR.consejo("2", c)) : "")
                   + ' <button type="button" class="ecoute" id="ecouteC" aria-label="' + T("ecouter") + '">' + HP + '</button></div>';
    $("fiche").innerHTML = h + '</div>';
    $("ecoute").addEventListener("click", () => Voix.dire(dit));
    if (conseil) $("ecouteC").addEventListener("click", () => Voix.dire(conseil));
    if (!extra) Voix.dire(dit);
  };
  const planche = (cles, intro, regle) => {
    const o = $("onglet");
    o.innerHTML = '<p class="consigne">' + T(intro) + '</p><div class="planche" id="planche"></div><div class="fiche" id="fiche"></div><p class="regle">' + isoler(T(regle)) + '</p>';
    cles.forEach(k => {
      const p = dec[k], b = document.createElement("button"); b.type = "button"; b.dataset.k = k; b.setAttribute("aria-label", nom(p));
      b.innerHTML = '<img alt="" src="' + imgMal(k, p) + '"' + repli(p) + '>';
      b.addEventListener("click", () => { $("planche").querySelectorAll("button").forEach(x => x.classList.toggle("choisi", x === b)); fiche(k, p); });
      $("planche").appendChild(b);
    });
    $("planche").firstChild.classList.add("choisi");
    fiche(cles[0], dec[cles[0]], true);                    // la premiere fiche s'ouvre sans parler : le son vient d'un geste
  };
  const corps = () => {
    const o = $("onglet"), figs = Object.keys(D.toucher.corps).map(p => ["corps", p]).concat(Object.keys(D.toucher.cara).map(p => ["cara", p]));
    o.innerHTML = '<p class="consigne">' + T("introCorps") + '</p><div id="fig"></div><div class="motCorps" id="motCorps"></div><div class="gens" id="gens"></div>';
    const montrerFig = ([sorte, p]) => {
      $("fig").innerHTML = corpsHTML(sorte, p, null, true)[0]; $("motCorps").innerHTML = "";
      $("gens").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === sorte + p));
      $("fig").querySelectorAll(".zone").forEach(b => b.addEventListener("click", () => {
        $("fig").querySelectorAll(".zone").forEach(x => x.classList.toggle("choisi", x.dataset.id === b.dataset.id));
        const k = b.dataset.id, mot = L.un(k);
        $("motCorps").innerHTML = '<div class="mot">' + cible(mot) + '</div>' + (TR ? traduction(TR.cest(k)) : (t => t ? traduction(t) : "")(glose(motDe(k))));
        Voix.dire(mot);
      }));
    };
    figs.forEach(f => {
      const b = document.createElement("button"); b.type = "button"; b.dataset.f = f[0] + f[1]; b.setAttribute("aria-label", nom(f[1]));
      b.innerHTML = '<img alt="" src="descripcion/' + f[1] + '-visage.webp">';
      b.addEventListener("click", () => montrerFig(f));
      $("gens").appendChild(b);
    });
    montrerFig(figs[0]);
  };
  const medecin = () => {
    const o = $("onglet"), tr = TR ? TR.dialogue : null;
    o.innerHTML = '<p class="consigne">' + T(APPRENDRE === "en" ? "introMedecinEn" : "introMedecin") + '</p>' + duo(fig(imgDoc(true), nomDoc(true), L.doc(true)), fig(imgMal("garganta", "Mark"), "Mark", nom("Mark")))
                + '<div class="dialogue" id="dialogue"></div><p class="regle">' + T(APPRENDRE === "en" ? "regleMedecinEn" : APPRENDRE === "pt" ? (BR ? "regleMedecinBr" : "regleMedecinPt") : "regleMedecin") + '</p>'
                + (APPRENDRE === "en" ? '<p class="regle">' + T(GB ? "bonGb" : "bonUs") + '</p>' : APPRENDRE === "pt" ? '<p class="regle">' + T(BR ? "bonBr" : "bonPt") + '</p>' : "");
    L.dialogue.forEach(([qui, txt], i) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "ligne" + (qui === "P" ? " patient" : "");
      b.innerHTML = '<span class="qui">' + (qui === "D" ? nom(nomDoc(true)) : nom("Mark")) + '</span><span class="dit"><span class="txt">' + cible(txt) + '</span>' + (tr ? traduction(tr[i]) : "") + '</span>'
                  + '<span class="hp-ligne" aria-hidden="true">' + HP_APP + '</span>';
      b.setAttribute("aria-label", T("ecouter") + " : " + txt);
      // toucher la replique ou son haut-parleur la fait entendre ; le rond s'allume le temps du geste
      b.addEventListener("click", () => {
        $("dialogue").querySelectorAll(".ligne.joue").forEach(x => x.classList.remove("joue"));
        b.classList.add("joue"); setTimeout(() => b.classList.remove("joue"), 1200);
        Voix.dire(txt);
      });
      $("dialogue").appendChild(b);
    });
  };
  const onglets = [corps, () => planche(DOLORES(), "introMal", APPRENDRE === "de" ? "regleMalDe" : APPRENDRE === "en" ? "regleMalEn" : APPRENDRE === "pt" ? (BR ? "regleMalBr" : "regleMalPt") : "regleMalEs"),
                   () => planche(Object.keys(D.sintomas).concat(["cansado"]), "introMalade", APPRENDRE === "de" ? "regleMaladeDe" : APPRENDRE === "en" ? "regleMaladeEn" : APPRENDRE === "pt" ? (BR ? "regleMaladeBr" : "regleMaladePt") : "regleMaladeEs"), medecin];
  const choisir = i => { z.querySelectorAll(".onglets button").forEach(b => b.setAttribute("aria-selected", b.dataset.o == i)); Voix.arreter(); onglets[i](); };
  z.querySelectorAll(".onglets button").forEach(b => b.addEventListener("click", () => choisir(+b.dataset.o)));
  choisir(0);
  const s = $("suite"); s.textContent = T("commencer"); s.hidden = false;
  s.onclick = () => { s.onclick = null; Voix.arreter(); demarrer(); };
}

// LA PARTIE (« le tirage suit les mots ») : recopie de familia.html, identique d'un theme a l'autre.
const NEUFS_MAX = Q.get("seance") === "1" ? 3 : 10;
// LA PREMIERE SEMAINE (proposition 3 de la revue, 11 nov. 2026) : l'app demande &simple=1 pour un debutant -- une image
// et un mot, pas de phrase entiere. Si aucun mot de la file ne s'y prete, toutes les sortes, comme avant.
const SIMPLES = ["tocar", "nombrar"];
function sortesDuMode(toutes){
  const simples = SORTES.filter(x => SIMPLES.includes(x));
  return (!toutes && Q.get("simple") === "1" && simples.length) ? simples : SORTES;
}
let vus = new Set(), sorteCourante = null, derniereSorte = null;
function cleQuestion(){
  const z = $("zone"), en = z.querySelector(".enonce");
  return sorteCourante + "|" + (en ? en.textContent : "") + "|" + Array.from(z.querySelectorAll("img")).map(i => i.getAttribute("src")).sort().join(",") + "|" + (z.dataset.q || "");
}
function montrer(){
  repondu = false; choixFaux = null; $("suite").hidden = true; $("basFixe").hidden = true;
  $("compte").textContent = (rang + 1) + " / " + file.length;
  $("barre").style.width = (rang / file.length * 100) + "%";
  const essai = (w, strict, toutes) => {
    const autres = melanger(sortesDuMode(toutes).filter(x => x !== derniereSorte));
    for (const so of autres){
      for (let n = 0; n < 25; n++){
        motQ = null; vuQ = null; sensQ = null; sorteCourante = so;
        if (!EX[so](w)) break;
        if (!vus.has(cleQuestion())) return so;
      }
    }
    if (strict) return null;
    if (derniereSorte) for (let n = 0; n < 25; n++){
      motQ = null; vuQ = null; sensQ = null; sorteCourante = derniereSorte;
      if (!EX[derniereSorte](w)) break;
      if (!vus.has(cleQuestion())) return derniereSorte;
    }
    for (const so of autres.concat(derniereSorte ? [derniereSorte] : [])){
      motQ = null; vuQ = null; sensQ = null; sorteCourante = so;
      if (EX[so](w)) return so;
    }
    return null;
  };
  let fait = essai(file[rang], true);
  for (let j = rang + 1; !fait && j < file.length; j++){
    fait = essai(file[j], true);
    if (fait) [file[rang], file[j]] = [file[j], file[rang]];
  }
  if (!fait) fait = essai(file[rang], false);
  // le mode simple : un mot qu'aucune question simple ne sait poser quitte la partie, plutot qu'une phrase entiere
  if (!fait && sortesDuMode(false) !== SORTES){ file.splice(rang, 1); if (rang >= file.length) return file.length ? fin() : toutRevu(null); return montrer(); }
  if (!fait) fait = essai(file[rang], false, true);
  vus.add(cleQuestion()); derniereSorte = fait; retenir();
  window.scrollTo(0, 0); document.body.scrollTop = 0;
}
function fin(){
  $("barre").style.width = "100%"; $("compte").textContent = file.length + " / " + file.length; $("suite").hidden = true;
  $("zone").innerHTML = Fin.bilan(LANGUE, bons, file.length, T("score", {b: bons, n: file.length}));
  basDeFin(() => parler("fini", {bons, faits: file.length}));
}
function toutRevu(prochaine){
  $("barre").style.width = "100%"; $("compte").textContent = ""; $("suite").hidden = true;
  const quand = Tirage.revu(prochaine, LANGUE);
  $("zone").innerHTML = Fin.revu(TIRAGE_TEXTES.revu[LANGUE] || TIRAGE_TEXTES.revu.fr, quand ? (TIRAGE_TEXTES.prochaine[LANGUE] || TIRAGE_TEXTES.prochaine.fr).replace("{d}", quand) : "");
  basDeFin(() => parler("fini", {bons: 0, faits: 0}));
}
// « Encore des questions » (jamais dans la seance : elle a sa longueur) et « Terminer », fixes en bas de l'ecran
function basDeFin(terminer){
  const b = $("basFixe");
  b.innerHTML = (Q.get("seance") === "1" ? "" : '<button type="button" id="encore">' + (TIRAGE_TEXTES.encore[LANGUE] || TIRAGE_TEXTES.encore.fr) + '</button>')
              + '<button type="button" id="terminer">' + T("terminer") + '</button>';
  b.hidden = false;
  if ($("encore")) $("encore").addEventListener("click", encoreDesQuestions);
  $("terminer").addEventListener("click", terminer);
}
async function encoreDesQuestions(){
  const mots = motsDuTheme();
  file = Tirage.supplement(mots, await Tirage.demander(mots), NB); rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(null);
  montrer();
}
async function demarrer(){
  const mots = motsDuTheme();
  const plan = Tirage.plan(mots, await Tirage.demander(mots), NB, NEUFS_MAX);
  file = plan.file; rang = 0; bons = 0; vus = new Set(); derniereSorte = null;
  if (!file.length) return toutRevu(plan.prochaine);
  montrer();
}
$("suite").addEventListener("click", () => { if (!file.length) return; rang++; if (rang >= file.length) fin(); else montrer(); });
$("retour").addEventListener("click", () => parler("fermer"));
$("retour").setAttribute("aria-label", T("retourAria"));
$("titre").textContent = T("titre");
document.title = T("titre");
// IDS : rempli au chargement ; visuel/voix_themes.py attend qu'il le soit pour demander textesAVoix()
const IDS = [];
fetch("cuerpo/cuerpo.json?v=1").then(r => r.json()).then(d => {
  D = d; IDS.push(...Object.keys(d.partes));
  if (Q.get("seance") === "1" && Q.get("decouvrir") !== "1") demarrer(); else decouvrir();
});
