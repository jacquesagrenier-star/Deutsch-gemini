<title>L'heure et les dates</title>
<!--
  « L'HEURE ET LES DATES » (theme illustre, 16 nov. 2026 ; decision de Jacques : « Oui, fais [...] le theme de l'heure »),
  en allemand, en espagnol et en anglais (americain, et britannique en variante), A1-A2. Ce qu'il enseigne :
    - lire une horloge : l'heure courante (halb drei = 2 h 30, le piege du francophone ; Viertel nach / vor, kurz vor ;
      y cuarto, y media, menos cuarto, es la una / son las ; half past, quarter to / past) ;
    - l'heure officielle sur 24 heures (vierzehn Uhr dreissig ; las catorce treinta) et, en anglais, a.m. / p.m. et la
      lecture numerique americaine (six forty-five), avec le piege 12 a.m. / 12 p.m. ;
    - le moment (morgens, abends ; de la manana, de la tarde ; in the morning, at night) ;
    - les jours (am Montag ; el lunes ; on Monday), les mois (im Mai ; en mayo ; in May), demain, hier, le week-end ;
    - la date et les ordinaux (der dritte Mai, am dritten Mai ; el tres de mayo ; May third / the third of May) ;
    - l'agenda : um, von ... bis, la duree d'un rendez-vous, l'anniversaire.
  IMAGES DESSINEES (aucune generation payante) : horloges, reveils numeriques, feuilles de calendrier, un mois et un
  agenda, en SVG, aux couleurs du jour et de la nuit. Aucune personne : rien a tenir dans la regle des visages.
  TOUTES LES PHRASES SONT FABRIQUEES par heure/dire.js depuis une heure, une date ou un rendez-vous (et leur
  traduction, dans les dix langues d'interface, par la meme regle) ; les mots du theme et leur sens viennent du corpus
  (heure/heure.json, fait par visuel/heure/heure.py). Le banc hors navigateur : node tests/heure_banc.js.
  Ouverte par l'app dans le cadre des scenes (sceneCadre), elle parle comme une scene : « exercice » et « bonne » a
  chaque reponse, « reponse » {mot, genre, cat, juste} pour le mot teste, « fini » et « fermer » a la fin.
  Parametres : apprendre=es|de|en, lang=<interface>, nuit=1, seance=1 (six questions, pas de decouverte),
  variante=gb (l'anglais britannique), r=<AUDIO_REVISION>. Le tirage suit les mots (themes/tirage.js). Aucune voix
  enregistree : la voix du telephone (themes/voix.js).
-->
<style>

*{box-sizing:border-box}

.dessin{display:flex;justify-content:center;align-items:center;gap:14px;background:var(--carte);border-radius:16px;padding:10px;direction:ltr}
.dessin svg{display:block;width:100%;height:auto}
.dessin .horloge{max-width:220px}

.dessin .feuille{max-width:190px}

  jour:       {fr:"Regarde le calendrier : aujourd'hui, c'est le jour entouré. Quel jour est-ce ?", en:"Look at the calendar: today is the circled day. What day is it?", tr:"Takvime bak: bugün daire içindeki gün. Hangi gün?", uk:"Подивися на календар: сьогодні — обведений день. Який це день?", fa:"به تقویم نگاه کن: امروز روزِ دورگرفته است. چه روزی است؟", ar:"انظر إلى التقويم: اليوم هو اليوم المحاط بدائرة. أيّ يوم هو؟", pt:"Olhe o calendário: hoje é o dia circulado. Que dia é?", pl:"Spójrz na kalendarz: dziś jest zakreślony dzień. Jaki to dzień?", ru:"Посмотри на календарь: сегодня — обведённый день. Какой это день?", de:"Sieh dir den Kalender an: Heute ist der eingekreiste Tag. Welcher Tag ist das?"},

  date:       {fr:"Regarde la feuille du calendrier : complète la date.", en:"Look at the calendar page: complete the date.", tr:"Takvim yaprağına bak: tarihi tamamla.", uk:"Подивися на аркуш календаря: доповни дату.", fa:"به برگهٔ تقویم نگاه کن: تاریخ را کامل کن.", ar:"انظر إلى ورقة التقويم: أكمل التاريخ.", pt:"Olhe a folha do calendário: complete a data.", pl:"Spójrz na kartkę z kalendarza: uzupełnij datę.", ru:"Посмотри на листок календаря: дополни дату.", de:"Sieh dir das Kalenderblatt an: Ergänze das Datum."},
  anniv:      {fr:"Le gâteau marque ton anniversaire : complète la phrase.", en:"The cake marks your birthday: complete the sentence.", tr:"Pasta doğum gününü gösteriyor: cümleyi tamamla.", uk:"Торт позначає твій день народження: доповни речення.", fa:"کیک روز تولدت را نشان می‌دهد: جمله را کامل کن.", ar:"الكعكة تشير إلى عيد ميلادك: أكمل الجملة.", pt:"O bolo marca o seu aniversário: complete a frase.", pl:"Tort oznacza twoje urodziny: uzupełnij zdanie.", ru:"Торт отмечает твой день рождения: дополни фразу.", de:"Der Kuchen markiert deinen Geburtstag: Ergänze den Satz."},

  duree:      {fr:"Regarde l'agenda : combien de temps ?", en:"Look at the planner: how long?", tr:"Ajandaya bak: ne kadar sürüyor?", uk:"Подивися в щоденник: скільки часу?", fa:"به سررسید نگاه کن: چقدر طول می‌کشد؟", ar:"انظر إلى المفكرة: كم يستغرق؟", pt:"Olhe a agenda: quanto tempo?", pl:"Spójrz do kalendarza: ile to trwa?", ru:"Посмотри в ежедневник: сколько времени?", de:"Sieh in den Kalender: Wie lange?"},

  // ---------- LES REGLES DE L'ALLEMAND (neuf langues d'interface) ----------
  halbDe:     {fr:"<b>halb drei</b> = 2 h 30 : la demi-heure qui va <b>vers</b> trois heures. C'est le piège du francophone, qui entend « trois heures et demie ». De même : halb acht = 7 h 30, halb eins = 12 h 30.",
               en:"<b>halb drei</b> = 2:30: the half hour on the way <b>to</b> three. Not 3:30! Likewise: halb acht = 7:30, halb eins = 12:30.",
               tr:"<b>halb drei</b> = 2.30: üçe <b>doğru</b> giden yarım saat. 3.30 değil! Aynı şekilde: halb acht = 7.30, halb eins = 12.30.",
               uk:"<b>halb drei</b> = 2:30: половина <b>до</b> третьої, як «пів на третю». Не 3:30! Так само: halb acht = 7:30, halb eins = 12:30.",
               fa:"<b>halb drei</b> = ۲:۳۰: نیم‌ساعتی که <b>به سوی</b> ساعت سه می‌رود. نه ۳:۳۰! همین‌طور: halb acht = ۷:۳۰، halb eins = ۱۲:۳۰.",
               ar:"<b>halb drei</b> = 2:30: نصف الساعة <b>نحو</b> الثالثة، وليست 3:30! وكذلك: halb acht = 7:30، halb eins = 12:30.",
               pt:"<b>halb drei</b> = 2h30: a meia hora <b>rumo às</b> três. Não é 3h30! Do mesmo jeito: halb acht = 7h30, halb eins = 12h30.",
               pl:"<b>halb drei</b> = 2:30: pół godziny <b>do</b> trzeciej, jak „wpół do trzeciej”. Nie 3:30! Tak samo: halb acht = 7:30, halb eins = 12:30.",
               ru:"<b>halb drei</b> = 2:30: половина <b>до</b> трёх, как «половина третьего». Не 3:30! Так же: halb acht = 7:30, halb eins = 12:30."},
  viertelDe:  {fr:"<b>Viertel nach</b> zwei = 2 h 15 · <b>Viertel vor</b> drei = 2 h 45 · zehn <b>nach</b> zwei, zehn <b>vor</b> drei · <b>fünf vor halb</b> drei = 2 h 25 · <b>kurz vor</b> drei = presque 3 h. On dit <b>ein Uhr</b>, mais halb <b>eins</b>, Viertel nach <b>eins</b>.",
               en:"<b>Viertel nach</b> zwei = 2:15 · <b>Viertel vor</b> drei = 2:45 · zehn <b>nach</b> zwei, zehn <b>vor</b> drei · <b>fünf vor halb</b> drei = 2:25 · <b>kurz vor</b> drei = almost 3:00. You say <b>ein Uhr</b>, but halb <b>eins</b>, Viertel nach <b>eins</b>.",
               tr:"<b>Viertel nach</b> zwei = 2.15 · <b>Viertel vor</b> drei = 2.45 · zehn <b>nach</b> zwei, zehn <b>vor</b> drei · <b>fünf vor halb</b> drei = 2.25 · <b>kurz vor</b> drei = neredeyse 3.00. <b>ein Uhr</b> denir, ama halb <b>eins</b>, Viertel nach <b>eins</b>.",
               uk:"<b>Viertel nach</b> zwei = 2:15 · <b>Viertel vor</b> drei = 2:45 · zehn <b>nach</b> zwei, zehn <b>vor</b> drei · <b>fünf vor halb</b> drei = 2:25 · <b>kurz vor</b> drei = майже 3:00. Кажуть <b>ein Uhr</b>, але halb <b>eins</b>, Viertel nach <b>eins</b>.",
               fa:"<b>Viertel nach</b> zwei = ۲:۱۵ · <b>Viertel vor</b> drei = ۲:۴۵ · zehn <b>nach</b> zwei، zehn <b>vor</b> drei · <b>fünf vor halb</b> drei = ۲:۲۵ · <b>kurz vor</b> drei = تقریباً ۳:۰۰. می‌گویند <b>ein Uhr</b>، اما halb <b>eins</b> و Viertel nach <b>eins</b>.",
               ar:"<b>Viertel nach</b> zwei = 2:15 · <b>Viertel vor</b> drei = 2:45 · zehn <b>nach</b> zwei، zehn <b>vor</b> drei · <b>fünf vor halb</b> drei = 2:25 · <b>kurz vor</b> drei = تقريبًا 3:00. نقول <b>ein Uhr</b>، لكن halb <b>eins</b> وViertel nach <b>eins</b>.",
               pt:"<b>Viertel nach</b> zwei = 2h15 · <b>Viertel vor</b> drei = 2h45 · zehn <b>nach</b> zwei, zehn <b>vor</b> drei · <b>fünf vor halb</b> drei = 2h25 · <b>kurz vor</b> drei = quase 3h. Diz-se <b>ein Uhr</b>, mas halb <b>eins</b>, Viertel nach <b>eins</b>.",
               pl:"<b>Viertel nach</b> zwei = 2:15 · <b>Viertel vor</b> drei = 2:45 · zehn <b>nach</b> zwei, zehn <b>vor</b> drei · <b>fünf vor halb</b> drei = 2:25 · <b>kurz vor</b> drei = prawie 3:00. Mówi się <b>ein Uhr</b>, ale halb <b>eins</b>, Viertel nach <b>eins</b>.",
               ru:"<b>Viertel nach</b> zwei = 2:15 · <b>Viertel vor</b> drei = 2:45 · zehn <b>nach</b> zwei, zehn <b>vor</b> drei · <b>fünf vor halb</b> drei = 2:25 · <b>kurz vor</b> drei = почти 3:00. Говорят <b>ein Uhr</b>, но halb <b>eins</b>, Viertel nach <b>eins</b>."},
  offDe:      {fr:"L'heure officielle (gare, radio, agenda) compte jusqu'à 24 : <b>vierzehn Uhr dreißig</b> (14:30), <b>null Uhr fünf</b> (0:05). Dans les nombres, l'unité vient avant la dizaine : fünf<b>und</b>vierzig = 45. Dans la conversation, on dit « halb drei », avec au besoin <b>morgens</b>, <b>nachmittags</b>, <b>abends</b>, <b>nachts</b>.",
               en:"Official time (station, radio, planner) counts up to 24: <b>vierzehn Uhr dreißig</b> (14:30), <b>null Uhr fünf</b> (0:05). In numbers the unit comes before the ten: fünf<b>und</b>vierzig = 45. In conversation people say “halb drei”, adding <b>morgens</b>, <b>nachmittags</b>, <b>abends</b> or <b>nachts</b> if needed.",
               tr:"Resmî saat (istasyon, radyo, ajanda) 24'e kadar sayar: <b>vierzehn Uhr dreißig</b> (14.30), <b>null Uhr fünf</b> (0.05). Sayılarda birler onlardan önce gelir: fünf<b>und</b>vierzig = 45. Konuşmada “halb drei” denir; gerekirse <b>morgens</b>, <b>nachmittags</b>, <b>abends</b>, <b>nachts</b> eklenir.",
               uk:"Офіційний час (вокзал, радіо, щоденник) рахують до 24: <b>vierzehn Uhr dreißig</b> (14:30), <b>null Uhr fünf</b> (0:05). У числах одиниці стоять перед десятками: fünf<b>und</b>vierzig = 45. У розмові кажуть «halb drei», за потреби додаючи <b>morgens</b>, <b>nachmittags</b>, <b>abends</b>, <b>nachts</b>.",
               fa:"ساعت رسمی (ایستگاه، رادیو، سررسید) تا ۲۴ شمرده می‌شود: <b>vierzehn Uhr dreißig</b> (۱۴:۳۰)، <b>null Uhr fünf</b> (۰:۰۵). در عددها یکان پیش از دهگان می‌آید: fünf<b>und</b>vierzig = ۴۵. در گفت‌وگو «halb drei» می‌گویند و در صورت نیاز <b>morgens</b>، <b>nachmittags</b>، <b>abends</b> یا <b>nachts</b> را اضافه می‌کنند.",
               ar:"الوقت الرسمي (المحطة، الراديو، المفكرة) يُعدّ حتى 24: <b>vierzehn Uhr dreißig</b> (14:30)، <b>null Uhr fünf</b> (0:05). في الأعداد تأتي الآحاد قبل العشرات: fünf<b>und</b>vierzig = 45. وفي الكلام نقول «halb drei» ونضيف عند الحاجة <b>morgens</b> أو <b>nachmittags</b> أو <b>abends</b> أو <b>nachts</b>.",
               pt:"A hora oficial (estação, rádio, agenda) vai até 24: <b>vierzehn Uhr dreißig</b> (14h30), <b>null Uhr fünf</b> (0h05). Nos números, a unidade vem antes da dezena: fünf<b>und</b>vierzig = 45. Na conversa, diz-se “halb drei”, com <b>morgens</b>, <b>nachmittags</b>, <b>abends</b> ou <b>nachts</b> se precisar.",
               pl:"Godzinę oficjalną (dworzec, radio, kalendarz) liczy się do 24: <b>vierzehn Uhr dreißig</b> (14:30), <b>null Uhr fünf</b> (0:05). W liczbach jedności są przed dziesiątkami: fünf<b>und</b>vierzig = 45. W rozmowie mówi się „halb drei”, w razie potrzeby z <b>morgens</b>, <b>nachmittags</b>, <b>abends</b>, <b>nachts</b>.",
               ru:"Официальное время (вокзал, радио, ежедневник) считают до 24: <b>vierzehn Uhr dreißig</b> (14:30), <b>null Uhr fünf</b> (0:05). В числах единицы стоят перед десятками: fünf<b>und</b>vierzig = 45. В разговоре говорят «halb drei», при необходимости добавляя <b>morgens</b>, <b>nachmittags</b>, <b>abends</b>, <b>nachts</b>."},
  umDe:       {fr:"<b>Wie spät ist es?</b> — Es ist halb drei. <b>Um wie viel Uhr …?</b> — <b>Um</b> halb drei. Un horaire : <b>von</b> neun <b>bis</b> elf Uhr. Une durée : eine Stunde, eine halbe Stunde, anderthalb Stunden.",
               en:"<b>Wie spät ist es?</b> — Es ist halb drei. <b>Um wie viel Uhr …?</b> — <b>Um</b> halb drei. Opening hours: <b>von</b> neun <b>bis</b> elf Uhr. A duration: eine Stunde, eine halbe Stunde, anderthalb Stunden.",
               tr:"<b>Wie spät ist es?</b> (Saat kaç?) — Es ist halb drei. <b>Um wie viel Uhr …?</b> (Saat kaçta?) — <b>Um</b> halb drei. Bir zaman aralığı: <b>von</b> neun <b>bis</b> elf Uhr. Bir süre: eine Stunde, eine halbe Stunde, anderthalb Stunden.",
               uk:"<b>Wie spät ist es?</b> (Котра година?) — Es ist halb drei. <b>Um wie viel Uhr …?</b> (О котрій?) — <b>Um</b> halb drei. Проміжок часу: <b>von</b> neun <b>bis</b> elf Uhr. Тривалість: eine Stunde, eine halbe Stunde, anderthalb Stunden.",
               fa:"<b>Wie spät ist es?</b> (ساعت چند است؟) — Es ist halb drei. <b>Um wie viel Uhr …?</b> (ساعت چند …؟) — <b>Um</b> halb drei. یک بازه: <b>von</b> neun <b>bis</b> elf Uhr. یک مدت: eine Stunde، eine halbe Stunde، anderthalb Stunden.",
               ar:"<b>Wie spät ist es?</b> (كم الساعة؟) — Es ist halb drei. <b>Um wie viel Uhr …?</b> (في أيّ ساعة …؟) — <b>Um</b> halb drei. فترة: <b>von</b> neun <b>bis</b> elf Uhr. مدة: eine Stunde، eine halbe Stunde، anderthalb Stunden.",
               pt:"<b>Wie spät ist es?</b> (Que horas são?) — Es ist halb drei. <b>Um wie viel Uhr …?</b> (A que horas …?) — <b>Um</b> halb drei. Um horário: <b>von</b> neun <b>bis</b> elf Uhr. Uma duração: eine Stunde, eine halbe Stunde, anderthalb Stunden.",
               pl:"<b>Wie spät ist es?</b> (Która godzina?) — Es ist halb drei. <b>Um wie viel Uhr …?</b> (O której?) — <b>Um</b> halb drei. Przedział czasu: <b>von</b> neun <b>bis</b> elf Uhr. Czas trwania: eine Stunde, eine halbe Stunde, anderthalb Stunden.",
               ru:"<b>Wie spät ist es?</b> (Который час?) — Es ist halb drei. <b>Um wie viel Uhr …?</b> (Во сколько?) — <b>Um</b> halb drei. Промежуток: <b>von</b> neun <b>bis</b> elf Uhr. Продолжительность: eine Stunde, eine halbe Stunde, anderthalb Stunden."},
  amDe:       {fr:"<b>am</b> + un jour : am Montag, am Wochenende · <b>im</b> + un mois : im Mai · <b>um</b> + une heure : um acht Uhr. Les jours et les mois sont masculins : der Montag, der Mai. <b>Welcher Tag ist heute?</b> — Heute ist Montag.",
               en:"<b>am</b> + a day: am Montag, am Wochenende · <b>im</b> + a month: im Mai · <b>um</b> + a time: um acht Uhr. Days and months are masculine: der Montag, der Mai. <b>Welcher Tag ist heute?</b> — Heute ist Montag.",
               tr:"Bir günle <b>am</b>: am Montag, am Wochenende · bir ayla <b>im</b>: im Mai · bir saatle <b>um</b>: um acht Uhr. Günler ve aylar erildir: der Montag, der Mai. <b>Welcher Tag ist heute?</b> (Bugün günlerden ne?) — Heute ist Montag.",
               uk:"<b>am</b> + день: am Montag, am Wochenende · <b>im</b> + місяць: im Mai · <b>um</b> + година: um acht Uhr. Дні й місяці — чоловічого роду: der Montag, der Mai. <b>Welcher Tag ist heute?</b> (Який сьогодні день?) — Heute ist Montag.",
               fa:"<b>am</b> + روز: am Montag، am Wochenende · <b>im</b> + ماه: im Mai · <b>um</b> + ساعت: um acht Uhr. روزها و ماه‌ها مذکرند: der Montag، der Mai. <b>Welcher Tag ist heute?</b> (امروز چه روزی است؟) — Heute ist Montag.",
               ar:"<b>am</b> + يوم: am Montag، am Wochenende · <b>im</b> + شهر: im Mai · <b>um</b> + ساعة: um acht Uhr. الأيام والشهور مذكّرة: der Montag، der Mai. <b>Welcher Tag ist heute?</b> (ما اليوم؟) — Heute ist Montag.",
               pt:"<b>am</b> + um dia: am Montag, am Wochenende · <b>im</b> + um mês: im Mai · <b>um</b> + uma hora: um acht Uhr. Os dias e os meses são masculinos: der Montag, der Mai. <b>Welcher Tag ist heute?</b> (Que dia é hoje?) — Heute ist Montag.",

               ru:"<b>am</b> + день: am Montag, am Wochenende · <b>im</b> + месяц: im Mai · <b>um</b> + время: um acht Uhr. Дни и месяцы — мужского рода: der Montag, der Mai. <b>Welcher Tag ist heute?</b> (Какой сегодня день?) — Heute ist Montag."},
  datumDe:    {fr:"La date se dit avec un ordinal : <b>der dritte Mai</b> ; après <b>am</b>, il prend -n : <b>am dritten Mai</b>. On l'écrit avec un point : am 3. Mai. <b>-te</b> jusqu'à 19 (zweite, vierte ; irréguliers : erste, dritte, siebte, achte), <b>-ste</b> à partir de 20 (zwanzigste, einunddreißigste). Pour demander : <b>Der Wievielte ist heute?</b>",
               en:"Dates use an ordinal: <b>der dritte Mai</b>; after <b>am</b> it takes -n: <b>am dritten Mai</b>. Written with a dot: am 3. Mai. <b>-te</b> up to 19 (zweite, vierte; irregular: erste, dritte, siebte, achte), <b>-ste</b> from 20 (zwanzigste, einunddreißigste). To ask: <b>Der Wievielte ist heute?</b>",
               tr:"Tarih sıra sayısıyla söylenir: <b>der dritte Mai</b>; <b>am</b>'dan sonra -n alır: <b>am dritten Mai</b>. Noktayla yazılır: am 3. Mai. 19'a kadar <b>-te</b> (zweite, vierte; düzensiz: erste, dritte, siebte, achte), 20'den itibaren <b>-ste</b> (zwanzigste, einunddreißigste). Sormak için: <b>Der Wievielte ist heute?</b>",
               uk:"Дату кажуть порядковим числівником: <b>der dritte Mai</b>; після <b>am</b> він отримує -n: <b>am dritten Mai</b>. Пишуть із крапкою: am 3. Mai. <b>-te</b> до 19 (zweite, vierte; неправильні: erste, dritte, siebte, achte), <b>-ste</b> від 20 (zwanzigste, einunddreißigste). Щоб запитати: <b>Der Wievielte ist heute?</b>",
               fa:"تاریخ را با عدد ترتیبی می‌گویند: <b>der dritte Mai</b>؛ بعد از <b>am</b> پسوند ‎-n می‌گیرد: <b>am dritten Mai</b>. با نقطه نوشته می‌شود: am 3. Mai. تا ۱۹ <b>-te</b> (zweite، vierte؛ بی‌قاعده: erste، dritte، siebte، achte)، از ۲۰ به بعد <b>-ste</b> (zwanzigste، einunddreißigste). برای پرسیدن: <b>Der Wievielte ist heute?</b>",
               ar:"يُقال التاريخ بالعدد الترتيبي: <b>der dritte Mai</b>؛ وبعد <b>am</b> يأخذ ‎-n: <b>am dritten Mai</b>. ويُكتب بنقطة: am 3. Mai. ‏<b>-te</b> حتى 19 (zweite، vierte؛ والشاذة: erste، dritte، siebte، achte)، و<b>-ste</b> من 20 (zwanzigste، einunddreißigste). وللسؤال: <b>Der Wievielte ist heute?</b>",
               pt:"A data se diz com um ordinal: <b>der dritte Mai</b>; depois de <b>am</b>, ganha -n: <b>am dritten Mai</b>. Escreve-se com ponto: am 3. Mai. <b>-te</b> até 19 (zweite, vierte; irregulares: erste, dritte, siebte, achte), <b>-ste</b> a partir de 20 (zwanzigste, einunddreißigste). Para perguntar: <b>Der Wievielte ist heute?</b>",
               pl:"Datę mówi się liczebnikiem porządkowym: <b>der dritte Mai</b>; po <b>am</b> dostaje -n: <b>am dritten Mai</b>. Pisze się z kropką: am 3. Mai. <b>-te</b> do 19 (zweite, vierte; nieregularne: erste, dritte, siebte, achte), <b>-ste</b> od 20 (zwanzigste, einunddreißigste). Żeby zapytać: <b>Der Wievielte ist heute?</b>",
               ru:"Дату называют порядковым числительным: <b>der dritte Mai</b>; после <b>am</b> оно получает -n: <b>am dritten Mai</b>. Пишут с точкой: am 3. Mai. <b>-te</b> до 19 (zweite, vierte; неправильные: erste, dritte, siebte, achte), <b>-ste</b> с 20 (zwanzigste, einunddreißigste). Чтобы спросить: <b>Der Wievielte ist heute?</b>"},

  // ---------- LES REGLES DE L'ESPAGNOL (ses langues d'interface : fr, en, pt, ar, de) ----------
  serEs:      {fr:"<b>Es la una</b> (une heure : singulier), mais <b>son las dos</b>, son las tres… Pour demander : <b>¿Qué hora es?</b> L'heure d'un rendez-vous : <b>a las</b> nueve, <b>a la</b> una — <b>¿A qué hora…?</b>",

               pt:"<b>Es la una</b> (uma hora: singular), mas <b>son las dos</b>, son las tres… Para perguntar: <b>¿Qué hora es?</b> A hora de um compromisso: <b>a las</b> nueve, <b>a la</b> una — <b>¿A qué hora…?</b>",
               ar:"<b>Es la una</b> (الواحدة: مفرد)، لكن <b>son las dos</b>، son las tres… وللسؤال: <b>¿Qué hora es?</b> ووقت الموعد: <b>a las</b> nueve، <b>a la</b> una — <b>¿A qué hora…?</b>",
               de:"<b>Es la una</b> (ein Uhr: Singular), aber <b>son las dos</b>, son las tres … Fragen: <b>¿Qué hora es?</b> Die Uhrzeit eines Termins: <b>a las</b> nueve, <b>a la</b> una — <b>¿A qué hora …?</b>"},
  cuartoEs:   {fr:"Jusqu'à la demie : <b>y cuarto</b> (et quart), <b>y media</b> (et demie), y diez… Ensuite on part de l'heure suivante avec <b>menos</b> : las tres <b>menos cuarto</b> = 2 h 45, las tres menos diez = 2 h 50. À 12 h 45 : <b>es la una</b> menos cuarto.",
               en:"Up to half past: <b>y cuarto</b> (quarter past), <b>y media</b> (half past), y diez… After that, count from the next hour with <b>menos</b>: las tres <b>menos cuarto</b> = 2:45, las tres menos diez = 2:50. At 12:45: <b>es la una</b> menos cuarto.",
               pt:"Até a meia: <b>y cuarto</b> (e quinze), <b>y media</b> (e meia), y diez… Depois, parte-se da hora seguinte com <b>menos</b>: las tres <b>menos cuarto</b> = 2h45, las tres menos diez = 2h50. Às 12h45: <b>es la una</b> menos cuarto.",
               ar:"حتى النصف: <b>y cuarto</b> (والربع)، <b>y media</b> (والنصف)، y diez… وبعدها نبدأ من الساعة التالية مع <b>menos</b>: las tres <b>menos cuarto</b> = 2:45، las tres menos diez = 2:50. وفي 12:45: <b>es la una</b> menos cuarto.",
               de:"Bis zur halben Stunde: <b>y cuarto</b> (Viertel nach), <b>y media</b> (halb), y diez … Danach zählt man von der nächsten Stunde mit <b>menos</b>: las tres <b>menos cuarto</b> = 2:45, las tres menos diez = 2:50. Um 12:45: <b>es la una</b> menos cuarto."},

               en:"<b>de la mañana</b> (in the morning), <b>de la tarde</b> (afternoon, until about 8 p.m.), <b>de la noche</b> (evening, night), <b>de la madrugada</b> (after midnight). Official time counts up to 24: <b>las catorce treinta</b> (14:30), <b>las veintiuna horas</b>.",
               pt:"<b>de la mañana</b> (da manhã), <b>de la tarde</b> (da tarde, até umas 20h), <b>de la noche</b> (da noite), <b>de la madrugada</b> (depois da meia-noite). O horário oficial vai até 24: <b>las catorce treinta</b> (14h30), <b>las veintiuna horas</b>.",
               ar:"<b>de la mañana</b> (صباحًا)، <b>de la tarde</b> (بعد الظهر، حتى نحو الثامنة مساءً)، <b>de la noche</b> (مساءً، ليلًا)، <b>de la madrugada</b> (بعد منتصف الليل). والوقت الرسمي يُعدّ حتى 24: <b>las catorce treinta</b> (14:30)، <b>las veintiuna horas</b>.",
               de:"<b>de la mañana</b> (morgens), <b>de la tarde</b> (nachmittags, bis etwa 20 Uhr), <b>de la noche</b> (abends, nachts), <b>de la madrugada</b> (nach Mitternacht). Die offizielle Uhrzeit zählt bis 24: <b>las catorce treinta</b> (14:30), <b>las veintiuna horas</b>."},
  diasEs:     {fr:"Devant un jour, pas de préposition : <b>el lunes</b> (lundi), <b>los lunes</b> (le lundi, chaque semaine). Devant un mois : <b>en mayo</b>. Jours et mois s'écrivent en minuscules. <b>¿Qué día es hoy?</b> — Hoy es lunes.",
               en:"No preposition before a day: <b>el lunes</b> (on Monday), <b>los lunes</b> (on Mondays). Before a month: <b>en mayo</b>. Days and months are written in lower case. <b>¿Qué día es hoy?</b> — Hoy es lunes.",
               pt:"Antes de um dia, nenhuma preposição: <b>el lunes</b> (na segunda), <b>los lunes</b> (às segundas). Antes de um mês: <b>en mayo</b>. Dias e meses com letra minúscula. <b>¿Qué día es hoy?</b> — Hoy es lunes.",
               ar:"لا حرف جرّ قبل اليوم: <b>el lunes</b> (يوم الاثنين)، <b>los lunes</b> (أيام الاثنين). وقبل الشهر: <b>en mayo</b>. وتُكتب الأيام والشهور بحروف صغيرة. <b>¿Qué día es hoy?</b> — Hoy es lunes.",
               de:"Vor einem Tag keine Präposition: <b>el lunes</b> (am Montag), <b>los lunes</b> (montags). Vor einem Monat: <b>en mayo</b>. Tage und Monate werden kleingeschrieben. <b>¿Qué día es hoy?</b> — Hoy es lunes."},
  fechaEs:    {fr:"La date se dit avec le nombre simple : <b>el tres de mayo</b>, el treinta y uno de diciembre. Le premier jour : <b>el uno</b> (en Amérique latine, souvent <b>el primero</b>). Pour demander : <b>¿Qué fecha es hoy?</b> ou <b>¿A cuántos estamos?</b> — Estamos a tres de mayo.",
               en:"Dates use the plain number: <b>el tres de mayo</b>, el treinta y uno de diciembre. The first: <b>el uno</b> (in Latin America, often <b>el primero</b>). To ask: <b>¿Qué fecha es hoy?</b> or <b>¿A cuántos estamos?</b> — Estamos a tres de mayo.",
               pt:"A data se diz com o número simples: <b>el tres de mayo</b>, el treinta y uno de diciembre. O primeiro dia: <b>el uno</b> (na América Latina, muitas vezes <b>el primero</b>). Para perguntar: <b>¿Qué fecha es hoy?</b> ou <b>¿A cuántos estamos?</b> — Estamos a tres de mayo.",
               ar:"يُقال التاريخ بالعدد البسيط: <b>el tres de mayo</b>، el treinta y uno de diciembre. واليوم الأول: <b>el uno</b> (وفي أمريكا اللاتينية غالبًا <b>el primero</b>). وللسؤال: <b>¿Qué fecha es hoy?</b> أو <b>¿A cuántos estamos?</b> — Estamos a tres de mayo.",
               de:"Das Datum mit der Grundzahl: <b>el tres de mayo</b>, el treinta y uno de diciembre. Der Erste: <b>el uno</b> (in Lateinamerika oft <b>el primero</b>). Fragen: <b>¿Qué fecha es hoy?</b> oder <b>¿A cuántos estamos?</b> — Estamos a tres de mayo."},

const ANNEE = 2027;
const rad = d => d * Math.PI / 180;
// L'HORLOGE : le cadran, ses soixante traits, les douze chiffres ; la petite aiguille (encre) et la grande (bleue)
function horloge(h, m){
  const ah = rad(((h % 12) + m / 60) * 30), am = rad(m * 6);
  let s = '<svg class="horloge" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="93" fill="var(--cadran)" stroke="var(--encre)" stroke-width="6"/>';
  for (let i = 0; i < 60; i++){
    const a = rad(i * 6), r1 = i % 5 ? 84 : 77;
    s += '<line x1="' + (100 + r1 * Math.sin(a)).toFixed(1) + '" y1="' + (100 - r1 * Math.cos(a)).toFixed(1) + '" x2="' + (100 + 88 * Math.sin(a)).toFixed(1) + '" y2="' + (100 - 88 * Math.cos(a)).toFixed(1)
      + '" stroke="var(--encre)" stroke-width="' + (i % 5 ? 1.4 : 3.4) + '" stroke-linecap="round"/>';
  }
  for (let n = 1; n <= 12; n++){ const a = rad(n * 30);
    s += '<text x="' + (100 + 64 * Math.sin(a)).toFixed(1) + '" y="' + (100 - 64 * Math.cos(a) + 6.5).toFixed(1) + '" font-size="18" font-weight="800" fill="var(--encre)" text-anchor="middle">' + n + '</text>'; }
  s += '<line x1="100" y1="100" x2="' + (100 + 46 * Math.sin(ah)).toFixed(1) + '" y2="' + (100 - 46 * Math.cos(ah)).toFixed(1) + '" stroke="var(--encre)" stroke-width="9" stroke-linecap="round"/>';
  s += '<line x1="100" y1="100" x2="' + (100 + 72 * Math.sin(am)).toFixed(1) + '" y2="' + (100 - 72 * Math.cos(am)).toFixed(1) + '" stroke="var(--minute)" stroke-width="5" stroke-linecap="round"/>';
  return s + '<circle cx="100" cy="100" r="7" fill="var(--ambre)" stroke="var(--encre)" stroke-width="2"/></svg>';
}

// DES HEURES QU'ON CONFOND, sur un cadran de douze heures : une heure plus tot (halb zwei pour halb drei : le piege
// du francophone), le miroir (Viertel vor / Viertel nach), une heure plus tard, une demi-heure de part et d'autre
function leurresHeure(h, m){
  const t = h * 60 + m, c = [], vu = new Set([(h % 12) + ":" + m]);
  const pose = x => { x = ((x % 1440) + 1440) % 1440; const hh = Math.floor(x / 60), mm = x % 60, k = (hh % 12) + ":" + mm;
    if (vu.has(k)) return; vu.add(k); c.push([hh, mm]); };
  const piege = t - 60;
  pose(piege);
  if (m !== 0 && m !== 30) pose(m < 30 ? t - 2 * m : t + 2 * (60 - m));
  pose(t + 60); pose(t + 30); pose(t - 30);
  // l'allemand : halb, fünf vor / nach halb -- le piege toujours la ; ailleurs, deux au hasard
  if (DE_APP && (m === 25 || m === 30 || m === 35)) return [c[0], hasard(c.slice(1))];
  return melanger(c).slice(0, 2);
}
// DES HEURES OFFICIELLES QU'ON CONFOND (sur 24 heures) : les chiffres inverses (fünfundvierzig / vierundfünfzig),
// 13 et 30, l'heure a dix pres, une heure de plus ou de moins ; jamais la meme heure lue sur douze heures
function leurresOff(h, m, memeDouze){
  const c = [], vu = new Set([h + ":" + m]);
  const pose = (hh, mm) => { if (hh < 0 || hh > 23 || mm < 0 || mm > 59) return; const k = hh + ":" + mm;
    if (vu.has(k) || (!memeDouze && hh % 12 === h % 12 && mm === m)) return; vu.add(k); c.push([hh, mm]); };
  const md = deux(m); pose(h, Number(md[1] + md[0]));
  const tt = {13: 30, 30: 13, 14: 40, 40: 14, 15: 50, 50: 15}; if (tt[m] !== undefined) pose(h, tt[m]);
  if (memeDouze) pose((h + 12) % 24, m);   // a.m. / p.m. : le piege de l'anglais
  pose(h >= 10 ? h - 10 : h + 10, m); pose(h + 1, m); pose(h - 1, m);
  return (DE_APP || memeDouze) ? [c[0], hasard(c.slice(1))] : melanger(c).slice(0, 2);
}

const dateAuHasard = () => { const mo = entre(0, 11); return {mo, d: entre(1, Dire.joursDuMois(ANNEE, mo))}; };
// un nombre qu'on confond : 3 et 13, 13 et 30, 23 et 13
const confondu = d => d === 13 ? 30 : d === 30 ? 13 : d <= 9 ? d + 10 : d - 10;
// les formes fausses d'une date, toujours CLAIREMENT fausses : un autre nombre, la mauvaise terminaison, le nombre
// au lieu de l'ordinal (*der drei Mai), une forme fabriquee (*dreite, *threeth)
function leurresDate(d, mo, sorte){
  const nb = Dire.joursDuMois(ANNEE, mo), autre = confondu(d) <= nb ? confondu(d) : (d > 1 ? d - 1 : d + 1);
  const voisin = d < nb ? d + 1 : d - 1, autreMois = (mo + (Math.random() < 0.5 ? 1 : 11)) % 12;
  let forme = [], nombre = [];
  if (DE_APP){
    const fin = sorte === "date" ? "e" : "en", mois = sorte === "date" ? "" : " " + moisMot(mo);
    forme = [Dire.ordDe(d, sorte === "date" ? "en" : "e") + mois, (d === 1 ? "eins" : Dire.nDe(d)) + mois].concat(Dire.ORD_FAUX_DE[d] ? [Dire.ORD_FAUX_DE[d] + fin + mois] : []);
    nombre = [Dire.ordDe(autre, fin) + mois].concat(sorte === "date" ? [] : [Dire.ordDe(d, fin) + " " + moisMot(autreMois)]);
  } else if (ES_APP){
    const mois = sorte === "date" ? "" : " de " + moisMot(mo);
    forme = (Dire.ORD_ES[d] ? [Dire.ORD_ES[d] + mois] : []).concat(d === 1 ? ["primer" + mois, "una" + mois] : []);
    nombre = [Dire.nEs(autre) + mois, Dire.nEs(voisin) + mois].concat(sorte === "date" ? [] : [Dire.nEs(d) + " de " + moisMot(autreMois)]);
  } else {
    const dit = x => sorte === "date" ? Dire.ordEn(x) : Dire.dateEn(V, x, mo);
    forme = Dire.ORD_FAUX_EN[d] ? [sorte === "date" ? Dire.ORD_FAUX_EN[d] : (V === "us" ? moisMot(mo) + " " + Dire.ORD_FAUX_EN[d] : "the " + Dire.ORD_FAUX_EN[d] + " of " + moisMot(mo))] : [];
    nombre = [dit(autre), dit(voisin)].concat(sorte === "date" ? [] : [Dire.dateEn(V, d, autreMois)]);

    return true;
  },
  // midi ou minuit, sur le reveil (12:00, 00:00) : Es ist Mittag / Mitternacht ; Es mediodía / medianoche
  midi(w){
    if (EN_APP) return false;
    const c = [1, 0].filter(n => accepte(w, [n ? MOTS_ROLE.midi : MOTS_ROLE.minuit]));
    if (!c.length) return false;
    const n = hasard(c), h = n ? 12 : 0;
    viser(w, [n ? MOTS_ROLE.midi : MOTS_ROLE.minuit]);
    const juste = P("midiPile", {n});
    tradQ = TR("midiPile", {n});
    ecran(T("horloge"), cadre(montre(h, 0), "n" + h + ":0"), E("heure"), true, true);
    boutons($("choix"), melanger([opt("midiPile", {n}), opt("midiPile", {n: 1 - n}), opt("heure", {h: n ? 13 : 1, m: 0, style: "o"})]), juste, ok => juger(ok, juste, juste));
    return true;
  },
  // L'ESPAGNOL SEULEMENT : es / son -- « ___ la una y cuarto. »
  ser(w){
    if (!ES_APP || !accepte(w, ["hora"])) return false;
    const h = entre(0, 23), m = Math.random() < 0.35 ? hasard([0, 15, 30]) : hasard(MINUTES);
    const hh = Math.random() < 0.4 ? (m > 30 ? hasard([0, 12]) : hasard([1, 13])) : h;   // la una (et 12 h 45 : la una menos cuarto) assez souvent
    viser(w, ["hora"]);
    const p = {h: hh, m, style: "c"}, t = TROU("heure", p);
    tradQ = TR("heure", p);
    ecranTrou(T("ser"), cadre(horloge(hh, m), "c" + hh % 12 + ":" + m), t.texte);
    boutons($("choix"), melanger(["Es", "Son", "Está"]), t.rep, ok => { remplir(t.rep); juger(ok, t.rep, P("heure", p)); });
    return true;
  },
  // L'ANGLAIS SEULEMENT : a.m. / p.m. -- le reveil sur 24 h, la phrase anglaise (12 a.m. = minuit, le piege)
  ampm(w){
    if (!EN_APP) return false;
    const ks = ["watch", "noon", "midnight"].filter(k => accepte(w, [k]));
    if (!ks.length) return false;
    // noon et midnight : a l'heure pile seulement (« twelve thirty p.m. » n'est ni l'un ni l'autre)
    const mot = hasard(ks), h = mot === "noon" ? 12 : mot === "midnight" ? 0 : entre(0, 23), m = mot === "watch" ? (Math.random() < 0.15 ? 0 : hasard(MINUTES)) : 0;
    viser(w, [mot]);
    const p = {h, m, style: "p"}, juste = P("heure", p), lr = leurresOff(h, m, true);
    tradQ = TR("heure", {h, m, style: "o"});
    ecran(T("ampm"), cadre(montre(h, m), "n" + h + ":" + m), E("heure"), true, true);
    boutons($("choix"), melanger([{t: juste, sens: tradQ || ""}].concat(lr.map(([a, b]) => ({t: P("heure", {h: a, m: b, style: "p"}), sens: TR("heure", {h: a, m: b, style: "o"}) || ""})))), juste, ok => juger(ok, juste, juste));
    return true;
  },
  // L'ANGLAIS SEULEMENT : l'horloge lue comme une montre numerique (two thirty, six forty-five, six oh five)
  digital(w){
    if (!EN_APP || !accepte(w, ["clock"])) return false;
    const h = entre(0, 23), m = hasard(MINUTES.filter(x => x !== 0)), lr = leurresHeure(h, m);
    viser(w, ["clock"]);
    const p = {h, m, style: "d"}, juste = P("heure", p);
    tradQ = TR("heure", {h, m, style: "c"});
    ecran(T("digital"), cadre(horloge(h, m), "c" + h % 12 + ":" + m), E("heure"), true, true);
    boutons($("choix"), melanger([{t: juste, sens: tradQ || ""}].concat(lr.map(([a, b]) => ({t: P("heure", {h: a, m: b, style: "d"}), sens: TR("heure", {h: a, m: b, style: "c"}) || ""})))), juste, ok => juger(ok, juste, juste));
    return true;
  }
};
// les sortes de la langue apprise
const SORTES = DE_APP ? ["horloge", "numerique", "conversion", "entendre", "cual", "vraifaux", "moment", "prep", "jour", "suite", "date", "anniv", "agenda", "duree", "midi"]
             : EN_APP ? ["horloge", "digital", "ampm", "entendre", "cual", "vraifaux", "moment", "prep", "jour", "suite", "date", "anniv", "agenda", "duree"]
                      : ["horloge", "numerique", "conversion", "entendre", "cual", "vraifaux", "moment", "prep", "jour", "suite", "date", "anniv", "agenda", "duree", "midi", "ser"];

// ---------- LA DECOUVERTE : l'heure, les jours et les mois, les dates et les rendez-vous ----------
function decouvrir(){
  $("compte").textContent = ""; $("barre").style.width = "0%";
  const z = $("zone");
  z.innerHTML = '<p class="consigne">' + T("intro") + '</p>'
    + '<div class="onglets" role="tablist"><button type="button" id="o1" role="tab">' + T("ongletHeure") + '</button><button type="button" id="o2" role="tab">' + T("ongletJours")
    + '</button><button type="button" id="o3" role="tab">' + T("ongletDates") + '</button></div><div id="vue"></div><div class="lignes" id="lignes"></div>'
    + '<div class="puces" id="puces"></div><div id="regles"></div>';
  const onglet = n => ["o1", "o2", "o3"].forEach((id, k) => $(id).classList.toggle("actif", k === n));
  const regles = cles => { $("regles").innerHTML = cles.map(c => '<p class="regle">' + isoler(T(c)) + '</p>').join(""); };
  // des lignes : [etiquette, sorte, params] ; chacune se dit en la touchant
  const lignes = (ls, parle) => {
    $("lignes").innerHTML = ls.map(([et, s, p], i) => '<div class="dit"><div class="texte">' + (et ? '<span class="etiquette">' + et + '</span>' : "") + cible(P(s, p))
      + traduction(TR(s, p)) + '</div><button type="button" class="ecoute" data-i="' + i + '" aria-label="' + T("ecouter") + '">' + HP + '</button></div>').join("");
    $("lignes").querySelectorAll(".ecoute").forEach(b => b.addEventListener("click", () => { const [, s, p] = ls[Number(b.dataset.i)]; dire(P(s, p)); }));
    if (parle) dire(P(ls[0][1], ls[0][2]));
  };
  const ligneLibre = (et, texte) => '<div class="dit"><div class="texte"><span class="etiquette">' + et + '</span>' + cible(texte) + '</div></div>';
  const puce = (texte, quoi) => { const b = document.createElement("button"); b.type = "button"; b.lang = EN_APP ? "en" : APPRENDRE; b.textContent = texte;
    b.addEventListener("click", () => { $("puces").querySelectorAll("button").forEach(x => x.classList.toggle("choisi", x === b)); quoi(); }); $("puces").appendChild(b); return b; };
  // L'HEURE : l'horloge et le reveil cote a cote, un curseur de cinq en cinq minutes, et chaque facon de la dire
  const heure = () => {
    onglet(0); $("puces").innerHTML = "";
    $("vue").innerHTML = '<div id="paire"></div><input type="range" class="curseur" id="curseur" min="0" max="287" step="1" value="174" aria-label="' + T("ongletHeure") + '" dir="ltr">';
    const maj = parle => {
      const v = Number($("curseur").value), h = Math.floor(v / 12), m = (v % 12) * 5;
      $("paire").innerHTML = cadre(horloge(h, m) + montre(h, m, V === "us"), "d", true);
      lignes(EN_APP ? [[T("courante"), "heure", {h, m, style: "c"}], ["", "heure", {h, m, style: "d"}], ["a.m. / p.m.", "heure", {h, m, style: "p"}], [T("avecMoment"), "heure", {h, m, style: "m"}]]
                    : [[T("courante"), "heure", {h, m, style: "c"}], [T("avecMoment"), "heure", {h, m, style: "m"}], [T("officielle"), "heure", {h, m, style: "o"}]], parle);
    };
    $("curseur").addEventListener("input", () => maj(false));
    $("curseur").addEventListener("change", () => maj(true));
    [[14, 30], [9, 15], [6, 45], [12, 0], [19, 25], [0, 0], [10, 35]].forEach(([h, m]) => puce(heureEcrite(h, m), () => { $("curseur").value = h * 12 + m / 5; maj(true); }));
    regles(DE_APP ? ["halbDe", "viertelDe", "offDe", "umDe"] : EN_APP ? ["pastEn", "digitalEn", "ampmEn"] : ["serEs", "cuartoEs", "momEs"]);
    maj(false);
  };
  // LES JOURS ET LES MOIS : la semaine (demain, hier) et les douze mois (l'anniversaire)
  const jours = () => {
    onglet(1); $("puces").innerHTML = "";
    let mo = 4;
    const voirJour = (j, parle) => { $("vue").innerHTML = cadre(grille(mo, premierJour(mo, j), false), "d");
      lignes([["", "jour", {j}], ["", "demain", {j: (j + 1) % 7}], ["", "hier", {j: (j + 6) % 7}], ["", "evtJour", {e: "yoga", j}]], parle); };
    const premierJour = (m, j) => { for (let d = 1; d <= 7; d++) if (Dire.jourSemaine(ANNEE, m, d) === j) return d; return 1; };
    for (let j = 0; j < 7; j++) puce(jourMot(j), () => voirJour(j, true));
    for (let m = 0; m < 12; m++) puce(majus(moisMot(m)), () => { mo = m; $("vue").innerHTML = cadre(grille(m, 0, false), "d");
      lignes([["", "annivMois", {mo: m}], ["", "moisApres", {mo: (m + 1) % 12}], ["", "moisAvant", {mo: (m + 11) % 12}]], true); });
    regles(DE_APP ? ["amDe"] : EN_APP ? [GB ? "prepEnGb" : "prepEnUs"] : ["diasEs"]);
    voirJour(0, false); $("puces").firstChild.classList.add("choisi");
  };
  // LES DATES ET LES RENDEZ-VOUS : un mois ou l'on touche un jour (la date dite, la date ecrite, l'anniversaire), un agenda
  const dates = () => {
    onglet(2); $("puces").innerHTML = "";
    let mo = 4;
    const ecrite = (d, m) => DE_APP ? d + ". " + Dire.MOIS.de[m] : ES_APP ? d + " de " + Dire.MOIS.es[m] : V === "us" ? Dire.MOIS.en[m] + " " + d + " · " + Dire.MOIS.en[m] + " " + Dire.ordEnEcrit(d) : d + " " + Dire.MOIS.en[m] + " · " + Dire.ordEnEcrit(d) + " " + Dire.MOIS.en[m];
    const voirDate = (d, parle) => {
      $("vue").innerHTML = cadre(grille(mo, d, true), "d");
      $("vue").querySelectorAll("g[data-d]").forEach(g => g.addEventListener("click", () => voirDate(Number(g.dataset.d), true)));
      lignes([["", "date", {d, mo}], ["", "anniv", {d, mo}], ["", "jour", {j: Dire.jourSemaine(ANNEE, mo, d)}]], parle);
      $("lignes").insertAdjacentHTML("beforeend", ligneLibre(T("ecrit"), ecrite(d, mo)) + '<p class="consigne">' + T("touche") + '</p>');
    };
    for (let m = 0; m < 12; m++) puce(majus(moisMot(m)), () => { mo = m; voirDate(1, true); });
    // un agenda d'exemple, toujours le meme : le cours de yoga, le medecin, la fete
    const rdv = [{e: "yoga", j: 0, h: 9, m: 0, h2: 10, m2: 30, min: 90}, {e: "arzt", j: 3, h: 10, m: 0, h2: 10, m2: 30, min: 30}, {e: "party", j: 5, h: 20, m: 0, h2: 23, m2: 0, min: 180}];
    puce(ENONCES[ML].agenda, () => {
      $("vue").innerHTML = cadre(agenda(rdv), "d");
      lignes(rdv.map(x => ["", "agenda", x]).concat([["", "vonBis", rdv[0]], ["", "duree", rdv[0]], ["", "duree", rdv[1]]]), true);
    });
    regles(DE_APP ? ["datumDe", "umDe"] : EN_APP ? [GB ? "dateEnGb" : "dateEnUs"] : ["fechaEs", "serEs"]);
    voirDate(3, false);
  };
  $("o1").addEventListener("click", heure); $("o2").addEventListener("click", jours); $("o3").addEventListener("click", dates);
  heure();
  const s = $("suite"); s.textContent = T("commencer"); s.hidden = false;
  s.onclick = () => { s.onclick = null; taire(); demarrer(); };
}

// LA PARTIE (3 nov. 2026, « le tirage suit les mots ») : recopiee de meteo.html (visuel/THEMES-ILLUSTRES.md : ces
// fonctions sont identiques d'un theme a l'autre). Les dessins n'ont pas de src : leur cle est leur data-id.
const NEUFS_MAX = Q.get("seance") === "1" ? 3 : 10;
let vus = Tirage.vus(), sorteCourante = null, derniereSorte = null;
function cleQuestion(){
  const z = $("zone"), en = z.querySelector(".enonce");
  // la meme question avec d'autres leurres n'en est pas une nouvelle : les choix n'entrent pas dans la cle
  return sorteCourante + "|" + (en ? en.textContent : "") + "|" + Array.from(z.querySelectorAll("[data-id]")).map(i => i.getAttribute("data-id")).sort().join(",");
}
function montrer(){
  taire();   // la phrase de la reponse d'avant ne passe jamais sur la question suivante (Jacques, 5 nov.)
  repondu = false; $("suite").hidden = true; $("bas").hidden = true;
  $("compte").textContent = (rang + 1) + " / " + file.length;
  $("barre").style.width = (rang / file.length * 100) + "%";
  const garde = dire; dire = () => {};
  const raz = so => { motQ = null; tradQ = null; choixQ = null; CHOIX = new Map(); sorteCourante = so; };
  const essai = (w, strict) => {
    const autres = melanger(SORTES.filter(x => x !== derniereSorte));
    for (const so of autres){
      for (let n = 0; n < 25; n++){
        raz(so);
        if (!EX[so](w)) break;
        if (!vus.has(cleQuestion())) return so;
      }
    }
    if (strict) return null;
    if (derniereSorte) for (let n = 0; n < 25; n++){
      raz(derniereSorte);
      if (!EX[derniereSorte](w)) break;
      if (!vus.has(cleQuestion())) return derniereSorte;
    }
    for (const so of autres.concat(derniereSorte ? [derniereSorte] : [])){
      raz(so);
      if (EX[so](w)) return so;
    }
    return null;
  };
  let fait = essai(file[rang], true);
  for (let j = rang + 1; !fait && j < file.length; j++){
    fait = essai(file[j], true);
    if (fait) [file[rang], file[j]] = [file[j], file[rang]];
  }
  if (!fait) fait = essai(file[rang], false);
  dire = garde;
  if (fait === "entendre"){ const e = $("ecoute"); if (e) e.click(); }
  vus.add(cleQuestion()); derniereSorte = fait;
  window.scrollTo(0, 0); document.body.scrollTop = 0;
}
function fin(){
  $("barre").style.width = "100%"; $("compte").textContent = file.length + " / " + file.length; $("suite").hidden = true;
  $("zone").innerHTML = Fin.bilan(LANGUE, bons, file.length, T("score", {b: bons, n: file.length}));
  basDePartie();
  $("terminer").addEventListener("click", () => parler("fini", {bons, faits: file.length}));
}
function toutRevu(prochaine){
  $("barre").style.width = "100%"; $("compte").textContent = ""; $("suite").hidden = true;
  const quand = Tirage.revu(prochaine, LANGUE);
  $("zone").innerHTML = Fin.revu(TIRAGE_TEXTES.revu[LANGUE] || TIRAGE_TEXTES.revu.fr, quand ? (TIRAGE_TEXTES.prochaine[LANGUE] || TIRAGE_TEXTES.prochaine.fr).replace("{d}", quand) : "");
  basDePartie();
  $("terminer").addEventListener("click", () => parler("fini", {bons: 0, faits: 0}));
}
const boutonEncore = () => Q.get("seance") === "1" ? "" : '<button type="button" class="second" id="encore">' + (TIRAGE_TEXTES.encore[LANGUE] || TIRAGE_TEXTES.encore.fr) + '</button>';
function basDePartie(){
  const b = $("bas"); b.innerHTML = boutonEncore() + '<button type="button" class="principal" id="terminer">' + T("terminer") + '</button>'; b.hidden = false;
  const e = $("encore"); if (e) e.addEventListener("click", () => { b.hidden = true; encoreDesQuestions(); });
}
async function encoreDesQuestions(){
  const mots = motsDuTheme();
  file = Tirage.supplement(mots, await Tirage.demander(mots), NB); rang = 0; bons = 0; vus = Tirage.vus(); derniereSorte = null;
  if (!file.length) return toutRevu(null);
  montrer();
}
async function demarrer(){
  const mots = motsDuTheme();
  const plan = Tirage.plan(mots, await Tirage.demander(mots), NB, NEUFS_MAX);
  file = plan.file; rang = 0; bons = 0; vus = Tirage.vus(); derniereSorte = null;
  if (!file.length) return toutRevu(plan.prochaine);
  montrer();
}
$("suite").addEventListener("click", () => { if (!file.length) return; rang++; if (rang >= file.length) fin(); else montrer(); });
$("retour").addEventListener("click", () => parler("fermer"));
$("retour").setAttribute("aria-label", T("retourAria"));
$("titre").textContent = T("titre");
document.title = T("titre");
fetch("heure/heure.json?v=1").then(r => r.json()).then(d => {
  D = d;
  if (Q.get("seance") === "1" && Q.get("decouvrir") !== "1") demarrer(); else decouvrir();
});
