<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Icône Mes épisodes</title>
<style>
:root{--encre:#1C2430; --ambre:#E8A23A; --papier:#F7F3EC; --carte:#fff; --bord:#e6dfd3; --doux:#576177;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--papier:#151a21; --carte:#1f252e; --bord:#2c333d; --doux:#a9b2c0; --encre-t:#F2F2F6;} }
body{margin:0; padding:16px; background:var(--papier); color:var(--encre-t, var(--encre)); font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
h1{font-size:22px; margin:0 0 4px;} p.sous{margin:0 0 16px; color:var(--doux); font-size:14px; line-height:1.45; max-width:720px;}
.grille{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px;}
.choix{background:var(--carte); border:1.5px solid var(--bord); border-radius:16px; padding:12px 14px; position:relative;}
.choix.actuel{border-color:var(--ambre);}
.lettre{position:absolute; top:10px; right:12px; font-weight:900; font-size:20px; color:var(--ambre);}
.nom{font-weight:800; font-size:13.5px; margin:0 26px 12px 0; line-height:1.3;}
.tuile{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:14px; background:rgba(255,255,255,.75);
    border:1px solid rgba(28,36,48,.08); margin-top:8px; font-weight:800; font-size:15px; color:var(--encre);}
.ic{position:relative; overflow:hidden; width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
.ic::after{content:""; position:absolute; top:2px; left:20%; width:60%; height:5px; border-radius:999px;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55) 50%, rgba(255,255,255,0)); filter:blur(.6px);}
.ic svg{width:22px; height:22px; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; position:relative;}
.ic.encre{background:linear-gradient(180deg, #34404f, #1C2430);
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16), inset 0 -8px 10px -8px rgba(0,0,0,.5), 0 4px 9px -4px rgba(12,16,22,.6);}
.ic.encre svg{stroke:#F0A23A;}
.ic.pale{background:linear-gradient(180deg, #fbe2b6, #f3c985);
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7), inset 0 -8px 10px -8px rgba(160,100,20,.45), 0 4px 9px -4px rgba(140,85,15,.5);}
.ic.pale svg{stroke:#3d2a0c;}
.ic .plein{fill:currentColor; stroke:none;}
.ic.encre .plein{fill:#F0A23A;} .ic.pale .plein{fill:#3d2a0c;}
.leg{font-size:12px; color:var(--doux); margin-top:6px;}
</style></head><body>
<h1>L'icône de « Mes épisodes » : choisis</h1>
<p class="sous">Six propositions, chacune sur fond encre (comme aujourd'hui, aux couleurs du logo) puis sur fond ambre pâle (comme les autres tuiles). <b>0</b> est le clap actuel, pour comparer. La ligne « Prochain dans… » sous le titre est déjà retirée.</p>
<div class="grille" id="grille"></div>
<script>
const ICONES = [
  ["0", "Actuel : le clap", '<rect x="3.5" y="10" width="17" height="10" rx="1.8"/><path d="M3.9 9.6 19.4 5.4l.9 3.3L4.8 12.9z"/><path d="M8.4 8.4l1.7 2.9M12.6 7.2l1.7 2.9M16.8 6l1.7 2.9"/>'],
  ["A", "Un écran et ▶ — « une vidéo à regarder »", '<rect x="3" y="4.5" width="18" height="12.5" rx="2"/><path d="M8.5 20.5h7"/><path class="plein" d="M10.4 8.1v5.3l4.4-2.65z"/>'],
  ["B", "Un téléphone debout et ▶ — nos épisodes sont verticaux", '<rect x="6.5" y="2.5" width="11" height="19" rx="2.6"/><path d="M10.6 18.6h2.8"/><path class="plein" d="M10.4 8.6v5.3l4.4-2.65z"/>'],
  ["C", "Une pellicule de cinéma", '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v18M16 3v18M4 7.5h4M4 12h4M4 16.5h4M16 7.5h4M16 12h4M16 16.5h4"/>'],
  ["D", "Un billet de cinéma — « on t'offre ta place »", '<path d="M3.5 7.5a1 1 0 0 1 1-1h15a1 1 0 0 1 1 1v2.6a1.9 1.9 0 0 0 0 3.8v2.6a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1v-2.6a1.9 1.9 0 0 0 0-3.8z"/><path d="M14.5 6.5v11" stroke-dasharray="1.6 2"/>'],
  ["E", "Une bulle de dialogue et ▶ — une histoire qui se parle", '<path d="M4.5 4.5h15a1.5 1.5 0 0 1 1.5 1.5v9.5a1.5 1.5 0 0 1-1.5 1.5H11l-4.5 3.5V17h-2A1.5 1.5 0 0 1 3 15.5V6a1.5 1.5 0 0 1 1.5-1.5z"/><path class="plein" d="M10.4 8v5.3l4.4-2.65z"/>'],
  ["F", "Deux personnages — Mark et Ana", '<circle cx="8.3" cy="8.2" r="3"/><circle cx="16.2" cy="9.2" r="2.6"/><path d="M2.8 20c.3-3.3 2.6-5.6 5.5-5.6s5.2 2.3 5.5 5.6"/><path d="M14 14.6c.7-.3 1.4-.4 2.2-.4 2.6 0 4.6 2 5 5.8"/>'],
];
const g = document.getElementById("grille");
ICONES.forEach(([code, nom, svg]) => {
  const d = document.createElement("div");
  d.className = "choix" + (code === "0" ? " actuel" : "");
  d.innerHTML = '<div class="lettre">' + code + '</div><div class="nom">' + nom + '</div>' +
    ["encre", "pale"].map(f => '<div class="tuile"><span class="ic ' + f + '"><svg viewBox="0 0 24 24">' + svg + '</svg></span>Mes épisodes</div>').join("") +
    '<div class="leg">en haut : fond encre · en bas : fond ambre pâle</div>';
  g.appendChild(d);
});
</script>
</body></html>
