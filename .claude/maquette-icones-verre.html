<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icônes en verre</title>
<style>
body{margin:0; background:#f6f1e8; font-family:"Nunito", system-ui, sans-serif; color:#1C2430; padding:16px;}
h1{font-size:18px; margin:0 0 4px;} p.intro{margin:0 0 16px; font-size:13px; color:#576177;}
.grille{display:grid; grid-template-columns:repeat(auto-fit, minmax(330px, 1fr)); gap:16px;}
.carte{background:#fffdf8; border:1.5px solid #e6dfd3; border-radius:18px; padding:14px;}
.carte h2{font-size:15px; margin:0 0 2px;} .carte small{display:block; font-size:12px; color:#576177; margin-bottom:12px;}
.tuiles{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;}
.tuile{background:#fffdf8; border:1.5px solid #ddd6ca; border-radius:16px; padding:12px 4px 10px; display:flex; flex-direction:column; align-items:center; gap:7px;
    font-weight:800; font-size:13px; box-shadow:0 4px 10px -8px rgba(28,36,48,.3);}
.ic{position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; border-radius:11px;}
.ic::after{content:""; position:absolute; top:2px; left:20%; width:60%; height:5px; border-radius:999px;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.95) 50%, rgba(255,255,255,0)); filter:blur(.6px);}
.ic svg{position:relative; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
/* A : plus grandes, verre clair contraste */
.A .ic{width:38px; height:38px; background:linear-gradient(180deg, #fff6e4, #f1dfbd);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.9), inset 0 1.5px 0 #fff, inset 0 -6px 9px -5px rgba(150,100,30,.4), 0 4px 8px -3px rgba(120,80,20,.45);}
.A .ic svg{width:22px; height:22px; stroke:#7a4f12; stroke-width:2.1;}
/* B : verre ambre, comme la pilule */
.B .ic{width:38px; height:38px; background:linear-gradient(180deg, rgba(240,170,60,.85), rgba(232,162,58,.78));
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6), inset 0 0 8px 2px rgba(255,255,255,.35), inset 0 -8px 10px -8px rgba(160,90,10,.5), 0 4px 9px -4px rgba(140,80,10,.55);}
.B .ic svg{width:22px; height:22px; stroke:#1C2430; stroke-width:2;}
/* C : verre vert, comme le check, icone blanche */
.C .ic{width:38px; height:38px; background:linear-gradient(180deg, rgba(40,122,76,.86), rgba(34,108,67,.82));
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5), inset 0 0 8px 2px rgba(255,255,255,.28), 0 4px 9px -4px rgba(8,60,35,.55);}
.C .ic svg{width:22px; height:22px; stroke:#fff; stroke-width:2.1;}
/* D : une couleur franche par tuile */
.D .ic{width:38px; height:38px; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55), inset 0 0 8px 2px rgba(255,255,255,.3), 0 4px 9px -4px rgba(28,36,48,.45);}
.D .ic svg{width:22px; height:22px; stroke:#fff; stroke-width:2.1;}
.D .t1 .ic{background:linear-gradient(180deg, #f0aa3c, #e0922a);}
.D .t2 .ic{background:linear-gradient(180deg, #4fb3a9, #3a9a90);}
.D .t3 .ic{background:linear-gradient(180deg, #8b6cd9, #7052c4);}
.D .t4 .ic{background:linear-gradient(180deg, #e2735f, #cf5b47);}
.D .t5 .ic{background:linear-gradient(180deg, #3a8f63, #2c7a52);}
.D .t6 .ic{background:linear-gradient(180deg, #5b8fd6, #4476c2);}
</style>
</head>
<body>
<h1>Les petites icônes : quatre façons de les faire ressortir</h1>
<p class="intro">Toutes en verre (liseré de lumière, reflet en haut), toutes un peu plus grandes qu'aujourd'hui (38 px au lieu de 30).</p>
<div class="grille" id="grille"></div>
<template id="modele">
  <div class="tuiles">
    <div class="tuile t1"><span class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="5" rx="1.5"/><path d="M5.5 10v8.5h13V10"/><path d="M10 13.5h4"/></svg></span>Mis de côté</div>
    <div class="tuile t2"><span class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></span>Par thème</div>
    <div class="tuile t3"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3.5 12.5 11 5h7.5v7.5L11 20z"/><circle cx="15" cy="9" r="1.4"/></svg></span>Noms</div>
    <div class="tuile t4"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 8l4 4-4 4M10 8l4 4-4 4M16 12h4"/></svg></span>Verbes</div>
    <div class="tuile t5"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6 18v-4M11 18v-8M16 18v-12"/></svg></span>Adjectifs</div>
    <div class="tuile t6"><span class="ic"><svg viewBox="0 0 24 24"><path d="M5 9.5h3l4-3.5v12l-4-3.5H5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></span>Prononciation</div>
  </div>
</template>
<script>
const V = [["A","Plus grandes, verre clair plus contrasté","La teinte d'aujourd'hui, mais l'icône plus grande et plus foncée, le relief plus marqué."],
           ["B","Verre ambré","Comme la pilule de la séance : toutes les icônes dans l'ambre du logo."],
           ["C","Verre vert","Comme le bouton ✓ et « Continuer » ; icône blanche."],
           ["D","Une couleur par tuile","Chaque tuile sa couleur franche, icône blanche : on les reconnaît d'un coup d'œil."]];
const g = document.getElementById("grille"), m = document.getElementById("modele");
V.forEach(([l, t, d]) => {
  const c = document.createElement("div"); c.className = "carte " + l;
  c.innerHTML = "<h2>" + l + " · " + t + "</h2><small>" + d + "</small>";
  c.appendChild(m.content.cloneNode(true)); g.appendChild(c);
});
</script>
</body>
</html>
