<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#FBF9F5}
svg{display:block}
text{font-family:'Bricolage Grotesque',sans-serif;}
.mot{font-size:62px;font-weight:700;fill:#1C2430;text-anchor:middle}
.titre{font-size:76px;font-weight:800;text-anchor:middle}
.q{font-size:40px;font-weight:700;fill:#3E4858;text-anchor:middle}
</style></head><body>
<svg width="1728" height="1152" viewBox="0 0 1728 1152" xmlns="http://www.w3.org/2000/svg">
  <rect width="1728" height="1152" fill="#FBF9F5"/>
  <!-- Les deux cercles : teintes a plat, les memes que dans l'app -->
  <circle cx="640" cy="615" r="485" fill="#5B3FA6" fill-opacity=".16"/>
  <circle cx="1088" cy="615" r="485" fill="#9A7400" fill-opacity=".18"/>
  <!-- Le recoupement : les prepositions a double cas, en ardoise comme dans l'app -->
  <clipPath id="a"><circle cx="640" cy="615" r="485"/></clipPath>
  <g clip-path="url(#a)">
    <circle cx="1088" cy="615" r="485" fill="#FBF9F5"/>
    <circle cx="1088" cy="615" r="485" fill="#4F5B6E" fill-opacity=".16"/>
  </g>
  <circle cx="640" cy="615" r="485" fill="none" stroke="#5B3FA6" stroke-width="7"/>
  <circle cx="1088" cy="615" r="485" fill="none" stroke="#9A7400" stroke-width="7"/>

  <text class="titre" x="560" y="98" fill="#5B3FA6">Akkusativ</text>
  <text class="titre" x="1170" y="98" fill="#7A5C00">Dativ</text>

  <g class="col">
    <text class="mot" x="420" y="438">bis</text>
    <text class="mot" x="420" y="520">durch</text>
    <text class="mot" x="420" y="602">für</text>
    <text class="mot" x="420" y="684">ohne</text>
    <text class="mot" x="420" y="766">gegen</text>
    <text class="mot" x="420" y="848">um</text>
  </g>
  <g>
    <text class="mot" x="864" y="312">in</text>
    <text class="mot" x="864" y="392">an</text>
    <text class="mot" x="864" y="472">auf</text>
    <text class="mot" x="864" y="552">neben</text>
    <text class="mot" x="864" y="632">hinter</text>
    <text class="mot" x="864" y="712">über</text>
    <text class="mot" x="864" y="792">unter</text>
    <text class="mot" x="864" y="872">zwischen</text>
    <text class="mot" x="864" y="952">vor</text>
  </g>
  <g>
    <text class="mot" x="1268" y="262">ab</text>
    <text class="mot" x="1268" y="340">außer</text>
    <text class="mot" x="1268" y="418">zu</text>
    <text class="mot" x="1268" y="496">nach</text>
    <text class="mot" x="1268" y="574">bei</text>
    <text class="mot" x="1268" y="652">von</text>
    <text class="mot" x="1268" y="730">aus</text>
    <text class="mot" x="1268" y="808">mit</text>
    <text class="mot" x="1268" y="886">seit</text>
    <text class="mot" x="1246" y="962" style="font-size:56px">gegenüber</text>
  </g>

  <!-- wohin ? : vers l'accusatif, un mouvement (l'avion) -->
  <g stroke="#5B3FA6" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M690 540 H640 M660 522 L640 540 L660 558"/>
  </g>
  <text class="q" x="676" y="628" style="fill:#5B3FA6">wohin?</text>
  <g transform="translate(650,678) scale(2.1)" fill="none" stroke="#5B3FA6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>
  </g>
  <!-- wo ? : vers le datif, un lieu (l'epingle) -->
  <g stroke="#7A5C00" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1036 540 H1086 M1066 522 L1086 540 L1066 558"/>
  </g>
  <text class="q" x="1058" y="628" style="fill:#7A5C00">wo?</text>
  <g transform="translate(1034,680) scale(2)" fill="none" stroke="#7A5C00" stroke-width="2.2" stroke-linejoin="round">
    <path d="M12 22 C12 22 4 14.5 4 9.5 A8 8 0 0 1 20 9.5 C20 14.5 12 22 12 22 Z"/>
    <circle cx="12" cy="9.5" r="2.8"/>
  </g>
</svg>
</body></html>
